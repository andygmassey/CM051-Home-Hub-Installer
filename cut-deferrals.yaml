deferrals:
  - ref: daemon:fix/vault-state-default-status-none
    reason: >-
      The ONLY RED in check-orphans for v1.0.33. It is a real fix with a real test (1da772e5
      vault-state degraded to status '' not 'none' on every failure path, plus 60516bdd asserting
      the general invariant rather than three instances of it), it is ahead 2 / behind 0 against
      oa main, and it would merge clean. It is deferred anyway, and the reason is mechanical
      rather than editorial. MEASURED: oa main HEAD is 5b7efb00a541, which IS the daemon commit
      this cut pins in cuts/v1.0.33/cut.env, which is exactly why the freshness gate currently
      reports 'daemon (0.4.58) 5b7efb00 5b7efb00 FRESH'. verify_cut_freshness.sh compares the
      pinned daemon against LIVE ostler-ai/ostler-assistant HEAD (the RED arm is at :746), so
      merging these two commits moves that HEAD to 60516bdd and converts a FRESH row into RED
      STALE:+2 the instant it lands. Clearing that would then demand either a fresh signed and
      notarised daemon release cut for a gateway status-string fix, or a hold_ack asserting the
      fix is grafted when it is not. Both are worse than waiting. MERGE IT IMMEDIATELY AFTER THE
      v1.0.33 TAG IS PUSHED, alongside oa #312, which is held on this identical mechanism. This
      deferral expires at v1.0.33 by design: if a v1.0.34 is ever cut with this still unmerged,
      the gate must say so again rather than carry the hold silently forward.

      RENEWED 2026-08-17 FOR v1.0.34, AND THE GATE DID SAY SO AGAIN. The instruction above --
      "MERGE IT IMMEDIATELY AFTER THE v1.0.33 TAG IS PUSHED" -- was correct and was not
      executed, which is the same shape as the prose instruction that killed the v1.0.31 pin.
      It is renewed rather than carried silently, and renewed rather than merged, because the
      mechanical reason is UNCHANGED and was RE-MEASURED, not recalled: ostler-assistant
      origin/main HEAD is 5b7efb00a54131bf49cb659ea3e23fb325e83db7, and cuts/v1.0.34/cut.env
      pins DAEMON_COMMIT=5b7efb00a541, which is that HEAD abbreviated to 12 characters -- a
      PREFIX of the same commit, not a second value that happens to agree, and stated that way
      because an earlier draft called them "byte-identical", which they are not. Same commit,
      because v1.0.34 rebuilds no daemon.
      Merging ANY of these moves oa main HEAD off the pinned commit and flips the daemon
      freshness row from FRESH to RED STALE the instant it lands, which would then demand
      either a freshly signed and notarised daemon release for a gateway status-string fix, or
      a hold_ack asserting a graft that does not exist. Both remain worse than waiting.
      THE HONEST COST OF THIS DECISION: the vault-state fix has now missed two cuts, and the
      right sequencing is to merge all three the moment the v1.0.34 tag is pushed and let the
      NEXT daemon build carry them, rather than to renew a third time.
    until_cut: v1.0.34

  - ref: daemon:#312
    reason: >-
      THE SAME WORK AS THE ENTRY ABOVE, UNDER ITS OTHER REF SPELLING, AND THAT IS THE WHOLE
      POINT OF THIS ROW. MEASURED 2026-08-17 via the ostler-ai token: oa#312 is open, unmerged,
      and its head ref is fix/vault-state-default-status-none -- literally the branch deferred
      above. The orphan gate spells refs both ways, so deferring the branch name left the
      PR-number spelling of the identical work uncovered and reporting RED. A deferral that
      covers one spelling of a ref and not the other reads as a decision about one PR and is
      actually a gap, which is exactly the class of silent carry-forward the entry above exists
      to prevent. Same mechanical reason, same expiry, merge them together.
    until_cut: v1.0.34

  - ref: daemon:#313
    reason: >-
      DIFFERENT WORK, IDENTICAL MECHANISM, AND IT WAS NEVER DEFERRED AT ALL. MEASURED
      2026-08-17: oa#313 is open, unmerged, head ref fix/settings-preferences-ia, title
      "fix(web): a raw config.toml editor was in the customer sidebar under the friendliest
      name in the app" (quoted from the API, after an earlier draft of this row paraphrased
      it as "customer settings UI" while wearing quotation marks). It is not the vault-state fix and
      is not covered by the entry above, which names only #312. It is held here for the same
      single reason every daemon-side merge is held at this cut: ostler-assistant main HEAD IS
      the pinned DAEMON_COMMIT, so any merge to oa main makes the v1.0.34 daemon pin stale.
      This row is added so the hold is a recorded decision rather than an untracked RED that
      happens not to block because CI sets OSTLER_ORPHAN_GATE_SKIP to include `daemon`. A gate
      that is skipped is not a gate that passed, and the skip is why this needed writing down.
    until_cut: v1.0.34

  - ref: daemon:fix/settings-preferences-ia
    reason: >-
      THE SPELLING THE GATE ACTUALLY CONSULTS, AND I GOT THIS WRONG ONCE ALREADY IN THIS SAME
      FILE. I added daemon:#313 above, reasoned at length about ref-spelling twins while doing
      it, and then still deferred only the PR-number spelling. The v1.0.34 dry run answered
      immediately: [RED] daemon:fix/settings-preferences-ia. The orphan gate enumerates daemon
      refs by BRANCH NAME, so daemon:#313 is a row nothing asks about, and a deferral nothing
      asks about holds nothing -- which is exactly the defect CM051 #792 exists to surface.
      Same work, same mechanism, same expiry as the rows above: ostler-assistant origin/main
      HEAD IS the DAEMON_COMMIT pinned by cuts/v1.0.34/cut.env, so merging this moves oa main
      off the pin and flips the daemon freshness row from FRESH to RED STALE the moment it
      lands. Merge it with the other two immediately after the v1.0.34 tag is pushed.
    until_cut: v1.0.34

  - ref: CM051:#792
    reason: >-
      MEASURED 2026-08-17: open, not draft, mergeable=MERGEABLE, branch
      fix/deferrals-report-unconsulted-refs, "a deferral nothing asks about holds nothing --
      report unconsulted refs". It is a CUT-GATE OBSERVABILITY improvement and touches no
      customer-facing surface, so nothing a box-walk exercises rides on it. Deferred rather
      than merged because landing a change to the orphan gate's own reporting DURING a cut,
      on the day the cut is the blocker, is the risk the cut discipline exists to refuse: it
      would alter the instrument while the instrument is being read. THE UNCOMFORTABLE PART,
      recorded because it argues against this decision rather than for it: #792 would have
      caught the daemon ref-spelling gap directly above, which I instead found by reading a
      dry-run RED. That is a point in its favour, and it should land early in the v1.0.35
      window rather than drift -- it is not legacy backlog and must not decay into it.
    until_cut: v1.0.34

  - ref: CM051:fix/egress-probe-sees-every-process
    reason: >-
      MEASURED BY PATCH-ID, NOT BY THE GATE'S COUNT. The gate reported "4 commit(s) not in
      origin/main" after its own `gh pr list` call failed, and that fallback over-counts:
      git cherry marks f5dfcff as ALREADY IN MAIN (it shipped as PR #796, merged 07:41 today)
      and only THREE are genuinely absent -- 0b94c33, 0663889, 6cd7110. Deferred because all
      three change the INSTRUMENT, not the product. Measured file scope:
      scripts/box_walk_probes/probes/no_unexpected_egress.sh, scripts/box_walk_probes/
      egress_hosts.tsv and docs/EGRESS_INVENTORY.md, with install.sh touched ZERO times in
      all three. Nothing a customer runs changes. THE HONEST COST, stated because this is a
      security probe and understating it would be the wrong kind of quiet: the v1.0.34 walk
      runs the OLDER egress probe, which cannot attribute DERP relays from the live map and
      does not attribute contemporaneously. That makes the walk's egress finding LESS
      CONCLUSIVE. It does not make the product's egress worse, and the two must not be
      conflated when the walk is read. Merge these before the next cut so the instrument is
      ahead of the box it inspects.
    until_cut: v1.0.34

  - ref: CM051:#825
    reason: >-
      MEASURED 2026-08-17: open, mergeable=true, file scope exactly ONE file --
      scripts/provenance_gate.sh -- with install.sh touched zero times. Deferred on the
      identical reasoning to CM051:#792 above, applied consistently rather than selectively:
      it improves what a CUT GATE SAYS ABOUT ITSELF, and landing a change to a gate's own
      self-description during the cut that gate is adjudicating alters the instrument while
      the instrument is being read. It is also not mine to merge. NOT deferred because it is
      unimportant: a gate that misdescribes its own coverage is the exact failure class this
      cut spent the night chasing. The safe moment is immediately AFTER the v1.0.34 tag.
      Land it alongside #792 at the top of v1.0.35.
    until_cut: v1.0.34
