    reason: "Engine provenance and install-time disclosure. DEFERRED BECAUSE IT IS NOT A FIX: the four defects v1.0.43 exists for are all merged and nothing in the cut waits on it. It is RED on two counts, both located and both four lines -- install.sh.strings.en-GB.sh:1488 char 235 uses a spaced double hyphen where the em-dash rule requires a spaced en-dash, and tests/test_engine_provenance_never_claims_what_it_did_not_install.sh:232 and :266 pipe into grep -q under pipefail, which the SIGPIPE ratchet correctly refuses. AND IT CARRIES TWO SUBSTANTIVE REVIEW FINDINGS THAT SHOULD NOT BE FIXED AT SPEED. First, the before_seen guard checks a snapshot EXISTENCE and not its VALIDITY, so a zero-byte or truncated .engine-before makes the module claim it installed EVERY engine on the box; reachable because the redirect truncates before it writes, which is exactly what a jetsam-killed installer produces, and that is what happened on 2026-08-23. Second, owner=customer is emitted alongside installed_by_ostler=[colima] whenever both hold, so the two fields contradict each other. Shipping the module with either open would put a wrong provenance claim in front of a customer, which is worse than shipping no claim."
