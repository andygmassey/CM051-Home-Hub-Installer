# CM051 walk #27: every music service is scored on one scale from plays and
# recency; no service is down-weighted by its name or its export shape.
# Drives the shipped CM019 filters.py on synthetic preferences.
name: music-scoring-one-scale

on:
  push:
    branches: [main]
    paths:
      - 'vendor/cm019_preferences/services/ingest/src/filters.py'
      - 'tests/test_music_services_score_on_one_scale.py'
      - '.github/workflows/music-scoring-one-scale.yml'
  pull_request:
    paths:
      - 'vendor/cm019_preferences/services/ingest/src/filters.py'
      - 'tests/test_music_services_score_on_one_scale.py'
      - '.github/workflows/music-scoring-one-scale.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  music-scoring-one-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest and the vendored CM019 ingest dependencies
        run: python -m pip install --quiet pytest -r vendor/cm019_preferences/requirements.txt
      - name: Same plays and recency give the same strength on every service
        run: |
          n="$(python -m pytest tests/test_music_services_score_on_one_scale.py \
                 --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 17 ]; then
            echo "REFUSING: expected at least 17 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python -m pytest tests/test_music_services_score_on_one_scale.py -v -rs
