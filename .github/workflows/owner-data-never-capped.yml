# CM051 #28: the owner's whole library is stored for every source. Drives the
# shipped CM019 pipeline through the real SpotifyParser on a synthetic
# 12,000-track history, with recording fake stores.
name: owner-data-never-capped

on:
  push:
    branches: [main]
    paths:
      - 'vendor/cm019_preferences/services/ingest/src/filters.py'
      - 'vendor/cm019_preferences/services/ingest/src/pipeline.py'
      - 'tests/test_owner_data_is_never_capped_at_storage.py'
      - 'tests/test_pref_noise_source_cap.py'
      - 'vendor/ostler_fda/apple_music.py'
      - '.github/workflows/owner-data-never-capped.yml'
  pull_request:
    paths:
      - 'vendor/cm019_preferences/services/ingest/src/filters.py'
      - 'vendor/cm019_preferences/services/ingest/src/pipeline.py'
      - 'tests/test_owner_data_is_never_capped_at_storage.py'
      - 'tests/test_pref_noise_source_cap.py'
      - 'vendor/ostler_fda/apple_music.py'
      - '.github/workflows/owner-data-never-capped.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  owner-data-never-capped:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest and the vendored CM019 ingest dependencies
        run: python -m pip install --quiet pytest -r vendor/cm019_preferences/requirements.txt
      - name: A 12,000-item source stores 12,000, most-played first
        run: |
          n="$(python -m pytest tests/test_owner_data_is_never_capped_at_storage.py \
                 --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 9 ]; then
            echo "REFUSING: expected at least 9 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python -m pytest tests/test_owner_data_is_never_capped_at_storage.py -v -rs
