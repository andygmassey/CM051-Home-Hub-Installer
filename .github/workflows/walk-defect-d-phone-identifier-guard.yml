# CM051 walk-defect D (v1.0.107): a non-phone value (WhatsApp-LID/internal-id
# shape) must never reach identifierType "phone" at any of contact_syncer's
# phone-writing sites, in the copy that actually ships (vendor/cm041).
# Mirrors CM041 PR #186's own test suite against the vendored tree.
name: walk-defect-d-phone-identifier-guard

on:
  push:
    branches: [main]
    paths:
      - 'vendor/cm041/contact_syncer/syncer.py'
      - 'vendor/cm041/identity_resolver/normalise.py'
      - 'tests/test_vendored_syncer_refuses_a_non_phone_value_as_a_phone_identifier.py'
      - '.github/workflows/walk-defect-d-phone-identifier-guard.yml'
  pull_request:
    paths:
      - 'vendor/cm041/contact_syncer/syncer.py'
      - 'vendor/cm041/identity_resolver/normalise.py'
      - 'tests/test_vendored_syncer_refuses_a_non_phone_value_as_a_phone_identifier.py'
      - '.github/workflows/walk-defect-d-phone-identifier-guard.yml'

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  walk-defect-d-phone-identifier-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Same dependency list as kinship-label-write-guard.yml, which imports
      # this exact vendored tree: httpx (identity_resolver.resolver), rapidfuzz
      # + phonenumbers (normalise.py, module scope), vobject (syncer.py ->
      # vcard_parser.py), qdrant-client (syncer.py, module scope). Verified
      # together in a clean venv with none of this repo's other test
      # dependencies present, so this list is not missing a further one.
      - name: Install pytest and the vendored modules' runtime dependencies
        run: python -m pip install --quiet pytest httpx rapidfuzz phonenumbers vobject qdrant-client
      # ANTI-VACUITY AND THE RUN ARE ONE STEP ON PURPOSE: a failing floor in a
      # separate step would SKIP the run below and hide the real result
      # behind an earlier red.
      - name: A non-phone value never reaches identifierType "phone"
        run: |
          n="$(python -m pytest tests/test_vendored_syncer_refuses_a_non_phone_value_as_a_phone_identifier.py \
                 --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 6 ]; then
            echo "REFUSING: expected at least 6 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python -m pytest tests/test_vendored_syncer_refuses_a_non_phone_value_as_a_phone_identifier.py -v
