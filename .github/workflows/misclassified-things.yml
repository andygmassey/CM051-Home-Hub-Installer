# Ostler #30 console walk, 2026-10-15: things misclassified. An organisation is
# not a person, a play is not a like, a recommendation is not a taste, and a
# paragraph is not a hunch. Drives the SHIPPED vendored code on synthetic input.
name: misclassified-things

on:
  push:
    branches: [main]
    paths:
      - 'vendor/ostler_fda/machine_senders.py'
      - 'vendor/ostler_fda/pwg_ingest.py'
      - 'vendor/cm019_preferences/services/ingest/src/**'
      - 'vendor/cm059_editor/compiler/**'
      - 'tests/test_org_senders_are_organisations.py'
      - 'tests/test_passive_plays_are_not_likes.py'
      - 'tests/test_linkedin_recommendations_are_not_preferences.py'
      - 'tests/test_hunch_card_never_shows_a_flagged_interest.py'
      - '.github/workflows/misclassified-things.yml'
  pull_request:
    paths:
      - 'vendor/ostler_fda/machine_senders.py'
      - 'vendor/ostler_fda/pwg_ingest.py'
      - 'vendor/cm019_preferences/services/ingest/src/**'
      - 'vendor/cm059_editor/compiler/**'
      - 'tests/test_org_senders_are_organisations.py'
      - 'tests/test_passive_plays_are_not_likes.py'
      - 'tests/test_linkedin_recommendations_are_not_preferences.py'
      - 'tests/test_hunch_card_never_shows_a_flagged_interest.py'
      - '.github/workflows/misclassified-things.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  misclassified-things:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest and the vendored CM019 ingest dependencies
        run: python -m pip install --quiet pytest -r vendor/cm019_preferences/requirements.txt
      - name: An organisation or service is written as an organisation, a person as a person
        run: python3 tests/test_org_senders_are_organisations.py
      - name: A play is Neutral, an explicit like is Like, a dislike is Dislike
        run: |
          n="$(python -m pytest tests/test_passive_plays_are_not_likes.py \
                 --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 5 ]; then
            echo "REFUSING: expected at least 5 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python -m pytest tests/test_passive_plays_are_not_likes.py -v -rs
      - name: A LinkedIn recommendation yields no preference
        run: python -m pytest tests/test_linkedin_recommendations_are_not_preferences.py -v -rs
      - name: The hunch card never offers a flagged interest
        run: python -m pytest tests/test_hunch_card_never_shows_a_flagged_interest.py -v -rs
