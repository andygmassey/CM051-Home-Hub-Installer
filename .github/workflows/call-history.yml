# Call history (phone + FaceTime) as a People-graph source: the vendored reader,
# the vendored ingest (against a real SPARQL engine), the catch-up walk, the
# Doctor Calls row, and the byte-identity pin on the reader's upstream twin.
# Collected-count floors so a quietly shrinking suite cannot pass. Python 3.11
# (the Hub's) for the compile check, 3.12 for the run.
name: call-history

on:
  push:
    branches: [main]
    paths:
      - 'vendor/ostler_fda/call_history.py'
      - 'vendor/ostler_fda/catchup_calls.py'
      - 'vendor/ostler_fda/pwg_ingest.py'
      - 'vendor/ostler_fda/extract_all.py'
      - 'vendor/doctor/agent/web_ui.py'
      - 'lib/ostler_catchup.py'
      - 'install.sh'
      - 'tests/test_call_history_vendored.py'
      - 'tests/test_catchup_calls.py'
      - 'tests/test_the_source_table_covers_the_fda_extract_family.sh'
      - '.github/workflows/call-history.yml'
  pull_request:
    paths:
      - 'vendor/ostler_fda/call_history.py'
      - 'vendor/ostler_fda/catchup_calls.py'
      - 'vendor/ostler_fda/pwg_ingest.py'
      - 'vendor/ostler_fda/extract_all.py'
      - 'vendor/doctor/agent/web_ui.py'
      - 'lib/ostler_catchup.py'
      - 'install.sh'
      - 'tests/test_call_history_vendored.py'
      - 'tests/test_catchup_calls.py'
      - 'tests/test_the_source_table_covers_the_fda_extract_family.sh'
      - '.github/workflows/call-history.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  call-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --quiet pytest rdflib "httpx>=0.27" "nameparser>=2.1.0,<3.0" "phonenumbers>=8.13.0"
      - name: The new modules compile under the shipped 3.11
        run: |
          set -eu
          python -m pip install --quiet uv >/dev/null 2>&1 || true
          if command -v python3.11 >/dev/null 2>&1; then
            python3.11 -m py_compile vendor/ostler_fda/call_history.py vendor/ostler_fda/catchup_calls.py vendor/ostler_fda/pwg_ingest.py vendor/ostler_fda/extract_all.py
          else
            echo "python3.11 absent on this runner: py_compile under 3.12 only" >&2
            python -m py_compile vendor/ostler_fda/call_history.py vendor/ostler_fda/catchup_calls.py
          fi
      - name: Reader, ingest, extract_all arm, and the twin pin
        run: |
          set -eu
          check() {
            n="$(python -m pytest "$1" --collect-only -q | grep -cE '::test_')" || n=0
            echo "$1: collected ${n} test(s)"
            if [ "${n:-0}" -lt "$2" ]; then
              echo "REFUSING: expected at least $2 collected tests in $1, got ${n:-0}." >&2
              exit 1
            fi
          }
          check tests/test_call_history_vendored.py 31
          check tests/test_catchup_calls.py 11
          python -m pytest tests/test_call_history_vendored.py tests/test_catchup_calls.py -v -rs
      - name: The Doctor Calls row (real recorders, real renderer)
        run: bash tests/test_the_source_table_covers_the_fda_extract_family.sh
