name: cut-gate-wrappers

# Guards the cut-gate WRAPPERS -- the code that sits between a gate script and
# the operator and decides what to say about its exit code. Two files hold
# wrappers of that shape: the recipes in gui/Makefile, and run() in
# scripts/run_all_cut_gates.sh. Both are in scope here; the title says
# "wrappers", not "Makefile", for that reason.
#
# The gate scripts have their own suites. Nothing tested the wrappers, and the
# wrappers were where the reporting broke: `script || { echo "ERROR: <specific
# defect>"; exit 1; }` collapses a could-not-run into an accusation. Two were
# live misreports -- verify_no_orphaned_fixes.sh exits 3 "no repo checkouts
# resolved" and the wrapper announced orphaned work; verify_pr_age.sh exits 3
# when no repo yields a PR listing (an expired gh token does this) and the
# wrapper announced overdue PRs. Both send the operator hunting a defect that
# was never detected while the real fault -- the gate is blind -- goes unsaid.
#
# A separate workflow rather than a step appended to cut-freshness: GitHub
# stops a job at its first failing step, so bolting this on would mean a
# freshness failure silently skips the wrapper proofs. Different question,
# different job.
#
# Registering it here means the wrappers cannot rot back: any change to
# gui/Makefile, to a gate script, or to the test itself re-runs the proofs.

on:
  pull_request:
    paths:
      - 'gui/Makefile'
      - 'tests/test_cut_gate_wrappers.sh'
      - 'scripts/verify_cut_provenance.sh'
      - 'scripts/verify_no_orphaned_fixes.sh'
      - 'scripts/verify_pr_age.sh'
      - 'tests/test_pr_age_gate_declares_partial_runs.sh'
      - 'scripts/provenance_gate.sh'
      - 'scripts/verify_stapling.sh'
      - 'scripts/verify_commit_parity.sh'
      - 'gui/scripts/sign-python-bundle.sh'
      - 'gui/scripts/seed-hub-payload-pyc.sh'
      - 'tests/test_hub_payload_seed_refuses_a_wrong_interpreter.sh'
      # Watched as well as run -- same rule as the marker manifest below. The
      # defect surface (gui/Makefile, the seeder) and both instruments have to
      # share a trigger, or editing one of these tests would never re-run it.
      - 'tests/test_pyc_seed_excludes_nested_ostler_app.sh'
      - 'tests/test_pyc_bytes_depend_on_compile_path.sh'
      - 'tests/test_sign_python_bundle_reports_why.sh'
      - 'tests/test_product_seed_regex_does_not_exclude_the_bundle.sh'
      - 'tests/test_provenance_gate_cannot_run_is_not_stale.sh'
      - 'tests/test_provenance_gate_marker_read_is_not_piped.sh'
      - 'scripts/walk_dmg.sh'
      - 'tests/test_arm8b_vetoes_on_importable_not_merely_uncovered.sh'
      - 'tests/test_walk_arms_distinguish_cannot_run_from_fail.sh'
      - 'tests/test_manifest_gate_cannot_run_is_not_a_missing_fix.sh'
      # The marker arms are three-state (0 found / 1 not found / 2 could not
      # look). The test is watched as well as run: a run: without a matching
      # path entry is a gate you have read, not a gate you have run.
      - 'tests/test_marker_grep_is_three_state.sh'
      # The manifest itself is a trigger. It was not one before, so a PR could
      # add a row, or edit a #84 LOCK pattern, and no marker test would run on
      # it: the defect surface and the instrument have to share a trigger.
      - 'scripts/cut_markers.manifest'
      - 'tests/test_every_marker_pattern_compiles.sh'
      - 'tests/test_no_gate_execs_a_pinned_image.sh'
      - 'scripts/lib_image_extract.sh'
      - 'scripts/provenance_gate.sh'
      - 'tests/test_pinned_wiki_image_has_design_system.sh'
      - 'scripts/verify_cut_provenance.sh'
      - 'tests/test_wiki_provenance_extracts_without_exec.sh'
      # The gate this workflow RUNS at the wiki-content step, which it did not
      # WATCH. That is the one shape invoked-tests-are-watched exists to refuse:
      # a run: step with no matching path entry is a gate you have read, not a
      # gate you have run -- editing the test would never have re-run it here.
      - 'tests/test_wiki_content_gate_is_invoked_and_cannot_run_is_not_pass.sh'
      # THE SECOND WRAPPER FILE. run() in run_all_cut_gates.sh reports on every
      # gate's exit code and, until 2026-08-26, discarded the stderr it had
      # already captured whenever rc==0. verify_must_contain.sh used `declare
      # -A`, a bash 4 builtin; under /bin/bash 3.2.57 it printed "line 68: what:
      # unbound variable" and EXITED 0, and run() reported "PASS MUST_CONTAIN
      # BOM  every promised capability landed" for a BOM it had never parsed.
      # Both the wrapper and its test are triggers: the defect surface and the
      # instrument have to share one, same rule as the marker manifest above.
      - 'scripts/run_all_cut_gates.sh'
      - 'tests/test_a_gate_that_exits_zero_after_dying_is_not_a_pass.sh'
      - 'scripts/cut_hygiene_gate.sh'
      - 'tests/test_mergeable_unknown_is_not_clean.sh'
      # Without this line the step that runs it below is DARK ON SELF-EDIT:
      # the workflow invokes the test, but a PR that only changes the test
      # never triggers the workflow, so the change ships unrun. Caught by
      # verify_invoked_tests_are_watched.py on this very PR -- a run: step
      # with no matching path entry is a gate you have read, not one you
      # have run.
      - 'tests/test_exemption_ref_form.sh'
      - 'cut-deferrals.yaml'
      - '.github/workflows/cut-gate-wrappers.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  cut-gate-wrappers:
    runs-on: macos-latest   # the cut host is macOS; bash 3.2 quoting differs
    steps:
      # fetch-depth: 0 is LOAD-BEARING for the PR-age partial-verdict proof.
      #
      # Its control 5 is a DEMONSTRATED RED: it materialises the PRE-FIX gate
      # from `git show origin/main:scripts/verify_pr_age.sh` and requires that
      # older script to report a 2-of-3-blind run with no partiality marker.
      # A shallow clone has no origin/main to show, so the control reports
      # CANNOT-RUN (rc=2) -- honest, and useless.
      #
      # Measured on run 32328839671: "7 passed, 0 failed, 1 cannot-run",
      # exit 2. The suite refused to claim a pass it had not earned, which is
      # the behaviour we want and also the reason this line has to exist.
      # Same fix, same reason, as new-tests-must-be-wired.yml.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure origin/main is present for the pre-fix comparison
        run: git fetch origin main --quiet || true

      - name: Wrapper trichotomy self-test (stubbed gate scripts)
        run: /bin/bash tests/test_cut_gate_wrappers.sh

      # THE OTHER WRAPPER. run() must not report a gate that died as a pass.
      #
      # /bin/bash DELIBERATELY, not `bash`. This is the shape the defect had:
      # verify_must_contain.sh was green under Homebrew bash 5 on a developer's
      # PATH and dead under /bin/bash 3.2.57, which is what the cut host and
      # every customer Mac actually run. Testing it under 5 would reproduce the
      # accident that hid it.
      #
      # The suite prefers the REAL pre-fix gate out of `git show
      # origin/main:scripts/verify_must_contain.sh` as its specimen and falls
      # back to a synthetic one only where history is unavailable -- and once
      # this branch merges, origin/main carries the FIXED file, so the fallback
      # is the steady state. It PRINTS which specimen it used; a green here is
      # never silently the weaker claim.
      #
      # Exit 2 is CANNOT-RUN (the predicate was renamed or removed) and fails
      # this step, deliberately. A gate whose self-test can no longer find it
      # is not a gate that passed.
      - name: run() cannot report a gate that died as a pass
        if: always()
        run: /bin/bash tests/test_a_gate_that_exits_zero_after_dying_is_not_a_pass.sh

      - name: Test parses under /bin/bash 3.2 (the cut host's shell)
        if: always()
        run: |
          /bin/bash --version | head -1
          /bin/bash -n tests/test_cut_gate_wrappers.sh
          /bin/bash -n tests/test_pr_age_gate_declares_partial_runs.sh
          echo "OK: parses under the shell the cut actually uses"

      # THE WRAPPER IS HONEST ABOUT rc; THE GATE WAS NOT HONEST ABOUT SCOPE.
      #
      # The steps above prove verify_pr_age.sh's WRAPPER distinguishes
      # cannot-run from fail. That says nothing about whether the gate looked
      # at the estate it claims to police. It did not: on a hosted runner
      # GH_TOKEN is the repo-scoped secrets.GITHUB_TOKEN, every sibling repo's
      # `gh pr list` fails, and one reachable repo is enough to exit 0.
      #
      # Measured 2026-08-20, one tree, one hour:
      #     7 repos reachable -> 17 over 48h, rc=1
      #     CM051 only        ->  0 over 48h, rc=0
      #
      # if: always() because this is not the first step -- a failure above must
      # not skip it. A skipped check reads as no objection.
      - name: The PR-age gate declares the repos it could NOT check
        if: always()
        run: /bin/bash tests/test_pr_age_gate_declares_partial_runs.sh

      - name: Every wrapper still HAS a cannot-run branch
        if: always()
        run: |
          set -e
          # Structural backstop for the case the self-test cannot see: someone
          # deletes a whole target, so its controls never run and the suite is
          # green because it asked nothing.
          #
          # COUNT THE BRANCH, NOT THE SENTENCE. The first version of this step
          # grepped for the prose 'COULD NOT RUN (exit'. When check-freshness
          # was added as the seventh with slightly different wording -- "COULD
          # NOT RUN for at least one input (exit ...)" -- the count stayed at 6
          # and this guard was blind to the wrapper it was supposed to be
          # counting. It even made a REVERT look like it had applied when the
          # number did not move, which nearly turned a demonstrated red into a
          # meaningless one. Same trap as the cut-freshness.yml grep this PR
          # removes: a predicate tied to a rendering, not to the behaviour.
          #
          # The rc-2-or-3 test is the behaviour. Prose can be reworded freely.
          n=$(grep -c 'rc" -eq 2 \] || \[ "\$\$rc" -eq 3' gui/Makefile || true)
          if [ "$n" -ne 7 ]; then
            echo "expected 7 cannot-run branches in gui/Makefile, found $n" >&2
            echo "a wrapper has lost its exit-2/3 branch, or one was added without a test" >&2
            exit 1
          fi
          echo "OK: 7 cannot-run branches present"

      # sign-python-bundle used to swallow codesign's stderr, so run
      # 31692208160 could say WHICH files failed and never why. This drives the
      # script with a stubbed codesign through four modes and asserts the
      # reason reaches the log, that a real fault is not retried, and that a
      # persistent timestamp failure is bounded and still fails closed.
      - name: sign-python-bundle reports WHY it failed
        if: always()
        run: bash tests/test_sign_python_bundle_reports_why.sh

      # The seed's own exclusion regex swallowed the tree it was meant to seed.
      # compileall matches -x with rx.search(FULLNAME), so a bare `\.app/`
      # matched the OUTER bundle and compiled NOTHING at rc=0. It failed closed
      # -- the bundle audit refuses to sign -- but the cut stops with an error
      # describing the symptom in a different compartment from the cause.
      # This reads the regex OUT of the script, so it cannot drift.
      - name: the product seed actually seeds the product tree
        if: always()
        run: bash tests/test_product_seed_regex_does_not_exclude_the_bundle.sh
      # The tag check is the difference between a seed and a decoration: a .pyc
      # named cpython-314 is invisible to the 3.11 that ships, so it would be
      # regenerated INTO the seal while compileall, the file count and the exit
      # code all reported success. Shim tarballs, so this costs nothing in CI.
      - name: the hub payload seed refuses a wrong interpreter
        if: always()
        run: bash tests/test_hub_payload_seed_refuses_a_wrong_interpreter.sh

      # v1.0.49 attempt 4 (run 33142445217) died at arm 8 with
      # "codesign rc=1, file added=0, file modified=86" -- the seed rewrote
      # every .pyc inside the already-sealed nested Ostler.app. #1200 fixed it
      # and shipped two guards: the recipe PASSES an exclusion (structural) and
      # the pattern MATCHES at least one .py (in-build probe).
      #
      # Neither answers the question the cut failed on: after a real seeding
      # run, are the nested .pyc still the same BYTES? A pattern can be passed,
      # match files, and still match the wrong ones. The first test below runs
      # the real seeder over a build-shaped fixture and compares digests, with
      # a mutation arm that drops the argument and must go RED, a control
      # proving the outer tree was seeded in the same run, and an arm refusing
      # an over-broad pattern -- which would satisfy every other assertion
      # while seeding nothing at all.
      #
      # The second pins the REASON. `compileall` embeds the absolute source
      # path as co_filename, which is why the same interpreter over the same
      # bytes at two paths emits two different .pyc. Without it the next reader
      # takes the interpreter caveat at face value, pins the interpreter,
      # measures no difference, and deletes the exclusion.
      - name: the pyc seed leaves the sealed nested Ostler.app byte-identical
        if: always()
        run: bash tests/test_pyc_seed_excludes_nested_ostler_app.sh
      - name: pyc bytes depend on the compile path (the reason for the above)
        if: always()
        run: bash tests/test_pyc_bytes_depend_on_compile_path.sh

      # provenance_gate.sh accused three healthy CM044 wiki images of being
      # stale on run 31696154993, because `gh api` prints its error body to
      # stdout on a non-2xx and the old `[[ -z "$out" ]]` test therefore could
      # never see an auth failure. Every unauthorised lookup returned "not an
      # ancestor" and the gate printed a rebuild instruction for an artefact it
      # had never read.
      #
      # This drives the real gate with a stubbed gh and docker and asserts the
      # DECISION, not the wording: an unusable credential and an absent docker
      # are cannot-run, while a genuine non-ancestor and a genuinely missing
      # marker are still RED. The teeth cases pass against the pre-fix gate too,
      # which is what proves the fix narrowed nothing.
      - name: provenance gate -- cannot-run is never reported as stale
        if: always()
        run: bash tests/test_provenance_gate_cannot_run_is_not_stale.sh

      # A marker pattern that cannot RUN must never report the component absent.
      # The wiki_image_absent rows are the #84 LOCK rows; rc=2 used to print green.
      # A marker that IS present was reported STALE DAEMON SOURCE, because the
      # read was `git show | grep -q` under pipefail: grep exits on the first
      # match, git takes SIGPIPE, and pipefail turns the match into a non-zero
      # pipeline. Reproduced on a 679,963-byte daemon source file with the
      # marker on line 1. This test builds its own git repo and proves the
      # fixture races BEFORE asserting anything, so it cannot pass vacuously.
      - name: provenance marker read is not piped into grep -q
        if: always()
        run: /bin/bash tests/test_provenance_gate_marker_read_is_not_piped.sh

      # Arm 8b is a VETO arm, so over-approximating its hazard BLOCKS A GOOD
      # CUT. A .pyc is only written for a module that is IMPORTED; CPython
      # never caches bytecode for a __main__ script. This test proves the arm
      # forgives only what provably cannot write a .pyc, and mutates every
      # clause of that exemption -- diffing each mutation first, because a
      # mutation that did not apply is a broken apparatus, not a pass.
      - name: arm 8b vetoes on importable, not merely uncovered
        if: always()
        run: /bin/bash tests/test_arm8b_vetoes_on_importable_not_merely_uncovered.sh
      # Arms 1-4 of the box walk branched on an exit code alone with output to
      # /dev/null, so a walk whose attach failed printed FAIL rc=1 / not
      # stapled / none found: three confident wrong verdicts about a DMG that
      # was never measured. A false cut-blocker is this estate's expensive
      # failure. Runs on macos-latest, where codesign, xcrun and spctl exist.
      - name: walk arms say CANNOT-RUN when they could not measure
        if: always()
        run: /bin/bash tests/test_walk_arms_distinguish_cannot_run_from_fail.sh
      - name: CANNOT-RUN is not a missing fix (manifest gate + its caller)
        if: always()
        run: |
          # PyYAML must be present or arms A-C are VACUOUS: verify_cut_manifest.py
          # imports yaml at line ~34, BEFORE the PEP 604 annotations at 219+, so a
          # missing yaml exits 2 having never reached the thing arm A measures.
          /usr/bin/python3 -m pip install --user --quiet pyyaml 2>/dev/null || true
          python3 -m pip install --user --quiet pyyaml 2>/dev/null \
            || python3 -m pip install --break-system-packages --quiet pyyaml 2>/dev/null || true
          /bin/bash tests/test_manifest_gate_cannot_run_is_not_a_missing_fix.sh

      - name: A marker pattern that cannot run is CANNOT-RUN, not 'absent'
        if: always()
        run: /bin/bash tests/test_marker_grep_is_three_state.sh

      # Now that the arms run -E, a pattern that does not COMPILE reports
      # CANNOT-RUN, which is safe and silent: the row has stopped measuring and
      # nothing says so. -E also makes alternation natural to write, and this
      # pipe-delimited manifest cannot carry it -- `foo|bar` parses as pattern
      # `foo`. Both limbs print their denominator and carry a must-fail control.
      - name: every marker pattern compiles, and none is a truncated alternation
        if: always()
        run: /bin/bash tests/test_every_marker_pattern_compiles.sh

      # REPO-WIDE, and static, so it runs anywhere and needs no docker.
      # Two tags burned because the same exec-a-pinned-image bug lived in more
      # than one file: v1.0.27 on verify_cut_provenance.sh, then v1.0.28 on its
      # twin provenance_gate.sh, with three more sites in the design-system test
      # that neither incident looked at. Both times the right grep was run and
      # then scoped to one file while a verdict was reported about the repo.
      # This asks the whole tree every run and prints what it examined.
      - name: no gate execs a pinned image to read it (repo-wide)
        if: always()
        run: bash tests/test_no_gate_execs_a_pinned_image.sh

      # THE ONLY CHECK IN THE ESTATE THAT OPENS A WIKI IMAGE AND LOOKS INSIDE,
      # and until 2026-08-23 no workflow ran it. Its name appeared in the
      # `paths:` filter above -- a TRIGGER, not an invocation -- and
      # tests/TEST_WIRING.tsv scored that as WIRED. Measured on origin/main
      # 5faaf73: 201 WIRED rows naming a workflow, 160 genuinely invoked after
      # `jobs:`, and of the 41 that were not, 36 are Swift files swept up by
      # xcodebuild's whole-target run and 4 are invoked by dotted module path
      # (python3 -m unittest tests.x). This was the ONE real false label.
      #
      # --presence-only deliberately: the byte-identity half compares the image
      # against a CM044 working tree, and CM044 main legitimately moves ahead of
      # the pinned image between a merge and the next re-pin, so running that
      # half here would go red on a correct image. The presence assertions are
      # absolute. The byte half stays in run_all_cut_gates.sh at cut time.
      #
      # if: always() so a earlier failure cannot silently drop the one gate that
      # reads the shipped artefact.
      # Guards the step above, and the exit-code contract of the gate it runs.
      # Needs no docker and no network -- it asserts WIRING and CANNOT-RUN
      # behaviour, which is why it can block every PR while the gate it guards
      # cannot. Carries its own DEMONSTRATED RED against origin/main.
      - name: the wiki content gate is invoked, and cannot-run is not a pass
        if: always()
        run: bash tests/test_wiki_content_gate_is_invoked_and_cannot_run_is_not_pass.sh

      # NOTE: the wiki-provenance extraction test is NOT here. This job is
      # macos-latest, which has no docker, so the test skipped and the step went
      # green having examined nothing -- see the wiki-provenance-extract job
      # below, which runs it on ubuntu where docker exists and the defect lives.

      # MOVED HERE FROM THE macos-latest JOB, 2026-08-27.
      # --presence-only still needs docker -- the script's own guard is
      # `command -v docker || cannot_run "docker not available"`. macos-latest
      # has no docker, so the step returned exit 2 (CANNOT-RUN) on every run.
      # That was the gate being HONEST, not broken: it refused to claim a
      # verdict it could not reach, which is the whole point of the three-state
      # contract. But a gate that can only ever say CANNOT-RUN gates nothing.
      #
      # The comment eleven lines below the old location already stated the rule:
      # docker-needing checks belong on ubuntu. Measured on a Mac WITH docker,
      # the same command passes -- 431 rules found, both positive controls fire,
      # rc=0. The check is sound; only its host was wrong.

  # ---------------------------------------------------------------------------
  # The wiki provenance checks must READ the image, never EXECUTE it.
  #
  # v1.0.27 was burned by the exec form: the wiki images are arm64-ONLY by
  # design, cut.yml preflight is amd64, so `docker run` died with "exec format
  # error". wiki_image_grep called that a STALE WIKI IMAGE, and -- far worse --
  # wiki_image_absent called it PROOF THE PATTERN WAS GONE.
  #
  # UBUNTU ON PURPOSE, AND IT IS THE WHOLE POINT OF THE JOB. amd64 is the host
  # where the defect is reachable. It was first wired into the macos job above,
  # where docker does not exist at all: the test printed "SKIP: docker
  # unavailable" and the step reported success having examined nothing. That is
  # the same vacuous-green shape this test exists to kill, reproduced inside the
  # guard itself, so the skip is now a hard failure rather than a pass.
  # ---------------------------------------------------------------------------

      # #888. The gate tested only CONFLICTING/DIRTY, so an UNKNOWN
      # mergeability -- what GitHub returns for a window after ANY push, to the
      # PR or to its base -- fell through and the row PASSED. A human acting on
      # an UNKNOWN has a backstop: the merge API 405s a real conflict. A cut
      # gate has none; nothing downstream re-asks.
      - name: UNKNOWN mergeability is not clean (#888)
        # if: always() -- 17 test steps precede this one in the same job. Without
        # it a red anywhere above SKIPS this, and a skipped step reports as a
        # grey tick that reads like a pass. That is the #888 shape applied to
        # the guard for #888.
        if: always()
        run: bash tests/test_mergeable_unknown_is_not_clean.sh

  wiki-provenance-extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker must really be here -- a missing docker is a FAILURE, not a skip
        run: |
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || { echo "::error::docker is absent on a runner chosen BECAUSE it has docker"; exit 1; }
          docker info >/dev/null 2>&1 || { echo "::error::docker daemon unreachable"; exit 1; }
          docker --version

      - name: wiki provenance -- extract, never exec (and no vacuous absence)
        run: |
          # NOT set -e. The first version of this step was
          #     set -euo pipefail; out="$(bash <test> 2>&1)"; printf '%s' "$out"
          # and `set -e` aborted at the ASSIGNMENT the moment the test exited
          # non-zero, so the printf never ran and the log showed the step's own
          # source with no test output at all. A step that hides the output you
          # need to diagnose it is worse than one that simply fails.
          set -uo pipefail
          bash tests/test_wiki_provenance_extracts_without_exec.sh 2>&1 | tee /tmp/wpe.out
          rc=${PIPESTATUS[0]}
          echo "test exit code: ${rc}"
          # A PASS that examined nothing is the defect, not the proof. The test
          # keeps its SKIP arm so a developer without docker is not blocked; here
          # that arm must never be taken, so assert the denominator explicitly.
          if ! grep -q 'EXAMINED: 6 assertion(s)' /tmp/wpe.out; then
            echo "::error::the test did not examine its 6 assertions -- it skipped or narrowed, and a skip is not a pass"
            exit 1
          fi
          if [ "${rc}" -ne 0 ]; then
            echo "::error::the test examined its assertions and FAILED (rc=${rc}) -- see the arms above"
            exit 1
          fi

      - name: pr_exemptions refs are in a form their consumer can generate
        # if: always() -- like the step above, many test steps precede this one
        # in the same job, and without it a red anywhere earlier turns this into
        # a grey tick that reads as a pass. That is the #888 shape applied to
        # the guard for #839.
        if: always()
        run: |
          set -uo pipefail
          # SELF-TEST FIRST. A gate that cannot demonstrate a NO has a YES worth
          # nothing -- and this one's whole subject is a check that was silently
          # inert, so an inert guard for it would be a joke.
          bash tests/test_exemption_ref_form.sh --self-test
          bash tests/test_exemption_ref_form.sh

      # The presence half of the design-system gate. It lives HERE and not on
      # macos-latest because it needs docker; see the note above the job header.
      - name: pinned wiki images carry the design system (presence)
        if: always()
        run: bash tests/test_pinned_wiki_image_has_design_system.sh --presence-only
