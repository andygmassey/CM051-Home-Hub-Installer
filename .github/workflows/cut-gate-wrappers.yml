name: cut-gate-wrappers

# Guards the cut-gate WRAPPERS -- the code that sits between a gate script and
# the operator and decides what to say about its exit code. Two files hold
# wrappers of that shape: the recipes in gui/Makefile, and run() in
# scripts/run_all_cut_gates.sh. Both are in scope here; the title says
# "wrappers", not "Makefile", for that reason.
#
# The gate scripts have their own suites. Nothing tested the wrappers, and the
# wrappers were where the reporting broke: `script || { echo "ERROR: <specific
# defect>"; exit 1; }` collapses a could-not-run into an accusation. Two were
# live misreports -- verify_no_orphaned_fixes.sh exits 3 "no repo checkouts
# resolved" and the wrapper announced orphaned work; verify_pr_age.sh exits 3
# when no repo yields a PR listing (an expired gh token does this) and the
# wrapper announced overdue PRs. Both send the operator hunting a defect that
# was never detected while the real fault -- the gate is blind -- goes unsaid.
#
# A separate workflow rather than a step appended to cut-freshness: GitHub
# stops a job at its first failing step, so bolting this on would mean a
# freshness failure silently skips the wrapper proofs. Different question,
# different job.
#
# Registering it here means the wrappers cannot rot back: any change to
# gui/Makefile, to a gate script, or to the test itself re-runs the proofs.

on:
  pull_request:
    paths:
      - 'gui/Makefile'
      - 'tests/test_cut_gate_wrappers.sh'
      # Both the guard AND its subject. A `run:` step with no matching paths
      # entry is DARK ON SELF-EDIT: the workflow runs the test but is blind to
      # a change to it, so breaking the test does not re-trigger the test.
      # Caught by verify_invoked_tests_are_watched.py on this very PR.
      - 'scripts/new_cut.sh'
      - 'tests/test_new_cut_guard_scoped_is_not_started.sh'
      - 'tests/test_new_cut_checks_what_preflight_checks.sh'
      - 'tests/test_new_cut_covers_every_pretag_gate.sh'
      - 'scripts/verify_bom_rows_are_in_the_pin.sh'
      # Both the guard AND its subject, same rule as new_cut.sh above.
      - '.github/workflows/cut.yml'
      - 'tests/test_the_dispatch_relaxation_is_tied_to_no_publish.sh'
      # Wired 2026-09-09: a staging copy guarded on its DESTINATION leaves the
      # previous DMG's vendored code on any box that already has the tree, so a
      # v1.0.82 vendored fix never reaches the walk box that must demonstrate it.
      - 'tests/test_a_staging_copy_is_guarded_on_its_source.py'
      - 'tests/test_store_port_first_install_stale_store.sh'
      - 'install.sh'
      - '.github/workflows/cut.yml'
      # Wired 2026-09-19. The dispatch gate ran in ONE place: the `preflight`
      # job of cut.yml. Measured across the 154 workflow files in this repo,
      # 152 of which carry a pull_request trigger, NOT ONE names it, so its
      # first real execution was a tag push or a dispatch. #2118 then changed
      # the contract the gate enforces and nothing re-ran it, so the gate has
      # been RED against its own repo since 2026-09-17 and the next tag would
      # have died in preflight. Both halves listed, guard and subject, per the
      # self-edit note above.
      - 'scripts/verify_dispatch_cannot_ship.py'
      - 'tests/test_cut_dispatch_is_dry.sh'
      - 'scripts/push_cut_tag.sh'
      - 'tests/test_push_cut_tag_refuses_a_red_checklist.sh'
      - 'tests/test_rehearse_tag_is_the_tag_preflight.sh'
      # Wired 2026-09-19. Row 1519 asks whether the dry run is reachable at
      # all, and said the decisive proof was to FIRE a dispatch. Arm 3 answers
      # it structurally, for free, on every PR: it walks the dry-run job's
      # transitive `needs` closure and requires every job in it to admit a
      # dispatch. Recovered from a local-only branch the orphan gate found.
      - 'tests/test_the_dry_run_is_reachable_on_a_dispatch.py'
      - 'scripts/verify_cut_provenance.sh'
      - 'scripts/verify_no_orphaned_fixes.sh'
      - 'scripts/verify_pr_age.sh'
      # Wired 2026-09-06 (#1694). Three gate SELF-TESTS that ran nowhere:
      # scripts/tests/ sat outside verify_test_wiring.sh's glob, so they were
      # never reported UNWIRED -- they were unenumerable, which prints as
      # nothing and reads as a clean bill of health. Each proves its gate
      # FIRES, which is the one thing a gate cannot demonstrate by being green.
      - 'scripts/verify_commit_parity.sh'
      - 'scripts/tests/test_verify_commit_parity_gate.sh'
      - 'scripts/tests/test_verify_stapling_gate.sh'
      # Wired 2026-09-17 after cut run 35187827169 (tag v1.0.99) died at
      # `make: *** [staple-apps] Error 1`. gui/Makefile is already a path
      # above; this entry is the GUARD half, so editing the test re-runs it.
      - 'tests/test_a_bundle_name_with_a_space_survives_the_staple_loops.sh'
      - 'scripts/verify_no_env_trust_anchors.sh'
      - 'scripts/tests/test_no_env_trust_anchors.sh'
      - 'tests/test_pr_age_gate_declares_partial_runs.sh'
      - 'scripts/provenance_gate.sh'
      - 'scripts/verify_stapling.sh'
      - 'scripts/verify_commit_parity.sh'
      - 'gui/scripts/sign-python-bundle.sh'
      - 'gui/scripts/seed-hub-payload-pyc.sh'
      - 'tests/test_hub_payload_seed_refuses_a_wrong_interpreter.sh'
      # Watched as well as run -- same rule as the marker manifest below. The
      # defect surface (gui/Makefile, the seeder) and both instruments have to
      # share a trigger, or editing one of these tests would never re-run it.
      - 'tests/test_pyc_seed_excludes_nested_ostler_app.sh'
      - 'tests/test_pyc_bytes_depend_on_compile_path.sh'
      - 'tests/test_stage_payload_strips_ambient_pyc.sh'
      - 'gui/scripts/strip-payload-pyc.sh'
      - 'tests/test_sign_python_bundle_reports_why.sh'
      - 'tests/test_product_seed_regex_does_not_exclude_the_bundle.sh'
      - 'tests/test_provenance_gate_cannot_run_is_not_stale.sh'
      - 'tests/test_provenance_gate_marker_read_is_not_piped.sh'
      # The anti-vacuity floor and its subject. BOTH are triggers: a run: with
      # no matching paths: entry is dark on self-edit.
      - 'tests/test_provenance_gate_refuses_when_it_examined_nothing.sh'
      - 'scripts/walk_dmg.sh'
      - 'tests/test_arm8b_vetoes_on_importable_not_merely_uncovered.sh'
      - 'tests/test_walk_arms_distinguish_cannot_run_from_fail.sh'
      - 'tests/test_manifest_gate_cannot_run_is_not_a_missing_fix.sh'
      # The marker arms are three-state (0 found / 1 not found / 2 could not
      # look). The test is watched as well as run: a run: without a matching
      # path entry is a gate you have read, not a gate you have run.
      - 'tests/test_marker_grep_is_three_state.sh'
      # The manifest itself is a trigger. It was not one before, so a PR could
      # add a row, or edit a #84 LOCK pattern, and no marker test would run on
      # it: the defect surface and the instrument have to share a trigger.
      - 'scripts/cut_markers.manifest'
      - 'tests/test_every_marker_pattern_compiles.sh'
      - 'tests/test_no_gate_execs_a_pinned_image.sh'
      - 'scripts/lib_image_extract.sh'
      - 'scripts/provenance_gate.sh'
      - 'tests/test_pinned_wiki_image_has_design_system.sh'
      - 'scripts/verify_cut_provenance.sh'
      - 'tests/test_wiki_provenance_extracts_without_exec.sh'
      # The gate this workflow RUNS at the wiki-content step, which it did not
      # WATCH. That is the one shape invoked-tests-are-watched exists to refuse:
      # a run: step with no matching path entry is a gate you have read, not a
      # gate you have run -- editing the test would never have re-run it here.
      - 'tests/test_wiki_content_gate_is_invoked_and_cannot_run_is_not_pass.sh'
      # THE SECOND WRAPPER FILE. run() in run_all_cut_gates.sh reports on every
      # gate's exit code and, until 2026-08-26, discarded the stderr it had
      # already captured whenever rc==0. verify_must_contain.sh used `declare
      # -A`, a bash 4 builtin; under /bin/bash 3.2.57 it printed "line 68: what:
      # unbound variable" and EXITED 0, and run() reported "PASS MUST_CONTAIN
      # BOM  every promised capability landed" for a BOM it had never parsed.
      # Both the wrapper and its test are triggers: the defect surface and the
      # instrument have to share one, same rule as the marker manifest above.
      - 'scripts/run_all_cut_gates.sh'
      # Watched because the step below RUNS it (#1244). A run: without a
      # matching paths: entry is a gate you can edit freely and never trigger,
      # which is how a test rots while reporting green on every unrelated push.
      - 'tests/test_pinned_wiki_images_are_arm64_only.sh'
      - 'tests/test_a_gate_that_exits_zero_after_dying_is_not_a_pass.sh'
      # #1167. The run-at-commit gate, its wiring test, and the baseline both
      # of them read. All three are triggers: the gate is the defect surface,
      # the test is the instrument, and a `run:` with no matching paths entry
      # is dark on self-edit. cut.yml is already listed above, which is the
      # fourth surface this test reads.
      - 'scripts/verify_declared_gates_ran_at_commit.sh'
      - 'tests/test_the_run_at_commit_gate_is_wired_into_the_cut.sh'
      - 'scripts/cut_trigger_reachability_baseline.tsv'
      - 'scripts/cut_hygiene_gate.sh'
      - 'tests/test_mergeable_unknown_is_not_clean.sh'
      # Without this line the step that runs it below is DARK ON SELF-EDIT:
      # the workflow invokes the test, but a PR that only changes the test
      # never triggers the workflow, so the change ships unrun. Caught by
      # verify_invoked_tests_are_watched.py on this very PR -- a run: step
      # with no matching path entry is a gate you have read, not one you
      # have run.
      - 'tests/test_exemption_ref_form.sh'
      - 'cut-deferrals.yaml'
      # The operator's pre-tag rollforward runner and its test. BOTH are
      # triggers, by the rule three comments above: the runner is the defect
      # surface and the test is the instrument, and a run: with no matching
      # paths: entry is dark on self-edit.
      - 'bin/operator_rollforward.sh'
      - 'tests/test_the_operator_rollforward_refuses_a_blind_environment.sh'
      # THE ROLLFORWARD PIN AND EVERY FILE IT PINS.
      #
      # test_rollforward_registry_pin.sh lived ONLY in cut.yml, whose cutting
      # job is `if: github.event_name == 'push'` -- a TAG PUSH. So its first
      # chance to speak about any change was AFTER the tag that ships it.
      # Measured 2026-09-02: it was RED ON MAIN for a day and no PR could see
      # it. #1340 re-synced the vendored registry FILE at 10:53:45Z; #1336 had
      # last written cuts/REGISTRY_PIN at 09:47:43Z. Content half and pin half
      # landed on different PRs, an hour apart, each green.
      #
      # #1340 carried 35 checks and NONE matching roll/pin/vendor/cut. The
      # same query on a PR that does run the gate returns two, so that zero
      # was real rather than a broken predicate.
      #
      # All four pinned files are listed, not just the registry: editing the
      # vendored gate BODY must re-run the pin that binds it to OS003, or the
      # gate drifts from its source exactly as it did in #540 (239 diff lines
      # behind, missing the redactor). REGISTRY_PIN itself is listed because a
      # pin rewrite is the other half of the same change.
      #
      # test_rollforward_pin_is_watched_on_prs.sh DERIVES this list from the
      # pin rather than restating it, so a fifth pinned file cannot escape the
      # trigger by nobody remembering this comment.
      - 'cuts/REGISTRY_PIN'
      - 'cuts/DEFECTS_ROLLFORWARD.md'
      - 'bin/rollforward_gate.sh'
      - 'bin/lib_redact.sh'
      - 'bin/redact_selftest.sh'
      - 'tests/test_rollforward_registry_pin.sh'
      # THE TWO OS003 SYNC SCRIPTS AND THEIR GUARD. #1485: they defaulted to
      # DIFFERENT checkouts, so one reported a BOM missing that the other had
      # just read. Both subjects listed, not only the guard, or a change to a
      # default would not re-trigger the gate that pins them together.
      - 'scripts/sync_cut_bom.sh'
      - 'scripts/sync_rollforward_registry.sh'
      - 'tests/test_os003_sync_defaults_agree.sh'
      # THE OTHER THREE RESOLVERS THE GUARD NOW READS. It used to compare only
      # the two `:-` defaults above, so these could diverge in silence. It now
      # follows the declared pointer and reads the discovery lists, which means
      # a change to any of them can flip the verdict -- and an unwatched subject
      # is a gate that is dark on the very edit that breaks it.
      - 'scripts/verify_os003_pointer.sh'
      - 'scripts/box_walk_probes/lib/grounding_seed.sh'
      - 'scripts/box_walk_probes/lib/preference_seed.sh'
      # The pointer itself. The rule file is the value one resolver defaults to,
      # so editing the rule changes where that script looks.
      - 'CLAUDE.md'
      - 'tests/test_rollforward_pin_is_watched_on_prs.sh'
      - '.github/workflows/cut-gate-wrappers.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:

  wiki-provenance-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: docker must really be here -- a missing docker is a FAILURE, not a skip
        run: |
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || { echo "::error::docker is absent on a runner chosen BECAUSE it has docker"; exit 1; }
          docker info >/dev/null 2>&1 || { echo "::error::docker daemon unreachable"; exit 1; }
          docker --version

      - name: wiki provenance -- extract, never exec (and no vacuous absence)
        run: |
          # NOT set -e. The first version of this step was
          #     set -euo pipefail; out="$(bash <test> 2>&1)"; printf '%s' "$out"
          # and `set -e` aborted at the ASSIGNMENT the moment the test exited
          # non-zero, so the printf never ran and the log showed the step's own
          # source with no test output at all. A step that hides the output you
          # need to diagnose it is worse than one that simply fails.
          set -uo pipefail
          bash tests/test_wiki_provenance_extracts_without_exec.sh 2>&1 | tee /tmp/wpe.out
          rc=${PIPESTATUS[0]}
          echo "test exit code: ${rc}"
          # A PASS that examined nothing is the defect, not the proof. The test
          # keeps its SKIP arm so a developer without docker is not blocked; here
          # that arm must never be taken, so assert the denominator explicitly.
          if ! grep -q 'EXAMINED: 6 assertion(s)' /tmp/wpe.out; then
            echo "::error::the test did not examine its 6 assertions -- it skipped or narrowed, and a skip is not a pass"
            exit 1
          fi
          if [ "${rc}" -ne 0 ]; then
            echo "::error::the test examined its assertions and FAILED (rc=${rc}) -- see the arms above"
            exit 1
          fi

      - name: pr_exemptions refs are in a form their consumer can generate
        # if: always() -- like the step above, many test steps precede this one
        # in the same job, and without it a red anywhere earlier turns this into
        # a grey tick that reads as a pass. That is the #888 shape applied to
        # the guard for #839.
        if: always()
        run: |
          set -uo pipefail
          # SELF-TEST FIRST. A gate that cannot demonstrate a NO has a YES worth
          # nothing -- and this one's whole subject is a check that was silently
          # inert, so an inert guard for it would be a joke.
          bash tests/test_exemption_ref_form.sh --self-test
          bash tests/test_exemption_ref_form.sh

      # The presence half of the design-system gate. It lives HERE and not on
      # macos-latest because it needs docker; see the note above the job header.
      - name: pinned wiki images carry the design system (presence)
        if: always()
        run: bash tests/test_pinned_wiki_image_has_design_system.sh --presence-only

      # A VENDORED TREE MUST BE RE-STAGED ON EVERY INSTALL.
      #
      # Measured on the v1.0.81 walk box: cm019_setup read "already set up" in
      # 0 s because its cp -R sat under [[ ! -x "$CM019_PY" ]], so the box kept
      # the previous DMG's code while the install reported success. Thirteen
      # other staging sites already guard on the SOURCE; this keeps that.
      - name: no staging copy is guarded on its destination
        if: always()
        run: python3 tests/test_a_staging_copy_is_guarded_on_its_source.py
