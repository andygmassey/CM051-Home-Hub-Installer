# V1 + V6: an ingest tick must not claim coverage it did not read.
name: status-honesty-ingest

on:
  push:
    branches: [main]
    paths:
      - 'vendor/ostler_fda/apple_mail_mbox.py'
      - 'vendor/whatsapp_source/**'
      - 'tests/test_apple_mail_refused_walk_is_not_complete.py'
      - '.github/workflows/status-honesty-ingest.yml'
  pull_request:
    paths:
      - 'vendor/ostler_fda/apple_mail_mbox.py'
      - 'vendor/whatsapp_source/**'
      - 'tests/test_apple_mail_refused_walk_is_not_complete.py'
      - '.github/workflows/status-honesty-ingest.yml'

jobs:
  ingest-honesty:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pytest pyyaml
      - name: A refused Apple Mail walk is not complete, and the clamp does not eat history
        run: |
          set -eu
          check() {
            n="$(python -m pytest "$1" --collect-only -q | grep -cE '::test_')" || n=0
            echo "$1: collected ${n} test(s)"
            [ "${n:-0}" -ge "$2" ] || { echo "REFUSING: expected at least $2 in $1, got ${n:-0}" >&2; exit 1; }
          }
          check tests/test_apple_mail_refused_walk_is_not_complete.py 3
          check vendor/whatsapp_source/tests/test_whatsapp_clamp_window.py 3
          python -m pytest tests/test_apple_mail_refused_walk_is_not_complete.py -v
          cd vendor/whatsapp_source/tests && python -m pytest test_whatsapp_clamp_window.py test_whatsapp_source.py -v
