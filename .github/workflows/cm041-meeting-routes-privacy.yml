# CM041 #240 (S23, 118 MUST) graft: person_enrichment and the person timeline
# withhold L3 meetings, serve the stricter of meeting and person level, and
# label privacy_level. The test drives both vendored handlers against a real
# in-memory graph; collected-count floor so a shrinking suite cannot pass.
name: cm041-meeting-routes-privacy

on:
  push:
    branches: [main]
    paths:
      - 'vendor/cm041/assistant_api/ical-server.py'
      - 'vendor/cm041/assistant_api/tests/test_meeting_routes_privacy.py'
      - 'vendor/cm041/assistant_api/tests/test_person_context_meetings_privacy.py'
      - '.github/workflows/cm041-meeting-routes-privacy.yml'
  pull_request:
    paths:
      - 'vendor/cm041/assistant_api/ical-server.py'
      - 'vendor/cm041/assistant_api/tests/test_meeting_routes_privacy.py'
      - 'vendor/cm041/assistant_api/tests/test_person_context_meetings_privacy.py'
      - '.github/workflows/cm041-meeting-routes-privacy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  meeting-routes-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --quiet pytest httpx rdflib pyoxigraph cryptography keyring phonenumbers rapidfuzz qdrant-client
      - name: Meeting routes withhold L3 and label privacy_level
        run: |
          n="$(PYTHONPATH=vendor python -m pytest vendor/cm041/assistant_api/tests/test_meeting_routes_privacy.py --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 8 ]; then
            echo "REFUSING: expected at least 8 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          cd vendor/cm041/assistant_api
          PYTHONPATH=../.. python -m pytest tests/test_meeting_routes_privacy.py tests/test_person_context_meetings_privacy.py -v
