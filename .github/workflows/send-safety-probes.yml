name: send-safety-probes

# The three BLOCKING send-safety walk probes (ostler-assistant #626 S4 and #627 C1):
#   stranger_cannot_trigger_send, tainted_owner_send_needs_exact_approval,
#   cron_run_makes_no_sends
#
# The probes themselves run on a walk box (run_box_walk.sh globs probes/, and
# cut-manifests/permanent.yaml re-drives each at the cut). What THIS workflow
# runs is the apparatus: a probe is believed only after it has gone red.
#
#   selftest   each probe's judge against a good capture, a 117-shaped capture,
#              one mutant per assertion and a blind (uniform-zero) control.
#   e2e        the real probe scripts, sandbox driver and judge against a
#              stand-in daemon: 117-shaped (all three RED, FAIL not CANNOT-RUN),
#              intended (all three PASS), one defect each. No real message: the
#              sandbox osascript is a recording shim.
#
# Exit 2 is CANNOT-RUN and fails the step.

on:
  pull_request:
    paths:
      - 'scripts/box_walk_probes/**'
      - 'scripts/walk_promote_scope.tsv'
      - 'cut-manifests/permanent.yaml'
      - 'tests/test_send_safety_probes.sh'
      - 'tests/fixtures/send_safety/**'
      - 'tests/test_every_probe_on_disk_is_collected.py'
      - '.github/workflows/send-safety-probes.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  send-safety-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Each probe's negative controls fire
        if: always()
        # The self-test EXITS 1 when it behaves (the probe contract turns a
        # behaving judge into its own expected FAIL), so capture under set +e.
        run: |
          for p in stranger_cannot_trigger_send tainted_owner_send_needs_exact_approval cron_run_makes_no_sends; do
            set +e
            out=$(bash scripts/box_walk_probes/probes/$p.sh --self-test 2>&1); rc=$?
            set -e
            printf '%s\n' "$out" | tail -3
            [ "$rc" -eq 1 ] && grep -q '^VERDICT: FAIL -- negative control behaved' <<< "$out" || { echo "::error::$p self-test did not behave"; exit 1; }
          done
      - name: The three probes go RED on a 117-shaped daemon, PASS on the intended one, and only the defective one goes red on a single defect
        if: always()
        run: bash tests/test_send_safety_probes.sh
      - name: Every probe on disk is collected by the runner
        if: always()
        run: python3 tests/test_every_probe_on_disk_is_collected.py
