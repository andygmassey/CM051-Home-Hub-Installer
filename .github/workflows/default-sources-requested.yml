# Two of nine FDA extractors were dark for the life of the product because no
# install preset ever listed them, and the hydrate step's honest `no_data`
# marker made it look like the customer simply had no Notes. See #681 and
# tests/test_every_default_source_is_requested.sh.
#
# The second step was added 2026-09-23 with the apple_notes fix. The first
# step reads the preset assignment LINES; it cannot see the Customise branch
# at all, and it cannot tell a live assignment from a dead `:-` default inside
# a heredoc. The second EXECUTES the real picker region and asserts on what
# OSTLER_FDA_SOURCES actually becomes, so "a preset offers it but the picker
# does not" is caught on the PR that creates it.
name: default-sources-requested

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'vendor/ostler_fda/extract_all.py'
      - 'tests/fda_dark_sources_baseline.tsv'
      - 'tests/test_every_default_source_is_requested.sh'
      - 'tests/test_the_picker_offers_every_preset_source.sh'
      - '.github/workflows/default-sources-requested.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'vendor/ostler_fda/extract_all.py'
      - 'tests/fda_dark_sources_baseline.tsv'
      - 'tests/test_every_default_source_is_requested.sh'
      - 'tests/test_the_picker_offers_every_preset_source.sh'
      - '.github/workflows/default-sources-requested.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: /bin/bash --version | head -1
      - name: Every default FDA source must be requested by a preset
        if: always()
        run: /bin/bash tests/test_every_default_source_is_requested.sh
      # `if: always()` on both: GitHub stops a job at its first failing step,
      # and a skipped proof renders as grey, which reads like a pass. Two
      # different invariants, so both verdicts have to report on every run.
      - name: Every preset source must also be tickable in Customise
        if: always()
        run: /bin/bash tests/test_the_picker_offers_every_preset_source.sh
