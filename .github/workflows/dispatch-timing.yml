# v1018-D021. A throughput floor cannot be defended while the feed
# discards its own instrumentation. capture_output=True drops pwg-convo's
# stderr on rc=0, so a successful dispatch left no per-document timing at
# all and the only signal was the gap between "Dispatching" lines -- which
# folds queueing and lock waits into the document's cost.
name: dispatch-timing

on:
  push:
    branches: [main]
    paths:
      - 'vendor/email_source/pipeline.py'
      - 'vendor/whatsapp_source/pipeline.py'
      - 'vendor/imessage_source/pipeline.py'
      - 'vendor/spoken_source/pipeline.py'
      - 'tests/test_dispatch_timing.sh'
      - '.github/workflows/dispatch-timing.yml'
  pull_request:
    paths:
      - 'vendor/email_source/pipeline.py'
      - 'vendor/whatsapp_source/pipeline.py'
      - 'vendor/imessage_source/pipeline.py'
      - 'vendor/spoken_source/pipeline.py'
      - 'tests/test_dispatch_timing.sh'
      - '.github/workflows/dispatch-timing.yml'

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  dispatch-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every dispatch reports its own duration
        run: bash tests/test_dispatch_timing.sh
