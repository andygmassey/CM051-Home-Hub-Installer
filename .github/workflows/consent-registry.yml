name: consent-registry

# F1 gate (box-walk recut #2, 2026-07-26). On the .185 walk the spoken-capture
# consent silently failed to persist because the DMG bundled a STALE
# ostler_security whose consent_cli registry did not know the tickbox id
# install.sh records against. install.sh was correct; the vendor was stale.
#
# This wires the cross-check so it actually RUNS: EVERY `_consent_cli_record`
# call in install.sh must pass a tickbox id that is defined in
# vendor/legal/consent_strings.py AND registered in vendor/ostler_security/
# consent_cli.py's TICKBOX_REGISTRY. A stale re-vendor or a new unregistered
# consent call fails HERE instead of swallowing a consent record on a customer
# install. A guard that exists but does not run is the ships-dark trap.

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'vendor/legal/consent_strings.py'
      - 'vendor/ostler_security/consent_cli.py'
      - 'tests/test_consent_tickbox_registry.sh'
      - 'tests/test_every_consent_decision_is_recorded.sh'
      - 'tests/test_the_reuse_path_still_asks_the_licence_terms.sh'
      # Row 969's consumer-side half. The test drives the reuse path into the
      # REAL consent registry and then renders the REAL Doctor consent tile, so
      # its subject spans three files and all three have to be watched or the
      # gate is dark on the edit that breaks it. dashboard_components.py holds
      # the wording-drift map the tile checks against, and legal/__init__.py is
      # what that map is now derived from, so a ConsentString that stops being
      # exported there stops being checkable without touching either of the
      # other two.
      - 'tests/test_the_licence_acknowledgement_reaches_the_customer.sh'
      - 'tests/test_the_licence_screen_says_what_we_hash.sh'
      - 'install.sh.strings.en-GB.sh'
      - 'vendor/legal/consent_strings.py'
      - 'vendor/doctor/agent/dashboard_components.py'
      - 'vendor/legal/__init__.py'
      - '.github/workflows/consent-registry.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  consent-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Consent tickbox registry cross-check
        run: bash tests/test_consent_tickbox_registry.sh

      - name: every consent decision the customer gives is actually recorded
        # `always()` because a test step that only runs on success can be
        # MASKED by an earlier red in the same job. A guard against answers
        # that are never recorded must not itself stop being recorded.
        if: always()
        run: bash tests/test_every_consent_decision_is_recorded.sh

      - name: a re-install still asks for the licence terms
        # Same `always()` reasoning as the step above. This one guards the
        # REUSE path specifically: the personal-use terms were rendered only
        # inside `if [[ "$SKIP_PHASE2" == false ]]`, so "use previous answers"
        # showed no terms and recorded no acknowledgement. The test extracts
        # the blocks from install.sh at run time rather than copying them, and
        # REFUSES (CANNOT-RUN, non-zero) if the extraction comes back short --
        # so deleting the code under test fails the gate instead of emptying
        # it into a green.
        if: always()
        run: bash tests/test_the_reuse_path_still_asks_the_licence_terms.sh

      # The step below drives the REAL vendored consent CLI and renders the REAL
      # vendored Doctor tile, so it needs the two packages those import:
      # cryptography (ostler_security/__init__) and httpx (the Doctor agent's
      # status_collector). Without them the test reports CANNOT-RUN and EXITS
      # NON-ZERO rather than passing on an empty subject, so a failed install
      # here is a red gate and not a silent skip. Kept to the two modules the
      # test actually needs rather than the whole Doctor requirements file: a
      # dependency this job does not exercise is a minute per run for nothing.
      - name: Dependencies for the end-to-end consent proof
        if: always()
        run: |
          python3 -m pip install --quiet --break-system-packages --ignore-installed cryptography httpx \
            || python3 -m pip install --quiet --ignore-installed cryptography httpx

      # Row 969's consumer-side half, and the subject of every assertion is a
      # PERSON: a customer re-installing with "use previous answers" and no
      # prior record is ASKED, their answer LANDS in the real consent registry,
      # and it is VISIBLE AND CHECKABLE in the real Doctor consent tile. The
      # third was false until this PR: the tile's wording-drift map was a
      # hand-written list of five while install.sh records six, so the licence
      # acknowledgement rendered grey "unknown wording", indistinguishable from
      # a record Doctor does not recognise at all.
      #
      # Same `always()` reasoning as the steps above. It carries three mutants,
      # each APPLIED to a copy and asserted present in the mutated text before
      # being driven: the terms back inside the SKIP_PHASE2 guard, an unknown
      # record upgraded to accepted, and the drift map reverted to five names.
      - name: the licence acknowledgement reaches the customer, end to end
        if: always()
        run: bash tests/test_the_licence_acknowledgement_reaches_the_customer.sh

      - name: The licence screen says what we hash
        if: always()
        # The test above proves the screen RENDERS and that the stored hash is
        # this build's bundled wording. It stubs every MSG_* with a placeholder,
        # which is right for asking "does the slot render" and says nothing
        # about the words in it. This one compares the words: every sentence the
        # customer reads must appear verbatim in the text whose hash goes into
        # the consent registry. A record naming wording the person never saw is
        # worse than no record, because it looks like evidence.
        run: bash tests/test_the_licence_screen_says_what_we_hash.sh
