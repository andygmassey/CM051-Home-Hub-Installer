name: memory-assert-answers-under-load

# Walk #15: people_seed_and_retrieval got NO HTTP response from
# POST /api/v1/memory/assert (curl --max-time 15). ical-server stayed up (same
# pid) and logged BrokenPipeError in wfile.write: it answered after the client
# had gone. Measured on 8,074 synthetic people the handler is 0.01-0.03s; its
# latency is the Ollama embed behind the identity search, which had two 30s
# socket timeouts and no overall deadline.
#
# The guard drives the REAL vendored server as a subprocess with an embed
# endpoint it holds for 4s against a 1s budget: a new name must get a prompt
# retryable 503 with nothing written, an exact name already in the graph must
# still be stored, a responsive model must still mint (control), and the
# shipped default budget must leave the walk probe's timeout room to hear it.
# Red on the pre-fix server: 3 of 4 fail; the control passes.

on:
  pull_request:
    paths:
      - 'vendor/cm041/assistant_api/ical-server.py'
      - 'vendor/doctor/agent/diagnostic_rules.py'
      - 'vendor/doctor/agent/diagnostic_copy.py'
      - 'scripts/box_walk_probes/probes/people_seed_and_retrieval.sh'
      - 'tests/test_memory_assert_answers_inside_the_probe_timeout.py'
      - 'tests/test_spool_sweep_quarantines_a_bad_row.py'
      - 'tests/test_quick_note_reaches_knowledge_store.py'
      - 'tests/test_enrichqueue_retries_not_drops.py'
      - 'vendor/cm041/assistant_api/browsing_enrich.py'
      - 'tests/test_api_list_pagination_is_additive.py'
      - 'tests/test_vendored_cm041_revendor_07a22b4c_routes.py'
      - 'tests/test_vendored_conversation_routes_refuse_path_traversal.py'
      - 'vendor/cm041/assistant_api/derived_preferences.py'
      - 'vendor/cm041/assistant_api/tests/test_person_context_meetings_privacy.py'
      - 'vendor/cm041/meeting_syncer/**'
      - 'tests/fixtures/pagination_golden_*.json'
      - '.github/workflows/memory-assert-answers-under-load.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  memory-assert-answers-under-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install the server's import-time dependencies and pytest
        run: python3 -m pip install --quiet cryptography httpx pytest pyoxigraph
      - name: memory/assert answers inside the probe's timeout while the model is busy
        run: python3 -m pytest -v tests/test_memory_assert_answers_inside_the_probe_timeout.py
      - name: a bad spool row is quarantined, not retried forever
        if: always()
        run: python3 -m pytest -v tests/test_spool_sweep_quarantines_a_bad_row.py
      - name: preferences and people pagination is additive
        if: always()
        run: python3 -m pytest -v tests/test_api_list_pagination_is_additive.py
      - name: an iOS quick note reaches the knowledge store
        if: always()
        run: python3 -m pytest -v tests/test_quick_note_reaches_knowledge_store.py
      - name: the knowledge drain retries through a store outage and never drops
        if: always()
        run: python3 -m pytest -v tests/test_enrichqueue_retries_not_drops.py
      - name: CM041 07a22b4c re-vendor - meeting/upcoming in-process, commitments privacy_level, derived preferences route
        if: always()
        run: python3 -m pytest -v tests/test_vendored_cm041_revendor_07a22b4c_routes.py
      - name: CM041 #225 in the vendored server - conversation routes refuse path traversal
        if: always()
        run: python3 -m pytest -v tests/test_vendored_conversation_routes_refuse_path_traversal.py
      - name: CM041 #239 in the vendored server - /people/context withholds L3 meetings and labels privacy_level
        if: always()
        run: |
          python3 -m pip install --quiet rdflib
          PYTHONPATH=vendor python3 -m pytest -v vendor/cm041/assistant_api/tests/test_person_context_meetings_privacy.py
