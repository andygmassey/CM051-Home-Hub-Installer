# v1.0.108 full-history catch-up, browser family: Safari and Chrome walk back
# past the install window through the shipped extractors and the shipped
# Browsing sink, kill-safe and without duplicates.
name: catchup-browser

on:
  push:
    branches: [main]
    paths:
      - 'lib/ostler_catchup.py'
      - 'install.sh'
      - 'vendor/ostler_fda/catchup_browser.py'
      - 'vendor/ostler_fda/safari_history.py'
      - 'vendor/ostler_fda/chrome_history.py'
      - 'vendor/ostler_fda/pwg_ingest.py'
      - 'vendor/ostler_fda/extract_all.py'
      - 'tests/test_catchup_browser.py'
      - '.github/workflows/catchup-browser.yml'
  pull_request:
    paths:
      - 'lib/ostler_catchup.py'
      - 'install.sh'
      - 'vendor/ostler_fda/catchup_browser.py'
      - 'vendor/ostler_fda/safari_history.py'
      - 'vendor/ostler_fda/chrome_history.py'
      - 'vendor/ostler_fda/pwg_ingest.py'
      - 'vendor/ostler_fda/extract_all.py'
      - 'tests/test_catchup_browser.py'
      - '.github/workflows/catchup-browser.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  catchup-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest and the ostler_fda dependencies
        run: python -m pip install --quiet pytest "httpx>=0.27" "nameparser>=2.1.0,<3.0" "phonenumbers>=8.13.0"
      - name: Safari and Chrome are read back to the oldest visit, once each
        run: |
          n="$(python -m pytest tests/test_catchup_browser.py --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 8 ]; then
            echo "REFUSING: expected at least 8 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python -m pytest tests/test_catchup_browser.py -v -rs -s
      - name: the browser runner is registered and export-scan drives it
        if: always()
        run: /bin/bash tests/test_export_scan_runs_the_catchup_step.sh
