name: fda-deps-installed

# The sibling gates prove the FDA tick RECURS (fda-rerun-recurs) and that what
# it runs is the WHOLE job (fda-rerun-ingests). This one proves the code it
# runs can be LOADED AT ALL.
#
# ============================================================================
# THE DEFECT (#805), measured on the live v1.0.37 box 2026-08-20
# ============================================================================
#
#     ~/.ostler/.venv/bin/python3 -c 'import ostler_fda.identifier_quality'
#       -> ModuleNotFoundError: No module named 'nameparser'
#
# install.sh staged the package with `cp -R` and never pip-installed it, so the
# venv the tick runs under never received the dependencies the package declares.
# identifier_quality.py imports nameparser at module scope and the tick imports
# identifier_quality first, so fda-rerun died on every fire, on every box, from
# the first install -- while the installer told the customer their data was
# "still loading in the background".
#
# Both sibling gates stayed GREEN throughout. They ask whether the agent is
# scheduled and whether the wrapper calls both halves. Neither asks whether the
# interpreter can load the code.
#
# ============================================================================
# WHY THE TEST IMPORTS INSTEAD OF READING
# ============================================================================
#
# The obvious predicate -- "does pyproject.toml declare nameparser" -- PASSES ON
# EXACTLY THE BROKEN BOXES. The declaration was always right; the installation
# was missing. So the test builds a real venv, reproduces the
# ModuleNotFoundError with the pre-fix mechanism (cp -R and nothing else), then
# proves the shipped mechanism resolves it. Both arms, because a checker stuck
# on "broken" would satisfy a one-sided control while measuring nothing.
#
# ============================================================================
# WHY THE SELF-TEST IS ITS OWN JOB
# ============================================================================
#
# A failing step skips everything after it, so a broken predicate would take
# down the gate it guards and report one red line instead of two. Same reason
# fda-rerun-ingests splits its self-test out.

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'install.sh.strings.en-GB.sh'
      - 'vendor/ostler_fda/pyproject.toml'
      - 'vendor/ostler_fda/identifier_quality.py'
      - 'scripts/lib/strip_comments.sh'
      - 'tests/test_fda_deps_are_installed_not_just_copied.sh'
      - 'tests/TEST_WIRING.tsv'
      - '.github/workflows/fda-deps-installed.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same branch/PR. NEVER cancels main or a
  # tag: a cancelled main run is a gate that did not report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  gate:
    # macOS, because the mechanism under test is macOS-only shell out of the
    # shipping installer, and because BSD mktemp/sed semantics differ. The gate
    # runs where the code runs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The self-test job needs origin/main's install.sh as the pre-fix
          # baseline, so a shallow clone is not enough.
          fetch-depth: 0

      - name: Environment, so a failure is attributable
        run: |
          /bin/bash --version | head -1
          python3 --version
          sw_vers | head -2

      - name: The gate
        run: /bin/bash tests/test_fda_deps_are_installed_not_just_copied.sh

  self-test:
    # ANTI-VACUITY. A control never shown failing is not evidence.
    #
    # This is ASSERTED, not printed: if the pre-fix install.sh PASSES the test,
    # the test has stopped discriminating and the green above is worthless.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The test must go RED against the pre-fix installer
        run: |
          # `set +e` IS LOAD-BEARING, NOT TIDINESS.
          #
          # GitHub runs a `run:` block as `/bin/bash -e {0}`. This job exists to
          # observe a NON-ZERO exit from the test, so with -e still in force the
          # step aborted on the very failure it was measuring -- before `rc=$?`
          # was ever assigned, and before any of the messages below could print.
          # It reported a bare "exit code 1" that looked like the test being
          # broken rather than the test correctly going red.
          #
          # `set -uo pipefail` does NOT turn -e off. Only `set +e` does. Caught
          # on the first CI run of this workflow.
          set +e
          set -uo pipefail

          # ── RESOLVING THE BASELINE, AND WHY THE OBVIOUS WAY IS WRONG ──
          #
          # The baseline must be the merge-base: main's TIP makes it MOVE under
          # the PR (CM051 #787's shape), so a merge into main between two runs
          # flips this arm for reasons unrelated to the change under test.
          #
          # This job originally computed it as `git merge-base HEAD origin/main`
          # and that is WRONG ON A pull_request EVENT. GitHub checks out
          # refs/pull/N/merge — the head ALREADY MERGED INTO THE BASE — so HEAD
          # contains main, and the merge-base of (main + head) with main is main
          # itself. The baseline therefore included the very fix it was supposed
          # to predate.
          #
          # MEASURED the moment #901 landed on main: the job on PR #903 resolved
          # the baseline to bbb95693 (main's tip), ran the test against a tree
          # that already had the fix, got 11/0, and reported ANTI-VACUITY FAILED.
          # Locally, `git merge-base` on the real branch gives 209697df, which
          # does NOT contain the fix. Two answers for one question, and CI had
          # the wrong one.
          #
          # So the comment above was right and the implementation contradicted
          # it — a moving baseline, arrived at by the exact route the comment
          # warned against.
          #
          # `github.event.pull_request.base.sha` IS the merge-base GitHub
          # computed for the PR, so take it directly rather than deriving it
          # from a ref whose contents are not what the name suggests. On a push
          # to main there is no PR, and the previous commit is the honest
          # baseline.
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ]; then
              echo "baseline: pull_request.base.sha (the merge-base GitHub computed)"
          else
              git fetch --quiet --deepen=2 origin "${GITHUB_REF_NAME}" 2>/dev/null || true
              BASE="$(git rev-parse HEAD^ 2>/dev/null)" || BASE=""
              echo "baseline: HEAD^ (push event, no pull_request context)"
          fi
          if [ -z "$BASE" ]; then
              echo "CANNOT RUN: could not resolve a baseline commit."
              echo "That is NOT a pass. A shallow fetch or a rewritten history"
              echo "both produce it, and neither shows the test discriminates."
              exit 1
          fi

          # AND ASSERT WHAT WE JUST RESOLVED. A baseline that already contains
          # the fix cannot prove anything, and it fails in the confusing
          # direction — as "the test no longer discriminates" rather than as
          # "the baseline is wrong". Say which it is.
          if git show "${BASE}:install.sh" 2>/dev/null \
               | grep -q 'FDA_VENV_PIP.*install.*-e'; then
              echo "CANNOT RUN: the resolved baseline ${BASE} ALREADY CONTAINS the"
              echo "#805 fix, so it cannot serve as a pre-fix tree. This is a"
              echo "BASELINE RESOLUTION fault, not a loss of discrimination in the"
              echo "test. Do not 'fix' the test in response to this message."
              exit 1
          fi
          echo "baseline (merge-base with origin/main): ${BASE}"

          if ! git cat-file -e "${BASE}:install.sh" 2>/dev/null; then
              echo "CANNOT RUN: install.sh absent at ${BASE}. Not a pass."
              exit 1
          fi

          D="$(mktemp -d)"; mkdir -p "$D/tests" "$D/vendor" "$D/scripts/lib"
          git show "${BASE}:install.sh"                    > "$D/install.sh"
          git show "${BASE}:install.sh.strings.en-GB.sh"   > "$D/install.sh.strings.en-GB.sh"
          # The TEST and the STRIPPER come from this PR -- the baseline is the
          # ARTEFACT under test, not the instrument. Swapping in the old test
          # would measure whether the old test passed the old code, which is a
          # different and useless question.
          cp tests/test_fda_deps_are_installed_not_just_copied.sh "$D/tests/"
          cp scripts/lib/strip_comments.sh "$D/scripts/lib/"
          cp -R vendor/ostler_fda "$D/vendor/"

          /bin/bash "$D/tests/test_fda_deps_are_installed_not_just_copied.sh" > "$D/out" 2>&1
          rc=$?
          cat "$D/out"

          if [ "$rc" -eq 0 ]; then
              echo ""
              echo "ANTI-VACUITY FAILED: the test PASSED the pre-fix installer."
              echo "It can no longer tell the #805 fix from the #805 bug, so the"
              echo "green in the gate job means nothing. Investigate before"
              echo "trusting this workflow."
              exit 1
          fi
          if [ "$rc" -eq 2 ]; then
              echo ""
              echo "ANTI-VACUITY INCONCLUSIVE: the test returned CANNOT-RUN (2)"
              echo "against the baseline. It did not fail for the right reason --"
              echo "it did not run. Treat as unmeasured, not as proof."
              exit 1
          fi
          echo ""
          echo "ok: the test goes RED (rc=${rc}) against the pre-fix installer, as required"
