concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# Read-only. No folded member uses the token (checked at generate);
# the selector reads the PR's changed-file list with it.
permissions:
  contents: read
  pull-requests: read

jobs:
  py-matrix:
    runs-on: ubuntu-latest
    # Sum of the folded jobs' own timeouts (645 min), capped at 70 so the
    # CI Required Gate (75 min hard cap) still sees a verdict. Every step below
    # keeps its old job's timeout, so a hang is bounded where it always was.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          # Speed only: a warm wheel cache. Each block still installs exactly
          # what its own steps name, into its own fresh venv.
          cache: pip
          cache-dependency-path: .github/workflows/fold-py-matrix.yml
