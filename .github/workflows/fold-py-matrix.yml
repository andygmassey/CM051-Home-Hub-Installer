          mkdir -p "$BLOCK/home" "$BLOCK/tmp"
          "$PY" -m venv "$BLOCK/venv"
          echo "$BLOCK/venv/bin" >> "$GITHUB_PATH"
          {
            echo "HOME=$BLOCK/home"
            echo "TMPDIR=$BLOCK/tmp"
            echo "VIRTUAL_ENV=$BLOCK/venv"
          } >> "$GITHUB_ENV"
      # EVERY ONE OF THESE IS LOAD-BEARING, not housekeeping. The suite opens
      # with pytest.importorskip on three of them, so a missing wheel does not
      # fail the run -- it SKIPS the module and reports success, which is the
      # exact "found nothing / could not look" confusion these tests exist to
      # catch. The collected-count floor below is what turns that back into a
      # failure, but installing them is what makes the floor unnecessary.
      #
      #   rdflib             executes the reader's real SPARQL over a real
      #                      named-graph dataset. Without it the whole of
      #                      item 2 is untested.
      #   pydantic-settings  imported transitively by CM019's config module.
      #   nameparser, httpx, phonenumbers
      #                      runtime deps of ostler_fda.pwg_ingest (CM051
      #                      #2543: phonenumbers tells a WhatsApp LID apart
      #                      from a genuine phone number).
      #   pyyaml             the doctor import modules parse frontmatter.
      #   ./vendor/ostler_security
      #                      ical-server.py REFUSES to import without it,
      #                      by design: it will not start against
      #                      potentially unencrypted databases.
      - id: b31_s01
        if: ${{ steps.select.outputs.b31 != 'false' && !cancelled() && steps.b31_isolate.conclusion != 'failure' }}
        timeout-minutes: 20
        name: Install the dependencies the suite refuses to run without
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest rdflib pydantic-settings \
            nameparser httpx phonenumbers pyyaml
          python -m pip install --quiet ./vendor/ostler_security
      # ANTI-VACUITY AND THE RUN ARE ONE STEP ON PURPOSE.
      #
      # As two steps, a failing floor would SKIP the run below and hide the
      # real result behind an earlier red -- and ci-maskless is right to
      # refuse that shape. Folded into one, there is no second step to mask,
      # the floor provably runs first, and one step cannot hide another that
      # does not exist.
      #
      # pytest exits 5 on "no tests collected" and `bash -e` honours it, so a
      # fully-skipped module is already caught. The floor is here so that
      # property is STATED rather than inherited from another tool's exit
      # convention, and so a PARTIAL skip (rdflib missing, ical-server
      # unimportable) is caught too -- that one exits 0 today.
      - id: b31_s02
        if: ${{ steps.select.outputs.b31 != 'false' && !cancelled() && steps.b31_isolate.conclusion != 'failure' && steps.b31_s01.conclusion != 'failure' }}
        timeout-minutes: 20
        name: A writer's name and its reader's name still meet
        run: |
          # `|| n=0` on the ASSIGNMENT, not inside the pipe. grep -c prints
          # its count AND exits 1 when that count is zero, so under `bash -e`
          # the step would die here and the message below would never print.
          # No `2>/dev/null`: a pytest usage error must not be laundered into
          # a clean zero.
          n="$(python -m pytest tests/test_writer_reader_vocabulary_contracts.py \
                 --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 36 ]; then
            echo "REFUSING: expected at least 36 collected tests, got ${n:-0}." >&2
            echo "A skipped module reports success in any runner that reads" >&2
            echo "'no failures' as 'passed'. Check rdflib, pydantic-settings," >&2
            echo "nameparser, pyyaml and ostler_security all installed." >&2
            exit 1
          fi
          python -m pytest tests/test_writer_reader_vocabulary_contracts.py -v
      # A parser must not label the customer's most sensitive data publishable.
      # apple.py wrote compartment_level=5 at four sites, each commented HIGHEST
      # PRIVACY, and 5 is L5Commercial which privacy_model.py maps to the
      # publishable level. The comment stated the intent and the number said the
      # opposite. `if: always()` so an earlier red cannot delete this.
      - id: b31_s03
        if: ${{ steps.select.outputs.b31 != 'false' && (always()) }}
        timeout-minutes: 20
        name: No parser labels private data publishable
        run: python3 tests/test_no_parser_labels_sensitive_data_publishable.py
      # A STORE THAT REFUSED A WRITE IS NOT A BATCH WITH NOTHING TO WRITE.
      #
      # #953, and it is the same family as the five this workflow was built
      # for: both sides returned success, nothing went red, and the customer's
      # front page said "Ostler has spotted 0 interests". Here the WRITER
      # refused and the caller did not record it, because insert_triples and
      # upsert_vectors are both declared `-> bool` and both return False rather
      # than raising, while the caller recorded only in its `except` arm.
      #
      # Measured with a control before the fix:
      #   endpoint 500 -> preferences 3, triples 0, vectors 3, errors []
      #   endpoint 204 -> preferences 3, triples 3, vectors 3, errors []
      # The control writes 3, so the 0 means REFUSED rather than "the harness
      # never works". And vectors is 3 in BOTH arms, so the run reported a
      # healthy batch over a split brain: Qdrant held the preferences and
      # Oxigraph did not.
      #
      # The mutant for this gate is origin/main's own pre-fix blob, which turns
      # four arms red while the control arm still passes.
      #
      # `if: always()` so an earlier red cannot delete this.
      - id: b31_s04
        if: ${{ steps.select.outputs.b31 != 'false' && (always()) }}
        timeout-minutes: 20
        name: A store refusal is recorded, not reported as an empty batch
        run: python3 tests/test_a_store_refusal_is_not_an_empty_batch.py
      # A PRODUCER THAT RUNS AFTER ITS CONSUMER IS A WRITER/READER MISMATCH IN
      # TIME RATHER THAN IN VOCABULARY, and it fails the same way: both halves
      # exit 0, nothing goes red, and the customer's front page reads "0
      # interests". The editor tick projects Qdrant preferences into Oxigraph
      # and compiles the interest profile OUT of Oxigraph in the same run; for
      # one release the projection was invoked below the compile, so every tick
      # compiled the graph as the previous tick left it. A one-tick lag looks
      # correct on any box that has been up for two ticks, and wrong in exactly
      # the window a thin walk runs in, which is where it was found: count 0 and
      # raw_rows 0 over 4718 preference nodes, an empty /api/v1/preferences, and
      # BLOCKING probe assistant_answers_grounded scoring tool_found_nothing.
      #
      # The test runs the REAL wrapper, rendered the way INSTALL_SNIPPET.sh
      # renders it, against a stub interpreter that models the store, so the
      # assertion is the artefact's own count after ONE tick on a cold box and
      # not a claim about line numbers. It carries its own positive and negative
      # controls and reports CANNOT-RUN rather than passing if either fails.
      # Its mutant is origin/main's own pre-fix blob, which turns it red.
      #
      # `if: always()` so an earlier red cannot delete this.
      - id: b31_s05
        if: ${{ steps.select.outputs.b31 != 'false' && (always()) }}
        timeout-minutes: 20
        name: The preference projection runs before the compile that reads it
        run: bash tests/test_the_preference_projection_runs_before_the_compile_that_reads_it.sh
      # THE SAME MISMATCH IN TIME, ONE LAYER OUT: the producer is correct and
      # runs at the one moment there is provably nothing to read. The Front
      # Page agent is RunAtLoad true + StartInterval 3600, so its one
      # guaranteed run fires at the END OF THE INSTALL, before the ingest it
      # reads has finished. Measured on macmini16-walk 2026-09-23: 0 Qdrant
      # points at 12:00:53, 926 at 13:00:58 with 0 projected, the real points
      # landing at 13:05, and the SAME installed wrapper run by hand at 13:29
      # producing 4628 interests from 5723 points. For that hour
      # interest_profile.json served count 0, which is what /api/v1/preferences
      # serves and what the daemon's pwg_preferences tool reads, so BLOCKING
      # probe assistant_answers_grounded scored tool_found_nothing.
      #
      # The fix is a bounded, self-removing catch-up agent in the shape the
      # wiki already ships. This test CARVES that wrapper out of install.sh's
      # heredoc and RUNS it, tick by tick, in a sandboxed HOME with a stub
      # tick, curl and launchctl, then looks at what is left on disk: it must
      # stop when the profile fills, stop when the upstream collection is
      # confirmed empty, keep going while the ingest is still landing, and
      # terminate at its cap when the upstream cannot be read at all. Two
      # mutants are built from the wrapper itself and must be rejected, so a
      # green cannot come from a dead harness. Its mutant at the file level is
      # origin/main's own install.sh, which carves 0 lines and turns it red.
      #
      # `if: always()` so an earlier red cannot delete this.
      - id: b31_s06
        if: ${{ steps.select.outputs.b31 != 'false' && (always()) }}
        timeout-minutes: 20
        name: The Front Page catch-up survives a late ingest
        run: bash tests/test_the_front_page_catch_up_survives_a_late_ingest.sh
      - id: b31_s07
        if: ${{ steps.select.outputs.b31 != 'false' && (always()) }}
        timeout-minutes: 20
        name: The Front Page catch-up never removes itself on an empty read while the install is running (walk #27)
        run: bash tests/test_the_front_page_catch_up_waits_out_hydration.sh
      # F12b: /api/v1/memory "About you" holds only the owner's facts; facts
      # about other people go to about_others. Real query over rdflib, real
      # api_memory_list. Floor + run in one step; `if: always()` so an
      # earlier red cannot delete it.
      - id: b31_s08
        if: ${{ steps.select.outputs.b31 != 'false' && (always()) }}
        timeout-minutes: 20
        name: About you holds only the owner's facts (F12b)
        run: |
          n="$(python -m pytest tests/test_memory_about_you.py --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          [ "${n:-0}" -ge 4 ] || { echo "REFUSING: expected 4 F12b tests, got ${n:-0}" >&2; exit 1; }
          python -m pytest tests/test_memory_about_you.py -v -s
