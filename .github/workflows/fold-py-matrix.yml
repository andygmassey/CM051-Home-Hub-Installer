      # scope), so without it the import fails and every arm errors rather
      # than running. pytest is the runner.
      # ALL THREE runtime deps, taken from vendor/ostler_fda/pyproject.toml
      # rather than from what happens to be installed on a laptop. pwg_ingest
      # imports httpx and phonenumbers at module scope (CM051 #2543: a
      # WhatsApp LID must be told apart from a genuine phone number) AND
      # relatively imports identifier_quality, which imports nameparser.
      # Missing any of the three makes pytest exit 2 on COLLECTION -- not a
      # failing assertion, an unimportable module.
      - id: b15_s01
        if: ${{ steps.select.outputs.b15 != 'false' && !cancelled() && steps.b15_isolate.conclusion != 'failure' }}
        timeout-minutes: 20
        name: Install pytest and the module's runtime dependencies
        run: python -m pip install --quiet pytest httpx nameparser phonenumbers
      # THE FLOOR AND THE RUN ARE ONE STEP ON PURPOSE, copying
      # contact-card-repair.yml: a floor in a SEPARATE step would skip this
      # one when it failed, hiding the real result behind an earlier red.
      # There is then no second step to mask.
      #
      # pytest exits 5 on "collected 0 items", which `bash -e` honours, so a
      # silent skip is already fatal. The floor STATES that property instead
      # of inheriting it from another tool's exit convention.
      - id: b15_s02
