        timeout-minutes: 20
        name: A projection prunes what left the graph, and prunes nothing when blind
        run: |
          # ⚠️ `|| true` ON THE ASSIGNMENT, AND IT IS THE WHOLE REASON THIS
          # STEP IS DEBUGGABLE. Under `bash -e` a failing pytest kills the step
          # AT THIS LINE, so `echo "$out"` never runs and the log shows the
          # script text and an exit code and nothing else. MEASURED: the first
          # CI run of this workflow failed on all three interpreters with
          # "exit code 2" and ZERO diagnostic output, and the real cause (a
          # missing nameparser, i.e. a collection error) was invisible until
          # this was fixed. The sibling contact-card-repair.yml carries the
          # same warning about `grep -c`; I copied its comment and not its
          # lesson.
