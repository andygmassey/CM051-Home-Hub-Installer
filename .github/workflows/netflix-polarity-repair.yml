# Walk #6 candidate #10. The Netflix thumbs-value polarity bug (genuinely-
# liked shows stored as Dislikes) is fixed at the parser (CM019 PR #396,
# grafted into vendor/cm019_preferences/.../netflix.py in this same PR). This
# workflow is for the REPAIR half: scripts/repair_netflix_rating_polarity.py
# fixes points already written by the buggy parser on an upgraded box.
#
# THE LOAD-BEARING PROPERTY IS THE MARKER, which is why this runs at all
# rather than being trusted because it passed once on a box: without checking
# the per-point repair marker BEFORE dispatching on the stored (wrong) label,
# a second run would read an already-fixed record as new damage and flip it
# straight back -- measured in this test suite by deliberately breaking that
# ordering and watching the control fail (see
# test_control_already_repaired_two_thumbs_down_is_not_touched_again and its
# sibling). This workflow keeps that control green on every PR that touches
# either file.
name: netflix-polarity-repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_netflix_rating_polarity.py'
      - 'tests/test_repair_netflix_rating_polarity.py'
      - 'tests/test_repair_netflix_rating_polarity_marker_skip.sh'
      - 'vendor/cm019_preferences/services/ingest/src/parsers/netflix.py'
      - 'install.sh'
      - '.github/workflows/netflix-polarity-repair.yml'
  pull_request:
    paths:
      - 'scripts/repair_netflix_rating_polarity.py'
      - 'tests/test_repair_netflix_rating_polarity.py'
      - 'tests/test_repair_netflix_rating_polarity_marker_skip.sh'
      - 'vendor/cm019_preferences/services/ingest/src/parsers/netflix.py'
      - 'install.sh'
      - '.github/workflows/netflix-polarity-repair.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  netflix-polarity-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Stdlib only (urllib, json) -- deliberately, so this script runs
      # under install.sh's repair step with no dependency on anything
      # beyond the interpreter itself. pytest is the only install needed.
      - name: Install pytest
        run: python -m pip install --quiet pytest
      # ANTI-VACUITY AND THE RUN ARE ONE STEP ON PURPOSE (same reasoning as
      # contact-card-repair.yml): a floor failure must not be maskable by a
      # later step never running.
      - name: The marker is checked before the label, in both directions
        run: |
          n=$(python -m pytest --collect-only -q tests/test_repair_netflix_rating_polarity.py 2>/dev/null | grep -c "^tests/" || true)
          if [ "${n:-0}" -lt 10 ]; then
            echo "::error::anti-vacuity floor: expected >=10 collected tests, got ${n:-0}. A silent collection failure must not read as a pass." >&2
            exit 1
          fi
          python -m pytest -q tests/test_repair_netflix_rating_polarity.py

  marker-skip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install.sh's one-time repair step runs, skips, and never aborts the install
        run: bash tests/test_repair_netflix_rating_polarity_marker_skip.sh
