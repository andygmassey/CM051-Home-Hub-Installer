name: cold-box-source-truth

# Three defects found on the v1.0.63 walk, on a FRESHLY WIPED Mini 16 restored
# from a Time Machine backup. All three had shipped, none was visible to any
# existing gate, and each now has a test that goes red against the blob that
# shipped it.
#
# ============================================================================
# WHY THESE THREE BELONG IN ONE WORKFLOW
# ============================================================================
#
# They are one failure with three faces: THE PRODUCT REPORTED ON ITSELF AND
# WAS BELIEVED.
#
#   1. An owner email that could not be read (Contacts.app was never launched
#      on a new Mac, so osascript returned -600) shipped as an EMPTY required
#      variable into a LaunchAgent, which then refused once an hour forever.
#      ai_conversations read `not_run` permanently and the same rc=2 reddened
#      health_check. One empty string, two symptoms, neither naming the cause.
#
#   2. The source-status surface was written ONLY by install.sh. Every ongoing
#      tick did real work and updated nothing, so a source that failed at
#      install showed failed forever after it recovered. Measured: all 11
#      sentinels frozen at install time while the iMessage extract was
#      rewritten 38 minutes later with 136 people created.
#
#   3. RULE 2 of the dedupe ruleset was enforced on the resolve path and NOT
#      on the converge path, which is the one install.sh actually runs. The
#      over-merge count therefore GREW across boxes -- 128, 130, 137 -- while
#      the fix was believed to be in place, and the walk probe failed on three
#      consecutive cuts.
#
# ============================================================================
# WHY macos, NOT ubuntu
# ============================================================================
#
# The aiconv guard test extracts the real region from install.sh and the
# source-status test drives the shipped reader. Both are macOS-shaped code
# paths, and the installer only ever runs on macOS. The gate runs where the
# code runs.
#
# EVERY STEP CARRIES `if: always()`. A failure in one test must not silence
# the next: a skipped test reads as "no objection", which is precisely the
# class of defect this workflow exists to remove.

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'vendor/doctor/agent/web_ui.py'
      - 'vendor/cm041/identity_resolver/batch_resolver.py'
      - 'vendor/cm041/identity_resolver/resolver.py'
      - 'tests/test_aiconv_agent_not_registered_without_owner_email.sh'
      - 'tests/test_aiconv_without_owner_email_does_not_redden_health_check.sh'
      - 'tests/test_aiconv_hydrate_honesty.sh'
      - 'tests/test_source_status_reports_ongoing_not_just_install.sh'
      - 'tests/test_converge_path_enforces_rule2.sh'
      - 'tests/test_fda_rerun_agent_loads_after_its_binary.sh'
      - 'tests/test_unknown_consent_is_not_declined.sh'
      - 'tests/test_every_question_declares_its_persistence.sh'
      - 'tests/test_consent_decisions_survive_a_reuse_run.sh'
      - 'tests/test_config_reader_absence_does_not_abort_the_install.sh'
      - 'tests/test_decline_does_not_wipe_an_existing_install.sh'
      - 'tests/test_a_promote_before_the_decline_arms_is_gated.sh'
      - 'tests/test_walkaway_no_phase2_input_leak.sh'
      - 'tests/test_ttywalk_licence_preflight_is_cannot_run.sh'
      - 'scripts/tests/test_artefact_version_read_is_shaped.sh'
      - 'scripts/ttywalk.sh'
      - 'scripts/ttywalk.sh'
      - 'tests/test_a_slow_step_is_not_a_wedged_one.sh'
      - 'tests/test_walk_driver_cancel_is_not_a_build_verdict.sh'
      - 'tests/test_a_tally_that_contradicts_the_log_is_not_a_pass.sh'
      - 'tests/test_artefact_walk_stages_the_dmg_payload.sh'
      - 'tests/test_consent_state_is_defined_before_it_is_called.sh'
      - 'tests/test_the_recovery_key_is_disclosed_where_it_is_minted.sh'
      - 'tests/test_an_unmeasured_flag_must_be_read.sh'
      - 'tests/test_ollama_agent_does_not_depend_on_a_foreign_port.sh'
      - 'tests/test_store_health_does_not_depend_on_a_foreign_port.sh'
      - 'tests/test_every_fail_call_has_error_code.sh'
      - 'tests/test_a_plistbuddy_read_takes_its_exit_code.sh'
      - 'tests/test_every_plistbuddy_read_is_guarded.sh'
      # The census reads install.sh and scripts/*.sh, so a change to any
      # of them can introduce an unguarded read. Watched for that reason.
      - 'scripts/post_walk_qa.sh'
      - 'scripts/verify_app_provenance.sh'
      - 'scripts/verify_commit_parity.sh'
      - 'scripts/verify_customer_download_path.sh'
      - 'tests/test_the_sentinel_vocabulary_is_declared_and_complete.sh'
      - 'tests/test_no_function_is_called_before_it_is_defined.sh'
      - 'tests/test_doctor_probe_cap_exceeds_the_command.sh'
      - 'tests/test_installed_pipeline_packages_can_import_themselves.sh'
      - 'tests/test_a_failed_walk_must_not_exit_zero.sh'
      - 'scripts/walk_drive.py'
      - 'install.sh.strings.en-GB.sh'
      - 'tests/TEST_WIRING.tsv'
      - '.github/workflows/cold-box-source-truth.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same branch or PR.
  # NEVER cancels main: a cancelled main run is a gate that did not report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cold-box-truth:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      # fetch-depth 0: every one of these tests pins its negative control to
      # 45126e9a, the v1.0.63 cut commit -- the blob that actually shipped the
      # defect. A shallow clone cannot see it, and a control that cannot be
      # read reports CANNOT-RUN, which is not a pass.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: An empty owner email must not reach a shipped LaunchAgent
        run: bash tests/test_aiconv_agent_not_registered_without_owner_email.sh

      # Runtime, not structural: the defect is an ORDERING between a guard and
      # a fold, and both were present in the tree that shipped it. Needs
      # fetch-depth 0 above -- it executes the block from two pinned control
      # blobs and requires BOTH to reproduce the failure.
      - name: A source with no input must not fail the install
        if: always()
        run: bash tests/test_aiconv_without_owner_email_does_not_redden_health_check.sh

      - name: AI-conversations hydrate honesty (51 checks, 8 scenarios)
        if: always()
        run: bash tests/test_aiconv_hydrate_honesty.sh

      - name: Source status must report ONGOING state, not the install verdict
        if: always()
        run: bash tests/test_source_status_reports_ongoing_not_just_install.sh

      # httpx is imported by batch_resolver at module scope. rapidfuzz is
      # stubbed inside the test itself (it backs only the fuzzy strategies,
      # which this test never drives) so the run cannot degrade to CANNOT-RUN
      # on a machine without that wheel -- a CANNOT-RUN that becomes permanent
      # is how a gate stops gating.
      # A VENV, NOT `pip install` INTO THE SYSTEM PYTHON. The runner's python3
      # is externally managed (PEP 668) and refuses, which failed this job on
      # its first run. `--break-system-packages` would have silenced it by
      # doing exactly the thing that error exists to prevent, on a python the
      # rest of the job depends on.
      #
      # FROM THE PACKAGE'S OWN REQUIREMENTS FILE, not a hand-picked name. A
      # venv built from that file is the only thing that TESTS it, and
      # building one is how its two missing declarations (httpx, phonenumbers)
      # were found: every other environment already had them from a sibling
      # requirements file, so the list was short and nothing could see it.
      - name: Build a venv from identity_resolver's own requirements
        if: always()
        run: |
          set -euo pipefail
          python3 -m venv /tmp/convergetest
          /tmp/convergetest/bin/python -m pip install --quiet --upgrade pip
          /tmp/convergetest/bin/python -m pip install --quiet \
            -r vendor/cm041/identity_resolver/requirements.txt
          /tmp/convergetest/bin/python -c 'import httpx, phonenumbers; print("deps ok")'

      # PATH-first so the test's own `python3` resolves to the venv. The test
      # reports CANNOT-RUN (exit 2) rather than passing when a dependency is
      # missing, so a broken venv cannot read as a clean gate.
      - name: RULE 2 must be enforced on the CONVERGE path, not just resolve
        if: always()
        run: PATH="/tmp/convergetest/bin:$PATH" bash tests/test_converge_path_enforces_rule2.sh

      # v1063-D010. Line order IS the property: install.sh runs top to bottom,
      # so "later in the file" is "later in time" for two statements at the
      # same reachability. Its control is pinned to 661c00c9, the v1.0.64
      # tagged commit -- the tree that actually shipped the bad ordering.
      - name: The fda-rerun agent must load AFTER its binary exists
        if: always()
        run: bash tests/test_fda_rerun_agent_loads_after_its_binary.sh

      # An unrecorded consent decision must not read as a refusal. Its control
      # is the one that matters: `unknown` must never become `accepted`, which
      # would turn on a privacy-gated feature nobody agreed to.
      - name: Unknown consent is not declined, and never becomes accepted
        if: always()
        run: bash tests/test_unknown_consent_is_not_declined.sh

      # The RATCHET. reuse_settings skips every question whose answer lives
      # nowhere, so a new question that forgets to persist itself silently
      # reverts to its default on every re-run. Found three times one at a
      # time (paired_tokens, channels #619, consent); this catches the fourth
      # when it is written.
      # Runtime, not structural: half 1 renders the real config/.env writer and
      # reads it back; half 2 executes the reuse-completeness guard under four
      # environments, one of which is a CONTROL proving the guard is not so
      # wide that every non-EU install re-walks its questions forever.
      # WIRED 2026-09-04, and it had been failing since v1.0.11 where nobody
      # could see it. A test that fails where nobody looks is a file, not a
      # gate. It reports EVERY offender now rather than dying on the first:
      # allowlisting autologin_consent revealed autologin_password underneath,
      # so the old exit-on-first would have let a "fix" ship half done.
      # The harness is part of the evidence chain, so it gets a gate too. This
      # one is about EXIT CODES -- 2 for a setup gap, never 1 -- and no pattern
      # over the source can tell 2 from 1, so it executes the real case block.
      - name: A missing licence is CANNOT-RUN, not a build verdict
        if: always()
        run: bash tests/test_ttywalk_licence_preflight_is_cannot_run.sh

      # HERE AND NOT walk-record-gate.yml, WHICH IS WHERE IT BELONGS BY SUBJECT.
      # This suite drives /usr/libexec/PlistBuddy, which exists only on macOS.
      # On the ubuntu runner it returned an honest `CANNOT-RUN: no PlistBuddy`
      # (exit 2) and the job read that as a failure. CANNOT-RUN is a third
      # state and a runner that cannot host the instrument is not a verdict on
      # the subject. MEASURE ON THE HOST THAT RUNS IT.
      #
      # if: always() for the same reason as every other step here -- it is not
      # first, and a skipped step reads as no objection.
      - name: The artefact version read is a version, not a diagnostic
        if: always()
        run: /bin/bash scripts/tests/test_artefact_version_read_is_shaped.sh
      # The harness adjudicates, so the adjudication gets a gate. 1 and 2 are
      # indistinguishable to any pattern over the source, so this imports the
      # driver and calls adjudicate() with fixture homes.
      - name: A cancel the harness caused is not a build verdict
        if: always()
        run: bash tests/test_walk_driver_cancel_is_not_a_build_verdict.sh

      # The subshell that emits a phantom terminal marker also increments
      # its own copy of __OSTLER_FAILED_STEPS and then dies with it, while
      # the STEP_END it wrote stays on the marker wire. So a run can carry
      # a status=error step in its log AND failed_steps=0 in the marker
      # this driver grades. Grading the tally alone returned PASS.
      - name: A tally that contradicts the log is not a pass
        if: always()
        run: bash tests/test_a_tally_that_contradicts_the_log_is_not_a_pass.sh

      - name: An artefact walk stages the DMG payload, not the checkout
        if: always()
        run: bash tests/test_artefact_walk_stages_the_dmg_payload.sh

      # Walk 6 was killed at step 11 of 40 while PERFECTLY HEALTHY: a 3.5 GB
      # vane image pull writes nothing to the marker wire, and install.sh
      # itself logs that the silence is expected. A fixed log-silence cap
      # measures which STEP is running, not whether the box is wedged.
      - name: A slow step is not a wedged one
        if: always()
        run: bash tests/test_a_slow_step_is_not_a_wedged_one.sh

      - name: _ostler_consent_state is defined above its call sites (one function, not the class)
        if: always()
        run: bash tests/test_consent_state_is_defined_before_it_is_called.sh

      # #1540. The recovery key is minted, the DEK is wrapped under it, and the
      # key is never stored. So the run that MINTS it is the only run that can
      # ever hand it over: the keychain persists, and every later run takes
      # install.sh's "already configured" skip and emits nothing. install.sh
      # used to reveal it 15,490 lines after minting it, and the GUI presented
      # the reveal sheet only inside `finished == .ok`. Measured on archie2,
      # 2026-09-05: an attempt minted and failed, the next finished clean with
      # nothing to show, and `ostler-recovery` can never succeed for that box.
      - name: The recovery key is disclosed by the run that mints it, on both surfaces
        if: always()
        run: bash tests/test_the_recovery_key_is_disclosed_where_it_is_minted.sh

      # A flag that records "could not measure" must be READ by something.
      # v1.0.66 SHIPPED two that were assigned and consulted by nothing:
      # _HYDRATE_EMAIL_COUNTS_UNMEASURED and _AICONV_UNMEASURED. In both
      # cases the next lines turned the empty value into 0, so a counter
      # that COULD NOT RUN was published as a measured zero.
      - name: An UNMEASURED flag must be read by something
        if: always()
        run: bash tests/test_an_unmeasured_flag_must_be_read.sh

      # MEASURED on the v1.0.66 artefact walk: another account on the same
      # Mac was serving 11434, the bare loopback curl answered yes, and the
      # ONLY branch that writes com.ostler.ollama.plist was skipped. The
      # install shipped with no LaunchAgent and a dependency on a process it
      # does not own, while the step reported ok in zero seconds.
      - name: The Ollama agent must not depend on a foreign port
        if: always()
        run: bash tests/test_ollama_agent_does_not_depend_on_a_foreign_port.sh
      # D008: the SAME defect shape on the two colima stores. :6333 cannot be
      # closed the way :11434 was -- Qdrant and Oxigraph have no launchd
      # identity, so launchctl would answer a confident "absent" for a healthy
      # store, and Qdrant exempts /healthz from the api-key so a credential is
      # inert there. The ownership signal is `docker compose ps -q`, which
      # resolves the service inside OUR compose project.
      - name: Store health must not depend on a foreign port
        if: always()
        run: bash tests/test_store_health_does_not_depend_on_a_foreign_port.sh

      # CX-17. A customer whose install stops needs something stable to quote to
      # support, and the failure banner + auto-copied log carry the CODE, not the
      # localised sentence. This gate was written and then left unwired, so the two
      # bare `fail` sites it names sat in the shipped installer unseen.
      - name: Every install.sh failure carries a support code
        if: always()
        run: bash tests/test_every_fail_call_has_error_code.sh
      # #1497's class. PlistBuddy answers on STDOUT when it fails, so a capture
      # that ignores rc and tests [[ -n ]] reads a diagnostic as a value. In
      # _upg_ensure_token that means returning 0 without writing the service
      # token -- a silent skip of the upgrade, not a crash.
      - name: A PlistBuddy read takes its exit code
        if: always()
        run: bash tests/test_a_plistbuddy_read_takes_its_exit_code.sh

      # THE SINGLE-SITE TEST ABOVE IS WHY FIVE OTHER SITES WENT UNNOTICED.
      # It drives install.sh's _upg_ensure_token read and proves the CLASS is
      # real, which is valuable and is not coverage. This one is a CENSUS: it
      # finds every PlistBuddy read in install.sh and scripts/*.sh and requires
      # each to take an exit code or check a shape. A bare -n/-z check is not a
      # guard, because PlistBuddy answers on STDOUT when it fails.
      #
      # It refuses (CANNOT-RUN, exit 2) if it finds fewer than four sites: a
      # scan that stops matching how these reads are written would otherwise
      # report a clean census having examined nothing.
      - name: Every PlistBuddy read is guarded, not just the one with a test
        if: always()
        run: bash tests/test_every_plistbuddy_read_is_guarded.sh
      # The same writer/reader drift was found TWICE (sources 13/9,
      # statuses 5/3), both times by a human reading both sides. A literal
      # grep for status= MISSES error and timeout, because the error
      # recorder builds its status at runtime from an rc. So this EXECUTES
      # every recorder and asserts what it actually wrote is declared.
      - name: The sentinel vocabulary is declared and complete
        if: always()
        run: bash tests/test_the_sentinel_vocabulary_is_declared_and_complete.sh

      # THE CLASS. The step above pins ONE function; #1439 fixed that
      # instance and nothing stopped the next one. The sweep that found it
      # was a human reading 161 definitions, which cannot be re-run.
      #
      # This scans every top-level statement. It runs FIVE synthetic controls
      # first -- two that must FLAG, three that must MISS -- because the first
      # two versions of the analyser scored the KNOWN POSITIVE as clean: one
      # stripped "$( )" as if quoted text were not code, and one read a
      # `# <<< WORD` comment as a heredoc and went blind for 5,700 lines.
      - name: No function is called before it is defined (the CLASS)
        if: always()
        run: bash tests/test_no_function_is_called_before_it_is_defined.sh
      - name: The doctor probe cap exceeds the command it wraps
        if: always()
        run: bash tests/test_doctor_probe_cap_exceeds_the_command.sh

      - name: Installed pipeline packages can import themselves
        if: always()
        run: bash tests/test_installed_pipeline_packages_can_import_themselves.sh

      - name: A failed walk must not exit zero
        if: always()
        run: bash tests/test_a_failed_walk_must_not_exit_zero.sh

      - name: No question may stall a walk-away install
        if: always()
        run: bash tests/test_walkaway_no_phase2_input_leak.sh

      # Found by walk 5 of v1.0.65 on a cold account. Runtime, and it has to
      # be: the defect is an EXIT STATUS produced by a pipeline under
      # `set -Eeuo pipefail`, and nothing in the source text distinguishes the
      # broken form from the fixed one -- both end in sed.
      # Found by TNM by EXECUTION: he seeded a tree, ran the decline arm, and
      # counted zero survivors while the script printed "nothing was written
      # to your Mac". A grep would not have found it, so this test seeds and
      # counts too.
      - name: Declining must not wipe an install that was already there
        if: always()
        run: bash tests/test_decline_does_not_wipe_an_existing_install.sh

      # The SECOND lock on the same arm. #1437's guard is the primary defence and
      # is tested by execution above; this one pins the emergent binding its own
      # source comment warned "a later change could quietly reverse".
      - name: A promote before the decline arms is gated on SKIP_PHASE2
        if: always()
        run: bash tests/test_a_promote_before_the_decline_arms_is_gated.sh

      - name: An absent config key must not abort the install
        if: always()
        run: bash tests/test_config_reader_absence_does_not_abort_the_install.sh

      - name: Consent decisions must survive a reuse run
        if: always()
        run: bash tests/test_consent_decisions_survive_a_reuse_run.sh

      - name: Every question must declare what happens to its answer
        if: always()
        run: bash tests/test_every_question_declares_its_persistence.sh
