name: new-tests-must-be-wired

# A TEST ADDED BY A PR MUST BE INVOKED BY THAT PR.
#
# The estate found four test suites in a single day that existed, passed, and
# were run by nothing. The standing wiring gate cannot stop that: it counts
# NAME MENTIONS rather than invocations (#688), and it is a ratchet that
# grandfathered the ~128 already-dark as an accepted baseline (#675).
#
# This one is diff-scoped on purpose. It ignores the backlog entirely and makes
# it impossible for a NEW dark test to be born. The backlog burns down
# separately.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: new-tests-wired-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  new-tests-wired:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is LOAD-BEARING. The gate asks git for the merge-base
      # with origin/main, and a shallow clone has no merge-base to find -- it
      # would return CANNOT-RUN (rc=3) on every PR, which is honest but useless.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure origin/main is present for the merge-base
        run: git fetch origin main --quiet || true

      # The gate's own controls run FIRST. A gate whose predicate is broken
      # should fail here, on its own controls, rather than by silently passing
      # every PR downstream.
      #
      # The comment-stripper is the FIRST of those controls, because both gates
      # below are only as honest as it is. Strip too little and a comment
      # becomes an invocation, which is #688 rebuilt by hand.
      - name: The comment-stripper knows a quoted # from a comment
        run: /bin/bash scripts/tests/test_comment_strip_is_quote_aware.sh

      # The SECOND half of what the shared library decides. The stripper above
      # says what the gates may look at; this says what counts as RUNNING it.
      # Both false greens it pins were live on main until #861: `bash -n` is a
      # parse, and the unanchored verb matched the `sh` inside "shipping".
      #
      # if: always() for the same reason as the step below -- it is not first,
      # so without it an earlier failure would SKIP it, and a skipped step reads
      # as no objection.
      - name: An invocation is an execution, not a parse or a near-miss word
        if: always()
        run: /bin/bash scripts/tests/test_invocation_predicate_rejects_non_execution.sh

      # The other direction of the same predicate. The step above pins what must
      # NOT count (a parse, a near-miss word, inline -c code); this pins what
      # MUST -- a bare `python3 <file>`, which the predicate scored DARK until
      # #791. Both halves belong in one job so a change to has_verb() cannot
      # satisfy one and break the other unnoticed.
      #
      # Carries its own DEMONSTRATED RED: it rebuilds the pre-fix predicate from
      # its literal source and requires the bare form to miss, so this step
      # fails loudly if someone reverts the rule rather than passing vacuously.
      #
      # if: always() for the same reason as every other step here -- it is not
      # first, and a skipped step reads as no objection.
      - name: A bare `python3 <file>` IS an execution
        if: always()
        run: /bin/bash scripts/tests/test_invocation_predicate_sees_bare_python.sh

      # if: always() because this step is no longer FIRST in the job. Adding the
      # stripper control above it made it maskable -- a failure there would skip
      # this one, and a skipped step reads as "no objection", which is the whole
      # family of defect this workflow exists to remove. ci-maskless caught it.
      - name: The gate can tell an invocation from a comment mention
        if: always()
        run: /bin/bash scripts/tests/test_new_tests_are_wired_predicate.sh

      - name: Every test this change adds is invoked by this change
        run: /bin/bash scripts/verify_new_tests_are_wired.sh

      # THE OTHER HALF OF THIS WORKFLOW'S SUBJECT.
      #
      # The gate above is diff-scoped: it catches a NEW test that nothing
      # invokes. It cannot see a test that was wired last month and quietly
      # unwired today, and its substring predicate is also satisfied by a bare
      # `paths:` trigger entry.
      #
      # Measured 2026-08-19: removing the invocation of
      # tests/test_no_data_is_not_success.sh while leaving its paths: line in
      # place was caught by NOTHING -- verify_test_wiring.sh reported "no test
      # file is newly unwired" and its regeneration diff was identical.
      #
      # This step guards a short, explicit register of tests that pin defects
      # which already cost a cut or reached a box, and it requires an EXECUTION
      # VERB on the same line, so a trigger entry cannot satisfy it.
      #
      # if: always() so a failure in the step above cannot silence this one. A
      # skipped check reads as "no objection", which is the whole family of
      # defect this workflow exists to remove.
      - name: Critical tests must stay INVOKED, not merely mentioned
        if: always()
        run: bash scripts/verify_critical_tests_stay_invoked.sh
