# Ongoing Spotify listening (CM051 "Spotify ongoing"): the osascript answers
# (playing, paused, not running, permission denied), the 30 s rule, dedupe,
# the real CM019 parser and pipeline, the Doctor row, and the shipped Swift
# compiled and run against a stub osascript. macOS so swiftc exists and the
# Swift leg runs rather than skips. Synthetic data only; no real osascript.
name: spotify-live

on:
  push:
    branches: [main]
    paths:
      - 'vendor/ostler_fda/spotify_live.py'
      - 'gui/OstlerInstaller/Auth/SpotifyLiveMode.swift'
      - 'gui/OstlerInstaller/App.swift'
      - 'vendor/doctor/agent/web_ui.py'
      - 'vendor/cm019_preferences/services/ingest/src/parsers/spotify.py'
      - 'tests/test_spotify_live.py'
      - 'install.sh'
      - '.github/workflows/spotify-live.yml'
  pull_request:
    paths:
      - 'vendor/ostler_fda/spotify_live.py'
      - 'gui/OstlerInstaller/Auth/SpotifyLiveMode.swift'
      - 'gui/OstlerInstaller/App.swift'
      - 'vendor/doctor/agent/web_ui.py'
      - 'vendor/cm019_preferences/services/ingest/src/parsers/spotify.py'
      - 'tests/test_spotify_live.py'
      - 'install.sh'
      - '.github/workflows/spotify-live.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  spotify-live:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest and the vendored CM019 ingest dependencies
        run: python -m pip install --quiet pytest -r vendor/cm019_preferences/requirements.txt
      - name: Poll, 30 s rule, dedupe, Doctor row, Swift against a stub osascript
        run: |
          n="$(python -m pytest tests/test_spotify_live.py --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 45 ]; then
            echo "REFUSING: expected at least 45 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python -m pytest tests/test_spotify_live.py -v -rs
