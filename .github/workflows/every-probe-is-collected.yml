name: every-probe-is-collected

# Every probe-shaped script must actually be COLLECTED, or exempted with a
# written reason.
#
# Andy, 2026-09-05: "surely we need to make sure all the instruments work as
# well, so I'd actually rather we count them in the manifest." A broken
# instrument is how a customer defect survives, so an apparatus defect is not
# DEFER-able on the grounds of being apparatus.
#
# MEASURED: run_box_walk.sh:42 sets PROBE_DIR="$HERE/probes" and line 83 globs
# "$PROBE_DIR"/*.sh, while acceptance_gate_v1013.sh sits one directory above
# it. cut-manifests/README.md records that exact shape as this project's worst
# measurement failure -- people_seed_and_retrieval sat outside the same glob,
# the manifest row was its only caller, and FOURTEEN CUTS reported a gate that
# measured nothing.
#
# The exemption list is deliberately not a skip list: an entry needs a reason,
# and an entry naming a file that no longer exists is itself a failure, because
# a stale exemption protects nothing and hides the next file to take its name.

on:
  pull_request:
    paths:
      - 'scripts/box_walk_probes/**'
      - 'tests/test_every_probe_on_disk_is_collected.py'
      # Wired 2026-09-17. Two probes embed the same /ws/chat client, on
      # purpose ("so the probe cannot half-exist on a box"). This guard is
      # the GUARD half, listed so editing the test re-runs the test.
      - 'tests/test_the_two_ws_clients_are_identical.sh'
      # Wired 2026-09-23. assistant_grounds_the_opening_turn defined its body
      # as probe_main(), the name of the dispatcher in lib/probe.sh, so every
      # --self-test ran the measurement instead and exited 78. The walk marked
      # it BROKEN and skipped it, and nothing else in the suite could see a
      # wrong function name. Listed so editing the test re-runs the test.
      - 'tests/test_no_probe_shadows_the_dispatcher.sh'
      - '.github/workflows/every-probe-is-collected.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same branch or PR.
  # NEVER cancels main: a cancelled main run is a gate that did not report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  every-probe-is-collected:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Reads the collector's OWN PROBE_DIR rather than assuming it, so the gate
      # cannot pass by measuring a directory the runner stopped using. An empty
      # probe set exits 2 CANNOT-RUN, because a wrong path and a genuinely empty
      # directory print identically. Proved to fire by planting a stray script.
      - name: Every probe is collected, or exempted with a reason
        run: python3 tests/test_every_probe_on_disk_is_collected.py

      - name: The two embedded ws clients have not drifted
        # assistant_answers_grounded.sh and assistant_grounds_the_opening_turn.sh
        # both embed _ws_client_py() rather than sourcing it, for the reason the
        # first one states: a shipped-alongside client lets the probe half-exist
        # on a box. A copy is allowed here; drifting silently is not. Same
        # pattern as install.sh's embedded copy of lib/ostler-resource-tier.sh,
        # whose drift guard caught a comment fixed in the wrong file of the pair.
        # if: always() -- ci-maskless (#1695): without it a red earlier in the
        # same job SKIPS this step, and a skipped test reports nothing at all.
        if: always()
        run: /bin/bash tests/test_the_two_ws_clients_are_identical.sh

      - name: No probe shadows the dispatcher, and every probe has a negative control
        # lib/probe.sh:338 owns probe_main(). A probe that redefines that name
        # shadows the dispatcher, so --self-test and --describe run the
        # measurement body instead of the control -- which is how
        # assistant_grounds_the_opening_turn came back 78 where 1 was expected,
        # was marked BROKEN, had its phase 2 skipped, and never produced a
        # verdict on any walk. The probe was collected, parsed and manifested;
        # only the function name was wrong, and nothing could see it.
        # if: always() -- ci-maskless (#1695): a red earlier in the same job
        # would otherwise SKIP this step, and a skipped test reports nothing.
        if: always()
        run: /bin/bash tests/test_no_probe_shadows_the_dispatcher.sh
