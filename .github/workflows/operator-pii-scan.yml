name: operator-pii-scan

# Runs the cross-repo operator-PII scanner against the PR diff. Fails the
# build on any hit so the class-of-leak surfaced 2026-05-13 (operator real
# PII in customer-shipping repos) cannot recur silently.
#
# Inventory source (hybrid):
#   1. If the OPERATOR_PII_INVENTORY GitHub secret is set, its contents are
#      written to $HOME/.ostler-operator-pii.toml verbatim (preferred -- the
#      full operator inventory, with phone digits + email domains).
#   2. Otherwise, .github/operator-pii-inventory.toml is used (committed
#      template; safe to leave phone/email empty; brands/family/paths
#      remain effective).
#
# Scanner: bundled at .github/scripts/operator-pii-scan.sh by
# bin/install-pii-guards.sh. Re-run the installer to refresh it after
# scanner updates in HR015.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  scan:
    runs-on: ubuntu-latest
    # A GATE THAT CANNOT FINISH MUST FAIL, NOT HANG.
    #
    # This workflow is a REQUIRED check. Without a deadline a stalled step
    # blocks the PR for GitHub's default 360 minutes, and a hang is
    # indistinguishable from "still working" on every surface a reviewer sees:
    # no failure, no annotation, just a spinner. That happened on 2026-08-18,
    # run 32170773072, which sat 33 minutes on `apt-get update` before anyone
    # looked.
    #
    # 10 minutes is chosen from MEASURED history, not taste. The last 19
    # completed runs ranged 32s to 75s, so this is roughly 8x the slowest real
    # run: generous enough that a merely slow runner still passes, tight enough
    # that a stall surfaces in minutes rather than hours.
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch (with merge-base history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ripgrep
        # apt is not a dependency we control. It stalled on a mirror for 33
        # minutes on 2026-08-18 (run 32170773072, PR #844); the 5-minute bound
        # added then stopped the hang but not the failure, and this step went
        # on to fail twice more on 2026-08-19 (runs 32273393597, 32275924754),
        # blocking the ONE enforced cut RED both times. A timeout converts an
        # outage into a faster outage.
        #
        # Order is cheapest-and-most-reliable first:
        #   1. already on the runner (ubuntu-latest usually ships it)
        #   2. the upstream static binary, one HTTPS GET, no package index
        #   3. apt last, and only if both above fail
        #
        # Bound stays. If all three fail this must go red, not fall through to
        # a scan that examines nothing: an operator-PII scan that cannot run is
        # a false clean, which is the failure mode this whole job exists to
        # prevent.
        timeout-minutes: 5
        run: |
          set -euo pipefail

          if command -v rg >/dev/null 2>&1; then
              echo "ripgrep already present: $(rg --version | head -1)"
              exit 0
          fi

          RG_VER=14.1.1
          RG_TGZ="ripgrep-${RG_VER}-x86_64-unknown-linux-musl"
          echo "ripgrep absent; fetching the static ${RG_VER} binary"
          if curl -fsSL --max-time 90 --retry 2 \
                "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VER}/${RG_TGZ}.tar.gz" \
                -o /tmp/rg.tar.gz \
             && tar -xzf /tmp/rg.tar.gz -C /tmp \
             && sudo install -m 0755 "/tmp/${RG_TGZ}/rg" /usr/local/bin/rg; then
              echo "ripgrep installed from upstream release: $(rg --version | head -1)"
              exit 0
          fi

          echo "static download failed; falling back to apt" >&2
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          command -v rg >/dev/null 2>&1 || {
              echo "::error::ripgrep unavailable by all three routes. Failing rather than scanning with a missing tool -- a PII scan that cannot run must never report clean." >&2
              exit 1
          }
          echo "ripgrep installed via apt: $(rg --version | head -1)"

      - name: Materialise PII inventory
        env:
          OPERATOR_PII_INVENTORY: ${{ secrets.OPERATOR_PII_INVENTORY }}
        run: |
          set -euo pipefail
          if [ -n "${OPERATOR_PII_INVENTORY:-}" ]; then
              printf '%s' "$OPERATOR_PII_INVENTORY" > "$HOME/.ostler-operator-pii.toml"
              echo "Inventory source: OPERATOR_PII_INVENTORY secret (full)"
          elif [ -f .github/operator-pii-inventory.toml ]; then
              cp .github/operator-pii-inventory.toml "$HOME/.ostler-operator-pii.toml"
              echo "Inventory source: committed .github/operator-pii-inventory.toml"
              echo "  (phone/email checks effective only if secret is set)"
          else
              echo "::error::No PII inventory available (no OPERATOR_PII_INVENTORY secret, no .github/operator-pii-inventory.toml)"
              echo "Run bin/install-pii-guards.sh from the HR015 - Gaming PC repo to provision it." >&2
              exit 1
          fi

      - name: Build PR-diff staging dir
        id: stage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          STAGE_DIR="$(mktemp -d -t operator-pii-XXXXXX)"
          COUNT=0
          while IFS= read -r f; do
              [ -z "$f" ] && continue
              [ -f "$f" ] || continue
              dest="$STAGE_DIR/$f"
              mkdir -p "$(dirname "$dest")"
              cp "$f" "$dest"
              COUNT=$((COUNT + 1))
          done < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD)
          echo "stage_dir=$STAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Staged $COUNT changed file(s) for scan."

      - name: Skip scan (no changed files)
        if: ${{ steps.stage.outputs.count == '0' }}
        run: echo "No tracked files changed in this PR; scan skipped."

      # Prove the shape scan asks the right question BEFORE trusting its answer.
      # These five cases pin its SCOPE, not its patterns: a phone added by the
      # change is RED, a phone that merely pre-exists in a touched file is not,
      # and a rename carrying a phone is still RED so the narrowing is not a
      # bypass. Runs before the scan so a scope regression is named as a scope
      # regression rather than surfacing later as an inexplicable red or, worse,
      # an inexplicable green.
      - name: Prove ci-pii-shape-scan scope
        run: bash tests/test_pii_shape_scan_scope.sh

      # Prove the PATTERNS, having just proved the SCOPE. The two are separate
      # questions and this repo answered only the first for weeks: the scope
      # test pinned WHICH LINES get asked, and nothing at all pinned WHAT gets
      # asked of them. The library sat at five of seven built-ins, the missing
      # pair being email and the macOS home path, and every run printed a
      # confident "5 pattern(s) loaded" while the scan was structurally unable
      # to see the operator-path class.
      #
      # The library declares its own expected built-in count. Until this step
      # existed here, that declaration was a comment: nothing in THIS repo
      # compared it to what actually loads, so the contract travelled with the
      # file and the enforcement did not.
      - name: Prove the pattern library (declared floor + merge + validation)
        run: bash .githooks/test_pii_patterns.sh

      # The check that CAN run here. Runs FIRST and unconditionally, because it
      # needs no inventory: it matches PII by SHAPE, and it carries its own
      # canary so it refuses to report clean when its detector loaded nothing.
      # This is the step that actually gates the PR.
      - name: Run ci-pii-shape-scan
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          SHAPE=".github/scripts/ci-pii-shape-scan.sh"
          if [ ! -x "$SHAPE" ]; then
              echo "::error::Shape scan not found at $SHAPE."
              echo "Run bin/install-pii-guards.sh from the HR015 - Gaming PC repo to provision it."
              exit 1
          fi
          set +e
          "$SHAPE"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
              echo "::error::ci-pii-shape-scan failed (exit $status). See output above." >&2
              exit "$status"
          fi

      - name: Run operator-pii-scan
        if: ${{ steps.stage.outputs.count != '0' }}
        run: |
          set -euo pipefail
          SCANNER=".github/scripts/operator-pii-scan.sh"
          if [ ! -x "$SCANNER" ]; then
              echo "::error::Scanner not found at $SCANNER."
              echo "Run bin/install-pii-guards.sh from the HR015 - Gaming PC repo to provision it."
              exit 1
          fi
          # Scanner exits 0 = clean, 1 = hits, 2 = inventory issue, 3 = rg missing.
          #
          # The status MUST be captured from the scanner itself. The previous
          # form was `if ! "$SCANNER" ...; then status=$?` -- and inside that
          # branch `$?` is the status of the NEGATION, which is always 0. So
          # `exit "$status"` was `exit 0` and this job passed on EVERY scanner
          # failure, real PII hits included. It printed "failed (exit 0)",
          # which was the tell. Fixed at source in HR015 (template +
          # bin/test_pii_scan_wiring.sh); this is the installed copy.
          set +e
          "$SCANNER" "${{ steps.stage.outputs.stage_dir }}"
          status=$?
          set -e
          # Exit 2 is NOT a PR failure and NOT a pass. It means this denylist
          # could not run, which in CI is the DESIGNED state: the inventory is
          # Andy's real PII, so it cannot be committed, and the fallback at
          # .github/operator-pii-inventory.toml is a blank template (every
          # scalar empty, every array empty). Reporting that as a PII hit is a
          # false accusation on every pull request, and a red that means
          # nothing is one people learn to route around.
          # The shape scan above is what gates the PR, and it always runs.
          if [ "$status" -eq 2 ]; then
              echo "operator-pii-scan: NOT RUN (exit 2, no usable inventory in CI)."
              echo "  This is expected without the OPERATOR_PII_INVENTORY secret."
              echo "  It is NOT a clean result: this denylist examined nothing."
              echo "  PR gating is done by ci-pii-shape-scan, which ran above."
              exit 0
          fi
          if [ "$status" -ne 0 ]; then
              echo "::error::operator-pii-scan failed (exit $status). See output above." >&2
              exit "$status"
          fi
          echo "operator-pii-scan: clean (${{ steps.stage.outputs.count }} files scanned against a real inventory)"

      # ── The person-name guard, which was DARK until 2026-08-29 ──────────
      #
      # CM051 #1242 landed bin/pii_name_guard.py and closed 189 findings.
      # Nothing ran it. Measured on main: named in ZERO workflows, ZERO git
      # hooks, ZERO rows of TEST_WIRING.tsv. Its only invoker anywhere in the
      # repo was scripts/run_all_cut_gates.sh -- and that runner is itself
      # invoked by nothing (#449, settled by TNM). So a guard that took 189
      # findings to zero has never once run in CI, and its clean verdict has
      # been a claim rather than a measurement since the day it merged.
      #
      # HOW THAT MEASUREMENT WAS TAKEN, because my first attempt was wrong.
      # An "is it executed" grep shaped like `(python3|bash) <name>` returned 0
      # for this guard -- but it ALSO returned 0 for operator-pii-scan, which
      # demonstrably runs in the step above. A predicate that scores its own
      # control at zero cannot support a DARK verdict, so it was discarded.
      # The surviving instrument is "named anywhere in .github/workflows",
      # which scores the control 9 and this guard 0. That one discriminates.
      #
      # WHY HERE. This job already runs on EVERY pull request with no paths
      # filter, so nothing about what stops a launch changes: a guard is added
      # to a workflow that already gates. And this guard is WHOLE-TREE, not
      # diff-scoped, so unlike ci-pii-shape-scan it can see what is already on
      # main (the #362 blind spot) rather than only what this PR touched.
      #
      # if: always() so a failure in the steps above cannot delete this
      # measurement (#656). CANNOT-RUN is reported as itself, never as clean.
      - name: Person-name guard, whole tree (#1242, wired #449)
        if: always()
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
              echo "::error::pii-name-guard CANNOT RUN: no python3 on this runner." >&2
              echo "  That is not a clean result. It examined nothing." >&2
              exit 2
          fi
          set +e
          python3 bin/pii_name_guard.py --root .
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
              echo "pii-name-guard: clean, and it actually ran."
              exit 0
          fi
          echo "::error::pii-name-guard failed (exit $status). See the counts above." >&2
          exit "$status"
