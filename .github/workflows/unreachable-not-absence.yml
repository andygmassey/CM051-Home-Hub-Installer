name: unreachable-not-absence

# TWO JOBS, ONE PROPERTY: a thing we could not look at must never be recorded
# as a thing that is not there.
#
#   honesty      an unreachable WEB SERVICE recorded as a missing book (#833)
#   denied-read  a refused FILESYSTEM READ recorded as a missing bundle
#                (v1.0.46 BOM row 6)
#   driver-not-box
#                a probe that could not REACH the box recording that the
#                service on it was down (v1.0.100 and v1.0.101 walks)
#
# Same defect class, three ends of the estate. They share a workflow so that
# none can be quietly dropped without the others' names showing up in the
# diff.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same branch or PR.
  # NEVER cancels main: a cancelled main run is a gate that did not report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  honesty:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: an unreachable source must never be recorded as absent
        run: bash tests/test_unreachable_is_not_absence.sh
