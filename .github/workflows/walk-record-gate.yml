name: walk-record-gate

# #844 -- NOTHING BETWEEN "GATES GREEN" AND "CUSTOMER DOWNLOAD" IS A RUNTIME
# PROOF.
#
# Every other gate in this repo measures the ARTEFACT: it hashes, it staples,
# it checks signatures. All of that can pass on a DMG that installs to a broken
# machine, because none of it has ever been installed. The only runtime proof
# in the estate is the box walk -- every probe in probes/, each with a negative
# control -- and
# measured on origin/main 2026-08-23 NOTHING INVOKED IT:
#
#   OS003 bin/ pipeline/ gates/ .github/   post_walk_qa   0 hits
#                                          run_box_walk   0 hits
#     CONTROL, same dirs, same grep        verify_must_contain  bin/cut.sh:368
#
#   CM051, every reference to post_walk_qa.sh: its own usage string, and the
#   README. Nothing executable.
#
# The probes cannot run on a runner -- they need an installed, walked box, and
# a box only exists after a DMG is published. So the fix is not a call, it is
# a record-and-gate: the walk writes evidence, and publish_release.sh refuses
# to repoint ostler.ai/install.dmg without it. This workflow guards the gate.
#
# It runs on ubuntu-latest. macos-latest bills at 10x and nothing here needs
# macOS: the test drives shell scripts over fixture files.

on:
  pull_request:
    paths:
      - 'scripts/verify_walk_record.sh'
      - 'scripts/publish_release.sh'
      - 'scripts/post_walk_qa.sh'
      - 'scripts/box_walk_probes/**'
      - 'tests/test_walk_record_gates_customer_download.sh'
      - 'tests/test_probe_absence_is_not_an_answer.sh'
      # Same rule as the workflow-self-trigger below, applied to a test: a
      # suite this workflow RUNS but does not WATCH is dark on self-edit --
      # it could be narrowed, or gutted, in a PR that never runs it. I added
      # the step without this line and verify_invoked_tests_are_watched.py
      # caught it: "1 file(s) are DARK ON SELF-EDIT".
      - 'tests/test_post_walk_qa_measures_the_artefact.sh'
      # The BOM-verdict gate rides on the SAME promote decision this workflow
      # guards, so it belongs in the same watch set. #1322 shipped the gate
      # with zero call sites; the test below is what makes that state fail.
      - 'scripts/verify_must_contain_has_box_verdict.sh'
      - 'tests/test_bom_verdict_gate_is_wired_into_the_promote.sh'
      - 'cuts/**/MUST_CONTAIN.tsv'
      # The walk DRIVER and its three suites. Same self-edit rule as above:
      # the driver is the thing that decides whether a walk passed, so a
      # change to it must run the suites that judge it.
      - 'scripts/walk_drive.py'
      - 'tests/test_walk_driver_does_not_inherit_a_stale_result.sh'
      - 'tests/test_walk_driver_requires_a_completion_marker.sh'
      - 'tests/test_walk_driver_takes_ports_from_the_declared_field.sh'
      - 'tests/test_walk_pass_requires_zero_failed_steps.sh'
      # A gate must trigger on changes to ITSELF, or it can be quietly
      # narrowed in the very PR that narrows it.
      - '.github/workflows/walk-record-gate.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  walk-record-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The customer download cannot be repointed to an unwalked build
        run: bash tests/test_walk_record_gates_customer_download.sh

      # A probe that reads an absent path as a definite answer is worse than a
      # probe that fails: it reports a confident verdict about something it
      # never measured. pair_state_agreement did exactly that on 2026-08-26 --
      # an absent ~/.ostler/paired_devices counted 0 and returned "nothing is
      # paired" on a box holding 35 issued bearer tokens.
      # `if: always()` so this still reports when the suite above is red.
      - name: An absent path is UNAVAILABLE, never a count of zero
        if: always()
        run: bash tests/test_probe_absence_is_not_an_answer.sh

      # #931 -- THE WRITER HALF. The gate above refuses a record that does not
      # name the build it was taken on. It is only as good as the writer that
      # feeds it: if post_walk_qa.sh cannot produce a measured artefact_sha256,
      # every future walk records asserted-unverifiable, the reader returns 2,
      # PROMOTE=0, and a human has burned a box walk for nothing.
      #
      # The measured path talks to a box over ssh and a box only exists after a
      # DMG is published, which is why the branch shipped unproven. `ssh` is
      # resolved through the shell, so the test shadows it with a function and
      # every branch becomes reachable here with no box and no credentials.
      #
      # rc=2 IS NOT rc=1. 2 means the harness could not locate its anchors and
      # measured nothing; 1 means the writer misbehaved. #1239 exists because a
      # gate reported a shell problem as a product defect and sent someone to
      # debug the product. Both are red; they must not read the same.
      # `if: always()` for the same reason as the arms around it.
      - name: The walk record must MEASURE the artefact, not assert it
        if: always()
        run: |
          set -uo pipefail
          bash tests/test_post_walk_qa_measures_the_artefact.sh
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The writer harness could not locate its anchors in scripts/post_walk_qa.sh. NOTHING about the writer has been measured. Do not debug post_walk_qa.sh on the strength of this line -- re-point the anchors in tests/test_post_walk_qa_measures_the_artefact.sh, and do not delete the arms."
          fi
          exit "$rc"

      # ── THE WALK DRIVER ────────────────────────────────────────────────
      #
      # Everything above judges the RECORD. These judge the thing that
      # produces it. The driver was promoted into this repo on 2026-08-29
      # from a single copy on one machine; each suite guards one of the
      # three defects found on the way in, and each was proved RED against
      # the original 283-line file before the fix went in.
      #
      # Every suite ends in an ANTI-VACUITY arm that mutates the driver to
      # remove the fix and requires the defect to come back. If an anchor
      # moves, that arm exits 2 and says so rather than passing quietly --
      # so re-point the anchor, never delete the arm.
      #
      # `if: always()` throughout, for the reason given at the arms above: a
      # suite skipped because an earlier one went red tells you nothing, and
      # these three are independent of each other.
      - name: A dead walk must not publish the previous walk's verdict
        if: always()
        run: |
          set -uo pipefail
          bash tests/test_walk_driver_does_not_inherit_a_stale_result.sh
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The stale-result harness could not set itself up or its mutation anchor has moved. NOTHING about the driver has been measured."
          fi
          exit "$rc"

      - name: PASS requires positive evidence of completion, never rc=0
        if: always()
        run: |
          set -uo pipefail
          bash tests/test_walk_driver_requires_a_completion_marker.sh
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The completion-marker harness could not set itself up or its mutation anchor has moved. NOTHING about the driver has been measured."
          fi
          exit "$rc"

      - name: The port list comes from the declared field, and empty refuses
        if: always()
        run: |
          set -uo pipefail
          bash tests/test_walk_driver_takes_ports_from_the_declared_field.sh
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The declared-port harness could not set itself up or its mutation anchor has moved. NOTHING about the driver has been measured."
          fi
          exit "$rc"

      # A WALK EXISTS TO FIND DEFECTS AND CANNOT PASS OVER ONE IT WAS TOLD
      # ABOUT. Measured on ttywalk run 3: the marker read
      # `status=ok failed_steps=1 errors=0`, the failed step was health_check
      # (status=error rc=2), and the driver printed WALK PASS. status=ok and
      # failed_steps answer DIFFERENT questions by design (#839) -- reached the
      # end vs did every step work -- and reading only the first commits the
      # same collapse the product was blamed for, from the instrument side.
      - name: PASS requires zero failed steps, and an absent tally is CANNOT-RUN
        if: always()
        run: |
          set -uo pipefail
          bash tests/test_walk_pass_requires_zero_failed_steps.sh
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The failed-steps harness could not import the driver or the driver stopped exporting adjudicate/PASS/FAIL/CANNOT_RUN. NOTHING about the driver has been measured."
          fi
          exit "$rc"

      # The suite above proves the gate REFUSES correctly. This proves it can
      # still say yes on the real script, from the real repo root, with no
      # fixture directory override -- a gate that only ever refuses would pass
      # a suite made entirely of refusals, and would also block every release.
      # `if: always()` -- a control is most informative on a RED run. If the
      # suite above fails and this is skipped, you cannot tell "the gate is
      # correctly refusing" from "the gate refuses everything", which is the
      # exact ambiguity the control exists to remove.
      - name: POSITIVE CONTROL -- the gate accepts a genuine clean record
        if: always()
        run: |
          set -euo pipefail
          mkdir -p walks
          # The sha is DERIVED from a real file rather than typed, so this
          # control cannot pass by two hardcoded constants matching each other.
          # It is the positive-control analogue of #931 itself: a value checked
          # against itself always agrees.
          printf 'ostler citest artefact\n' > /tmp/citest-artefact.bin
          CITEST_SHA="$(sha256sum /tmp/citest-artefact.bin | awk '{print $1}')"
          printf 'version\tv0.0.0-citest\n'      >  walks/v0.0.0-citest.tsv
          printf 'version_source\tmeasured(CFBundleShortVersionString, matches argument)\n' >> walks/v0.0.0-citest.tsv
          printf 'artefact_sha256\t%s\n' "$CITEST_SHA" >> walks/v0.0.0-citest.tsv
          printf 'artefact_sha256_source\tmeasured(shasum -a 256 of the citest artefact)\n' >> walks/v0.0.0-citest.tsv
          printf 'walked_at\t2026-01-01T00:00:00Z\n' >> walks/v0.0.0-citest.tsv
          printf 'box_fp\tcitestcitest0000\n'    >> walks/v0.0.0-citest.tsv
          printf 'pass\t14\n'                    >> walks/v0.0.0-citest.tsv
          printf 'fail\t0\n'                     >> walks/v0.0.0-citest.tsv
          printf 'cannot_run\t0\n'               >> walks/v0.0.0-citest.tsv
          printf 'broken\t0\n'                   >> walks/v0.0.0-citest.tsv
          printf 'verdict\tCLEAN\n'              >> walks/v0.0.0-citest.tsv
          printf 'qa_exit\t0\n'                  >> walks/v0.0.0-citest.tsv
          bash scripts/verify_walk_record.sh v0.0.0-citest "$CITEST_SHA"
          rm -f walks/v0.0.0-citest.tsv /tmp/citest-artefact.bin

      # 🔴 #1322 SHIPPED THE BOM-VERDICT GATE WITH ZERO CALL SITES. The script
      # was 137 lines and nothing ran it -- measured by grepping for its own
      # name and getting zero, with verify_walk_record as the control showing
      # the grep worked. Same class as #449. This step is what makes that
      # state RED instead of invisible.
      #
      # `if: always()` is REQUIRED: a red in an earlier step would otherwise
      # SKIP this one, and a gate that does not report is indistinguishable
      # from a gate that passed. It shares no state with the steps above.
      - name: The BOM-verdict gate is invoked by the promote, not merely present
        if: always()
        run: bash tests/test_bom_verdict_gate_is_wired_into_the_promote.sh
