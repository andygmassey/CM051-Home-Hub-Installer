name: walk-record-gate

# #844 -- NOTHING BETWEEN "GATES GREEN" AND "CUSTOMER DOWNLOAD" IS A RUNTIME
# PROOF.
#
# Every other gate in this repo measures the ARTEFACT: it hashes, it staples,
# it checks signatures. All of that can pass on a DMG that installs to a broken
# machine, because none of it has ever been installed. The only runtime proof
# in the estate is the box walk -- every probe in probes/, each with a negative
# control -- and
# measured on origin/main 2026-08-23 NOTHING INVOKED IT:
#
#   OS003 bin/ pipeline/ gates/ .github/   post_walk_qa   0 hits
#                                          run_box_walk   0 hits
#     CONTROL, same dirs, same grep        verify_must_contain  bin/cut.sh:368
#
#   CM051, every reference to post_walk_qa.sh: its own usage string, and the
#   README. Nothing executable.
#
# The probes cannot run on a runner -- they need an installed, walked box, and
# a box only exists after a DMG is published. So the fix is not a call, it is
# a record-and-gate: the walk writes evidence, and publish_release.sh refuses
# to repoint ostler.ai/install.dmg without it. This workflow guards the gate.
#
# It runs on ubuntu-latest. macos-latest bills at 10x and nothing here needs
# macOS: the test drives shell scripts over fixture files.

on:
  pull_request:
    paths:
      - 'scripts/verify_walk_record.sh'
      - 'tests/test_a_remote_url_is_quoted_against_zsh_globbing.sh'
      - 'scripts/ttywalk.sh'
      - 'bin/rollforward_gate.sh'
      - 'scripts/publish_release.sh'
      - 'scripts/post_walk_qa.sh'
      - 'scripts/box_walk_probes/**'
      - 'tests/test_promote_scope_refuses_on_the_artefact.sh'
      - 'tests/test_promote_scope_only_ever_grows.sh'
      - 'scripts/walk_promote_scope.tsv'
      - 'scripts/verify_walk_record.sh'
      - 'tests/test_a_pairing_non_answer_is_not_a_rejection.sh'
      - 'scripts/box_walk_probes/probes/pairing_recovers_without_a_repair_storm.sh'
      - 'scripts/box_walk_probes/probes/people_stores_reconcile.sh'
      - 'tests/test_reconcile_splits_our_fixtures_from_the_products.py'
      - 'tests/test_a_pairing_reader_runs_before_the_pairing_mutator.sh'
      - 'scripts/ttywalk.sh'
      - 'tests/test_the_walk_record_says_whether_the_stores_are_history.sh'
      - 'scripts/box_walk_probes/run_box_walk.sh'
      - 'scripts/box_walk_probes/probes/running_config_matches_disk.sh'
      - 'scripts/box_walk_probes/probes/pair_state_agreement.sh'
      - 'scripts/box_walk_probes/probes/assistant_answers_grounded.sh'
      - 'scripts/tests/test_grounded_probe_asserts_the_fact.sh'
      - 'tests/test_a_timed_out_turn_is_not_a_broken_assistant.sh'
      - 'tests/test_walk_record_gates_customer_download.sh'
      - 'tests/test_probe_absence_is_not_an_answer.sh'
      - 'tests/test_probe_pgrep_is_scoped_to_this_account.sh'
      - 'tests/test_no_probe_lives_outside_the_walk_glob.sh'
      - 'tests/test_the_walk_seeds_the_grounded_probe.sh'
      - 'tests/test_the_walk_waits_for_converge.sh'
      - 'tests/test_the_converge_wait_resolves_the_credential_path.sh'
      - 'scripts/box_walk_probes/lib/converge_wait.sh'
      - 'scripts/box_walk_probes/lib/grounding_seed.sh'
      # The preference seed: the same discipline on the other write route.
      # The lib, its test and the fixture-facing docs all go in the watch
      # set together, or a PR could narrow the lib without running the test
      # that guards it (the 'DARK ON SELF-EDIT' case this file already
      # records for test_post_walk_qa_measures_the_artefact.sh).
      - 'scripts/box_walk_probes/lib/preference_seed.sh'
      - 'tests/test_the_walk_seeds_the_preference_pair.sh'
      # The conversation seed: the third write route, and the only one that
      # needs a model call. Same rule as the two lines above -- the lib and
      # its test go in the watch set together, or a PR could narrow the lib
      # (drop the topics read-back, soften the person check on a PUBLIC repo)
      # without running the suite that guards it.
      - 'scripts/box_walk_probes/lib/conversation_seed.sh'
      - 'tests/test_the_walk_seeds_the_conversation.sh'
      # The usage seed: the same discipline on the producer that had nothing
      # to write. Lib and test together, for the reason above -- a PR could
      # otherwise narrow the lib without running the test that guards it.
      - 'scripts/box_walk_probes/lib/usage_seed.sh'
      - 'tests/test_the_walk_seeds_the_usage_producer.sh'
      # The wiki summaries wait: the same discipline on the producer that
      # writes from a DETACHED backfill. Lib and test together, for the reason
      # above -- a PR could otherwise narrow the lib (read an empty log as a
      # finished compile) without running the test that guards it.
      - 'scripts/box_walk_probes/lib/wiki_summaries_wait.sh'
      - 'tests/test_the_walk_waits_for_wiki_summaries.sh'
      # Same rule as the workflow-self-trigger below, applied to a test: a
      # suite this workflow RUNS but does not WATCH is dark on self-edit --
      # it could be narrowed, or gutted, in a PR that never runs it. I added
      # the step without this line and verify_invoked_tests_are_watched.py
      # caught it: "1 file(s) are DARK ON SELF-EDIT".
      - 'tests/test_post_walk_qa_measures_the_artefact.sh'
      # The BOM-verdict gate rides on the SAME promote decision this workflow
      # guards, so it belongs in the same watch set. #1322 shipped the gate
      # with zero call sites; the test below is what makes that state fail.
      - 'scripts/verify_must_contain_has_box_verdict.sh'
      - 'tests/test_bom_verdict_gate_is_wired_into_the_promote.sh'
      # The BOM's ref column and the guard that keeps it meaningful. Both
      # listed: a run: step with no matching paths entry is dark on self-edit.
      - 'tests/test_bom_ref_is_not_the_cut_pin.sh'
      - 'tests/bom_tautological_ref_baseline.txt'
      - 'cuts/**/cut.env'
      - 'cuts/**/MUST_CONTAIN.tsv'
      # The walk DRIVER and its three suites. Same self-edit rule as above:
      # the driver is the thing that decides whether a walk passed, so a
      # change to it must run the suites that judge it.
      - 'scripts/walk_drive.py'
      - 'tests/test_walk_driver_does_not_inherit_a_stale_result.sh'
      - 'tests/test_walk_driver_requires_a_completion_marker.sh'
      - 'tests/test_walk_driver_takes_ports_from_the_declared_field.sh'
      - 'tests/test_walk_pass_requires_zero_failed_steps.sh'
      - 'tests/test_walk_port_probe_matches_install_sh.sh'
      - 'tests/test_a_security_note_cannot_claim_a_flag_is_off.sh'
      - 'scripts/box_walk_probes/probes/no_store_port_is_tcp_reachable.sh'
      - 'scripts/box_walk_probes/lib/probe.sh'
      - 'scripts/tests/test_no_store_port_probe_reads_the_credential.sh'
      # Walk-failure classification: the records themselves, the tool that
      # answers "what is this a regression of", and the gate that requires the
      # answer. `walks/**` is watched because a NEW walk record is exactly the
      # event this gate exists to judge -- without it, filing an unclassified
      # record would not run the gate that rejects it.
      - 'walks/**'
      - 'scripts/walk_regression_triage.sh'
      - 'scripts/payload_delta.sh'
      - 'gui/Makefile'
      - 'tests/test_a_walk_failure_is_classified.sh'
      # A gate must trigger on changes to ITSELF, or it can be quietly
      # narrowed in the very PR that narrows it.
      - '.github/workflows/walk-record-gate.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  walk-record-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth 0: the pairing-transport test below builds its negative
      # control from a PINNED SHA of the probe -- the tree whose walk actually
      # flipped -- and that sha is not HEAD. actions/checkout@v4 defaults to
      # depth 1, so `git show <sha>:<path>` cannot resolve it; the control then
      # reports CANNOT-RUN, which is the honest answer and a useless one, and it
      # takes the job red for a reason that is not the code. Same reasoning, and
      # the same fix, as container-runtime-guard.yml.
      #
      # The test itself was run on ubuntu:latest (bash 5.3, GNU grep 3.12)
      # against a full-history checkout before wiring: 8 pass / 0 fail. That run
      # is evidence the test is PORTABLE. It is not evidence about clone depth,
      # because the container had full history.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A URL with a query string sent UNQUOTED over ssh is globbed by the
      # remote shell and never runs. Measured 2026-09-07: ttywalk's graph dump
      # used a bare http://127.0.0.1:7878/store?default, the walk box login
      # shell is zsh, and zsh aborted the command with "no matches found" -- so
      # curl never ran, the dump was empty, and --wipe-stores refused. It had
      # NEVER worked against that box, and the failure text points at Oxigraph
      # rather than at the shell. bash does not glob a bare question mark, so
      # the line tests clean locally and dies over ssh.
      - name: A remote URL with a query string is quoted against zsh globbing
        if: always()
        run: bash tests/test_a_remote_url_is_quoted_against_zsh_globbing.sh

      # A RESET DOES NOT WIPE, AND THE RECORD NEVER SAID SO. ttywalk.sh's reset
      # prints that the graph, the vectors and the compiled wiki are carried over
      # and that "any probe reading them is measuring history, not this
      # artefact". Measured: 0 mentions of that anywhere downstream, against a
      # control of 24 of 24 probes naming probe_cannot_run. So a red from a
      # store-reading probe reached a promote decision with nothing to say
      # whether it described the DMG or the box's past.
      - name: The walk record says whether the stores it measured are history
        if: always()
        run: bash tests/test_the_walk_record_says_whether_the_stores_are_history.sh

      # `if: always()` BECAUSE IT IS NO LONGER FIRST. It had none while it led the
      # job, which was harmless: nothing could mask it. Inserting a step above it
      # made it maskable, and verify_ci_steps_are_maskless.py named it -- a red
      # in the new step would have hidden this one, which is the gate that says
      # the customer download cannot be repointed to an unwalked build.
      - name: The customer download cannot be repointed to an unwalked build
        if: always()
        run: bash tests/test_walk_record_gates_customer_download.sh

      # A probe that reads an absent path as a definite answer is worse than a
      # probe that fails: it reports a confident verdict about something it
      # never measured. pair_state_agreement did exactly that on 2026-08-26 --
      # an absent ~/.ostler/paired_devices counted 0 and returned "nothing is
      # paired" on a box holding 35 issued bearer tokens.
      # `if: always()` so this still reports when the suite above is red.
      - name: An absent path is UNAVAILABLE, never a count of zero
        if: always()
        run: bash tests/test_probe_absence_is_not_an_answer.sh

      # A probe must not select a process it does not own. Measured on the
      # v1.0.67 walk: bare `pgrep -f` took another account's ical-server pid and
      # the probe measured that user's interpreter. Same class as :11434 (#1471)
      # and the store ports (#1495) -- reachable is not ours, now for the
      # process table.
      - name: A probe's pgrep is scoped to this account
        if: always()
        run: bash tests/test_probe_pgrep_is_scoped_to_this_account.sh

      # The third instance of the same class in one night, and the one that
      # actually spent a red. The pairing probe captured curl's stdout and never
      # took its exit code, so a six-second timeout printed "8443 REJECTED a code
      # the gateway had just issued" -- a product claim about the shipped
      # artefact, asserted on a transport failure. Measured: the SAME v1.0.67
      # sha256 walked twice 28 minutes apart and only this probe changed its
      # mind. Its single-use CONTROL had the inverse bug and passed by never
      # running.
      - name: A pairing non-answer is not a rejection
        if: always()
        run: bash tests/test_a_pairing_non_answer_is_not_a_rejection.sh

      # The triage tool must be able to say each of its four things. A tool
      # that classified everything as NEVER-PASSED would look exactly like a
      # correct one, so the self-test drives all three outcomes.
      - name: The regression triage can tell a regression from a never-passed
        if: always()
        run: bash scripts/walk_regression_triage.sh --self-test

      # "Which commits touch install.sh" is a PROXY for "what reaches the
      # customer", and on 2026-09-07 it missed vendor/VENDOR_MANIFEST.toml,
      # which ships and is written onto the customer's machine. This proves the
      # payload list is still parseable from gui/Makefile and that an
      # unparseable one is CANNOT-RUN rather than a clean delta.
      - name: The payload list is parseable, and refuses when it is not
        if: always()
        run: bash scripts/payload_delta.sh --self-test

      # A walk may not record a failure without saying what it is a regression
      # of. Andy, 2026-09-07: nobody goes back to the last successful walk, so
      # the same ground gets reinvented. This makes the answer mandatory and
      # the tool above makes it one command.
      - name: A walk failure says what it is a regression of
        if: always()
        run: bash tests/test_a_walk_failure_is_classified.sh

      # THE PROBE MINTS A BEARER TOKEN EVERY TIME IT PASSES, AND ITS OWN CEILING
      # IS WHAT THAT TOKEN COUNTS AGAINST. Limb 2 performs a real pair against
      # :8443; nothing in the tree revokes it; --reset runs no uninstaller so
      # config.toml survives; and install.sh:12981-13004 deliberately merges the
      # old paired_tokens forward so an upgrade does not unpair every device. So
      # the passes accumulate towards the failure, and past TOKEN_CEILING a
      # BLOCKING probe blames the product for a storm it created itself.
      #
      # The attribution arithmetic is pure and needs no box, so it runs here as
      # well as in the walk's phase 1. Six cases through the real function; the
      # two that matter are the walk-only box that used to read as a storm, and
      # the real storm on a box we have also walked, which must NOT be hidden by
      # subtracting ours.
      - name: The repair-storm probe does not count its own pairings
        if: always()
        run: |
          # The probe's --self-test EXITS 1 by design: VERDICT: FAIL is the
          # healthy negative-control result, and phase 1 of the box walk greps
          # for the literal "VERDICT: BROKEN" BEFORE it reads any exit code,
          # precisely so a probe cannot vouch for itself with a status. Assert
          # both, because either alone can be satisfied by a broken probe.
          rc=0
          out="$(/bin/bash scripts/box_walk_probes/probes/pairing_recovers_without_a_repair_storm.sh --self-test 2>&1)" || rc=$?
          printf '%s\n' "$out"
          # `grep -c`, NOT `... | grep -q`. This step runs under `bash -eo
          # pipefail`; grep -q exits on the first match and SIGPIPEs printf, so
          # under pipefail the pipeline can report failure ON A MATCH and invert
          # the verdict. tests/test_pipefail_shortcircuit_inversion.sh caught
          # exactly this line, which is what that ratchet is for.
          if [ "$(printf '%s' "$out" | grep -c 'VERDICT: BROKEN')" -gt 0 ]; then
            echo "::error::the probe's negative control reported BROKEN -- see the line above" >&2
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::the probe --self-test returned $rc, not 1. The box walk would mark it BROKEN." >&2
            exit 1
          fi
          echo "OK: 6 of 6 attribution cases, and the control fails as phase 1 requires."

      # Andy's 2026-09-05 decision: the promote binds on the probes that describe
      # the DMG, not on the whole 24-probe scoreboard. These two guard the change.
      # The first proves the gate still REFUSES on an artefact-owned probe and fails
      # closed on an undeclared one, a missing scope file, and an incomplete failure
      # list. The second is the ratchet: a probe may move advisory -> blocking, never
      # the reverse, because the probe that is red today is exactly the one someone
      # will propose demoting. The ratchet needs origin/main, which is why the
      # checkout above is fetch-depth 0.
      # THE RECONCILE PROBE'S OWN NEGATIVE CONTROL CANNOT REACH THIS.
      #
      # All eighteen of its self-test cases drive the SHELL verdict through
      # FAKE_RECONCILE, which substitutes a canned result line -- so the embedded
      # python that PRODUCES that line is never executed by the probe itself.
      # Measured: mutating the python to count every orphan as one of ours, the
      # false-green direction, left that self-test green at 18 of 18.
      #
      # This drives the real payload against a fake store. It refuses (exit 2) if
      # the heredoc anchor moves or the payload stops mentioning the flag, so a
      # green cannot be obtained by measuring nothing.
      # A GLOB SORTS BY LC_COLLATE, AND ONE PROBE MUTATES WHAT OTHERS READ.
      # pairing_recovers_without_a_repair_storm performs a real pair and persists
      # a bearer token nothing revokes; pair_state_agreement reads pairing state.
      # The reader sorts first only because "_" precedes "i" -- a locale that
      # ignores punctuation at the primary level inverts them. run_box_walk.sh now
      # pins the order to C; this asserts the read-before-mutate relation under
      # BOTH C and this runner's own collation, so the runner measures the
      # locale question rather than anyone trusting one machine's answer.
      # AND THE READER MUST NOT READ OUR OWN PAIRING AS THE PRODUCT'S. Within one
      # walk the reader runs first, so it sees a pristine box. Between walks the
      # stores and config are NOT wiped -- ttywalk.sh:541 says so in its own reset
      # output -- so walk N+1 can find the device walk N paired. Any device-layer
      # `paired` that could be ours is withheld; a `not paired` is never
      # contaminated and passes through. The arithmetic needs no box.
      # A CLOCK IS NOT A PRODUCT VERDICT. assistant_answers_grounded is blocking
      # and its subject is the product's core promise, and every non-grounded
      # verdict used to be a probe_fail -- including `incomplete`, which means the
      # turn timed out. Its own runtime note records 2-5 MINUTES per turn while
      # the ceiling was 240s, so healthy turns could produce the sentence "did not
      # reach the customer's own data". This drives the REAL run_probe against a
      # stubbed box: the probe's own self-test can only reach the classifiers, and
      # the PRECEDENCE that turns those into a verdict lives in the loop.
      - name: A turn that timed out is not an assistant that cannot answer
        if: always()
        run: bash tests/test_a_timed_out_turn_is_not_a_broken_assistant.sh

      - name: The pair-state reader does not read our own pairing as the product
        if: always()
        run: |
          rc=0
          out="$(/bin/bash scripts/box_walk_probes/probes/pair_state_agreement.sh --self-test 2>&1)" || rc=$?
          printf '%s\n' "$out"
          # grep -c, never `| grep -q`: this runs under bash -eo pipefail and
          # grep -q SIGPIPEs the producer on first match.
          if [ "$(printf '%s' "$out" | grep -c 'VERDICT: BROKEN')" -gt 0 ]; then
            echo "::error::the pair-state negative control reported BROKEN" >&2
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::the probe --self-test returned $rc, not 1. The box walk would mark it BROKEN." >&2
            exit 1
          fi
          echo "OK: 16 of 16 cases, and the control fails as phase 1 requires."

      - name: A pairing reader runs before the pairing mutator, in both collations
        if: always()
        run: bash tests/test_a_pairing_reader_runs_before_the_pairing_mutator.sh

      - name: The reconcile payload tells our leaked fixture from a product orphan
        if: always()
        run: python3 tests/test_reconcile_splits_our_fixtures_from_the_products.py

      - name: The scoped promote refuses on the artefact
        if: always()
        run: bash tests/test_promote_scope_refuses_on_the_artefact.sh

      - name: The blocking set only ever grows
        if: always()
        run: bash tests/test_promote_scope_only_ever_grows.sh

      # The companion to the check above. That one refuses an absent path being
      # counted as zero; this one refuses a probe the SUITE cannot see. The glob
      # in run_box_walk.sh IS the suite, so a probe file that lands outside it
      # never executes and its silence is indistinguishable from a pass.
      - name: A probe outside the walk glob is a probe that never runs
        if: always()
        run: bash tests/test_no_probe_lives_outside_the_walk_glob.sh

      # #931 -- THE WRITER HALF. The gate above refuses a record that does not
      # name the build it was taken on. It is only as good as the writer that
      # feeds it: if post_walk_qa.sh cannot produce a measured artefact_sha256,
      # every future walk records asserted-unverifiable, the reader returns 2,
      # PROMOTE=0, and a human has burned a box walk for nothing.
      #
      # The measured path talks to a box over ssh and a box only exists after a
      # DMG is published, which is why the branch shipped unproven. `ssh` is
      # resolved through the shell, so the test shadows it with a function and
      # every branch becomes reachable here with no box and no credentials.
      #
      # rc=2 IS NOT rc=1. 2 means the harness could not locate its anchors and
      # measured nothing; 1 means the writer misbehaved. #1239 exists because a
      # gate reported a shell problem as a product defect and sent someone to
      # debug the product. Both are red; they must not read the same.
      # `if: always()` for the same reason as the arms around it.
      - name: The walk record must MEASURE the artefact, not assert it
        if: always()
        run: |
          set -uo pipefail
          rc=0
          bash tests/test_post_walk_qa_measures_the_artefact.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The writer harness could not locate its anchors in scripts/post_walk_qa.sh. NOTHING about the writer has been measured. Do not debug post_walk_qa.sh on the strength of this line -- re-point the anchors in tests/test_post_walk_qa_measures_the_artefact.sh, and do not delete the arms."
          fi
          exit "$rc"

      # ── THE WALK DRIVER ────────────────────────────────────────────────
      #
      # Everything above judges the RECORD. These judge the thing that
      # produces it. The driver was promoted into this repo on 2026-08-29
      # from a single copy on one machine; each suite guards one of the
      # three defects found on the way in, and each was proved RED against
      # the original 283-line file before the fix went in.
      #
      # Every suite ends in an ANTI-VACUITY arm that mutates the driver to
      # remove the fix and requires the defect to come back. If an anchor
      # moves, that arm exits 2 and says so rather than passing quietly --
      # so re-point the anchor, never delete the arm.
      #
      # `if: always()` throughout, for the reason given at the arms above: a
      # suite skipped because an earlier one went red tells you nothing, and
      # these three are independent of each other.
      - name: A dead walk must not publish the previous walk's verdict
        if: always()
        run: |
          set -uo pipefail
          rc=0
          bash tests/test_walk_driver_does_not_inherit_a_stale_result.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The stale-result harness could not set itself up or its mutation anchor has moved. NOTHING about the driver has been measured."
          fi
          exit "$rc"

      - name: PASS requires positive evidence of completion, never rc=0
        if: always()
        run: |
          set -uo pipefail
          rc=0
          bash tests/test_walk_driver_requires_a_completion_marker.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The completion-marker harness could not set itself up or its mutation anchor has moved. NOTHING about the driver has been measured."
          fi
          exit "$rc"

      - name: The port list comes from the declared field, and empty refuses
        if: always()
        run: |
          set -uo pipefail
          rc=0
          bash tests/test_walk_driver_takes_ports_from_the_declared_field.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The declared-port harness could not set itself up or its mutation anchor has moved. NOTHING about the driver has been measured."
          fi
          exit "$rc"

      # A WALK EXISTS TO FIND DEFECTS AND CANNOT PASS OVER ONE IT WAS TOLD
      # ABOUT. Measured on ttywalk run 3: the marker read
      # `status=ok failed_steps=1 errors=0`, the failed step was health_check
      # (status=error rc=2), and the driver printed WALK PASS. status=ok and
      # failed_steps answer DIFFERENT questions by design (#839) -- reached the
      # end vs did every step work -- and reading only the first commits the
      # same collapse the product was blamed for, from the instrument side.
      - name: PASS requires zero failed steps, and an absent tally is CANNOT-RUN
        if: always()
        run: |
          set -uo pipefail
          rc=0
          bash tests/test_walk_pass_requires_zero_failed_steps.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The failed-steps harness could not import the driver or the driver stopped exporting adjudicate/PASS/FAIL/CANNOT_RUN. NOTHING about the driver has been measured."
          fi
          exit "$rc"

      # ── The driver's port probe must not be STRICTER than install.sh's ──
      #
      # Run 9 refused a walk on "6333 8044 already held" seven seconds after
      # its own --reset stopped colima. Nothing held them: TIME_WAIT refuses a
      # bare bind() while netstat shows no listener, and install.sh grades
      # exactly that case could-not-measure. The harness manufactured the
      # conflict it then refused on.
      # A SECURITY NOTE MAY NOT CLAIM A FLAG IS OFF WHEN IT SHIPS ON.
      #
      # MEASURED 2026-09-05: the store-port probe described the 6333 and 7878
      # credentials as "default-OFF" for a week after they shipped default-ON,
      # and said the Doctor breaks under redis auth after that was fixed. All
      # three were true when written. The effect was to make the whole store
      # surface read as unfinished, which helped hide the one port that
      # genuinely is open (8044, #1594).
      #
      # if: always() -- this and the port-probe step above are the two ways
      # this probe's own description can drift from install.sh. Learning about
      # one but not the other on a red run is how the second gets forgotten.
      - name: A security note cannot claim a flag is off when it ships on
        if: always()
        run: bash tests/test_a_security_note_cannot_claim_a_flag_is_off.sh

      - name: Port probe agrees with install.sh's own two-instrument table
        if: always()
        run: |
          set -uo pipefail
          rc=0
          bash tests/test_walk_port_probe_matches_install_sh.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The port-probe harness could not import the driver, or install.sh no longer defines _check_port/_port_listeners. The driver's table is pinned to a contract that has moved; NOTHING was measured."
          fi
          exit "$rc"

      # The suite above proves the gate REFUSES correctly. This proves it can
      # still say yes on the real script, from the real repo root, with no
      # fixture directory override -- a gate that only ever refuses would pass
      # a suite made entirely of refusals, and would also block every release.
      # `if: always()` -- a control is most informative on a RED run. If the
      # suite above fails and this is skipped, you cannot tell "the gate is
      # correctly refusing" from "the gate refuses everything", which is the
      # exact ambiguity the control exists to remove.
      - name: The store-port probe asks whether a surface SERVES, on both arms (#1618)
        if: always()
        # Until #1618 the probe asked `nc -z`: TCP reachability, which cannot
        # tell a credentialled surface from a bare one once every store is
        # published on purpose behind a credential. Named in 7 walk records,
        # passed in none. This drives the real probe against a fake surface
        # on a free port: bare 200 -> FAIL (the directive's mutation control),
        # 401 bare + 200 with the fixture credential -> PASS, 401 to everyone
        # -> FAIL as a lock-out, nothing listening -> CANNOT-RUN, control down
        # -> CANNOT-RUN, the runner's --self-test contract, the same PASS under
        # `zsh -c` where zsh exists, and one mutant per arm proved landed.
        run: /bin/bash scripts/tests/test_no_store_port_probe_reads_the_credential.sh

      - name: The grounded probe asserts the fact, not the frame shape
        if: always()
        # assistant_answers_grounded is BLOCKING and scored a wrong answer
        # green on the v1.0.74 seeded walk: pwg_people fired, returned OK,
        # and the reply said the workplace was not recorded while the graph
        # served it. The seeded turn now asserts the reply CARRIES the fixture
        # fact (computed on the box; only YES/NO crosses the wire). This runs
        # the probe's own self-test, shows the pre-fix adjudicator returning
        # grounded on the measured transcript while the fixed one returns
        # fact_missing, and kills a mutant with the assertion removed.
        run: /bin/bash scripts/tests/test_grounded_probe_asserts_the_fact.sh

      # THE OTHER HALF OF THAT PROBE. The step above proves the probe can tell
      # a carried fact from a missing one. It cannot see whether the walk ever
      # GIVES it a fact to look for, and until now the walk did not: nothing
      # set OSTLER_GATE_KNOWN_PERSON or OSTLER_GATE_EXPECT_FACT, so the probe
      # ran unseeded and its content assertion did not exist. That is the
      # configuration recorded FAILED in walks/v1.0.74.tsv.
      #
      # This pins the wiring itself: the runner sources lib/grounding_seed.sh
      # and calls it ABOVE the phase-2 loop, the gate values are exported ONLY
      # on the loader's exit 0, and every other outcome exports nothing and
      # says why. Its own mutation arm removes the exports and requires the
      # exit-0 assertion to stop passing.
      - name: The walk seeds the grounded probe, and a failed seed is not a FAIL
        if: always()
        run: /bin/bash tests/test_the_walk_seeds_the_grounded_probe.sh

      # THE OTHER WRITE ROUTE. The step above gives the grounded probe a PERSON.
      # Nothing gave the walk a PREFERENCE, so an empty preference wiki, an
      # ingest that never ran and a broken write route were three faults
      # wearing one face. On v1.0.81 it was the first of those: cm019_setup
      # logged "already set up" with elapsed_s=0 and install.log holds no
      # ingest-dir and no "Files processed".
      #
      # Pins the wiring, the currency check and both floor arms: the runner
      # sources lib/preference_seed.sh above the phase-2 loop; the staged
      # cm019 tree is compared BY CONTENT against the cm019 bundle inside the
      # ARTEFACT (never this checkout, which can agree with the DMG while the
      # box lags); and the profile must show BOTH an interest that cleared the
      # 0.28 floor and a row that was screened by it, because one arm alone
      # cannot tell a working screen from an absent one. Its mutation arm
      # disables the suppressed check and requires the suite to notice.
      - name: The walk seeds the preference pair, and both sides of the floor
        if: always()
        run: /bin/bash tests/test_the_walk_seeds_the_preference_pair.sh

      # THE THIRD WRITE ROUTE, AND THE ONLY ONE THAT NEEDS A MODEL CALL. The
      # two steps above give the walk a PERSON and a PREFERENCE. Nothing had
      # ever put a CONVERSATION through the conversation pipeline, and that
      # pipeline is the only writer of two things three probes read: the
      # conversations Qdrant collection, which the installer pre-creates EMPTY
      # (install.sh:18448), and the pwg:ConversationTopic nodes /api/v1/topics
      # serves to pwg_topics. Nothing is processed at install time
      # (install.sh:19178-19180 checks --help and an import and stops), so on a
      # cold box those probes measured an empty store and could not tell that
      # from a broken one.
      #
      # Pins the wiring, the fixture and the three-outcome discipline: the
      # runner sources lib/conversation_seed.sh above the phase-2 loop and
      # after the other two seeds; the fixture carries NO PERSON, with a
      # must-fail arm that plants a name and requires the suite to refuse it,
      # because CM051 is a PUBLIC repo; the conversations and topics read-backs
      # are reported as SEPARATE verdicts, because a step-09 timeout yields a
      # point and no topic; a zero usage journal is a FINDING naming the absent
      # vendored producer and never a CANNOT-RUN; and the forget deletes only
      # by the conversation id and sha1(id)[:8], proven by a decoy bundle that
      # must survive. Its mutation arm disables the topics assertion and
      # requires the suite to notice.
      - name: The walk seeds one conversation, and a seed that did not work is not a FAIL
        if: always()
        run: /bin/bash tests/test_the_walk_seeds_the_conversation.sh
      # THE PRODUCER THAT HAD NOTHING TO WRITE. The two steps above give a
      # probe CONTENT. usage_journal_producers needed WORK: on v1.0.81
      # cm051_ostler_fda_ingest was absent from a journal holding 557 parsed
      # rows, and the writer was not the reason. A row is written only on a
      # MEASURED embedding call (pwg_ingest.py:65-66), and the one ingest leg
      # with guaranteed input on a wiped box was skipped by a hydrate sentinel
      # that ttywalk's --reset does not clear (install.sh:26392-26413 gating
      # :29374). So "the writer is broken" and "the writer was never asked"
      # printed identically.
      #
      # Pins the wiring and the three-outcome discipline: the runner sources
      # lib/usage_seed.sh above the phase-2 loop with the forget below it; the
      # runtime assumption (a real /api/embed reporting a USABLE
      # prompt_eval_count, observed once on the walk box at
      # 2026-09-09T17:42:35Z under Ollama 0.33.3 and re-measured every walk
      # because one box is not every box) is measured before anything is built
      # on it and is CANNOT-RUN when absent or zero; the JOURNAL DELTA is the verdict and the sweep's exit code
      # never is; a zero delta on a status-ok sweep is a named FINDING. Its
      # mutation arm disables the delta check and requires the suite to notice.
      # The stub box runs the real remote command text through /bin/sh, so this
      # needs no box and no network.
      - name: The walk runs the people sweep, so the FDA usage producer is measured
        if: always()
        run: /bin/bash tests/test_the_walk_seeds_the_usage_producer.sh

      # THE PRODUCER THAT WRITES FROM A DETACHED BACKFILL. The step above makes
      # the FDA producer write. cm044_wiki_compiler writes a cm044-compile- row
      # only from the wiki compiler's summary pass, which wiki-recompile-tick.sh
      # runs as a nohup'd background backfill (:394-451) that nothing in the
      # walk waited for. Measured on the v1.0.82 walk at 18:53:06Z: the
      # install-time tick had launched the backfill at 18:48:11Z, the summaries
      # log was still 0 bytes, and usage_journal_producers had read the journal
      # at about 18:51Z; cm044 rows: 0 (v1.0.81, a long-lived box: 553). And
      # at 19:08Z, twenty minutes after the launch, the log was STILL 0 bytes,
      # no process of ours was alive, both LaunchAgents read "not running,
      # runs 1, last exit code 0": the backfill was gone and had written
      # nothing while every liveness signal read green.
      #
      # Pins the wiring and the three-outcome discipline: the runner sources
      # lib/wiki_summaries_wait.sh below the usage seed and above the phase-2
      # loop; the kickstart text is exactly `kickstart -k
      # gui/<id -u>/com.creativemachines.ostler.wiki-recompile`; completion is
      # LIVENESS AND GROWTH, never the pid alone: the wrapper pid, the log's
      # size growing, the slot holder, the account's processes naming the
      # compiler (real pgrep -u against a real stub process), the container;
      # a live pid with a 0-byte log is the FINDING "wrote nothing, still
      # alive", a growing log at the budget is CANNOT-RUN "not converged in
      # time", a dead wrapper with a 0-byte log and nothing alive is the 19:08Z
      # FINDING "wrote nothing" reached without burning the budget, a positive
      # delta is CONVERGED, a zero delta on a finished compile is a FINDING
      # naming cm044_wiki_compiler as a present producer that did not write,
      # and a refused kickstart, absent label plus absent tick, a tick that
      # ends without a backfill, an unreadable box and an explicit skip are
      # each a named CANNOT-RUN; the diagnostic block is printed and the
      # summaries log's content never is (a name-shaped canary). Its mutation
      # arm disables the delta check and requires the suite to notice. The
      # stub box runs the real remote command text through /bin/sh against a
      # real background process and the real pidfile path, so this needs no
      # box and no launchd.
      - name: The walk waits for the wiki summary backfill, so cm044_wiki_compiler has written before the journal is read
        if: always()
        run: /bin/bash tests/test_the_walk_waits_for_wiki_summaries.sh

      # THE OTHER HALF OF A HONEST PEOPLE READING. The seed above gives the
      # grounded probe a fact to look for; this gives the two COUNT-reading
      # probes a settled graph to read. On v1.0.78 they measured mid
      # convergence: contacts read 1629 during the walk and 1920 an hour later
      # on the same untouched box, and a disagreement measured then is not a
      # store defect.
      #
      # It waits on MEASURED stability of two independent stores, never on the
      # dedupe-converge.done marker, which the converge writes in the same
      # second as "hit max_rounds=10 without a fixpoint" and therefore means
      # only that the process exited. The arm that matters most asserts that
      # stores holding steady while DISAGREEING still count as stable, because
      # requiring agreement would mean people_stores_reconcile could never fail.
      - name: The walk waits for the stores to stop moving, and never scores a pass for waiting
        if: always()
        run: /bin/bash tests/test_the_walk_waits_for_converge.sh

      # #1851: AND IT ACTUALLY READS THEM. The suite above proves the stability
      # DECISION and stubs the reader, so nothing in it ever executed the
      # command that crosses _cw_box_exec. The credential path was interpolated
      # single-quoted while it still carried a literal $HOME, the remote shell
      # never expanded it, curl exited 26 before issuing a request, and both
      # stores read "x" on every reading. On the v1.0.79 walk that produced 45
      # consecutive "unreadable: x x" lines against two healthy stores, and both
      # people probes ended CANNOT-RUN by the harness's own hand.
      #
      # This arm crosses that seam: a real credential file at the real expanded
      # path under a redirected HOME, a store on an ephemeral loopback port that
      # RECORDS what reached it, and a must-fail arm restoring the old quoting
      # that must print "x x" and must leave the store untouched.
      - name: The converge wait resolves the credential path before it quotes it
        if: always()
        run: /bin/bash tests/test_the_converge_wait_resolves_the_credential_path.sh

      - name: POSITIVE CONTROL -- the gate accepts a genuine clean record
        if: always()
        run: |
          set -euo pipefail
          mkdir -p walks
          # The sha is DERIVED from a real file rather than typed, so this
          # control cannot pass by two hardcoded constants matching each other.
          # It is the positive-control analogue of #931 itself: a value checked
          # against itself always agrees.
          printf 'ostler citest artefact\n' > /tmp/citest-artefact.bin
          CITEST_SHA="$(sha256sum /tmp/citest-artefact.bin | awk '{print $1}')"
          printf 'version\tv0.0.0-citest\n'      >  walks/v0.0.0-citest.tsv
          printf 'version_source\tmeasured(CFBundleShortVersionString, matches argument)\n' >> walks/v0.0.0-citest.tsv
          printf 'artefact_sha256\t%s\n' "$CITEST_SHA" >> walks/v0.0.0-citest.tsv
          printf 'artefact_sha256_source\tmeasured(shasum -a 256 of the citest artefact)\n' >> walks/v0.0.0-citest.tsv
          printf 'walked_at\t2026-01-01T00:00:00Z\n' >> walks/v0.0.0-citest.tsv
          printf 'box_fp\tcitestcitest0000\n'    >> walks/v0.0.0-citest.tsv
          printf 'pass\t14\n'                    >> walks/v0.0.0-citest.tsv
          printf 'fail\t0\n'                     >> walks/v0.0.0-citest.tsv
          printf 'cannot_run\t0\n'               >> walks/v0.0.0-citest.tsv
          printf 'broken\t0\n'                   >> walks/v0.0.0-citest.tsv
          printf 'verdict\tCLEAN\n'              >> walks/v0.0.0-citest.tsv
          printf 'qa_exit\t0\n'                  >> walks/v0.0.0-citest.tsv
          bash scripts/verify_walk_record.sh v0.0.0-citest "$CITEST_SHA"
          rm -f walks/v0.0.0-citest.tsv /tmp/citest-artefact.bin

      # 🔴 #1322 SHIPPED THE BOM-VERDICT GATE WITH ZERO CALL SITES. The script
      # was 137 lines and nothing ran it -- measured by grepping for its own
      # name and getting zero, with verify_walk_record as the control showing
      # the grep worked. Same class as #449. This step is what makes that
      # state RED instead of invisible.
      #
      # `if: always()` is REQUIRED: a red in an earlier step would otherwise
      # SKIP this one, and a gate that does not report is indistinguishable
      # from a gate that passed. It shares no state with the steps above.
      - name: The BOM-verdict gate is invoked by the promote, not merely present
        if: always()
        run: bash tests/test_bom_verdict_gate_is_wired_into_the_promote.sh

      # v1.0.67 shipped with all 8 BOM rows carrying the cut pin in their ref
      # column, so the ancestry check each row implies was "is the pin an
      # ancestor of the pin" -- true for every cut that ever will be. Measured
      # across 26 cuts: 4 are that shape and nothing had noticed the first 3.
      - name: no NEW cut puts its own pin in the BOM ref column
        if: always()
        run: bash tests/test_bom_ref_is_not_the_cut_pin.sh
