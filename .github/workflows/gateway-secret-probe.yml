name: gateway-secret-probe

# v1.0.109 thin walk probe gateway_never_serves_a_stored_secret. Everything
# that can be proven without a box: the probe, run through its real script
# against a fake gateway over the hub contract's real gateway route list,
# FAILs naming a route that leaks a stored secret, PASSes a clean gateway,
# and is CANNOT-RUN when its positive control sees 0, when config.toml is
# absent or when no route answers. A blinded counter is shown to go
# CANNOT-RUN, never PASS. No secret value reaches the probe output.

on:
  pull_request:
    paths:
      - 'scripts/box_walk_probes/lib/stored_secret_sweep.py'
      - 'scripts/box_walk_probes/probes/gateway_never_serves_a_stored_secret.sh'
      - 'scripts/box_walk_probes/lib/probe.sh'
      - 'vendor/cm041/assistant_api/hub_contract.yaml'
      - 'scripts/walk_promote_scope.tsv'
      - 'cut-manifests/permanent.yaml'
      - 'tests/test_gateway_never_serves_a_stored_secret.sh'
      - 'tests/e2e/fakebin/security'
      - '.github/workflows/gateway-secret-probe.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gateway-secret-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: the probe goes red on a leak, green when clean, CANNOT-RUN when blind
        run: /bin/bash tests/test_gateway_never_serves_a_stored_secret.sh
