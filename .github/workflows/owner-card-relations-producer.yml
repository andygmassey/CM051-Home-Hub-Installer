name: owner-card-relations-producer

# G1 producer. The abcddb reader in the SHIPPED copy (vendor/cm041) emits
# every card's related-name lines, attributed by ZOWNER, and the owner-card
# marker for the owner's card only. The CM041 writers (#256 owner, and the
# card-relations stack) consume them. Mutants run in the same job.

on:
  push:
    branches: [main]
    paths:
      - 'vendor/cm041/contact_syncer/syncer.py'
      - 'tests/test_owner_card_relations_producer_vendored.py'
      - '.github/workflows/owner-card-relations-producer.yml'
  pull_request:
    paths:
      - 'vendor/cm041/contact_syncer/syncer.py'
      - 'tests/test_owner_card_relations_producer_vendored.py'
      - '.github/workflows/owner-card-relations-producer.yml'

permissions:
  contents: read

jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the vendored modules' runtime dependencies
        run: python -m pip install --quiet pytest httpx rapidfuzz phonenumbers vobject qdrant-client
      # Anti-vacuity and the run are ONE step: a failing floor in a separate
      # step would skip the run and hide the real result.
      - name: Every card carries its own relations; only the owner has the marker
        run: |
          n="$(python -m pytest tests/test_owner_card_relations_producer_vendored.py \
                 --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 3 ]; then
            echo "REFUSING: expected at least 3 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python -m pytest tests/test_owner_card_relations_producer_vendored.py -v
      # The mutants are the proof the suite can fail. The control inside the
      # harness must be green, and every mutant must be caught.
      - name: Producer mutants are all caught
        run: python -m pytest --version >/dev/null && python tests/owner_card_relations_mutants.py
