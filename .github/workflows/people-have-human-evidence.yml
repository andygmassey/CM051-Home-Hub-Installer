# CM051 F7 (walk #16): non-people in the Hub People list. Runs the shipped
# writer rules (cm021 email sender, ostler_fda iMessage sender id) and the
# shipped read surface (ical-server people_list) over one synthetic fixture,
# with real-person controls that must stay.
name: people-have-human-evidence

on:
  push:
    branches: [main]
    paths:
      - 'vendor/cm041/assistant_api/ical-server.py'
      - 'vendor/cm021/src/cli.py'
      - 'vendor/ostler_fda/pwg_ingest.py'
      - 'vendor/ostler_fda/role_addresses.py'
      - 'vendor/ostler_fda/machine_senders.py'
      - 'vendor/cm041/assistant_api/people_rules.py'
      - 'tests/test_people_have_human_evidence.py'
      - 'tests/test_organisation_senders_are_not_people.py'
      - 'scripts/box_walk_probes/lib/customer_read.py'
      - 'scripts/box_walk_probes/probes/people_count_agreement.sh'
      - 'tests/test_people_count_one_definition.py'
      - 'tests/test_people_count_waits_for_the_embed_drain.py'
      - '.github/workflows/people-have-human-evidence.yml'
  pull_request:
    paths:
      - 'vendor/cm041/assistant_api/ical-server.py'
      - 'vendor/cm021/src/cli.py'
      - 'vendor/ostler_fda/pwg_ingest.py'
      - 'vendor/ostler_fda/role_addresses.py'
      - 'vendor/ostler_fda/machine_senders.py'
      - 'vendor/cm041/assistant_api/people_rules.py'
      - 'tests/test_people_have_human_evidence.py'
      - 'tests/test_organisation_senders_are_not_people.py'
      - 'scripts/box_walk_probes/lib/customer_read.py'
      - 'scripts/box_walk_probes/probes/people_count_agreement.sh'
      - 'tests/test_people_count_one_definition.py'
      - 'tests/test_people_count_waits_for_the_embed_drain.py'
      - '.github/workflows/people-have-human-evidence.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  people-have-human-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest and the vendored modules' runtime dependencies
        run: python -m pip install --quiet pytest httpx nameparser rapidfuzz phonenumbers pyyaml beautifulsoup4 vobject pyoxigraph cryptography
      - name: Junk senders and sender ids are not people, real people stay, a card always wins
        run: |
          n="$(python -m pytest tests/test_people_have_human_evidence.py \
                 --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 20 ]; then
            echo "REFUSING: expected 20 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python -m pytest tests/test_people_have_human_evidence.py -v -rs
      # v1.0.107 walk #28: an organisation sender is not a person, on both
      # writers (ostler_fda mail + calendar ingest) and the Hub People list.
      - name: Organisation senders are not people
        if: always()
        run: |
          n="$(python -m pytest tests/test_organisation_senders_are_not_people.py \
                 --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 3 ]; then
            echo "REFUSING: expected 3 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python -m pytest tests/test_organisation_senders_are_not_people.py -v -rs
      # v1.0.121: ONE definition of a person for counting (people_rules
      # is_countable_person: named, not merged away). The probe counts the
      # graph with it, the Doctor counts Qdrant with it; the cap is unchanged.
      - name: People counts share one definition, each store counted by its own reader
        if: always()
        run: |
          out="$(python -m pytest -q -rs tests/test_people_count_one_definition.py 2>&1)" || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q SKIPPED; then echo "SKIPPED is not a pass" >&2; exit 1; fi
          n="$(printf '%s' "$out" | grep -Eo '[0-9]+ passed' | grep -Eo '[0-9]+')"
          if [ "${n:-0}" -lt 8 ]; then echo "expected at least 8 passed, got ${n:-0}" >&2; exit 1; fi
      # v1.0.121 trial: the 100-person gap was embed lag (a Person reached the
      # graph at 15:35:15Z and its vector at 15:45:18Z). The probe now reads only
      # after the embed queue has drained, on a named signal, else CANNOT-RUN.
      # Cap 0 throughout: the tolerance and the cap are not touched.
      - name: The people-count probe reads only after the embed queue has drained, else CANNOT-RUN
        if: always()
        run: |
          out="$(python -m pytest -q -rs tests/test_people_count_waits_for_the_embed_drain.py 2>&1)" || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q SKIPPED; then echo "SKIPPED is not a pass" >&2; exit 1; fi
          n="$(printf '%s' "$out" | grep -Eo '[0-9]+ passed' | grep -Eo '[0-9]+')"
          if [ "${n:-0}" -lt 9 ]; then echo "expected at least 9 passed, got ${n:-0}" >&2; exit 1; fi
