name: reply-debt-never-reads-protected-data

# CM051 #30, studio29. ical-server (a bare python3.11 under launchd) opened
# ~/Library/Messages/chat.db for /api/v1/reply-debt, so TCC asked the customer
# to grant Full Disk Access to "python3.11", and while the read was denied the
# endpoint said "you're all caught up". The suite proves, with a CPython audit
# hook and a positive control that the hook fires, that the endpoint opens no
# TCC-protected path, that an unreadable source is degraded:true with no
# all-clear copy, and that the Front Page says "couldn't check".
#
# macOS runner and Python 3.11: the platform and the interpreter the Hub ships.
# British English. No em dashes.

on:
  pull_request:
    paths:
      - 'vendor/cm048_pipeline/src/reply_debt.py'
      - 'vendor/cm048_pipeline/src/reply_debt_adapters.py'
      - 'vendor/cm048_pipeline/src/reply_debt_service.py'
      - 'vendor/cm041/assistant_api/ical-server.py'
      - 'vendor/imessage_source/**'
      - 'vendor/cm059_editor/compiler/signals.py'
      - 'vendor/cm059_editor/compiler/frontpage.py'
      - 'vendor/cm059_editor/compiler/render_frontpage.py'
      - 'tests/test_reply_debt_never_opens_protected_data.py'
      - 'tests/TEST_WIRING.tsv'
      - '.github/workflows/reply-debt-never-reads-protected-data.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  reply-debt:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # ical-server refuses to import without ostler_security; httpx, PyYAML
      # and phonenumbers are its and cm048's runtime deps.
      - name: Install pytest and the runtime dependencies
        run: |
          python -m pip install --quiet pytest httpx pyyaml phonenumbers fastapi
          python -m pip install --quiet ./vendor/ostler_security
      # ANTI-VACUITY AND THE RUN ARE ONE STEP ON PURPOSE.
      - name: Reply debt opens no protected path and never fakes an all-clear
        run: |
          n="$(python -m pytest tests/test_reply_debt_never_opens_protected_data.py \
                 --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 20 ]; then
            echo "REFUSING: expected at least 20 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python -m pytest tests/test_reply_debt_never_opens_protected_data.py -v -rs
