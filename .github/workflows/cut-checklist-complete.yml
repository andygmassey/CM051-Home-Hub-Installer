name: cut-checklist-complete

# The one pre-cut checklist must stay complete.
#
# Andy, 2026-09-05, on being shown the first honest count of remaining work:
# "maintain this discipline. Do NOT let it slip."
#
# cut-manifests/vX.Y.Z.yaml registers every open issue and marks the ones with
# no proof written as `gate: NONE YET`. Two ways that decays:
#
#   1. A NEW issue is opened and nobody adds it. The checklist still LOOKS
#      complete, because you cannot see what is not in it. That is what this
#      workflow catches, on every PR.
#   2. A cut happens while NONE YET rows remain. That is caught in cut.yml's
#      preflight, where the same script runs with OSTLER_CUT_IN_PROGRESS=1 and
#      the ungated rows become BLOCKING.
#
# Deliberately advisory about ungated rows HERE. There is always work in
# progress, and a PR gate that is permanently red teaches people to ignore it.
# It is blocking exactly where it matters: at the cut.
#
# Three states. If the open-issue list cannot be read -- no gh, no auth, an
# empty result -- this exits 2 CANNOT-RUN rather than passing. A register
# checked against nothing is not a checked register, and an empty issue list
# and a broken query print identically.

on:
  pull_request:
    paths:
      - 'tests/test_the_manifest_selector_survives_v1_0_100.sh'
      - 'cut-manifests/**'
      - 'tests/test_the_cut_checklist_is_complete.py'
      - 'tests/test_a_blocking_row_stops_a_cut.sh'
      - 'tests/test_a_ci_alarm_is_not_a_register_gap.py'
      - 'tests/test_a_struck_row_names_an_issue_not_a_pull_request.py'
      - '.github/workflows/cut-checklist-complete.yml'
  push:
    branches: [main]
  schedule:
    # Registration drift is caused by issues opened elsewhere, so it cannot be
    # caught by path triggers alone: a new issue touches no file in this repo.
    # Daily, so the register cannot silently rot between cuts.
    - cron: '17 6 * * *'

permissions:
  contents: read
  issues: read

concurrency:
  # Supersede in-flight runs for the same branch or PR.
  # NEVER cancels main: a cancelled main run is a gate that did not report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cut-checklist-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Driven red four ways before being wired: a cut with ungated rows, an
      # unregistered open issue, a truncated manifest and an empty one. The
      # truncated case originally crashed with AttributeError and exited 1,
      # which reads as a failed assertion about a checklist nobody looked at.
      # Found by driving the red paths, not by trusting that it compiled.
      - name: Every open issue is registered in the newest cut manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/test_the_cut_checklist_is_complete.py

      # The exclusion added for #1713 is a HOLE in the gate above, and a hole
      # needs its own guard. On 2026-09-06 this gate and
      # `red-main-opens-an-issue.yml` formed a closed loop: the gate went red,
      # the watchdog opened an issue labelled `main-red`, that open issue was
      # unregistered so the gate stayed red, so the issue never self-closed.
      # Main could not return to green by any amount of correct work.
      #
      # This drives the subject with a stubbed `gh` and asserts the hole is
      # exactly the shape of the alarm: an unlabelled issue is still required,
      # an issue with UNRELATED labels is still required, an alarm sitting
      # beside a real gap still fails and names the gap, and a repo whose every
      # open issue wears the label is CANNOT-RUN rather than a clean sheet.
      # if: always() so a red register still produces this evidence -- the run
      # that most needs it is exactly the run that would otherwise skip it.
      - name: The CI-alarm exclusion is exactly the shape of the alarm
        if: always()
        run: python3 tests/test_a_ci_alarm_is_not_a_register_gap.py

      # The gate above is only as good as the proof that it FIRES. This drives
      # it with a stubbed `gh` and a fixture manifest: a BLOCKING row whose
      # issue is open must stop a cut, a CLOSED one must not, "NOT BLOCKING"
      # must not match, and an unreadable issue list must refuse rather than
      # pass. Measured against origin/main's blob, the pre-fix subject exits 0
      # on a live BLOCKING row during a cut.
      - name: A BLOCKING row actually stops a cut
        # `if: always()` because verify_ci_steps_are_maskless caught this step
        # being SKIPPED when the check above it fails -- a gate you have read,
        # not a gate you have run.
        if: always()
        run: bash tests/test_a_blocking_row_stops_a_cut.sh

      - name: the manifest selector survives the v1.0.100 boundary
        # always(), because the next cut after v1.0.99 is the first version in
        # this project where a text sort and a version sort disagree, and a
        # step masked by an earlier red would not say so.
        if: always()
        run: bash tests/test_the_manifest_selector_survives_v1_0_100.sh

      # A ROW MAY NOT BE REMOVED FROM THE COUNT ON THE CLOSURE OF A NUMBER.
      #
      # On 2026-09-16, 41 rows were struck with "the issue this row names is
      # CLOSED on GitHub". Measured 2026-09-18: 41 of 41 resolve to a PULL
      # REQUEST, and 0 of 41 share two distinctive words with their row title.
      # Row 947 is iPhone pairing and PR 947 is a cut manifest. Row 1014,
      # struck by the same strike, is titled "78 registered rows name issues
      # that are already CLOSED".
      #
      # The blocking arm is OFFLINE and asks for the one thing nobody could
      # have supplied while making that mistake: the TITLE of what closed it.
      # The API arm runs and blocks whenever a token is present, and says so
      # rather than passing when it is not. A permanently-CANNOT-RUN gate is
      # row #2110's defect and this must not become one.
      #
      # if: always() for the same reason as every step above it.
      - name: a struck row names an issue, not a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        if: always()
        run: python3 tests/test_a_struck_row_names_an_issue_not_a_pull_request.py
