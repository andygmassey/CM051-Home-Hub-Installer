name: hub screens and the 106c screen fixes

# #106c (Andy's v1.0.105 console walk, 2026-09-28). The screen judge must be
# able to fail on every assertion (13 mutants), and the server-side fixes it
# measures are pinned by their own behavioural tests. Each test exits 2 on
# CANNOT-RUN, never 0: a check that could not run has not passed.

on:
  pull_request:
    paths:
      - 'scripts/box_walk_probes/lib/hub_screens.py'
      - 'scripts/box_walk_probes/probes/hub_screens_render_for_a_customer.sh'
      - 'scripts/box_walk_probes/lib/customer_read.py'
      - 'tests/test_customer_read_exempts_marked_customer_text.py'
      - 'scripts/box_walk_probes/lib/probe.sh'
      - 'tests/test_walk_probes_bypass_a_local_proxy.sh'
      - 'scripts/box_walk_probes/probes/hub_screens_customer_read.sh'
      - 'vendor/cm041/assistant_api/ical-server.py'
      - 'vendor/doctor/agent/editor_feedback.py'
      - 'vendor/cm059_editor/compiler/frontpage.py'
      - 'vendor/cm059_editor/compiler/render_frontpage.py'
      - 'tests/test_the_timeline_opens_on_today.py'
      - 'tests/test_the_hub_app_can_record_card_feedback.py'
      - 'tests/test_editor_feedback_accepts_the_real_client_action_strings.py'
      - 'tests/test_the_front_page_cards_only_real_interests.py'
      - 'tests/test_vendored_cm059_renders_a_birthday_card_with_no_body.py'
      - 'scripts/box_walk_probes/lib/owner_digest.py'
      - 'scripts/box_walk_probes/fixtures/owner_digest/**'
      - 'scripts/box_walk_probes/lib/owner_employer_seed.sh'
      - 'scripts/box_walk_probes/probes/owner_digest_knows_the_owner.sh'
      - 'scripts/box_walk_probes/run_box_walk.sh'
      - 'vendor/cm041/contact_syncer/linkedin_career.py'
      - 'tests/test_the_walk_seeds_the_owner_employer.sh'
      - 'scripts/box_walk_probes/lib/conversation_capture_e2e.py'
      - 'scripts/box_walk_probes/fixtures/conversation_capture_e2e/**'
      - 'scripts/box_walk_probes/lib/conversation_capture_seed.sh'
      - 'scripts/box_walk_probes/lib/companion_pair.py'
      - 'scripts/box_walk_probes/lib/companion_pair.sh'
      - 'scripts/box_walk_probes/probes/pairing_recovers_without_a_repair_storm.sh'
      - 'tests/test_a_pairing_non_answer_is_not_a_rejection.sh'
      - 'tests/test_a_pairing_reader_runs_before_the_pairing_mutator.sh'
      - 'scripts/box_walk_probes/probes/conversation_capture_end_to_end.sh'
      - 'tests/test_the_walk_seeds_the_conversation_capture.sh'
      - 'vendor/cm048_pipeline/src/conversation_writer.py'
      - 'scripts/box_walk_probes/lib/db_key_probe.py'
      - 'scripts/box_walk_probes/probes/db_key_reaches_every_service.sh'
      - 'scripts/box_walk_probes/lib/brief_channel_probe.py'
      - 'scripts/box_walk_probes/probes/assistant_sends_over_whatsapp_and_email.sh'
      - 'scripts/box_walk_probes/lib/todo_reminders_probe.py'
      - 'scripts/box_walk_probes/lib/todo_reminders_box.py'
      - 'scripts/box_walk_probes/probes/todos_reach_reminders.sh'
      - 'scripts/walk_promote_scope.tsv'
      - 'scripts/box_walk_probes/console_only_probes.tsv'
      - '.github/workflows/hub-screens-and-106c.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hub-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: The screen judge catches every mutant
        run: python3 scripts/box_walk_probes/lib/hub_screens.py --self-test
      - name: The screen probe's own self-test
        # Phase-1 contract (run_box_walk.sh): --self-test feeds KNOWN-BAD
        # screens and must report FAIL (exit 1) with the negative control
        # behaving. Exit 0 means the probe passed bad input; any other code
        # means it could not run. Both fail this step.
        if: always()
        run: |
          set +e
          out=$(bash scripts/box_walk_probes/probes/hub_screens_render_for_a_customer.sh --self-test 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 1 ]; then echo "self-test exit $rc, expected 1 (known-bad input must FAIL)"; exit 1; fi
          if ! printf '%s\n' "$out" | grep -c 'negative control behaved' >/dev/null; then echo "exit 1 but no 'negative control behaved' verdict"; exit 1; fi
      - name: The customer-read judge catches every defect class by its own assertion
        if: always()
        run: python3 scripts/box_walk_probes/lib/customer_read.py --self-test
      - name: The em dash check exempts marked customer text and nothing else, in a real browser (cut 13)
        # The self-test above is pure Python over facts and cannot see
        # CUSTOMER_TITLES_JS. This runs that JavaScript in Chromium against
        # synthetic pages and feeds the result to the real judge. Exit 2 is
        # CANNOT-RUN and fails the step: a check that could not run has not passed.
        if: always()
        run: |
          python3 -m venv /tmp/pw
          /tmp/pw/bin/pip install --quiet playwright==1.63.0
          /tmp/pw/bin/python -m playwright install --with-deps chromium
          /tmp/pw/bin/python tests/test_customer_read_exempts_marked_customer_text.py
      - name: Walk probes reach loopback through a dead HTTP_PROXY
        if: always()
        run: bash tests/test_walk_probes_bypass_a_local_proxy.sh
      - name: The customer-read probe's own self-test
        if: always()
        run: |
          set +e
          out=$(bash scripts/box_walk_probes/probes/hub_screens_customer_read.sh --self-test 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 1 ]; then echo "self-test exit $rc, expected 1 (known-bad input must FAIL)"; exit 1; fi
          if ! printf '%s\n' "$out" | grep -c 'negative control behaved' >/dev/null; then echo "exit 1 but no 'negative control behaved' verdict"; exit 1; fi
      - name: The Timeline opens on today, pages both ways and names its rows
        if: always()
        run: python3 tests/test_the_timeline_opens_on_today.py
      - name: The Hub app may record a Front Page card tap
        if: always()
        run: python3 tests/test_the_hub_app_can_record_card_feedback.py
      - name: The feedback route accepts the real clients' action strings
        if: always()
        run: python3 tests/test_editor_feedback_accepts_the_real_client_action_strings.py
      - name: The Front Page cards only real interests
        if: always()
        run: python3 tests/test_the_front_page_cards_only_real_interests.py
      - name: The vendored cm059_editor renders a real bodyless birthday card
        # v1.0.107 incident: #2535 made birthday_card() emit body=None, which
        # crashed the SHIPPED vendor/cm059_editor render_frontpage._card_html
        # with AttributeError every hour on every box. Proven against the
        # vendored copy, not upstream CM059 -- the two disagreed.
        if: always()
        run: python3 tests/test_vendored_cm059_renders_a_birthday_card_with_no_body.py
      - name: The owner-digest judge catches every mutant (v1.0.107 #10)
        if: always()
        run: python3 scripts/box_walk_probes/lib/owner_digest.py --self-test
      - name: The owner-digest probe's own self-test
        if: always()
        run: |
          set +e
          out=$(bash scripts/box_walk_probes/probes/owner_digest_knows_the_owner.sh --self-test 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 1 ]; then echo "self-test exit $rc, expected 1 (known-bad input must FAIL)"; exit 1; fi
          if ! printf '%s\n' "$out" | grep -c 'negative control behaved' >/dev/null; then echo "exit 1 but no 'negative control behaved' verdict"; exit 1; fi
      - name: The conversation-capture judge catches every mutant, including the mandated missing-artefact one (v1.0.107 #10)
        if: always()
        run: python3 scripts/box_walk_probes/lib/conversation_capture_e2e.py --self-test
      - name: The companion pairing helper builds what the Hub verifies (#17, real /auth/pair flow)
        # HKDF against RFC 5869, the webauthn.create/get clientData bind the
        # server challenge, the ES256 assertion verifies, companion_proof =
        # HMAC(KEK(prf)). The end-to-end proof is against a gateway built from
        # ostler-assistant #501 (recorded in the PR); this pins the offline half.
        if: always()
        run: |
          python3 -m pip install --quiet cryptography
          python3 scripts/box_walk_probes/lib/companion_pair.py --self-test
      - name: Probes pair through the companion flow, and a non-answer is not a rejection
        if: always()
        run: |
          bash tests/test_a_pairing_non_answer_is_not_a_rejection.sh
          bash tests/test_a_pairing_reader_runs_before_the_pairing_mutator.sh
      - name: The conversation-capture probe's own self-test
        if: always()
        run: |
          set +e
          out=$(bash scripts/box_walk_probes/probes/conversation_capture_end_to_end.sh --self-test 2>&1); rc=$?
      - name: The db-key judge catches every mutant (v1.0.107 #10 follow-up, FLOW_CENSUS gap #1)
        if: always()
        run: python3 scripts/box_walk_probes/lib/db_key_probe.py --self-test
      - name: The db-key probe's own self-test
        if: always()
        run: |
          set +e
          out=$(bash scripts/box_walk_probes/probes/db_key_reaches_every_service.sh --self-test 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 1 ]; then echo "self-test exit $rc, expected 1 (known-bad input must FAIL)"; exit 1; fi
          if ! printf '%s\n' "$out" | grep -c 'negative control behaved' >/dev/null; then echo "exit 1 but no 'negative control behaved' verdict"; exit 1; fi
      - name: The brief-channel judge catches every mutant (FLOW_CENSUS gap #5/#3)
        if: always()
        run: python3 scripts/box_walk_probes/lib/brief_channel_probe.py --self-test
      - name: The brief-channel probe's own self-test
        if: always()
        run: |
          set +e
          out=$(bash scripts/box_walk_probes/probes/assistant_sends_over_whatsapp_and_email.sh --self-test 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 1 ]; then echo "self-test exit $rc, expected 1 (known-bad input must FAIL)"; exit 1; fi
          if ! printf '%s\n' "$out" | grep -c 'negative control behaved' >/dev/null; then echo "exit 1 but no 'negative control behaved' verdict"; exit 1; fi
      - name: The todo-reminders judge catches every mutant (FLOW_CENSUS gap #6)
        if: always()
        run: python3 scripts/box_walk_probes/lib/todo_reminders_probe.py --self-test
      - name: The todo-reminders probe's own self-test
        if: always()
        run: |
          set +e
          out=$(bash scripts/box_walk_probes/probes/todos_reach_reminders.sh --self-test 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 1 ]; then echo "self-test exit $rc, expected 1 (known-bad input must FAIL)"; exit 1; fi
          if ! printf '%s\n' "$out" | grep -c 'negative control behaved' >/dev/null; then echo "exit 1 but no 'negative control behaved' verdict"; exit 1; fi
      - name: The todo-reminders box script at least compiles
        if: always()
        run: python3 -m py_compile scripts/box_walk_probes/lib/todo_reminders_box.py

  owner-employer-seed:
    # The seed runs on the Hub and uses BSD stat, so it is proven on macOS.
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: The walk seeds the owner's employer through the LinkedIn import
        run: bash tests/test_the_walk_seeds_the_owner_employer.sh

  conversation-capture-seed:
    # Pure bash + a stubbed curl on PATH; no real gateway needed, but kept
    # alongside the other seed-wiring jobs on macOS for consistency.
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: The walk seeds two conversations through the paired gateway
        run: bash tests/test_the_walk_seeds_the_conversation_capture.sh
