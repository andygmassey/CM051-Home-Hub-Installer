# ingest-slot
#
# Runs tests/test_ingest_slot_fairness.sh, which was previously started by
# nothing at all. The test-wiring gate caught that on the PR that introduced
# it: 415 lines that demonstrated RED once and then asserted nothing ever
# again, because no workflow named the file.
#
# WHAT IT GUARDS. One mkdir mutex arbitrates every LLM ingest job on the Hub:
# four conversation feeds and the wiki recompile. On the live v1.0.26 box the
# email feed held it for over an hour while the iMessage feed, which had never
# completed a single pass since install, woke every 15 minutes and yielded.
# The suite covers the bounded hold, the derived patience, FIFO order, the
# idle-box exemption that keeps a multi-hour wiki backfill safe, the FDA
# denial-string translation, install.sh delivery and embed drift, and (Sections
# 9 and 10) that every contending tick is actually WIRED to the lib. That last
# one exists because an earlier revision delivered the lib to ~/.ostler/lib/
# and called it from nowhere, which left the starvation completely untouched
# while every other section passed.
#
# RUNNER SPLIT, and it is a deliberate cost decision rather than an oversight.
# Actions minutes are the binding constraint on parallel work right now, and a
# macOS runner bills at ten times an ubuntu one. So:
#
#   suite      ubuntu-latest, ~2 min, carries the behaviour
#   shell-3-2  macos-latest, seconds, carries the ONE thing ubuntu cannot
#              prove: these files are forked with /bin/bash, which is 3.2.57
#              on the customer's Mac and 5.x on an ubuntu runner. A 4.x-only
#              construct passes every ubuntu check and breaks on every
#              customer. The suite prints the version it actually used, so a
#              log can never imply a 3.2 proof it did not perform.
#
# Both jobs are path-filtered to the arbitration surface, so an unrelated PR
# starts neither.

name: ingest-slot

on:
  pull_request:
    paths:
      - 'lib/ostler-ingest-slot.sh'
      - 'tests/test_ingest_slot_fairness.sh'
      - 'tests/test_a_hung_slot_holder_is_stopped.sh'
      - 'tests/test_prelaunch_libs_survive_promote.sh'
      - 'vendor/email_source/bin/email-bundle-tick.sh'
      - 'vendor/imessage_source/bin/imessage-bundle-tick.sh'
      - 'vendor/whatsapp_source/bin/whatsapp-bundle-tick.sh'
      - 'vendor/spoken_source/bin/spoken-bundle-tick.sh'
      - 'vendor/imessage_source/reader.py'
      - 'wiki-recompile/bin/wiki-recompile-tick.sh'
      - 'install.sh'
      - '.github/workflows/ingest-slot.yml'
  push:
    branches: [main]
    paths:
      - 'lib/ostler-ingest-slot.sh'
      - 'tests/test_ingest_slot_fairness.sh'
      - 'tests/test_a_hung_slot_holder_is_stopped.sh'
      - 'tests/test_prelaunch_libs_survive_promote.sh'
      - 'vendor/email_source/bin/email-bundle-tick.sh'
      - 'vendor/imessage_source/bin/imessage-bundle-tick.sh'
      - 'vendor/whatsapp_source/bin/whatsapp-bundle-tick.sh'
      - 'vendor/spoken_source/bin/spoken-bundle-tick.sh'
      - 'vendor/imessage_source/reader.py'
      - 'wiki-recompile/bin/wiki-recompile-tick.sh'
      - 'install.sh'
      - '.github/workflows/ingest-slot.yml'

permissions:
  contents: read

jobs:
  suite:
    name: A feed cannot be starved, and every feed is wired to the slot
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ingest slot fairness suite
        run: bash tests/test_ingest_slot_fairness.sh

      # The fairness suite above cannot see this case. The max-hold watchdog
      # arms only when a feed is ENROLLED AND WAITING, and a hung holder's
      # victims die before they can stay enrolled, so nothing ever bounds it.
      # Measured on a real box: 8h49m of hold with a zero-byte log, and no line
      # anywhere saying so. Cumulative cpu is the discriminator; the negative
      # control proves a genuinely busy payload is left alone.
      - name: A hung slot holder is stopped, a busy one is not
        if: success() || failure()
        run: bash tests/test_a_hung_slot_holder_is_stopped.sh

      # Sections 1 to 6 above prove the lib arbitrates fairly; Section 7
      # proves install.sh CARRIES it. Neither can see whether it arrives.
      # install.sh writes into a /tmp staging tree and promotes that tree
      # to ~/.ostler by deleting each final-tree entry and moving the
      # staged one over it, so a lib written straight to ${HOME}/.ostler/lib
      # is removed by the install that wrote it. Measured on the walk box
      # on 2026-09-23: the suite above was green and
      # ~/.ostler/lib/ostler-ingest-slot.sh did not exist, so the wiki
      # summary backfill ran on the unbounded fallback mutex.
      #
      # This runs the real write statements and the real promote function,
      # both extracted from install.sh, and then asks whether the file is
      # there. It exits 2 for CANNOT-RUN, which is neither a pass nor a
      # fail, so a harness that stops measuring says so instead of going
      # green.
      - name: Every embedded lib survives the staging-tree promote
        if: success() || failure()
        run: bash tests/test_prelaunch_libs_survive_promote.sh

      # v1.0.107 / PR #2611 review (Archie): this behaviour suite was
      # previously UNWIRED -- no workflow ran it, so a "pass" on the PR
      # proved nothing (launch directive item 9). It also could not have
      # proven anything on a developer Mac: real Docker Desktop installs at
      # /usr/local/bin/docker, which the wrapper hard-prepends ahead of the
      # test's own stub, so every stub-docker case (including the new
      # stall-watchdog one) silently SKIPPED there. ubuntu-latest has no
      # docker at /usr/local/bin or /opt/homebrew/bin, so the stub wins here
      # and every case actually runs rather than skipping.
      - name: Install pytest for the wiki-recompile-tick behaviour suite
        if: success() || failure()
        run: python -m pip install --quiet pytest

      - name: wiki-recompile-tick.sh behaviour (stub docker, now actually runs)
        if: success() || failure()
        run: python -m pytest wiki-recompile/tests/test_wiki_recompile_tick.py -v

      # THE MUTATION PROOF Archie asked for: a wired test that only ever
      # passes has been run, not tested (see "Before you say it works" in
      # CLAUDE.md). Strip the stall-watchdog disarm back out of a COPY of
      # the script, confirm the copy actually differs (a mutant that did not
      # apply would pass this trivially and prove nothing), then assert the
      # new regression case REDS against it and GREENS against the real,
      # shipped script. Both appear in this job's log on every run, so a
      # future edit that quietly drops the disarm is caught here.
      - name: Build the stall-watchdog mutant (disarm line removed)
        if: success() || failure()
        run: |
          set -e
          sed '/^            OSTLER_SLOT_STALL_SECS=0$/,+1d' \
            wiki-recompile/bin/wiki-recompile-tick.sh > /tmp/mutant-wiki-recompile-tick.sh
          if diff -q wiki-recompile/bin/wiki-recompile-tick.sh /tmp/mutant-wiki-recompile-tick.sh >/dev/null; then
            echo "REFUSING: the mutant is byte-identical to the real script -- the sed pattern did not match, so running a test against it would prove nothing." >&2
            exit 1
          fi
          if grep -q 'OSTLER_SLOT_STALL_SECS' /tmp/mutant-wiki-recompile-tick.sh; then
            echo "REFUSING: the mutant still disarms the stall watchdog -- the removal did not take." >&2
            exit 1
          fi
          bash -n /tmp/mutant-wiki-recompile-tick.sh
          echo "OK: mutant built, confirmed to differ from the shipped script, and confirmed to still parse."

      - name: RED -- the new case fails against the mutant (watchdog re-armed)
        if: success() || failure()
        env:
          WIKI_RECOMPILE_TICK_SH: /tmp/mutant-wiki-recompile-tick.sh
        run: |
          set +e
          python -m pytest wiki-recompile/tests/test_wiki_recompile_tick.py::test_full_compile_survives_past_the_stall_window -v
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: the regression test PASSED against the mutant (stall watchdog re-armed). It does not discriminate a real fix from a reverted one -- see PR #2611 review." >&2
            exit 1
          fi
          echo "OK: the regression test correctly FAILED against the mutant (pytest exit ${rc}). It can discriminate."

      - name: GREEN -- the new case passes against the real, shipped script
        if: success() || failure()
        run: python -m pytest wiki-recompile/tests/test_wiki_recompile_tick.py::test_full_compile_survives_past_the_stall_window -v

      # v1.0.107 walk #4: the stall-watchdog fix above was NOT enough. launchd
      # kills a job's whole PROCESS GROUP when its main process exits unless
      # AbandonProcessGroup is set, and `nohup ... & disown` never moves the
      # detached compile out of that group. The fix is `set -m` at the launch
      # site, which makes bash give the backgrounded job its OWN process
      # group -- a second, independent mutation proof, same shape as the one
      # above: strip `set -m` from a copy, assert the new case REDS against
      # it, then assert it GREENS against the real script.
      - name: Build the process-group mutant (set -m removed)
        if: success() || failure()
        run: |
          set -e
          sed '/^    set -m$/d' \
            wiki-recompile/bin/wiki-recompile-tick.sh > /tmp/mutant-no-setm-wiki-recompile-tick.sh
          if diff -q wiki-recompile/bin/wiki-recompile-tick.sh /tmp/mutant-no-setm-wiki-recompile-tick.sh >/dev/null; then
            echo "REFUSING: the mutant is byte-identical to the real script -- the sed pattern did not match, so running a test against it would prove nothing." >&2
            exit 1
          fi
          if grep -q '^    set -m$' /tmp/mutant-no-setm-wiki-recompile-tick.sh; then
            echo "REFUSING: the mutant still enables job control -- the removal did not take." >&2
            exit 1
          fi
          bash -n /tmp/mutant-no-setm-wiki-recompile-tick.sh
          echo "OK: process-group mutant built, confirmed to differ from the shipped script, and confirmed to still parse."

      - name: RED -- the detached compile does not survive a group kill against the mutant
        if: success() || failure()
        env:
          WIKI_RECOMPILE_TICK_SH: /tmp/mutant-no-setm-wiki-recompile-tick.sh
        run: |
          set +e
          python -m pytest wiki-recompile/tests/test_wiki_recompile_tick.py::test_detached_compile_survives_a_launchd_process_group_kill -v
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: the regression test PASSED against the mutant (set -m removed). It does not discriminate a real fix from a reverted one -- see the v1.0.107 walk #4 review." >&2
            exit 1
          fi
          echo "OK: the regression test correctly FAILED against the mutant (pytest exit ${rc}). It can discriminate."

      - name: GREEN -- the detached compile survives a group kill against the real, shipped script
        if: success() || failure()
        run: python -m pytest wiki-recompile/tests/test_wiki_recompile_tick.py::test_detached_compile_survives_a_launchd_process_group_kill -v

  shell-3-2:
    name: The shipped ticks parse under bash 3.2, the customer's shell
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report the shell being proven against
        run: /bin/bash --version | head -1

      - name: Refuse if the runner is not actually bash 3.x
        run: |
          set -e
          # Without this the job could silently become a duplicate of the
          # ubuntu one, pass forever, and prove nothing. A gate must name
          # the surface it is measuring.
          ver="$(/bin/bash -c 'echo ${BASH_VERSINFO[0]}')"
          if [ "$ver" != "3" ]; then
            echo "REFUSING: /bin/bash on this runner is ${ver}.x, not 3.x." >&2
            echo "This job exists only to prove 3.2 compatibility. Passing it" >&2
            echo "on a 5.x shell would be a green that measures nothing." >&2
            exit 1
          fi
          echo "OK: proving against /bin/bash ${ver}.x"

      - name: Every slot-contending script parses
        run: |
          set -e
          rc=0
          for f in \
            lib/ostler-ingest-slot.sh \
            vendor/email_source/bin/email-bundle-tick.sh \
            vendor/imessage_source/bin/imessage-bundle-tick.sh \
            vendor/whatsapp_source/bin/whatsapp-bundle-tick.sh \
            vendor/spoken_source/bin/spoken-bundle-tick.sh \
            wiki-recompile/bin/wiki-recompile-tick.sh \
            tests/test_ingest_slot_fairness.sh \
            tests/test_prelaunch_libs_survive_promote.sh
          do
            if [ ! -f "$f" ]; then
              echo "REFUSING: $f is missing; the list is stale and a clean result here would be manufactured" >&2
              rc=1
              continue
            fi
            if /bin/bash -n "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f does not parse under bash 3.2" >&2
              rc=1
            fi
          done
          echo "examined 8 files"
          exit "$rc"
