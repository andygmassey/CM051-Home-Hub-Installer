# CM051, Andy's v1.0.107 candidate #28 walk: all 51,808 music preferences on
# the box were "Like". A play is a listen; "Like" is kept for what the owner
# said (saved, loved, rated, a playlist they made). Drives the shipped CM019
# parsers + filters.py and the shipped CM059 projector + front page reader,
# on synthetic data only.
name: music-plays-are-listens

on:
  push:
    branches: [main]
    paths:
      - 'vendor/cm019_preferences/services/ingest/src/filters.py'
      - 'vendor/cm019_preferences/services/ingest/src/parsers/**'
      - 'vendor/cm059_editor/compiler/interest_profile.py'
      - 'vendor/cm059_editor/compiler/project_preferences.py'
      - 'tests/test_music_plays_are_listens_not_likes.py'
      - '.github/workflows/music-plays-are-listens.yml'
  pull_request:
    paths:
      - 'vendor/cm019_preferences/services/ingest/src/filters.py'
      - 'vendor/cm019_preferences/services/ingest/src/parsers/**'
      - 'vendor/cm059_editor/compiler/interest_profile.py'
      - 'vendor/cm059_editor/compiler/project_preferences.py'
      - 'tests/test_music_plays_are_listens_not_likes.py'
      - '.github/workflows/music-plays-are-listens.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  music-plays-are-listens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest and the vendored CM019 ingest dependencies
        run: python -m pip install --quiet pytest -r vendor/cm019_preferences/requirements.txt
      - name: A play is a listen, a save is a like
        run: |
          n="$(python -m pytest tests/test_music_plays_are_listens_not_likes.py \
                 --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 12 ]; then
            echo "REFUSING: expected at least 12 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python -m pytest tests/test_music_plays_are_listens_not_likes.py -v -rs
