# CM051 #2543: the LID-as-phone repair (CM041 #181, vendored at
# vendor/cm041/identity_resolver/repair_lid_as_phone.py) must actually be
# tested against the copy that ships, and install.sh's one-time upgrade step
# that invokes it must never be able to abort the customer's install.
name: repair-lid-as-phone-vendored

on:
  push:
    branches: [main]
    paths:
      - 'vendor/cm041/identity_resolver/repair_lid_as_phone.py'
      - 'vendor/cm041/identity_resolver/normalise.py'
      - 'tests/test_repair_lid_as_phone_vendored.py'
      - 'tests/test_repair_lid_as_phone_marker_skip.sh'
      - 'install.sh'
      - '.github/workflows/repair-lid-as-phone-vendored.yml'
  pull_request:
    paths:
      - 'vendor/cm041/identity_resolver/repair_lid_as_phone.py'
      - 'vendor/cm041/identity_resolver/normalise.py'
      - 'tests/test_repair_lid_as_phone_vendored.py'
      - 'tests/test_repair_lid_as_phone_marker_skip.sh'
      - 'install.sh'
      - '.github/workflows/repair-lid-as-phone-vendored.yml'

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:

  marker-skip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: install.sh's one-time repair step runs, skips, and never aborts the install
        run: bash tests/test_repair_lid_as_phone_marker_skip.sh
