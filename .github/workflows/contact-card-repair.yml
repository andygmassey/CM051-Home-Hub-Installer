# Task #659 repair. identity_resolver RULE 2 stops NEW over-merges; this
# repairs the graph already written, un-merging Person nodes that carry 2+
# distinct icloud_contact_uid.
#
# THE LOAD-BEARING PROPERTIES ARE NEGATIVE ONES, which is why this runs at
# all rather than being trusted because it passed once on a box:
#   * no Person node is ever DELETED -- these nodes carry real identifiers,
#     attributes and inbound edges, unlike the role-address robots
#   * --undo restores the graph EXACTLY, proven both directions on a live box
#     (128 nodes/263 cards -> 99/204 -> back to 128/263, total triples
#     248082 -> 248065 -> 248082, with a 2259-identifier control that never
#     moved, so no card was destroyed)
#   * it REFUSES to run at all when the icloud_contact_uid control is zero,
#     so an empty or wrong graph cannot be silently "repaired"
#
# The module is DORMANT by design (scripts/fda_unwired_modules.tsv): it
# repairs the 30 of 128 it can PROVE and leaves 98 by design, and firing a
# partial repair at every customer graph is a product call nobody has made.
# Dormant is not untested. This workflow is what keeps it honest while it
# waits.
name: contact-card-repair

on:
  push:
    branches: [main]
    paths:
      - 'vendor/ostler_fda/repair_overmerged_contact_cards.py'
      - 'vendor/ostler_fda/identity_resolver.py'
      - 'tests/test_repair_overmerged_contact_cards.py'
      - '.github/workflows/contact-card-repair.yml'
  pull_request:
    paths:
      - 'vendor/ostler_fda/repair_overmerged_contact_cards.py'
      - 'vendor/ostler_fda/identity_resolver.py'
      - 'tests/test_repair_overmerged_contact_cards.py'
      - '.github/workflows/contact-card-repair.yml'

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  contact-card-repair:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # rdflib is a TEST dependency, not a runtime one. It is deliberately
      # absent from vendor/ostler_fda/pyproject.toml, whose only deps are
      # httpx and nameparser, because the shipped module talks to Oxigraph
      # over HTTP and never imports rdflib. The test uses it to stand up an
      # in-memory graph.
      #
      # INSTALLING IT IS LOAD-BEARING, NOT HOUSEKEEPING. The test opens with
      # `pytest.importorskip("rdflib")`, so WITHOUT this line the entire
      # module skips: measured on the first run of this workflow, all three
      # interpreters reported "collected 0 items / 1 skipped". Twenty-seven
      # assertions, an anti-vacuity fixture check and ten killed mutants,
      # all silently not run.
      - name: Install pytest and the graph the fixtures need
        run: python -m pip install --quiet pytest rdflib
      # ANTI-VACUITY, BEFORE THE RUN THAT MATTERS. pytest exits 5 on "no tests
      # collected" and `bash -e` does fail on it, so the skip above WAS caught
      # by default. This step is here so that safety is EXPLICIT and survives
      # someone later adding `|| true`, changing the runner, or reaching for a
      # flag that softens the exit code. A gate whose fail-closed behaviour is
      # an accident of another tool's exit convention is one edit from silent.
      - name: The suite must actually collect, or it proves nothing
        run: |
          n="$(python -m pytest tests/test_repair_overmerged_contact_cards.py \
                 --collect-only -q 2>/dev/null | grep -cE '::test_' || true)"
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 20 ]; then
            echo "REFUSING: expected at least 20 collected tests, got ${n:-0}." >&2
            echo "A skipped module reports success in any runner that reads" >&2
            echo "'no failures' as 'passed'. Check rdflib installed." >&2
            exit 1
          fi
      - name: The repair never deletes a person, and undo restores exactly
        run: python -m pytest tests/test_repair_overmerged_contact_cards.py -v
