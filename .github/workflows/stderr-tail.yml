# v1018-D032. A failed dispatch's captured stderr is the only record of
# what pwg-convo was doing. Keeping the FIRST N characters of it discards
# exactly the part that localises a hang. A 13-hour wedge on the shipped
# box surfaced 500 characters, all from its first ten seconds, and a
# conclusion was drawn from the truncation.
name: stderr-tail

on:
  push:
    paths:
      - 'vendor/email_source/pipeline.py'
      - 'vendor/whatsapp_source/pipeline.py'
      - 'vendor/imessage_source/pipeline.py'
      - 'vendor/spoken_source/pipeline.py'
      - 'tests/test_stderr_tail.sh'
      - '.github/workflows/stderr-tail.yml'
  pull_request:
    paths:
      - 'vendor/email_source/pipeline.py'
      - 'vendor/whatsapp_source/pipeline.py'
      - 'vendor/imessage_source/pipeline.py'
      - 'vendor/spoken_source/pipeline.py'
      - 'tests/test_stderr_tail.sh'
      - '.github/workflows/stderr-tail.yml'

jobs:
  stderr-tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Captured stderr keeps its useful end
        run: bash tests/test_stderr_tail.sh
