      # install?" and "keeps updating?" -- which one timestamp cannot. Extracts
      # and drives the real recorders, so it cannot pass against a copy.
      - id: b19_s11
        if: ${{ steps.select.outputs.b19 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: Sentinel carries a typed item_count and a distinct last_update_at
        run: bash tests/test_hydrate_sentinel_change_fields.sh
      # G1c/G3: the source-status record is an on-disk contract between the CM051
      # writer (install.sh) and the vendored doctor reader (web_ui.py). This runs
      # BOTH halves for real and asserts every field round-trips, so a key one
