      - id: b04_s21
        if: ${{ steps.select.outputs.b04 != 'false' && matrix.shard == 1 && (always()) }}
        timeout-minutes: 25
        name: A tally that contradicts the log is not a pass
        run: bash tests/test_a_tally_that_contradicts_the_log_is_not_a_pass.sh
      - id: b04_s22
        if: ${{ steps.select.outputs.b04 != 'false' && matrix.shard == 1 && (always()) }}
        timeout-minutes: 25
        name: An artefact walk stages the DMG payload, not the checkout
        run: bash tests/test_artefact_walk_stages_the_dmg_payload.sh
      # Walk 6 was killed at step 11 of 40 while PERFECTLY HEALTHY: a 3.5 GB
      # vane image pull writes nothing to the marker wire, and install.sh
      # itself logs that the silence is expected. A fixed log-silence cap
      # measures which STEP is running, not whether the box is wedged.
      - id: b04_s23
        if: ${{ steps.select.outputs.b04 != 'false' && matrix.shard == 1 && (always()) }}
        timeout-minutes: 25
        name: A slow step is not a wedged one
        run: bash tests/test_a_slow_step_is_not_a_wedged_one.sh
      - id: b04_s24
        if: ${{ steps.select.outputs.b04 != 'false' && matrix.shard == 1 && (always()) }}
        timeout-minutes: 25
        name: _ostler_consent_state is defined above its call sites (one function, not the class)
        run: bash tests/test_consent_state_is_defined_before_it_is_called.sh
      # #1540. The recovery key is minted, the DEK is wrapped under it, and the
      # key is never stored. So the run that MINTS it is the only run that can
      # ever hand it over: the keychain persists, and every later run takes
      # install.sh's "already configured" skip and emits nothing. install.sh
      # used to reveal it 15,490 lines after minting it, and the GUI presented
      # the reveal sheet only inside `finished == .ok`. Measured on archie2,
      # 2026-09-05: an attempt minted and failed, the next finished clean with
      # nothing to show, and `ostler-recovery` can never succeed for that box.
      - id: b04_s25
        if: ${{ steps.select.outputs.b04 != 'false' && matrix.shard == 1 && (always()) }}
        timeout-minutes: 25
        name: The recovery key is disclosed by the run that mints it, on both surfaces
        run: bash tests/test_the_recovery_key_is_disclosed_where_it_is_minted.sh
      # #1540, the other half. Disclosing the key is one property; NOT CLAIMING
      # a recovery capability when it was never handed over is a second, and it
      # is the one that bites hardest -- a summary asserting recovery stops the
      # customer taking their own backup. Executes the real summary block under
      # each state rather than grepping for a display call, because a grep
      # passes while the call sits behind a condition that never fires.
      - id: b04_s26
        if: ${{ steps.select.outputs.b04 != 'false' && matrix.shard == 1 && (always()) }}
        timeout-minutes: 25
        name: The summary never claims a recovery path that was not handed over
        run: bash tests/test_the_summary_never_claims_a_recovery_path_that_was_not_handed_over.sh
      # #1559. An absent launchd domain and a not-yet-loaded agent are
