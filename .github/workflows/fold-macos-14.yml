      # ========================================================================
      # b05: colima-autostart.yml :: autostart-mechanism
      # ========================================================================
      - id: b05_isolate
        name: "[b05] colima-autostart.yml :: autostart-mechanism -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b05 != 'false' && matrix.shard == 3 }}
