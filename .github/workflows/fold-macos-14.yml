      - id: b19_isolate
        name: "[b19] hydrate-sentinel.yml :: sentinel-honesty -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b19 != 'false' && matrix.shard == 2 }}
