      - id: b19_s02
        if: ${{ steps.select.outputs.b19 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: the hydrate sentinel gate can still go red
        run: bash tests/test_hydrate_sentinel_not_on_error.sh --self-test
      # if: always() so a failure in the first test cannot silence the second.
      # A skipped test reads as "no objection", which is the class of defect
      # this whole workflow exists to remove.
      - id: b19_s03
        if: ${{ steps.select.outputs.b19 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: AI-Conversations hydrate honesty, the test that carried the rule
        run: bash tests/test_aiconv_hydrate_honesty.sh
      # A source that RAN AND FOUND NO INPUT must not claim success, and the
      # --repair flag Doctor advertises in 10 separate strings must actually
