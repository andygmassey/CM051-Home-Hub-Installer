concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# Read-only. No folded member uses the token (checked at generate);
# the selector reads the PR's changed-file list with it.
permissions:
  contents: read
  pull-requests: read

jobs:
  macos-14:
    runs-on: macos-14
    # Sum of the folded jobs' own timeouts (380 min), capped at 70 so the
    # CI Required Gate (75 min hard cap) still sees a verdict. Every step below
    # keeps its old job's timeout, so a hang is bounded where it always was.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          # A member checked out full history; the family does for all.
          fetch-depth: 0
      # The runner's own python3, which each block's venv is built from (with
      # its system site-packages), so every block starts from what a fresh
      # machine gave it and installs into its own venv.
      - id: python
        name: The runner's python3, the base of every block's venv
        run: echo "python-path=$(command -v python3)" >> "$GITHUB_OUTPUT"
      - name: Pin the pip cache to the real HOME before blocks move it
        run: echo "PIP_CACHE_DIR=$HOME/.cache/pip" >> "$GITHUB_ENV"
      # Each block runs only if the PR changes a file its OWN old workflow watched
      # (.github/ci-fold-paths.tsv), so the family does the work the old jobs did, no more.
      # FAILS OPEN: a push, an API error, an empty or capped file list, or a glob
      # form it cannot model exactly runs the block. Skipping is the only outcome
      # that needs evidence.
      - id: select
        name: Which blocks this change can affect (fails open)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python3 scripts/ci_fold.py select macos-14

      # ========================================================================
      # b01: bash32-compat.yml :: bash32
      # ========================================================================
      - id: b01_isolate
        name: "[b01] bash32-compat.yml :: bash32 -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b01 != 'false' && matrix.shard == 2 }}
        env:
          PY: ${{ steps.python.outputs.python-path }}
          BLOCK: ${{ runner.temp }}/ci-fold/b01
        run: |
          set -eu
          git -C "$GITHUB_WORKSPACE" reset --hard -q HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          rm -rf "$BLOCK"
          mkdir -p "$BLOCK/home" "$BLOCK/tmp"
          "$PY" -m venv --system-site-packages "$BLOCK/venv"
          echo "$BLOCK/venv/bin" >> "$GITHUB_PATH"
          {
            echo "HOME=$BLOCK/home"
            echo "TMPDIR=$BLOCK/tmp"
            echo "VIRTUAL_ENV=$BLOCK/venv"
          } >> "$GITHUB_ENV"
      # Record the shells before any assertion leans on them. If /bin/bash is
      # ever not 3.2 on this runner image, every arm below silently becomes a
      # weaker claim, and a job that cannot say which shell it measured has
      # not measured anything.
      - id: b01_s01
        if: ${{ steps.select.outputs.b01 != 'false' && matrix.shard == 2 && !cancelled() && steps.b01_isolate.conclusion != 'failure' }}
        timeout-minutes: 15
        name: Record the shells this job actually has
        run: |
          set -uo pipefail
          echo "/bin/bash : $(/bin/bash -c 'echo $BASH_VERSION')"
          echo "PATH bash : $(bash -c 'echo $BASH_VERSION')"
          case "$(/bin/bash -c 'echo $BASH_VERSION')" in
            3.2*) echo "OK: /bin/bash is 3.2, the shell the customer installs under" ;;
            *) echo "CANNOT-RUN: /bin/bash on this runner is not 3.2, so this job cannot measure the shipping shell." >&2; exit 1 ;;
          esac
      # Carries its own negative control: a synthetic file that DOES call
      # mapfile must be detected, so a pass means the scan works rather than
      # that it looked and was blind.
      # Also scans the SHIPPED shell (arm E): install.sh and lib/*.sh carry a
      # comment claiming they stay bash-3.2 clean, and until now nothing
      # checked it. Mutation-verified before landing: seeding one `declare -A`
      # into install.sh turns arm E red and names the line, and so does one
      # ${x^^}. A guard nobody has watched fail is not a guard.
      - id: b01_s02
        if: ${{ steps.select.outputs.b01 != 'false' && matrix.shard == 2 && !cancelled() && steps.b01_isolate.conclusion != 'failure' && steps.b01_s01.conclusion != 'failure' }}
        timeout-minutes: 15
        name: No test, and no SHIPPED file, may depend on a bash 4 construct
        run: /bin/bash tests/test_no_test_uses_a_bash4_builtin.sh
      # The two tests below already run on ubuntu. These steps are the first
      # time either has executed under 3.2. if: always() so a failure in one
      # cannot silence the other -- a skipped test reads as "no objection".
      - id: b01_s03
        if: ${{ steps.select.outputs.b01 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 15
        name: The pgrep DONE guard runs under 3.2, not just on ubuntu
        run: |
          set -uo pipefail
          mkdir -p /tmp/b32shim
          ln -sf /bin/bash /tmp/b32shim/bash
          export PATH="/tmp/b32shim:${PATH}"
          case "$(bash -c 'echo $BASH_VERSION')" in
            3.2*) : ;;
            *) echo "CANNOT-RUN: the shim did not put bash 3.2 on PATH; this step measured the wrong shell." >&2; exit 1 ;;
          esac
          /bin/bash tests/test_pgrep_no_match_does_not_fabricate_a_done.sh
      - id: b01_s04
        if: ${{ steps.select.outputs.b01 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 15
        name: The upgrade store-auth wiring test runs under 3.2
        run: |
          set -uo pipefail
          mkdir -p /tmp/b32shim
          ln -sf /bin/bash /tmp/b32shim/bash
          export PATH="/tmp/b32shim:${PATH}"
          case "$(bash -c 'echo $BASH_VERSION')" in
            3.2*) : ;;
            *) echo "CANNOT-RUN: the shim did not put bash 3.2 on PATH; this step measured the wrong shell." >&2; exit 1 ;;
          esac
          /bin/bash tests/test_upgrade_path_can_wire_store_auth.sh install.sh
      - id: b01_s05
        if: ${{ steps.select.outputs.b01 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 15
        name: WhatsApp pwg_ingest step survives rc=1 under an armed ERR trap
        run: /bin/bash tests/test_whatsapp_ingest_err_trap.sh
      - id: b01_s06
        if: ${{ steps.select.outputs.b01 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 15
        name: All three parse under /bin/bash 3.2
        run: |
          /bin/bash -n tests/test_no_test_uses_a_bash4_builtin.sh
          /bin/bash -n tests/test_pgrep_no_match_does_not_fabricate_a_done.sh
          /bin/bash -n tests/test_upgrade_path_can_wire_store_auth.sh
          /bin/bash -n tests/test_whatsapp_ingest_err_trap.sh
          echo "OK: parses under the shell the cut actually uses"

      # ========================================================================
      # b02: calendar-backfill-multiyear.yml :: window-controls
      # ========================================================================
      - id: b02_isolate
        name: "[b02] calendar-backfill-multiyear.yml :: window-controls -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b02 != 'false' && matrix.shard == 3 }}
        env:
          PY: ${{ steps.python.outputs.python-path }}
          BLOCK: ${{ runner.temp }}/ci-fold/b02
        run: |
          set -eu
          git -C "$GITHUB_WORKSPACE" reset --hard -q HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          rm -rf "$BLOCK"
          mkdir -p "$BLOCK/home" "$BLOCK/tmp"
          "$PY" -m venv --system-site-packages "$BLOCK/venv"
          echo "$BLOCK/venv/bin" >> "$GITHUB_PATH"
          {
            echo "HOME=$BLOCK/home"
            echo "TMPDIR=$BLOCK/tmp"
            echo "VIRTUAL_ENV=$BLOCK/venv"
          } >> "$GITHUB_ENV"
      # Exit 2 is CANNOT-RUN (the Calendar hydration block could not be
      # located) and CI treats it as failure, which is correct: a gate that
      # cannot find what it guards has not passed.
      - id: b02_s01
        if: ${{ steps.select.outputs.b02 != 'false' && matrix.shard == 3 && !cancelled() && steps.b02_isolate.conclusion != 'failure' }}
        timeout-minutes: 30
        name: Install-time calendar window must be 5 years back, 1 year forward
        run: bash tests/test_cx92_calendar_historical_backfill.sh
      # Previously dark. See the header.
      - id: b02_s02
        if: ${{ steps.select.outputs.b02 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: Calendar must hydrate via the FDA path, not meeting_syncer/CalDAV
