      # left customers in a closed loop pulling a lever wired to nothing.
      - id: b19_s04
        if: ${{ steps.select.outputs.b19 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: No-data is not success, and --repair is real
        run: bash tests/test_no_data_is_not_success.sh
      # The email settling row reported a PEOPLE count against a MESSAGE
      # denominator, so on a 16,844-message store yielding ~600 correspondents
      # the bar read 3.6% and could never approach 100%. Same family as the
      # two above: a hydrate phase publishing a number that cannot be right.
      # Wired here rather than in a new workflow because 109 of the 279 rows
      # in TEST_WIRING.tsv are UNWIRED, and a tenth dark test would be the
