        timeout-minutes: 30
        name: The source table's Items column prefers the live count over a stale sentinel (v1.0.107 walk #9)
        run: /bin/bash tests/test_the_source_table_items_column_shows_the_live_count.sh
      # v1.0.107 walk #28, Andy's console walk: Mail showed the last tick's
      # delta, WhatsApp people (one per DM chat) as messages, Safari visits as
