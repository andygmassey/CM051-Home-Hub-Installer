      - id: b05_s05
        if: ${{ steps.select.outputs.b05 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: runtime-ready reports three outcomes and all three are reachable
        run: bash tests/test_runtime_ready_status_is_read_not_fatal.sh
      # #1594: 8044 published the compiled wiki with no credential at all.
      # The preflight above proves the port is WATCHED; this proves it is
