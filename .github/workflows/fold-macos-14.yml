      # #852. Two sentinels recorded `rc=124 sent=0` over collections holding
      # 8,761 and 7,154 points. The zero was never measured: the parse that
      # assigns the counter lives inside the arm the kill path never enters,
      # so `${..._SENT:-0}` was a shell default standing in for a number
      # nobody had. 7 of 9 error-recorder call sites did this.
      - id: b19_s06
        if: ${{ steps.select.outputs.b19 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: A failed hydrate step may not write a count it never measured
        run: bash tests/test_a_failed_hydrate_may_not_fabricate_a_count.sh
      # The reader half of the test below imports the SHIPPED Doctor rule, and
      # vendor/doctor/agent/status_collector.py imports httpx at module scope.
      # Without it the reader control fails with ModuleNotFoundError, which is
      # a broken probe wearing a finding's clothes. Installed rather than
      # stubbed: a stub would make the control pass over a Doctor that cannot
      # import on a real box. Same line vendor-integrity.yml uses for the same
      # tree. NOT `|| true` -- if this cannot install, the control that
      # depends on it must go red rather than run blind.
      # TWO STEPS, NOT `a || b`. The chain form discards arm 1's exit code: on
      # 2026-09-02 arm 1 died on `uninstall-no-record-file` (the runner ships httpx
      # via Homebrew with no RECORD file) and arm 2 then died on
      # `externally-managed-environment`. Only arm 2's message survived, so the log
      # named a cause that was ALREADY handled -- --break-system-packages was
      # present the whole time. Three checks were red for hours behind that.
      # Split so each arm reports its own failure with its own message.
      - id: b19_pip_httpx
        if: ${{ steps.select.outputs.b19 != 'false' && matrix.shard == 2 && !cancelled() && steps.b19_isolate.conclusion != 'failure' && steps.b19_s01.conclusion != 'failure' && steps.b19_s02.conclusion != 'failure' && steps.b19_s03.conclusion != 'failure' && steps.b19_s04.conclusion != 'failure' && steps.b19_s05.conclusion != 'failure' && steps.b19_s06.conclusion != 'failure' }}
        timeout-minutes: 30
        name: Dependency for the shipped-Doctor reader control (preferred, PEP 668 aware)
        continue-on-error: true
        run: python3 -m pip install --quiet --break-system-packages --ignore-installed httpx
      - id: b19_s08
        if: ${{ steps.select.outputs.b19 != 'false' && matrix.shard == 2 && (always() && steps.b19_pip_httpx.outcome == 'failure') }}
        timeout-minutes: 30
        name: Dependency for the shipped-Doctor reader control (fallback, pre-PEP-668 runners)
        run: python3 -m pip install --quiet --ignore-installed httpx
      # Prove it rather than assume it: if BOTH arms failed, this names the missing
      # module instead of leaving pip's last line as the only signal.
      - id: b19_s09
        if: ${{ steps.select.outputs.b19 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: Dependency for the shipped-Doctor reader control -- prove the module imports
        run: python3 -c 'import httpx; print("httpx", httpx.__version__, "importable")'
      # #848, the same family pointing the other way: 4 of 13 hydrate steps
      # wrote no sentinel at all, so CANNOT-RUN, FAIL and PASS shared one
      # appearance -- an absent file. Also asserts the shipped Doctor rule
      # does something sensible with the new status, because a writer nobody
      # reads is how #853 shipped.
      - id: b19_s10
        if: ${{ steps.select.outputs.b19 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: CANNOT-RUN, FAIL and PASS must be three distinct states
        run: bash tests/test_cannot_run_is_a_third_state.sh
      # G1a/G1b: the record now carries a typed item_count and a last_update_at
