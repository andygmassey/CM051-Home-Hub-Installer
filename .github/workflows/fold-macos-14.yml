      - id: b19_s19
        if: ${{ steps.select.outputs.b19 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: An old-format sentinel must not abort the upgrade
        run: /bin/bash tests/test_an_old_format_sentinel_does_not_abort_the_install.sh
      # #946: every gate above this line asserts what the WRITER put in the
      # file. None of them reads what the CUSTOMER is shown. The renderer's own
      # docstring names that gap -- "the Doctor must serve /api/v1/sources with
