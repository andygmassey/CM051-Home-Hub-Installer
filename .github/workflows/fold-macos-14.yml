      - id: b19_s22
        if: ${{ steps.select.outputs.b19 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: Every Doctor source row shows one honest total in the unit it names (walk #28)
        run: /bin/bash tests/test_doctor_rows_show_one_honest_total.sh
