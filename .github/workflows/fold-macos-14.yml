      - id: b05_s03
        if: ${{ steps.select.outputs.b05 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: Assert the port preflight is owner-blind and covers every published port (#1208)
        run: bash tests/test_port_preflight_covers_published.sh
      # The preflight only breaks when it FINDS something. `_check_port`
      # returns status as data (0 free / 1 held / 2 unmeasured) and was
      # called bare under `set -e`, so 1 and 2 -- the two answers the loop
      # exists to collect -- aborted the installer before the `case` ran,
      # killing the #1208 collision report a few lines below. Same class as
      # #1756's :12399 and :13022. Arm 4 is a RED control: it rebuilds the
      # pre-fix shape and requires it to abort.
      - id: b05_s04
        if: ${{ steps.select.outputs.b05 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: The port preflight survives finding a held port
        run: bash tests/test_port_preflight_survives_a_held_port.sh
      # Same class again, twice more: `x="$(cmd)"` carries cmd's status, so
      # under `set -e` a non-zero return aborts AT THE ASSIGNMENT and the
      # `_rr_rc=$?` on the next line never runs. Both call sites of
      # _ostler_verify_runtime_ready are deliberately NON-fatal by design --
      # the upgrade one says a rollback "would be worse than a loud log
      # line" -- and the defect turned log-and-continue into an abort on the
