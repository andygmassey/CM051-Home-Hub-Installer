      # from install.sh and EXECUTES them, so it cannot pass against a
      # copy of the logic. It carries its own positive control (a clean
      # step must still close status=ok), so it cannot pass by the
      # emitter being dead or by stamping everything not-ok.
      - id: b28_s01
        if: ${{ steps.select.outputs.b28 != 'false' && matrix.shard == 2 && !cancelled() && steps.b28_isolate.conclusion != 'failure' }}
        timeout-minutes: 30
        name: A step killed by its timeout must not report status=ok (#839)
        run: /bin/bash tests/test_step_end_does_not_report_a_timed_out_step_as_ok.sh
      # #2318 -- THE DEFAULT UNDERNEATH #839.
      #
      # #839 stopped gui_step_end taking `ok` from its call site. It left
      # the ACCUMULATOR defaulting to `ok`, so the fix only ever reached
      # the steps that call gui_step_record_rc. Measured on origin/main
      # with the repo's heredoc classifier: 46 steps, 8 record_rc call
      # sites (2 of them fatal-abort only), 4 steps covered. The other 42
      # had no route to any status but ok short of the install dying.
      #
      # The test carries its own positive control (a MEASURED success must
      # still close ok, so a fix that stamps everything not-ok fails it)
      # and a mutation arm that puts the default back and requires the
      # defect to return, so it cannot pass by the emitter being dead or
      # by asserting the fix is merely present.
      - id: b28_s02
        if: ${{ steps.select.outputs.b28 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: A step that measured nothing cannot report ok (#2318)
        run: /bin/bash tests/test_a_step_that_measured_nothing_cannot_report_ok.sh
      # #873 -- THE OTHER HALF OF THE SAME LINE.
      #
      # The gate above proves every CLOSED step reports honestly. It cannot
      # see the step a run dies inside, because nothing closes that one, and
      # gui_step_end is the only thing that increments the counter the DONE
      # line reads. A v1.0.43 run therefore terminated
      #
      #     #OSTLER DONE status=fail failed_steps=0
      #
      # -- the run failed and nothing in it failed. The two guards that
      # should have met here sat on different surfaces: the test above never
      # aborts, and tests/test_err_trap_emits_done_fail.sh drives all three
      # abort paths but STUBS gui_done, so the real counter is not present in
      # that harness at all. This test is the intersection: real abort paths,
      # real emitter.
      #
      # if: always() -- see the note on the step below. Same reason, and it
      # matters more here: this is the assertion a failing run most needs.
      - id: b28_s03
        if: ${{ steps.select.outputs.b28 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: A run that aborts inside a step must count that step (#873)
        run: /bin/bash tests/test_an_abort_inside_a_step_is_counted.sh
      # #561 -- THE THIRD HALF, and the one a CUSTOMER meets.
      #
      # Both gates above assert on MARKERS, and markers only exist when
      # OSTLER_GUI=1. Every harness in this workflow sets it. So the entire
      # abort-honesty estate was measuring the GUI path exclusively, and the
      # terminal path -- the documented `curl | bash` install -- was never
      # under test at all.
      #
      # It was also broken. gui_log and gui_done both return 0 immediately
      # when OSTLER_GUI != 1, so _ostler_on_err and the EXIT backstop, which
      # speak through nothing else, died mute. MEASURED on the 2026-08-29
      # v1.0.50 box walk: install.sh exited rc=1 at 24% inside the #1208 port
      # preflight having printed NOTHING, on the pty and in the durable log
      # alike. A customer watches the bar stop and is told nothing.
      #
      # This test runs with OSTLER_GUI UNSET and carries a mutation arm, so
      # it fails if the fix is removed rather than merely asserting it is
      # present. It exits 2 for CANNOT-RUN, which is neither pass nor fail.
      - id: b28_s04
        if: ${{ steps.select.outputs.b28 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: An abort must SAY SO on a terminal install (#561)
        run: /bin/bash tests/test_an_abort_speaks_on_a_terminal_install.sh
      # Kept beside its intersection partner so a change that breaks the
      # stub set in one is caught with the other, in the same run.
      - id: b28_s05
        if: ${{ steps.select.outputs.b28 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: A mid-script death still emits exactly one DONE-fail (CX-454)
        run: /bin/bash tests/test_err_trap_emits_done_fail.sh
      # if: always() so a failure above cannot silence this one. A skipped
      # test reads as "no objection", which is the class of defect this
      # workflow exists to remove.
      - id: b28_s06
        if: ${{ steps.select.outputs.b28 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: The emitter's existing marker contract still holds
        run: /bin/bash tests/test_gui_progress_emitter.sh
      # #616 step 1 -- THE VERDICT A HUMAN READS.
      #
      # The two gates above prove every step's own STEP_END marker is honest
      # and that an abort counts the step it died in. Neither reads the
      # WHOLE-RUN sentence install.sh prints at the end. On the v1.0.60 walk
      # two steps timed out (failed_steps=2), yet that sentence was derived
      # from the err() MESSAGE tally alone -- a `timeout` raises no err() --
      # so it printed "Ostler finished with no errors raised" beside a
      # DONE line reading failed_steps=2. This test extracts the real verdict
      # block + real ok/warn/err and drives the real emitter, and carries an
      # anti-vacuity limb (the pre-fix verdict must LIE on the same input) so
      # it fails if the derivation is reverted rather than merely asserting
      # it is present. Runs under /bin/bash (3.2 on this runner), the shell
      # the customer's installer actually uses.
      - id: b28_s07
        if: ${{ steps.select.outputs.b28 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: The closing verdict consults failed_steps and names them (#616)
        run: /bin/bash tests/test_closing_verdict_consults_failed_steps.sh
      # #642 -- THE FALSE `status=ok`.
      #
      # `set -E` propagates the ERR trap into command substitutions. The child
      # emits a terminal DONE and dies, and OSTLER_DONE_EMITTED dies with it,
      # so the parent never learns. MEASURED on 3.2.57 with $$ and
      # $BASH_SUBSHELL at every emit: `local v="$(pgrep -f '<no-match>')"`
      # gave pid=55691 subshell=1 status=fail then pid=55691 subshell=0
      # status=ok. Same process. A failed install reported as a success.
      #
      # Carries a mutation limb (the PRE-FIX handler out of origin/main must
      # still produce the defect) and the clean-run control, so it cannot pass
      # by the harness going quiet.
      - id: b28_s08
        if: ${{ steps.select.outputs.b28 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: A subshell must not emit a terminal DONE (#642)
        run: /bin/bash tests/test_a_subshell_cannot_emit_a_terminal_done.sh
      - id: b28_s09
        if: ${{ steps.select.outputs.b28 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: Both files parse under /bin/bash 3.2 (the cut host's shell)
        run: |
          /bin/bash --version | head -1
          /bin/bash -n tests/test_step_end_does_not_report_a_timed_out_step_as_ok.sh
          /bin/bash -n tests/test_a_step_that_measured_nothing_cannot_report_ok.sh
          /bin/bash -n tests/test_an_abort_inside_a_step_is_counted.sh
          /bin/bash -n tests/test_an_abort_speaks_on_a_terminal_install.sh
          /bin/bash -n tests/test_closing_verdict_consults_failed_steps.sh
          /bin/bash -n lib/progress_emitter.sh
          /bin/bash -n install.sh
          echo "OK: parses under the shell the cut actually uses"
      # #873: the abort test must also PASS under 3.2, not merely parse. The
      # emitter's abort close uses `local` + `[[ =~ ]]` inside gui_step_end,
      # and the EXIT backstop's `local rc=$?` capture depends on `$?`
      # surviving the comment block above it. Both are 3.2 behaviours, and
      # macos-14's PATH bash is 5.x -- running it only under the default
      # `bash` would measure the wrong shell. The shim puts 3.2 on PATH so
      # the harness's own inner shells are 3.2 too.
      - id: b28_s10
        if: ${{ steps.select.outputs.b28 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: The abort tally holds under /bin/bash 3.2, not just parses
        run: |
          set -uo pipefail
          mkdir -p /tmp/b32shim
          ln -sf /bin/bash /tmp/b32shim/bash
          export PATH="/tmp/b32shim:${PATH}"
          echo "PATH bash is: $(bash -c 'echo $BASH_VERSION')"
          case "$(bash -c 'echo $BASH_VERSION')" in
            3.2*) : ;;
            *) echo "CANNOT-RUN: the shim did not put bash 3.2 on PATH; this step measured the wrong shell." >&2; exit 1 ;;
          esac
          /bin/bash tests/test_an_abort_inside_a_step_is_counted.sh
          # #2318 under 3.2: the new state is read back through
          # `[[ "$x" == "unmeasured" ]]` inside gui_step_record_rc and
          # gui_step_measures_nothing, and the mutation arm re-sources a
          # sed-rewritten emitter. 3.2 is the shell the customer runs.
          /bin/bash tests/test_a_step_that_measured_nothing_cannot_report_ok.sh
          # #561 under 3.2 for the same reason: the TTY diagnostic uses
          # printf %b and a ${var:+ ...} expansion inside the argument list,
          # and 3.2 is the shell the customer's installer actually runs
          # under. Verified locally on /bin/bash 3.2.57 before landing.
          /bin/bash tests/test_an_abort_speaks_on_a_terminal_install.sh

      # ========================================================================
      # b29: store-auth-pth-final-dir.yml :: store-auth-pth-final-dir
      # ========================================================================
      - id: b29_isolate
        name: "[b29] store-auth-pth-final-dir.yml :: store-auth-pth-final-dir -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b29 != 'false' && matrix.shard == 3 }}
        env:
          PY: ${{ steps.python.outputs.python-path }}
          BLOCK: ${{ runner.temp }}/ci-fold/b29
        run: |
          set -eu
          git -C "$GITHUB_WORKSPACE" reset --hard -q HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          rm -rf "$BLOCK"
          mkdir -p "$BLOCK/home" "$BLOCK/tmp"
          "$PY" -m venv --system-site-packages "$BLOCK/venv"
          echo "$BLOCK/venv/bin" >> "$GITHUB_PATH"
          {
            echo "HOME=$BLOCK/home"
            echo "TMPDIR=$BLOCK/tmp"
            echo "VIRTUAL_ENV=$BLOCK/venv"
          } >> "$GITHUB_ENV"
      # macos-14 deliberately: install.sh ships and runs on macOS, and the
      # test builds a real venv and asks that interpreter for its own
      # site-packages rather than guessing the path. Exits 2 (CANNOT-RUN) if
      # the function cannot be extracted or the extract does not contain the
      # writer, so a broken extraction can never read as a pass.
      - id: b29_s01
        if: ${{ steps.select.outputs.b29 != 'false' && matrix.shard == 3 && !cancelled() && steps.b29_isolate.conclusion != 'failure' }}
        timeout-minutes: 30
        name: The .pth carries the final tree, not the staging tree
        run: bash tests/test_store_auth_pth_uses_final_dir.sh
      # 🔴 THE SECOND HALF, AND THE REASON THE FIRST WAS NOT ENOUGH.
      #
      # The step above is BEHAVIOURAL and pins the function's DEFAULT. It
      # passed on origin/main for a day while install.sh:6815 shipped the A1
      # defect anyway, because that caller passes its root EXPLICITLY and a
      # default cannot reach an argument that is present.
      #
      # So the population of the step above is the FUNCTION. The population of
      # this one is the CALL SITES. Same defect class, different denominator --
      # which is the #600 lesson (a gate covers the family it enumerates) applied
      # to itself.
      #
      # Two-sided proof recorded on the fix PR: this test FAILS on the real
      # pre-fix origin/main tree naming line 6815, and PASSES on the fix. It
      # exits 2 (CANNOT-RUN) rather than passing if the boundary marker is not
      # unique or the population is empty.
      #
      # `if: always()` is REQUIRED and ci-maskless caught its absence on this
      # very PR. Without it, a red in the step above SKIPS this one -- and a
      # gate that does not report is indistinguishable from a gate that passed.
      # These two steps check DIFFERENT populations (function default vs call
      # sites), so neither depends on the other and both must always speak.
      - id: b29_s02
        if: ${{ steps.select.outputs.b29 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: No CALL SITE passes a staging root (the explicit-argument half)
        run: bash tests/test_store_auth_no_call_site_passes_staging_root.sh

      # ========================================================================
      # b30: usage-journal-producers.yml :: producer-gate-macos
      # ========================================================================
      # ==========================================================================
      # macOS. The probe runs on a Mac when a box is walked, and macOS ships bash
      # 3.2.57 with BSD userland. A gate that is only ever executed on ubuntu can
      # be inert on the machine it ships to and nothing would say so.
      # ==========================================================================
      - id: b30_isolate
        name: "[b30] usage-journal-producers.yml :: producer-gate-macos -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b30 != 'false' && matrix.shard == 3 }}
        env:
          PY: ${{ steps.python.outputs.python-path }}
          BLOCK: ${{ runner.temp }}/ci-fold/b30
        run: |
          set -eu
          git -C "$GITHUB_WORKSPACE" reset --hard -q HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          rm -rf "$BLOCK"
          mkdir -p "$BLOCK/home" "$BLOCK/tmp"
          "$PY" -m venv --system-site-packages "$BLOCK/venv"
          echo "$BLOCK/venv/bin" >> "$GITHUB_PATH"
          {
            echo "HOME=$BLOCK/home"
            echo "TMPDIR=$BLOCK/tmp"
            echo "VIRTUAL_ENV=$BLOCK/venv"
          } >> "$GITHUB_ENV"
      - id: b30_s01
        if: ${{ steps.select.outputs.b30 != 'false' && matrix.shard == 3 && !cancelled() && steps.b30_isolate.conclusion != 'failure' }}
        timeout-minutes: 30
        name: Same 15 arms, on bash 3.2 + BSD userland
        run: /bin/bash tests/test_usage_journal_producer_gate.sh
      # The vendored ostler_fda cannot be imported without its third-party
      # dependencies, and without the import the behavioural step below is
      # CANNOT-RUN (exit 2) -- honest, but it measures nothing. Installing them
      # is what makes the assertion actually EXECUTE.
      #
      # ⚠️ READ THE DEPS FROM THE PACKAGE'S OWN pyproject, DO NOT LIST THEM.
      # My first attempt hand-listed `httpx` and went red on ubuntu for
      # `nameparser` -- a second dep I had not looked up. The declared set is
      # the only set that cannot drift from what the module actually needs:
      # add a dep to the vendored package and this step follows it. A
      # hand-typed list would go stale silently and reappear as a CANNOT-RUN
      # nobody could explain.
      #
      # --break-system-packages: macos-14's python is PEP 668 externally
      # managed and plain `pip install` exits 1 there. The runner is
      # ephemeral, so this is safe; without it the macOS job fails at the
      # install rather than at the assertion, which reads as a product red.
      - id: b30_s02
        if: ${{ steps.select.outputs.b30 != 'false' && matrix.shard == 3 && !cancelled() && steps.b30_isolate.conclusion != 'failure' && steps.b30_s01.conclusion != 'failure' }}
        timeout-minutes: 30
        name: Dependencies the vendored module declares (read from its pyproject)
        run: |
          set -euo pipefail
          deps=$(python3 - <<'PYEOF'
          import tomllib, pathlib
          d = tomllib.loads(
              pathlib.Path("vendor/ostler_fda/pyproject.toml").read_text()
          )["project"]["dependencies"]
          if not d:
              raise SystemExit("pyproject declares NO dependencies -- refusing to "
                               "install nothing and call it a pass")
          print(" ".join(d))
          PYEOF
          )
          echo "declared: ${deps}"
          python3 -m pip install --quiet --disable-pip-version-check ${deps} \
            || python3 -m pip install --quiet --disable-pip-version-check \
                 --break-system-packages ${deps}
          python3 -c 'import httpx, nameparser; print("imports resolve")'
      # The shipping producer runs on the CUSTOMER'S Mac, so its guard must be
      # exercised on bash 3.2 + BSD userland too. `grep -c`, `cut -f` and the
      # heredoc all behave differently enough between GNU and BSD that an
      # ubuntu-only green says nothing about the machine this ships to.
      - id: b30_s03
        if: ${{ steps.select.outputs.b30 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: The SHIPPING ostler_fda writes a record, on bash 3.2 + BSD
        run: /bin/bash tests/test_vendored_fda_writes_the_usage_journal.sh
      # Same reason as the ostler_fda pair: contact_syncer and ical-server run
      # on the CUSTOMER'S Mac, so the cm041 producer guard is exercised on
      # bash 3.2 + BSD userland too. This one leans on `cut -f`, `shasum` and a
      # tab-anchored grep against the roster, all of which differ between GNU
      # and BSD, so an ubuntu-only green would say nothing about the machine
      # this ships to.
      - id: b30_s04
        if: ${{ steps.select.outputs.b30 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: The SHIPPING cm041 producers write a record, on bash 3.2 + BSD
        run: /bin/bash tests/test_cm041_usage_journal_producer.sh
      # THE FIVE #2472 PRODUCERS, on bash 3.2 + BSD too: this is the shell and
      # userland the customer's Mac actually ships. Same reason as the pair
      # above -- an ubuntu-only green says nothing about the machine this
      # ships to.
      - id: b30_s05
        if: ${{ steps.select.outputs.b30 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: '#2472 cm019 vectorizer writes a record, on bash 3.2 + BSD'
        run: /bin/bash tests/test_cm019_vectorizer_usage_journal.sh
      - id: b30_s06
        if: ${{ steps.select.outputs.b30 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: '#2603 hub_screens_customer_read sums calls, not rows, on bash 3.2 + BSD'
        run: /bin/bash tests/test_hub_screens_calls_summing.sh
      - id: b30_s07
        if: ${{ steps.select.outputs.b30 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: 'walk #27 the Bursar counts every Ollama model endpoint, on bash 3.2 + BSD'
        run: /bin/bash tests/test_bursar_counts_every_ollama_endpoint.sh
      - id: b30_s08
        if: ${{ steps.select.outputs.b30 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: '#2472 cm024 knowledge embedder writes a record, on bash 3.2 + BSD'
        run: /bin/bash tests/test_cm024k_embedder_usage_journal.sh
      - id: b30_s09
        if: ${{ steps.select.outputs.b30 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: '#2472 cm024 knowledge classifier writes a record, on bash 3.2 + BSD'
        run: /bin/bash tests/test_cm024k_classifier_usage_journal.sh
      - id: b30_s10
        if: ${{ steps.select.outputs.b30 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: '#2472 cm024 knowledge email summarizer writes a record, on bash 3.2 + BSD'
        run: /bin/bash tests/test_cm024k_email_summarizer_usage_journal.sh
      - id: b30_s11
        if: ${{ steps.select.outputs.b30 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: '#2472 cm059 editor newsletter scout writes a record, on bash 3.2 + BSD'
        run: /bin/bash tests/test_cm059_scout_newsletters_usage_journal.sh
      - id: b30_s12
        if: ${{ steps.select.outputs.b30 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: '#2472 parity: N calls across all five producers -> N journal rows, on bash 3.2 + BSD'
        run: /bin/bash tests/test_usage_journal_producer_parity_2472.sh
      # THE PROBE'S OWN NEGATIVE CONTROL, driven exactly as run_box_walk.sh
      # phase 1 drives it: rc must be 1 AND the output must not say BROKEN.
      # Reading the exit code alone is how a probe that reported a verdict
      # without a denominator once passed phase 1 -- probe_fail() and the
      # contract's own refusals both exit 1.
      #
      # if: always() -- not the first step in the job, so without it a failure
      # above would skip it, and a skipped step reads as no objection.
      - id: b30_s13
        if: ${{ steps.select.outputs.b30 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: The box-walk probe can demonstrate a FAIL (run_box_walk phase 1)
        run: |
          set -u
          set +e
          out="$(/bin/bash scripts/box_walk_probes/probes/usage_journal_producers.sh --self-test 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          echo "self-test exit=${rc}"
          if [ "$(printf '%s\n' "$out" | grep -c 'VERDICT: BROKEN')" -gt 0 ]; then
            echo "PHASE 1 WOULD MARK THIS PROBE BROKEN and DISCARD its result"
            echo "on every box walk. That is how ingest_coverage.sh spent its"
            echo "entire life uncounted."
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "PHASE 1 WOULD MARK THIS PROBE BROKEN: --self-test returned"
            echo "${rc}, and run_box_walk.sh requires 1 -- a probe that cannot"
            echo "demonstrate a FAIL has not earned a PASS."
            exit 1
          fi
          echo "phase 1 OK: the probe goes red on known-bad input"
      # run_box_walk.sh globs probes/ and demands a --self-test from everything
      # it finds. A probe that is not collected does not exist as far as a box
      # walk is concerned, however good it is, and nothing anywhere prints the
      # names of files it skipped.
      - id: b30_s14
        if: ${{ steps.select.outputs.b30 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: run_box_walk.sh actually COLLECTS this probe
        run: |
          set -u
          out="$(/bin/bash scripts/box_walk_probes/run_box_walk.sh --list)"
          printf '%s\n' "$out"
          if [ "$(printf '%s\n' "$out" | grep -c '^usage_journal_producers:')" -eq 0 ]; then
            echo "THE RUNNER DOES NOT SEE THIS PROBE. It would never run on a"
            echo "box walk, which is #719 rebuilt with a fresh filename."
            exit 1
          fi
          echo "collected by the runner."

      # ========================================================================
      # b31: vendor-divergence-described.yml :: described-macos
      # ========================================================================
      # ==========================================================================
      # macOS. The re-vendor happens on a Mac, where /bin/bash is 3.2.57 and the
      # userland is BSD. The suite leans on `sed -i.bak`, `grep -c`, `mktemp -d`
      # and heredocs, all of which behave differently enough between GNU and BSD
      # that an ubuntu-only green says nothing about the machine an operator runs
      # sync_vendor.sh on.
      # ==========================================================================
      - id: b31_isolate
        name: "[b31] vendor-divergence-described.yml :: described-macos -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b31 != 'false' && matrix.shard == 3 }}
        env:
          PY: ${{ steps.python.outputs.python-path }}
          BLOCK: ${{ runner.temp }}/ci-fold/b31
        run: |
          set -eu
          git -C "$GITHUB_WORKSPACE" reset --hard -q HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          rm -rf "$BLOCK"
          mkdir -p "$BLOCK/home" "$BLOCK/tmp"
          "$PY" -m venv --system-site-packages "$BLOCK/venv"
          echo "$BLOCK/venv/bin" >> "$GITHUB_PATH"
          {
            echo "HOME=$BLOCK/home"
            echo "TMPDIR=$BLOCK/tmp"
            echo "VIRTUAL_ENV=$BLOCK/venv"
          } >> "$GITHUB_ENV"
      - id: b31_s01
        if: ${{ steps.select.outputs.b31 != 'false' && matrix.shard == 3 && !cancelled() && steps.b31_isolate.conclusion != 'failure' }}
        timeout-minutes: 30
        name: Record the shell this job actually has
        run: |
          set -u
          echo "/bin/bash -> $(/bin/bash --version | head -1)"
          maj="$(/bin/bash -c 'echo ${BASH_VERSINFO[0]}')"
          if [ "${maj}" != "3" ]; then
            echo "CANNOT-RUN: /bin/bash here is not 3.x, so this job would measure"
            echo "            the same shell the ubuntu job does and report a"
            echo "            second green for the first job's reason."
            exit 1
