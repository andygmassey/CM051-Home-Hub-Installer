# Owner direction, 2026-10-25: no customer surface tells anyone to export a chat.
# Owner direction, 2026-11-08 (Andy): a chat export a customer drops in is AUTO-PROCESSED
# (watcher: import; ostler_fda.whatsapp_export -> pwg-convo). Both guards run here.
name: no-whatsapp-chat-export

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'install.sh.strings.en-GB.sh'
      - 'lib/ostler-detect-exports.sh'
      - 'gui/OstlerInstaller/Resources/*.json'
      - 'tests/test_no_whatsapp_chat_export_instruction.sh'
      - 'tests/test_whatsapp_export_autoprocess.py'
      - 'vendor/ostler_fda/whatsapp_export.py'
      - 'vendor/ostler_fda/universal_import.py'
      - '.github/workflows/no-whatsapp-chat-export.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'install.sh.strings.en-GB.sh'
      - 'lib/ostler-detect-exports.sh'
      - 'gui/OstlerInstaller/Resources/*.json'
      - 'tests/test_no_whatsapp_chat_export_instruction.sh'
      - 'tests/test_whatsapp_export_autoprocess.py'
      - 'vendor/ostler_fda/whatsapp_export.py'
      - 'vendor/ostler_fda/universal_import.py'
      - '.github/workflows/no-whatsapp-chat-export.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: No customer string tells anyone to export a WhatsApp chat
        run: /bin/bash tests/test_no_whatsapp_chat_export_instruction.sh
      - name: A dropped WhatsApp chat export is parsed and persisted, not skipped
        if: success() || failure()
        run: python3 tests/test_whatsapp_export_autoprocess.py
