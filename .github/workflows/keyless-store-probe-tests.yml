# The four box-walk store probes now present the install's -K credential and
# adjudicate the reply (401 refused -> FAIL, keyless 401 -> CANNOT-RUN, transport
# 000 -> CANNOT-RUN) instead of reading a keyless 401 as "the store is down".
# These tests drive each probe against a python3 fake store on loopback and
# assert the VERDICT REASON, and each carries a #1284 mutation arm.
#
# runs-on macos-latest, DELIBERATELY, on what the tests READ: the probes shell
# out through box_run to BSD /usr/bin/grep and to `curl -K`, and ship to a
# macOS/bash-3.2 box. ubuntu would exercise a different shell and toolset than
# the artefact -- green for the wrong reason. This mirrors the runner the sibling
# probe test (test_people_seed_and_retrieval_probe.sh) already uses in
# cut-manifest.yml.
name: keyless-store-probe-tests

on:
  pull_request:
    paths:
      - 'scripts/box_walk_probes/probes/no_person_holds_two_contact_cards.sh'
      - 'scripts/box_walk_probes/probes/ingest_coverage.sh'
      - 'scripts/box_walk_probes/probes/people_count_agreement.sh'
      - 'scripts/box_walk_probes/probes/people_stores_reconcile.sh'
      - 'scripts/tests/test_no_person_holds_two_contact_cards_probe.sh'
      - 'scripts/tests/test_ingest_coverage_probe.sh'
      - 'scripts/tests/test_people_count_agreement_probe.sh'
      - 'scripts/tests/test_people_stores_reconcile_probe.sh'
      - '.github/workflows/keyless-store-probe-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/box_walk_probes/probes/no_person_holds_two_contact_cards.sh'
      - 'scripts/box_walk_probes/probes/ingest_coverage.sh'
      - 'scripts/box_walk_probes/probes/people_count_agreement.sh'
      - 'scripts/box_walk_probes/probes/people_stores_reconcile.sh'
      - 'scripts/tests/test_no_person_holds_two_contact_cards_probe.sh'
      - 'scripts/tests/test_ingest_coverage_probe.sh'
      - 'scripts/tests/test_people_count_agreement_probe.sh'
      - 'scripts/tests/test_people_stores_reconcile_probe.sh'
      - '.github/workflows/keyless-store-probe-tests.yml'

concurrency:
  group: keyless-store-probe-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-tests:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: no_person_holds_two_contact_cards credential + 401/000 adjudication
        if: always()
        run: /bin/bash scripts/tests/test_no_person_holds_two_contact_cards_probe.sh

      - name: ingest_coverage credential + 401/000 adjudication
        if: always()
        run: /bin/bash scripts/tests/test_ingest_coverage_probe.sh

      - name: people_count_agreement oxigraph credential + 401/000 adjudication
        if: always()
        run: /bin/bash scripts/tests/test_people_count_agreement_probe.sh

      - name: people_stores_reconcile urllib credential + 401/KEYLESS adjudication
        if: always()
        run: /bin/bash scripts/tests/test_people_stores_reconcile_probe.sh

      # THE PROBE'S OWN NEGATIVE CONTROL, RUN WHERE A PR CAN SEE IT.
      #
      # The four steps above drive the credential adjudication. None of them
      # runs the probe's --self-test, so until this step existed the 32 synthetic
      # cases -- including every arm covering the multi-reading residual check --
      # were exercised only by PHASE 1 of an actual box walk. A test that only a
      # walk can run cannot stop a regression from reaching the walk.
      #
      # THE EXPECTED EXIT IS 1, AND THAT IS NOT A TYPO. run_box_walk.sh PHASE 1
      # reads exit 1 as "this probe can go red on known-bad input" and marks the
      # probe BROKEN on anything else. Exit 0 here means a negative control did
      # NOT fire. GitHub runs `run:` under `bash -eo pipefail`, so the non-zero
      # exit is captured rather than allowed to end the step.
      - name: people_stores_reconcile negative control (--self-test must exit 1)
        if: always()
        run: |
          rc=0
          /bin/bash scripts/box_walk_probes/probes/people_stores_reconcile.sh --self-test || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "BROKEN: the probe --self-test returned $rc, not 1." >&2
            echo "PHASE 1 of the box walk would mark this probe BROKEN and measure nothing." >&2
            exit 1
          fi
          echo "OK: the negative control fires as the walk runner requires (returned 1)."
