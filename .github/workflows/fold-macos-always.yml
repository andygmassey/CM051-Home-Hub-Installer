          set +e
          bash scripts/box_walk_probes/probes/installed_bundle_seal_intact.sh --self-test
          rc=$?
          set -e
          echo "self-test rc=${rc}"
          if [ "${rc}" -ne 1 ]; then
            echo "A probe that cannot produce a FAIL has not earned a PASS." >&2
            exit 1
          fi
      # /bin/bash on macOS is 3.2, which is the shell the box walk ships under.
      # A probe that only parses under 5.x is a probe that never ran.
      - id: b09_s03
        if: ${{ steps.select.outputs.b09 != 'false' && matrix.shard == 1 && (always()) }}
        timeout-minutes: 30
        name: probe, reader and test parse under the box's own shell
        run: |
          /bin/bash --version | head -1
          /bin/bash -n scripts/box_walk_probes/probes/installed_bundle_seal_intact.sh
          /bin/bash -n scripts/box_walk_probes/lib/probe.sh
          /bin/bash -n tests/test_a_denied_read_is_not_an_absence.sh
          python3 -c "import py_compile; py_compile.compile('scripts/box_walk_probes/lib/bundle_inspect.py', doraise=True)"

      # ========================================================================
      # b10: unreachable-not-absence.yml :: driver-not-box
      # ========================================================================
      - id: b10_isolate
        name: "[b10] unreachable-not-absence.yml :: driver-not-box -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b10 != 'false' && matrix.shard == 1 }}
        env:
          PY: ${{ steps.python.outputs.python-path }}
          BLOCK: ${{ runner.temp }}/ci-fold/b10
        run: |
          set -eu
          # A fresh machine also had no processes left over from another job.
          # Every step after an isolate step carries CI_FOLD_BLOCK=<its tag>
          # (via GITHUB_ENV), and a process inherits it even once orphaned, so
          # anything an earlier block left running still carries it. Kill exactly
          # those: nothing else on the machine carries the marker.
          cf="$RUNNER_TEMP/ci-fold"
          mkdir -p "$cf"
          me=$$
          ps -A -o pid=,ppid= > "$cf/procs" || true
          # ONE read of every process's environment, not one per process: on
          # macOS a ps per process cost 2 to 5 s per block (measured, PR #2962).
          if [ -d /proc/self ]; then
            grep -lzsa '^CI_FOLD_BLOCK=' /proc/[0-9]*/environ > "$cf/marked.raw" || true
            sed -n 's|^/proc/\([0-9]*\)/environ$|\1|p' "$cf/marked.raw" > "$cf/marked"
          else
            ps eww -A -o pid=,command= > "$cf/marked.raw"
            awk '/CI_FOLD_BLOCK=/ {print $1}' "$cf/marked.raw" > "$cf/marked"
          fi
          marked=" $(tr '\n' ' ' < "$cf/marked") "
          while read -r pid ppid; do
            if [ "$pid" = "$me" ] || [ "$ppid" = "$me" ]; then continue; fi
            case "$marked" in *" $pid "*) ;; *) continue ;; esac
            kill -KILL "$pid" 2>/dev/null || true
          done < "$cf/procs"
          echo "CI_FOLD_BLOCK=b10" >> "$GITHUB_ENV"
          git -C "$GITHUB_WORKSPACE" reset --hard -q HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          rm -rf "$BLOCK"
          mkdir -p "$BLOCK/home" "$BLOCK/tmp"
          "$PY" -m venv --system-site-packages "$BLOCK/venv"
          echo "$BLOCK/venv/bin" >> "$GITHUB_PATH"
          {
            echo "HOME=$BLOCK/home"
            echo "TMPDIR=$BLOCK/tmp"
            echo "VIRTUAL_ENV=$BLOCK/venv"
          } >> "$GITHUB_ENV"
      # Stubs ssh with a recorder and requires every HTTP read the Doctor page
      # probe makes to have crossed it, then requires the probe to refuse a
      # dead port WITHOUT asserting the service is down. Carries its own
      # mutation: a copy with the transport reverted to a bare local curl must
      # make the first arm go red, so a green cannot come from a stub that
      # never ran or a predicate that matches anything.
      - id: b10_s01
        if: ${{ steps.select.outputs.b10 != 'false' && matrix.shard == 1 && !cancelled() && steps.b10_isolate.conclusion != 'failure' }}
        timeout-minutes: 30
        name: a probe must measure the box, not the machine driving the walk
        run: /bin/bash tests/test_a_probe_must_measure_the_box_not_the_driver.sh
      # The probe's negative control, run the way run_box_walk.sh runs it.
      # Phase 1 requires exit 1 from --self-test; anything else marks the probe
      # BROKEN and discards its measurement.
      - id: b10_s02
        if: ${{ steps.select.outputs.b10 != 'false' && matrix.shard == 1 && (always()) }}
        timeout-minutes: 30
        name: the Doctor page probe can still demonstrate a FAIL
        run: |
          set +e
          /bin/bash scripts/box_walk_probes/probes/doctor_page_renders_for_a_customer.sh --self-test
          rc=$?
          set -e
          echo "self-test rc=${rc}"
          if [ "${rc}" -ne 1 ]; then
            echo "A probe that cannot produce a FAIL has not earned a PASS." >&2
            exit 1
          fi
      - id: b10_s03
        if: ${{ steps.select.outputs.b10 != 'false' && matrix.shard == 1 && (always()) }}
        timeout-minutes: 30
        name: probe and test parse under the box's own shell
        run: |
          /bin/bash --version | head -1
          /bin/bash -n scripts/box_walk_probes/probes/doctor_page_renders_for_a_customer.sh
          /bin/bash -n tests/test_a_probe_must_measure_the_box_not_the_driver.sh

      # ========================================================================
      # b11: upgrade-payload-shape.yml :: behaviour
      # ========================================================================
      # THE BEHAVIOURAL UPGRADE SUITE HAD NEVER RUN IN CI. It was UNWIRED in
      # tests/TEST_WIRING.tsv, so 31 assertions about data-loss prevention during a
      # customer upgrade were sitting in the repo executing nowhere. It is hermetic
      # (mocks launchctl and codesign through PATH shims, no network, no pip) but
      # asserts with plutil, so it needs macOS rather than ubuntu.
      - id: b11_isolate
        name: "[b11] upgrade-payload-shape.yml :: behaviour -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b11 != 'false' && matrix.shard == 2 }}
        env:
          PY: ${{ steps.python.outputs.python-path }}
          BLOCK: ${{ runner.temp }}/ci-fold/b11
        run: |
          set -eu
          # A fresh machine also had no processes left over from another job.
          # Every step after an isolate step carries CI_FOLD_BLOCK=<its tag>
          # (via GITHUB_ENV), and a process inherits it even once orphaned, so
          # anything an earlier block left running still carries it. Kill exactly
          # those: nothing else on the machine carries the marker.
          cf="$RUNNER_TEMP/ci-fold"
          mkdir -p "$cf"
          me=$$
          ps -A -o pid=,ppid= > "$cf/procs" || true
          # ONE read of every process's environment, not one per process: on
          # macOS a ps per process cost 2 to 5 s per block (measured, PR #2962).
          if [ -d /proc/self ]; then
            grep -lzsa '^CI_FOLD_BLOCK=' /proc/[0-9]*/environ > "$cf/marked.raw" || true
            sed -n 's|^/proc/\([0-9]*\)/environ$|\1|p' "$cf/marked.raw" > "$cf/marked"
          else
            ps eww -A -o pid=,command= > "$cf/marked.raw"
            awk '/CI_FOLD_BLOCK=/ {print $1}' "$cf/marked.raw" > "$cf/marked"
          fi
          marked=" $(tr '\n' ' ' < "$cf/marked") "
          while read -r pid ppid; do
            if [ "$pid" = "$me" ] || [ "$ppid" = "$me" ]; then continue; fi
            case "$marked" in *" $pid "*) ;; *) continue ;; esac
            kill -KILL "$pid" 2>/dev/null || true
          done < "$cf/procs"
          echo "CI_FOLD_BLOCK=b11" >> "$GITHUB_ENV"
          git -C "$GITHUB_WORKSPACE" reset --hard -q HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          rm -rf "$BLOCK"
          mkdir -p "$BLOCK/home" "$BLOCK/tmp"
          "$PY" -m venv --system-site-packages "$BLOCK/venv"
          echo "$BLOCK/venv/bin" >> "$GITHUB_PATH"
          {
            echo "HOME=$BLOCK/home"
            echo "TMPDIR=$BLOCK/tmp"
            echo "VIRTUAL_ENV=$BLOCK/venv"
          } >> "$GITHUB_ENV"
      - id: b11_s01
        if: ${{ steps.select.outputs.b11 != 'false' && matrix.shard == 2 && !cancelled() && steps.b11_isolate.conclusion != 'failure' }}
        timeout-minutes: 15
        name: Upgrade-mode invariants (31 assertions, incl. rollback + no-stdin-hang)
        run: /bin/bash tests/test_upgrade_mode_invariants.sh
      # The upgrade path must REPAIR the fda venv, not just swap the daemon.
      #
      # CM051 #939 fixed a missing ostler_fda in the PROMOTED venv. The upgrade
      # block exits ~3000 lines before the promote, so #939 reached new
      # installs only and every already-installed box kept a frozen graph
      # permanently, updates included (HR015 #595).
      #
      # Behavioural: extracts the real function and runs it against a real venv
      # and a package laid out the way the shipped one is. Needs python3.11+
      # for PEP 660 editables and reports CANNOT-RUN (exit 2) rather than
      # passing if it cannot find one.
      - id: b11_s02
        if: ${{ steps.select.outputs.b11 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 15
        name: the upgrade repairs the fda venv (HR015 #595)
        run: /bin/bash tests/test_upgrade_repairs_the_fda_venv.sh
