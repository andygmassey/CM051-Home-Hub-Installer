name: cut-manifest

# Guards the cut-manifest gate (scripts/verify_cut_manifest.py + .sh).
# Runs the hermetic smoke suite (10 tests against synthetic manifests +
# fake artefact tree) and validates that both cut-manifests/permanent.yaml
# and every cut-manifests/v*.yaml parse cleanly with the expected schema.
#
# CI cannot exercise the real gate end-to-end (that needs a built .app +
# sibling ostler-assistant / CM044 checkouts + cross-org GH access, which
# live only on the cut host). CI's job is: prove the verifier's logic
# still works, and prove the manifests are well-formed. The real gate
# runs on the cut host, wired fail-closed into gui/Makefile `ship` via
# the `check-manifest` target.
#
# Registering these here means: any change to the verifier, the manifests,
# or the wrapper is CI-guarded — the gate cannot silently rot.

on:
  pull_request:
    paths:
      - 'scripts/verify_cut_manifest.py'
      - 'scripts/verify_cut_manifest.sh'
      - 'scripts/tests/test_verify_cut_manifest.py'
      - 'scripts/tests/test_grep_in_source_at_sha_names_files.py'
      - 'scripts/tests/test_probes_do_not_emit_derivable_person_uris.py'
      - 'tests/test_grep_row_cannot_be_satisfied_by_its_own_manifest.py'
      - 'tests/test_cut_deferrals_no_duplicate_keys.sh'
      - 'cut-deferrals.yaml'
      - 'scripts/post_walk_qa.sh'
      - 'tests/test_walk_record_names_the_failing_probes.sh'
      - 'tests/test_cannot_run_names_its_prerequisite.sh'
      - 'scripts/box_walk_probes/**'
      - 'scripts/tests/test_people_seed_and_retrieval_probe.sh'
      - 'cut-manifests/**'
      - 'gui/Makefile'
      - '.github/workflows/cut-manifest.yml'
      - 'scripts/tests/test_verify_branch_truth_gate.sh'
      - 'scripts/tests/test_verify_clean_tree_gate.sh'
      - 'scripts/tests/test_acceptance_gate_v1013_probe.sh'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  manifest-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Run verify_cut_manifest smoke tests
        run: |
          python -m pytest scripts/tests/test_verify_cut_manifest.py scripts/tests/test_grep_in_source_at_sha_names_files.py -v

      # A walk record travels -- logs, support bundles, CI output -- and this
      # repo is PUBLIC. A Person URI is derivable from an email or phone via
      # unsalted uuid5 with a namespace and template that are both in this
      # repo, so publishing one is a confirmation oracle. This asserts no probe
      # emits one.
      #
      # It lives in THIS workflow because this workflow already triggers on
      # scripts/box_walk_probes/**, which is exactly the set of files it
      # guards. A gate that does not fire when its subject changes is not a
      # gate.
      # `if: always()` is load-bearing, not decoration. Without it this step is
      # SKIPPED whenever an earlier test in the same job fails -- so the run
      # that most needs a PII verdict is exactly the run that would not get
      # one. ci-maskless caught this and it was right.
      - name: No probe may emit a derivable Person URI
        if: always()
        run: |
          python -m pytest scripts/tests/test_probes_do_not_emit_derivable_person_uris.py -v

      # A grep_in_source_at_sha row must be provable by the SOURCE it names, not
      # by the manifest text that makes the claim.
      #
      # This is not hypothetical. v1.0.46 shipped a BRICKED installer with a
      # GREEN brick-gate: row v1046-c grepped PYTHONPYCACHEPREFIX across the
      # whole tree and matched cut-manifests/v1.0.46.yaml five times -- its own
      # file. The claim was TRUE and UNFALSIFIABLE, which is the worst kind of
      # green. A row that cites itself proves the row was typed, nothing more.
      #
      # if: always() -- if the smoke suite above fails, this is exactly when you
      # need to know whether self-satisfaction has come back too. A skipped gate
      # reports nothing.
      - name: a manifest row cannot be satisfied by its own manifest
        if: always()
        run: |
          python3 tests/test_grep_row_cannot_be_satisfied_by_its_own_manifest.py -v

      # A DUPLICATE KEY IN cut-deferrals.yaml IS SILENT AND HAS COST A CUT.
      # YAML keeps the LAST duplicate and discards the earlier one without a
      # word, so a deferral you wrote and can still read in the file is simply
      # not loaded. tests/test_cut_deferrals_no_duplicate_keys.sh checks that
      # every written deferral is actually loaded, and carries its own control
      # (a seeded duplicate must be detected) so it cannot pass vacuously.
      #
      # It existed and ran nowhere. This job already installs pyyaml, which the
      # test needs; the test exits 2 CANNOT-RUN rather than passing if python3
      # is absent.
      - name: every written deferral is actually loaded (no silent duplicate key)
        if: always()
        run: /bin/bash tests/test_cut_deferrals_no_duplicate_keys.sh
      # The walk record GATES THE CUSTOMER DOWNLOAD, and it used to record four
      # counts and nothing else -- `fail 5` with no way to say which five,
      # because run_box_walk.sh printed the names into a mktemp log that
      # post_walk_qa.sh deleted on exit. This checks the names are recovered,
      # that a parser which stops matching is EXPOSED by the reconciliation
      # line rather than silently returning to counts, and that a line carrying
      # a hostname is dropped -- walks/ is committed to a PUBLIC repo.
      - name: the walk record names the failing probes, and leaks no host
        if: always()
        run: /bin/bash tests/test_walk_record_names_the_failing_probes.sh

  # The box-walk probe body itself. The primitive above only proves the
  # verifier honours a probe's exit code; this job proves the people probe
  # actually FIRES, by driving it against a controllable fake box and
  # asserting it goes RED on every way the round-trip can be wrong.
  #
  # macOS on purpose: the cut host runs the probe under /bin/bash, which is
  # 3.2 on macOS. An ubuntu runner's bash 5 would accept 3.2-invalid syntax
  # and pass a probe that dies on the real cut host.
  people-probe-fires:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm we are testing under bash 3.2, as the cut host does
        run: /bin/bash --version | head -1

      # verify_branch_truth reads the shipping ledger with PyYAML and REFUSES to
      # guess without it -- it returns CANNOT-RUN (rc=3), which is correct and is
      # why 39 of 46 cases failed here rather than passing vacuously.
      #
      # MEASURED, so the cause is not guessed at: a real Mac (the cut-host shape)
      # has PyYAML on python3, on /usr/bin/python3, AND on the very
      # /opt/homebrew/opt/python@3.14 the runner selected. The GitHub macos-latest
      # image does not. This is a RUNNER gap, not a cut-host gap, and installing
      # it here does not paper over a product defect.
      - name: Install PyYAML (verify_branch_truth refuses to parse the ledger without it)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages pyyaml \
            || python3 -m pip install --quiet pyyaml
          # Prove it, do not assume the install worked: a silent pip failure would
          # leave the suite failing for the same reason with a fix in the log.
          python3 -c 'import yaml; print("PyYAML", yaml.__version__, "importable")'

      # The three gate suites ported in #1134. They arrived with no runner at
      # all, which new-tests-wired refused in exactly the right words: a test
      # nobody runs is not coverage, it is a green light with no bulb behind
      # it. Invoked here, and listed in this workflow's paths above, so an
      # edit to any of them re-runs the job that executes them.
      - name: branch-truth gate suite
        run: /bin/bash scripts/tests/test_verify_branch_truth_gate.sh

      - name: clean-tree gate suite
        # an earlier suite going red is exactly when you need to know whether THIS
        # one also fails; skipping it turns two defects into one report.
        if: always()
        run: /bin/bash scripts/tests/test_verify_clean_tree_gate.sh

      - name: acceptance-gate probe suite
        # same reason as the step above: a masked suite reports nothing, and a
        # silent step is indistinguishable from a passing one.
        if: always()
        run: /bin/bash scripts/tests/test_acceptance_gate_v1013_probe.sh

      - name: Probe must fire (1 green + 11 distinct reds)
        # this step PREDATES the three suites above. Wiring them in front of it
        # made it maskable, so the port had to carry its unmasking too --
        # adding a check can blind the checks already there.
        if: always()
        run: /bin/bash scripts/tests/test_people_seed_and_retrieval_probe.sh

      # The step above is now fast and reliable (task #348 removed a 35s
      # reverse-DNS stall from the fixture). Fast and reliable is also what a
      # vacuous gate looks like, so prove the harness still goes RED: hand it
      # the exact stub it exists to catch -- a probe that examines nothing and
      # exits 0 -- and demand a specific red, not merely a non-zero.
      #
      # Exit 1 specifically, plus harness_failures=0. Accepting any non-zero
      # would let a dead fixture (exit 2) satisfy the control, which is the same
      # false-pass shape in a new costume.
      - name: Negative control - the harness must go RED on the stub probe
        # always(): a run where the step above went red is exactly the run where
        # you most need to know whether the harness can still produce a red at
        # all. Skipping this on failure would mask the one measurement that
        # separates "the probe regressed" from "the harness stopped working".
        if: always()
        run: |
          set -u
          # Path moved when the probe was collapsed into probes/ so that
          # run_box_walk.sh would actually collect it. It is referenced HERE by
          # path, so a move that forgets this line silently stubs nothing and
          # the control goes green over a probe it never replaced.
          PROBE=scripts/box_walk_probes/probes/people_seed_and_retrieval.sh
          cp "$PROBE" "${RUNNER_TEMP}/probe.real"
          printf '#!/usr/bin/env bash\necho "people_seed_and_retrieval: PASS -- nothing examined"\nexit 0\n' > "$PROBE"
          set +e
          /bin/bash scripts/tests/test_people_seed_and_retrieval_probe.sh > "${RUNNER_TEMP}/stub.out" 2>&1
          rc=$?
          set -e
          cp "${RUNNER_TEMP}/probe.real" "$PROBE"
          echo "stubbed-probe run exited ${rc}"
          grep -E '^EXAMINED|^test_people_seed_and_retrieval_probe:' "${RUNNER_TEMP}/stub.out"
          if [ "$rc" -ne 1 ]; then
            echo "NEGATIVE CONTROL FAILED: expected exit 1 (expectations missed), got ${rc}."
            echo "A stub probe that examines nothing must be caught as a missed"
            echo "expectation. Any other code means the control did not measure"
            echo "what it claims to measure."
            tail -40 "${RUNNER_TEMP}/stub.out"
            exit 1
          fi
          if ! grep -q 'harness_failures=0' "${RUNNER_TEMP}/stub.out"; then
            echo "NEGATIVE CONTROL FAILED: the fixture did not stand up cleanly,"
            echo "so the red above is not attributable to the stubbed probe."
            tail -40 "${RUNNER_TEMP}/stub.out"
            exit 1
          fi
          echo "negative control OK: stub probe -> exit 1, harness healthy"

      # LAST IN THIS JOB, ON PURPOSE -- and in THIS job rather than
      # manifest-tests, for the reason the job exists: the change under test is
      # in run_box_walk.sh, which the cut host executes under /bin/bash 3.2. On
      # ubuntu-latest /bin/bash is 5, and bash 5 accepts 3.2-invalid syntax, so
      # an ubuntu runner would green-light a runner that dies on the box.
      #
      # WHY LAST. `branch-truth gate suite` above deliberately has no
      # `if: always()`: it genuinely depends on the PyYAML install step
      # immediately before it, which is the escape hatch verify_ci_steps_are_
      # maskless.py itself names. Inserting this step ABOVE it made that step
      # maskable and turned ci-maskless red -- correctly. Appending here masks
      # nothing, and needs no change to a step this PR does not own.
      #
      # THE DEFECT: probe_cannot_run() names the missing prerequisite and
      # run_box_walk.sh's header promises to print it. It did not -- only the
      # basename was kept -- so walks/v1.0.50.tsv records six probes that did
      # not run and no reason for any of them.
      #
      # The reasons stay on the CONSOLE: they interpolate box paths and
      # hostnames, and walks/ is committed to a PUBLIC repo. The load-bearing
      # assertion is the regression guard -- the record's parser stops at the
      # first line that is not a bare probe name, so a reason printed beneath a
      # name would silently cut walks/<version>.tsv down to a single row.
      - name: a CANNOT-RUN names its prerequisite, without leaking it into the record
        if: always()
        run: /bin/bash tests/test_cannot_run_names_its_prerequisite.sh

  manifest-parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate all manifests parse + have required fields
        run: |
          python3 <<'PY'
          import sys, yaml
          from pathlib import Path
          errors = []
          root = Path("cut-manifests")
          if not root.is_dir():
              print("ERROR: cut-manifests/ dir missing", file=sys.stderr)
              sys.exit(1)
          # Single source of truth: derive the allowed proof kinds from the
          # verifier's DISPATCH table so this schema check can never drift out
          # of lock-step with the real handlers again. This exact drift bit
          # twice with a hand-maintained copy here — grep_in_dmg_tree (#457)
          # and pinned_artefact_freshness (#484) — each time a new kind was
          # added to DISPATCH but not mirrored here. verify_cut_manifest imports
          # only the stdlib at module scope, so importing it under this
          # pyyaml-only job is safe; if it ever gains a heavy top-level import
          # this fails loudly (correct) rather than silently going stale.
          sys.path.insert(0, "scripts")
          from verify_cut_manifest import DISPATCH
          KINDS = set(DISPATCH)
          for path in sorted(root.glob("*.yaml")):
              try:
                  doc = yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as e:
                  errors.append(f"{path}: YAML parse error: {e}")
                  continue
              if not isinstance(doc, dict):
                  errors.append(f"{path}: root must be a mapping")
                  continue
              if "entries" not in doc:
                  errors.append(f"{path}: missing 'entries' key")
                  continue
              for i, entry in enumerate(doc.get("entries") or []):
                  where = f"{path.name}#entries[{i}]"
                  for req in ("id", "title", "proof"):
                      if req not in entry:
                          errors.append(f"{where}: missing '{req}'")
                  proof = entry.get("proof", {})
                  kind = proof.get("kind")
                  if kind not in KINDS:
                      errors.append(f"{where}: unknown proof.kind {kind!r}; must be one of {sorted(KINDS)}")
                  if kind in ("grep_in_installer", "grep_in_artefact", "grep_in_dmg_tree", "grep_in_source_at_sha") and "pattern" not in proof:
                      errors.append(f"{where}: {kind} requires 'pattern'")
                  if kind == "grep_in_dmg_tree" and "exempt_paths" in proof:
                      ep = proof.get("exempt_paths")
                      if not isinstance(ep, list) or not all(isinstance(x, str) for x in ep):
                          errors.append(f"{where}: grep_in_dmg_tree.exempt_paths must be a list of strings")
                  if kind == "plist_key_equals":
                      for req in ("path", "key", "value"):
                          if req not in proof:
                              errors.append(f"{where}: plist_key_equals requires '{req}'")
                  if kind == "plist_env_key_present":
                      for req in ("path", "key"):
                          if req not in proof:
                              errors.append(f"{where}: plist_env_key_present requires '{req}'")
                  if kind == "box_walk_probe" and "probe" not in proof:
                      errors.append(f"{where}: box_walk_probe requires 'probe'")
                  if kind == "file_exists_in_artefact" and "path" not in proof:
                      errors.append(f"{where}: file_exists_in_artefact requires 'path'")
                  if kind in ("pinned_artefact_freshness", "verify_build_info_sidecar_present"):
                      for req in ("pinned_version_source", "tag_format", "source_repo"):
                          if req not in proof:
                              errors.append(f"{where}: {kind} requires '{req}'")
                      pvs = proof.get("pinned_version_source") or {}
                      if not isinstance(pvs, dict) or not pvs.get("file") or not pvs.get("pattern"):
                          errors.append(f"{where}: {kind}.pinned_version_source needs both 'file' and 'pattern'")
                  if kind == "pinned_artefact_freshness" and "source_paths" not in proof:
                      errors.append(f"{where}: pinned_artefact_freshness requires 'source_paths'")
              print(f"OK   {path.name} ({len(doc.get('entries') or [])} entries)")
          if errors:
              print()
              print("FAIL — manifest schema errors:", file=sys.stderr)
              for e in errors:
                  print("  " + e, file=sys.stderr)
              sys.exit(1)
          print()
          print("All manifests parse + validate.")
          PY
