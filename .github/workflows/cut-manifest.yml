name: cut-manifest

# Guards the cut-manifest gate (scripts/verify_cut_manifest.py + .sh).
# Runs the hermetic smoke suite (10 tests against synthetic manifests +
# fake artefact tree) and validates that both cut-manifests/permanent.yaml
# and every cut-manifests/v*.yaml parse cleanly with the expected schema.
#
# CI cannot exercise the real gate end-to-end (that needs a built .app +
# sibling ostler-assistant / CM044 checkouts + cross-org GH access, which
# live only on the cut host). CI's job is: prove the verifier's logic
# still works, and prove the manifests are well-formed. The real gate
# runs on the cut host, wired fail-closed into gui/Makefile `ship` via
# the `check-manifest` target.
#
# Registering these here means: any change to the verifier, the manifests,
# or the wrapper is CI-guarded — the gate cannot silently rot.

on:
  pull_request:
    paths:
      - 'scripts/verify_cut_manifest.py'
      - 'scripts/verify_cut_manifest.sh'
      - 'scripts/tests/test_verify_cut_manifest.py'
      - 'cut-manifests/**'
      - 'gui/Makefile'
      - '.github/workflows/cut-manifest.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifest-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Run verify_cut_manifest smoke tests
        run: |
          python -m pytest scripts/tests/test_verify_cut_manifest.py -v

  manifest-parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate all manifests parse + have required fields
        run: |
          python3 <<'PY'
          import sys, yaml
          from pathlib import Path
          errors = []
          root = Path("cut-manifests")
          if not root.is_dir():
              print("ERROR: cut-manifests/ dir missing", file=sys.stderr)
              sys.exit(1)
          # Keep in lock-step with DISPATCH in scripts/verify_cut_manifest.py.
          # grep_in_dmg_tree landed with #457 (permanent.yaml + verifier +
          # README) but the schema check here was not updated in the same PR,
          # so a shipped 6th primitive would be rejected as "unknown" against
          # permanent.yaml. Sync'd here.
          # (B-lite) v1.0.12: adds plist_env_key_present + box_walk_probe +
          # payload_version_matches_daemon_version. exempt_paths is an
          # optional field on grep_in_dmg_tree, not a separate kind.
          # v1.0.13: adds pinned_artefact_freshness (HR015 #191) — closes
          # the "merged but not shipped" hole surfaced by oa #242 on
          # 2026-07-30 when the subscription grace-period hardening merged
          # AFTER the daemon tarball TNM was cutting from was tagged.
          KINDS = {"grep_in_installer", "grep_in_artefact",
                   "grep_in_dmg_tree", "grep_in_source_at_sha",
                   "file_exists_in_artefact", "plist_key_equals",
                   "plist_env_key_present", "box_walk_probe",
                   "payload_version_matches_daemon_version",
                   "pinned_artefact_freshness"}
          for path in sorted(root.glob("*.yaml")):
              try:
                  doc = yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as e:
                  errors.append(f"{path}: YAML parse error: {e}")
                  continue
              if not isinstance(doc, dict):
                  errors.append(f"{path}: root must be a mapping")
                  continue
              if "entries" not in doc:
                  errors.append(f"{path}: missing 'entries' key")
                  continue
              for i, entry in enumerate(doc.get("entries") or []):
                  where = f"{path.name}#entries[{i}]"
                  for req in ("id", "title", "proof"):
                      if req not in entry:
                          errors.append(f"{where}: missing '{req}'")
                  proof = entry.get("proof", {})
                  kind = proof.get("kind")
                  if kind not in KINDS:
                      errors.append(f"{where}: unknown proof.kind {kind!r}; must be one of {sorted(KINDS)}")
                  if kind in ("grep_in_installer", "grep_in_artefact", "grep_in_dmg_tree", "grep_in_source_at_sha") and "pattern" not in proof:
                      errors.append(f"{where}: {kind} requires 'pattern'")
                  if kind == "grep_in_dmg_tree" and "exempt_paths" in proof:
                      ep = proof.get("exempt_paths")
                      if not isinstance(ep, list) or not all(isinstance(x, str) for x in ep):
                          errors.append(f"{where}: grep_in_dmg_tree.exempt_paths must be a list of strings")
                  if kind == "plist_key_equals":
                      for req in ("path", "key", "value"):
                          if req not in proof:
                              errors.append(f"{where}: plist_key_equals requires '{req}'")
                  if kind == "plist_env_key_present":
                      for req in ("path", "key"):
                          if req not in proof:
                              errors.append(f"{where}: plist_env_key_present requires '{req}'")
                  if kind == "box_walk_probe" and "probe" not in proof:
                      errors.append(f"{where}: box_walk_probe requires 'probe'")
                  if kind == "file_exists_in_artefact" and "path" not in proof:
                      errors.append(f"{where}: file_exists_in_artefact requires 'path'")
                  if kind == "pinned_artefact_freshness":
                      for req in ("repo", "pin", "must_contain_prs"):
                          if req not in proof:
                              errors.append(f"{where}: pinned_artefact_freshness requires '{req}'")
                      prs = proof.get("must_contain_prs")
                      if prs is not None and (not isinstance(prs, list) or not all(isinstance(n, int) for n in prs)):
                          errors.append(f"{where}: pinned_artefact_freshness.must_contain_prs must be list[int]")
                      repo = proof.get("repo")
                      if isinstance(repo, str) and "/" not in repo:
                          errors.append(f"{where}: pinned_artefact_freshness.repo must be 'owner/name', got {repo!r}")
                      mbt = proof.get("min_build_time_after_pr")
                      if mbt is not None and not isinstance(mbt, int):
                          errors.append(f"{where}: pinned_artefact_freshness.min_build_time_after_pr must be int")
                      fmh = proof.get("freshness_max_hours")
                      if fmh is not None and (not isinstance(fmh, (int, float)) or fmh <= 0):
                          errors.append(f"{where}: pinned_artefact_freshness.freshness_max_hours must be positive number")
              print(f"OK   {path.name} ({len(doc.get('entries') or [])} entries)")
          if errors:
              print()
              print("FAIL — manifest schema errors:", file=sys.stderr)
              for e in errors:
                  print("  " + e, file=sys.stderr)
              sys.exit(1)
          print()
          print("All manifests parse + validate.")
          PY
