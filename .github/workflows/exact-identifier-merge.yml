name: exact-identifier-merge

# Two nodes that share an exact email, E.164 mobile or canonical LinkedIn URL,
# and carry the same full name, are one person even when they are two Contacts
# cards. Runs the REAL BatchResolver (detect, execute, converge, undo) against
# an in-memory rdflib store. Synthetic data only. See
# vendor/cm041/identity_resolver/exact_identifier.py for the rule.

on:
  pull_request:
    paths:
      - 'vendor/cm041/identity_resolver/**'
      - 'tests/test_exact_identifier_merge.py'
      - 'tests/test_merge_journal_records_keyed_identifier_hashes.py'
      - 'tests/test_nameless_records_sharing_a_number_are_one_person.py'
      - 'tests/test_different_people_decision_blocks_remerge.py'
      - '.github/workflows/exact-identifier-merge.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  exact-identifier-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the resolver's declared dependencies plus the test store
        run: |
          python3 -m pip install --quiet --break-system-packages --ignore-installed \
            -r vendor/cm041/identity_resolver/requirements.txt rdflib pytest pyyaml qdrant-client vobject \
          || python3 -m pip install --quiet --ignore-installed \
            -r vendor/cm041/identity_resolver/requirements.txt rdflib pytest pyyaml qdrant-client vobject
      - name: Exact shared identifier merges, with vetoes, guard, journal and undo
        run: python3 -m pytest -q tests/test_exact_identifier_merge.py
      # NEW-119: each matched key journalled as {kind, keyed hash}, no raw value.
      - name: Merge journal records keyed identifier hashes, never raw values
        if: success() || failure()
        run: |
          out="$(python3 -m pytest -q -rs tests/test_merge_journal_records_keyed_identifier_hashes.py 2>&1)" || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q SKIPPED; then echo "SKIPPED is not a pass" >&2; exit 1; fi
          n="$(printf '%s' "$out" | grep -Eo '[0-9]+ passed' | grep -Eo '[0-9]+')"
          if [ "${n:-0}" -lt 12 ]; then echo "expected at least 12 passed, got ${n:-0}" >&2; exit 1; fi
      # #2545: a skip (importorskip) is not a pass, so -rs output is checked.
      - name: Nameless records sharing a number resolve to one person
        if: always()
        run: |
          out="$(python3 -m pytest -q -rs tests/test_nameless_records_sharing_a_number_are_one_person.py 2>&1)" || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q SKIPPED; then echo "SKIPPED is not a pass" >&2; exit 1; fi
      # #2876 "different people": a stale converge plan (execute) and the
      # ingest-time collapse (resolver.resolve) both honour the decision.
      # Two controls: without the decision, both paths merge.
      - name: A different-people decision blocks every merge path
        if: always()
        run: |
          out="$(python3 -m pytest -q -rs tests/test_different_people_decision_blocks_remerge.py 2>&1)" || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          if grep -q SKIPPED <<<"$out"; then echo "SKIPPED is not a pass" >&2; exit 1; fi
          n="$(grep -Eo '[0-9]+ passed' <<<"$out" | grep -Eo '[0-9]+')"
          if [ "${n:-0}" -lt 4 ]; then echo "expected at least 4 passed, got ${n:-0}" >&2; exit 1; fi
