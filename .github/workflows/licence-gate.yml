name: licence-gate

# The shell install path must require a licence.
#
# install.sh is a PUBLIC script advertised as
#   curl -fsSL https://ostler.ai/install.sh | bash
# and until 2026-08-16 it carried no licence enforcement at all: measured on
# main that morning, ERR-02-LICENCE-REQUIRED / allow-unlicensed / OSTLER_DEV
# each scored 0 hits against a control (OSTLER_ASSISTANT_VERSION) that scored
# 19, so the zeroes were real and not a broken grep. One command installed the
# whole paid product for free. The only Ed25519 verification in the repo lived
# in the Swift GUI, which the shell path never runs.
#
# tests/test_licence_gate.sh runs the REAL install.sh five ways -- no licence,
# malformed/empty, wrong-key, valid, escape hatch -- with a sandboxed HOME, and
# stops at the gate. It carries its own instrument checks: the shipped verifier
# extracted from install.sh must reproduce the RFC 8032 section 7.1
# known-answer vector (a stub returning true would pass every refusal case and
# die there), the wrong-key fixture is asserted schema-valid so its refusal can
# only have come from the signature, and the valid licence is the positive
# control -- a gate observed only failing is not known to be able to pass.
#
# Keys and licence bodies are synthetic, generated inside the test run. Nothing
# real is committed and nothing real is needed to run it.

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'tests/test_licence_gate.sh'
      - 'tests/test_shipped_compose_licence_mount.sh'
      - 'gui/OstlerInstaller/Auth/LicenseVerifier.swift'
      - 'gui/OstlerInstaller/Auth/LicensePersistence.swift'
      # A gate must trigger on changes to ITSELF, or it can be quietly
      # narrowed in a PR that never runs it.
      - '.github/workflows/licence-gate.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  licence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The test refuses to run (exit 1, not 0) without python3, so a runner
      # image change cannot turn this gate into a silent pass.
      - name: install.sh refuses to install without a valid licence
        run: bash tests/test_licence_gate.sh

      # The other half of the licence surface. The gate above proves the
      # installer REFUSES an invalid licence; this one proves the shipped
      # stack can READ a valid one. #849: the wiki compiler resolved
      # /root/.ostler/licence/state.json, ~/.ostler was never mounted into
      # that container, and the reader fail-closes to pro_none -- so every
      # Pro customer silently got no Obsidian vault. CM044 fixed its own dev
      # compose and guarded it with a test that reads CM044's dev compose.
      # The customer runs the compose THIS repo generates. Instrument and
      # defect on different surfaces; hence an assertion on install.sh.
      #
      # `if: always()` because the two halves are INDEPENDENT. Without it this
      # step is skipped whenever the refusal test above fails -- and then a run
      # that goes red on the refusal half silently reports NOTHING about the
      # mount half, which is how a second defect hides behind a first. Caught
      # by scripts/verify_ci_steps_are_maskless.py.
      - name: the shipped compose can READ the licence it just verified
        if: always()
        run: bash tests/test_shipped_compose_licence_mount.sh
