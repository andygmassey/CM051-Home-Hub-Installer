name: cannotrun-instruments

# v1.0.122: the v1.0.121 walk read 22 CANNOT-RUN, several of them instrument gaps
# (an ssh alias used as a LAN address, a bearer that was ciphertext, a model stub
# that spoke the wrong dialect, common-name fixtures crowded out of search, a derive
# kick that was never repeated). One regression test per gap; each was shown RED
# against its own mutant. Loopback stubs only, synthetic data.

on:
  pull_request:
    paths:
      - 'scripts/box_walk_probes/lib/probe.sh'
      - 'scripts/box_walk_probes/lib/stored_secret_sweep.py'
      - 'scripts/box_walk_probes/lib/send_safety.py'
      - 'scripts/box_walk_probes/lib/l3_prefetch.py'
      - 'scripts/box_walk_probes/lib/smart_prefs.py'
      - 'scripts/box_walk_probes/lib/data_conservation.py'
      - 'scripts/box_walk_probes/probes/companion_listener_refuses_unauthenticated.sh'
      - 'scripts/box_walk_probes/probes/pair_endpoints_refuse_off_window.sh'
      - 'scripts/box_walk_probes/probes/gateway_never_serves_a_stored_secret.sh'
      - 'tests/test_cannotrun_instruments_v1_0_122.py'
      - 'tests/test_no_l3_seed_real_store.py'
      - 'tests/test_no_l3_probe_selftests.sh'
      - 'scripts/box_walk_probes/probes/no_l3_in_tool_results.sh'
      - 'scripts/box_walk_probes/lib/no_l3_preflight.sh'
      - 'scripts/box_walk_probes/lib/no_l3_graph_seed.py'
      - 'vendor/cm041/meeting_syncer/decision_extractor.py'
      - 'vendor/cm048_pipeline/src/topic_writer.py'
      - 'scripts/box_walk_probes/tests/test_planted_l3_topic_label.py'
      - 'scripts/box_walk_probes/tests/test_planted_l3_topic_http.py'
      - 'vendor/cm041/assistant_api/ical-server.py'
      - '.github/workflows/cannotrun-instruments.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cannotrun-instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: each instrument gap stays closed
        run: python3 tests/test_cannotrun_instruments_v1_0_122.py -v
      - name: the no_l3 seed writes every row to a REAL store (and the double-wrap mutant goes red)
        if: always()
        run: |
          python3 -m pip install --quiet pyoxigraph httpx cryptography phonenumbers
          python3 tests/test_no_l3_seed_real_store.py -v
      - name: a planted L3-only topic is nowhere in /topics or its mentions (direct reader calls)
        if: always()
        run: |
          python3 -m pip install --quiet pyoxigraph httpx cryptography phonenumbers pyyaml
          python3 scripts/box_walk_probes/tests/test_planted_l3_topic_label.py -v
      - name: a planted L3-only topic is nowhere in /topics or its mentions (over HTTP)
        if: always()
        run: |
          python3 -m pip install --quiet pyoxigraph httpx cryptography phonenumbers pyyaml
          python3 scripts/box_walk_probes/tests/test_planted_l3_topic_http.py -v

  no-l3-probe-selftests:
    # macOS: the preflight collector reads BSD stat, shasum and date (stat -f, date -j,
    # launchctl print), so this cannot run on the Linux job above.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: the no_l3 probe's seed-URL, preflight and run_probe self-tests
        run: bash tests/test_no_l3_probe_selftests.sh
