name: branch-hygiene
# Fails if a merged-PR head lingers >24h, or a branch has no PR and is >7 days old.
# Archive instead of leaving a branch: tag archive/<date>/<branch>, then delete the branch.
on:
  schedule:
    - cron: '17 6 * * *'
  # PR runs only when the gate itself changes: on every PR it would turn the
  # CI Required Gate red for repo-wide state the PR did not cause.
  pull_request:
    paths:
      - .github/workflows/branch-hygiene.yml
      - scripts/branch_hygiene_gate.py
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/branch_hygiene_gate.py --self-test
      - run: python3 scripts/branch_hygiene_gate.py --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
