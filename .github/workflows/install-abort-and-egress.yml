name: install-abort-and-egress

# The two gates that came out of the v1.0.35 box walk (#409, #410).
#
# #409  install.sh called _install_enrichment_agent at line 13480 and defined it
#       at 18386. Bash creates a function when its definition line EXECUTES, so
#       every install died at step 15 of 39 with `command not found`.
#       `bash -n` parses, it does not order, so nothing here could catch it.
#
# #410  csv_parser inferred a category by UNANCHORED SUBSTRING ("Technology"
#       contains "techno"), and every category it can infer routes to a client
#       that puts the SUBJECT in an outbound query -- including the `interest`
#       catch-all. LinkedIn InMail subjects reached Wikidata and MusicBrainz.
#
# Both gates carry their own controls: the install.sh scanner plants a synthetic
# call-before-definition and refuses (rc=2) if it cannot find it, and the python
# suite reads the SHIPPED keyword table rather than a copy so the table cannot
# drift away from its own test.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `if: always()` ON EVERY GATE AFTER THE FIRST, and I earned this comment
      # the embarrassing way. GitHub's default step condition is "run only if
      # every previous step succeeded", so without it a failure in the install.sh
      # gate SKIPS the egress gate, and a skipped gate reports nothing while
      # looking like it was considered.
      #
      # That is the identical shape as the missing `if:` on upload-artifact that
      # destroyed the v1.0.26 and v1.0.34 DMGs. ci-maskless caught it here, in a
      # workflow written hours after fixing that exact class. These two gates are
      # independent: neither result tells you anything about the other, so both
      # must always report.
      - name: No function is called before it is defined in install.sh
        run: bash tests/test_install_sh_no_call_before_definition.sh

      - name: An inferred category never authorises egress
        if: always()
        run: python3 tests/test_inferred_category_never_egresses.py

      # The tripwire on Andy's one ratified cut of deferral. v1.0.36 ships the
      # enrichment agent gated OFF; the cut after it must carry the question
      # that lets the customer decide. This step is green today and turns red
      # by itself the moment CFBundleShortVersionString goes past 1.0.36, so
      # the deferral cannot quietly become the permanent behaviour.
      - name: The enrichment opt-in question lands in the cut after v1.0.36
        if: always()
        run: bash tests/test_enrichment_optin_is_owed_after_v1_0_36.sh
