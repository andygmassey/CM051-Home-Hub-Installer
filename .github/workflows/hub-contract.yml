name: hub-contract

# Lane 10. hub_contract.yaml is GENERATED from the server code (ical-server,
# the Doctor, the store-proxy conf in install.sh, and the ostler-assistant
# gateway). This workflow:
#   1. proves the generator and the checker can go red (hermetic tests);
#   2. regenerates the contract and fails if the committed copy is stale;
#   3. lists which client repos still pin an older contract (drift guard).
#
# Reads ostler-ai/ostler-assistant (private) and the client repos with the
# EXISTING secret OSTLER_GH_TOKEN_ANDYGMASSEY, the same one cut.yml already
# uses for cross-org reads of ostler-assistant (see .github/SECRETS.md). No new
# credential is introduced. If that token cannot read a repo, jobs 2 and 3
# exit CANNOT-RUN loudly. They never pass silently.

on:
  pull_request:
    paths:
      - 'vendor/cm041/assistant_api/**'
      - 'vendor/doctor/**'
      - 'install.sh'
      - 'scripts/gen_hub_contract.py'
      - 'scripts/hub_contract_check.py'
      - 'scripts/hub_contract_check.js'
      - 'scripts/pin_hub_contract.py'
      - 'scripts/hub_contract_drift.py'
      - 'hub_contract_clients.json'
      - 'tests/test_hub_contract_generator.py'
      - '.github/workflows/hub-contract.yml'
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

jobs:
  generator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: generator and checker unit tests
        run: python3 tests/test_hub_contract_generator.py -v

  contract-is-current:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ostler-ai/ostler-assistant
          path: ostler-assistant
          # CM051_RELEASES_READ: fine-grained, resource owner ostler-ai, repos
          # ostler-assistant + ostler-remote-capture + ostler-releases, read code,
          # metadata and pull requests (Andy's token page, 2026-10-09). The
          # andygmassey-owned token can never read ostler-ai contents.
          token: ${{ secrets.CM051_RELEASES_READ }}
      - name: regenerate and compare
        run: |
          if [ ! -f ostler-assistant/crates/zeroclaw-gateway/src/lib.rs ]; then
            echo "CANNOT-RUN: gateway source not checked out (can CM051_RELEASES_READ read ostler-ai/ostler-assistant?)"; exit 2
          fi
          python3 scripts/gen_hub_contract.py --gateway-src ostler-assistant --check

  client-pin-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: contract-is-current
    steps:
      - uses: actions/checkout@v4
      - name: which client pins are stale
        env:
          GH_TOKEN: ${{ secrets.OSTLER_GH_TOKEN_ANDYGMASSEY }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "CANNOT-RUN: no token to read the client repos"; exit 2; fi
          python3 scripts/hub_contract_drift.py
