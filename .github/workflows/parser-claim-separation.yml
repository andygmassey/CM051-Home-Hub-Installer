name: parser-claim-separation
# Not paths-filtered on the parser files alone. The defect is a CLAIM that
# overlaps another parser's files, so it can be reopened from three places:
# the claiming parser, the parser it steals from, and the registration ORDER in
# pipeline.py. Filtering on any subset would go quiet on a change to the rest.
# CM051 is public; the runner is free.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  claim-separation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install the parser package's import-time dependencies
        # src/parsers/__init__.py imports every parser, so these three are what
        # it takes to import ANY of them. Measured, not guessed.
        run: pip install aiofiles pydantic-settings beautifulsoup4
      - name: a YouTube parser must never claim a Facebook export
        run: python3 tests/test_youtube_parser_does_not_claim_facebook.py
      - name: a WhatsApp parser must never claim a Meta message thread
        # MEASURED on a real archive: 1,852 Facebook + 856 Instagram
        # message_N.json were claimed by WhatsAppParser and yielded 0.
        #
        # if: always() because these two claim tests are INDEPENDENT axes.
        # Without it this step is skipped whenever the YouTube step above
        # fails, so a run that is already red would silently stop reporting
        # the WhatsApp axis -- a gate that hides exactly when it matters most.
        # ci-maskless caught this; the step was maskable as first written.
        if: always()
        run: python3 tests/test_whatsapp_parser_does_not_claim_meta_messages.py
      # The general case of the same defect, measured across the whole
      # registration list rather than one pair: eight export archives were
      # claimed by a parser that could not read them, each yielding zero. Runs
      # in this job, not a new workflow, because it is the same defect class on
      # the same files -- a second workflow would duplicate the checkout, the
      # Python setup and the pip install to say the same thing.
      # if: always() because the step above is a test, not a prerequisite. The
      # two measure different things and a red YouTube/Facebook run must not
      # hide whether the general case also broke.
      - name: no parser may claim another service's export
        if: always()
        run: python3 tests/test_parser_claims_do_not_cross_services.py
      - name: an EXTRACTED Discord package must still be claimed
        # MEASURED: package.zip is claimed, but all 74 files inside the
        # extracted tree are not, because the .json test needs the literal
        # string "discord" in the FILENAME. if: always() -- independent axis.
        if: always()
        run: python3 tests/test_discord_claims_an_extracted_package.py
