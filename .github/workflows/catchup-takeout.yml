# v1.0.108 catch-up 6/6: every Google Takeout part and every mailbox is read to
# the first message. A synthetic 262,320-message, three-part Takeout (larger
# than the install's 250,000-message, 20,000-thread, five-year caps): install
# + catch-up reaches every thread and correspondent once; SIGKILL in the index
# and dispatch phases loses and duplicates nothing; cost is measured.
name: catchup-takeout

on:
  push:
    branches: [main]
    paths:
      - 'vendor/ostler_fda/catchup_mbox.py'
      - 'vendor/ostler_fda/universal_import.py'
      - 'vendor/ostler_fda/google_takeout.py'
      - 'lib/ostler_catchup.py'
      - 'install.sh'
      - 'tests/test_catchup_takeout.py'
      - '.github/workflows/catchup-takeout.yml'
  pull_request:
    paths:
      - 'vendor/ostler_fda/catchup_mbox.py'
      - 'vendor/ostler_fda/universal_import.py'
      - 'vendor/ostler_fda/google_takeout.py'
      - 'lib/ostler_catchup.py'
      - 'install.sh'
      - 'tests/test_catchup_takeout.py'
      - '.github/workflows/catchup-takeout.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  catchup-takeout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest and the vendored ostler_fda dependencies
        run: python -m pip install --quiet pytest -e vendor/ostler_fda
      - name: every Takeout part and every mailbox, read once, kill-safe
        run: |
          n="$(python -m pytest tests/test_catchup_takeout.py --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 6 ]; then
            echo "REFUSING: expected at least 6 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python -m pytest tests/test_catchup_takeout.py -v -rs -s
