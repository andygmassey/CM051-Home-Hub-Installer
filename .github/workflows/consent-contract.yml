# Two consent tests passed and ran nowhere, and the wiring manifest said WIRED.
#
# They were scored WIRED because verify_test_wiring.sh substring-searched whole
# workflow bodies, comments included, so a test counted as wired if anything
# merely NAMED it. Neither of these appears in any workflow's run steps. Both
# pass. Both cover the consent ceremony, which is the part of the installer a
# customer is legally and reputationally most exposed by.
#
# Measured 2026-08-15 after teaching that gate to ignore comment lines:
#   consent A7+A8 assertions      rc=0  8/8 pass
#   third-party data consent      rc=0  all pass
#
# Wired here so the claim in the manifest becomes true.
name: consent-contract

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'install.sh.strings.*.sh'
      - 'tests/test_consent_a7_a8.sh'
      - 'tests/test_third_party_data_consent.sh'
      - 'tests/test_autologin_consent_opt_in.sh'
      - 'tests/test_recording_consent_gates_the_capture_companion.sh'
      - 'lib/progress_emitter.sh'
      - '.github/workflows/consent-contract.yml'
      - 'tests/test_the_consent_rules_table_is_safe.py'
      - 'lib/transcription_consent_rules.csv'
  pull_request:
    paths:
      - 'install.sh'
      - 'install.sh.strings.*.sh'
      - 'tests/test_consent_a7_a8.sh'
      - 'tests/test_third_party_data_consent.sh'
      - 'tests/test_autologin_consent_opt_in.sh'
      - 'tests/test_recording_consent_gates_the_capture_companion.sh'
      - 'lib/progress_emitter.sh'
      - '.github/workflows/consent-contract.yml'
      - 'tests/test_the_consent_rules_table_is_safe.py'
      - 'lib/transcription_consent_rules.csv'

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  consent-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # `if: always()` on every step. Without it the first failure skips the
      # rest, and a skipped gate reports identically to one that ran and passed.
      - name: consent A7 + A8 assertions
        if: always()
        run: bash tests/test_consent_a7_a8.sh

      # The country table is DATA, deliberately, so a legal edit is not a code
      # edit. This guard holds the one property that matters: it must never
      # answer permissively for a place it does not actually know about. A
      # country with sub-national variation carrying a permissive country-level
      # answer means the strict path never fires for its strict states.
      - name: The consent rules table cannot answer permissively for a place it does not know
        if: always()
        run: python3 tests/test_the_consent_rules_table_is_safe.py

      - name: third-party data consent
        if: always()
        run: bash tests/test_third_party_data_consent.sh

  # SEPARATE JOB, ON macOS, ON PURPOSE. This one does not merely grep the
  # consent copy -- it EXTRACTS the auto-login consent gate from install.sh and
  # EXECUTES it, so the shell it runs under has to be the shell install.sh
  # ships under. That is /bin/bash 3.2.57 on the customer's Mac, not the
  # bash 5.x on ubuntu-latest. A proof of a shell decision that runs under a
  # different shell from the artefact is not a proof of the artefact.
  # (Same reasoning as test-wiring.yml's `runs-on: macos-latest`.)
  autologin-consent-opt-in:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: bash on this runner is the shipped 3.2 (control for the step below)
        if: always()
        run: /bin/bash --version | head -1

      - name: auto-login consent is opt-in and its copy does not overclaim
        if: always()
        run: /bin/bash tests/test_autologin_consent_opt_in.sh

      # SAME JOB, SAME REASON. This one extracts the RemoteCapture phase out of
      # install.sh and EXECUTES it under three consent answers, so it has to run
      # under the shell the artefact ships under.
      #
      # `|| rc=$?`, not a bare call: the step shell is `/bin/bash -e {0}`, so a
      # bare fallible call exits before rc is captured and the CANNOT-RUN branch
      # becomes unreachable code -- the class cannot-run-branch-reachable exists
      # to catch. A harness that could not read the phase has measured NOTHING
      # about it, and that is not a pass.
      - name: a declined recording consent stops the capture companion being installed
        if: always()
        run: |
          set -uo pipefail
          rc=0
          /bin/bash tests/test_recording_consent_gates_the_capture_companion.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The RemoteCapture phase could not be extracted from install.sh, so NOTHING was measured about whether a declined recording consent stops it. This is not a pass."
          fi
          exit "$rc"
