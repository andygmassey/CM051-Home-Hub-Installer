name: walk-probes-122a

# The v1.0.122 walk probes chat_reminder_routes_to_home (#2397, #2398), image_pulls_match_pins (#2404)
# and status_api_dates_are_sane (#966) run on a walk box (run_box_walk.sh globs probes/). What THIS
# workflow runs is the apparatus: each judge against a good capture, the known-bad shapes and blind
# controls, and a mutant of each assertion that must turn the self-test red.

on:
  pull_request:
    paths:
      - 'scripts/box_walk_probes/**'
      - 'tests/test_walk_probes_122a.sh'
      - '.github/workflows/walk-probes-122a.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  walk-probes-122a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe self-tests, judge self-tests and mutants
        run: bash tests/test_walk_probes_122a.sh
