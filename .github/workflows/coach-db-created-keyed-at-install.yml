name: coach-db-created-keyed-at-install

# Walk #31 (v1.0.108): the coach db was created lazily, so on a fresh install
# that never coached anything it did not exist, the probe forget made a 0-byte
# stray, GET /api/v1/coach/recent 500'd and context-refresh exited 3 per tick.
# This runs the installer block lifted from install.sh, the real CM048 writer,
# the real ical-server and the real probe forget against SQLCipher.

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'install.sh.strings.en-GB.sh'
      - 'vendor/cm041/assistant_api/ical-server.py'
      - 'vendor/cm041/assistant_api/tests/test_coach_reader_matches_writer.py'
      - 'vendor/cm048_pipeline/src/ingest.py'
      - 'vendor/ostler_security/**'
      - 'scripts/box_walk_probes/lib/db_key_probe.py'
      - 'tests/test_install_creates_the_coach_db_keyed.py'
      - '.github/workflows/coach-db-created-keyed-at-install.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  coach-db-created-keyed-at-install:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the runtime the services actually use
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "cryptography>=50.0.0,<51.0.0" \
            "sqlcipher3>=0.6.0,<0.7.0" \
            "httpx>=0.27,<1.0" \
            "PyYAML>=6.0" \
            "phonenumbers>=8.13.0" \
            pytest

      - name: Coach db created keyed at install; reader and forget tolerate a fresh box
        run: python -m pytest -q -p no:cacheprovider tests/test_install_creates_the_coach_db_keyed.py

      - name: Coach reader matches writer (decoy contract updated by the same change)
        run: python -m pytest -q -p no:cacheprovider vendor/cm041/assistant_api/tests/test_coach_reader_matches_writer.py
