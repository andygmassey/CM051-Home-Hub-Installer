name: launchd-plist-paths

# Regression gate for #177 (v1.0.13 launch-blocker, live-confirmed on the
# Mini). The Ollama + ollama-logrotate LaunchAgents shipped with dead
# /tmp/ostler-prelaunch-<pid>/... paths baked into ProgramArguments /
# StandardOutPath / StandardErrorPath: the ollama section of install.sh
# runs PRE-FDA, while _ostler_set_paths still has LOGS_DIR/OSTLER_DIR bound
# to the /tmp staging tree (rebound to ~/.ostler only at the post-FDA
# promotion). /tmp is wiped on reboot + macOS periodic cleanup, so both
# agents failed after every reboot.
#
# This gate renders the two ollama plist heredocs under a POISONED prelaunch
# environment and fails if any shipped com.*ostler*.plist path resolves
# under /tmp -- catching the next re-introduction at CI, not at a customer
# reboot. Companion test: tests/test_launchd_plist_no_tmp.sh.

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'install.sh.strings.en-GB.sh'
      - 'tests/test_launchd_plist_no_tmp.sh'
      - 'tests/test_export_scan_plist_bootstrap_race_217.sh'
      - 'tests/test_stay_awake_agent_survives_installer_exit.sh'
      - '.github/workflows/launchd-plist-paths.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  launchd-plist-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert no shipped LaunchAgent plist path resolves under /tmp
        run: bash tests/test_launchd_plist_no_tmp.sh

      - name: Assert com.ostler.export-scan bootstrap is race-safe (HR015 #217)
        if: always()
        run: bash tests/test_export_scan_plist_bootstrap_race_217.sh

      # Task #338. The GUI install left the Mac's own sleep policy untouched,
      # so the Hub slept every ~100 s and spent 1430 of 1439 wakes in DARK
      # wake, where launchd does not schedule user agents. The assistant's
      # iMessage poll never ran and inbound messages were silently never seen.
      # This asserts the com.ostler.stay-awake agent is installed on BOTH the
      # GUI and CLI paths, and that it carries `caffeinate -s` and NOT -i/-d,
      # which would flatten a MacBook Hub's battery or hold its display on.
      #
      # `if: always()` for the same reason as the step above: a failure in an
      # earlier step must not delete this measurement. That exact shape --
      # one limb's cannot-run silently removing another limb's answer -- is
      # what CM051 #656 fixed across 26 steps.
      - name: Assert the Hub stays awake after the installer exits (#338)
        if: always()
        run: bash tests/test_stay_awake_agent_survives_installer_exit.sh
