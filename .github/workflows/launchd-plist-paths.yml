name: launchd-plist-paths

# Regression gate for #177 (v1.0.13 launch-blocker, live-confirmed on the
# Mini). The Ollama + ollama-logrotate LaunchAgents shipped with dead
# /tmp/ostler-prelaunch-<pid>/... paths baked into ProgramArguments /
# StandardOutPath / StandardErrorPath: the ollama section of install.sh
# runs PRE-FDA, while _ostler_set_paths still has LOGS_DIR/OSTLER_DIR bound
# to the /tmp staging tree (rebound to ~/.ostler only at the post-FDA
# promotion). /tmp is wiped on reboot + macOS periodic cleanup, so both
# agents failed after every reboot.
#
# This gate renders the two ollama plist heredocs under a POISONED prelaunch
# environment and fails if any shipped com.*ostler*.plist path resolves
# under /tmp -- catching the next re-introduction at CI, not at a customer
# reboot. Companion test: tests/test_launchd_plist_no_tmp.sh.

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'install.sh.strings.en-GB.sh'
      - 'tests/test_launchd_plist_no_tmp.sh'
      - 'tests/test_enrichment_identity_and_disclosure.sh'
      - 'vendor/cm019_preferences/services/enrich/**'
      - 'tests/test_assistant_config_no_tmp.sh'
      - 'tests/test_diag_sink_per_run.sh'
      - 'tests/test_export_scan_plist_bootstrap_race_217.sh'
      - 'tests/test_stay_awake_agent_survives_installer_exit.sh'
      - 'tests/test_laptop_hub_power_copy_fires_on_laptops_only.sh'
      - 'tests/test_uninstall_removes_every_launchagent_plist.sh'
      - 'tests/test_a_self_removing_agent_deletes_its_plist_before_it_dies.sh'
      # A suite this workflow RUNS but does not WATCH is dark on self-edit --
      # it could be narrowed, or gutted, in the very PR that narrows it.
      - 'tests/test_uninstaller_counts_do_not_abort_on_an_unreadable_dir.sh'
      - 'tests/test_err06_states_what_it_measured.sh'
      - 'tests/test_qdrant_readiness_tests_the_authenticated_surface.sh'
      - 'tests/test_qdrant_import_gate_refuses_empty_store.sh'
      - 'tests/test_launchagent_bootstrap_after_staging.py'
      - 'tests/test_launchagent_homebrew_path.sh'
      - '**/launchd/*.plist'
      - '.github/workflows/launchd-plist-paths.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  launchd-plist-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert no shipped LaunchAgent plist path resolves under /tmp
        run: bash tests/test_launchd_plist_no_tmp.sh

      # THE SAME ROOT CAUSE, ONE FILE OVER, AND THE STEP ABOVE WAS BLIND TO IT.
      # Measured on the .219 box running v1.0.33 on 2026-08-17:
      #
      #     session_path = "/tmp/ostler-prelaunch-3992/state/whatsapp-session.db"
      #
      # in the SHIPPED ~/.ostler/assistant-config/config.toml. The assistant
      # config is written pre-FDA, exactly like the ollama plists were, so the
      # customer's WhatsApp Web device credentials were pointed at a directory
      # macOS purges. The link dies on reboot and the daemon carries on
      # printing "Channels: imessage, whatsapp" as though nothing happened.
      #
      # The step above did not catch it because it is keyed to the two ollama
      # PLISTS by name. A gate keyed to a name does not cover a class, so this
      # one asserts over the WHOLE rendered config, every key, not just the one
      # that was broken.
      #
      # `if: always()` for the same reason as every step here (CM051 #656): an
      # earlier limb's failure must not delete this measurement.
      - name: Assert no shipped assistant-config value resolves under /tmp
        if: always()
        run: bash tests/test_assistant_config_no_tmp.sh

      # Same disease as #177, a different organ. #177 was fixed, shared /tmp
      # paths baked into plists; #910 is fixed, shared /tmp paths used as
      # DIAGNOSTIC SINKS -- and there the consequence is worse than a dead
      # log. bash ABORTS a command whose redirection cannot be opened, so a
      # sink another user already owns turns a step that never ran into a step
      # reported as failed, and then prints that other user's error text to
      # our customer. That is what killed the first ever walk of install.sh,
      # in three minutes, on 2026-08-28.
      #
      # `if: always()` for the same reason as every step here (CM051 #656).
      - name: Assert diagnostics go to a private per-run dir, never a fixed /tmp path (#910)
        if: always()
        run: bash tests/test_diag_sink_per_run.sh

      # What Ostler announces itself as to third parties, and whether the
      # installer's disclosure names the set it actually contacts. 23 shipped
      # User-Agents said PWG-Enrichment, pointed at accounts that are not ours,
      # or impersonated Chrome to scrape Amazon. Every enrichment destination
      # receives the customer's IP, the query and this string.
      - name: Assert our outbound identity is ours, and the disclosure names the live set
        if: always()
        run: bash tests/test_enrichment_identity_and_disclosure.sh

      - name: Assert com.ostler.export-scan bootstrap is race-safe (HR015 #217)
        if: always()
        run: bash tests/test_export_scan_plist_bootstrap_race_217.sh

      # Task #338. The GUI install left the Mac's own sleep policy untouched,
      # so the Hub slept every ~100 s and spent 1430 of 1439 wakes in DARK
      # wake, where launchd does not schedule user agents. The assistant's
      # iMessage poll never ran and inbound messages were silently never seen.
      # This asserts the com.ostler.stay-awake agent is installed on BOTH the
      # GUI and CLI paths, and that it carries `caffeinate -s` and NOT -i/-d,
      # which would flatten a MacBook Hub's battery or hold its display on.
      #
      # `if: always()` for the same reason as the step above: a failure in an
      # earlier step must not delete this measurement. That exact shape --
      # one limb's cannot-run silently removing another limb's answer -- is
      # what CM051 #656 fixed across 26 steps.
      - name: Assert the Hub stays awake after the installer exits (#338)
        if: always()
        run: bash tests/test_stay_awake_agent_survives_installer_exit.sh

      # The half of #338 that the agent cannot fix. `caffeinate -s` is valid
      # only on AC (caffeinate(8)) and a closed lid sleeps the Mac regardless
      # of any power assertion, so on a Mac mini or Studio the agent closes the
      # gap and on a laptop it does not. `-s` is still the right flag -- `-i`
      # would flatten a laptop -- which makes the remedy honest copy, and makes
      # the copy the shipped artefact. This renders the two real install.sh
      # blocks against a stubbed pmset and asserts a laptop is told and a
      # desktop is not.
      - name: Assert the laptop-Hub power copy reaches laptops only
        if: always()
        run: bash tests/test_laptop_hub_power_copy_fires_on_laptops_only.sh

      # The other half of the same agent's life. `launchctl bootout` unloads a
      # job for the current login session only; launchd rescans
      # ~/Library/LaunchAgents at every login, so a plist left on disk is
      # loaded again next time the customer logs in. An uninstall that boots
      # out com.ostler.stay-awake and leaves its plist behind keeps holding a
      # `caffeinate -s` power assertion on a Mac with no Ostler on it.
      #
      # This runs the uninstaller's teardown against a sandboxed HOME seeded
      # with one plist per agent and fails on anything still on disk after.
      # Presence of an `rm -f` line is not what it measures; what is left in
      # the directory is.
      #
      # `if: always()` for the same reason as the steps above: an earlier
      # failure must not delete this measurement (CM051 #656).
      - name: Assert uninstall removes every LaunchAgent plist, not just the job
        if: always()
        run: bash tests/test_uninstall_removes_every_launchagent_plist.sh

      # #563 -- AND THE STEP ABOVE CANNOT SEE IT. That test seeds a sandboxed
      # HOME and runs the TEARDOWN region; this defect is 50 lines EARLIER, in
      # the content count, and it stops the script before the teardown is ever
      # reached. A teardown test that starts at the teardown passes on an
      # uninstaller that never gets there.
      #
      #     find "$d" -type f 2>/dev/null | wc -l | tr -d ' '
      #
      # ~/Documents is TCC-protected, a default Terminal has no Full Disk
      # Access, `2>/dev/null` hides find's MESSAGE and not its EXIT STATUS, and
      # the script is `set -euo pipefail` with zero traps. So the customer saw
      # the banner, saw no error, and kept the containers, the LaunchAgents and
      # both .apps. The file asserts the count no longer aborts AND that an
      # abort now speaks, each with its own mutation control.
      #
      # rc=2 IS NOT rc=1. Arm 2 needs a directory this process genuinely cannot
      # read; `chmod 000` does not stop root, so under a root runner the arm
      # would be vacuous and the harness refuses a verdict instead of printing
      # a green. A permission test that runs as root is a test that cannot
      # fail. Both are red; they must not read the same (#1239).
      - name: Assert the uninstaller's content count cannot abort the uninstall
        if: always()
        run: |
          set -uo pipefail
          rc=0
          bash tests/test_uninstaller_counts_do_not_abort_on_an_unreadable_dir.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The #563 harness could not obtain a verdict -- either its anchors no longer match install.sh, or this runner can read a chmod 000 directory (running as root), which would make the load-bearing arm vacuous. NOTHING about the uninstaller has been measured. Do not debug install.sh on the strength of this line."
          fi
          exit "$rc"

      # #566 -- ERR-06-STORE-AUTH-LEAK ASSERTED A CAUSE IT CANNOT ESTABLISH.
      # The probe was born BARE in v1.0.10, when a 401 really did mean a leaked
      # key had re-armed Qdrant auth. CM051 #1222 flipped store-auth
      # enforcement to default ON: the probe now CARRIES the credential, and
      # its comment went on describing the old one. A credentialed 401 means
      # "the authenticated request did not succeed" -- several causes, one of
      # which is a leak -- and the message picked that one, stated it as fact,
      # and told the customer to clear a credential MEASURED on the failing box
      # to be correct and complete.
      #
      # ⚠️ THIS DOES NOT FIX THE ABORT. Fresh installs still fail here and the
      # cause is OPEN: a readiness/auth race was proposed and then REFUTED by
      # measurement, warm and cold, delta 0.00s both times with live controls.
      # What this guards is that the installer stops telling the customer
      # something it does not know.
      #
      # The arms are structural, not spelling: the probe must carry the
      # credential; the comment must not contradict that; and the message must
      # not REASSERT the specific false claim that shipped. It forbids the old
      # sentence rather than pinning a new one, so the copy can be reworded
      # freely -- the lie just cannot come back.
      #
      # `if: always()` for the same reason as every step above.
      - name: Assert ERR-06 states what it measured, not a cause it cannot establish
        if: always()
        run: |
          set -uo pipefail
          rc=0
          bash tests/test_err06_states_what_it_measured.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The #566 harness could not obtain a verdict -- its anchors moved, or its runtime-synthesised line-spanning control could not be built or proved. NOTHING about the ERR-06 guard has been measured. Do not debug install.sh on the strength of this line."
          fi
          exit "$rc"

      # #566, THE OTHER HALF: the guard's HONESTY was the step above; this is
      # its FAILURE POSTURE. The readiness loop used `curl /readyz || curl
      # <credentialed> /collections`, and /readyz answers 200 with no
      # credential (measured independently by @A2 on the pinned image), so the
      # credentialed arm was DEAD CODE and readiness was decided by a surface
      # that cannot observe an auth failure. A store that 401s was therefore
      # declared ready and then killed, while a store that never arrived at
      # all was survivable.
      #
      # rc=2 is CANNOT-RUN per #1239 and is annotated, never silently passed.
      # ⚠️ STEP NAME DELIBERATELY AVOIDS TWO ADJACENT CAPITALISED TOKENS.
      # The first draft put the store's product name straight after "Assert",
      # and pii-name-guard flagged the pair -- two capitalised words in a row
      # have the shape of a person's name. FALSE POSITIVE, and the fix is to
      # rename MY step rather than widen the guard's cast: the cast is the
      # cast, not a record of what happens to be in the tree.
      # ⛔ AND DO NOT QUOTE THE OFFENDING PAIR IN THIS COMMENT TO EXPLAIN IT.
      # I did exactly that on the first attempt and the scanner still scored
      # 1, because a scanner reads prose about the string the same as the
      # string. Describe it; never spell it.
      - name: Assert the readiness probe tests the authenticated surface
        if: always()
        run: |
          set -uo pipefail
          rc=0
          bash tests/test_qdrant_readiness_tests_the_authenticated_surface.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The readiness-surface harness could not obtain a verdict -- the '_qdrant_ready=false' anchor is missing or ambiguous, so the region under test could not be identified. NOTHING about the readiness loop has been measured, and in particular this is NOT evidence that the credentialed arm executes."
          fi
          exit "$rc"

      # v1061-D003 / reg#624: import must REFUSE an empty/unready store, not
      # discard 3810 people into a void under STEP_END status=ok. Drives the
      # lifted gate function against a stubbed store and asserts the refusal is
      # wired ahead of import_data.
      - name: The data import refuses an empty vector store, and the refusal is wired ahead of it
        if: always()
        run: bash tests/test_qdrant_import_gate_refuses_empty_store.sh

      # The ORDERING half of the same fault the step above gates by guard.
      # A real install log showed step 19 of 39 reaching the email-ingest
      # LaunchAgent while ProgramArguments[0] did not yet exist; the vendor
      # guard refused and named EX_CONFIG (78). The guard was right, the
      # ordering was the defect, and it exposed seven agents, not one. This
      # asserts the invariant directly: no agent is bootstrapped before its
      # ProgramArguments[0] is staged. It carries its own negative and
      # positive controls and exits 2 rather than 0 if either misbehaves,
      # so a checker that resolves nothing cannot print a green.
      #
      # `if: always()` for the same reason as every step above: an earlier
      # limb's failure must not delete this measurement.
      - name: Assert no LaunchAgent is bootstrapped before the daemon is staged
        if: always()
        run: python3 tests/test_launchagent_bootstrap_after_staging.py

      # THE SAME FILES, A DIFFERENT KEY, AND EVERY STEP ABOVE IS BLIND TO IT.
      # Measured on the Mini 2026-08-20 after a real power cycle:
      #
      #     colima  FATA  exec "limactl": executable file not found in $PATH
      #
      # launchd gives its jobs /usr/bin:/bin:/usr/sbin:/sbin unless the plist
      # sets EnvironmentVariables:PATH. The assistant owns `colima start`, its
      # plist set six env keys, and PATH was not one of them -- so Qdrant,
      # Oxigraph, Redis, Vane, wiki-site and store-proxy were all gone after
      # every reboot. 6 of 24 agents on the box carried a Homebrew-aware PATH
      # and both agents that broke that day were in the other 18: the technique
      # was known, used, and omitted, with nothing deciding which.
      #
      # The steps above assert paths do not resolve under /tmp. A plist can
      # satisfy every one of them and still be unable to find its own tooling.
      #
      # This is the SOURCE half. It cannot see a broken box -- a gate over
      # install.sh goes green while the machine in front of you has no Colima.
      # The box half is scripts/box_walk_probes/probes/
      # launchagents_resolve_their_tools.sh, which reads the INSTALLED plists
      # over ssh. This one stops the fix being reverted; that one stops it
      # being believed.
      #
      # `if: always()` for the same reason as every step above (CM051 #656).
      - name: Assert agents that shell out to Homebrew tooling can find it
        if: always()
        run: bash tests/test_launchagent_homebrew_path.sh

      # THE UNINSTALLER IS NOT THE ONLY THING THAT REMOVES A PLIST. Three
      # agents remove THEMSELVES, and on the v1.0.66 artefact at .240 one of
      # them had booted its label out of launchd and left both its plist and
      # its tries file on disk.
      #
      # Cause, measured with a 10-iteration fixture agent on that Mac: a
      # LaunchAgent that calls `launchctl bootout` on its OWN label reached the
      # line before the bootout 10/10 and the line after it 0/10. launchd tears
      # the job down before control returns, so the `rm -f` that followed was
      # unreachable. ~/Library/LaunchAgents is read again at every login, so
      # the surviving plist brought the "self-removed" agent back on every
      # reboot, with its old tries count beside it.
      #
      # The invariant is ORDER, not presence: both statements appear in the
      # broken form and the fixed one, so a gate grepping for either alone
      # passes on both trees. This one grades every remove_self body and pins
      # its negative control to the tree whose artefact left the plist behind.
      #
      # if: always() for the same reason as every other step here -- it is not
      # first, and a skipped step reads as no objection.
      - name: A self-removing agent deletes its plist BEFORE it boots itself out
        if: always()
        run: bash tests/test_a_self_removing_agent_deletes_its_plist_before_it_dies.sh
