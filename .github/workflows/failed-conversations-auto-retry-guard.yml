# CM051 v1.0.107 #11: a failed conversation is retried automatically, on a
# backoff, capped, and its raw data is never deleted; the manual retry no
# longer crashes on the dispatcher's failed_step. Mirrors CM041 (ical-server
# retry sweeper) and CM048 (resume guard). A new test that no workflow runs
# is not wired, so this runs both.
name: failed-conversations-auto-retry-guard

on:
  push:
    branches: [main]
    paths:
      - 'vendor/cm041/assistant_api/ical-server.py'
      - 'vendor/cm041/assistant_api/tests/test_failed_conversation_auto_retry.py'
      - 'vendor/cm048_pipeline/src/processor.py'
      - 'vendor/cm048_pipeline/src/schemas.py'
      - 'tests/test_cm048_resume_after_dispatcher_failure.py'
      - 'tests/test_vendored_conversation_process_failure_reason.py'
      - '.github/workflows/failed-conversations-auto-retry-guard.yml'
  pull_request:
    paths:
      - 'vendor/cm041/assistant_api/ical-server.py'
      - 'vendor/cm041/assistant_api/tests/test_failed_conversation_auto_retry.py'
      - 'vendor/cm048_pipeline/src/processor.py'
      - 'vendor/cm048_pipeline/src/schemas.py'
      - 'tests/test_cm048_resume_after_dispatcher_failure.py'
      - 'tests/test_vendored_conversation_process_failure_reason.py'
      - '.github/workflows/failed-conversations-auto-retry-guard.yml'

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  auto-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest and the CM048 runtime dependencies
        run: python -m pip install --quiet pytest httpx pyyaml phonenumbers
      # ANTI-VACUITY AND THE RUN ARE ONE STEP ON PURPOSE: a failing floor in
      # a separate step would SKIP the run below and hide the real result.
      - name: The retry sweeper, the cap, the dispatch-failure keep, the resume guard
        run: |
          n="$(python -m pytest \
                 vendor/cm041/assistant_api/tests/test_failed_conversation_auto_retry.py \
                 tests/test_cm048_resume_after_dispatcher_failure.py \
                 tests/test_vendored_conversation_process_failure_reason.py \
                 --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 21 ]; then
            echo "REFUSING: expected at least 21 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          rc=0
          python -m pytest vendor/cm041/assistant_api/tests/test_failed_conversation_auto_retry.py -v || rc=1
          python -m pytest tests/test_cm048_resume_after_dispatcher_failure.py -v || rc=1
          python -m pytest tests/test_vendored_conversation_process_failure_reason.py -v || rc=1
          exit "$rc"
