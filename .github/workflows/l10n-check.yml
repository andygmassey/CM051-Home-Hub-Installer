name: l10n-check

# OFFLINE translation gate. No secrets, no network, no API calls: safe on fork PRs.
#   BLOCKING: placeholder/specifier parity, verbatim answer tokens, catalogue
#             validity (bash -n, JSON shape), keep-English lines, and no
#             translation whose English changed since it was made (stale).
#   NON-BLOCKING: the per-language coverage table printed by `check`.
# A MISSING translation fails the completeness step (l10n/test_translation_complete.py).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  l10n-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: the gate can fail (dropped %@, lost INSTALL, changed English -> stale)
        run: python3 -I l10n/ostler_l10n.py self-test
      - name: translations are drop-in for their English
        run: python3 -I l10n/ostler_l10n.py check
      # Coverage above never blocks; this does (L10N audit 2026-11-04). A
      # non-legal key absent in a shipped language, or English prose left in
      # a translation, fails, after the gate's two negative controls prove it can.
      - name: every shipped language is complete (legal wording exempt)
        if: always()
        run: python3 -I l10n/test_translation_complete.py
      - name: a legal or consent translation ships only when reviewed, English prevailing (owner ruling 2026-10-24)
        run: PYTHONSAFEPATH=1 PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 python3 tests/test_l10n_legal_ships_only_when_reviewed.py
      - name: every legal or consent prompt shows the English-prevails line when localised
        if: always()
        run: PYTHONSAFEPATH=1 PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 python3 tests/test_legal_prevails_note_on_every_legal_prompt.py
      - name: the consent record's legal/plain rule matches l10n/config.yaml and records locale plus every line's src_hash (owner ruling 2026-11-04)
        if: always()
        run: PYTHONSAFEPATH=1 PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 python3 tests/test_consent_display_legal_rule_matches_l10n.py
      - name: a typed consent token (INSTALL / CANCEL) is shown verbatim in every locale
        if: always()
        run: PYTHONSAFEPATH=1 PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 python3 tests/test_typed_consent_token_is_verbatim_in_every_locale.py
      - name: the consent copy promises no cloud routing (none exists) in any locale, and the terms link is ostler.ai/terms (v1.0.124)
        if: always()
        run: PYTHONSAFEPATH=1 PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 python3 tests/test_consent_promises_no_cloud_routing.py
      - name: every line drawn in the legal style (smaller and lighter) is classed legal (owner ruling 2026-11-04)
        if: always()
        run: PYTHONSAFEPATH=1 PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 python3 tests/test_legal_style_lines_are_legal_keys.py
