name: l10n-check

# OFFLINE translation gate. No secrets, no network, no API calls: safe on fork PRs.
#   BLOCKING: placeholder/specifier parity, verbatim answer tokens, catalogue
#             validity (bash -n, JSON shape), keep-English lines, and no
#             translation whose English changed since it was made (stale).
#   NON-BLOCKING: the per-language coverage table printed by `check`.
# A MISSING translation never fails this: every catalogue falls back to English.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  l10n-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: the gate can fail (dropped %@, lost INSTALL, changed English -> stale)
        run: python3 -I l10n/ostler_l10n.py self-test
      - name: translations are drop-in for their English
        run: python3 -I l10n/ostler_l10n.py check
      - name: a legal or consent translation ships only when reviewed, English prevailing (owner ruling 2026-10-24)
        run: PYTHONSAFEPATH=1 PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 python3 tests/test_l10n_legal_ships_only_when_reviewed.py
      - name: every legal or consent prompt shows the English-prevails line when localised
        if: always()
        run: PYTHONSAFEPATH=1 PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 python3 tests/test_legal_prevails_note_on_every_legal_prompt.py
