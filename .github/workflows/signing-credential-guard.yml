# The cut's credential guard must check ALL FIVE signing secrets, not one.
#
# WHY THIS WORKFLOW EXISTS SEPARATELY FROM cut.yml. The guard test is also
# wired into cut.yml's preflight, but cut.yml is TAG-TRIGGERED ONLY -- by
# design, so nothing can cut from a PR. That means a regression in the guard
# would first be observed at cut time, on a tag, which is the worst possible
# moment to discover that the thing meant to fail closed no longer does.
#
# So the same test runs here on pull_request too. Two call sites, one test
# file, and the cut-time one stays because it is the last line of defence.
#
# This is the sibling of the finding logged the same day in HR015: a gate that
# only runs somewhere you rarely go is a gate you find out about late.

name: signing-credential-guard

on:
  push:
    branches: [main]
    paths:
      - 'bin/require_signing_secrets.sh'
      - 'tests/test_signing_credential_guard.sh'
      - '.github/workflows/cut.yml'
      - '.github/workflows/signing-credential-guard.yml'
  pull_request:
    paths:
      - 'bin/require_signing_secrets.sh'
      - 'tests/test_signing_credential_guard.sh'
      - '.github/workflows/cut.yml'
      - '.github/workflows/signing-credential-guard.yml'

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  signing-credential-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Placeholder values only. The real secrets are not available to this
      # job and are not needed: the guard tests emptiness, never content.
      - name: The credential guard checks all five, and says which are missing
        run: bash tests/test_signing_credential_guard.sh
