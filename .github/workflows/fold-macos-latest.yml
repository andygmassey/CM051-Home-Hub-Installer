concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# Read-only. No folded member uses the token (checked at generate);
# the selector reads the PR's changed-file list with it.
permissions:
  contents: read
  pull-requests: read

jobs:
  macos-latest:
    runs-on: macos-latest
    # Sum of the folded jobs' own timeouts (308 min), capped at 70 so the
    # CI Required Gate (75 min hard cap) still sees a verdict. Every step below
    # keeps its old job's timeout, so a hang is bounded where it always was.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          # A member checked out full history; the family does for all.
          fetch-depth: 0
      # The runner's own python3, which each block's venv is built from (with
      # its system site-packages), so every block starts from what a fresh
      # machine gave it and installs into its own venv.
      - id: python
        name: The runner's python3, the base of every block's venv
        run: echo "python-path=$(command -v python3)" >> "$GITHUB_OUTPUT"
      - name: Pin the pip cache to the real HOME before blocks move it
        run: echo "PIP_CACHE_DIR=$HOME/.cache/pip" >> "$GITHUB_ENV"
      # Each block runs only if the PR changes a file its OWN old workflow watched
      # (.github/ci-fold-paths.tsv), so the family does the work the old jobs did, no more.
      # FAILS OPEN: a push, an API error, an empty or capped file list, or a glob
      # form it cannot model exactly runs the block. Skipping is the only outcome
      # that needs evidence.
      - id: select
        name: Which blocks this change can affect (fails open)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python3 scripts/ci_fold.py select macos-latest

      # ========================================================================
      # b01: cannot-run-branch-reachable.yml :: gate
      # ========================================================================
      - id: b01_isolate
        name: "[b01] cannot-run-branch-reachable.yml :: gate -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b01 != 'false' && matrix.shard == 3 }}
        env:
          PY: ${{ steps.python.outputs.python-path }}
          BLOCK: ${{ runner.temp }}/ci-fold/b01
        run: |
          set -eu
          # A fresh machine also had no processes left over from another job.
          # Every step after an isolate step carries CI_FOLD_BLOCK=<its tag>
          # (via GITHUB_ENV), and a process inherits it even once orphaned, so
          # anything an earlier block left running still carries it. Kill exactly
          # those: nothing else on the machine carries the marker.
          cf="$RUNNER_TEMP/ci-fold"
          mkdir -p "$cf"
          me=$$
          ps -A -o pid=,ppid= > "$cf/procs" || true
          # ONE read of every process's environment, not one per process: on
          # macOS a ps per process cost 2 to 5 s per block (measured, PR #2962).
          if [ -d /proc/self ]; then
            grep -lzsa '^CI_FOLD_BLOCK=' /proc/[0-9]*/environ > "$cf/marked.raw" || true
            sed -n 's|^/proc/\([0-9]*\)/environ$|\1|p' "$cf/marked.raw" > "$cf/marked"
          else
            ps eww -A -o pid=,command= > "$cf/marked.raw"
            awk '/CI_FOLD_BLOCK=/ {print $1}' "$cf/marked.raw" > "$cf/marked"
          fi
          marked=" $(tr '\n' ' ' < "$cf/marked") "
          while read -r pid ppid; do
            if [ "$pid" = "$me" ] || [ "$ppid" = "$me" ]; then continue; fi
            case "$marked" in *" $pid "*) ;; *) continue ;; esac
            kill -KILL "$pid" 2>/dev/null || true
          done < "$cf/procs"
          echo "CI_FOLD_BLOCK=b01" >> "$GITHUB_ENV"
          git -C "$GITHUB_WORKSPACE" reset --hard -q HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          rm -rf "$BLOCK"
          mkdir -p "$BLOCK/home" "$BLOCK/tmp"
          "$PY" -m venv --system-site-packages "$BLOCK/venv"
          echo "$BLOCK/venv/bin" >> "$GITHUB_PATH"
          {
            echo "HOME=$BLOCK/home"
            echo "TMPDIR=$BLOCK/tmp"
            echo "VIRTUAL_ENV=$BLOCK/venv"
          } >> "$GITHUB_ENV"
      - id: b01_s01
        if: ${{ steps.select.outputs.b01 != 'false' && matrix.shard == 3 && !cancelled() && steps.b01_isolate.conclusion != 'failure' }}
        timeout-minutes: 30
        name: Environment, so a failure is attributable
        run: |
          /bin/bash --version | head -1
          python3 --version
      # macos-latest python3 has NO PyYAML -- measured here on the first run of
      # this workflow, `ModuleNotFoundError: No module named 'yaml'` on Python
      # 3.14.7. Without this the whole gate is CANNOT-RUN, and a gate that
      # cannot run is not a gate. Same install ladder as appcast-ship-wiring,
      # which carries the same note.
      #
      # The import is PROVED AFTER the install, with no `|| true` on the proof:
      # a `|| true` there would reproduce the exact defect this workflow exists
      # to catch, one layer up.
      - id: b01_s02
        if: ${{ steps.select.outputs.b01 != 'false' && matrix.shard == 3 && !cancelled() && steps.b01_isolate.conclusion != 'failure' && steps.b01_s01.conclusion != 'failure' }}
        timeout-minutes: 30
        name: PyYAML must be present, or nothing can be parsed
        run: |
          set -uo pipefail
          if ! python3 -c 'import yaml' 2>/dev/null; then
            python3 -m pip install --quiet --break-system-packages --ignore-installed pyyaml \
              || python3 -m pip install --quiet --ignore-installed pyyaml \
              || pip3 install --quiet pyyaml \
              || true
          fi
          python3 -c 'import yaml, sys; sys.stdout.write("PyYAML %s on %s\n" % (yaml.__version__, sys.version.split()[0]))'
      - id: b01_s03
        if: ${{ steps.select.outputs.b01 != 'false' && matrix.shard == 3 && !cancelled() && steps.b01_isolate.conclusion != 'failure' && steps.b01_s01.conclusion != 'failure' && steps.b01_s02.conclusion != 'failure' }}
        timeout-minutes: 30
        name: Every $? capture must be reachable under its step's own shell
        run: |
          # ⚠️ `|| rc=$?` -- this gate must not carry the defect it hunts.
          set -uo pipefail
          rc=0
          /bin/bash tests/test_cannot_run_branch_is_reachable.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The reachability harness could not run -- most likely PyYAML is absent, so NO workflow was parsed. Nothing was measured; this is not a pass."
          fi
          exit "$rc"

      # ========================================================================
      # b02: consent-contract.yml :: autologin-consent-opt-in
      # ========================================================================
      # Two consent tests passed and ran nowhere, and the wiring manifest said WIRED.
      #
      # They were scored WIRED because verify_test_wiring.sh substring-searched whole
      # workflow bodies, comments included, so a test counted as wired if anything
      # merely NAMED it. Neither of these appears in any workflow's run steps. Both
      # pass. Both cover the consent ceremony, which is the part of the installer a
      # customer is legally and reputationally most exposed by.
      #
      # Measured 2026-08-15 after teaching that gate to ignore comment lines:
      #   consent A7+A8 assertions      rc=0  8/8 pass
      #   third-party data consent      rc=0  all pass
      #
      # Wired here so the claim in the manifest becomes true.
      # SEPARATE JOB, ON macOS, ON PURPOSE. This one does not merely grep the
      # consent copy -- it EXTRACTS the auto-login consent gate from install.sh and
      # EXECUTES it, so the shell it runs under has to be the shell install.sh
      # ships under. That is /bin/bash 3.2.57 on the customer's Mac, not the
      # bash 5.x on ubuntu-latest. A proof of a shell decision that runs under a
      # different shell from the artefact is not a proof of the artefact.
      # (Same reasoning as test-wiring.yml's `runs-on: macos-latest`.)
      - id: b02_isolate
        name: "[b02] consent-contract.yml :: autologin-consent-opt-in -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b02 != 'false' && matrix.shard == 3 }}
        env:
          PY: ${{ steps.python.outputs.python-path }}
          BLOCK: ${{ runner.temp }}/ci-fold/b02
        run: |
          set -eu
          # A fresh machine also had no processes left over from another job.
          # Every step after an isolate step carries CI_FOLD_BLOCK=<its tag>
          # (via GITHUB_ENV), and a process inherits it even once orphaned, so
          # anything an earlier block left running still carries it. Kill exactly
          # those: nothing else on the machine carries the marker.
          cf="$RUNNER_TEMP/ci-fold"
          mkdir -p "$cf"
          me=$$
          ps -A -o pid=,ppid= > "$cf/procs" || true
          # ONE read of every process's environment, not one per process: on
          # macOS a ps per process cost 2 to 5 s per block (measured, PR #2962).
          if [ -d /proc/self ]; then
            grep -lzsa '^CI_FOLD_BLOCK=' /proc/[0-9]*/environ > "$cf/marked.raw" || true
            sed -n 's|^/proc/\([0-9]*\)/environ$|\1|p' "$cf/marked.raw" > "$cf/marked"
          else
            ps eww -A -o pid=,command= > "$cf/marked.raw"
            awk '/CI_FOLD_BLOCK=/ {print $1}' "$cf/marked.raw" > "$cf/marked"
          fi
          marked=" $(tr '\n' ' ' < "$cf/marked") "
          while read -r pid ppid; do
            if [ "$pid" = "$me" ] || [ "$ppid" = "$me" ]; then continue; fi
            case "$marked" in *" $pid "*) ;; *) continue ;; esac
            kill -KILL "$pid" 2>/dev/null || true
          done < "$cf/procs"
          echo "CI_FOLD_BLOCK=b02" >> "$GITHUB_ENV"
          git -C "$GITHUB_WORKSPACE" reset --hard -q HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          rm -rf "$BLOCK"
          mkdir -p "$BLOCK/home" "$BLOCK/tmp"
          "$PY" -m venv --system-site-packages "$BLOCK/venv"
          echo "$BLOCK/venv/bin" >> "$GITHUB_PATH"
          {
            echo "HOME=$BLOCK/home"
            echo "TMPDIR=$BLOCK/tmp"
            echo "VIRTUAL_ENV=$BLOCK/venv"
          } >> "$GITHUB_ENV"
      - id: b02_s01
        if: ${{ steps.select.outputs.b02 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: bash on this runner is the shipped 3.2 (control for the step below)
        run: /bin/bash --version | head -1
      - id: b02_s02
        if: ${{ steps.select.outputs.b02 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: auto-login consent is opt-in and its copy does not overclaim
        run: /bin/bash tests/test_autologin_consent_opt_in.sh
      # SAME JOB, SAME REASON. This one extracts the RemoteCapture phase out of
      # install.sh and EXECUTES it under three consent answers, so it has to run
      # under the shell the artefact ships under.
      #
      # `|| rc=$?`, not a bare call: the step shell is `/bin/bash -e {0}`, so a
      # bare fallible call exits before rc is captured and the CANNOT-RUN branch
      # becomes unreachable code -- the class cannot-run-branch-reachable exists
      # to catch. A harness that could not read the phase has measured NOTHING
      # about it, and that is not a pass.
      - id: b02_s03
        if: ${{ steps.select.outputs.b02 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: a declined recording consent stops the capture companion being installed
        run: |
          set -uo pipefail
          rc=0
          /bin/bash tests/test_recording_consent_gates_the_capture_companion.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The RemoteCapture phase could not be extracted from install.sh, so NOTHING was measured about whether a declined recording consent stops it. This is not a pass."
          fi
          exit "$rc"

      # ========================================================================
      # b03: cut-gate-wrappers.yml :: cut-gate-wrappers
      # ========================================================================
      - id: b03_isolate
        name: "[b03] cut-gate-wrappers.yml :: cut-gate-wrappers -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b03 != 'false' && matrix.shard == 2 }}
        env:
          PY: ${{ steps.python.outputs.python-path }}
          BLOCK: ${{ runner.temp }}/ci-fold/b03
        run: |
          set -eu
          # A fresh machine also had no processes left over from another job.
          # Every step after an isolate step carries CI_FOLD_BLOCK=<its tag>
          # (via GITHUB_ENV), and a process inherits it even once orphaned, so
          # anything an earlier block left running still carries it. Kill exactly
          # those: nothing else on the machine carries the marker.
          cf="$RUNNER_TEMP/ci-fold"
          mkdir -p "$cf"
          me=$$
          ps -A -o pid=,ppid= > "$cf/procs" || true
          # ONE read of every process's environment, not one per process: on
          # macOS a ps per process cost 2 to 5 s per block (measured, PR #2962).
          if [ -d /proc/self ]; then
            grep -lzsa '^CI_FOLD_BLOCK=' /proc/[0-9]*/environ > "$cf/marked.raw" || true
            sed -n 's|^/proc/\([0-9]*\)/environ$|\1|p' "$cf/marked.raw" > "$cf/marked"
          else
            ps eww -A -o pid=,command= > "$cf/marked.raw"
            awk '/CI_FOLD_BLOCK=/ {print $1}' "$cf/marked.raw" > "$cf/marked"
          fi
          marked=" $(tr '\n' ' ' < "$cf/marked") "
          while read -r pid ppid; do
            if [ "$pid" = "$me" ] || [ "$ppid" = "$me" ]; then continue; fi
            case "$marked" in *" $pid "*) ;; *) continue ;; esac
            kill -KILL "$pid" 2>/dev/null || true
          done < "$cf/procs"
          echo "CI_FOLD_BLOCK=b03" >> "$GITHUB_ENV"
          git -C "$GITHUB_WORKSPACE" reset --hard -q HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          rm -rf "$BLOCK"
          mkdir -p "$BLOCK/home" "$BLOCK/tmp"
          "$PY" -m venv --system-site-packages "$BLOCK/venv"
          echo "$BLOCK/venv/bin" >> "$GITHUB_PATH"
          {
            echo "HOME=$BLOCK/home"
            echo "TMPDIR=$BLOCK/tmp"
            echo "VIRTUAL_ENV=$BLOCK/venv"
          } >> "$GITHUB_ENV"
      - id: b03_s01
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && !cancelled() && steps.b03_isolate.conclusion != 'failure' }}
        timeout-minutes: 30
        name: Ensure origin/main is present for the pre-fix comparison
        run: git fetch origin main --quiet || true
      - id: b03_s02
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && !cancelled() && steps.b03_isolate.conclusion != 'failure' && steps.b03_s01.conclusion != 'failure' }}
        timeout-minutes: 30
        name: Wrapper trichotomy self-test (stubbed gate scripts)
        run: /bin/bash tests/test_cut_gate_wrappers.sh
      # THE OTHER WRAPPER. run() must not report a gate that died as a pass.
      #
      # /bin/bash DELIBERATELY, not `bash`. This is the shape the defect had:
      # verify_must_contain.sh was green under Homebrew bash 5 on a developer's
      # PATH and dead under /bin/bash 3.2.57, which is what the cut host and
      # every customer Mac actually run. Testing it under 5 would reproduce the
      # accident that hid it.
      #
      # The suite prefers the REAL pre-fix gate out of `git show
      # origin/main:scripts/verify_must_contain.sh` as its specimen and falls
      # back to a synthetic one only where history is unavailable -- and once
      # this branch merges, origin/main carries the FIXED file, so the fallback
      # is the steady state. It PRINTS which specimen it used; a green here is
      # never silently the weaker claim.
      #
      # Exit 2 is CANNOT-RUN (the predicate was renamed or removed) and fails
      # this step, deliberately. A gate whose self-test can no longer find it
      # is not a gate that passed.
      # The operator's pre-tag rollforward step is the one environment where the
      # gate BODIES run, and it had no runbook, so it had never run. This test
      # asserts the runner refuses a half-built environment rather than
      # producing a summary line that reads like "found nothing".
      - id: b03_s03
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: The operator rollforward runner refuses a blind environment
        run: /bin/bash tests/test_the_operator_rollforward_refuses_a_blind_environment.sh
      # THE DISPATCH GATE, ON A PR, FOR THE FIRST TIME.
      #
      # Its control 14 runs the checker against this repo's REAL cut.yml, so a
      # change that reopens the publish route, or that moves the contract
      # without moving the enforcer, fails here instead of in preflight on a
      # tag. That is the whole difference between a version number spent and a
      # PR turned red.
      #
      # /bin/bash deliberately: the cut host is macOS and ships bash 3.2, and
      # this suite drives python mutations whose quoting differs under 5.
      #
      # if: always() so an earlier red in this job cannot mask it.
      - id: b03_s04
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: The dispatch relaxation is tied to the no-publish property
        # always() because a gate its own job can switch off is not a gate.
        # Without this the step is SKIPPED when an earlier test in the same
        # job fails, and this one exists to hold a RELAXED cut gate: the one
        # run where other things are already red is exactly the run where it
        # most needs to speak. ci-maskless caught the omission.
        run: /bin/bash tests/test_the_dispatch_relaxation_is_tied_to_no_publish.sh
      - id: b03_s05
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: A workflow_dispatch cannot publish
        run: /bin/bash tests/test_cut_dispatch_is_dry.sh
      # v1.0.103's one tag push was refused at preflight because nothing ran the
      # ship-mode checklist before the tag existed. push_cut_tag.sh runs it first.
      - id: b03_s06
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: A cut tag is not pushed while the tag-time checklist is red
        run: /bin/bash tests/test_push_cut_tag_refuses_a_red_checklist.sh
      # THE OTHER HALF OF THE SAME QUESTION, AND IT IS NOT THE SAME TEST.
      # The suite above asks whether a dispatch can SHIP. This one asks whether
      # a dispatch can RUN AT ALL: arm 3 walks the dry-run job's transitive
      # `needs` closure and requires every job in it to admit a dispatch, and
      # arm 4 requires that no step in that closure reads the tag
      # unconditionally, because a dispatch has no tag to read.
      #
      # if: always() so an earlier red in this job cannot mask it.
      # PyYAML FIRST, OR THE STEP BELOW CANNOT PARSE cut.yml AT ALL.
      #
      # This job runs on macos-latest, whose python3 has no PyYAML, and the test
      # correctly exits 2 CANNOT-RUN rather than pretending it looked. Measured
      # on this PR's first run: "CANNOT-RUN  PyYAML is not importable, so
      # cut.yml could not be parsed", exit 2. That is the right behaviour from
      # the test and the wrong environment from the job.
      #
      # Same remedy and same wording as appcast-ship-wiring.yml, which learned
      # this the expensive way: an assertion there was dark on EVERY run from
      # the day it was written because of this exact gap, while the summary
      # still printed that all four assertions held.
      #
      # THE VERIFY LINE IS NOT DECORATION. An install that quietly does nothing
      # reproduces the same defect one layer up, so the import is proved AFTER
      # the install and the step dies if it is still missing. No `|| true` on
      # the verify.
      - id: b03_s07
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: PyYAML must be present, or the dry-run check cannot parse cut.yml
        run: |
          set -uo pipefail
          if ! python3 -c 'import yaml' 2>/dev/null; then
            python3 -m pip install --quiet --break-system-packages --ignore-installed pyyaml \
              || python3 -m pip install --quiet --ignore-installed pyyaml \
              || pip3 install --quiet pyyaml \
              || true
          fi
          python3 -c 'import yaml, sys; sys.stdout.write("PyYAML %s on %s\n" % (yaml.__version__, sys.version.split()[0]))'
      # After the PyYAML step: this test parses cut.yml. Placed before it, the
      # first run crashed on import and the mutant arms read the crash as caught.
      - id: b03_s08
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: A tag rehearsal runs the tag preflight and builds nothing
        run: /bin/bash tests/test_rehearse_tag_is_the_tag_preflight.sh
      - id: b03_s09
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: The dry run is structurally reachable on a dispatch
        run: python3 tests/test_the_dry_run_is_reachable_on_a_dispatch.py
      # Wired 2026-09-06 (#1694). See the paths note above: three gate
      # self-tests that ran nowhere. Each proves its gate REJECTS a violation,
      # not merely that it compiles -- the distinction this repo learned the
      # expensive way.
      - id: b03_s10
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: The commit-parity gate FIRES
        # if: always() -- ci-maskless (#1695): without it a red earlier in the
        # same job SKIPS this step, and a skipped test reports nothing at all.
        run: /bin/bash scripts/tests/test_verify_commit_parity_gate.sh
      - id: b03_s11
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: The stapling gate FIRES and is not a no-op
        # if: always() -- ci-maskless (#1695): without it a red earlier in the
        # same job SKIPS this step, and a skipped test reports nothing at all.
        run: /bin/bash scripts/tests/test_verify_stapling_gate.sh
      - id: b03_s12
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: A bundle name with a space survives the staple loops (v1.0.99)
        # The cut that died: staple-apps iterated `for app in $NESTED_APPS`,
        # which splits on IFS, so "Recover Ostler.app" (added by #1970) became
        # two paths that do not exist. Both were reported as "no ticket issued
        # for this CDHash" and then as "ticket missing after staple", and the
        # bundle that needed the ticket was never named. The dry run cannot
        # reach this code: it does not build, sign or staple.
        # if: always() -- ci-maskless (#1695): without it a red earlier in the
        # same job SKIPS this step, and a skipped test reports nothing at all.
        run: /bin/bash tests/test_a_bundle_name_with_a_space_survives_the_staple_loops.sh
      - id: b03_s13
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: The cross-language trust-anchor guard FIRES, on the right axis
        # if: always() -- ci-maskless (#1695): without it a red earlier in the
        # same job SKIPS this step, and a skipped test reports nothing at all.
        run: /bin/bash scripts/tests/test_no_env_trust_anchors.sh
      - id: b03_s14
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: run() cannot report a gate that died as a pass
        run: /bin/bash tests/test_a_gate_that_exits_zero_after_dying_is_not_a_pass.sh
      # #1167. The gate's own --self-test proves it can discriminate and runs in
      # declared-gates-reachable.yml. This proves it is ASKED, on the cut, and
      # can answer when it is: invoked by cut.yml, if: always(), GH_TOKEN
      # passed, and the job granted `actions: read`.
      #
      # That last one is the reason this exists as a separate file. The first
      # v1.0.43 tag was refused by verify_tagged_commit_is_green.sh because an
      # explicit `permissions:` block sets every UNLISTED scope to none and it
      # had no `checks: read`. The new gate reads the ACTIONS namespace, which
      # `checks: read` does not cover -- the identical defect, one scope over,
      # and it would have failed closed on every cut forever.
      # 🔴 PyYAML IS NOT ON THE RUNNER BY DEFAULT, AND THE TEST REFUSES WITHOUT
      # IT. Measured on this very PR: the step below exited 2 "CANNOT-RUN: no
      # PyYAML; a regex over YAML is not a parse". That refusal is correct --
      # the permissions question CANNOT be answered by text, because an absent
      # scope and a scope set to none read differently and mean the same thing
      # -- but a gate that reports CANNOT-RUN on every run is a gate nobody
      # reads, which is the #1167 shape wearing a different hat.
      #
      # THE VERIFY LINE IS NOT DECORATION. An install that quietly does nothing
      # reproduces the same defect one layer up, so the import is proved AFTER
      # the install and the step dies if it is still missing. No `|| true` on
      # the verification.
      - id: b03_s15
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: PyYAML must be present, or the wiring assertion cannot run
        run: |
          set -uo pipefail
          if ! python3 -c 'import yaml' 2>/dev/null; then
            python3 -m pip install --quiet --break-system-packages --ignore-installed pyyaml \
              || python3 -m pip install --quiet --ignore-installed pyyaml \
              || pip3 install --quiet pyyaml \
              || true
          fi
          python3 -c 'import yaml, sys; sys.stdout.write("PyYAML %s on %s\n" % (yaml.__version__, sys.version.split()[0]))'
      - id: b03_s16
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: The run-at-commit gate is wired into the cut and can answer
        run: /bin/bash tests/test_the_run_at_commit_gate_is_wired_into_the_cut.sh
      - id: b03_s17
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: Test parses under /bin/bash 3.2 (the cut host's shell)
        run: |
          /bin/bash --version | head -1
          /bin/bash -n tests/test_cut_gate_wrappers.sh
          /bin/bash -n tests/test_pr_age_gate_declares_partial_runs.sh
          echo "OK: parses under the shell the cut actually uses"
      # THE WRAPPER IS HONEST ABOUT rc; THE GATE WAS NOT HONEST ABOUT SCOPE.
      #
      # The steps above prove verify_pr_age.sh's WRAPPER distinguishes
      # cannot-run from fail. That says nothing about whether the gate looked
      # at the estate it claims to police. It did not: on a hosted runner
      # GH_TOKEN is the repo-scoped secrets.GITHUB_TOKEN, every sibling repo's
      # `gh pr list` fails, and one reachable repo is enough to exit 0.
      #
      # Measured 2026-08-20, one tree, one hour:
      #     7 repos reachable -> 17 over 48h, rc=1
      #     CM051 only        ->  0 over 48h, rc=0
      #
      # if: always() because this is not the first step -- a failure above must
      # not skip it. A skipped check reads as no objection.
      - id: b03_s18
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: The PR-age gate declares the repos it could NOT check
        run: /bin/bash tests/test_pr_age_gate_declares_partial_runs.sh
      - id: b03_s19
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: Every wrapper still HAS a cannot-run branch
        run: |
          set -e
          # Structural backstop for the case the self-test cannot see: someone
          # deletes a whole target, so its controls never run and the suite is
          # green because it asked nothing.
          #
          # COUNT THE BRANCH, NOT THE SENTENCE. The first version of this step
          # grepped for the prose 'COULD NOT RUN (exit'. When check-freshness
          # was added as the seventh with slightly different wording -- "COULD
          # NOT RUN for at least one input (exit ...)" -- the count stayed at 6
          # and this guard was blind to the wrapper it was supposed to be
          # counting. It even made a REVERT look like it had applied when the
          # number did not move, which nearly turned a demonstrated red into a
          # meaningless one. Same trap as the cut-freshness.yml grep this PR
          # removes: a predicate tied to a rendering, not to the behaviour.
          #
          # The rc-2-or-3 test is the behaviour. Prose can be reworded freely.
          n=$(grep -c 'rc" -eq 2 \] || \[ "\$\$rc" -eq 3' gui/Makefile || true)
          if [ "$n" -ne 7 ]; then
            echo "expected 7 cannot-run branches in gui/Makefile, found $n" >&2
            echo "a wrapper has lost its exit-2/3 branch, or one was added without a test" >&2
            exit 1
          fi
          echo "OK: 7 cannot-run branches present"
      # sign-python-bundle used to swallow codesign's stderr, so run
      # 31692208160 could say WHICH files failed and never why. This drives the
      # script with a stubbed codesign through four modes and asserts the
      # reason reaches the log, that a real fault is not retried, and that a
      # persistent timestamp failure is bounded and still fails closed.
      - id: b03_s20
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: sign-python-bundle reports WHY it failed
        run: bash tests/test_sign_python_bundle_reports_why.sh
      # The seed's own exclusion regex swallowed the tree it was meant to seed.
      # compileall matches -x with rx.search(FULLNAME), so a bare `\.app/`
      # matched the OUTER bundle and compiled NOTHING at rc=0. It failed closed
      # -- the bundle audit refuses to sign -- but the cut stops with an error
      # describing the symptom in a different compartment from the cause.
      # This reads the regex OUT of the script, so it cannot drift.
      - id: b03_s21
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: the product seed actually seeds the product tree
        run: bash tests/test_product_seed_regex_does_not_exclude_the_bundle.sh
      # The tag check is the difference between a seed and a decoration: a .pyc
      # named cpython-314 is invisible to the 3.11 that ships, so it would be
      # regenerated INTO the seal while compileall, the file count and the exit
      # code all reported success. Shim tarballs, so this costs nothing in CI.
      - id: b03_s22
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: the hub payload seed refuses a wrong interpreter
        run: bash tests/test_hub_payload_seed_refuses_a_wrong_interpreter.sh
