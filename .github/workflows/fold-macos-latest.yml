        run: |
          rc=0
          /bin/bash scripts/box_walk_probes/probes/people_stores_reconcile.sh --self-test || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "BROKEN: the probe --self-test returned $rc, not 1." >&2
            echo "PHASE 1 of the box walk would mark this probe BROKEN and measure nothing." >&2
            exit 1
          fi
          echo "OK: the negative control fires as the walk runner requires (returned 1)."

      # ========================================================================
      # b14: launchagent-success-verification.yml :: gate
