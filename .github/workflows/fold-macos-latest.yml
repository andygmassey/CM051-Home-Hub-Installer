      # fails EIO and the job never spawns. Measured on the Mini 16: payload
      # 18:42:10Z, plist 18:42:11Z, refusal 18:42:11Z -- one second for the
      # whole sequence, and the reason recorded was "registered, then VANISHED
      # from gui/501 before it ran". 2 of 20 agents failed; 18 loaded.
      - id: b14_s06
