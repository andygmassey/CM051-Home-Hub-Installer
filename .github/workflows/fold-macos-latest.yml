      # manifest-tests, for the reason the job exists: the change under test is
      # in run_box_walk.sh, which the cut host executes under /bin/bash 3.2. On
      # ubuntu-latest /bin/bash is 5, and bash 5 accepts 3.2-invalid syntax, so
      # an ubuntu runner would green-light a runner that dies on the box.
      #
      # WHY LAST. `branch-truth gate suite` above deliberately has no
      # `if: always()`: it genuinely depends on the PyYAML install step
      # immediately before it, which is the escape hatch verify_ci_steps_are_
      # maskless.py itself names. Inserting this step ABOVE it made that step
      # maskable and turned ci-maskless red -- correctly. Appending here masks
      # nothing, and needs no change to a step this PR does not own.
      #
      # THE DEFECT: probe_cannot_run() names the missing prerequisite and
      # run_box_walk.sh's header promises to print it. It did not -- only the
      # basename was kept -- so walks/v1.0.50.tsv records six probes that did
      # not run and no reason for any of them.
      #
      # The reasons stay on the CONSOLE: they interpolate box paths and
      # hostnames, and walks/ is committed to a PUBLIC repo. The load-bearing
      # assertion is the regression guard -- the record's parser stops at the
      # first line that is not a bare probe name, so a reason printed beneath a
      # name would silently cut walks/<version>.tsv down to a single row.
      - id: b04_s09
        if: ${{ steps.select.outputs.b04 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: a CANNOT-RUN names its prerequisite, without leaking it into the record
        run: /bin/bash tests/test_cannot_run_names_its_prerequisite.sh
      # SAME JOB AND SAME REASON AS THE STEP ABOVE: the subject is
      # run_box_walk.sh, which the cut host executes under macOS system bash
      # 3.2, and bash 5 on ubuntu accepts 3.2-invalid syntax.
      #
      # THE DEFECT: the runner exited 0 on FAIL=0 && BROKEN=0 regardless of how
      # many probes reported CANNOT-RUN, so a walk where half the instruments
      # shrugged reported success. LAUNCH DIRECTIVE item 3 had already decided
      # otherwise -- "the only CANNOT-RUNs are TCC/GUI items" -- and only the
      # exit code disagreed. It now exits 3 unless every CANNOT-RUN is a probe
      # DECLARED console-only in scripts/box_walk_probes/console_only_probes.tsv.
      #
      # `|| rc=$?` and NOT a bare call: a step runs under /bin/bash -e {0}, so
