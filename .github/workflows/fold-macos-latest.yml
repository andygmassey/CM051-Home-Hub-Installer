          grep -E '^EXAMINED|^test_people_seed_and_retrieval_probe:' "${RUNNER_TEMP}/stub.out"
          if [ "$rc" -ne 1 ]; then
            echo "NEGATIVE CONTROL FAILED: expected exit 1 (expectations missed), got ${rc}."
            echo "A stub probe that examines nothing must be caught as a missed"
            echo "expectation. Any other code means the control did not measure"
            echo "what it claims to measure."
            tail -40 "${RUNNER_TEMP}/stub.out"
            exit 1
          fi
          if ! grep -q 'harness_failures=0' "${RUNNER_TEMP}/stub.out"; then
            echo "NEGATIVE CONTROL FAILED: the fixture did not stand up cleanly,"
            echo "so the red above is not attributable to the stubbed probe."
            tail -40 "${RUNNER_TEMP}/stub.out"
            exit 1
          fi
          echo "negative control OK: stub probe -> exit 1, harness healthy"
