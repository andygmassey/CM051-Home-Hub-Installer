      # 🔴 THE FIX THAT SHIPPED AND NEVER ARRIVED.
      #
      # _upg_preserve_plist_env carries every key from the customer's OLD
      # plist over the freshly rendered one, and `Set` replaces. PATH was not
      # excluded, so an upgrade from a pre-2026-08-20 install REVERTED the
      # Homebrew-prefix fix. Reproduced with the real function extracted:
      #
      #     BEFORE  /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin
      #     AFTER   /usr/bin:/bin:/usr/sbin:/sbin
      #
      # which is launchd's default and exactly what produces
      # `colima FATA exec "limactl": executable file not found in $PATH`.
      #
      # macOS because the function IS PlistBuddy. Carries a mutation limb (the
      # pre-fix form must still revert PATH) and two controls (a customer
      # token and an old-only key must still be preserved), so it cannot pass
      # by the merge having stopped working altogether.
      - id: b16_s01
        if: ${{ steps.select.outputs.b16 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: An upgrade must not revert the LaunchAgent PATH fix
        run: |
          # `|| rc=$?`, NOT a bare call, for the reason recorded on the refusal
          # step above: the step shell is `/bin/bash -e {0}`, so a test exiting
          # 2 kills the step at that line and the branch below never runs.
          #
          # rc=2 here is CANNOT-RUN, and it means one of this file's MUTATIONS
          # removed the wrong number of lines -- the exclusion it was about to
          # test has moved or gone. That is a different finding from a failed
          # assertion and must not read as one: a mutation that cannot be
          # applied looks exactly like one that was not caught.
          set -uo pipefail
          rc=0
          /bin/bash tests/test_upgrade_does_not_revert_the_launchagent_path.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::A mutation in the upgrade env-merge test could not be applied, so the exclusion it guards was NOT measured. This is not a pass and not an assertion failure."
          fi
          exit "$rc"
