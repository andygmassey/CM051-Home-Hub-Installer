        run: |
          # `|| rc=$?` for the same reason as the step above: under `bash -e`
          # a bare fallible call exits the step before rc is ever captured.
          set -uo pipefail
          rc=0
          /bin/bash tests/test_launchagent_bootout_settles_before_bootstrap.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::Could not extract the bootout region from install.sh. NOTHING was measured -- this is not a pass."
