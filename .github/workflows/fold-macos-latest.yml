      # 8 arms. The load-bearing one asserts THE IMPORTER WAS CALLED, because
      # "the scanner exited 0" is exactly what the defect looked like.
      #
      # Mutation-tested three ways, each restoring install.sh byte-identically
      # (sha compared): deleting the timeout default trips 3 arms, deleting the
      # deadline helper trips 1, and replacing the bounded call with a bare
      # osascript trips 1. The last matters on its own -- an unbounded Apple
      # Event once wedged this same export-scan -> import chain for 23h56m.
      - id: b06_s01
        if: ${{ steps.select.outputs.b06 != 'false' && matrix.shard == 2 && !cancelled() && steps.b06_isolate.conclusion != 'failure' }}
        timeout-minutes: 20
        name: An export in Downloads must reach the importer
        run: bash tests/test_the_downloads_watcher_survives_a_real_export.sh
      # #1571. Both branches of the watcher claimed an import: the else-branch
      # said "Imported your latest export. Some parts will finish in the
      # background." on the path where the importer had just returned NON-ZERO.
      # The dedupe hash was then written outside the if/else, so a failed
      # import was also recorded as done and the export set was skipped for
      # ever -- by a line whose own comment claimed it recorded "only after a
      # real import attempt ... rather than silently marked done".
      #
      # The guard runs the SHIPPED scanner with osascript shimmed, so it
      # asserts on the text a CUSTOMER IS SHOWN, not on the source. It carries
      # its own success control (the working path must still announce and still
      # dedupe), a behavioural arm (a recovered importer must retry the failed
      # export), and a MUST-MISS arm (an already-imported set is still skipped,
