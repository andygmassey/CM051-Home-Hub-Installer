        timeout-minutes: 30
        name: provenance marker read is not piped into grep -q
        run: /bin/bash tests/test_provenance_gate_marker_read_is_not_piped.sh
      # Arm 8b is a VETO arm, so over-approximating its hazard BLOCKS A GOOD
      # CUT. A .pyc is only written for a module that is IMPORTED; CPython
      # never caches bytecode for a __main__ script. This test proves the arm
      # forgives only what provably cannot write a .pyc, and mutates every
      # clause of that exemption -- diffing each mutation first, because a
      # mutation that did not apply is a broken apparatus, not a pass.
      - id: b03_s29
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: arm 8b vetoes on importable, not merely uncovered
        run: /bin/bash tests/test_arm8b_vetoes_on_importable_not_merely_uncovered.sh
      # Arms 1-4 of the box walk branched on an exit code alone with output to
      # /dev/null, so a walk whose attach failed printed FAIL rc=1 / not
      # stapled / none found: three confident wrong verdicts about a DMG that
      # was never measured. A false cut-blocker is this estate's expensive
      # failure. Runs on macos-latest, where codesign, xcrun and spctl exist.
      - id: b03_s30
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: walk arms say CANNOT-RUN when they could not measure
        run: /bin/bash tests/test_walk_arms_distinguish_cannot_run_from_fail.sh
      - id: b03_s31
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: CANNOT-RUN is not a missing fix (manifest gate + its caller)
        run: |
          # PyYAML must be present or arms A-C are VACUOUS: verify_cut_manifest.py
          # imports yaml at line ~34, BEFORE the PEP 604 annotations at 219+, so a
          # missing yaml exits 2 having never reached the thing arm A measures.
          /usr/bin/python3 -m pip install --user --quiet pyyaml 2>/dev/null || true
          python3 -m pip install --user --quiet pyyaml 2>/dev/null \
            || python3 -m pip install --break-system-packages --ignore-installed --quiet pyyaml 2>/dev/null || true
          /bin/bash tests/test_manifest_gate_cannot_run_is_not_a_missing_fix.sh
      - id: b03_s32
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: A marker pattern that cannot run is CANNOT-RUN, not 'absent'
        run: /bin/bash tests/test_marker_grep_is_three_state.sh
      # Now that the arms run -E, a pattern that does not COMPILE reports
      # CANNOT-RUN, which is safe and silent: the row has stopped measuring and
      # nothing says so. -E also makes alternation natural to write, and this
      # pipe-delimited manifest cannot carry it -- `foo|bar` parses as pattern
      # `foo`. Both limbs print their denominator and carry a must-fail control.
      - id: b03_s33
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: every marker pattern compiles, and none is a truncated alternation
        run: /bin/bash tests/test_every_marker_pattern_compiles.sh
      # REPO-WIDE, and static, so it runs anywhere and needs no docker.
      # Two tags burned because the same exec-a-pinned-image bug lived in more
      # than one file: v1.0.27 on verify_cut_provenance.sh, then v1.0.28 on its
      # twin provenance_gate.sh, with three more sites in the design-system test
      # that neither incident looked at. Both times the right grep was run and
      # then scoped to one file while a verdict was reported about the repo.
      # This asks the whole tree every run and prints what it examined.
      - id: b03_s34
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: no gate execs a pinned image to read it (repo-wide)
        run: bash tests/test_no_gate_execs_a_pinned_image.sh
      # THE ONLY CHECK IN THE ESTATE THAT OPENS A WIKI IMAGE AND LOOKS INSIDE,
      # and until 2026-08-23 no workflow ran it. Its name appeared in the
      # `paths:` filter above -- a TRIGGER, not an invocation -- and
      # tests/TEST_WIRING.tsv scored that as WIRED. Measured on origin/main
      # 5faaf73: 201 WIRED rows naming a workflow, 160 genuinely invoked after
      # `jobs:`, and of the 41 that were not, 36 are Swift files swept up by
      # xcodebuild's whole-target run and 4 are invoked by dotted module path
      # (python3 -m unittest tests.x). This was the ONE real false label.
      #
      # --presence-only deliberately: the byte-identity half compares the image
      # against a CM044 working tree, and CM044 main legitimately moves ahead of
      # the pinned image between a merge and the next re-pin, so running that
      # half here would go red on a correct image. The presence assertions are
      # absolute. The byte half stays in run_all_cut_gates.sh at cut time.
      #
      # if: always() so a earlier failure cannot silently drop the one gate that
      # reads the shipped artefact.
      # Guards the step above, and the exit-code contract of the gate it runs.
      # Needs no docker and no network -- it asserts WIRING and CANNOT-RUN
      # behaviour, which is why it can block every PR while the gate it guards
      # cannot. Carries its own DEMONSTRATED RED against origin/main.
      - id: b03_s35
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: the wiki content gate is invoked, and cannot-run is not a pass
        run: bash tests/test_wiki_content_gate_is_invoked_and_cannot_run_is_not_pass.sh
      # NOTE: the wiki-provenance extraction test is NOT here. This job is
      # macos-latest, which has no docker, so the test skipped and the step went
      # green having examined nothing -- see the wiki-provenance-extract job
      # below, which runs it on ubuntu where docker exists and the defect lives.
      # MOVED HERE FROM THE macos-latest JOB, 2026-08-27.
      # --presence-only still needs docker -- the script's own guard is
      # `command -v docker || cannot_run "docker not available"`. macos-latest
      # has no docker, so the step returned exit 2 (CANNOT-RUN) on every run.
      # That was the gate being HONEST, not broken: it refused to claim a
      # verdict it could not reach, which is the whole point of the three-state
      # contract. But a gate that can only ever say CANNOT-RUN gates nothing.
      #
      # The comment eleven lines below the old location already stated the rule:
      # docker-needing checks belong on ubuntu. Measured on a Mac WITH docker,
      # the same command passes -- 431 rules found, both positive controls fire,
      # rc=0. The check is sound; only its host was wrong.
  # ---------------------------------------------------------------------------
  # The wiki provenance checks must READ the image, never EXECUTE it.
  #
  # v1.0.27 was burned by the exec form: the wiki images are arm64-ONLY by
  # design, cut.yml preflight is amd64, so `docker run` died with "exec format
  # error". wiki_image_grep called that a STALE WIKI IMAGE, and -- far worse --
  # wiki_image_absent called it PROOF THE PATTERN WAS GONE.
  #
  # UBUNTU ON PURPOSE, AND IT IS THE WHOLE POINT OF THE JOB. amd64 is the host
  # where the defect is reachable. It was first wired into the macos job above,
  # where docker does not exist at all: the test printed "SKIP: docker
  # unavailable" and the step reported success having examined nothing. That is
  # the same vacuous-green shape this test exists to kill, reproduced inside the
  # guard itself, so the skip is now a hard failure rather than a pass.
  # ---------------------------------------------------------------------------
      # #888. The gate tested only CONFLICTING/DIRTY, so an UNKNOWN
      # mergeability -- what GitHub returns for a window after ANY push, to the
      # PR or to its base -- fell through and the row PASSED. A human acting on
      # an UNKNOWN has a backstop: the merge API 405s a real conflict. A cut
      # gate has none; nothing downstream re-asks.
      - id: b03_s36
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: UNKNOWN mergeability is not clean (#888)
        # if: always() -- 17 test steps precede this one in the same job. Without
        # it a red anywhere above SKIPS this, and a skipped step reports as a
        # grey tick that reads like a pass. That is the #888 shape applied to
        # the guard for #888.
        run: bash tests/test_mergeable_unknown_is_not_clean.sh
      # LIGHTING A DARK GATE. tests/TEST_WIRING.tsv marked this WIRED with runner
      # scripts/run_all_cut_gates.sh -- which is invoked by NOTHING (see #449:
      # every mention of it is a paths-filter entry, an @echo in Makefile help
      # text, prose, or a test reading it as data). So the arm64-only assertion
      # has never executed, and task #355 was CLOSED on the strength of it.
      #
      # No --self-test call is needed here, and that is not an omission: this
      # gate runs its positive control INLINE and unconditionally, against a
      # permanently multi-arch published digest. If that control cannot be read
      # it exits 2, and if it fails to fire it exits 1. A gate that cannot
      # demonstrate a NO does not get to publish a YES.
      #
      # Needs network, NOT docker. MEASURED 2026-08-29 before wiring: both
      # pinned manifests return HTTP 200 to an ANONYMOUS ghcr.io token, and a
      # bogus digest on the same path returns 404 -- so the probe discriminates
      # and no registry credential is required on the runner.
      - id: b03_s37
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: pinned wiki images are arm64-only
        run: bash tests/test_pinned_wiki_images_are_arm64_only.sh
      # new_cut.sh refused to start any cut that had been SCOPED first, because
      # its guard tested the directory rather than cut.env. Writing SCOPE.md
      # before starting is the standard workflow, so the one-command cut path
      # was dead for every real cut -- v1.0.60 included.
      #
      # if: always() -- many test steps precede this one in the same job, and a
      # step that only runs when everything before it passed cannot report on a
      # red run, which is exactly when a cut-tooling guard matters.
      - id: b03_s38
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: new_cut.sh -- a SCOPED cut is not a STARTED cut
        run: bash tests/test_new_cut_guard_scoped_is_not_started.sh
      # NEW_CUT.SH MUST CHECK WHAT THE PREFLIGHT CHECKS.
      #
      # Wired 2026-09-08, after the gap cost a tag. v1.0.76 was tagged on
      # new_cut.sh's own "ALL GREEN. Safe to tag" and cut run 34201583498 died
      # at preflight in about forty seconds, before the dry-run or cut job ran.
      # Two hard preflight gates refused and NEITHER was in new_cut.sh: the
      # missing cut-manifests/<version>.yaml, and an installer plist still
      # stamped 1.0.75/7500 while the cut was 1.0.76.
      #
      # The operator did nothing wrong -- they ran every gate the tool offered
      # and tagged on green. A checklist that omits a hard gate and then
      # declares itself complete converts "I forgot" into "the tool said I was
      # done", which is why this is a wired test and not a comment.
      #
      # Its mutation control is not synthetic: it runs against the REAL
      # pre-fix new_cut.sh from origin/main, and fails naming both refusals.
      - id: b03_s39
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: new_cut.sh gates on everything the cut preflight gates on
        run: bash tests/test_new_cut_checks_what_preflight_checks.sh
      # new_cut.sh MUST NOT DRIFT FROM cut.yml's PRE-TAG GATE LIST.
      # Wired 2026-09-08 after the THIRD tag was spent on exactly that drift.
      # #1825 added two missing gates BY HAND and the list drifted again within
      # the day. Two careful lists have now failed, so this DERIVES cut.yml's
      # gates and requires new_cut.sh to invoke each one. Its mutation control
      # is the REAL pre-fix new_cut.sh from origin/main, on which it fails and
      # names verify_bom_rows_are_in_the_pin.sh -- the gate that killed v1.0.77.
      - id: b03_s40
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: new_cut.sh covers every pre-tag gate cut.yml runs
        run: bash tests/test_new_cut_covers_every_pretag_gate.sh
      # A FIRST INSTALL MUST BE ABLE TO CLAIM ITS OWN COLIMA PORT.
      # Wired 2026-09-08 after the first honestly-cold walk aborted on it:
      # signal 2 of the #567 port exemption cannot be satisfied by the install
      # that writes the credential it checks for, so ERR-06-PORTS-HELD refused
      # the installer's own just-started runtime. Mutation control is the REAL
      # pre-fix install.sh from origin/main, on which this fails 2 of 5.
      - id: b03_s41
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: a first install can claim its own colima port (#567 signal 2)
        run: bash tests/test_store_port_first_install_stale_store.sh
      # THE VENDORED ROLLFORWARD GATE MATCHES ITS OS003 PIN -- ON THE PR.
      #
      # This exact command already runs in cut.yml. It is duplicated here on
      # purpose, and the duplication is the point: cut.yml's job is push-only,
      # so on that path the gate can only refuse a cut whose TAG IS ALREADY
      # WRITTEN. Here it refuses the PR instead, which is when the change can
      # still be fixed for free.
      #
      # It needs no network and no OS003 checkout: it recomputes the hashes of
      # four vendored files and compares them to cuts/REGISTRY_PIN. Measured
      # locally at rc=0 in ~1s.
      #
      # if: always() -- see the note on the step above. Many test steps precede
      # this one in the same job, and a step that runs only when everything
      # before it passed cannot report on a red run.
      - id: b03_s42
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: the vendored rollforward gate matches its OS003 pin (PR-side)
        run: bash tests/test_rollforward_registry_pin.sh
      # #1485: one script said "OS003 has no BOM for v1.0.67 -- write it there
      # first" seconds after another had read that exact file. It had looked in
      # a different checkout, and that checkout was iCloud-evicted and stale.
      - id: b03_s43
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: the OS003 sync scripts agree on which checkout they read
        run: bash tests/test_os003_sync_defaults_agree.sh
      # AND THE WIRING FOR THE ABOVE. Watching four hand-listed paths is
      # itself a thing that rots: add a fifth file to the pin and the trigger
      # silently stops covering it. This derives the list FROM the pin and
      # goes red on any file the pin covers that paths: does not.
      - id: b03_s44
        if: ${{ steps.select.outputs.b03 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: every file the rollforward pin covers triggers this workflow
        run: bash tests/test_rollforward_pin_is_watched_on_prs.sh

      # ========================================================================
      # b04: cut-manifest.yml :: people-probe-fires
      # ========================================================================
      # The box-walk probe body itself. The primitive above only proves the
      # verifier honours a probe's exit code; this job proves the people probe
      # actually FIRES, by driving it against a controllable fake box and
      # asserting it goes RED on every way the round-trip can be wrong.
      #
      # macOS on purpose: the cut host runs the probe under /bin/bash, which is
      # 3.2 on macOS. An ubuntu runner's bash 5 would accept 3.2-invalid syntax
      # and pass a probe that dies on the real cut host.
      - id: b04_isolate
        name: "[b04] cut-manifest.yml :: people-probe-fires -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b04 != 'false' && matrix.shard == 3 }}
        env:
          PY: ${{ steps.python.outputs.python-path }}
          BLOCK: ${{ runner.temp }}/ci-fold/b04
        run: |
          set -eu
          # A fresh machine also had no processes left over from another job.
          # Every step after an isolate step carries CI_FOLD_BLOCK=<its tag>
          # (via GITHUB_ENV), and a process inherits it even once orphaned, so
          # anything an earlier block left running still carries it. Kill exactly
          # those: nothing else on the machine carries the marker.
          cf="$RUNNER_TEMP/ci-fold"
          mkdir -p "$cf"
          me=$$
          ps -A -o pid=,ppid= > "$cf/procs" || true
          # ONE read of every process's environment, not one per process: on
          # macOS a ps per process cost 2 to 5 s per block (measured, PR #2962).
          if [ -d /proc/self ]; then
            grep -lzsa '^CI_FOLD_BLOCK=' /proc/[0-9]*/environ > "$cf/marked.raw" || true
            sed -n 's|^/proc/\([0-9]*\)/environ$|\1|p' "$cf/marked.raw" > "$cf/marked"
          else
            ps eww -A -o pid=,command= > "$cf/marked.raw"
            awk '/CI_FOLD_BLOCK=/ {print $1}' "$cf/marked.raw" > "$cf/marked"
          fi
          marked=" $(tr '\n' ' ' < "$cf/marked") "
          while read -r pid ppid; do
            if [ "$pid" = "$me" ] || [ "$ppid" = "$me" ]; then continue; fi
            case "$marked" in *" $pid "*) ;; *) continue ;; esac
            kill -KILL "$pid" 2>/dev/null || true
          done < "$cf/procs"
          echo "CI_FOLD_BLOCK=b04" >> "$GITHUB_ENV"
          git -C "$GITHUB_WORKSPACE" reset --hard -q HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          rm -rf "$BLOCK"
          mkdir -p "$BLOCK/home" "$BLOCK/tmp"
          "$PY" -m venv --system-site-packages "$BLOCK/venv"
          echo "$BLOCK/venv/bin" >> "$GITHUB_PATH"
          {
            echo "HOME=$BLOCK/home"
            echo "TMPDIR=$BLOCK/tmp"
            echo "VIRTUAL_ENV=$BLOCK/venv"
          } >> "$GITHUB_ENV"
      - id: b04_s01
        if: ${{ steps.select.outputs.b04 != 'false' && matrix.shard == 3 && !cancelled() && steps.b04_isolate.conclusion != 'failure' }}
        timeout-minutes: 30
        name: Confirm we are testing under bash 3.2, as the cut host does
        run: /bin/bash --version | head -1
      # verify_branch_truth reads the shipping ledger with PyYAML and REFUSES to
      # guess without it -- it returns CANNOT-RUN (rc=3), which is correct and is
      # why 39 of 46 cases failed here rather than passing vacuously.
      #
      # MEASURED, so the cause is not guessed at: a real Mac (the cut-host shape)
      # has PyYAML on python3, on /usr/bin/python3, AND on the very
      # /opt/homebrew/opt/python@3.14 the runner selected. The GitHub macos-latest
      # image does not. This is a RUNNER gap, not a cut-host gap, and installing
      # it here does not paper over a product defect.
      - id: b04_s02
        if: ${{ steps.select.outputs.b04 != 'false' && matrix.shard == 3 && !cancelled() && steps.b04_isolate.conclusion != 'failure' && steps.b04_s01.conclusion != 'failure' }}
        timeout-minutes: 30
        name: Install PyYAML (verify_branch_truth refuses to parse the ledger without it)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages --ignore-installed pyyaml \
            || python3 -m pip install --quiet --ignore-installed pyyaml
          # Prove it, do not assume the install worked: a silent pip failure would
          # leave the suite failing for the same reason with a fix in the log.
          python3 -c 'import yaml; print("PyYAML", yaml.__version__, "importable")'
      # The three gate suites ported in #1134. They arrived with no runner at
      # all, which new-tests-wired refused in exactly the right words: a test
      # nobody runs is not coverage, it is a green light with no bulb behind
      # it. Invoked here, and listed in this workflow's paths above, so an
      # edit to any of them re-runs the job that executes them.
      - id: b04_s03
        if: ${{ steps.select.outputs.b04 != 'false' && matrix.shard == 3 && !cancelled() && steps.b04_isolate.conclusion != 'failure' && steps.b04_s01.conclusion != 'failure' && steps.b04_s02.conclusion != 'failure' }}
        timeout-minutes: 30
        name: branch-truth gate suite
        run: /bin/bash scripts/tests/test_verify_branch_truth_gate.sh
      - id: b04_s04
        if: ${{ steps.select.outputs.b04 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: clean-tree gate suite
        # an earlier suite going red is exactly when you need to know whether THIS
        # one also fails; skipping it turns two defects into one report.
        run: /bin/bash scripts/tests/test_verify_clean_tree_gate.sh
      - id: b04_s05
        if: ${{ steps.select.outputs.b04 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: acceptance-gate probe suite
        # same reason as the step above: a masked suite reports nothing, and a
        # silent step is indistinguishable from a passing one.
        run: /bin/bash scripts/tests/test_acceptance_gate_v1013_probe.sh
      # acceptance_gate_v1013 is registered in cut-manifests/permanent.yaml, so
      # it grades EVERY cut. It exited 2 for "cannot ssh to the box", and
      # check_box_walk_probe maps every non-zero that is not 78 to FAIL, so an
      # unreachable box was recorded as a defect in the artefact. In the other
      # direction its log counts could not tell "no matches" from "no logs", and
      # reported the wiki compiler clean on a box nothing was ever read from.
      - id: b04_s06
        if: ${{ steps.select.outputs.b04 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: An unreachable box is not a defect in the artefact
        run: /bin/bash scripts/tests/test_an_unreachable_box_is_not_a_defect.sh
      - id: b04_s07
        if: ${{ steps.select.outputs.b04 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: Probe must fire (1 green + 11 distinct reds)
        # this step PREDATES the three suites above. Wiring them in front of it
        # made it maskable, so the port had to carry its unmasking too --
        # adding a check can blind the checks already there.
        run: /bin/bash scripts/tests/test_people_seed_and_retrieval_probe.sh
      # The step above is now fast and reliable (task #348 removed a 35s
      # reverse-DNS stall from the fixture). Fast and reliable is also what a
      # vacuous gate looks like, so prove the harness still goes RED: hand it
      # the exact stub it exists to catch -- a probe that examines nothing and
      # exits 0 -- and demand a specific red, not merely a non-zero.
      #
      # Exit 1 specifically, plus harness_failures=0. Accepting any non-zero
      # would let a dead fixture (exit 2) satisfy the control, which is the same
      # false-pass shape in a new costume.
      - id: b04_s08
        if: ${{ steps.select.outputs.b04 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: Negative control - the harness must go RED on the stub probe
        # always(): a run where the step above went red is exactly the run where
        # you most need to know whether the harness can still produce a red at
        # all. Skipping this on failure would mask the one measurement that
        # separates "the probe regressed" from "the harness stopped working".
        run: |
          set -u
          # Path moved when the probe was collapsed into probes/ so that
          # run_box_walk.sh would actually collect it. It is referenced HERE by
          # path, so a move that forgets this line silently stubs nothing and
          # the control goes green over a probe it never replaced.
          PROBE=scripts/box_walk_probes/probes/people_seed_and_retrieval.sh
          cp "$PROBE" "${RUNNER_TEMP}/probe.real"
          printf '#!/usr/bin/env bash\necho "people_seed_and_retrieval: PASS -- nothing examined"\nexit 0\n' > "$PROBE"
