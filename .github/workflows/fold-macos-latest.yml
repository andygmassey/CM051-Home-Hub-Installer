        timeout-minutes: 30
        name: The gate
        run: /bin/bash tests/test_launchagent_success_requires_verification.sh
      # Moved here from launchd-plist-paths (ubuntu), where its axis C (a real
      # launchd job must stay down while the deliberate-stop marker is present)
      # could only report CANNOT-RUN: no launchctl. This job is macOS.
      - id: b14_s03
        if: ${{ steps.select.outputs.b14 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: Assert the uninstaller writes the deliberate-stop marker first and removes it last
        run: /bin/bash tests/test_uninstall_writes_deliberate_stop_marker.sh
      # THE OTHER HALF OF #876. The helper above stops the installer CLAIMING a
      # LaunchAgent loaded when it did not. It could not say WHY, because both
      # load attempts ran under `2>/dev/null` and launchd's refusal -- the only
      # artefact that knows -- went to the bit bucket.
      #
      # Measured on the Mini 16, 2026-09-04: com.ostler.doctor absent from
      # launchctl, :8089 answering 000, the installer correctly WARNING and the
      # warning carrying no reason. Bootstrapping the identical unmodified
      # plist by hand 21 minutes later gave `state = running` and a 200, so
      # plist and payload were both fine and the diagnosis cost a second full
      # install. An honest "no" that cannot say why is a whole walk per defect.
      - id: b14_s04
        if: ${{ steps.select.outputs.b14 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: A refused LaunchAgent load must record launchd's reason
        run: /bin/bash tests/test_launchagent_refusal_reason_is_recorded.sh
      # RECORDING THE REASON IS NOT DELIVERING IT. The step above proves the
      # cause is captured; this one proves it reaches somewhere a walk reads,
      # and that an UNREACHABLE gui domain is named rather than reported as a
      # broken agent. Measured 2026-09-04: the refusal log had 0 references in
      # ttywalk.sh and 0 in walk_drive.py, so the cause of the Mini 16 Doctor
      # failure sat on the box unread and cost a second 21-minute install.
      - id: b14_s05
        if: ${{ steps.select.outputs.b14 != 'false' && matrix.shard == 3 && (always()) }}
        timeout-minutes: 30
        name: A refusal must reach the transcript and name its scope
        run: |
          # ⚠️ `|| rc=$?`, NOT a bare call. The step shell is `/bin/bash -e {0}`
          # (printed by the runner). Under -e a test exiting 2 kills the step AT
          # THAT LINE, so `rc=$?` never runs and the CANNOT-RUN branch below is
          # unreachable code. Measured 2026-09-04: current form 0 ::error lines
          # on an rc=2 test, this form 1, and 0 when the test passes.
          set -uo pipefail
          rc=0
          /bin/bash tests/test_launchagent_refusal_reaches_the_transcript.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The refusal harness could not extract its subject from install.sh. NOTHING was measured about LaunchAgent refusals -- this is not a pass."
          fi
          exit "$rc"
