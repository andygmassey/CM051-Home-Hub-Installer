      # ========================================================================
      # b13: keyless-store-probe-tests.yml :: probe-tests
      # ========================================================================
      # The four box-walk store probes now present the install's -K credential and
      # adjudicate the reply (401 refused -> FAIL, keyless 401 -> CANNOT-RUN, transport
      # 000 -> CANNOT-RUN) instead of reading a keyless 401 as "the store is down".
