          /bin/bash --version | head -1
          python3 --version
      - id: b21_s02
        if: ${{ steps.select.outputs.b21 != 'false' && matrix.shard == 3 && !cancelled() && steps.b21_isolate.conclusion != 'failure' && steps.b21_s01.conclusion != 'failure' }}
        timeout-minutes: 30
        name: TOTAL_STEPS must not gain a new late decrement
        run: |
          # ⚠️ `|| rc=$?`, NOT a bare call. The step shell is `/bin/bash -e {0}`,
          # so a bare fallible call exits the step before rc is captured and the
          # CANNOT-RUN branch below becomes unreachable code. That is the class
          # the cannot-run-branch-reachable gate exists to catch, and this
          # workflow must not become its next instance.
          #
          # ⚠️ THAT SCANNER IS NAMED BY ITS WORKFLOW, NOT ITS PATH, ON PURPOSE.
          # invoked-tests-are-watched extracts `(tests|scripts|bin|lib)/….(sh|py)`
          # out of the whole run: body with NO comment awareness, so spelling the
          # file as a path in a COMMENT reads as an INVOCATION and demands a
          # paths: entry for a script this workflow never runs. Measured on run
          # 33806347997, which failed exactly that way. Filed as a gate finding;
          # NOT worked around by adding a false path entry, because that would
          # make this workflow claim to watch something it does not use.
          set -uo pipefail
          rc=0
          /bin/bash tests/test_total_steps_denominator_ratchet.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The ratchet could not read install.sh or parsed nothing of it. NOTHING was measured about the progress denominator -- this is not a pass."
          fi
          exit "$rc"

      # ========================================================================
      # b22: zero-payload-is-not-ok.yml :: gate
      # ========================================================================
      - id: b22_isolate
        name: "[b22] zero-payload-is-not-ok.yml :: gate -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b22 != 'false' && matrix.shard == 2 }}
        env:
          PY: ${{ steps.python.outputs.python-path }}
          BLOCK: ${{ runner.temp }}/ci-fold/b22
        run: |
          set -eu
          # A fresh machine also had no processes left over from another job.
          # Every step after an isolate step carries CI_FOLD_BLOCK=<its tag>
          # (via GITHUB_ENV), and a process inherits it even once orphaned, so
          # anything an earlier block left running still carries it. Kill exactly
          # those: nothing else on the machine carries the marker.
          cf="$RUNNER_TEMP/ci-fold"
          mkdir -p "$cf"
          me=$$
          ps -A -o pid=,ppid= > "$cf/procs" || true
          # ONE read of every process's environment, not one per process: on
          # macOS a ps per process cost 2 to 5 s per block (measured, PR #2962).
          if [ -d /proc/self ]; then
            grep -lzsa '^CI_FOLD_BLOCK=' /proc/[0-9]*/environ > "$cf/marked.raw" || true
            sed -n 's|^/proc/\([0-9]*\)/environ$|\1|p' "$cf/marked.raw" > "$cf/marked"
          else
            ps eww -A -o pid=,command= > "$cf/marked.raw"
            awk '/CI_FOLD_BLOCK=/ {print $1}' "$cf/marked.raw" > "$cf/marked"
          fi
          marked=" $(tr '\n' ' ' < "$cf/marked") "
          while read -r pid ppid; do
            if [ "$pid" = "$me" ] || [ "$ppid" = "$me" ]; then continue; fi
            case "$marked" in *" $pid "*) ;; *) continue ;; esac
            kill -KILL "$pid" 2>/dev/null || true
          done < "$cf/procs"
          echo "CI_FOLD_BLOCK=b22" >> "$GITHUB_ENV"
          git -C "$GITHUB_WORKSPACE" reset --hard -q HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          rm -rf "$BLOCK"
          mkdir -p "$BLOCK/home" "$BLOCK/tmp"
          "$PY" -m venv --system-site-packages "$BLOCK/venv"
          echo "$BLOCK/venv/bin" >> "$GITHUB_PATH"
          {
            echo "HOME=$BLOCK/home"
            echo "TMPDIR=$BLOCK/tmp"
            echo "VIRTUAL_ENV=$BLOCK/venv"
          } >> "$GITHUB_ENV"
      - id: b22_s01
        if: ${{ steps.select.outputs.b22 != 'false' && matrix.shard == 2 && !cancelled() && steps.b22_isolate.conclusion != 'failure' }}
        timeout-minutes: 30
        name: Environment, so a failure is attributable
        run: |
          /bin/bash --version | head -1
          sw_vers | head -2
      - id: b22_s02
        if: ${{ steps.select.outputs.b22 != 'false' && matrix.shard == 2 && !cancelled() && steps.b22_isolate.conclusion != 'failure' && steps.b22_s01.conclusion != 'failure' }}
        timeout-minutes: 30
        name: The gate
        run: /bin/bash tests/test_status_ok_with_zero_payload_is_not_ok.sh
      # Exit 1 from the merge-consistency repair is TWO facts: the pass
      # refusing on its negative control, and Python exiting 1 on an uncaught
      # exception. The installer asserted the first for both, so an ImportError
      # from a vendor skew was reported to the customer as a broken SPARQL
      # predicate -- a confident diagnosis pointing away from the fault.
      - id: b22_s03
        if: ${{ steps.select.outputs.b22 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: exit 1 is a crash or a refusal and not always the same one
        run: /bin/bash tests/test_exit_1_is_a_crash_or_a_refusal_and_not_always_the_same_one.sh

      # ========================================================================
      # b23: zero-payload-is-not-ok.yml :: self-test
      # ========================================================================
      - id: b23_isolate
        name: "[b23] zero-payload-is-not-ok.yml :: self-test -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b23 != 'false' && matrix.shard == 2 }}
        env:
          PY: ${{ steps.python.outputs.python-path }}
          BLOCK: ${{ runner.temp }}/ci-fold/b23
        run: |
          set -eu
          # A fresh machine also had no processes left over from another job.
          # Every step after an isolate step carries CI_FOLD_BLOCK=<its tag>
          # (via GITHUB_ENV), and a process inherits it even once orphaned, so
          # anything an earlier block left running still carries it. Kill exactly
          # those: nothing else on the machine carries the marker.
          cf="$RUNNER_TEMP/ci-fold"
          mkdir -p "$cf"
          me=$$
          ps -A -o pid=,ppid= > "$cf/procs" || true
          # ONE read of every process's environment, not one per process: on
          # macOS a ps per process cost 2 to 5 s per block (measured, PR #2962).
          if [ -d /proc/self ]; then
            grep -lzsa '^CI_FOLD_BLOCK=' /proc/[0-9]*/environ > "$cf/marked.raw" || true
            sed -n 's|^/proc/\([0-9]*\)/environ$|\1|p' "$cf/marked.raw" > "$cf/marked"
          else
            ps eww -A -o pid=,command= > "$cf/marked.raw"
            awk '/CI_FOLD_BLOCK=/ {print $1}' "$cf/marked.raw" > "$cf/marked"
          fi
          marked=" $(tr '\n' ' ' < "$cf/marked") "
          while read -r pid ppid; do
            if [ "$pid" = "$me" ] || [ "$ppid" = "$me" ]; then continue; fi
            case "$marked" in *" $pid "*) ;; *) continue ;; esac
            kill -KILL "$pid" 2>/dev/null || true
          done < "$cf/procs"
          echo "CI_FOLD_BLOCK=b23" >> "$GITHUB_ENV"
          git -C "$GITHUB_WORKSPACE" reset --hard -q HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          rm -rf "$BLOCK"
          mkdir -p "$BLOCK/home" "$BLOCK/tmp"
          "$PY" -m venv --system-site-packages "$BLOCK/venv"
          echo "$BLOCK/venv/bin" >> "$GITHUB_PATH"
          {
            echo "HOME=$BLOCK/home"
            echo "TMPDIR=$BLOCK/tmp"
            echo "VIRTUAL_ENV=$BLOCK/venv"
          } >> "$GITHUB_ENV"
      - id: b23_s01
        if: ${{ steps.select.outputs.b23 != 'false' && matrix.shard == 2 && !cancelled() && steps.b23_isolate.conclusion != 'failure' }}
        timeout-minutes: 30
        name: hydrate_reminders wiring guard
        # Explicit, single-line invocation (verb + path on the same line):
        # scripts/verify_new_tests_are_wired.sh requires this for a newly
        # ADDED test file -- the for-loop membership just below does not
        # satisfy it, because the loop variable indirection puts the
        # execution verb and the literal filename on different lines.
        run: /bin/bash tests/test_hydrate_reminders_wired.sh
      - id: b23_s02
        if: ${{ steps.select.outputs.b23 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: The embedding sentinel is not the reader's sentinel (#775)
        # always(), for the reason the step below states: a guard that only
        # runs when everything before it was green stops being measured
        # exactly when something is wrong.
        # Explicit, single-line invocation, same rule as the step above.
        run: /bin/bash tests/test_the_embedding_sentinel_is_not_the_readers.sh
      - id: b23_s03
        if: ${{ steps.select.outputs.b23 != 'false' && matrix.shard == 2 && (always()) }}
        timeout-minutes: 30
        name: The existing hydrate guards must still hold
        # always(), because a step that only runs when everything before it
        # was green stops being measured exactly when something is wrong.
        # verify_ci_steps_are_maskless.py caught this one: measured, main
        # has 643 test steps and 0 maskable, this branch added the 644th
        # and it was the one flagged.
        run: |
          set +e
          set -uo pipefail
          rc_total=0
          for t in tests/test_aiconv_hydrate_honesty.sh \
                   tests/test_hydrate_sentinel_not_on_error.sh \
                   tests/test_hydrate_people_wired.sh \
                   tests/test_hydrate_apple_notes_wired.sh \
                   tests/test_hydrate_email_preferences_wired.sh \
                   tests/test_hydrate_reminders_wired.sh \
                   tests/test_fda_rerun_ingests.sh; do
              if [ ! -f "$t" ]; then
                  echo "CANNOT RUN: $t is missing. That is NOT a pass -- this job"
                  echo "exists to prove the neighbours still agree, and a neighbour"
                  echo "that vanished is a bigger finding than one that failed."
                  exit 1
              fi
              /bin/bash "$t" > "/tmp/$(basename "$t").out" 2>&1
              rc=$?
              printf '%-52s rc=%s\n' "$(basename "$t")" "$rc"
              if [ "$rc" -ne 0 ]; then
                  tail -12 "/tmp/$(basename "$t").out" | sed 's/^/      /'
                  rc_total=1
              fi
          done
          exit "$rc_total"
