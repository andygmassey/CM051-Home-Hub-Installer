        run: /bin/bash tests/test_walk_record_states_measured_count.sh

      # ========================================================================
      # b05: data-conservation-probe-tests.yml :: probe-tests
      # ========================================================================
      # The data conservation probe (IN -> STORED -> SHOWN, per source and category).
      # Its self-test mutates the facts (a deleted store, an unexplained shown drop, an
      # over-declared exclusion, mirrored graph nodes) and a real wiki-text reader fed
      # an allow-list copy with "apple" removed, and every mutation MUST come out LOST
      # or INFLATED while the unmutated control stays clean.
      # runs-on macos-latest on purpose: the probe ships to a macOS / bash 3.2 box.
      - id: b05_isolate
        name: "[b05] data-conservation-probe-tests.yml :: probe-tests -- fresh tree, venv, HOME, TMPDIR"
        if: ${{ !cancelled() && steps.select.outputs.b05 != 'false' && matrix.shard == 2 }}
        env:
          PY: ${{ steps.python.outputs.python-path }}
          BLOCK: ${{ runner.temp }}/ci-fold/b05
        run: |
          set -eu
          # A fresh machine also had no processes left over from another job.
          # Every step after an isolate step carries CI_FOLD_BLOCK=<its tag>
          # (via GITHUB_ENV), and a process inherits it even once orphaned, so
          # anything an earlier block left running still carries it. Kill exactly
          # those: nothing else on the machine carries the marker.
          cf="$RUNNER_TEMP/ci-fold"
          mkdir -p "$cf"
          me=$$
          ps -A -o pid=,ppid= > "$cf/procs" || true
          # ONE read of every process's environment, not one per process: on
          # macOS a ps per process cost 2 to 5 s per block (measured, PR #2962).
          if [ -d /proc/self ]; then
            grep -lzsa '^CI_FOLD_BLOCK=' /proc/[0-9]*/environ > "$cf/marked.raw" || true
            sed -n 's|^/proc/\([0-9]*\)/environ$|\1|p' "$cf/marked.raw" > "$cf/marked"
          else
            ps eww -A -o pid=,command= > "$cf/marked.raw"
            awk '/CI_FOLD_BLOCK=/ {print $1}' "$cf/marked.raw" > "$cf/marked"
          fi
          marked=" $(tr '\n' ' ' < "$cf/marked") "
          while read -r pid ppid; do
            if [ "$pid" = "$me" ] || [ "$ppid" = "$me" ]; then continue; fi
            case "$marked" in *" $pid "*) ;; *) continue ;; esac
            kill -KILL "$pid" 2>/dev/null || true
          done < "$cf/procs"
          echo "CI_FOLD_BLOCK=b05" >> "$GITHUB_ENV"
          git -C "$GITHUB_WORKSPACE" reset --hard -q HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdxq
          rm -rf "$BLOCK"
          mkdir -p "$BLOCK/home" "$BLOCK/tmp"
          "$PY" -m venv --system-site-packages "$BLOCK/venv"
          echo "$BLOCK/venv/bin" >> "$GITHUB_PATH"
          {
            echo "HOME=$BLOCK/home"
            echo "TMPDIR=$BLOCK/tmp"
            echo "VIRTUAL_ENV=$BLOCK/venv"
          } >> "$GITHUB_ENV"
      - id: b05_s01
        if: ${{ steps.select.outputs.b05 != 'false' && matrix.shard == 2 && !cancelled() && steps.b05_isolate.conclusion != 'failure' }}
        timeout-minutes: 15
        name: adjudicator mutation self-test (python3 as shipped to the box)
        run: python3 scripts/box_walk_probes/lib/data_conservation.py selftest
      - id: b05_s02
        if: ${{ steps.select.outputs.b05 != 'false' && matrix.shard == 2 && !cancelled() && steps.b05_isolate.conclusion != 'failure' && steps.b05_s01.conclusion != 'failure' }}
        timeout-minutes: 15
        name: probe contract, scope row and exit codes
        run: /bin/bash scripts/tests/test_data_conservation_probe.sh
      - id: b05_s03
        if: ${{ steps.select.outputs.b05 != 'false' && matrix.shard == 2 && !cancelled() && steps.b05_isolate.conclusion != 'failure' && steps.b05_s01.conclusion != 'failure' && steps.b05_s02.conclusion != 'failure' }}
        timeout-minutes: 15
        name: probe --self-test must come back FAIL (its negative control fired)
        run: |
          set +e
          bash scripts/box_walk_probes/probes/data_conservation.sh --self-test
          rc=$?
          [ "$rc" -eq 1 ] || { echo "self-test rc=$rc, want 1"; exit 1; }

