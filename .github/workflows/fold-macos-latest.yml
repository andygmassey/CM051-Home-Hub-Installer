      - id: b08_s01
        if: ${{ steps.select.outputs.b08 != 'false' && matrix.shard == 2 && !cancelled() && steps.b08_isolate.conclusion != 'failure' }}
        timeout-minutes: 30
        name: The test must go RED against the pre-fix installer
        run: |
