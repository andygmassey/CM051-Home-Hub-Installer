      - id: b13_s05
        if: ${{ steps.select.outputs.b13 != 'false' && matrix.shard == 1 && (always()) }}
        timeout-minutes: 60
        name: Probe self-tests never reach the box
        run: /bin/bash scripts/tests/test_probe_self_tests_never_reach_the_box.sh
