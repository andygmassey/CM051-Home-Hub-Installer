# .github/workflows/cut.yml -- addresses v1018-D026 (Part 2).
#
# The ONLY way a publishable Ostler DMG comes into existence.
#
# v1018-D027 removed the local capability; this is its other half. Between the
# two there is no route to a signed, notarised artefact that has not passed the
# rollforward gate. That is the whole point: for five months every gate was
# advisory because `make ship` could always be run by hand.
#
# TRIGGER IS A TAG PUSH, AND NOTHING ELSE.
# There is deliberately no `workflow_dispatch`. A manually-fired pipeline is a
# hand-cut wearing a costume: same "I'll just run it" pressure, same bypass of
# the tag that pins what was cut. If you want a cut, write the tag down.
name: cut

on:
  push:
    tags:
      - 'v1.0.*'

permissions:
  contents: write     # create the release
  id-token: write     # keyless signing / attestation later

concurrency:
  # Never two cuts of the same tag racing each other to the same release.
  group: cut-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # 1. GATE. Nothing is built until the ledger says the blockers are fixed.
  #    Cheap, fast, and it runs FIRST so a red rollforward costs seconds
  #    rather than a full signed build.
  # ---------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gates need history, not a shallow clone

      - name: Tag must match the in-repo cut record
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "tag: $TAG"
          MANIFEST="cut-manifests/${TAG}.yaml"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::No cut manifest at $MANIFEST." >&2
            echo "A tag without a manifest is a cut nobody wrote down." >&2
            exit 1
          fi
          echo "manifest: $MANIFEST"

      # The vendored gate must match the OS003 commit it claims to come from.
      # #540 vendored the runner with nothing holding it to its source and it
      # drifted 239 diff lines behind, missing the redactor, the claim-coverage
      # pass, and a parse fix OS003 already had. Checked BEFORE the gate runs,
      # because a gate of unknown vintage cannot be evidence about anything.
      - name: Vendored rollforward gate matches its OS003 pin
        run: ./tests/test_rollforward_registry_pin.sh

      - name: Rollforward claims -- no row may claim a fix with no gate
        run: |
          set -euo pipefail
          RUNNER=bin/rollforward_gate.sh
          if [ ! -x "$RUNNER" ]; then
            echo "::error::$RUNNER is missing or not executable." >&2
            echo "The rollforward gate is the reason this pipeline exists." >&2
            echo "Refusing to cut without it -- an unenforced gate is worse" >&2
            echo "than none, because it reads as enforcement." >&2
            exit 1
          fi
          # --verify-claims, NOT --cut. THIS IS DELIBERATE AND IT IS A
          # NARROWING OF WHAT THIS STEP CLAIMS, NOT OF WHAT IT ENFORCES.
          #
          # This step used to call `--cut`, and its name promised "every
          # MUST-FIX-NEXT row must be green". It never delivered that on a
          # single tag, because it CANNOT on a hosted runner. Measured
          # 2026-08-11 on the v1.0.19 tag push, run 31449951403, the first and
          # only run this workflow has ever had: of 27 gates, 15 are
          # runs-on=box and print UNRUNNABLE with no Mini behind GATE_BOX, and
          # 8 more go red purely because CM051_DIR / OA_DIR / CM044_DIR /
          # OS003_DIR name sibling checkouts that do not exist here. Two pass.
          #
          # It also could not even start: the runner defaults to
          # $REPO/cuts/DEFECTS_ROLLFORWARD.md, CM051 had no cuts/ directory,
          # and the step died on `PARSE ERROR: registry not found`.
          #
          # So the promise was never kept, and a gate that cannot pass is
          # decorative -- exactly what v1018-D026 exists to abolish. The work
          # is now split by what each environment can honestly prove:
          #
          #   here, every tag push  --verify-claims  registry parses; no row
          #                                          claims fixed without a gate
          #   operator, pre-tag     --cut            the gate bodies run
          #   box-walk, on the Mini --cut + GATE_BOX the 15 box gates run
          #
          # --verify-claims prints what it did NOT prove, every run, so a green
          # here cannot be read as "the defects are fixed".
          "$RUNNER" --verify-claims --cut "${GITHUB_REF_NAME}"

      - name: Repo-side gates
        run: |
          set -euo pipefail
          # v1018-D027: local cutting must be impossible. Asserted here too, so
          # a PR that quietly removes the guard cannot then cut in CI.
          ./tests/test_no_local_cuts.sh
          # v1018-D024: vendor-only files must survive a re-vendor.
          ./tests/test_vendor_only_survives_sync.sh
          # The credential guard must check ALL FIVE, not one. Runs here, on
          # ubuntu, with placeholder values only -- it asserts the guard's
          # logic, never touches a real secret, and the real secrets do not
          # exist in this job. Catches a regression at preflight rather than
          # after the macOS runner has already been spun up.
          ./tests/test_signing_credential_guard.sh

  # ---------------------------------------------------------------------
  # 2. CUT. macOS runner; the only place signing credentials exist.
  #    $CI is set by GitHub, which is what satisfies guard-local-cut.
  # ---------------------------------------------------------------------
  cut:
    needs: preflight
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ALL FIVE CREDENTIALS, CHECKED TOGETHER, BEFORE ANY OF THEM IS USED.
      #
      # This step exists because the previous guard checked exactly ONE of the
      # five -- OSTLER_SIGNING_CERT_P12 -- and that turned out to be the wrong
      # shape the moment the secrets were provisioned one at a time.
      #
      # Measured on 2026-08-10. Three of the five were provisionable from the
      # operator's material; the other two were not present and had to be
      # fetched by hand. In that half-provisioned state the old guard PASSED,
      # because the only secret it tested was set, and the cut then failed
      # further down inside `security import` with an opaque keychain error
      # that names no secret at all. A missing credential must not present as
      # a toolchain fault.
      #
      # The notary step was worse: it had NO guard whatsoever. An empty
      # --issuer went straight into `notarytool store-credentials`.
      #
      # Checking one member of a set is not checking the set. This asserts all
      # five, reports EVERY missing one in a single run rather than one per
      # re-tag, and names them exactly as they appear in repo settings so the
      # message is directly actionable.
      #
      # Values are never echoed -- only names. The check is emptiness only.
      - name: Verify signing credentials are present
        env:
          OSTLER_SIGNING_CERT_P12:      ${{ secrets.OSTLER_SIGNING_CERT_P12 }}
          OSTLER_SIGNING_CERT_PASSWORD: ${{ secrets.OSTLER_SIGNING_CERT_PASSWORD }}
          OSTLER_NOTARY_KEY:            ${{ secrets.OSTLER_NOTARY_KEY }}
          OSTLER_NOTARY_KEY_ID:         ${{ secrets.OSTLER_NOTARY_KEY_ID }}
          OSTLER_NOTARY_ISSUER:         ${{ secrets.OSTLER_NOTARY_ISSUER }}
        run: ./bin/require_signing_secrets.sh

      - name: Import signing identity
        env:
          CERT_P12:     ${{ secrets.OSTLER_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.OSTLER_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ostler-cut.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notary credentials
        env:
          NOTARY_KEY:      ${{ secrets.OSTLER_NOTARY_KEY }}
          NOTARY_KEY_ID:   ${{ secrets.OSTLER_NOTARY_KEY_ID }}
          NOTARY_ISSUER:   ${{ secrets.OSTLER_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials ostler-ci \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER"
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Build, sign, notarise, staple
        env:
          NOTARY_PROFILE: ostler-ci
          # check-orphans shells out to `gh`. Without this its PR lookups run
          # unauthenticated and FAIL, and a failed lookup is treated as "no PR
          # exists", which is a RED naming a branch for a missing credential.
          # That happened on v1.0.22 (run 31478119136).
          #
          # This alone was not sufficient: the script also did
          # `GH_TOKEN="$tok" gh ...` with an empty $tok, which OVERWROTE this
          # with the empty string. Fixed alongside, in gh_as().
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          #
          # The five sibling repos CANNOT be checked from here, and saying so
          # is the honest option rather than the convenient one.
          #
          # Their default paths are $HOME/Developer and $HOME/Documents/
          # Projects -- the operator's Mac. On a hosted runner $HOME is
          # /Users/runner, so all five are absent BY CONSTRUCTION and the gate
          # could never have passed in CI on any tag.
          #
          # Cloning them here would not help either: a repo-scoped
          # GITHUB_TOKEN cannot read a sibling repo even under the same owner,
          # and the daemon is in a different org entirely. Making CI able to
          # see them needs a cross-repo PAT, which is a credential decision for
          # Andy and not something to provision inside a cut.
          #
          # So this declares the boundary instead of faking coverage. The gate
          # prints "NOT CHECKED IN THIS ENVIRONMENT" and downgrades its verdict
          # to "GREEN, PARTIAL". The sibling repos are covered by the OPERATOR
          # run of scripts/verify_no_orphaned_fixes.sh on the build machine,
          # where all three gh accounts resolve -- run it before tagging.
          OSTLER_ORPHAN_GATE_SKIP: CM044,CM041,CM059,CM031,daemon
          # Lets the gate flag deferrals whose until_cut has already passed.
          OSTLER_CUT_VERSION: ${{ github.ref_name }}
        run: make -C gui ship

      - name: Verify the artefact, not the build log
        run: |
          set -euo pipefail
          DMG="$(find dist -name '*.dmg' -maxdepth 2 | head -1)"
          [ -n "$DMG" ] || { echo "::error::no DMG produced" >&2; exit 1; }
          echo "dmg: $DMG"
          # notarytool exits 0 on `Invalid`, so parse the status rather than $?.
          xcrun stapler validate "$DMG"
          spctl -a -vvv -t install "$DMG" 2>&1 | tee /tmp/spctl.txt
          grep -q 'source=Notarized Developer ID' /tmp/spctl.txt || {
            echo "::error::DMG is not Notarized Developer ID" >&2; exit 1; }
          shasum -a 256 "$DMG" | tee dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ostler-dmg-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/SHA256SUMS
          retention-days: 90
