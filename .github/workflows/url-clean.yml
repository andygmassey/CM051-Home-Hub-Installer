# Tracking parameters (utm_*, fbclid, gclid ...) are stripped from browsing
# URLs at every ingest point: the Safari and Chrome readers, the bookmarks
# reader, the Browsing sink, the extension POST and Save to Knowledge. Also
# the byte-identical-copy parity check and the backfill script (dry-run by
# default, idempotent). Tests carry functional-param negative controls and a
# mutant check, with collected-count floors so a shrinking suite cannot pass.
name: url-clean

on:
  push:
    branches: [main]
    paths:
      - 'vendor/ostler_fda/url_clean.py'
      - 'vendor/ostler_fda/safari_history.py'
      - 'vendor/ostler_fda/chrome_history.py'
      - 'vendor/ostler_fda/safari_bookmarks.py'
      - 'vendor/ostler_fda/pwg_ingest.py'
      - 'vendor/cm041/assistant_api/url_clean.py'
      - 'vendor/cm041/assistant_api/ical-server.py'
      - 'vendor/cm041/assistant_api/tests/test_url_clean_ingest.py'
      - 'scripts/backfill_strip_tracking_urls.py'
      - 'tests/test_url_clean.py'
      - 'tests/fixtures/url_clean_table.json'
      - 'tests/test_backfill_strip_tracking_urls.py'
      - '.github/workflows/url-clean.yml'
  pull_request:
    paths:
      - 'vendor/ostler_fda/url_clean.py'
      - 'vendor/ostler_fda/safari_history.py'
      - 'vendor/ostler_fda/chrome_history.py'
      - 'vendor/ostler_fda/safari_bookmarks.py'
      - 'vendor/ostler_fda/pwg_ingest.py'
      - 'vendor/cm041/assistant_api/url_clean.py'
      - 'vendor/cm041/assistant_api/ical-server.py'
      - 'vendor/cm041/assistant_api/tests/test_url_clean_ingest.py'
      - 'scripts/backfill_strip_tracking_urls.py'
      - 'tests/test_url_clean.py'
      - 'tests/fixtures/url_clean_table.json'
      - 'tests/test_backfill_strip_tracking_urls.py'
      - '.github/workflows/url-clean.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  url-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --quiet pytest "httpx>=0.27" "nameparser>=2.1.0,<3.0" "phonenumbers>=8.13.0" rapidfuzz fastapi
      - name: Readers, sink, table, mutants, parity, backfill
        run: |
          n="$(python -m pytest tests/test_url_clean.py tests/test_backfill_strip_tracking_urls.py --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 10 ]; then
            echo "REFUSING: expected at least 10 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python -m pytest tests/test_url_clean.py tests/test_backfill_strip_tracking_urls.py -v
      - name: The Hub handlers (extension POST, Save to Knowledge)
        if: always()
        run: |
          n="$(python -m pytest vendor/cm041/assistant_api/tests/test_url_clean_ingest.py --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 4 ]; then
            echo "REFUSING: expected at least 4 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python -m pytest vendor/cm041/assistant_api/tests/test_url_clean_ingest.py -v
