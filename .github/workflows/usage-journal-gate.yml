name: usage-journal-gate

# The Bursar must be able to see the usage the wiki compiler produces.
#
# #482 -- the Bursar read "You're not on the meter. Nothing recorded yet this
# month." on a box that had done a full install AND compiled a wiki. The
# producer was not missing: CM044 fbc115e (2026-08-25) shipped the writer, its
# wiring into compiler/llm.py, a vendor-drift test AND the mount. It added the
# mount to CM044's docker/docker-compose.yml -- a DEV file no customer runs.
# The customer's compose is generated by a quoted heredoc in install.sh, and
# measured on CM051 ddd2dfe9 that heredoc scored OSTLER_WORKSPACE -> 0 against
# a control of OSTLER_WIKI_DIR -> 6 in the same file, so the zero was real.
#
# Consequence: resolve_journal_path() fell to its last branch and returned
# /root/.ostler/workspace/state/costs.jsonl -- inside the container, on no
# volume, discarded at exit. Every compile appended usage into nothing, with
# no error on any surface.
#
# THIS IS #849 A SECOND TIME. That defect -- the Pro vault licence mount --
# had the same shape in the same two repos, and its own guard
# (tests/test_shipped_compose_licence_mount.sh) already records the lesson:
# "A guard on the dev compose says nothing about the artefact." It was
# written down and it happened again anyway, which is the argument for this
# file: the assertion has to live on the SHIPPING surface, in the repo that
# generates the customer's compose.
#
# Keep CM044's tests too. They guard a different artefact, and neither
# workflow can see the other's defect.

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'tests/test_shipped_compose_usage_journal_mount.sh'
      # A gate must trigger on changes to ITSELF, or it can be quietly
      # narrowed in a PR that never runs it. Same reasoning as licence-gate.
      - '.github/workflows/usage-journal-gate.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  usage-journal-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The test refuses to run (exit 1, not 0) when install.sh is absent or
      # carries no wiki-compiler service, so a repo-layout change cannot turn
      # this gate into a silent pass. Its control is asserted BEFORE any of
      # its counts are trusted.
      - name: the shipped compose mounts the journal the Bursar reads
        run: bash tests/test_shipped_compose_usage_journal_mount.sh
