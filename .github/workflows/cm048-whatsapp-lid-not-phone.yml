# CM051 #2578: a WhatsApp LID (linked-device id) presented through the
# ordinary phone-JID suffix (@s.whatsapp.net) must never be formatted as a
# phone in cm048_pipeline's surfaced pwg:chatIdentifier literal -- the same
# bug class as CM051 #2543 (ostler_fda) and CM051 #2545 (CM041), in a third
# tree. Mirrors CM048 PR #80's source-side fix.
name: cm048-whatsapp-lid-not-phone

on:
  push:
    branches: [main]
    paths:
      - 'vendor/cm048_pipeline/src/ingest.py'
      - 'tests/test_cm048_whatsapp_lid_not_phone.py'
      - '.github/workflows/cm048-whatsapp-lid-not-phone.yml'
  pull_request:
    paths:
      - 'vendor/cm048_pipeline/src/ingest.py'
      - 'tests/test_cm048_whatsapp_lid_not_phone.py'
      - '.github/workflows/cm048-whatsapp-lid-not-phone.yml'

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  cm048-whatsapp-lid-not-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # httpx, PyYAML, phonenumbers: ingest.py's own runtime deps
      # (vendor/cm048_pipeline/pyproject.toml). ostler_security: ingest.py
      # hard-refuses to import without it (will not start against a
      # potentially unencrypted database -- by design, same as the writer-
      # reader-vocabulary suite's ical-server.py import).
      - name: Install pytest and the module's runtime dependencies
        run: |
          python -m pip install --quiet pytest httpx pyyaml phonenumbers
          python -m pip install --quiet ./vendor/ostler_security
      # ANTI-VACUITY AND THE RUN ARE ONE STEP ON PURPOSE, same reasoning as
      # contact-card-repair.yml / whatsapp-lid-not-phone.yml: a failing
      # floor in a separate step would SKIP the run below and hide the real
      # result behind an earlier red.
      - name: A WhatsApp LID is never written as a phone number (cm048_pipeline)
        run: |
          n="$(python -m pytest tests/test_cm048_whatsapp_lid_not_phone.py \
                 --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 9 ]; then
            echo "REFUSING: expected at least 9 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python -m pytest tests/test_cm048_whatsapp_lid_not_phone.py -v
