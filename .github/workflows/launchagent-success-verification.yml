name: launchagent-success-verification

# A LAUNCHAGENT SUCCESS LINE MUST BE BACKED BY launchd (#876, class #800).
#
# ============================================================================
# THE DEFECT
# ============================================================================
#
# On the 2026-08-24 v1.0.44 walk the installer printed
#
#     [ok]    Ostler Doctor running at http://localhost:8089/doctor
#
# while com.ostler.doctor was NOT LOADED and :8089 answered 000. Six
# customer-facing surfaces went dark behind that one line -- Preferences
# toggles, Governor, Doctor > Channels, People, Timeline, and every status
# header -- and the install log recorded a clean run. The wiki in the same
# app was serving 6,932 people, so the data was never the problem.
#
# Twelve sites shipped the same shape. Two independent reasons it cannot be
# trusted: `|| true` makes the `ok` unconditional, and `launchctl load` on a
# missing plist EXITS 0 (measured, macOS 26.5.2), so branching on the status
# does not help either.
#
# ============================================================================
# WHY A CLASS GATE RATHER THAN TWELVE FIXES
# ============================================================================
#
# The hand inventory found eleven. The predicate found TWELVE -- ical-server,
# which printed the WARN and the OK on the same failure, one line apart, was
# missed by the eye. Twelve fixes leave the thirteenth site free to be
# written next week. The gate does not.
#
# ============================================================================
# WHY THE SELF-TEST IS ITS OWN JOB
# ============================================================================
#
# A failing gate skips everything after it, so a broken predicate would take
# down the job it guards and report one red line instead of two. Same reason
# zero-payload-is-not-ok, fda-rerun-ingests and ci-maskless split theirs out.
# The self-test reinstates the exact pre-fix Doctor block from pin 2fb63f73
# and requires the scanner to go RED on it, with a control that the count
# moves by exactly one so the RED is attributable to that block and nothing
# else.

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'install.sh.strings.en-GB.sh'
      - 'tests/test_launchagent_success_requires_verification.sh'
      - 'tests/test_launchagent_refusal_reason_is_recorded.sh'
      - 'tests/test_launchagent_refusal_reaches_the_transcript.sh'
      - 'tests/test_launchagent_bootout_settles_before_bootstrap.sh'
      - 'tests/TEST_WIRING.tsv'
      - '.github/workflows/launchagent-success-verification.yml'
      # Watched because the regression job below RUNS them. A run: without a
      # matching path entry means editing one of these does not trigger the
      # workflow that checks it.
      - 'tests/test_every_launchagent_is_torn_down.sh'
      - 'tests/test_uninstall_removes_every_launchagent_plist.sh'
      - 'tests/test_export_scan_plist_bootstrap_race_217.sh'
      - 'tests/test_stay_awake_agent_survives_installer_exit.sh'
      - 'tests/test_doctor_proxy_paths_predicate.sh'
      - 'tests/test_v1010_ical_doctor_service_auth.sh'
      - 'tests/test_upgrade_reloads_the_launchagent_it_rewrote.sh'
      # An upgrade must not carry a customer's OLD PATH over the template's.
      # Watched because the step below runs it, and it reads install.sh's
      # real _upg_preserve_plist_env, which is already watched above.
      - 'tests/test_upgrade_does_not_revert_the_launchagent_path.sh'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same branch/PR. NEVER cancels main or a
  # tag: a cancelled main run is a gate that did not report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  gate:
    # macOS, because the shape being guarded is a macOS launchctl idiom and
    # the gate runs where the code runs. The scan itself is portable, but a
    # gate that only ever runs on Linux has no way to notice a BSD/GNU split
    # in its own tooling -- see the mktemp -t note in the estate memory.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Environment, so a failure is attributable
        run: |
          /bin/bash --version | head -1
          python3 --version
          sw_vers | head -2
      - name: The gate
        run: /bin/bash tests/test_launchagent_success_requires_verification.sh

      # THE OTHER HALF OF #876. The helper above stops the installer CLAIMING a
      # LaunchAgent loaded when it did not. It could not say WHY, because both
      # load attempts ran under `2>/dev/null` and launchd's refusal -- the only
      # artefact that knows -- went to the bit bucket.
      #
      # Measured on the Mini 16, 2026-09-04: com.ostler.doctor absent from
      # launchctl, :8089 answering 000, the installer correctly WARNING and the
      # warning carrying no reason. Bootstrapping the identical unmodified
      # plist by hand 21 minutes later gave `state = running` and a 200, so
      # plist and payload were both fine and the diagnosis cost a second full
      # install. An honest "no" that cannot say why is a whole walk per defect.
      - name: A refused LaunchAgent load must record launchd's reason
        if: always()
        run: /bin/bash tests/test_launchagent_refusal_reason_is_recorded.sh

      # RECORDING THE REASON IS NOT DELIVERING IT. The step above proves the
      # cause is captured; this one proves it reaches somewhere a walk reads,
      # and that an UNREACHABLE gui domain is named rather than reported as a
      # broken agent. Measured 2026-09-04: the refusal log had 0 references in
      # ttywalk.sh and 0 in walk_drive.py, so the cause of the Mini 16 Doctor
      # failure sat on the box unread and cost a second 21-minute install.
      - name: A refusal must reach the transcript and name its scope
        if: always()
        run: |
          # ⚠️ `|| rc=$?`, NOT a bare call. The step shell is `/bin/bash -e {0}`
          # (printed by the runner). Under -e a test exiting 2 kills the step AT
          # THAT LINE, so `rc=$?` never runs and the CANNOT-RUN branch below is
          # unreachable code. Measured 2026-09-04: current form 0 ::error lines
          # on an rc=2 test, this form 1, and 0 when the test passes.
          set -uo pipefail
          rc=0
          /bin/bash tests/test_launchagent_refusal_reaches_the_transcript.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::The refusal harness could not extract its subject from install.sh. NOTHING was measured about LaunchAgent refusals -- this is not a pass."
          fi
          exit "$rc"
      # bootout is ASYNCHRONOUS. Bootstrapping into a half-torn-down label
      # fails EIO and the job never spawns. Measured on the Mini 16: payload
      # 18:42:10Z, plist 18:42:11Z, refusal 18:42:11Z -- one second for the
      # whole sequence, and the reason recorded was "registered, then VANISHED
      # from gui/501 before it ran". 2 of 20 agents failed; 18 loaded.
      - name: bootout settles before bootstrap, and costs nothing when idle
        if: always()
        run: |
          # `|| rc=$?` for the same reason as the step above: under `bash -e`
          # a bare fallible call exits the step before rc is ever captured.
          set -uo pipefail
          rc=0
          /bin/bash tests/test_launchagent_bootout_settles_before_bootstrap.sh || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error title=CANNOT-RUN (harness, not product)::Could not extract the bootout region from install.sh. NOTHING was measured -- this is not a pass."
          fi
          exit "$rc"

      # A LaunchAgent that loaded is not a LaunchAgent that read the plist you
      # just wrote. On an UPGRADE the label is already bootstrapped, so
      # `launchctl bootstrap` no-ops and launchd keeps serving the definition
      # it loaded at FIRST INSTALL -- EnvironmentVariables included.
      #
      # Measured on a real box 2026-08-26: the service token had been rotated,
      # the plist rewritten, and launchd was still serving the pre-rotation
      # value. Every non-public /api/v1 route 401'd for every correctly
      # configured client, presenting as a client-side auth fault.
      # `kickstart -k` does not fix it -- it restarts from the loaded
      # definition. Only bootout + bootstrap reloads it.
      - name: an upgrade that rewrites a plist makes launchd re-read it
        if: always()
        run: /bin/bash tests/test_upgrade_reloads_the_launchagent_it_rewrote.sh

  self-test:
    # PROVE IT CAN GO RED. Green on the fix alone is not evidence -- a scanner
    # with a broken regex is green on everything.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The scanner must catch the reinstated v1.0.44 Doctor block
        run: /bin/bash tests/test_launchagent_success_requires_verification.sh --self-test

  neighbours:
    # THE REGRESSION DIRECTION. Twelve LaunchAgent call sites were rewritten
    # to route through one helper. The existing agent guards must still agree,
    # and a neighbour that VANISHED is a bigger finding than one that failed --
    # so a missing file is a hard stop, never a silent skip.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 🔴 THE FIX THAT SHIPPED AND NEVER ARRIVED.
      #
      # _upg_preserve_plist_env carries every key from the customer's OLD
      # plist over the freshly rendered one, and `Set` replaces. PATH was not
      # excluded, so an upgrade from a pre-2026-08-20 install REVERTED the
      # Homebrew-prefix fix. Reproduced with the real function extracted:
      #
      #     BEFORE  /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin
      #     AFTER   /usr/bin:/bin:/usr/sbin:/sbin
      #
      # which is launchd's default and exactly what produces
      # `colima FATA exec "limactl": executable file not found in $PATH`.
      #
      # macOS because the function IS PlistBuddy. Carries a mutation limb (the
      # pre-fix form must still revert PATH) and two controls (a customer
      # token and an old-only key must still be preserved), so it cannot pass
      # by the merge having stopped working altogether.
      - name: An upgrade must not revert the LaunchAgent PATH fix
        if: always()
        run: /bin/bash tests/test_upgrade_does_not_revert_the_launchagent_path.sh

      - name: The existing LaunchAgent guards must still hold
        run: |
          set +e
          set -uo pipefail
          rc_total=0
          for t in tests/test_every_launchagent_is_torn_down.sh \
                   tests/test_uninstall_removes_every_launchagent_plist.sh \
                   tests/test_export_scan_plist_bootstrap_race_217.sh \
                   tests/test_stay_awake_agent_survives_installer_exit.sh \
                   tests/test_doctor_proxy_paths_predicate.sh \
                   tests/test_v1010_ical_doctor_service_auth.sh; do
              if [ ! -f "$t" ]; then
                  echo "CANNOT RUN: $t is missing. That is NOT a pass -- this job"
                  echo "exists to prove the neighbours still agree, and a neighbour"
                  echo "that vanished is a bigger finding than one that failed."
                  exit 1
              fi
              /bin/bash "$t" > "/tmp/$(basename "$t").out" 2>&1
              rc=$?
              printf '%-56s rc=%s\n' "$(basename "$t")" "$rc"
              if [ "$rc" -ne 0 ]; then
                  tail -12 "/tmp/$(basename "$t").out" | sed 's/^/      /'
                  rc_total=1
              fi
          done
          exit "$rc_total"
