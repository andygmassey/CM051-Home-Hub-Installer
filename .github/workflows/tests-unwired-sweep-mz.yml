name: tests-unwired-sweep-mz

# Wires a batch of previously-UNWIRED regression tests into CI -- the tests
# whose filename letter AFTER `test_` is in the range m..z. This drains part of
# the P1 test-wiring backlog recorded in tests/TEST_WIRING.tsv: a test that runs
# nowhere asserts nothing, so each of these was DARK until named here.
#
# Discipline for this file (a2/wire-tests-mz):
#   * Every test below was RUN and shown to PASS before being wired -- shell
#     tests under both /bin/bash 3.2 (the macOS runner default) and bash 5.x,
#     python tests with their declared vendored deps installed.
#   * Tests that FAILED for a REAL reason (a live finding, not a stale
#     assertion) are deliberately NOT wired here -- wiring a red to get green is
#     worse than an honest UNWIRED row. Two such tests remain UNWIRED with a
#     recorded reason: test_total_steps_dynamic.sh (its static drift heuristic
#     miscounts a function-wrapped progress() call; install.sh's accounting is
#     correct, proven by the same test's end-to-end checks) and
#     test_walkaway_no_phase2_input_leak.sh (a genuine finding: a post-Phase-3
#     `gui_read "autologin_consent"` reboot-self-heal prompt that would stall a
#     GUI walk-away install; needs an owner decision to hoist or allowlist).
#   * Three tests carried STALE assertions against install.sh that had moved on;
#     each was corrected on this branch to assert the CURRENT contract, not the
#     old literal (sudo-gate lookback window; port-3000 pre-flight loop; the
#     ostler-installer -> ostler-releases release-repo rename; the Rule 0.9
#     "Vane healthy" catalogue lift).
#
# ALWAYS RUNS -- no `paths:` filter, so a change anywhere that regresses one of
# these contracts is caught, not skipped behind a grey tick. Same reasoning as
# test-wiring.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:

  python-ubuntu:
    # Vendored-logic tests (parsers, identity resolver, migration guard,
    # tailnet parser, knowledge embed-contract). OS-independent, so they run on
    # ubuntu with the declared vendored requirements installed -- same shape as
    # the repo's other python gates (setup-python + pip install).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install declared vendored dependencies
        run: |
          set -e
          python -m pip install --quiet --upgrade pip
          # cm019 ingest parsers are imported as a package, so the WHOLE
          # declared ingest dependency set is needed (aiofiles + bs4 + lxml +
          # pydantic + ...), not just the one a single parser names.
          python -m pip install --quiet -r vendor/cm019_preferences/requirements.txt
          # identity_resolver declares rapidfuzz (PR #109's missing dep).
          python -m pip install --quiet -r vendor/cm041/identity_resolver/requirements.txt
          # pytest runner + the cm024 knowledge-CLI deps the contract test needs.
          python -m pip install --quiet pytest qdrant-client pyyaml phonenumbers

      - name: Guard -- deps present so pytest.importorskip cannot silently skip
        # importorskip turns a missing dep into a SKIP, which is green and
        # asserts nothing. Fail loudly here instead if any dep is absent, so a
        # "passed" below always means the tests actually ran.
        run: python -c "import aiofiles, bs4, lxml, rapidfuzz, click, qdrant_client, yaml, pytest, phonenumbers"

      - name: stdlib unittest tests (no third-party deps)
        run: |
          set -e
          python tests/test_migration_marker_guard_fresh_install.py
          python tests/test_tailnet_owner_resolution.py

      - name: cm019 parser / filter tests (plain-script, self-reporting)
        if: always()
        run: |
          set -e
          python tests/test_pinterest_parser.py
          python tests/test_pref_noise_source_cap.py

      - name: pytest-driven vendored contracts (rc=5 on zero-collected fails the step)
        if: always()
        run: |
          set -e
          python -m pytest \
            tests/test_resolver_robustness.py \
            tests/test_vendor_knowledge_embed_contract.py \
            -q -rs -p no:cacheprovider

      # A DEDICATED STEP, NOT A LINE IN THE `for t in` LIST ABOVE, AND THE
      # DIFFERENCE IS NOT COSMETIC. The two wiring gates disagree about what
      # "wired" means:
      #   verify_test_wiring.sh          a MENTION in a workflow  -> WIRED
      #   verify_new_tests_are_wired.sh  path + an EXECUTION VERB on the SAME
      #                                  line -> otherwise DARK
      # The list idiom satisfies the first and fails the second, so TEST_WIRING
      # scored this WIRED while CI called it DARK. The older entries in that
      # list predate the second gate and are grandfathered by it, which is why
      # the disagreement is invisible until you add one.
      # LAST IN THE JOB, AND `if: always()`. Placed FIRST, a failure here
      # SKIPPED the 25-test m..z batch below it -- verify_ci_steps_are_maskless
      # caught exactly that: "1 test step(s) are skipped when an earlier test
      # in the same job fails". A gate that can mask other tests is worse than
      # no gate, because the masked ones report nothing rather than red.
      - name: the daemon-freshness row decides on the scoped count
        if: always()
        run: bash tests/test_the_daemon_freshness_row_decides_on_the_scoped_count.sh

      # Also last, also if: always(), for the same reason as the step below it.
      - name: the migrator authenticates and a refusal is loud
        if: always()
        run: python3 tests/test_the_migrator_authenticates_and_a_refusal_is_loud.py

      # SELF-TEST ONLY, DELIBERATELY. The live arm reads the tag list and
      # refuses when the tree's version is already tagged -- which is the
      # NORMAL state of main between a tag and the next bump. Running it here
      # would redden main for that whole window and teach people to route
      # around it. The live arm runs at ship time, as a `make ship`
      # prerequisite, which is the only moment the question has a right answer.
      - name: ship refuses to build an already-tagged version
        if: always()
        run: bash tests/test_ship_refuses_an_already_tagged_version.sh --self-test

      # Consumer-half gap (2026-09-13): import_notion.py / import_obsidian.py
      # were complete Doctor-side backends (job locking, stale-PID recovery,
      # feature-flag gating, three routes each documented) with NOTHING
      # registering any of the six routes in web_ui.py -- a customer who
      # flipped the feature flag got a plain 404 from FastAPI's own router.
      # A second, independent gap made the obvious fix dangerous alone: the
      # CM024 ADAPTERS registry only knew "evernote" / "apple_notes", so
      # routing "notion"/"obsidian" into the CLI without fixing the registry
      # would have shipped routes that KeyError on every real attempt. This
      # test proves both halves are fixed together by running a REAL import
      # end to end (forking the actual vendored ostler-knowledge CLI) against
      # real Notion/Obsidian fixtures and reading back the staged markdown --
      # not just that the routes exist or the registry has the keys. click +
      # httpx + qdrant-client are cm024_knowledge's own declared runtime deps
      # (vendor/cm024_knowledge/requirements.txt), installed here rather than
      # in the shared step above because this is the only test in this job
      # that imports the cm024 vendored package end to end.
      - name: notion and obsidian imports run end to end, not just their routes
        if: always()
        run: |
          set -e
          python -m pip install --quiet -r vendor/cm024_knowledge/requirements.txt
          python3 tests/test_notion_obsidian_import_runs_end_to_end.py

      # Consumer-half gap (2026-09-13): cli.py's _ai_adapters() excluded the
      # gateway's own sessions.db from the ONLY entrypoint production ever
      # invokes, so the customer's direct chats with their own assistant never
      # reached the durable conversation store despite a complete, tested
      # adapter for them. This walks the real path -- unify() over a real
      # sqlite fixture, wire.stage() writing real files that are read back,
      # wire.post() attempting the real CM048 POST with only the transport
      # faked -- not just "the adapter is in the list", which is exactly the
      # shape of proof that let the gap ship unnoticed. httpx is cm052's own
      # runtime dependency (docs/VENDOR_CM051.md), installed here rather than
      # in the shared step above because this is the only test in this job
      # that imports the cm052 vendored package.
      - name: gateway conversations reach the durable store, not just the adapter list
        if: always()
        run: |
          set -e
          python -m pip install --quiet httpx
          python3 tests/test_gateway_conversations_reach_the_store.py

      - name: A finished contact sync lets the settling bar reach 100% (walk #16 F8)
        if: always()
        run: bash tests/test_settling_contacts_reaches_100_when_sync_finished.sh
