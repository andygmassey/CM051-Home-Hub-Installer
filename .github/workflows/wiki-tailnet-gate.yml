name: wiki-tailnet-gate

# The wiki renders the customer's entire personal graph and has no auth
# of its own. v1.0.17 exposes it on the tailnet ONLY behind an nginx
# gate that checks the identity headers `tailscale serve` stamps from
# the verified WireGuard session.
#
# tests/test_wiki_tailnet_gate.sh does not merely grep install.sh: it
# generates the real config, stands it up against a stub wiki in the
# pinned nginx image, and drives HTTP at it -- 403 for no identity, a
# non-owner, an empty header and Funnel; 200 + body for the owner. It
# also runs a positive control so a validator that can no longer fail
# is caught as a failure itself.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  wiki-tailnet-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the wiki tailnet gate guard
        run: bash tests/test_wiki_tailnet_gate.sh

      - name: Owner-resolution parser
        if: always()
        # The gate guard above proves nginx rejects the wrong user. It stays
        # green when the owner was never resolved at all, because a gate with
        # no owner rejects everyone -- correct, and indistinguishable from
        # working. So it cannot catch a parser regression; this can.
        # It extracts the parser from install.sh rather than copying it, so
        # the test cannot drift from what ships.
        run: python3 -m unittest tests.test_tailnet_owner_resolution -v

      # #644. The two steps above ask whether the tailnet gate ADMITS the
      # right person; this asks whether the customer ever gets ONTO the
      # tailnet at all. On the .136 relaunch tailscaled was down, `tailscale
      # up` could not mint a login URL, and the installer still entered
      # "Waiting for you to sign in (up to 3 minutes)" -- a wait that could
      # only ever full-timeout. It hung 382s and opened no browser.
      #
      # This is the Tailscale workflow in this repo and this is the install.sh
      # Tailscale block, so the gate belongs here rather than in a workflow of
      # its own. It uses the same technique as the step above: it EXTRACTS
      # _ts_daemon_up from install.sh and drives it against stubbed
      # `tailscale status` output, so it cannot drift from what ships.
      #
      # No `paths:` entry, because this workflow has no paths filter -- it
      # runs on every pull request by design, and adding a filter to carry one
      # test would narrow a gate that currently always fires.
      #
      # `if: always()` because it is not the first gate in the job. GitHub
      # stops a job at its first failing step, and a skipped gate reports
      # identically to one that ran and passed.
      - name: Sign-in wait is never entered with tailscaled down (#644)
        if: always()
        run: bash tests/test_tailscale_daemon_gate.sh
