name: test-wiring

# v1018-D675. 131 of 171 test files in this repo are referenced nowhere
# executable. This workflow does two things:
#
#   1. runs the wiring manifest gate, so the number cannot quietly grow
#   2. runs the tests it accounts for, BY NAME
#
# EVERY TEST IS NAMED EXPLICITLY AND THAT IS DELIBERATE.
# A `for f in tests/*.sh` loop here would take the gate green in one commit
# while telling nobody which of the 131 actually pass. That is the same defect
# as bulk-converting the manifest to MANUAL, wearing a runner's clothes. One of
# the controls behind the 131 count was that no such glob exists in this repo;
# adding one to fix the count would destroy the measurement.
#
# THIS CHECK IS EXPECTED TO BE RED until the classification pass finishes.
# It is red because 132 files are unruled, and it names them every run. It is
# not warn-only: an advisory gate that exits 0 is how the OS001 i18n lint went
# green while it was overwriting live translations.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  wiring:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The gate's own controls come first. If they do not pass, the gate's
      # verdict on everything below is worthless, and a green verdict from a
      # broken instrument is worse than no verdict.
      - name: Gate self-test (17 controls)
        run: /bin/bash tests/test_verify_test_wiring.sh

      # Both files must parse under the shell they actually run under. bash 3.2
      # tracks quoting THROUGH $( ) and does not stop at #, so an apostrophe in
      # a comment inside a command substitution makes a whole file unparseable
      # while homebrew bash 5.x parses it happily. Cost us a live gate once.
      - name: Both files parse under /bin/bash (3.2)
        run: |
          /bin/bash --version | head -1
          /bin/bash -n tests/verify_test_wiring.sh
          /bin/bash -n tests/test_verify_test_wiring.sh

      - name: Manifest matches the tree
        run: /bin/bash tests/verify_test_wiring.sh

  # Tests this workflow is the declared runner for. Named, one step each, so a
  # failure says which test failed without anyone opening a log.
  named-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # v1018-D668. Pins that gui/Makefile's OSTLER_APP_PATH default actually
      # applies. Shipped as a guard on 2026-08-09 and had never run: its only
      # mention anywhere outside tests/ was a COMMENT in gui/Makefile, which is
      # why the first version of the wiring manifest wrongly recorded it WIRED.
      # Runs on macOS because it pins GNU Make 3.81 ordering semantics, which is
      # the make the cut machine has.
      - name: gui/Makefile OSTLER_APP_PATH default applies
        run: /bin/bash tests/test_makefile_app_path_default.sh

      # v1018-D675 security cluster. All ran NOWHERE before this workflow.
      # Each is a pure-shell assertion over install.sh / the generated configs;
      # none needs a device, a secret, or a real install.
      - name: consent A7+A8 assertions
        run: /bin/bash tests/test_consent_a7_a8.sh
      - name: Q19 consent third-party legal-note separation
        run: /bin/bash tests/test_cx18_q19_consent_third_party_legal_note_separation.sh
      - name: Q20 consent install body shape
        run: /bin/bash tests/test_cx18_q20_consent_install_body_shape.sh
      - name: GDPR folder-access-denied handling
        run: /bin/bash tests/test_gdpr_folder_access_denied.sh
      - name: GDPR scan pre-warning
        run: /bin/bash tests/test_gdpr_scan_prewarn.sh
      - name: third-party data consent
        run: /bin/bash tests/test_third_party_data_consent.sh
      - name: at-rest exclusions
        run: /bin/bash tests/test_v1010_at_rest_exclusions.sh
      # Had never run once, and it gates codesign+spctl on every daemon staging.
      - name: daemon signature gate
        run: /bin/bash tests/test_v1010_daemon_signature_gate.sh
      - name: ical-server + Doctor service auth
        run: /bin/bash tests/test_v1010_ical_doctor_service_auth.sh
      - name: ingest reroute plists
        run: /bin/bash tests/test_v1010_ingest_reroute_plists.sh
      - name: redteam3 supply-chain image pins
        run: /bin/bash tests/test_v1010_redteam3_supply_chain_pins.sh
      - name: stores are loopback-only and auth-ready
        run: /bin/bash tests/test_v1010_store_auth_loopback.sh
      - name: wiki is NOT tailscale-served
        run: /bin/bash tests/test_v1010_wiki_not_tailscale_served.sh
      - name: vendored register carries no operator PII
        run: /bin/bash tests/test_vendored_register_pii.sh
      - name: walk-away phase-2 input leak
        run: /bin/bash tests/test_walkaway_no_phase2_input_leak.sh
      - name: PIPELINE_SIGNALS writer
        run: /bin/bash tests/test_write_pipeline_signals.sh

      # Structural half runs everywhere; the behavioural half needs docker and
      # says so rather than exiting 0 over an unproved claim. Exit 2 (could not
      # run) is a CI failure here on purpose -- see the test's header.
      - name: store-proxy Host/Origin allowlist
        run: /bin/bash tests/test_v1010_store_front_proxy.sh
