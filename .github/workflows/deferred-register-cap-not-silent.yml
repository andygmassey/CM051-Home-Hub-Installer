name: A licence cap on the deferred path is not silent

# ============================================================================
# The deferred device-registration retry used to hit a licence cap, write
# `cap_reached <timestamp>` into ~/.ostler/state/registration_warning.txt, and
# exit 0. THAT FILE WAS READ BY NOTHING. The only other mention of it in the
# repo was a comment in FingerprintState.swift describing a Doctor banner that
# was never built.
#
# The install-time path was always fine -- ContentView renders
# DeviceLimitReachedView and blocks. ONLY the deferred retry was silent, which
# is why it survived: the loud path was the one anyone ever looked at.
#
# The test is BEHAVIOURAL. It stands up a stub Worker on an EPHEMERAL loopback
# port, returns a real 409 with the real body shape, runs the real shipped
# script against it, and asserts a consumable record comes out. A source grep
# would pass on a fix that never executes.
# ============================================================================

on:
  pull_request:
    paths:
      - 'scripts/deferred-register-device.sh'
      - 'tests/test_deferred_register_cap_is_not_silent.sh'
      - 'tests/TEST_WIRING.tsv'
      # A gate that does not watch its own file can be quietly narrowed in a
      # pull request that never runs it.
      - '.github/workflows/deferred-register-cap-not-silent.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # NEVER cancels main: a cancelled main run is a gate that did not report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deferred-register-cap-not-silent:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The script is macOS-targeted (launchd agent, /usr/bin/curl, osascript
      # notification), so it is exercised on macOS. The test exits 2
      # (CANNOT-RUN) if its stub never answers 409, so a dead fixture can
      # never be read as "the cap produced no record".
      - name: A 409 from the Worker produces a record a reader can consume
        run: bash tests/test_deferred_register_cap_is_not_silent.sh
