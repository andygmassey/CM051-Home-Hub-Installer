name: secrets-are-documented

# Every secret a workflow references must have a row in .github/SECRETS.md.
#
# ============================================================================
# WHAT WAS BROKEN
# ============================================================================
#
# Measured 2026-08-20. CM051_RELEASES_READ was wired at four sites in cut.yml
# and reading FROM ostler-ai releases. Its publish counterpart was never wired
# to anything at all. The read half worked, the write half did not exist, and
# nothing anywhere compared the two, so nothing ever said so.
#
#   37 cut tags               -> 0 release objects
#   ostler.ai/install.dmg     -> 404, for every customer who had paid
#
# Every one of those cuts built a signed, notarised, stapled artefact that no
# customer could obtain. The website redirect was never wrong. There was
# simply no release, and no register that would have made the missing half
# visible next to the half that worked.
#
# ============================================================================
# WHAT THIS GATE CAN AND CANNOT SAY
# ============================================================================
#
# It CANNOT check that a secret's value is set. Secrets are unreadable by
# design and this gate holds no token. A workflow referencing a secret that
# was never populated still looks identical to one that was.
#
# It CAN force a human to write down what each wire is for and what breaks
# without it. That is the thing that was missing, and it is what turns "this
# secret exists" into "this secret's counterpart does not".
#
# The test says both of these in its own output rather than letting a green
# tick imply the stronger one.
#
# ============================================================================
# WHY THE PATH FILTER IS THE WHOLE SURFACE
# ============================================================================
#
# A gate whose trigger does not cover the surface its defect lives on is green
# forever. Every way to introduce an undocumented secret reference edits a
# file under .github/workflows/, because that is the only place ${{ secrets.X
# }} is meaningful. So the filter below covers the defect by construction, not
# by coincidence.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/SECRETS.md'
      - 'tests/test_secrets_are_documented.sh'
      - 'tests/TEST_WIRING.tsv'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same branch or PR.
  # NEVER cancels main: a cancelled main run is a gate that did not report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  documented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every referenced secret has a row in .github/SECRETS.md
        run: bash tests/test_secrets_are_documented.sh

      # The test writes a temporary workflow into .github/workflows to prove
      # it can fail, then removes it. If that removal ever regresses, a stray
      # workflow is a REAL workflow to GitHub. Assert the tree is clean rather
      # than trusting the test's own cleanup trap.
      - name: The negative-control seed left nothing behind
        if: always()
        run: |
          if [ -n "$(git status --porcelain .github/workflows)" ]; then
            echo "::error::test_secrets_are_documented.sh left files in .github/workflows:"
            git status --porcelain .github/workflows
            exit 1
          fi
          echo "ok: .github/workflows is clean"

      - name: Parses under bash 3.2-compatible syntax
        if: always()
        run: bash -n tests/test_secrets_are_documented.sh
