name: rule-09-strings-check

# Rule 0.9 lint guard. Runs the check-rule-09-strings.sh script against
# the PR diff (or the push diff against main). Fails the build if any
# newly-added line introduces an inline customer-facing literal instead
# of a catalogue lookup.
#
# Locked 2026-05-19 in HR015 memory/feedback_customer_strings_extractable_from_day_one.md
# + PRODUCTISATION_CHECKLIST.md.
#
# Same script, same exit codes, same bypass mechanism (`i18n-exempt`
# substring on the same line as the literal) as the pre-commit hook
# at .githooks/check-rule-09-strings.sh.
#
# This workflow also owns the OTHER half of Rule 0.9: the lint above proves
# customer strings are IN the catalogue, and the locale overlay/fallback gate
# below proves the catalogue LOADER still resolves them. Extracting strings you
# then fail to render is the same failure with a longer fuse.
#
# DELIBERATELY NOT paths-FILTERED, and that is why nothing is added to a
# `paths:` list for the new gate. This workflow already runs on every pull
# request. A filter would mean it skips on exactly the PR that changes a
# surface the list forgot -- and a skipped job renders as a grey tick that
# reads like a pass. Same reasoning as install-duration-honesty.yml. CM051 is
# public, so the runner is free.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  rule-09:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with merge-base history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve BASE_SHA
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE_SHA:-}" ]; then
              echo "sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
              echo "Comparing against PR base: $PR_BASE_SHA"
          else
              # Push event on main. Use the previous commit on main as base.
              BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
              echo "sha=$BASE" >> "$GITHUB_OUTPUT"
              echo "Comparing against previous commit: $BASE"
          fi

      - name: Run Rule 0.9 check
        run: |
          set -euo pipefail
          SCRIPT=".githooks/check-rule-09-strings.sh"
          if [ ! -x "$SCRIPT" ]; then
              echo "::error::$SCRIPT missing or not executable. Re-run .githooks/install.sh."
              exit 1
          fi
          "$SCRIPT" ci "${{ steps.base.outputs.sha }}"

      # The catalogue LOADER, not the catalogue lint. Pins three guarantees of
      # the base+overlay loader in install.sh: en-GB is byte-identical through
      # it, a selected locale overlays per-key, and an untranslated key or a
      # wholly-absent catalogue falls back to English without blanking or
      # aborting. Plus %s placeholder parity, because a translation that drops
      # a placeholder is a printf crash in the customer's language.
      #
      # `if: always()` because this is not the first gate in the job. GitHub
      # stops a job at its first failing step, and a skipped gate reports
      # identically to one that ran and passed.
      - name: Locale overlay + English fallback hold (catalogue loader)
        if: always()
        run: bash tests/test_locale_overlay_fallback.sh
