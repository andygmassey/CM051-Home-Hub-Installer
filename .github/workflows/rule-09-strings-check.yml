name: rule-09-strings-check

# Rule 0.9 lint guard. Runs the check-rule-09-strings.sh script against
# the PR diff (or the push diff against main). Fails the build if any
# newly-added line introduces an inline customer-facing literal instead
# of a catalogue lookup.
#
# Locked 2026-05-19 in HR015 memory/feedback_customer_strings_extractable_from_day_one.md
# + PRODUCTISATION_CHECKLIST.md.
#
# Same script, same exit codes, same bypass mechanism (`i18n-exempt`
# substring on the same line as the literal) as the pre-commit hook
# at .githooks/check-rule-09-strings.sh.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  rule-09:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with merge-base history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve BASE_SHA
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE_SHA:-}" ]; then
              echo "sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
              echo "Comparing against PR base: $PR_BASE_SHA"
          else
              # Push event on main. Use the previous commit on main as base.
              BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
              echo "sha=$BASE" >> "$GITHUB_OUTPUT"
              echo "Comparing against previous commit: $BASE"
          fi

      - name: Run Rule 0.9 check
        run: |
          set -euo pipefail
          SCRIPT=".githooks/check-rule-09-strings.sh"
          if [ ! -x "$SCRIPT" ]; then
              echo "::error::$SCRIPT missing or not executable. Re-run .githooks/install.sh."
              exit 1
          fi
          "$SCRIPT" ci "${{ steps.base.outputs.sha }}"

      # The Rule 0.9 check above guards the SHAPE of customer strings: a literal
      # where a catalogue lookup belongs. It says nothing about what the
      # catalogue VALUES say. An internal codename sitting in a shipped MSG_*
      # passes it cleanly.
      #
      # tests/test_no_internal_codenames_in_customer_strings.sh covers exactly
      # that, existed already, and was wired to NOTHING -- the only mention of
      # it anywhere in the repo is a COMMENT in install-log-hygiene.yml
      # recording that it "was green throughout" while a codename leak reached
      # a customer. It was green throughout because it never ran.
      #
      # This workflow has no paths filter, so a run: step is the whole wiring.
      - name: no internal codename reaches a customer-facing string VALUE
        if: always()
        run: /bin/bash tests/test_no_internal_codenames_in_customer_strings.sh

      # The two checks above guard the SHAPE of a string and the CONTENT of a
      # string. Neither asks whether the string the installer reads EXISTS.
      #
      # install.sh runs under `set -uo pipefail`. Reading an undefined variable
      # there is not a blank line, it is `unbound variable` and the shell dies,
      # so a forgotten catalogue entry stops a customer's install part-way
      # through. MEASURED: 940 distinct MSG_ references, 0 of them guarded with
      # ${VAR:-}, so all 940 are hard aborts.
      #
      # It has already happened: the browser-extension token block shipped
      # referencing two strings that were never added to the catalogue, well
      # below the `set -u` line. Nothing caught it, because `check-rule-09-
      # strings.sh` contains zero occurrences of `MSG_`.
      #
      # Exit 2 is CANNOT-RUN and fails this step deliberately: a gate that could
      # not look has not passed.
      - name: every MSG_ string install.sh reads is actually defined
        if: always()
        run: python3 scripts/verify_install_strings_bound.py
