name: The installer sends no Apple Events to Finder

# ============================================================================
# WALK-361. Andy hit this on the v1.0.57 launch walk, having reported it once
# before and seen it come back. That recurrence is the reason this workflow
# exists rather than just the fix.
#
# macOS raised, on a launch walk, to the person buying the product:
#
#   "OstlerInstaller" wants access to control "Finder". Allowing control will
#   provide access to documents and data in "Finder".
#   Ostler needs to ask for your administrator password to install Hub services.
#
# A documents-and-data request, explained by a sentence about passwords, to
# close a window.
#
# THE COPY WAS NEVER THE FIX AND MUST NOT BE PROPOSED AS ONE. macOS permits
# exactly ONE NSAppleEventsUsageDescription per app and stamps it on every
# Apple Events prompt regardless of target, so the string cannot be worded
# per dialog. The only fix is to not send the event.
#
# RUNS ON macos-14 DELIBERATELY. install.sh ships and executes on macOS, and
# /usr/bin/grep there is BSD, not GNU. A source check that green-lights on a
# GNU runner is not evidence about the host the artefact runs on.
# ============================================================================

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'gui/project.yml'
      - 'gui/OstlerInstaller/Info.plist'
      - 'tests/test_no_finder_appleevent.sh'
      - 'tests/TEST_WIRING.tsv'
      # A gate must trigger on changes to ITSELF, or it can be quietly
      # narrowed in a pull request that never runs it.
      - '.github/workflows/no-finder-appleevent.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same branch or PR.
  # NEVER cancels main: a cancelled main run is a gate that did not report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  no-finder-appleevent:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The test exits 2 (CANNOT-RUN) rather than 0 when its own positive
      # controls do not fire, so an unreadable install.sh or a broken pattern
      # can never be mistaken for "no Finder events found". Every zero it
      # reports is paired with a non-zero control measured on the same file in
      # the same run.
      - name: No Apple Events to Finder, and the usage string tells the truth
        run: bash tests/test_no_finder_appleevent.sh
