name: install-gui-contract

# Cross-component contract test for the install.sh <-> Swift GUI
# protocol.  Six v0.1->v0.4 PRs (#79, #81, #82, #83, #84, #87) each
# closed a missed handler between the bash emitter and the Swift
# decoder.  This workflow turns the pattern into a CI gate: any new
# protocol drift (unknown PROMPT kind, STEP_BEGIN id without a
# canonicalOrder entry, emission kind without a decoder arm) fails
# the build before a customer-shipping DMG inherits it.
#
# Companion files:
#   scripts/extract_install_protocol.py
#   gui/scripts/extract_gui_renderers.py
#   tests/test_install_gui_contract.py
#   tests/test_install_gui_contract_negatives.py

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'tests/test_dedupe_deps_reach_the_consumer_venv.sh'
      - 'install.sh.strings.en-GB.sh'
      - 'lib/progress_emitter.sh'
      - 'lib/write_pipeline_signals.py'
      - 'lib/ostler-model-fit.sh'
      - 'lib/settling_progress.sh'
      - 'gui/OstlerInstaller/**'
      - 'gui/project.yml'
      - 'scripts/extract_install_protocol.py'
      - 'scripts/check_install_sh_script_dir_coverage.py'
      - 'gui/scripts/extract_gui_renderers.py'
      - 'tests/test_install_gui_contract.py'
      - 'tests/test_install_gui_contract_negatives.py'
      - 'tests/test_installer_app_bundle_contents.sh'
      # A gate must trigger on changes to ITSELF, or it can be broken (or
      # quietly narrowed) in a PR that never runs it.
      - 'tests/test_bundle_phase_declares_every_copy.sh'
      - 'tests/test_ai_model_env_contract.sh'
      - 'tests/test_gui_progress_emitter.sh'
      - 'tests/test_pgrep_no_match_does_not_fabricate_a_done.sh'
      - 'tests/test_abort_still_reports_when_the_close_fails.sh'
      - 'tests/test_progress_bar_cannot_exceed_one_hundred.sh'
      - 'tests/test_total_steps_dynamic.sh'
      - 'tests/test_marker_payloads_never_reach_install_log.sh'
      # The terminal DONE invariant is held by construction at four call sites
      # and by no check. Watched by name, and lib/ too because the sentinel the
      # guards read is written there.
      - 'tests/test_every_terminal_done_is_exit_or_guarded.sh'
      - 'lib/progress_emitter.sh'
      - 'tests/test_install_log_follows_promotion.sh'
      - 'lib/ostler-ingest-slot.sh'
      - 'vendor/legal/**'
      - 'vendor/LICENSES/**'
      - 'vendor/THIRD_PARTY_NOTICES.md'
      # The needle in check_install_sh_script_dir_coverage.py is searched
      # against the WHOLE of gui/project.yml, so it keeps matching even when one
      # package's cp line is repointed elsewhere. This gate binds each package to
      # the source its OWN cp line names. Watched here alongside the coverage
      # gate it complements, and watched by name so editing it re-fires the only
      # workflow that runs it.
      - 'tests/test_bundled_package_comes_from_its_declared_source.py'
      - 'tests/test_every_script_install_sh_reads_is_bundled.py'
      - '.github/workflows/install-gui-contract.yml'

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate emissions manifest
        run: |
          set -euo pipefail
          python3 scripts/extract_install_protocol.py --out /tmp/emissions.json
          python3 -c "import json, sys; m=json.load(open('/tmp/emissions.json')); print(f'Emissions: {len(m[\"emissions\"])}')"

      - name: Validate handlers manifest
        run: |
          set -euo pipefail
          python3 gui/scripts/extract_gui_renderers.py --out /tmp/handlers.json
          python3 -c "import json, sys; m=json.load(open('/tmp/handlers.json')); print(f'Handlers: {len(m[\"handlers\"])}, prompt_kinds: {m[\"prompt_kinds\"]}')"

      - name: Run contract test (positive path)
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_install_gui_contract -v

      - name: Run contract test (negative-path self-tests)
        if: always()
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_install_gui_contract_negatives -v

      - name: Check ${SCRIPT_DIR}/X coverage (durable bundling contract gate)
        # The deep-dive audit (CM051_INSTALLER_DEEP_DIVE_FINDINGS_2026-05-22.md)
        # found 10+ install.sh probes against ${SCRIPT_DIR}/X that had no
        # matching postBuildScript in gui/project.yml. This gate prevents
        # the next buried-failure gap from reaching a customer retest by
        # asserting every probe is covered.
        run: |
          set -euo pipefail
          python3 scripts/check_install_sh_script_dir_coverage.py --mode ci

      - name: Check bundling phases declare every file they copy
        if: always()
        # The ${SCRIPT_DIR}/X gate above proves a file IS copied. It does not
        # prove Xcode knows about the copy. A file absent from a phase's
        # inputFiles/outputFiles is untracked for incremental builds, so
        # editing it may not dirty the phase and the .app keeps the PREVIOUS
        # copy -- green build, stale artefact, and the symptom ("my edit did
        # nothing") points at the edited file rather than the build system.
        # lib/settling_progress.sh shipped in exactly that state on 2026-08-07.
        #
        # SCOPE, STATED HERE BECAUSE MISREADING IT IS WHAT WENT WRONG (D662):
        # this parses gui/project.yml and ONLY gui/project.yml. It proves the
        # SPEC declares every copy. It cannot prove the tracked pbxproj -- the
        # file xcodebuild actually reads -- matches that spec. That comparison
        # needs xcodegen, so it lives in .github/workflows/pbxproj-sync.yml on
        # a macOS runner. Neither gate substitutes for the other.
        run: |
          set -euo pipefail
          bash tests/test_bundle_phase_declares_every_copy.sh

      - name: AI_MODEL writer/reader contract (#259 / D636)
        if: always()
        # install.sh picks a model per RAM tier and pulls THAT model; the
        # wiki-compiler container asks Ollama for OLLAMA_MODEL. They are joined
        # by writer -> ${AI_MODEL} reference -> QUOTED heredoc. Break any link
        # and it silently falls back to qwen3.5:9b, which is not pulled on
        # <=23GB Macs: ~2000 Ollama 404s in one compile and blank wiki pages,
        # with nothing failing loudly. Gated because it ships dark.
        run: |
          set -euo pipefail
          bash tests/test_ai_model_env_contract.sh

      - name: Emitter unit contract (marker routing, encoding, TTY parity)
        if: always()
        run: |
          set -euo pipefail
          bash tests/test_gui_progress_emitter.sh

      # #642: a pgrep no-match fabricated a TERMINAL DONE from inside a command
      # substitution's subshell, the GUI believed it and stopped prompting, and
      # the next prompt DEADLOCKED the install on a real box. Lives here because
      # the defect is only visible through the emitter + the ERR trap together.
      - name: A pgrep no-match must not fabricate a terminal DONE (#642)
        if: always()
        run: |
          set -euo pipefail
          bash tests/test_pgrep_no_match_does_not_fabricate_a_done.sh
          bash tests/test_total_steps_dynamic.sh

      # #640: the abort-close is fallible and sits BEFORE the guard it protects,
      # so a failure inside it destroyed the only terminal marker the run makes.
      - name: An abort must still report when its own step-close fails (#640)
        if: always()
        run: |
          set -euo pipefail
          bash tests/test_abort_still_reports_when_the_close_fails.sh

      # The bar the customer watches for the whole install had NO upper bound,
      # while the only other percentage in install.sh (the Ollama pull parser)
      # has clamped for months. TOTAL_STEPS is seeded by counting `progress "`
      # lines and then DECREMENTED at seven sites, so CURRENT_STEP overtakes it
      # and pct goes past 100 -- measured 37/35. The percentage is the smaller
      # half: EMPTY goes NEGATIVE, and a negative printf width is not an error,
      # it is the left-justify flag, so the bar silently renders wider than its
      # own declared width and nothing anywhere complains.
      - name: The progress bar cannot exceed 100% (#641 neighbour)
        if: always()
        run: |
          set -euo pipefail
          bash tests/test_progress_bar_cannot_exceed_one_hundred.sh

      - name: Marker payloads must not reach the durable install log
        if: always()
        # bin/operator-pii-scan.sh reads SOURCE and is green on this defect:
        # the leak is not in the source, it is in what the source PRODUCES.
        # install.sh folds stderr into the tee that appends to
        # ~/.ostler/logs/install.log, and gui_emit wrote every marker to
        # stderr, so prompt titles, help copy, the Contacts me-card
        # pre-fills and the recovery key were all persisted verbatim and
        # forever. CM051 #399 is the sharp case (three verbatim calendar
        # event titles in a help string, a third party's display name in a
        # prompt title).
        #
        # This gate drives the emitter through install.sh's OWN logging
        # construction -- extracted from install.sh, not reimplemented --
        # plants synthetic canaries it must find, and reads the log that
        # construction produced. Exit 2 is CANNOT-RUN and is not a pass.
        run: |
          set -euo pipefail
          bash tests/test_marker_payloads_never_reach_install_log.sh

      - name: INSTALL_LOG must follow the tree, and the append must be silent
        if: always()
        # Sibling of the gate above, and the mirror image of it. That one
        # proves marker payloads never reach the durable log. This one
        # proves the durable log still EXISTS to reach.
        #
        # Measured on a live v1.0.37 walk 2026-08-20: install.sh derived
        # INSTALL_LOG once while OSTLER_DIR was still the
        # /tmp/ostler-prelaunch-<pid> staging tree and never rebound it, so
        # the moment the tree was promoted the emitter's append started
        # failing. The [gui-marker] trace stopped dead at line 707 of 1397
        # and 267 "No such file or directory" lines took its place. The
        # whole second half of the install -- ingest, wiki compile,
        # pairing -- had no durable trace at all.
        #
        # Two causes, two arms. The rebind is executed for real out of
        # install.sh, and the redirection ordering is proved by running
        # BOTH forms: the arm asserts the pre-fix form still leaks, so a
        # control that stops reproducing the defect fails loudly instead
        # of going quietly green.
        run: |
          set -euo pipefail
          bash tests/test_install_log_follows_promotion.sh

      - name: Dedupe deps must reach the venv that imports them (#1137)
        if: success() || failure()
        run: |
          bash tests/test_dedupe_deps_reach_the_consumer_venv.sh

      - name: Run app-bundle byte-by-byte regression
        if: always()
        # Per locked memory feedback_silent_bail_regression_test_shape.
        # Each per-finding assertion pins the EXACT failure shape the
        # 2026-05-22 audit flagged so a regression is caught at CI rather
        # than at the customer's first install.
        run: |
          set -euo pipefail
          bash tests/test_installer_app_bundle_contents.sh

      # A NEEDLE FOUND ANYWHERE IN THE FILE DOES NOT BIND A PACKAGE TO A SOURCE.
      #
      # The coverage gate asks "is this leaf's declared source mentioned in
      # gui/project.yml", with a plain substring search over the whole file. The
      # needle for contact_syncer is 'vendor/cm041', which also appears on the
      # shared VENDOR_ROOT= assignment feeding four packages, so it keeps
      # matching after one package's cp line is repointed.
      #
      # MEASURED before this step existed: repointing contact_syncer's bundling
      # line to the repo root -- the exact shape of the incident where the root
      # copy shipped for six cuts with two modules missing -- left
      # check_install_sh_script_dir_coverage.py,
      # test_artefact_walk_stages_the_dmg_payload.sh and
      # test_bundle_phase_declares_every_copy.sh ALL at rc=0.
      #
      # This step resolves each cp source against the variables assigned in its
      # OWN script block and compares that. It refuses (exit 2) below ten
      # resolved bindings, so a parser that stopped matching cannot report a
      # clean run over an empty set.
      #
      # if: always() so an earlier red cannot mask it, and APPENDED LAST so no
      # existing step's position -- and therefore no existing step's immunity --
      # changes.
      - name: Every bundled package comes from the source it declares
        if: always()
        run: python3 tests/test_bundled_package_comes_from_its_declared_source.py

      # EVERY TERMINAL DONE MUST BE THE LAST THING A RUN EMITS.
      #
      # gui_done is NOT idempotent: OSTLER_DONE_EMITTED is written inside it
      # (progress_emitter.sh) and read only by the two trap handlers. So each of
      # the four call sites is safe for a DIFFERENT reason -- fail() exits, the
      # EXIT backstop and the ERR trap are sentinel-guarded, and gui_done ok is
      # the success terminal. The invariant is held BY CONSTRUCTION.
      #
      # A fifth call site added after a failure would emit DONE twice, the GUI
      # would key on the last, and a failed install could report ok. Nothing in
      # the repository would have noticed. The standing queue called this "the
      # TWO terminal DONE markers" and there are now FOUR, which is the drift
      # that makes a count untrustworthy and a check necessary.
      #
      # if: always() so an earlier red cannot mask it, appended last so no
      # existing step's immunity changes.
      - name: Every terminal DONE is an exit or a guarded trap
        if: always()
        run: bash tests/test_every_terminal_done_is_exit_or_guarded.sh
      # THE SAME CONTRACT, WALKED FROM THE OTHER END.
      #
      # The step above walks from the BUNDLER outward: does each bundled package
      # come from the source its own cp line names. This one walks from the
      # CALLER inward: for every ${OSTLER_DIR}/scripts/<file> install.sh reads,
      # is there a cp line that puts <file> there at all. A package bundled from
      # the wrong place and a file bundled from NOWHERE are different defects,
      # and the step above cannot see the second.
      #
      # MEASURED on archie2, 2026-09-05, on a run that ended DONE status=ok:
      #   WARN msg=Namespace migrator not found at
      #        ~/.ostler/scripts/migrate_graph_namespace.py; skipping
      # install.sh built that path itself and the bundle phase copied exactly
      # one file into scripts/, so the migration has never run on any customer
      # Mac. install.sh:24873 records that the same script previously "existed
      # and NOTHING CALLED IT" -- adding the caller without the bundler moved
      # the defect rather than closing it.
      #
      # It refuses (exit 2) if it finds zero script references, because
      # install.sh has read that directory for dozens of versions and a zero
      # would be a rotted pattern rather than a clean tree.
      - name: Every script install.sh reads is bundled where it reads it
        if: always()
        run: python3 tests/test_every_script_install_sh_reads_is_bundled.py
