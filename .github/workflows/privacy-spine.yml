name: privacy-spine

# THE FOUR DEFECTS THIS GATE PINS, and the one shape they shared.
#
# Each was a privacy or identity field that was WRITTEN correctly and then
# meant nothing, because the thing that was supposed to read it did not
# exist. A stamp is not an enforcement, and none of the four was asserted by
# any test -- every one of them could be reverted in a single character and
# the estate would have gone green.
#
#   1. calendars.json had no writer. Three references to the path in the
#      whole repo, all three inside the reader, so every imported calendar
#      event resolved to L3 and was withheld from the wiki, search and the
#      brief. Measured: 2 of 2 real Takeout calendar shapes buried.
#   2. ingest_calendar wrote no identifier triples, so the people it created
#      carried nothing to match on and were unmergeable forever. 900
#      identifier-less people measured on a real graph.
#   3. AI conversations shipped at L2 -- the one PUBLISHABLE level --
#      against a locked L3 contract, pinned in TWO places, so fixing one
#      alone would have been invisible on a real install.
#   4. retention_tier is stamped on every record and read by nothing.
#
# RUNNER: ubuntu. Every test here reads the vendored Python as logic or
# parses install.sh as text; none needs a macOS tool. The dependency set is
# the same one tests-unwired-sweep-al.yml installs for the vendored-module
# tests, for the same reason.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same branch/PR. NEVER cancels main or a
  # tag: a cancelled main run is a gate that did not report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  privacy-spine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python deps for the vendored-module tests
        # ostler_fda pwg_ingest (httpx/nameparser), cm041 identity_resolver
        # (rapidfuzz/httpx/phonenumbers), cm052 wire (pyyaml/httpx).
        run: python3 -m pip install --quiet httpx nameparser rapidfuzz phonenumbers pyyaml

      # Each test is an INDIVIDUAL step with the path and an execution verb on
      # one line. NOT entries in a `for t in ...` loop: verify_new_tests_are_wired.sh
      # needs both on the same line, and a path inside a loop body is invisible
      # to it -- the existing loop entries elsewhere are only grandfathered.
      #
      # if: always() on every step after the first. A red earlier in the job
      # would otherwise SKIP the rest, and a skipped check reads as "no
      # objection" -- which is the family of defect this workflow exists to
      # remove (ci-maskless, #1695).

      - name: An imported calendar is visible to the person who imported it
        run: python3 tests/test_an_unconfirmed_calendar_is_not_buried_forever.py

      # PREVIOUSLY UNWIRED, and honestly so: it was marked FIX-NEEDED in
      # tests-unwired-sweep-al.yml because the function it calls
      # (_person_uri_by_identifier_value) did not exist and ingest_calendar
      # returned neither people_created nor people_matched. Both now do, so
      # the marker is removed and the test is invoked here.
      - name: Calendar and mail ingest resolve a person before creating one
        if: always()
        run: python3 tests/test_calendar_attendee_resolve_before_create.py

      - name: Photo events reach the graph, and face names only with the opt-in
        if: always()
        run: python3 tests/test_photo_events_reach_the_graph.py

      - name: Photo events carry a city-level place name for the wiki's Photos here
        if: always()
        run: python3 tests/test_photo_events_carry_place_names.py

      # #2361: executed against pyoxigraph, the engine the product speaks to.
      - name: Install pyoxigraph for the display-name tier test
        if: always()
        run: python3 -m pip install --quiet pyoxigraph

      - name: Email-only correspondents get a provisional name, and names only move up
        if: always()
        run: python3 tests/test_email_only_people_get_a_provisional_name.py

      - name: AI conversations are private by default in BOTH pinning places
        if: always()
        run: python3 tests/test_ai_conversations_default_to_the_locked_privacy_level.py

      - name: The retention tier is decorative, says so, and stays measured
        if: always()
        run: python3 tests/test_the_retention_tier_is_written_and_read_by_nothing.py
