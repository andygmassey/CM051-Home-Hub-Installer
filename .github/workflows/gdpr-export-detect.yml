name: gdpr-export-detect

# Bulletproof GDPR-export detection (#657). Proves the signature-based detector
# finds exports regardless of name or whether they are still zipped, AND -- the
# load-bearing bit -- runs a DRIFT GUARD that fails if the copy embedded in
# install.sh (the quoted heredoc that actually ships in the DMG) has diverged
# from the canonical lib/ostler-detect-exports.sh. A guard that exists but does
# not run is the ships-dark trap; this wires it in.

on:
  pull_request:
    paths:
      - 'lib/ostler-detect-exports.sh'
      - 'tests/test_gdpr_export_detect.sh'
      - 'tests/test_f010_clt_wait_and_scan_budget.sh'
      - 'tests/test_export_detect_large_zip_behaviour.sh'
      - 'tests/test_unzip_every_archive_is_opened_or_reported.sh'
      - 'tests/test_chatgpt_export_detect_and_stage.sh'
      - 'vendor/cm052_ai_conversations/src/cm052/adapters/chatgpt_export.py'
      - 'install.sh'
      - '.github/workflows/gdpr-export-detect.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same workflow on the same branch/PR.
  # NEVER cancels main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  gdpr-export-detect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detector functional + drift guard
        run: bash tests/test_gdpr_export_detect.sh

      # if: always() -- ci-maskless: without it a red in the step above SKIPS
      # this one, and a skipped test reports nothing rather than a failure.
      - name: Every archive the scan finds is opened, or reported (2026-09-12)
        if: always()
        run: bash tests/test_unzip_every_archive_is_opened_or_reported.sh

      # F010: CLT wait never aborts; the scan has a depth cap, a time budget
      # and skips nested home-folder backups. Mutants inside the test.
      - name: CLT wait never aborts + bounded export scan (F010)
        if: always()
        run: bash tests/test_f010_clt_wait_and_scan_budget.sh

      # ChatGPT (2026-11-14): detected by its conversations.json + chat.html
      # pair, staged into the CM052 drop folder, read by the real adapter.
      - name: ChatGPT export detected, staged and read by CM052
        if: always()
        run: bash tests/test_chatgpt_export_detect_and_stage.sh
