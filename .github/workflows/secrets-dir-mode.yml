name: secrets-dir-mode
# THE SECRETS DIRECTORY MUST BE 0700, NOT JUST THE FILE INSIDE IT.
#
# _ostler_write_store_curl_config writes the credential that the whole
# 8044/8144 close depends on: if a second local account can read it, closing
# the port buys nothing (#549/#550). The FILE was always correct -- umask 0077
# before the truncate, inside the subshell. The DIRECTORY was not, because the
# mkdir sat outside that subshell with no mode.
#
# WHY THIS RUNS AS ITS OWN JOB rather than riding an existing suite: the test
# asserts a FILESYSTEM MODE, so it is meaningful only on a runner that has not
# been given a permissive umask by an earlier step. Isolating it keeps the
# thing it measures from being set by a neighbour.
#
# The test itself carries the mutation proof: it goes RED against the original
# `mkdir -p ... 2>/dev/null || true` AND against `mkdir -p -m 700 ...`, which
# is the tempting fix that cannot work here -- reaching that mkdir proves the
# directory already exists, so -m is never consulted.
on:
  pull_request:
    paths:
      - 'install.sh'
      - 'scripts/tests/test_store_curl_conf_permissions.sh'
      - '.github/workflows/secrets-dir-mode.yml'
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'scripts/tests/test_store_curl_conf_permissions.sh'
      - '.github/workflows/secrets-dir-mode.yml'
concurrency:
  group: secrets-dir-mode-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  secrets-dir-mode:
    runs-on: macos-latest
    # macOS on purpose: the test reads modes with `stat -f '%OLp'`, which is the
    # BSD spelling. On ubuntu that flag means something else entirely and the
    # assertions would compare against empty strings -- passing for the wrong
    # reason, which is worse than failing.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: secrets/ is 0700 and the credential file is 0600
        run: /bin/bash scripts/tests/test_store_curl_conf_permissions.sh
