name: forget-reaches-every-graph

# "Forget this person" must actually forget them, and the readers must be
# able to see the graph CM048 writes into.
#
# CM048 writes a person's facts, relationship signals, outstanding todos
# and conversation links into the NAMED graph `urn:ostler:user/<id>`.
# Oxigraph runs WITHOUT `--union-default-graph` (install.sh) and
# identity_resolver/compartment.py REQUIRES it stay off, so an unqualified
# SPARQL query or DELETE reaches the DEFAULT graph ONLY.
#
# Two consequences, both measured on a live Hub:
#
#   1. GDPR Art. 17 erasure under-deleted. A synthetic person seeded with
#      4 triples in each graph was "forgotten": the endpoint returned
#      forgotten:true, stores_purged:['oxigraph','qdrant'], and all 4
#      named-graph triples survived. The product accepted a deletion
#      request and did not honour it.
#   2. Five readers were blind to the named graph.
#      /api/v1/commitments returned count 0 while the store held 67
#      OutstandingTodo triples.
#
# This trap has now been found FOUR times in the estate. topic_writer.py
# and last_contact_updater.py each hit it, documented it in their own
# docstring, and fixed only their own surface -- which is exactly how it
# stayed systemic. The fix is therefore ONE shared helper in
# compartment.py, and this gate asserts there is no second private copy.
#
# The gate is mutation-tested in-file AND was driven red three ways before
# being wired: pre-fix code exits 2 CANNOT-RUN (the helper is absent), a
# partial fix exits 2, and a realistic regression -- the builder reverted
# to the bare default-graph form -- exits 1 with 5 named failures. The
# real tree exits 0. Three states, all demonstrated, not assumed.

on:
  pull_request:
    paths:
      - 'vendor/cm041/assistant_api/ical-server.py'
      - 'tests/test_forget_does_not_claim_an_erasure_it_did_not_do.py'
      - 'vendor/cm041/identity_resolver/compartment.py'
      - 'vendor/cm041/meeting_syncer/brief.py'
      - 'vendor/cm048_pipeline/src/candidates.py'
      - 'tests/test_a_forget_must_reach_every_named_graph.py'
      # THE THIRD HALF, and the one the other two cannot see. They test the
      # graph SCOPE of the delete and the honesty of its REPORT; both take the
      # delete PATTERN as given, and the pattern is where rows 960 and 2217 live.
      - 'tests/test_a_forget_erases_the_fact_not_just_the_link.py'
      - '.github/workflows/forget-reaches-every-graph.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same branch or PR.
  # NEVER cancels main: a cancelled main run is a gate that did not report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  forget-reaches-every-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Exits 2 (CANNOT-RUN), never 0, if the shipped helper or the
      # erasure builder cannot be found. A check that could not run has
      # not passed.
      - name: A forget reaches every named graph, and readers span them
        run: python3 tests/test_a_forget_must_reach_every_named_graph.py
      - name: A forget that found nobody must not report that it erased them
        if: always()
        # The workflow above proves the DELETE reaches every graph (#960's
        # SPARQL half). This proves the REPORTING half, which survived that
        # fix: a lookup miss used to return already_forgotten=true, so a
        # customer exercising a right the product advertises was told it was
        # done on a person still fully present. Measured on the box
        # 2026-09-18: five triples, HTTP 200, "already_forgotten": true, five
        # triples still there.
        run: python3 tests/test_forget_does_not_claim_an_erasure_it_did_not_do.py

      - name: A forget erases the sentence, not only its link to a person
        if: always()
        # The two above mutate the GRAPH CLAUSE and the REPORT. This one mutates
        # the DELETE PATTERN, which is the surface rows 960 and 2217 name and the
        # one surface neither of the others touches. It lifts the shipped
        # _forget_person_update by AST and runs it against a synthetic store.
        #
        # It keeps BOTH predicates on purpose. A person-keyed count reads 0 in
        # the broken world AND the fixed one, because the second clause removes
        # every mention; that is why this defect was reported closed. Only a
        # content-keyed count can tell them apart, and this asserts they disagree.
        #
        # It exits 0 outside a cut and FAILS under OSTLER_CUT_IN_PROGRESS=1. The
        # fix belongs upstream in CM041 (row 2218: the vendored copy is 1,151
        # lines ahead of CM041 main, so a re-vendor destroys shipped behaviour),
        # so CM051 owes a refusal rather than a graft.
        run: python3 tests/test_a_forget_erases_the_fact_not_just_the_link.py
