# reclassify-subject-names-wired -- the CM051 #2544 one-off repair is invoked
# by install.sh, logs its counts, warns on failure and never aborts the
# install. It shipped DARK in the first push of #2596: registered in the
# vendored CLI, called by nothing. The test runs the REAL install.sh block
# under set -Eeuo pipefail with a stubbed binary.
name: reclassify-subject-names-wired

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'vendor/cm021/src/cli.py'
      - 'tests/test_reclassify_subject_names_is_wired.sh'
      - '.github/workflows/reclassify-subject-names-wired.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  reclassify-subject-names-wired:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: install.sh invokes reclassify-subject-names, logs counts, warns, never aborts
        run: bash tests/test_reclassify_subject_names_is_wired.sh
