name: enrichment-reaches-corpus

# Regression gate for #746, measured on a real install 2026-08-17.
#
# `enrich --all` processed 62 of 7,773 preferences and enriched 1, because
# --all meant three hardcoded category strings while the dispatch table held
# 27. Films failed instantly for want of a TMDB key we do not ship. And one
# book lookup sent openlibrary.org a 400-character LinkedIn recommendation
# about a named individual, as a search query, because a classifier put it
# in `book`.
#
# That last one is why this gate exists at PR time rather than as a nightly:
# it guards an EGRESS boundary. The predicate that stops prose leaving the
# Mac is proved red along each of its three axes separately, because the
# real fixture trips all three and disabling any two proves nothing.
#
# Companion test: tests/test_enrichment_reaches_the_corpus.sh

on:
  pull_request:
    paths:
      - 'vendor/cm019_preferences/services/enrich/**'
      - 'install.sh'
      - 'install.sh.strings.en-GB.sh'
      - 'tests/test_enrichment_reaches_the_corpus.sh'
      - '.github/workflows/enrichment-reaches-corpus.yml'
      # Watched because the step below RUNS it. A run: without a
      # matching path entry means editing this file does not trigger
      # the only workflow that checks it.
      - 'tests/test_a_truncated_category_is_not_reported_complete.py'
      - 'tests/test_no_unbounded_enrich_invocation.sh'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Never cancel main or a tag: a cancelled main run is a gate that did not
  # report, and cut.yml fires on 'v1.0.*' tags.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  enrichment-reaches-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the enrichment tree's own declared dependencies
        # From the SHIPPED requirements file rather than a hand-picked list.
        # Hand-picking is what went wrong while writing this gate: naming
        # pydantic-settings missed httpx, which missed aiolimiter. The file
        # the product installs cannot drift from what the product imports.
        #
        # Without them the category-derivation assertions SKIP and print
        # what went uncovered rather than passing quietly.
        run: python3 -m pip install --quiet -r vendor/cm019_preferences/requirements.txt

      - name: Enrichment reaches the corpus, and only sends what it should
        run: bash tests/test_enrichment_reaches_the_corpus.sh

      - name: A sweep that spent its allowance must not report COMPLETE
        # Behavioural, not a grep: enrich_all is stubbed and enrich_categories
        # is really run, so what is measured is the merge and the flag that
        # cli.py:685 turns into PAUSED or COMPLETE. Carries its own red proof
        # by re-inserting the suppression via AST into a second copy of the
        # real module.
        #
        # if: always() because this is an INDEPENDENT axis from the step
        # above. That one asks whether enrichment reaches the corpus at all;
        # this one asks whether an unfinished pass admits it. A red on the
        # first must not hide the second, which is the exact failure the
        # claim-separation workflow was already bitten by.
        if: always()
        run: python3 tests/test_a_truncated_category_is_not_reported_complete.py

      - name: No enrichment invocation may run without an allowance
        # The ten-minute install stall. bin/ostler-import ran `enrich --all`
        # with no --budget-seconds, so it took the 600s option default that
        # only the agent's plist ever sets. Scans install.sh AND the
        # generated importer, because the call lives in a quoted heredoc and
        # a flag can be present in the generator while absent from what the
        # customer runs. if: always() -- independent axis again.
        if: always()
        run: bash tests/test_no_unbounded_enrich_invocation.sh
