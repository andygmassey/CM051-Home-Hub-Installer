name: reset-uninstall-honesty

# ttywalk.sh --reset must not fall through its uninstaller search in silence.
#
# The reset looks for a shipped uninstaller at three paths. install.sh writes
# exactly ONE uninstaller, ~/.ostler/bin/ostler-uninstall (install.sh:19984,
# chmod at :20395), and a repo-wide find for uninstall*.sh returns nothing, so
# on a box installed from this DMG all three paths name a file that does not
# exist. The loop matched nothing, no break fired, and the run read as "reset
# done" when no uninstall had happened.
#
# That matters because the store teardown -- docker compose down -v over
# qdrant_data, oxigraph_data, redis_data, wiki-docs and vane_data -- lives
# INSIDE that uninstaller. A reset that skips it leaves the graph, the vectors
# and the compiled wiki carried over from the previous install, so every
# store-reading probe measures history rather than the artefact under test.
# Walk 10 was recorded as a fresh --reset walk on that basis.
#
# This gate asserts the skip is ANNOUNCED. It deliberately does NOT assert that
# the real uninstaller path is searched: adding it would make the next walk
# wipe stores that are the subject of an open investigation, and that is an
# operator decision rather than a side effect of a logging fix.
#
# ubuntu-latest is correct: the test reads ttywalk.sh and runs one extracted,
# size-checked block against a temporary HOME. It never ssh-es anywhere.

on:
  pull_request:
    paths:
      - 'scripts/ttywalk.sh'
      - 'tests/test_a_walk_can_ask_for_a_fresh_graph.sh'
      - 'tests/test_reset_says_when_it_did_not_uninstall.sh'
      - 'tests/test_a_volume_count_is_not_a_wiped_box.sh'
      - 'scripts/dev-wipe-studio.sh'
      - 'tests/test_a_dev_wipe_verdict_is_not_inverted.sh'
      - '.github/workflows/reset-uninstall-honesty.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same branch or PR.
  # NEVER cancels main: a cancelled main run is a gate that did not report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  reset-uninstall-honesty:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Opens with a control: if the uninstaller search loop is not in
      # ttywalk.sh the test exits 2 (CANNOT-RUN), because every assertion
      # below would otherwise be vacuous.
      #
      # It extracts the guarded block by anchors, CHECKS ITS SIZE before
      # running it, and runs it as its own script against a temporary HOME --
      # never sources it. An extraction whose end anchor failed would
      # otherwise execute the rest of the harness.
      #
      # One limb guards the trap that produced this block: the reset body is
      # passed to ssh inside a SINGLE-QUOTED string, so a single apostrophe
      # closes it and ttywalk.sh dies at EOF.
      #
      # Mutation-tested three ways: reverting ttywalk.sh (rc=2, CANNOT-RUN),
      # an apostrophe in the block (rc=1, and it also stops parsing), and
      # deleting the announcement (rc=1).
      - name: A reset that skipped the uninstall announces it
        run: bash tests/test_reset_says_when_it_did_not_uninstall.sh

      # --wipe-stores is the ONLY way a walk can hold the box state still.
      # `if: always()` so an earlier red does not delete this measurement.
      - name: A walk can ask for a fresh graph, and the wipe proves itself
        if: always()
        run: /bin/bash tests/test_a_walk_can_ask_for_a_fresh_graph.sh

      # The sibling above measures DOCKER VOLUMES and nothing else, which is
      # how a box holding 42M of carried-over content under ~/Documents/Ostler
      # could be printed as WIPE CONFIRMED. This limb measures the FILESYSTEM,
      # and carries the positive control the #1592 gate asks for: on a box
      # where neither root existed BEFORE the wipe, a zero residue count is
      # measuring the wrong place and must not read as clean.
      #
      # `if: always()` for the same reason as the sibling: an earlier red must
      # not delete this measurement.
      - name: A docker volume count is not a wiped box
        if: always()
        run: /bin/bash tests/test_a_volume_count_is_not_a_wiped_box.sh

      # Same subject from the other end: the DEV wipe. Its verdict was
      # inverted -- four bare `ls PATH 2>&1 | head -1` lines under
      # `set -euo pipefail`, so a clean wipe aborted on the first check and
      # exited 1 while a wipe that removed nothing printed all four and
      # exited 0. It also left all five store volumes standing, and removed
      # ~/.ostler (where docker-compose.yml lives) first, destroying the only
      # supported route to them.
      #
      # `if: always()` for the same reason as the siblings: an earlier red
      # must not delete this measurement.
      - name: A dev wipe verdict is not inverted
        if: always()
        run: /bin/bash tests/test_a_dev_wipe_verdict_is_not_inverted.sh

