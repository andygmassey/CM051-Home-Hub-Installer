name: colima-autostart

# Colima holds the entire data tier. A reboot that does not start it takes
# Qdrant, Oxigraph, Redis, Vane, wiki-site and store-proxy down with it, and
# the customer's wiki with those.
#
# ============================================================================
# WHAT WAS BROKEN
# ============================================================================
#
# Measured on a v1.0.36 install, 2026-08-18:
#
#   brew services list                -> colima: none
#   LaunchAgents mentioning colima    -> none of the 23 installed
#   grep "colima start" ~/.ostler/bin ~/.ostler/services -> empty
#
# The daemon owns Colima's start by design (v1.0.10 Group C, 6723acc): a bare
# LaunchAgent has no Full Disk Access, so a LaunchAgent-spawned Colima cannot
# mount ~/Documents, and install.sh bind-mounts
# ${OSTLER_WIKI_DIR:-${HOME}/Documents/Ostler/Wiki} into wiki-site and
# wiki-compiler. That design is right. Two things around it were not:
#
#   1. install.sh:8347 claimed "Upgrade cleanup of any pre-existing
#      com.ostler.colima agent lives in the LaunchAgent teardown section
#      below". It does not. The only bootout of that label sits inside the
#      `cat > ostler-uninstall <<'UNINSTALLEOF'` heredoc, so install.sh WRITES
#      it into the uninstaller and never RUNS it. An upgraded box kept the
#      FDA-less agent, racing the daemon.
#
#      🔴 READ THAT PARAGRAPH IN THE PAST TENSE. IT SAYS "It does not" AND IT
#      WAS ALREADY FIXED WHEN IT WAS WRITTEN. Both the allegation and its
#      repair landed in the SAME COMMIT, 378a93f (#842, 2026-08-18) -- the
#      commit that created this workflow. `git log --diff-filter=A` on this
#      file and `git log -1 378a93f` return the same sha.
#
#      MEASURED 2026-08-23 on origin/main. install.sh section 3.2b, "Remove
#      any stale FDA-less Colima LaunchAgent", runs at INSTALL time and is
#      nowhere near the uninstaller heredoc. It does `launchctl bootout`, then
#      `rm -f`, then RE-CHECKS the file and warns if it survived.
#      tests/test_colima_autostart_mechanism.sh asserts that placement
#      directly, at the line that requires a removal OUTSIDE the heredoc.
#
#      AND install.sh:8347 IS NOW `fi  # end of SKIP_PHASE2 check`. The line
#      number drifted. A LINE NUMBER IN A COMMENT IS A CLAIM WITH AN EXPIRY
#      DATE, and this one expired into an unrelated `fi`.
#
#      THE COST WAS REAL AND IT WAS PAID ON 2026-08-23. This paragraph was
#      relayed to the release manager as a live finding, on this file's word
#      rather than a measurement, and cost a round trip to refute. That is why
#      it is corrected here rather than deleted: the wrong text and the reason
#      it was wrong are worth more together than a clean file.
#
#   2. Nothing asserted the mechanism at all. There was no test in this repo
#      that Colima had an autostart, that the agent owning it was well-formed,
#      or that a bare colima agent was not being created.
#
# ============================================================================
# WHAT THIS GATE CAN AND CANNOT SAY
# ============================================================================
#
# It asserts the MECHANISM is present and well-formed. It does NOT assert that
# a reboot starts Colima, because that needs a real power cycle on real
# hardware. The guard says so in its own output rather than letting a green
# tick imply it. A gate that overclaims is how this defect survived three
# green lights in the first place.
#
# ============================================================================
# WHY macos
# ============================================================================
#
# The guard lints the rendered LaunchAgent with `plutil`, which is the repo's
# convention (install.sh:300, tests/test_install_daily_briefs.sh:209) and is
# macOS-only. It falls back to a plistlib parse where plutil is absent, but
# the installer only ever runs on macOS, so the gate runs where the code runs
# and gets the real parser rather than the fallback.

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'install.sh.strings.en-GB.sh'
      - 'assistant-agent/launchd/**'
      - 'tests/test_colima_autostart_mechanism.sh'
      - 'tests/TEST_WIRING.tsv'
      - '.github/workflows/colima-autostart.yml'
      # Watched because the step below RUNS it. A run: without a
      # matching path entry means editing this file does not trigger
      # the only workflow that checks it.
      - 'tests/test_colima_start_retry.sh'
      # Same reason. #1208's guard covers the port preflight that runs
      # immediately before these same containers start.
      - 'tests/test_port_preflight_covers_published.sh'
      # #567: recognising our own colima forward runs in the same preflight.
      - 'tests/test_port_preflight_recognises_own_colima_567.sh'
      # Same reason again. Editing the sudo-gate test must trigger the only
      # workflow that runs it, or the test can rot unnoticed while reporting
      # green on every push that does not happen to touch install.sh.
      - 'tests/test_sudo_gate_accepts_passwordless_sudo.sh'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same branch or PR.
  # NEVER cancels main: a cancelled main run is a gate that did not report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  autostart-mechanism:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: The Colima autostart mechanism exists and is well-formed
        run: bash tests/test_colima_autostart_mechanism.sh

      # if: always() so a failure above cannot silence this one. The retry
      # gate around the install-time `colima start` is a different failure
      # from the login-time one and was already UNWIRED (TEST_WIRING.tsv:45),
      # which is how a Colima defect reached a customer with a test sitting
      # in the repo that never ran.
      - name: The install-time colima start still retries
        if: always()
        run: bash tests/test_colima_start_retry.sh

      # #1208. The port preflight runs immediately before these containers
      # start, and it was blind by construction: `lsof -i :PORT` run by a
      # non-root user cannot see a listener owned by another uid, so on a
      # two-account Mac every port read GREEN while another human's services
      # held them. It also only checked 4 of the 7 ports the compose
      # publishes -- 8044, the wiki, was one of the three it never looked at.
      #
      # macos-14 matters here: the probe is netstat/lsof, and BSD and GNU
      # disagree. A gate for this that ran on ubuntu would be measuring a
      # different operating system from the one the customer installs on.
      #
      # `if: always()` for the same reason as the steps above (CM051 #656):
      # an earlier limb's failure must not delete this measurement.
      - name: Assert the port preflight is owner-blind and covers every published port (#1208)
        if: always()
        run: bash tests/test_port_preflight_covers_published.sh

      # #567: the same preflight must recognise our OWN colima store forward and
      # continue, without waving through a foreign one. Both signals, residual named.
      - name: Assert the port preflight recognises our own colima forward (#567)
        if: always()
        run: bash tests/test_port_preflight_recognises_own_colima_567.sh

      # The sudo pre-flight must accept a Mac where sudo already works without
      # a password, and still refuse one where it does not work at all. Found
      # on the 2026-08-29 box walk: a bare `sudo -v` refused an account whose
      # every privileged call was already passwordless, so the install died on
      # ERR-04-SUDO-DENIED having never attempted the thing it wanted to do.
      #
      # macos-14 matters, for the same reason the port preflight above needs
      # it: sudo's `-v` semantics are what is under test, and the customer only
      # ever meets them on macOS.
      #
      # `if: always()` so an earlier limb's failure cannot delete this
      # measurement (CM051 #656).
      - name: Assert the sudo gate accepts passwordless sudo (#1247)
        if: always()
        run: bash tests/test_sudo_gate_accepts_passwordless_sudo.sh

      - name: Both parse under bash 3.2-compatible syntax
        if: always()
        run: |
          bash -n tests/test_colima_autostart_mechanism.sh
          bash -n tests/test_colima_start_retry.sh
          bash -n tests/test_port_preflight_covers_published.sh
          bash -n tests/test_port_preflight_recognises_own_colima_567.sh
          bash -n tests/test_sudo_gate_accepts_passwordless_sudo.sh
          bash -n install.sh
          bash -n install.sh.strings.en-GB.sh
