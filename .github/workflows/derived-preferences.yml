name: derived-preferences

# "What you like" HAS A PRODUCER (smart-prefs, build after v1.0.108).
#
# The wiki page (CM044 what_you_like) and the assistant tool
# (pwg_derived_preferences) read the derived named graph
# https://schema.ostler.ai/derived/graph/preferences, and nothing on a box ever
# wrote it: the CM019 derive engine was not vendored and nothing scheduled it.
# Three tests, three independent axes, so each step is if: always():
#
#   scheduled  the REAL install.sh _install_*_agent functions, run in a sandbox
#              HOME, generate a LaunchAgent whose wrapper invokes the vendored
#              derive_runner (RED on the pre-change install.sh: the generated
#              set was com.ostler.enrich + dedupe-catchup only).
#   writes     the REAL runner -> engine -> writer -> pyshacl gate writes
#              pwg:DerivedPreference nodes into pyoxigraph from a synthetic
#              fixture graph; a failed reader and a SHACL refusal keep the
#              prior graph; a below-floor fixture is the red control.
#   doctor     the Doctor row distinguishes every state and knows every
#              outcome the shipped runner can write.
#
# Exit 2 is CANNOT-RUN and fails the step.

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'vendor/cm019_preferences/services/enrich/src/derive/**'
      - 'vendor/cm019_preferences/services/enrich/src/derive_runner.py'
      - 'vendor/cm019_preferences/services/common/strength.py'
      - 'vendor/cm019_preferences/ontology/**'
      - 'vendor/cm019_preferences/requirements.txt'
      - 'vendor/doctor/agent/derived_preferences_status.py'
      - 'vendor/doctor/agent/web_ui.py'
      - 'tests/test_derive_preferences_is_scheduled.sh'
      - 'tests/test_derive_is_kicked_once_after_install_and_upgrade.sh'
      - 'tests/test_upgrade_refreshes_cm019_and_installs_the_derive_agent.sh'
      - 'tests/test_upgrade_refreshes_assistant_api_and_context_refresh.sh'
      - 'tests/test_upgrade_payload_carries_what_the_upgrade_refreshes.sh'
      - 'gui/Makefile'
      - 'tests/test_cold_staged_trees_and_agents_have_an_upgrade_path.py'
      - 'scripts/upgrade_parity.tsv'
      - 'tests/test_derived_prefs_probe_is_run_by_the_walk.sh'
      - 'scripts/box_walk_probes/**'
      - 'scripts/walk_promote_scope.tsv'
      - 'tests/test_derive_engine_writes_a_derived_preference.py'
      - 'tests/test_vendored_derived_route_privacy_level.py'
      - 'vendor/cm041/assistant_api/derived_preferences.py'
      - 'tests/test_vendored_derive_covers_all_of_life.py'
      - 'tests/test_vendored_stated_preferences_reach_the_derive_engine.py'
      - 'tests/test_vendored_stated_transcripts_reach_the_derive_engine.py'
      - 'tests/test_stated_model_tick_yields.sh'
      - 'scripts/ostler-stated-model-tick.sh'
      - 'tests/test_vendored_derive_endpoint_mixes_categories.py'
      - 'tests/test_vendored_derive_tiers_and_rollup.py'
      - 'tests/test_vendored_food_evidence_reaches_smart_preferences.py'
      - 'tests/test_dietary_is_never_surfaced.py'
      - 'vendor/cm059_editor/compiler/project_preferences.py'
      - 'vendor/cm059_editor/compiler/interest_profile.py'
      - 'vendor/cm019_preferences/services/ingest/src/parsers/food_evidence.py'
      - 'vendor/ostler_fda/pwg_ingest.py'
      - 'tests/test_vendored_derive_patterns.py'
      - 'tests/test_vendored_linkedin_career_reaches_the_derive_engine.py'
      - 'tests/test_vendored_derive_scroll_carries_privacy_level.py'
      - 'vendor/cm019_preferences/services/enrich/src/privacy_gate.py'
      - 'vendor/cm019_preferences/services/ingest/src/parsers/linkedin.py'
      - 'vendor/cm019_preferences/services/ingest/src/parsers/**'
      - 'vendor/ostler_fda/pwg_ingest.py'
      - 'tests/test_ingest_contract.py'
      - 'tests/ingest_contract_registry.py'
      - 'tests/test_doctor_shows_derived_preferences_status.py'
      - 'vendor/cm019_preferences/services/enrich/src/cli.py'
      - 'vendor/cm019_preferences/services/enrich/src/enricher.py'
      - 'vendor/cm019_preferences/services/enrich/src/hierarchy.py'
      - 'vendor/cm019_preferences/services/common/recency.py'
      - 'vendor/cm019_preferences/services/ingest/src/minors.py'
      - 'vendor/cm019_preferences/services/ingest/src/pipeline.py'
      - 'tests/test_vendored_qid_pass_reaches_the_thematic_rollup.py'
      - '.github/workflows/derived-preferences.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  derived-preferences:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: A LaunchAgent the installer writes runs the derive engine
        if: always()
        run: bash tests/test_derive_preferences_is_scheduled.sh
      - name: An upgraded 116-shaped box gets the cm019 tree, its requirements and the derive agent
        if: always()
        run: bash tests/test_upgrade_refreshes_cm019_and_installs_the_derive_agent.sh
      - name: An upgraded box gets the new assistant_api (derived route) and context-refresh, with rollback
        if: always()
        run: bash tests/test_upgrade_refreshes_assistant_api_and_context_refresh.sh
      - name: The upgrade payload carries every tree the upgrade refreshes (gui/Makefile stage-payload)
        if: always()
        run: bash tests/test_upgrade_payload_carries_what_the_upgrade_refreshes.sh
      - name: RATCHET, every cold-staged tree and agent has an upgrade path or a recorded decision
        if: always()
        run: python3 tests/test_cold_staged_trees_and_agents_have_an_upgrade_path.py
      - name: The derive agent is kicked once after install and after upgrade
        if: always()
        run: bash tests/test_derive_is_kicked_once_after_install_and_upgrade.sh
      - name: The vendored engine writes pwg:DerivedPreference nodes from a graph
        # pyoxigraph is test-only (the Hub runs Oxigraph in a container);
        # the other three are the shipped requirements the writer imports.
        if: always()
        run: |
          python3 -m pip install --quiet 'pyoxigraph>=0.5.11,<0.6' 'pyyaml>=6.0' 'rdflib>=7.0.0' 'pyshacl>=0.25.0'
          python3 tests/test_derive_engine_writes_a_derived_preference.py
      - name: The vendored registry derives across all of life, not only films
        # Tv, music, books, podcasts, topics, sites, news, food, places and
        # brands, each with an under-gate control and a dropped-row mutant.
        if: always()
        run: |
          python3 -m pip install --quiet 'pyyaml>=6.0' 'rdflib>=7.0.0' 'pyshacl>=0.25.0'
          python3 tests/test_vendored_derive_covers_all_of_life.py
      - name: Types before things (tiers) and rollup into broad groups
        if: always()
        run: |
          python3 -m pip install --quiet 'pyyaml>=6.0'
          python3 tests/test_vendored_derive_tiers_and_rollup.py
      - name: The vendored derived route passes privacy_level and never serves L3
        # Real in-memory pyoxigraph store; L3 and unparseable levels dropped.
        if: always()
        run: |
          python3 -m pip install --quiet 'pyoxigraph>=0.5.11,<0.6'
          python3 tests/test_vendored_derived_route_privacy_level.py
      - name: Food evidence reaches smart preferences (restaurants, cuisines, what you buy)
        # ingest_food stages only the claimed extracts, the parser output derives
        # through the vendored registry, a diet signal stays private, and the OSM
        # lookup makes zero requests unless the owner accepted enrichment.
        if: always()
        run: |
          python3 -m pip install --quiet 'pyyaml>=6.0' aiofiles beautifulsoup4 pydantic pydantic-settings httpx aiolimiter click phonenumbers nameparser
          python3 tests/test_vendored_food_evidence_reaches_smart_preferences.py
      - name: Grocery diet signals are never surfaced (ratchet on the dietary category)
        # No reader row, derive code, editor/Front Page code or brief code reads the
        # category; the projector drops it; the scanner is proven red on a fake row.
        if: always()
        run: |
          python3 -m pip install --quiet 'pyyaml>=6.0'
          python3 tests/test_dietary_is_never_surfaced.py
      - name: What the owner says in conversations reaches the derive engine
        # CM048 preference facts -> stated evidence with polarity; coffee x3 vs x1,
        # sichuan/cantonese as two opposite nodes under the shared cuisine keys, a
        # friend's taste excluded, no message text, a dropped-row mutant, real SHACL.
        if: always()
        run: |
          python3 -m pip install --quiet 'pyyaml>=6.0' 'rdflib>=7.0.0' 'pyshacl>=0.25.0'
          python3 tests/test_vendored_stated_preferences_reach_the_derive_engine.py
      - name: The owner's own lines in extracted transcripts reach the derive engine
        # Same privacy filters as the fact path (L3, deceased, minors; L2 admitted and
        # inherited), owner lines only, quoted/forwarded/other people's tastes rejected,
        # counts and polarity only, no message database opened, tier-model stage order.
        if: always()
        run: |
          python3 -m pip install --quiet 'pyyaml>=6.0'
          python3 tests/test_vendored_stated_transcripts_reach_the_derive_engine.py
      - name: The stated-preference model stage yields to chat (tier defer, slot, tier model only)
        # DISABLED BY DECISION (precision 33% on 6 graded hits); the wrapper's
        # guarantees are pinned so enabling it later cannot skip them.
        if: always()
        run: bash tests/test_stated_model_tick_yields.sh
      - name: Trend, say-vs-do contradiction and time-of-day context reach the graph
        # Real runner, real writer and SHACL gate, pyoxigraph. Red control: the
        # same run with the derivers unregistered writes none of the fields.
        if: always()
        run: |
          python3 -m pip install --quiet 'pyoxigraph>=0.5.11,<0.6' 'pyyaml>=6.0' 'rdflib>=7.0.0' 'pyshacl>=0.25.0'
          python3 tests/test_vendored_derive_patterns.py
      - name: The endpoint's top-N interleaves by category
        if: always()
        run: python3 tests/test_vendored_derive_endpoint_mixes_categories.py
      - name: The owner's LinkedIn career reaches the derive engine
        if: always()
        run: |
          python3 -m pip install --quiet 'pyyaml>=6.0' aiofiles beautifulsoup4 pydantic pydantic-settings
          python3 tests/test_vendored_linkedin_career_reaches_the_derive_engine.py
      - name: A derive reader's scroll carries the privacy level, so L3 is refused as L3
        if: always()
        run: |
          python3 -m pip install --quiet 'pyyaml>=6.0'
          python3 tests/test_vendored_derive_scroll_carries_privacy_level.py
      - name: The shipped enrich command fills topic QIDs behind consent, P9 and P10, and derive writes the theme
        # T0i/T0j: python -m services.enrich.src.cli enrich --all from the
        # vendored tree, then derive_runner over pyoxigraph; gated items
        # (sensitive, minor, L3, never-read category) are never sent.
        if: always()
        run: |
          python3 -m pip install --quiet -r vendor/cm019_preferences/requirements.txt 'pyoxigraph>=0.5.11,<0.6'
          python3 tests/test_vendored_qid_pass_reaches_the_thematic_rollup.py
      - name: Every importer declares and keeps the ingest contract (entity, category, real event time, owner, privacy, item key)
        # Derivation can only roll up and decay what ingest kept. The registry
        # refuses an unregistered parser; the fixtures refuse a dropped field;
        # GAP_BASELINE ratchets the declared gaps. Network-free.
        if: always()
        run: |
          python3 -m pip install --quiet pytest -r vendor/cm019_preferences/requirements.txt \
            nameparser rapidfuzz phonenumbers pyyaml
          n="$(python3 -m pytest tests/test_ingest_contract.py --collect-only -q | grep -cE '::test_')" || n=0
          echo "collected ${n} test(s)"
          if [ "${n:-0}" -lt 30 ]; then
            echo "REFUSING: expected at least 30 collected tests, got ${n:-0}." >&2
            exit 1
          fi
          python3 -m pytest tests/test_ingest_contract.py -v -rs
      - name: The Doctor shows whether "What you like" has a producer
        if: always()
        run: python3 tests/test_doctor_shows_derived_preferences_status.py
      - name: The derived-preferences walk probe's negative controls fire
        # Exit 0 from the judge's own self-test is "behaved"; the probe wrapper
        # turns that into its expected FAIL verdict.
        if: always()
        # The self-test EXITS 1 when it behaves, so the capture must not run
        # under the step's `bash -e`: there it aborted before printing anything.
        run: |
          set +e
          out=$(bash scripts/box_walk_probes/probes/derived_preferences_reach_digest_and_tool.sh --self-test 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          # self-test contract: rc 1 and a FAIL verdict means every mutant went red.
          [ "$rc" -eq 1 ] && grep -q '^VERDICT: FAIL -- negative control behaved' <<< "$out"
      - name: The runner collects and invokes the derived-preferences probe (fake Hub)
        if: always()
        run: bash tests/test_derived_prefs_probe_is_run_by_the_walk.sh
