name: tests-unwired-sweep-al

# Wires a batch of previously-UNWIRED tests (the P1 "91 tests nothing invokes"
# audit) whose filename after the `test_` prefix begins with a letter a..l.
# The m..z half is a separate PR (.github/workflows/tests-unwired-sweep-mz.yml).
# Until scripts/verify_test_wiring.sh --regenerate is re-run (a deliberate later
# step), tests/TEST_WIRING.tsv still records these rows as UNWIRED; this workflow
# is the runner that makes them real.
#
# RUNNER CHOICE -- load-bearing, so it is stated:
#   * sweep-ubuntu: the bulk. Every test here parses/executes install.sh or the
#     vendored Python as text/logic and is GNU-portable -- verified: no
#     unguarded macOS-only tool (the one plutil use, in test_install_daily_briefs,
#     is `command -v`-guarded), and no BSD-only sed/stat/date. setup-python plus
#     a pip dependency set covers the .py tests AND the .sh tests that shell out
#     to python3; sqlite3 (test_cx100) is preinstalled on the runner.
#   * sweep-macos: test_assistant_ollama_num_ctx.sh executes /usr/libexec/PlistBuddy
#     and plutil, which do not exist on ubuntu. It runs where the code runs.
#
# NOT wired here, by design (each recorded in the batch triage):
#   * test_every_fail_call_has_error_code.sh          FIX-NEEDED: 2 bare `fail`
#       callsites in install.sh (port-preflight) lack CX-17 error codes. Wiring a
#       red is not allowed; wire after both sites become fail_with_code.
#   * test_calendar_attendee_resolve_before_create.py FIX-NEEDED: the vendored
#       ostler_fda.pwg_ingest still mints-a-URI-then-checks-self instead of
#       resolving an existing person before creating one (no
#       _person_uri_by_identifier_value, ingest_calendar writes no identifier).
#   * test_dmg_contains_bundled_python.sh             CANNOT-RUN: needs a built +
#       notarised DMG (cd gui && make ship); it SKIPs (green-but-inert) otherwise.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same branch/PR. NEVER cancels main or a tag:
  # a cancelled main run is a gate that did not report.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  sweep-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python deps for the vendored-module tests
        # cm019 ingest parsers (aiofiles/bs4/lxml/pydantic*), ostler_fda pwg_ingest
        # (httpx/nameparser) and cm041 identity_resolver (rapidfuzz/httpx/phonenumbers).
        run: python3 -m pip install --quiet aiofiles pydantic pydantic-settings beautifulsoup4 lxml rapidfuzz httpx phonenumbers nameparser pyyaml

      - name: Shell tests (a..l)
        run: |
          set -uo pipefail
          fail=0
          for t in \
            test_ai_conversations_leg_wired.sh \
            test_app_binary_agents_bootstrap.sh \
            test_assistant_config_reasoning_disabled.sh \
            test_assistant_config_vane_wiring.sh \
            test_assistant_identity_belt.sh \
            test_bootstrap_prelude.sh \
            test_brew_install_fail_loud.sh \
            test_calendar_hydrate_venv.sh \
            test_cm048_prompts_packaged.sh \
            test_cm048_settings_models_wired.sh \
            test_composite_cleanup.sh \
            test_contact_card_prefill.sh \
            test_contact_email_coverage_guard.sh \
            test_contact_resync_scheduled.sh \
            test_conversation_bundle_user_id_wired.sh \
            test_conversations_ingest_wiring.sh \
            test_cx100_mail_accounts_detection.sh \
            test_cx101_prelaunch_gate_population.sh \
            test_cx130_mail_populate_phase2.sh \
            test_cx18_q7_channel_choice_labels_match_install_sh.sh \
            test_cx30_33_python_library_validation_entitlement.sh \
            test_cx453_no_osascript_contacts.sh \
            test_cx95_venv_shebang_promote.sh \
            test_cx98_channel_vars_unbound.sh \
            test_cx98_previous_install_detection.sh \
            test_dedupe_defer_background.sh \
            test_dedupe_heartbeat.sh \
            test_doctor_probe_errtrap_regression.sh \
            test_doctor_probe_non_fatal.sh \
            test_doctor_repo_fallback.sh \
            test_email_folder_prompt.sh \
            test_email_ingest_bootstrap_guard.sh \
            test_email_ingest_loud_guard.sh \
            test_email_ingest_venv_wired.sh \
            test_final_summary_nounset_safe.sh \
            test_gen_patch_new_files.sh \
            test_governor_pause_throttle.sh \
            test_graph_db_pull_retry.sh \
            test_imessage_self_handles_fallback.sh \
            test_ingest_offpeak_throttle.sh \
            test_install_daily_briefs.sh \
            test_install_first_month_free.sh \
            test_install_sh_prefers_bundled_python.sh \
            test_knowledge_repo_wiring.sh \
            test_linkedin_export_detect.sh \
          ; do
            echo "::group::$t"
            if bash "tests/$t"; then echo "PASS $t"; else echo "FAIL $t"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Python tests (a..l)
        # Independent axis from the shell tests: run even if those failed, so a
        # red shell run never hides whether the Python guards also broke.
        if: always()
        run: |
          set -uo pipefail
          fail=0
          for t in \
            test_amazon_extracted_dir_parse.py \
            test_appletv_parser.py \
            test_browsing_ingest_ensures_collection.py \
            test_identity_resolver_fuzzy_cache.py \
          ; do
            echo "::group::$t"
            if python3 "tests/$t"; then echo "PASS $t"; else echo "FAIL $t"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

  sweep-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell tests needing macOS tools (PlistBuddy + plutil)
        run: |
          set -uo pipefail
          bash tests/test_assistant_ollama_num_ctx.sh
