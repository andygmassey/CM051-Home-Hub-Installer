# cut-manifests/v1.0.15.yaml
# ============================================================================
# Point-in-time contract of what the v1.0.15 DMG cut MUST contain.
#
# Every entry is a fix that has slipped, or would silently slip, without an
# artefact-level proof. The verifier walks this file + permanent.yaml before
# codesign. Any FAIL fails the cut BEFORE signing (fail-closed).
#
# THE FILE MUST EXIST FOR ITS VERSION. gui/Makefile derives
# CUT_MANIFEST_VERSION from the installer version (1.0.15 -> v1.0.15). Bumping
# the version WITHOUT adding the matching manifest makes verify_cut_manifest
# select nothing for the cut line -- the per-cut half of the gate silently
# stops applying. That is the same inert-gate class as the four found on
# 2026-08-06 (three shell gates + the daemon-binary target path).
#
# Format: see cut-manifests/README.md.
# ============================================================================

version: v1.0.15
description: |
  v1.0.15 cut contract. Consumes permanent.yaml + these entries. Fails cut on
  any RED before codesign.

  What this cut is FOR, and therefore what must be proved at the artefact:
    - Daemon hub-v0.4.53 @ ff57be3f -- the forward-reconciled line, which is
      the ONLY line carrying the masonry Front Page. v1.0.14.1 shipped from a
      tree 161 commits behind origin/main and passed 39/40 gates, so "the pin
      says 0.4.53" is not evidence; the artefact must say so.
    - Nested-app notarisation (HR015 #221) -- Ostler.app and OstlerAssistant
      .app each carry their OWN stapled ticket now, so a customer whose first
      launch has no network is not Gatekeeper-blocked. Proved at the DMG by
      verify-stapling; the manifest half proves the mechanism is still wired.
    - Wiki images pinned to the SHIPPED ghcr namespace (ostler-ai), not the CI
      one (creativemachines-ai). Three gates hardcoded the CI namespace and
      made the shipped pins unsatisfiable.

entries:

  # --------------------------------------------------------------------------
  # Installer version stamp -- DMG-boundary assertion (pattern from v1.0.13)
  # --------------------------------------------------------------------------
  # Sibling of the source-consistency gate (tests/test_installer_version_
  # consistency.sh); this proves the BUILT OstlerInstaller.app stamps 1.0.15.
  # Together they catch both half-bump and no-bump failure modes: the shell
  # test catches "project.yml bumped, Info.plist forgotten", this catches
  # "sources agree but the built app is stale".
  - id: v1015-installer-app-version-stamp
    title: built OstlerInstaller.app CFBundleShortVersionString must equal 1.0.15
    incident: v1.0.11 AND v1.0.12 both shipped an installer stamping "1.0.10"
    proof:
      kind: plist_key_equals
      target: installer-app
      path: "Contents/Info.plist"
      key: "CFBundleShortVersionString"
      value: "1.0.15"

  # --------------------------------------------------------------------------
  # THE headline content proof for this cut: the masonry Front Page.
  # --------------------------------------------------------------------------
  # The daemon stamps DAEMON_FRONTEND_COMMIT=<40-hex> via env!() at build time
  # (HR015 #226). It is codesigning-invariant and survives into the shipped
  # Mach-O verbatim, so `strings` proves WHICH web/dist the shipped daemon
  # actually embeds -- not which one the pin claims.
  #
  # ff57be3fdac3a04d936893da095875eb36dd58ef is the forward-reconciled tip
  # (branch reconcile/daemon-0.4.52-forward, tag hub-v0.4.53) and the only
  # commit that carries the ported masonry Front Page. The two daemon lines had
  # DIFFERENT Front Page implementations AND different card contracts, so a
  # wrong-line daemon does not fail loudly -- it renders the old cards. Exactly
  # the shape of the v1.0.13 stale-wrapper incident (#225): everything signed,
  # notarised, stapled, every gate green, customer UI wrong.
  #
  # verify-commit-parity (in the ship chain) proves wrapper == daemon. This
  # proves the SPECIFIC commit, which parity alone cannot: two stale-but-equal
  # binaries pass parity.
  - id: v1015-daemon-frontend-commit-is-reconciled-tip
    title: shipped daemon must embed web/dist from the reconciled tip ff57be3f (masonry)
    incident: v1.0.13 #225 stale wrapper -- all gates green, customer UI broken
    proof:
      kind: grep_in_artefact
      target: assistant-binary
      pattern: "DAEMON_FRONTEND_COMMIT=ff57be3fdac3a04d936893da095875eb36dd58ef"
      must_match: true

  # --------------------------------------------------------------------------
  # Nested-app notarisation mechanism must still be wired (HR015 #221).
  # --------------------------------------------------------------------------
  # verify-stapling proves the OUTCOME on the finished DMG. This proves the
  # MECHANISM is still in the ship chain, because the outcome check runs ~15
  # minutes and one full notarise-dmg later, and because a future edit to
  # sign-app could drop the step while leaving a DMG that happens to pass
  # (Apple holds tickets for unchanged CDHashes from a previous cut, so a
  # dropped step can stay invisible for several cuts before biting).
  - id: v1015-nested-notarisation-step-wired
    title: sign-app must invoke notarise-nested-apps before the outer reseal
    incident: "#221 sat unfixed for 7 cuts because the staple loop soft-failed and returned 0"
    proof:
      kind: grep_in_source_at_sha
      target: this-repo
      path: "gui/Makefile"
      pattern: "notarise-nested-apps\\.sh"
      must_match: true

  # The outer reseal must NOT use --deep. --deep re-signs every nested bundle,
  # which strips the tickets stapled immediately above it and makes #221
  # structurally unsatisfiable. Apple deprecated --deep for signing for this
  # reason. This is a NEGATIVE proof: it fails the cut if --deep comes back.
  - id: v1015-outer-reseal-not-deep
    title: outer .app reseal must not use --deep (it strips nested tickets)
    proof:
      kind: grep_in_source_at_sha
      target: this-repo
      path: "gui/Makefile"
      pattern: "codesign --force --deep --sign"
      must_match: false

  # --------------------------------------------------------------------------
  # Wiki images must be pinned to the SHIPPED ghcr namespace.
  # --------------------------------------------------------------------------
  # ghcr.io/ostler-ai/* is what a customer Mac can pull. ghcr.io/
  # creativemachines-ai/* is the CI publish target and is NOT customer-
  # reachable. Three separate gates hardcoded the CI namespace, which made the
  # correct (shipped) pins look like violations and pushed the cut toward
  # pinning the wrong one.
  - id: v1015-wiki-images-shipped-namespace
    title: install.sh wiki image pins must use the customer-pullable ostler-ai namespace
    proof:
      kind: grep_in_installer
      pattern: "ghcr\\.io/ostler-ai/ostler-wiki"
      must_match: true

  - id: v1015-wiki-images-not-ci-namespace
    title: install.sh must not pin wiki images to the CI-only namespace
    proof:
      kind: grep_in_installer
      pattern: "ghcr\\.io/creativemachines-ai/ostler-wiki"
      must_match: false

  # --------------------------------------------------------------------------
  # Daemon pin freshness + build-info sidecar (carried forward from v1.0.14).
  # --------------------------------------------------------------------------
  # Carried forward verbatim except the id prefix: these are the entries that
  # would have caught the 161-commits-behind cut if the checkout they read had
  # been the shipped one. Promote to permanent.yaml once v1.0.15 ships clean.
  - id: v1015-daemon-sidecar-present
    title: pinned daemon release must carry a .build-info.json sidecar
    incident: v1.0.13 near-miss + human-memory-only build provenance
    proof:
      kind: verify_build_info_sidecar_present
      pinned_version_source:
        file: "gui/Makefile"
        pattern: 'DAEMON_VERSION\s*[?:]?=\s*(\d+\.\d+\.\d+)'
      tag_format: "hub-v{version}"
      source_repo: "ostler-ai/ostler-assistant"
      allow_reconstructed: true
      local_sidecar_dir: "${HR015_DIR}/launch/backfill-sidecars"

  - id: v1015-daemon-freshness-with-sidecar
    title: pinned daemon must be fresh vs oa/main crates/ AND agree with its build-info sidecar
    incident: closes the retroactive gap left by the v1.0.13 near-miss
    proof:
      kind: pinned_artefact_freshness
      artefact: "daemon (ostler-assistant) [sidecar-aware]"
      pinned_version_source:
        file: "gui/Makefile"
        pattern: 'DAEMON_VERSION\s*[?:]?=\s*(\d+\.\d+\.\d+)'
      tag_format: "hub-v{version}"
      source_repo: "ostler-ai/ostler-assistant"
      source_paths:
        - "crates/**"
      ignore_commits_matching:
        - "^chore\\(fmt\\)"
        - "^docs:"
        - "^chore\\(docs\\)"
      consume_build_info_sidecar: true
      allow_reconstructed: true
      local_sidecar_dir: "${HR015_DIR}/launch/backfill-sidecars"
      verify_tarball_sha: false
