# cut-manifests/permanent.yaml
# ============================================================================
# Regression-critical invariants that MUST prove in EVERY future cut.
#
# Every entry here was proven necessary by a specific incident where a fix
# silently slipped or a customer-visible defect regressed. Adding an entry here
# converts that incident into a permanent backstop: the next cut CANNOT ship
# without proving the invariant still holds.
#
# The per-cut manifest (e.g. v1.0.11.yaml) INHERITS this file. Verifier walks
# both. A FAIL in either fails the cut.
#
# Never remove an entry without a written cut-lead decision. Add entries; don't
# take them away. The whole point is monotonic protection.
#
# Format: see cut-manifests/README.md. Same schema as per-cut files.
# ============================================================================

version: permanent
description: |
  Never-regress backstop. Every entry converts a past incident into a permanent
  invariant proven at every cut. Do not remove entries; add.

entries:

  # ==========================================================================
  # FDA legacy URL (macOS 26). Hit on recut3 by Andy: the "Open Settings"
  # buttons on macOS 26 no-op because Apple retired com.apple.preference.security.
  # Fixed in #451 by migrating all 7 line-touches to modern schemes. Encoded
  # here as an absence proof: ZERO legacy refs may ever appear in install.sh.
  # ==========================================================================
  - id: no-legacy-fda-url
    title: install.sh must not contain any macOS-26-broken com.apple.preference.security URL
    incident: recut3 QA (2026-07-24); customer-visible; FDA button did nothing on macOS 26
    proof:
      kind: grep_in_installer
      pattern: "com\\.apple\\.preference\\.security"
      must_match: false

  - id: fda-modern-scheme-present
    title: install.sh must use modern PrivacySecurity URL scheme for FDA
    incident: recut3 QA; sibling to no-legacy-fda-url — presence proof
    proof:
      kind: grep_in_installer
      pattern: "com\\.apple\\.settings\\.PrivacySecurity\\.extension"
      must_match: true

  # ==========================================================================
  # FirstRunPopup route. "Fixed" 3-4 times in prior cuts. Prior fixes changed
  # copy without changing the route, or changed the route in source without
  # rebuilding the daemon so the web bundle still shipped the old string. This
  # entry proves the FINAL string is in the built artefact.
  # ==========================================================================
  # Note on primitive choice: Tauri packs web/dist COMPRESSED inside the main
  # binary, so `strings zeroclaw-desktop | grep "Open Governor"` returns
  # nothing (verified 2026-07-27). This is the exact class TNM warned about
  # in the spec: literals in compiled artefacts that are unprovable by
  # binary-grep. The correct proof is source-at-sha on ostler-assistant —
  # the source string is present at the pinned SHA, and the daemon build
  # pipeline compiles from that SHA into the shipped binary.
  - id: firstrun-popup-governor-source
    title: firstrun welcome modal opens the Governor route (source, at daemon-pinned SHA)
    # v1.0.13.2 (2026-08-01 ORM): FirstRunPopup.tsx was superseded by
    # GovernorWelcomeModal.tsx (oa #231). The equivalent invariant now: the
    # welcome modal navigates to '/settings#governor' (the modern Governor
    # route location; the panel scrolls to that anchor). Updated file + regex
    # to prove the same wire-through against the current source.
    incident: 3-4 recuts (2026-06/07) where copy changed but route didn't, or route changed but daemon wasn't rebuilt
    source_pr: ostler-ai/ostler-assistant#231
    proof:
      kind: grep_in_source_at_sha
      target: ostler-assistant
      path: "web/src/components/GovernorWelcomeModal.tsx"
      pattern: "navigate\\(['\"]\\/settings#governor['\"]\\)"
      must_match: true

  # ==========================================================================
  # Operator-PII backstop. Andy's personal instance details (his IP, hostname,
  # personal wiki name, email addresses) must NEVER appear in a shipped
  # customer artefact. The bin/operator-pii-scan.sh already catches this on
  # commit; these entries prove the invariant at cut time as well — the layer
  # between commit-time scan and shipped DMG is the one that has slipped before.
  #
  # WHOLE-DMG SCAN (2026-07-27). These four were `grep_in_installer`, which only
  # ever saw install.sh. v1.0.11 SHIPPED 3 `gamingrig` occurrences in vendored
  # trees (imessage_source/__init__.py, doctor/agent/status_collector.py,
  # cm048_pipeline/PLAN.md) while the gate passed 17/17 — the PII rode in on the
  # vendored .py/.md, never touching install.sh. Broadened to `grep_in_dmg_tree`
  # so absence is proven across the ENTIRE shipped payload: install.sh + every
  # vendored .py/.md/.sh + the daemon Ostler.app (and nested helper apps) + a
  # strings(1) pass over the Mach-O binaries. Still scans source install.sh too,
  # so absence holds even in a local no-build run.
  #
  # COVERAGE LIMIT (honest): Tauri packs the daemon web/dist COMPRESSED inside
  # its main binary, so operator-PII living ONLY in the compiled+compressed web
  # bundle is unreachable by both text-read and strings(1) (verified: the
  # daemon binary yields 0 hits for a known web-bundle literal). That residual
  # class must be guarded by grep_in_source_at_sha on ostler-assistant, the same
  # way firstrun-popup-governor-source is. Everything text-extractable in the
  # DMG — which is where every operator-PII slip to date has landed — is now
  # covered.
  # ==========================================================================
  - id: no-operator-ip
    title: shipped DMG must not contain Andy's personal LAN IP anywhere
    incident: standing operator-PII rule; commit hook + cut-time backstop
    proof:
      kind: grep_in_dmg_tree
      pattern: "192\\.168\\.1\\.37"
      must_match: false

  - id: no-operator-hostname
    title: shipped DMG must not contain Andy's personal box hostname anywhere
    incident: v1.0.11 shipped 3 `gamingrig` in vendored trees while install.sh-only gate passed 17/17
    proof:
      kind: grep_in_dmg_tree
      pattern: "gamingrig"
      must_match: false

  - id: no-operator-wiki-name
    title: shipped DMG must not contain Andy's personal wiki instance name anywhere
    incident: standing operator-PII rule
    proof:
      kind: grep_in_dmg_tree
      pattern: "Andypedia"
      must_match: false

  - id: no-operator-email
    title: shipped DMG must not contain Andy's personal email addresses anywhere
    incident: standing operator-PII rule; catches copy-paste leaks
    proof:
      kind: grep_in_dmg_tree
      pattern: "andy@andymassey\\.com|claude\\.ai@andymassey\\.com|marvin@andymassey\\.com"
      must_match: false

  # ==========================================================================
  # Pinned-artefact freshness. The v1.0.13 near-miss (2026-07-30): CM051's
  # DAEMON_VERSION pin at 0.4.39 resolved to hub-v0.4.39, tagged from oa/main at
  # 16687ed6. By cut time oa/main had advanced 5 commits including task #148
  # (has_ever_paid sticky bit -- launch blocker) and #149 (hub-vX.Y.Z tag-push
  # wiring), both compiling into the daemon via crates/*. The pinned tarball
  # structurally could not contain them. TNM caught it by inspection; without
  # this gate the DMG would have shipped with the fixes silently missing.
  #
  # Andy's directive after we caught it: "Make sure this doesn't ever happen
  # again." These entries encode that directive: any future cut where the
  # pinned artefact tag is behind source HEAD on the compile sub-tree FAILS
  # the gate and tells the maintainer the exact commits to include.
  #
  # See cut-manifests/README.md primitive #10 and VERSIONING.md "Recovering
  # from a pinned_artefact_freshness fail" for the runbook.
  # ==========================================================================
  - id: permanent-daemon-freshness
    title: pinned daemon tarball must contain all merged crates/* changes on oa/main
    incident: v1.0.13 near-miss (2026-07-30); 5 unshipped oa/main commits including task #148 launch blocker
    source_pr: post-hoc-2026-07-30 near-miss recovery (Andy directive)
    proof:
      kind: pinned_artefact_freshness
      artefact: "daemon (ostler-assistant)"
      pinned_version_source:
        file: "gui/Makefile"
        pattern: 'DAEMON_VERSION\s*[?:]?=\s*(\d+\.\d+\.\d+)'
      tag_format: "hub-v{version}"
      source_repo: "ostler-ai/ostler-assistant"
      source_paths:
        - "crates/**"
      ignore_commits_matching:
        - "^chore\\(fmt\\)"
        - "^docs:"
        - "^chore\\(docs\\)"
      # v1.0.13.2 hotfix hold_ack (2026-08-01 ORM). The v1.0.13.2 cut is a
      # controlled hotfix from tag hub-v0.4.45 (c638a6d7); it deliberately
      # excludes 23 crates/** commits that landed on oa/main after the tag
      # cut point. Each is either a fix/feature the hotfix explicitly does
      # NOT ship (v1.1 candidate) or a CI/clippy commit that is a no-op for
      # customer behaviour. v1.0.14 will cut from a fresh main so this
      # hold_ack becomes harmless (diverging set empty).
      hold_ack:
        reason: "TWO EPOCHS, both listed below. (1) v1.0.13.2 hotfix from hub-v0.4.45 (c638a6d7); 23 crates/** commits on oa/main are v1.1 candidates or CI-only, intentionally not in this hotfix. (2) v1.0.49, 2026-08-28: oa #366's two commits (3464215ba5, d9ea32dd18), merged mid-cut, held rather than rebuilt because BOTH are confined to `#[cfg(test)] mod tests` (mod.rs lines 6193..12765 encloses all four changed hunks) plus a tokio test-util feature added under [dev-dependencies] only. Neither is compiled or linked into a release binary, so a new daemon release would be behaviourally identical. hub-v0.4.67 is the newest published tag and points at the pinned f1c7c57d, so no existing release covers them. This is NOT a claim the pin is fresh: v1.0.49 ships without these two commits, decided on that measurement rather than by omission."
        shas:
          - cf82dab8ef  # fix(doctor): clippy field_reassign_with_default in probe-path tests (#173)
          - ab20c46333  # style: cargo fmt (wrap long closure in doctor no-routes test)
          - 6de15f6622  # fix(doctor+channels+config): v1.0.13 install-log noise cleanup (main variant of R6 in tag)
          - 604f44590a  # fix(channels): strip leading assistant-name echo from LLM replies (#182)
          - 882d851f76  # chore(gateway): inline single-element test loop to satisfy clippy 1.93
          - 4c1395f3c4  # fix(doctor): count all hydrated sources not just live channels + iMessage case + pill truncation (#213)
          - 2e0c3dbf0f  # fix(vault): envelope Deserialize + atomic signal write
          - 293802f714  # feat(hub): vault-writer observer (LOCK-2/3/4 rework, supersedes #245)
          - e1a4106e31  # fix(subscription): wire has_ever_paid backfill into Config::load_or_init
          - a6784bdcba  # fix(config): add ..Default::default() to GatewayConfig test literals
          - a1dc1a6ad2  # fix(gateway): guarantee companion TLS listener + TLS-port QR
          - df104ba95b  # feat(gateway): dedicated companion TLS listener for iOS pairing
          - 5ed6e2707d  # feat(gateway): self-signed cert helper + companion_* config fields
          - 2cadbac5ff  # fix(security): #192 — Ostler-brand the WebAuthn RP name + user identity
          - 9528520acc  # feat(subscription): has_ever_paid sticky bit gates 14-day post-lapse
          - 16687ed6bb  # fix(broker): reconcile envelope shape stricter-wins
          - 8dcc50800f  # feat(broker): ActionBroker v1 — action-authorization layer (CM061 spec)
          - a12a085262  # fix(cron): preserve builtin jobs on config save, close fire-time race
          - 6ba36274f6  # test(gateway): guard live cron reconcile in handle_api_config_put
          - 120a2233ad  # fix(ci): drop needless struct update in headline test
          - aa6f34890d  # fix(ci): correct doc list-item indentation
          - 2943840b04  # fix(ci): apply cargo fmt to clear Quality Gate lint failures
          - 66975b1472  # feat(settings): user-configurable daily-brief schedule (morning + evening)
          # ---- v1.0.49 addition (2026-08-28, Archie). TWO crates/ commits
          # landed on oa/main DURING the v1.0.49 cut and staled the pin. The
          # first was 3464215b at 03:26:02Z.
          #
          # 🔴 oa #366 IS *NOT* IMPLICATED, despite an earlier reading here and
          # in two channel posts. #366 = 5a059be5, merged 02:22:30Z, touches
          # scripts/ci/ ONLY, and at its merge point the gate would still have
          # PASSED -- 63 minutes before the first crates/ commit existed:
          #     git rev-list --count f1c7c57d..5a059be5    -- crates/  = 0
          #     git rev-list --count f1c7c57d..origin/main -- crates/  = 2
          # Naming the wrong commit in a permanent register sends the next
          # reader to a CI-only change and leaves the two real ones unrecorded.
          #
          # Held, not rebuilt, because BOTH commits are provably unable to
          # change the shipped binary. MEASURED, not inferred from the titles:
          #
          #   3464215ba5  1 file: crates/zeroclaw-channels/src/orchestrator/mod.rs
          #               hunk @8907
          #   d9ea32dd18  2 files: .../orchestrator/mod.rs  hunks @8806, @8903
          #                        crates/zeroclaw-channels/Cargo.toml
          #
          #   mod.rs on d9ea32dd is 13009 lines. Its top-level cfg(test) blocks:
          #       #[cfg(test)] mod tests {              lines 6193..12765
          #       #[cfg(test)] mod cron_delivery_tests { lines 12778..13009
          #   ALL FOUR changed hunks (8806/8903/8907/8957) fall inside
          #   `mod tests`, so none of it is compiled into a release build.
          #
          #   The Cargo.toml change adds tokio feature "test-util" under
          #   [dev-dependencies] ONLY. Verified at source: the [dependencies]
          #   tokio entry does NOT carry test-util, so it is not linked into
          #   the shipped binary either.
          #
          # A new daemon release would therefore produce a behaviourally
          # identical artefact. hub-v0.4.67 is the newest published tag and
          # points at f1c7c57d, exactly what is pinned; d9ea32dd is "ahead" of
          # every published tag, so no existing release covers these two and
          # this ack is not papering over shipped work.
          #
          # 🔴 THIS IS NOT A CLAIM THE PIN IS FRESH. v1.0.49 ships daemon
          # v0.4.67 (@f1c7c57d) and these two commits are NOT in it. That was
          # decided deliberately, on the measurement above, rather than by
          # omission. The ack is sha-scoped: any THIRD crates/** commit
          # re-reds this gate, which is the property that makes it safe.
          - 3464215ba5  # fix(channels): parallel-dispatch deadline sat below the fixture's own floor [cfg(test) only]
          - d9ea32dd18  # fix(channels): put the parallel-dispatch test on a paused clock [cfg(test) + dev-dependencies only]

  - id: permanent-remotecapture-freshness
    title: pinned RemoteCapture app must contain all merged source changes on its default branch
    incident: same class as daemon near-miss; RemoteCapture pinned via install.sh, same failure mode
    source_pr: post-hoc-2026-07-30 near-miss recovery (Andy directive)
    proof:
      kind: pinned_artefact_freshness
      artefact: "RemoteCapture (ostler-remote-capture)"
      pinned_version_source:
        file: "install.sh"
        pattern: 'OSTLER_REMOTECAPTURE_VERSION="\$\{OSTLER_REMOTECAPTURE_VERSION:-(\d+\.\d+\.\d+)\}"'
      tag_format: "remote-capture-v{version}"
      source_repo: "ostler-ai/ostler-remote-capture"
      # The RemoteCapture repo compiles the whole app from Sources/ + supporting
      # Swift/Xcode + package files; freshness matters for any of them.
      source_paths:
        - "Sources/**"
        - "Package.swift"
        - "Package.resolved"
        - "*.xcodeproj/**"
        - "RemoteCapture/**"
      ignore_commits_matching:
        - "^chore\\(fmt\\)"
        - "^docs:"
        - "^chore\\(docs\\)"
        - "^chore\\(release\\)"

  # Note on wiki-recompile artefacts:
  # CM044's dedupe-decision chrome (dup_decision.js) is EMITTED at wiki
  # compile-time on the box (post-install), not shipped in the DMG. The
  # wiki-recompile/ dir in the .app only contains the compiler harness
  # (INSTALL_SNIPPET.sh, launchd plist, bin/). Proof for CM044 chrome
  # freshness belongs to the post-install box-walk gate, not this
  # artefact-only manifest. Kept out of permanent.yaml deliberately.
  #
  # Note on wiki container image FRESHNESS (still out of scope, and why):
  # install.sh pins ghcr.io/creativemachines-ai/ostler-wiki-site@sha256:<digest>.
  # That is a container digest, not a git tag, so pinned_artefact_freshness
  # (which resolves a version -> git tag -> commit) does not apply. Bridging a
  # container digest back to a source commit needs an OCI-labels lookup that
  # is out of scope for the freshness primitive as designed. A separate
  # `pinned_container_freshness` primitive can be added later if the same
  # class of drift bites us on the wiki image; the risk profile is lower
  # because the wiki image is rebuilt on every CM044 release cycle already.
  #
  # (This note said ghcr.io/ostler-ai until 2026-08-15. install.sh has never
  # pinned that namespace. ostler-ai holds only a stale `:latest` -- probed
  # 2026-08-15, ostler-ai/ostler-wiki-site:0.1.14 is 404 while
  # creativemachines-ai/ostler-wiki-site:0.1.14 is 200 anonymously. A reader
  # following the note during an incident would have probed the wrong
  # registry path and concluded the image was missing.)
  #
  # ==========================================================================
  # The wiki image pin had no STANDING assertion, and the coverage it did have
  # was incidental.
  # ==========================================================================
  #
  # verify_cut_manifest.py reads permanent.yaml plus the ONE per-cut manifest
  # for the version being cut. It does not union prior cuts. So an assertion
  # written into v1.0.24.yaml covers v1.0.24 and nothing after it.
  #
  # Measured 2026-08-15 across cut-manifests/:
  #
  #   v1.0.11 .. v1.0.15   0 wiki assertions
  #   v1.0.16 .. v1.0.24   2 wiki assertions each  (site + compiler digest)
  #   v1.0.25, v1.0.26     0 wiki assertions, and no mention of the wiki at all
  #
  # Nine consecutive cuts looked like standing coverage. They were not: each
  # row was a per-cut incident assertion recording that THAT cut re-pinned the
  # image. The coverage existed only for as long as consecutive cuts happened
  # to re-pin, and it lapsed silently the first time one did not. For v1.0.25
  # and v1.0.26 nothing anywhere in the gate's inputs asserts that install.sh
  # carries a usable wiki image reference at all.
  #
  # WHAT THIS ROW ASSERTS, AND WHAT IT DOES NOT.
  #
  # It asserts the SHAPE of the pin, which needs no OCI lookup and so sits
  # inside the scope the note above defines: the correct registry, the correct
  # namespace, the correct image name, pinned BY DIGEST rather than by a
  # mutable tag, with a well-formed 64-hex digest. That catches an absent pin,
  # a pin moved to the wrong namespace, a pin degraded from digest to `:latest`,
  # and a truncated or corrupted digest.
  #
  # It does NOT assert freshness and it does NOT assert the digest resolves in
  # GHCR. Freshness is out of scope here for the reason given above. Resolvability
  # is asserted at the other end, in CM044's release-images workflow, which now
  # performs an anonymous pull of what it just pushed against a negative control.
  # Stated plainly so this row is not read as covering more than it does: a gate
  # quiet about its blind spot gets taken for one that has none.
  - id: perm-wiki-site-pinned-by-digest
    title: install.sh pins the wiki-site image by digest in the first-party namespace
    incident: >-
      The wiki image pin was asserted by nine consecutive per-cut manifests and
      by none since. verify_cut_manifest.py reads permanent.yaml plus one
      per-cut file, so v1.0.25 and v1.0.26 shipped with no assertion that the
      customer's compose references a usable wiki image. A pin that is absent,
      in the wrong namespace, or degraded from a digest to a mutable tag would
      not have been caught by anything.
    proof:
      kind: grep_in_installer
      pattern: "ghcr\\.io/creativemachines-ai/ostler-wiki-site@sha256:[0-9a-f]{64}"
      must_match: true

  - id: perm-wiki-compiler-pinned-by-digest
    title: install.sh pins the wiki-compiler image by digest in the first-party namespace
    incident: >-
      Same lapse as the site image. Asserted separately so one moving without
      the other is caught -- the pair have drifted apart before, which is why
      the per-cut rows were always written as two.
    proof:
      kind: grep_in_installer
      pattern: "ghcr\\.io/creativemachines-ai/ostler-wiki-compiler@sha256:[0-9a-f]{64}"
      must_match: true

  # ==========================================================================
  # People seed-and-retrieval round-trip. THE customer-visible invariant: after
  # a fresh install a person lands in the graph and the assistant can get them
  # back. No static gate can see this, which is why it is a runtime probe.
  #
  # Why it lives HERE rather than in a per-cut manifest: this entry was
  # originally registered in v1.0.12.yaml alone, so it protected exactly one
  # cut and was absent from every manifest from v1.0.13 through v1.0.26. It was
  # doubly dead, because the probe body it named was a stub that exited 0
  # unconditionally, so even the single cut it was registered for measured
  # nothing. permanent.yaml is the only place a gate like this cannot be lost
  # by omission.
  #
  # SKIPs when OSTLER_BOX_HOST is unset, so CI and offline dev stay green; on
  # the Studio box it MUST pass. The probe proves it can fire, against a
  # controllable fake box: scripts/tests/test_people_seed_and_retrieval_probe.sh
  # asserts 1 green and 11 distinct reds, and runs on macOS so it exercises the
  # same bash 3.2 the cut host uses.
  #
  # THIS ROW IS NO LONGER THE ONLY THING THAT INVOKES THE PROBE. Until the
  # probe moved into scripts/box_walk_probes/probes/ it was invoked ONLY from
  # here, and only when OSTLER_BOX_HOST was set -- which was nowhere -- so it
  # had never run at all: not in a cut, not in a box walk. run_box_walk.sh now
  # collects it with the rest, and a box walk that cannot reach a Hub reports
  # it as CANNOT-RUN in its own block rather than folding it into green.
  # ==========================================================================
  - id: box-walk-people-seed-and-retrieval
    title: a synthetic person must seed and be retrievable via people/context + people/search
    incident: >-
      v1.0.12 to v1.0.26; the probe body was a stub that could not return
      non-zero, and the manifest entry was dropped after v1.0.12, so fourteen
      cuts reported this gate as passed while measuring nothing
    proof:
      kind: box_walk_probe
      probe: "people_seed_and_retrieval"

  # ==========================================================================
  # #778. The seven probes below have existed since the BW2 bundle and NO
  # manifest has ever named them. Not an oversight anyone could have spotted:
  # they live in scripts/box_walk_probes/probes/, and until #778 the verifier
  # resolved `probe: <name>` ONLY against the flat scripts/box_walk_probes/,
  # so a row naming any of them would have FAILED with "not registered". The
  # gate could not see the runner's probes and the runner does not run the
  # gate's one probe. Zero overlap, in both directions.
  #
  # These SKIP while OSTLER_BOX_HOST is unset, which is every environment
  # today, so adding them changes no current result. They become live the
  # moment a cut targets a real box, which is the point.
  #
  # HONEST WARNING, recorded here rather than discovered at 3am: on the first
  # box walk (2026-08-16, andy@192.168.1.217) install_error_honesty FAILED
  # against a real installer log. That is task #270, a known-open defect, and
  # its row below will go RED on the first box-targeted cut. That is the row
  # working. Fix #270 or descope it deliberately; do not delete the row.
  # ==========================================================================
  - id: box-walk-daemon-is-listening
    title: the Hub gateway must accept connections, and the daemon must be able to load its config
    incident: >-
      v1.0.31; install.sh wrote a config the daemon could not parse, so the Hub
      never started on a fresh install and every static gate stayed green
    proof:
      kind: box_walk_probe
      probe: "daemon_is_listening"

  - id: box-walk-no-person-holds-two-contact-cards
    title: no person record may hold two contact cards with different canonical keys
    incident: >-
      v1.0.38 box walk; the dedupe resolver merged two records whose canonical
      keys DIFFERED, so one person ended up holding another person's contact
      card and the People tab showed a merge nobody could undo. RULE 2 in the
      vendored CM041 resolver is the fix; this probe is the box-side check that
      it held on a real graph rather than only in a unit test
    proof:
      kind: box_walk_probe
      probe: "no_person_holds_two_contact_cards"

  - id: box-walk-freshness-panel-has-dates
    title: every freshness-panel source must report a real date rather than 'unknown'
    incident: >-
      tasks #266 + #349; the Oxigraph client was closed before the dashboard
      queries ran, and the panel rendered 'unknown' instead of erroring
    proof:
      kind: box_walk_probe
      probe: "freshness_panel_has_dates"

  - id: box-walk-install-error-honesty
    title: the installer's closing summary must agree with the error count in its own log
    incident: >-
      task #270; install.sh closed with "no errors detected" over a session
      carrying 43+ real errors. OPEN at the time this row was added, and this
      row is expected to go RED on the first box-targeted cut
    proof:
      kind: box_walk_probe
      probe: "install_error_honesty"

  - id: box-walk-source-status-artefact-is-served
    title: the Doctor must serve /api/v1/sources with one honest per-source row for every canonical source
    incident: >-
      G1c/G3 (v1.0.60); nothing published per-source ingest state, so the panel,
      the end-of-install probe (#599) and the box walk each re-derived it from
      store point counts, where three stores agreeing on ZERO passes. The hydrate
      sentinels now feed a typed per-source record served at /api/v1/sources
      (not_run for a source that never ran); this probe is the box-side check
      that the record is served and usable rather than a store count that cannot
      say WHICH source landed
    proof:
      kind: box_walk_probe
      probe: "source_status_artefact_is_served"

  # ==========================================================================
  # #722. The estate had no instrument that observes OUTBOUND traffic at all.
  # Searched OS003 and CM051 with a positive control before building: the only
  # lsof in a probe read INBOUND listeners. The strongest claim the product
  # makes had a diagram behind it and no measurement.
  #
  # This row exists so the probe cannot become the thing it measures. It SKIPS
  # while OSTLER_BOX_HOST is unset, like its siblings, and goes live the moment
  # a cut targets a real box.
  #
  # READ THE PROBE'S OWN BLIND-SPOT LINE BEFORE QUOTING A GREEN FROM IT. It
  # samples established TCP; it cannot see sub-sample-lifetime connections,
  # UDP, DNS, proxied requests, or any payload content. A pass here is the
  # floor of an evidence chain, not a proof of no leak, and this row must not
  # be cited as one.
  # ==========================================================================
  - id: box-walk-no-unexpected-egress
    title: no Ostler-owned process may hold a connection outside the declared local boundary
    incident: >-
      task #722; a cold outside read of the marketing site reached "a diagram,
      not a proof" of the boundary claim, and the estate had zero runnable
      instruments that observe the network in the outbound direction
    proof:
      kind: box_walk_probe
      probe: "no_unexpected_egress"

  - id: box-walk-installed-bundle-seal-intact
    title: the installed bundle's code signature must still verify on the box
    incident: >-
      task #375 / CM051 #767; the installer broke the seal it had just verified,
      and nothing checked the artefact after installation. v1.0.46 BOM row 6
      then found the probe itself unciteable: it reported all three bundles
      MISSING from /Applications while a direct SSH read found Ostler.app
      present, because it named no box_run and had always been stat-ing the
      operator's own laptop, and its one-word verdict recorded nothing about
      what it had looked at. It now reads the box and prints host, uid,
      transport, resolved path, TCC/SIP state and raw errno, and a refused read
      exits 78 CANNOT-RUN rather than rendering as an absence.
    proof:
      kind: box_walk_probe
      probe: "installed_bundle_seal_intact"

  - id: box-walk-launchd-no-ephemeral-paths
    title: no installed LaunchAgent may execute from /tmp or a mktemp staging dir
    incident: >-
      task #177; the ollama-logrotate plist pointed at /tmp/ostler-prelaunch-XXXX,
      worked all day, and died at the next reboot
    proof:
      kind: box_walk_probe
      probe: "launchd_no_ephemeral_paths"

  - id: box-walk-pair-state-agreement
    title: daemon health flag, devices.db and the pair-state file must agree on whether a phone is paired
    incident: >-
      tasks #208 + #265; Doctor reported "Your phone is connected" over a
      devices.db with zero rows, and four signals on one box disagreed
    proof:
      kind: box_walk_probe
      probe: "pair_state_agreement"

  - id: box-walk-people-count-agreement
    title: Oxigraph and the Doctor API must agree on the number of people
    incident: >-
      task #273; three surfaces reported 6376 / 6755 / 6547 for the same box
      and no gate compared them
    proof:
      kind: box_walk_probe
      probe: "people_count_agreement"

  - id: box-walk-ingest-coverage
    title: every ingest source must be counted, and an EMPTY store must fail rather than read as healthy
    incident: >-
      task #441; Andy asked "does everything work" on 2026-08-19 and nobody
      could answer, because all eight existing probes ask "did the mechanism
      run" and none asks "did data arrive". people_count_agreement is the
      sharpest case: it checks the count AGREES across three surfaces, so
      three surfaces agreeing on ZERO passes it. The measured answer, once
      someone counted by hand, was 3 of 9 sources producing output
    proof:
      kind: box_walk_probe
      probe: "ingest_coverage"

  - id: hydrate-no-data-recorder-present
    title: the shipped install.sh must carry the honest no-data recorder
    incident: >-
      2026-08-19, task #441. _hydrate_sentinel_record hardcodes status=ok, so
      four call sites that passed "status=no_data" as the PAYLOAD had that
      intent discarded and the sentinel claimed success. _hydrate_sentinel_fresh
      then skipped the source for SEVEN DAYS. Andy asked for certainty the fix
      cannot reappear. ON MAIN AND IN THE ARTEFACT ARE DIFFERENT CLAIMS: a cut
      tagged from an older base would ship without this and main would still
      look correct. This row closes that gap by reading the install.sh that is
      actually being cut.
    proof:
      kind: grep_in_installer
      pattern: _hydrate_sentinel_record_no_data\(\)
      must_match: true

  - id: hydrate-no-data-call-sites-repointed
    title: no hydrate call site may pass status= through a payload argument
    incident: >-
      2026-08-19. The exact shape that hid the defect for months: the payload
      LOOKS like it sets the status and cannot, because the recorder hardcodes
      status=ok one line above it. This is the cut-time twin of the ratchet in
      tests/test_no_data_is_not_success.sh control (10). The test guards the
      REPO on every PR; this guards the ARTEFACT at cut time. Both are needed,
      because a tag can be cut from a commit the PR gate never saw.
    proof:
      kind: grep_in_installer
      pattern: \n[^#\n]*_hydrate_sentinel_record "(whatsapp|browsing|imessage|apple_notes)" "status=
      must_match: false

  - id: repair-flag-is-parsed
    title: install.sh must actually parse --repair
    incident: >-
      2026-08-19. vendor/doctor/agent/web_ui_copy.py tells the customer to
      "Re-run install.sh --repair" in TEN separate strings, and two posture
      modules describe state as refreshed on each --repair run. install.sh's
      argument loop recognised six flags, --repair was not among them, and
      there is no *) fallthrough, so it silently ran an ordinary install, which
      honours the 7-day sentinel and skips exactly the source the customer was
      trying to un-stick. If this row ever goes red, the product is once again
      instructing customers to pull a lever wired to nothing.
    proof:
      kind: grep_in_installer
      pattern: --repair\) REPAIR_MODE=1
      must_match: true

  - id: box-walk-fda-tick-can-import
    title: the recurring FDA tick must load its own modules under the interpreter it actually uses
    incident: >-
      2026-08-20, measured on a live v1.0.37 box. fda-rerun died on EVERY fire
      on EVERY box with ModuleNotFoundError: No module named 'nameparser'.
      vendor/ostler_fda/pyproject.toml:42 declares it,
      vendor/ostler_fda/identifier_quality.py:88 imports it, and
      install.sh:5385 is a bare `cp -R` with no pip, so ~/.ostler/.venv never
      received it. Meanwhile the product told the customer "still loading in
      the background" while the background was dead. The probe IMPORTS rather
      than reading pyproject, because a declaration check passes on exactly
      the boxes that are broken.
    proof:
      kind: box_walk_probe
      probe: "fda_tick_can_import"

  - id: box-walk-launchagents-resolve-their-tools
    title: agents that shell out to Homebrew tooling must carry a PATH that reaches it
    incident: >-
      2026-08-20, measured after a real power cycle. launchd hands its jobs
      /usr/bin:/bin:/usr/sbin:/sbin unless the plist sets
      EnvironmentVariables:PATH. The assistant owns `colima start`, colima
      resolves limactl through PATH, and the assistant plist set six env keys
      of which none was PATH -- so the VM never booted and Qdrant, Oxigraph,
      Redis, Vane, wiki-site and store-proxy were all gone until someone
      started Colima by hand, while /health returned "ok" with ten components
      and not one of them a container. 18 of 24 agents lacked the PATH and
      BOTH agents that broke that day were among them. If this row goes red,
      the product does not survive a reboot.
    proof:
      kind: box_walk_probe
      probe: "launchagents_resolve_their_tools"
  - id: box-walk-assistant-answers-grounded
    title: a customer's opening question must reach the graph, not merely get a reply
    incident: >-
      v1.0.38. Every layer was individually green and stayed green while the
      product was broken: artefact 10 of 10, daemon up, 25 of 26 LaunchAgents
      clean, wiki serving 18k+ populated pages, Oxigraph holding 6,848 Person
      nodes, Qdrant holding 9,879 preferences over 377 conversations. All four
      of a new customer's opening questions returned some form of "I don't
      know". Three independent defects stacked, each alone sufficient (#853
      #854 #855), and every one of them lived in a JOIN between layers rather
      than inside one. No other probe in this suite spans a join, so no other
      probe could have failed. This is the only end-to-end row.
    proof:
      kind: box_walk_probe
      probe: "assistant_answers_grounded"

  # ==========================================================================
  # The two probes added for the v1.0.45 walk. Both existed on disk with NO
  # row naming them, which `test_every_probe_on_disk_is_declared_in_permanent_
  # manifest` correctly refused: "a probe nothing declares is a probe the cut
  # never runs". Declaring them here is what makes them run.
  # ==========================================================================
  - id: box-walk-app-signature-survives-first-run
    title: the installer must still verify AFTER it has been run once
    incident: >-
      v1.0.45 passed 14 of 14 artefact checks and then bricked itself the first
      time it was launched -- "OstlerInstaller is damaged and can't be opened.
      You should move it to the Bin." The app ships zero .pyc, so the first run
      of its bundled python3.11 from a WRITABLE location compiles its own
      stdlib into Contents/Resources/python/lib/python3.11/__pycache__, inside
      the signed bundle, and adding any file voids the seal. syspolicyd then
      refuses the interpreter about once a second, each refusal raising a
      dialog the installer retries, so pressing Cancel summons the next one.
      Recovery took three separate removals (the .pyc, com.apple.quarantine,
      and the com.apple.provenance record) and a customer has none of them.
      Every one of the 14 checks read the app on a READ-ONLY volume, where the
      defect cannot occur: a control that cannot exhibit the defect is not a
      control.
    proof:
      kind: box_walk_probe
      probe: "app_signature_survives_first_run"

  - id: box-walk-pairing-recovers-without-a-repair-storm
    title: a dead session must recover ONCE, quietly, not in bursts of five
    incident: >-
      Measured on the Mac mini 2026-08-25 from the daemon's own log: roughly 25
      "New client paired successfully" events between 08:41:00 and 08:46:04, in
      bursts of five with gaps of 2.2s 3.0s 4.4s 7.5s 13.4s, then a pause over
      60s, then another burst. This row also RETIRES its predecessor,
      pairing_recovers_on_the_port_the_app_uses, which asserted a defect that
      does not exist: it minted one pairing code, posted it to two ports and
      called the second rejection a failure, when the code is single-use by
      design (pairing.rs sets *pairing_code = None the instant one matches), so
      it would have FAILED ON A HEALTHY BOX. Its control proved the predicate
      and said nothing about the specimen.
    proof:
      kind: box_walk_probe
      probe: "pairing_recovers_without_a_repair_storm"

  # #713/#719 ARE THE REASON THIS ROW IS WORDED THE WAY IT IS. Every
  # box_walk_probe row had returned SKIP for its entire life, and nothing
  # invoked run_box_walk.sh at all -- two instruments, neither ever pointed at
  # the thing. So this probe is ALSO driven from CI, over fixtures, by
  # .github/workflows/usage-journal-producers.yml, which watches every file it
  # runs. The box path proves it on a box; the CI path proves it can still go
  # red between box walks.
  #
  # SKIPs while OSTLER_BOX_HOST is unset, like its siblings, and goes live the
  # moment a cut targets a real box.
  #
  # HONEST WARNING, recorded here rather than discovered at 3am: this row is
  # EXPECTED TO GO RED on the first box-targeted cut. Measured 2026-08-25
  # against the dev Mac's real journal: 1 record, 5 of 5 required producers at
  # zero, and the single record carrying purpose "enrichment" -- which is not
  # one of the contract's five purposes and is REJECTED by the daemon's reader.
  # The contract itself says so: CM048 and CM041 are "not wired", and CM044 is
  # blocked on the writer being absent from its image AND on a missing bind
  # mount. That is the row working. Wire the producers or descope them
  # deliberately in cut-deferrals.yaml; do not delete the row.
  # ==========================================================================
  - id: box-walk-usage-journal-producers
    title: every producer the usage-journal contract declares must have written a record after a full compile
    incident: >-
      the cost panel is compiled from <workspace_dir>/state/costs.jsonl, which
      four repos and the daemon append to. A producer that STOPS writing is
      invisible there: the number simply gets smaller, which reads as a quiet
      month rather than a broken pipeline, and it is wrong in the flattering
      direction next to a price comparison shown to a paying customer. The
      contract's own gate paragraph asks only for "at least one enriching
      record and at least one ingesting record" -- but THREE repos owe
      enriching, so one of them writing satisfies it forever while the other
      two are dark. A ">= 1 of each kind" predicate is a golden case and cannot
      give a denominator. This row asserts the ROSTER
      (scripts/usage_journal_producers.tsv), whose size is pinned separately in
      scripts/usage_journal_producer_floor.tsv so it cannot be shrunk into a
      pass in one edit.
    proof:
      kind: box_walk_probe
      probe: "usage_journal_producers"

  # ==========================================================================
  # #1112. launchd serves the job definition it LOADED, not the one on disk.
  # `bootstrap` no-ops on an already-loaded label and `kickstart -k` restarts
  # from the loaded definition, so a config or token rotated on disk can sit
  # unserved indefinitely while every static gate stays green. Measured on
  # 2026-08-26: the assistant API was still serving a token rotated out hours
  # earlier, and every authenticated endpoint 401'd until bootout+bootstrap.
  # This probe compares the RUNNING process's config against the file on disk,
  # and compares the service token by SHA-256 PREFIX ONLY -- never by value,
  # because a probe that echoes a secret copies it into every cut log.
  # ==========================================================================
  - id: box-walk-running-config-matches-disk
    title: the running daemon's config and service token must match what is on disk
    incident: >-
      2026-08-26 box walk; the service token was rotated on disk at 16:02Z but
      launchd kept serving the pre-rotation job definition, so every
      authenticated endpoint returned 401 while the on-disk config looked
      correct. bootout + bootstrap of the LABEL fixed it. Nothing reported the
      divergence: the daemon was listening, the file was right, and no gate
      compared the two.
    proof:
      kind: box_walk_probe
      probe: "running_config_matches_disk"
  # #1116. The dedupe layer was not importable on the box and NOTHING said so.
  # install.sh chose ONE pipeline requirements file with an if/elif, so
  # rapidfuzz was never installed; identity_resolver/__init__.py re-exports
  # lazily (PEP 562), so the missing dependency stayed invisible until the
  # exact call that needed it; and the caller caught ImportError and returned
  # degraded:true without aggregating it anywhere. Doctor diagnostics is 28KB
  # and mentions the identity layer zero times. Three independent layers of
  # silence over one missing package.
  #
  # This probe IMPORTS the layer on the box and fails if it cannot. It is the
  # detection half; #1115 is the install-side fix. Keep both: the fix stops
  # this instance, the probe stops the next one.
  # ==========================================================================
  - id: box-walk-identity-layer-is-importable
    title: the identity/dedupe layer must actually import on the box that runs it
    incident: >-
      2026-08-26 box walk; identity_resolver could not be imported on a real
      install because install.sh installed one of three pipeline requirements
      files, so rapidfuzz was absent. Lazy PEP 562 re-exports plus a
      try/except that returned degraded:true meant no log, no diagnostic and
      no gate ever reported it. The dedupe defects being chased in the graph
      lane sat downstream of a layer that was not running at all.
    proof:
      kind: box_walk_probe
      probe: "identity_layer_is_importable"
  # #1117. people_count_agreement compares two TOTALS. Two totals that are both
  # wrong can agree, and on the box measured 2026-08-26 both were wrong in ways
  # a total cannot show: qdrant 7284, graph 7111, but 203 in qdrant-not-graph
  # against 30 in graph-not-qdrant. The headline "gap of 173" is a NET figure
  # hiding two defects of opposite sign that partially cancel, so a fix aimed at
  # "173 orphans" would have been wrong in both directions.
  #
  # This probe does set arithmetic instead, and reports THREE named residuals
  # rather than one number: untyped terminal merge survivors (106), orphan
  # vectors with no graph presence (97), and NAMED persons with no vector (0).
  # Unnamed address-only stubs are reported and deliberately do NOT fail it --
  # all 30 on the box carry prefLabel identical to their email and no name, so
  # embedding them would push raw addresses into the People tab.
  # ==========================================================================
  - id: box-walk-people-stores-reconcile
    title: the graph, the vector store and the number the customer is shown must all describe the same people
    incident: >-
      2026-08-26 box walk; the people count differed by 173 between Oxigraph and
      Qdrant and every existing surface reported only that difference. Set
      arithmetic showed it was 203 one way and 30 the other, from three distinct
      broken write paths -- a merge that never types its survivor, a merge that
      leaves the absorbed node's vector behind, and an email ingest that mints
      Person nodes with no name and no vector. A single total could not have
      distinguished any of them, and could have read as clean had the two errors
      happened to cancel exactly. A fourth residual covers the surface task #273
      actually complained about: the wiki's headline People tile, which read
      7,111 on the box measured -- the graph count, 76 short of the reconciled
      7,187. It fails only when the tile matches NEITHER store, which is the
      #273 signature (Oxigraph 6376, Doctor 6755, UI 6547 -- the UI had invented
      a third number). A tile faithfully rendering a store this probe already
      fails on is a consequence, not a second defect.
    proof:
      kind: box_walk_probe
      probe: "people_stores_reconcile"

  # PR-branch staleness gate. Encodes feedback_mergeable_api_state_isnt_semantic_safety
  # (filed 2026-07-31): mergeable: MERGEABLE from the GH API does NOT prove the
  # branch is semantically safe to merge. A branch that predates a critical
  # recent commit would REVERT it silently. TNM caught this on PR #484 before
  # merging; this primitive turns "cross-check base_sha is current main HEAD"
  # into a mechanical gate.
  #
  # SKIPS cleanly when PR_NUMBER / GITHUB_REPOSITORY are unset (local dev,
  # non-PR CI), so the manifest gate can still be run without failing outside
  # of a PR context. On any PR CI run it PROVES the branch isn't drifting more
  # than 10 non-ignored commits behind main.
  #
  # THAT SKIP WAS THE WHOLE STORY UNTIL 2026-08-19. No workflow in this repo
  # ever set PR_NUMBER -- `grep -rn PR_NUMBER .github/workflows/` returned
  # nothing, while the same grep for `pull_request` matched 12 files, so the
  # absence was real. The row returned SKIP on every invocation it ever had,
  # and SKIP and PASS both leave the exit code at 0. It looked like coverage
  # and asserted nothing.
  #
  # THE RUNNER IS .github/workflows/pr-branch-staleness.yml. It sets PR_NUMBER
  # and passes `--require-kind pr_branch_not_stale_vs_main`, which turns an
  # all-SKIP outcome into CANNOT-RUN (exit 3). Do not delete that workflow, do
  # not give it a `paths:` filter, and do not drop the --require-kind flag:
  # each of those restores a row that is green because it never ran.
  # Guarded by test_workflow_wiring_sets_pr_number.
  # ==========================================================================
  - id: permanent-pr-branch-not-stale-vs-main
    title: current PR branch must not be more than N commits behind its target branch
    incident: PR #484 near-miss (2026-07-31); mergeable=MERGEABLE despite branch stale vs #492 daemon pin bump
    proof:
      kind: pr_branch_not_stale_vs_main
      max_commits_behind: 10
      ignore_commits_matching:
        - "^chore\\(fmt\\)"
        - "^docs:"
        - "^chore\\(docs\\)"

  # ==========================================================================
  # #1134. Ported from #509 alongside verify_branch_truth and verify_clean_tree.
  # It arrived on disk carrying no row here, which is precisely the fault this
  # file exists to refuse: a probe no manifest names is a probe no cut invokes,
  # so it sits in the tree looking like coverage while measuring nothing. Caught
  # by test_every_probe_on_disk_is_declared_in_permanent_manifest ON the port
  # PR rather than afterwards, which is the gate working.
  # ==========================================================================
  - id: box-walk-acceptance-gate-v1013
    title: the acceptance gate must run against a real box and report its own verdict
    incident: >-
      ported in #1134 with no manifest row; nothing would have invoked it, and
      its absence from every cut would have read as silence rather than as a
      missing check
    proof:
      kind: box_walk_probe
      probe: "acceptance_gate_v1013"

  # ==========================================================================
  # #550/#551. THE SHIP GATE FOR THE MULTI-ACCOUNT DEFECT.
  #
  # Andy demonstrated the defect from an ordinary second account with one
  # unauthenticated curl against 127.0.0.1:7878 and got a valid SPARQL result
  # over the owner's whole graph. #551 made "that curl must fail, and so must
  # every other published store and UI port" the gate on the cut. That gate
  # lived in prose on the relay board; this row is the half that runs.
  #
  # WHY THIS IS A BOX PROBE AND NOT A CI GATE. The property is about a running
  # machine's listening sockets. At cut time there is no machine, and a CI
  # runner's port table says nothing about a customer's Mac.
  #
  # EXPECTED RED until the topology fix lands. The ports are open today; that
  # is the defect. It is registered here so the red is attributable rather
  # than a probe nobody declared.
  # ==========================================================================
  # ==========================================================================
  # #854. A tool the model is never TOLD about cannot be chosen. Eight pwg_*
  # tools are registered together and protected from prompt slimming; only
  # three were ever named in the system prompt. The five unnamed ones included
  # pwg_overview, which exists for exactly one job -- catching a broad opening
  # question -- so an opener had nothing to bind to and was coerced into a
  # person lookup. One such coercion resolved "summarise my recent meetings"
  # to a component supplier.
  #
  # ⚠️ THE OBVIOUS PREDICATE CANNOT FAIL, which is why this row exists. Every
  # tool name is compiled into the binary by the tool's own fn name(), so
  # grepping the artefact for "pwg_overview" is GREEN on the exact build that
  # shipped the defect. This probe extracts the guidance paragraph instead and
  # requires the names to appear INSIDE it, anchored on the COMPACT branch --
  # compact_context defaults to true, so a fix applied only to the verbose
  # branch is correct in the file and absent on the box.
  # ==========================================================================
  - id: box-walk-assistant-prompt-names-every-pwg-tool
    title: the shipped prompt must name every registered pwg_* tool, in the branch a customer receives
    incident: >-
      #854. Three of eight registered pwg_* tools were named to the model;
      five were named in neither prompt branch, pwg_overview among them. The
      tools shipped, were registered, were slim-protected, and were
      unreachable by instruction. The customer symptom was four of four
      natural opening questions answering "I don't know", and the graph-side
      symptom was a broad question resolved to a component supplier.
    proof:
      kind: box_walk_probe
      probe: "assistant_prompt_names_every_pwg_tool"

  - id: box-walk-no-store-port-is-tcp-reachable
    title: no Ostler store or UI port accepts a TCP connection, so no second account can read the graph
    incident: >-
      #550: from an unprivileged second account on the owner's Mac, one curl
      to 127.0.0.1:7878 returned a valid SPARQL count over the entire
      knowledge graph. The Host and Origin allowlists in front of it are
      browser controls and a curl satisfies both. The launch was held.
    proof:
      kind: box_walk_probe
      probe: "no_store_port_is_tcp_reachable"
