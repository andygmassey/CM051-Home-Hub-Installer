# cut-manifests/v1.0.99.yaml
# ============================================================================
# THE ONE CHECKLIST FOR THE NEXT CUT.
#
# Andy, 2026-09-05: "You keep JUST ONE checklist -- the manifest -- and cross
# things off until they're all done before you make the next cut. Otherwise we
# will NEVER get through this." And: "they all must pass each and every time."
#
# So this file is the whole gate for v1.0.98. It inherits permanent.yaml; the
# verifier walks both and a FAIL in either fails the cut.
#
# TWO SECTIONS, AND THE DIFFERENCE BETWEEN THEM IS THE HONEST PART:
#
#   entries:        MACHINE-GATED. Every row here is proved by a real primitive
#                   against a real box or a real tree. These cannot be ticked
#                   by hand and cannot be forgotten.
#
#   open_issues:    THE FULL REGISTER of every open issue at the time of
#                   writing. The verifier does NOT read this key -- it walks
#                   `entries` only. Rows here carry `gated_by:` naming the
#                   entry that proves them, or `gate: NONE YET`, which means
#                   the fix shape is not decided and NOBODY HAS WRITTEN THE
#                   PROOF. A `NONE YET` row is work, not coverage. Do not read
#                   this section as protection.
#
# Writing a plausible-looking proof for an issue I have not measured would make
# this file lie in exactly the way SKIP-is-not-a-pass lied for fourteen cuts.
# So the ungated rows say so in as many words.
# ============================================================================

version: v1.0.99
description: |
  v1.0.97 WAS TAGGED ONCE AT 258c7944192a3f305ae0c3a0248b751e9256068d AND NEVER
  BUILT. Its PREFLIGHT PASSED, which is the difference from v1.0.96: the cut
  paperwork was right. The cut JOB died in the build step on check-pr-age over
  a single expired PR-age exemption (CM051 #1818), re-decided in #1966 on
  CHANGED grounds rather than a rolled date, because the freeze it originally
  rested on had lifted.

  THE LESSON IS THE TOOL, NOT THE EXEMPTION. scripts/new_cut.sh printed "ALL
  GREEN. Safe to tag" after running only the gates cut.yml checks in its
  PREFLIGHT job. `make ship` has twelve prerequisites of its own and
  check-pr-age is one of them: the preparation gates and the ship gates are
  different populations, and the tool claimed a scope it did not have. Both
  v1.0.96 and v1.0.97 are downstream of that sentence. CM051 #1967 removed it;
  the script now states its own scope and prints the dispatch command instead.
  Its own comments had already recorded this happening three times before.

  THIS CUT WAS DRY-RUN FIRST, which is the change. A workflow_dispatch (run
  34764181672) exercised preflight AND the ship gates against main, built
  nothing, published nothing and SPENT NO TAG. It returned exactly one red,
  check-ship-version, refusing because v1.0.97 was already tagged. Correct, and
  the spent tag rather than a defect. check-pr-age read GREEN, PARTIAL
  (DECLARED); check-freshness read stale/RED=0.

  v1.0.98 CARRIES THE SAME PAYLOAD AS v1.0.96 AND v1.0.97, at the same tree
  content: seven BOM rows, unchanged, for #1952, #1953, #1954, #1955, #1959,
  #1956 and #1962. No product code differs between the three attempts. What
  differs is that the paperwork exists and the ship gates have been exercised.

  WHAT THE DRY RUN COULD NOT REACH, stated so green is not read as proof of a
  build: signing, notarising, packaging, the three gates that must mount a DMG,
  check-identity (no Developer ID in that job) and check-manifest (reads the
  BUILT .app). Those are first exercised by the real cut.

