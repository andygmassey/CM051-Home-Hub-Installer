  - issue: 971
    title: "NOTHING IN THE PRODUCT CAN EVER PRODUCE pro_active, so the first Pro subscriber gets nothing"
    gate: 'STRUCK 2026-09-16: the issue this row names is CLOSED on GitHub, so the row no longer represents open work and is no longer counted against the cut. WHAT THAT IS AND IS NOT EVIDENCE OF: closure is the register''s own signal that someone judged the work done, and for several of these the judgement is independently visible in a merged PR on main. It is NOT proof that a customer can do the thing; only the walk proves that, which is why item 9 keeps MERGED and PROVEN as different words. If any of these recurs it needs a NEW issue and a NEW row rather than a reopened line here. ORIGINAL FINDING, which carried no gate until now: It previously carried no gate. LAUNCH BLOCKER FOR A PRODUCT ABOUT TO BE SOLD.

      NARROWED AND CORRECTED FROM MY OWN FIRST VERSION OF THIS ROW, which said a
      paying Pro subscriber on this box was being denied a vault. MEASURED SINCE:
      there is NO subscription state anywhere on the box. daemon_state.json holds
      health and uptime only; 738 lines of assistant config.toml contain no
      subscription, tier, pro_ or entitle key at all; the iOS log reads
      refreshStatus -> notSubscribed; and the licence file is the ONE-OFF HUB
      PURCHASE with no tier field (keys: issued_to_email, license_id,
      max_hardware_fingerprints, purchased_at, signature, signature_algorithm,
      stripe_payment_id, update_window_expires_at, version). So on the operator box
      pro_none is the CORRECT answer and nobody is being denied anything. Same
      lesson as the 3-of-87 retraction: measure before calling it a loss.

      THE DEFECT THAT SURVIVES IS STILL SEVERE. compiler/vault_licence.py reads
      ~/.ostler/licence/state.json expecting {pro_state: pro_active|pro_trial|pro_none,
      updated_at}. NOTHING WRITES THAT FILE, ANYWHERE. So no customer can ever reach
      pro_active, and the first person who pays for Pro receives nothing, permanently,
      while the compile logs 16 ok, 19 skipped, 0 errors.

      THE CODE DOCUMENTS ITS OWN FAILURE, verbatim from that docstring: "this exact
      file path + schema does not exist anywhere in the codebase yet", the write side
      "is oa-repo scope, built separately", and "Whoever lands that observer must
      either match this schema or this module needs a follow-up PR -- confirm before
      v1.0.13 merges." NOBODY CONFIRMED. It merged and shipped.

      AND THE VOCABULARY DOES NOT EXIST EITHER: the daemon state machine
      (zeroclaw-gateway/src/api_subscription.rs) tracks active / grace / expired /
      inactive, with no notion of pro_trial versus pro_active versus pro_none. The
      tri-state vocabulary was introduced by the BRIEF for the Doctor rule and Hub UI
      and only the READ side was ever built.

      FIX SHAPE: an observer that reads the daemon subscription state and writes
      state.json in the expected schema.

      THE MAPPING IS DECIDED. ANDY, 2026-09-17, VERBATIM: "keep it as long as they''ve
      paid (fully) for Pro at least once. ie. not the 30 days free plus a failed card
      try." Implement EXACTLY this and do not substitute a reading of it:

        daemon active                                   -> pro_active
        daemon grace AND has paid in full at least once -> pro_active
        daemon grace AND has NEVER completed a payment  -> pro_none
        daemon expired                                  -> pro_none
        daemon inactive                                 -> pro_none
        inside the 30-day free period, no payment yet   -> pro_trial

      THE DISCRIMINATOR IS "HAS A COMPLETED PAYMENT EVER", not "is currently in
      grace". A trial that lapses on a failed first card is NOT grace-protected: that
      customer has never paid, so they drop to pro_none. A subscriber who has paid at
      least once and whose card is retrying KEEPS THEIR VAULT.

      WHOEVER BUILDS THIS: find where a completed payment is recorded before writing a
      line of the mapping. If no such record exists anywhere, that is a SECOND defect
      of the same family and it must be reported, not worked around with a proxy
      signal like "was ever active", which would let a lapsed trial keep the vault.

      HISTORY WORTH KEEPING: the MOUNT half of this was found and fixed TWICE, as
      #849 and #482, both times after a test on CM044 dev compose stayed green while
      the shipped compose was broken. tests/test_shipped_compose_licence_mount.sh now
