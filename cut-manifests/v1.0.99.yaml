  - issue: 959
    title: "A BOOKMARK CAN NEVER BECOME AN INTEREST: ceiling 0.126 against a hard floor of 0.28"
    gate: 'GATE: NONE YET, and this SUPERSEDES the tuning framing in 955. It is not that
      bookmarks score low. It is that they are MATHEMATICALLY INCAPABLE of clearing the
      bar, on any box, with any amount of evidence or recency.

      confidence = reliability x evidence_factor x recency_confidence.
      reliability for a safari_bookmarks bookmark measures 0.18.
      The product ceiling is 0.126 against min_confidence 0.28, hard-wired.
      So no accumulation of observations, no number of distinct sources and no freshness
      can ever lift a bookmark over the threshold.

      ON THAT BOX 4,730 OF 4,804 PROJECTED PREFERENCE ROWS ARE SAFARI BOOKMARKS, so the
      only preference source present is structurally incapable of producing a single
      interest. The front page reads 0 and always would have.

      DO NOT LOWER min_confidence. That would admit rows whose reliability is genuinely
      unknown and fill the customer front page with things they never expressed. Either
      the reliability table is wrong about bookmarks, which is a product judgement Andy
      should make and not an agent, or the box simply lacks preference-bearing data,
      which 957 and the empty export folders already explain. Decide which, do not tune.'

