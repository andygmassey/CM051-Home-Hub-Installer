  - id: v1063-y-a-launchagent-refusal-reaches-the-transcript
    title: a LaunchAgent refusal records its reason and names the GUI domain state
    incident: >-
      `launchctl load` EXITS 0 ON FAILURE, so at every call site a refusal was
      indistinguishable from a success and reached nobody. FIX (#1396, 1adc5ef1)
      records the refusal reason into the transcript and names the GUI domain
      state, so a refusal is legible after the fact instead of vanishing.
    proof:
