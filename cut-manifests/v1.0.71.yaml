      must_match: true

  - id: v1064-aa-an-empty-owner-email-cannot-ship-a-dead-agent
    title: an owner email that could not be read never reaches a shipped LaunchAgent
    incident: >-
      USER_EMAIL is read from exactly ONE place: the macOS me-card via
      osascript. On a Mac where Contacts.app has never been launched that call
      returns "Contacts got an error: Application isn't running. (-600)" --
      which is the NORMAL state of a machine somebody has just set up. The
      installer already RECOGNISED that failure and warned about it; what it
      had was no fallback and no guard. So the agent shipped
      CM052_USER_EMAIL="" and cm052.cli refused once an hour, forever.
      ONE EMPTY STRING, TWO SYMPTOMS, NEITHER NAMING THE CAUSE:
      ai_conversations read not_run permanently, AND the same rc=2 folded
      through gui_step_record_rc into health_check -- which is why every
      service reported healthy and the step still exited 2.
      FIX (#1418): refuse to register an agent that cannot succeed, tell the
      customer why in plain language, and record a DECLARED reason so the
      source says WHY rather than only that it did not run.
      MEASURED at this cut's tree: 1 hit.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'owner_email_unknown_agent_not_registered'
      must_match: true

  - id: v1064-ab-the-owner-email-has-a-source-that-needs-no-gui
    title: the owner address is read from the accounts database when Contacts cannot be scripted
    incident: >-
      A warm GUI app is the property LEAST likely to hold at install time.
      ~/Library/Accounts/Accounts4.sqlite holds every configured account and is
      a plain file present before any app is opened. Opened with immutable=1 so
      reading the customer's live accounts store takes no lock and creates no
      -wal/-shm sidecars.
      IT PICKED THE WRONG ADDRESS ON THE FIRST BOX IT MET AND THE CODE SAYS SO:
      the account-identity address is not the one the owner uses. It ships
      anyway because a plausible-but-wrong address is correctable in one field
      while an absent one leaves the source dead until somebody notices. THE
      REAL FIX IS TO ASK, PRE-FILLED, AND THAT IS NOT DONE.
      MEASURED at this cut's tree: 17 hits.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'Accounts4.sqlite'
      must_match: true

  - id: v1064-ac-the-recurring-tick-records-that-it-ran
    title: ongoing ingestion writes an activity record instead of leaving the install-time verdict standing
    incident: >-
      All eleven hydrate sentinels were frozen between 08:29Z and 08:45Z --
      install time -- while imports/fda/imessage_conversations.json was
      rewritten at 09:17Z with 167 conversations and 136 people created. The
      extract moved and the record did not, because nothing outside install.sh
      had ever written a sentinel. A source that failed at install showed
      failed forever after it recovered; one that worked showed ok forever
      after it died.
      FIX (#1418): the ostler-fda tick already computed a per-source results
      dict and threw it away. It now writes state/source_activity/<n>.tsv --
      a SECOND record, never the install-time one repurposed, carrying
      last_run_at and last_success_at separately because "ran 4 minutes ago and
      found nothing" and "last ran at install" print identically with one
      timestamp. Best-effort and wrapped: bookkeeping about ingest must never
      fail the ingest it describes.
      MEASURED at this cut's tree: 1 hit.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'source_activity'
      must_match: true

  - id: v1064-ad-the-doctor-joins-the-ticks-key-names-to-the-canonical-ones
    title: the source-status route bridges the tick's key names to the canonical sources by an explicit table
    incident: >-
      The activity writer landed with green tests and then met a real box:
      only THREE of nine records joined. The tick derives its keys from
      ingest_all and those are not the canonical hydrate names -- it writes
      apple_mail, browser_history, bookmarks, people_index. So email, browsing
      and people reported ongoing="never" while their ingest had demonstrably
      just succeeded. The suite was green because BOTH SIDES OF THE JOIN WERE
      WRITTEN FROM THE SAME WRONG ASSUMPTION, and a test cannot catch an
      assumption it shares.
      FIX (#1418): an EXPLICIT table, never fuzzy matching. `people` vs
      `people_index` would fall to a prefix rule; `email` vs `apple_mail` would
      not, and a rule loose enough to catch it would also join apple_mail to
      apple_notes -- reporting a source as working on another source's
      evidence. A control asserts that join never happens.
      MEASURED at this cut's tree: 2 hits.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: vendor/doctor/agent/web_ui.py
      pattern: '_SOURCE_ACTIVITY_ALIASES'
      must_match: true

  - id: v1064-ae-rule-2-is-enforced-on-the-converge-path
    title: the whole-graph converge obeys RULE 2, which it had never heard of
    incident: >-
      RULE 2 of the ratified dedupe ruleset -- "MUST NOT MERGE: different
      canonical keys, even if identical display name" -- was implemented in
      IdentityResolver, and that was recorded as "stops NEW ones". It stops new
      ones ON THE RESOLVE PATH. batch_resolver --execute --converge is the
      OTHER path: install.sh runs it on EVERY install and the dedupe-catchup
      agent re-runs it hourly. It reached the graph through raw SPARQL in
      _merge_oxigraph and never consulted the veto. There is exactly ONE caller
      of merge_persons() and it IS guarded -- this path never called it, which
      is why every audit that started from the guarded function came back
      clean.
      THAT IS WHY THE COUNT GREW while the fix was believed in place: 128 on
      the v1.0.38 box, 130 on 2026-08-26, 137 on the v1.0.63 walk, with the
      probe failing on v1.0.52, v1.0.61 and v1.0.63.
      FIX (#1418): the veto is applied per pair before any write, FAILS CLOSED
      when the store cannot be read, and prints its refusal count.
      MEASURED at this cut's tree: 3 hits.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: vendor/cm041/identity_resolver/batch_resolver.py
      pattern: '_canonical_keys_conflict'
      must_match: true

  - id: v1064-af-identity-resolver-declares-what-it-imports
    title: the resolver's requirements file lists all three of its dependencies
    incident: >-
      requirements.txt exists specifically because PR #109 added a rapidfuzz
      import without declaring it anywhere. The same omission was sitting in
      the same package, twice: phonenumbers (normalise.py) and httpx
      (resolver.py, batch_resolver.py) were both undeclared.
      It stayed invisible because every environment that runs this package --
      the installed venv, a developer machine, the box -- already had all three
      from a SIBLING requirements file. A dependency list is only tested by an
      environment that has nothing, and building one clean venv found it in
      seconds.
      Enumerated rather than added one traceback at a time: chasing them one
      failure at a time is how a list ends up one short again.
      MEASURED at this cut's tree: 3 hits.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: vendor/cm041/identity_resolver/requirements.txt
      pattern: 'phonenumbers'
      must_match: true

  - id: v1064-ag-an-imessage-zero-is-declared-not-undeclared
    title: a source that ran and produced no NEW people says so, instead of reporting an undeclared zero
    incident: >-
      detail=zero_payload_undeclared reached the customer for a source that had
      ingested 15,344 messages and created no new people because every contact
      was already known. The sentinel design supports a declared reason and the
      call site passed nothing, so the one distinction the sentinel exists to
      make -- declared vs undeclared zero -- collapsed, and the product told
      its owner the source produced nothing.
      FIX (#1417): a declared reason, with a control asserting the genuinely
      ABSENT leg keeps a DIFFERENT detail, so the fix cannot delete the
      distinction it restores.
      ⚠️ THE PATTERN IN THIS ROW WAS WRONG WHEN FIRST WRITTEN. It was recorded
      as `no_new_people_all_contacts_known`, taken from a status post rather
      than from the tree, and measured 0 hits -- the same score as the negative
      control, which is what caught it. A pattern that scores exactly what the
      control scores has not been verified, it has been guessed.
      MEASURED at this cut's tree: 1 hit.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'ran_ok_no_new_or_enriched_people'
      must_match: true
  - id: v1065-aa-a-source-with-no-input-must-not-fail-the-install
    title: >-
      an optional source that was never given its input no longer fails the
      whole install
    incident: >-
      MEASURED on Andy's Mini during the v1.0.63 walk, 2026-09-04. The final
      step closed `status=error rc=2` and the install reported
      `failed_steps=1` while every probe inside that step logged healthy:
      Qdrant, Oxigraph, Redis, Ollama, pairing, Doctor, assistant API, wiki,
      Vane. The install worked, the app came up, the assistant sent its first
      iMessage, and the installer's last word was a red step.
      CAUSE: USER_EMAIL comes from the macOS me-card via osascript, which
      returns "Application isn't running. (-600)" on a Mac where Contacts has
      never been opened, so the address is empty and cm052.cli refuses.
      Re-measured against the installed binary on that box, with a control:
      empty CM052_USER_EMAIL exits 2, `--help` on the same binary exits 0, so
      the 2 is specific to the missing address and not a broken venv. The
      drain ran anyway and its rc was folded into the shared step recorder.
      🔴 v1.0.64 FIXED ONLY THE OTHER HALF. #1418 stopped registering an
      hourly agent that could only fail, but that guard sits BELOW the fold,
      so the drain still ran and health_check still reddened. The v1.0.64 cut
      manifest states this defect as fixed, and so did a code comment written
      the same morning. Half a fix reads exactly like a whole one.
      FIX (#1428): ONE predicate, `_aiconv_owner_email_known`, read by BOTH
      consumers -- the install-time drain and the LaunchAgent registration --
      so they cannot disagree. With no address the drain is skipped, rc stays
      0, and the sentinel recorded is `status=no_data` with a declared reason,
      which freshness does NOT treat as done, so the source returns on its own
      once an address exists.
      PROVED BY EXECUTION, not by a pattern: the test extracts the real block
      and runs it against a stub producer exiting 2. Two pinned controls,
      45126e9a and deecd9fc, BOTH reproduce the failure; the second is what
      proves v1.0.64 did not fix it. A negative control on the fix itself
      requires the rc to STILL be folded when an address is present, so
      deleting the fold is not the cheap way to green.
      MEASURED at this cut's tree: 3 hits, against 0 in both pre-fix trees,
      with a 16/16 control confirming the zeros are real.
    proof:
      kind: grep_in_source_at_sha
