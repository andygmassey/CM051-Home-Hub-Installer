  - id: v1066-contact-syncer-modules
    title: "contact_syncer ships the two modules the installer actually runs"
    why: >-
      MEASURED on the box from the installer's own diagnostic logs, walks 11
      and 12 of v1.0.65:
      ModuleNotFoundError: No module named 'contact_syncer.photo_storage'
      and: No module named contact_syncer.places_ingest.
      install.sh:17729 copies the ROOT contact_syncer/ into the import
      pipeline. That copy had 19 modules against the vendored copy's 24, and
      the two it lacked are two the installer RUNS -- one by intra-package
      import from syncer.py, one as an `-m` entry point.
      🔴 THE CUSTOMER-VISIBLE SHAPE IS WHY IT SURVIVED SIX CUTS. hydrate dies
      at elapsed_s=0, the customer is told "your contacts are on this Mac but
      Ostler imported 0 of them", and the install then reaches its end and
      reports DONE status=ok. Nothing about a completed install says the
      contacts never arrived. Present in v1.0.60 through v1.0.65, every tag
      checked directly with `git cat-file -p` after `git show <tag>:<path>` was
      discarded as an instrument for returning EMPTY with rc=0 under zsh.
      THE PROOF GREPS INSIDE THE RESCUED FILE, not for its import. The import
      `from contact_syncer.photo_storage import ...` was present in the BROKEN
      tree too -- that is what raised the error -- so greping for it would pass
      on the defect. `def write_photo` exists only in the file that was
      missing.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: contact_syncer/photo_storage.py
      pattern: 'def write_photo'

  - id: v1066-hydrate-counter-unmeasured
    title: "a hydrate counter that could not run is not recorded as a measured zero"
    why: >-
      install.sh:25424 was a command substitution containing a pipeline with NO
      guard, sitting immediately after a guarded producer: the expensive call
      was defended and the arithmetic after it was not. Class measured BY
      EXECUTION rather than by parse -- 19 multi-line sites probed, 11 abort, 8
      survive, 10 of the 11 in the hydrate family -- against a parse that
      claimed 20 and would have handed over nine non-defects.
      🔴 THE GUARD ALONE WOULD HAVE BEEN WORSE THAN THE DEFECT. It composed
      with a merged change that gave the zero a DECLARED reason and a
      pre-existing `:-0`, so a run that FAILED and a run that FOUND NOBODY
      emitted BYTE-IDENTICAL sentinels. A declared cause is safe only while the
      value it explains cannot be manufactured. Both halves therefore landed
      together and never apart: a loud abort is better than a quiet
      fabrication.
      The pattern below is the honest record itself, which exists only once the
      second half is present.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'counter_failed_count_unmeasured'

  - id: v1066-doctor-probe-cap
    title: "the doctor probe cap sits above the command it wraps"
    why: >-
      MEASURED on the walk box against a daemon that was up and answering,
      three consecutive runs: 15.7s, 15.7s, 15.6s, all rc=0, spread 0.1s. The
      installer capped it at 10s. Every run exits 0 and every run exceeds the
      cap, and a tenth of a second of spread means that is the command's NORMAL
      duration, not a slow sample.
      CONSEQUENCE on every install, for a daemon working perfectly:
      health_check closed status=timeout rc=124 and the installer's own closing
      line read "Ostler finished, but 1 install step(s) did not complete
      cleanly: health_check". That was the last remaining failure on the walk
      that certified this cut.
      A cap BELOW the normal duration of the thing it wraps is not a timeout,
      it is a guaranteed failure with a timeout's name on it. The daemon's own
      doctor output confirms the floor independently: it runs a 15-second
      internal imessage-tcc probe. Now named and tunable, defaulting to 60.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'OSTLER_DOCTOR_PROBE_TIMEOUT_S'

  - id: v1066-old-format-sentinel-upgrade
    title: "an old-format sentinel does not abort the upgrade"
    why: >-
      `item_count=` and `last_update_at=` arrive in #1346, so every build up to
      v1.0.59 wrote sentinels without them. On an upgrade the grep for them
      finds nothing and exits 1, pipefail promotes that to the substitution,
      and with no guard the install ABORTS -- as a generic ERR-99, because
      `2>/dev/null` has already discarded the reason. `_hydrate_compute_change`
      is called from EVERY hydrate block and runs before the sentinel is
      rewritten, so the abort lands early on a customer whose only
      distinguishing feature is not having upgraded for a few versions.
      An absent key means "no previous value", which the code below it already
      handles, so the empty string is the CORRECT value and not a fallback.
      ⚠️ LATENT, NOT LIVE, and recorded as such: neither box available carries
      an old-format sentinel -- the walk account is wiped every run and the
      Hub's eleven sentinels are all the new format -- so reachability is
      traced end to end rather than executed.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'A MISSING KEY IS A REAL STATE'
