      must_match: true

  - id: v1063-z-payload-assembly-strips-ambient-pycache
    title: payload assembly strips ambient __pycache__ before seeding the shipped tree
    incident: >-
      Payload assembly copied whatever `__pycache__` happened to be on the
      operator's disk into the SHIPPED tree, baking local bytecode -- including
      co_filename build paths -- into a PUBLIC artefact. FIX (#1400, f875f353,
      register #644) strips ambient bytecode before seeding.
    proof:
