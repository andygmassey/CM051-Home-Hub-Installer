  - issue: 2022

    repo: CM051

    title: 'the pipefail ratchet cannot tell || from |, so it refuses lines with no pipe on them'

    gate: 'GATE: DEFERRED, WITH THE REASON, THE FIX DESIGN AND THE RETIREMENT CONDITION ALL WRITTEN DOWN, AND THE DEFERRAL IS ITSELF THE CORRECT ENGINEERING CALL RATHER THAN AN EXCUSE. THE DEFECT IS REAL AND MEASURED: the ratchet CONSTRUCT is in effect a bar, optional whitespace, then a consumer that can quit early, so the SECOND bar of a logical OR matches it. A line reading elif grep -qF A FILE or-or grep -qF B FILE then is refused although it contains NO PIPE AT ALL and no producer that could ever take SIGPIPE. MEASURED on CM051 #2019: applying CONSTRUCT to the joined-continuation form of that file returns exactly one match, at that line, and no other. A denominator of one is small, and it is the right denominator because the claim is about a specific false positive rather than a rate. WHY IT IS NOT A CURIOSITY, AND THIS IS THE part WORTH KEEPING: the remedy the ratchet PRINTS is specific and, on a false positive, actively wrong. It instructs the author to rewrite correct code to avoid an inversion that cannot occur. A gate that is wrong in the direction of making people change working code teaches them to distrust it, and a distrusted ratchet is a ratchet that gets bypassed. Worse, rows already on the baseline may be in this same category, which would mean the CEILING IS INFLATED BY LINES THAT WERE NEVER AT RISK, and a real regression could hide inside that slack without moving the count. WHY IT WAS NOT FIXED IN PASSING, AND THIS REASON IS SOUND: the CONSTRUCT is SHARED. Changing it moves the counted total for every file on the baseline and reds every open pull request until each one rebases. Doing that mid-queue, while a merge queue is already serialised by a single strict required check, would convert one false positive into a repo-wide stall. Correctness of the change is not in question; its blast radius and its timing are. THE FIX DESIGN IS SPECIFIED SO THE NEXT PERSON DOES NOT REDERIVE IT: neutralise the logical OR before matching, because ERE has no lookbehind and a bar preceded by a bar therefore cannot be excluded within the pattern itself. AND IT NEEDS ITS OWN TWO-ARM FIXTURE, which is why it is a task and not a one-line edit: one input containing a logical OR that the scanner must NOT report, alongside a seeded real pipe it MUST report, so that the fix cannot silently blind the scanner to the thing it exists for. Fixing a false positive without the must-report arm is how a gate becomes a gate that cannot fail. WORKED AROUND RATHER THAN LEFT BITING: #2019 rewrites the line as a single grep with alternation, checked for equivalence over three matching inputs and one non-matching one. RETIREMENT CONDITION RATHER THAN A DATE: this row retires when the OR-neutralising change lands WITH both fixture arms, and when the baseline has been recounted afterwards so the ceiling reflects lines actually at risk. It must not retire on the workaround, because the workaround fixed one line and left the predicate wrong. FILED THIS SESSION FROM A MEASURED FALSE POSITIVE, WORKED AROUND NOT FIXED. The pipefail ratchet''s CONSTRUCT is, in effect, "a bar, optional whitespace, then a consumer that can quit early". The SECOND bar of a logical OR matches it, so a line reading `elif grep -qF A FILE || grep -qF B FILE; then` is refused although IT CONTAINS NO PIPE AT ALL and no producer that could ever take SIGPIPE. MEASURED on CM051 #2019: applying CONSTRUCT directly to the joined-continuation form of that file returns exactly one match, at that line, and no other. WHY IT IS NOT A CURIOSITY: the remedy the ratchet prints is specific and, on a false positive, actively wrong -- it tells the author to rewrite correct code to avoid an inversion that cannot happen. Rows already on the baseline may be in this category, which would mean the ceiling is INFLATED BY LINES THAT WERE NEVER AT RISK and a real regression could hide in that slack. The file''s own comments record exactly that concern about frozen fixtures, for the same reason. THE FIX NEEDS ITS OWN ARM, WHICH IS WHY IT WAS NOT DONE IN PASSING: neutralise `||` before matching (ERE has no lookbehind, so excluding a bar preceded by a bar cannot be written in the pattern), AND add a fixture containing `a || grep -q b` that the scanner must NOT report, alongside the seeded instance it MUST report, so the fix cannot itself blind the scanner to real pipes. DELIBERATELY NOT CHANGED MID-QUEUE: touching the shared CONSTRUCT moves the counted total for every file on the baseline and reds every open PR until it rebases. Worked around in #2019 by rewriting the line as a single grep -qE with alternation, with an equivalence check over three matching inputs and one non-matching one. '

