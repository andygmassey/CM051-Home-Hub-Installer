    title: 'Every install.sh change breaks the re-arm comment''s fifteen line citations, and the repair is done by hand each time'
    gate: 'GATE: NONE YET. 🔴 AND THIS ROW NUMBER NOW COLLIDES WITH A REAL PULL REQUEST, WHICH I CREATED MYSELF ABOUT TWO HOURS AFTER REGISTERING IT. CM051 PR #2152 is fix(compose): mount the AI Conversations tree, third instance of one shape (#979). This row is repo: none, an internal finding id, so nothing is broken and the checklist gate treats it correctly. But it is the EXACT collision that caused the 41-row strike: an internal id and a GitHub number sharing one space, and a reader resolving the number without reading the repo field. I walked into it within hours of writing the reversal for it, which is the strongest argument available that the rule ASK WHICH REGISTER THE IDENTIFIER BELONGS TO cannot be left to discipline. Rows 2149 and 2150, also registered tonight, carry the same exposure and will collide as soon as CM051 reaches those numbers. THE STRUCTURAL FIX, not attempted here: internal findings should not draw from the same number space as the tracker at all, or repo: none rows should carry a prefix that cannot be mistaken for an issue number. That is a schema change to every manifest and belongs to a person, not to a tired agent at the end of a shift. A DEVELOPER TAX, NOT A LAUNCH BLOCKER, registered so it stops being re-discovered. THE MECHANISM: the RE-ARM STORE CREDENTIAL comment in install.sh cites fifteen lines BY NUMBER, and tests/test_store_curl_config_survives_the_promote.sh checks that each cited line still contains the construct the comment names. That gate is RIGHT and must not be weakened: a comment citing :7574 for a line now at :7627 is worse than one citing nothing, because a reader checks it once, finds something plausible, and stops. BUT ANY INSERTION ABOVE A CITATION INVALIDATES IT, so every install.sh change that adds lines turns the gate red. MEASURED 2026-09-18, twice in one session: PR #2143 added 267 lines and moved 7 citations; PR #2151 added 30 and moved 11. Both were repaired by hand, by locating each construct with grep and running every candidate through the gate''s own accept predicate with a control line that must be rejected. THE REPAIR MUST NOT BE AN OFFSET, which is why this is not trivially scriptable-by-arithmetic: :15296 names "#177 ALL OVER AGAIN", not the WhatsApp note the surrounding prose discusses, and that note sits at :3265, nowhere near either number. Adding a uniform offset would land it on a line the predicate ACCEPTS while the comment''s claim about it is wrong, because the predicate checks that the line matches the claim, not that the claim is about the right thing. PRESCRIPTION, and it is a script rather than a schema change: a helper that, for each citation, greps for the construct the comment names, asserts exactly one match, runs the candidate through the same accept predicate the gate uses, and rewrites the number. That is exactly what was done by hand twice tonight, and it is deterministic. It must REFUSE rather than guess when a construct has zero or multiple matches, because a citation silently re-pointed at the wrong one of two matches is the failure this whole gate exists to prevent. PROOF REQUIRED: run the helper against a tree where the citations are known-stale, diff its output against the hand repair from PR #2151, and show they agree line for line.'
