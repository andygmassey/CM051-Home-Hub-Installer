ounted only because the unevidenced strike text sat on top of them. THIS WAS ALREADY FILED, ALREADY MEASURED, AND HALF ALREADY FIXED, AND MY FIRST ACCOUNT OF IT CLAIMED FAR TOO MUCH. Row 2114, 41 of 174 cut-checklist rows were struck on issue closure, not on a fix, names this exact defect with the same arithmetic I re-derived. PR #2115 then fixed _is_ungated so a struck row whose own text says the work is unfinished, or that names no checkable proof, is counted again. Row 2114 records the before and after: 0 ungated before, 35 after, with a control of 6 struck rows naming a merged PR that correctly stayed gated. So the COUNT was restored by #2115 two days before I looked, and that is why my successive estimates of the damage kept shrinking: I was measuring the residue of a defect somebody had already largely closed. TWELVE rows independently say, in their own gate text, that the number resolves to a PULL REQUEST: 946, 947, 948, 940, 942, 941, 943, 944, 928, 929, 960 and 1045, and row 960 puts it plainly, THE STRIKE''S EVIDENCE WAS WRONG AND ITS CONCLUSION IS RIGHT. WHAT WAS ACTUALLY LEFT UNDONE, and it is all this reversal is: the strike TEXT still asserted a false REASON on all 41 rows, so every reader was told the number named a closed issue when it named an unrelated merged pull request, and nothing stopped the next strike being made the same way. The text is corrected here and tests/test_a_struck_row_names_an_issue_not_a_pull_request.py refuses it next time. That is the whole contribution, and it is smaller than the first three versions of this paragraph said. HOW IT WAS FOUND, because no process caught it: by accident, while gating row 957 for a fix, noticing the row was already struck, and checking the number out of habit. The estate already carries the memory feedback_task_ids_collide_with_github_numbers and it did not prevent this. GATE: tests/test_a_struck_row_names_an_issue_not_a_pull_request.py now refuses a strike that names no title, and refuses one whose number resolves to a pull request. ORIGINAL FINDING, which carried no gate until now: It previously carried no gate. Tier ''beta'' plus expires_at. Expiry degrades to READ-ONLY, never destructive, and the tester is warned BEFORE it happens. NOT MEASURED: whether the Hub enforces expiry at all today. 57 references prove the field exists, not that anything acts on it.'

