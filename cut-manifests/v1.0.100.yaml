e beta window is expressed in, so merging #2019 first would land an entitlement with nothing to express it in. Its guard is reported as 20 passed, 0 failed, 0 could not run, with check_licence_expiry present in ALL_RULES rather than defined and unreferenced, which is the difference between a rule and a rule nobody runs. THE SEVERITY MEASUREMENT FROM MY EARLIER GATE STANDS AND IS WORTH KEEPING: the expiry gate is at INSTALL time, so a lapsed beta licence blocks a re-install and does not kill a running Hub. That is the difference between an annoyance and a customer losing access to their own data, and it is why this was never urgent even while it was unfixed. WHAT I SHOULD HAVE DONE, recorded so the next agent does not repeat it: the order of work says to land a reporting agent PR before adjudicating the row it belongs to. I adjudicated first and checked second, for two rows, and both verdicts were wrong in the direction of more work rather than less. RETIREMENT CONDITION: this row retires when #2017 and then #2019 are both on main AND a test exercises an EXPIRED licence specifically rather than a merely absent or malformed one, because those already have their own arms and passing them proves nothing about expiry. THE STRIKE ON THIS ROW WAS UNSOUND AND IS WITHDRAWN 2026-09-16. It read "the issue this row names is CLOSED on GitHub". It is not. HR015 #929 is an OPEN issue titled "[LAUNCH] Time-limited beta licences for early testers", which matches this row''s subject. THE MECHANISM, measured rather than guessed: these row numbers are HR015 issue numbers, and the closure check resolved them in CM051, where the same number is an unrelated closed PULL REQUEST. Row 940 is the clearest example: CM051 #940 is a closed PR titled "fix(editor): emit the interest-profile artefact the Hub actually serves", while HR015 #940 is the open [LAUNCH] recording-consent issue this row is about. Ask CM051 whether 940 is closed and the answer is yes, about a different thing entirely. This 