dy CLOSED": the row about this class of error was removed by the error. HOW IT GOT IN: commit d7a3da88, inside PR #1975, whose subject is a SPARQL editor bug, so nobody reviewing that PR was reviewing a 41-row board strike. Its own message says "and one strike was wrong", so the counterexample was already in hand and was filed as an exception rather than read as evidence about the method. WHAT THIS REVERSAL IS AND IS NOT: it restores the row to the count. It is NOT a claim the work is undone, and it is NOT a re-triage. Each of the 41 needs its own measurement, which is a day of work and is owed. Until then the row is counted as ungated, which looks worse and is true. THE SIZE OF THE EFFECT, MEASURED, AND I REVISED IT DOWN TWICE. First I said 4 ungated to 33, from my own literal search rather than the gate''s definition. Then 40 to 46, which double-counted rows my own reversal text had accidentally marked ungated: the narrative SPELLED OUT the ungated marker while describing it, and the checklist gate counts that marker by substring, so the prose became the verdict. Third time in one night that writing ABOUT a predicate tripped it. AND THE FIRST STATEMENT OF THE FIX NAMED THE WRONG MECHANISM, which Archie caught: the ungated test is a plain substring on the whole uppercased value, with no anchor and no position test, so putting the verdict at the FRONT protects nothing. What actually protects it is NEVER SPELLING THE MARKER IN THE NARRATIVE. The verdict is still at the front because that is where a verdict belongs, but anyone relying on the position would put the marker back in the prose below it and silently flip the row for ever, with a correct-looking verdict still on top. A fix whose stated mechanism is wrong is a fix that gets undone by somebody following the instructions. The final measurement, running the checklist gate''s own _is_ungated against an origin/main checkout and against this board: 40 before, 42 after. Of the four newly counted, TWO are rows registered in this same PR (2138 and 2141) and only TWO were suppressed by the strike: 956, evernote_knowledge empty on a box that shipped the importer, and 1018, another session mutating the shared checkouts. Two rows stop being counted, correctly: 941 and 960 carry real gates of 10,160 and 5,635 characters, and on main they were counted only because the unevidenced strike text sat on top of them. THIS WAS ALREADY FILED, ALREADY MEASURED, AND HALF ALREADY FIXED, AND MY FIRST ACCOUNT OF IT CLAIMED FAR TOO MUCH. Row 2114, 41 of 174 cut-checklist rows were struck on issue closure, not on a fix, names this exact defect with the same arithmetic I re-derived. PR #2115 then fixed _is_ungated so a struck row whose own text says the work is unfinished, or that names no checkable proof, is counted again. Row 2114 records the before and after: 0 ungated before, 35 after, with a control of 6 struck rows naming a merged PR that correctly stayed gated. So the COUNT was restored by #2115 two days before I looked, and that is why my successive estimates of the damage kept shrinking: I was measuring the residue of a defect somebody had already largely closed. TWELVE rows independently say, in their own gate text, that the number resolves to a PULL REQUEST: 946, 947, 948, 940, 942, 941, 943, 944, 928, 929, 960 and 1045, and row 960 puts it plainly, THE STRIKE''S EVIDENCE WAS WRONG AND ITS CONCLUSION IS RIGHT. WHAT WAS ACTUALLY LEFT UNDONE, and it is all this reversal is: the strike TEXT still asserted a false REASON on all 41 rows, so every reader was told the number named a closed issue when it named an unrelated merged pull request, and nothing stopped the next strike being made the same way. The text is corrected here and tests/test_a_struck_row_names_an_issue_not_a_pull_request.py refuses it next time. That is the whole contribution, and it is smaller than the first three versions of this paragraph said. HOW IT WAS FOUND, because no process caught it: by accident, while gating row 957 for a fix, noticing the row was already struck, and checking the number out of habit. The estate already carries the memory feedback_task_ids_collide_with_github_numbers and it did not prevent this. GATE: tests/test_a_struck_row_names_an_issue_not_a_pull_request.py now refuses a strike that names no title, and refuses one whose number resolves to a pull request. ORIGINAL FINDING, which carried no gate until now: It previously carried no gate, and noted: AND THIS IS WHY NONE OF 960 OR 961 EVER WENT RED. ttywalk.sh:645 dumps /store?default before wiping and captures 154,920 of 230,864 quads. IT SILENTLY MISSES 75,944 QUADS, 13.6 MB, which is EVERY CM048 triple. So every walk record we hold was written by an instrument that could not read the majority of the customer data. install.sh:17504 runs Oxigraph WITHOUT --union-default-graph and compartment.py:32 REQUIRES it stay off, so this cannot be fixed globally: each query must carry its own scope. Exactly ONE production reader uses the is_empty defence (enricher.py:333) and that fix was never carried to its five siblings, the same one-file-at-a-time pattern as 958. SOURCE-ONLY, NOT TESTED BECAUSE TESTING MEANS WRITING TO THE BOX: per the repo own round-trip in repair_role_address_people.py:246, a POST to /store with no parameter MINTS A NEW NAMED GRAPH. Affects enricher.py:1295, latent because never invoked.'

