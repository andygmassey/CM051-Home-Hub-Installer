    title: "The Doctor daemon is killed by launchd about once a minute and silently respawns"
    gate: 'MERGED TO main 2026-09-16 as #1979, squash c7a961cdcf9c. This row previously said NOT YET MERGED and in no artefact; the first half is now false and the second is still true. MERGED is not DELIVERED and is not PROVEN: no v1.0.99 DMG exists yet, so nothing here has been observed on a walk. The row stays open until it has. ORIGINAL TEXT BELOW. FIXED, PR #1979, with a fork-counting test, two controls and a mutation. MEASURED BEFORE AND AFTER: 60 polls, one minute at the observed rate, 300 forks before and 9 after. MUTATION: disabling the cache gives 240 forks against a budget of 12, and that run exceeds a two-minute timeout, which is the defect made visible. The fix is a fork budget in box_status.py rather than a slower poll, because the interval is set by the native WebView: a fix in the caller protects one caller, a budget here holds however often and from however many tabs it is called. Freshness per probe by how fast each number can really move, so nothing shown to the customer misleads. TWO CONTROLS, because a fork budget is trivially satisfied by doing nothing: one forces two real subprocesses and requires the counter to see them, so a broken counter cannot report a clean zero; the other requires the FIRST poll to fork, so the budget cannot be met by a daemon that stopped reading the machine. ORIGINAL FINDING: box_status.py:82,103,264,322,450 spawns FIVE subprocess.run calls per status poll and web_ui.py:2864 polls at about 1 Hz. launchctl reports immediate reason = inefficient, last terminating signal = Terminated: 15, and 58,914 FORKS IN ABOUT 40 HOURS. CONTROL: every comparable daemon on the same box shows 0 to 44. macOS SIGTERMs it, KeepAlive restarts it, every open Doctor tab is dropped, and the exit code stays 0 so no health check we own can see it.'

