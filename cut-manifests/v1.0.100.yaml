  # ==========================================================================
  # DEFECT-ABSENCE PROOFS for defects MEASURED on the v1.0.71 walk box today.
  # Each pattern is the broken form. must_match:false means the cut fails while
  # the defect is still in the tree.
  # ==========================================================================

  - id: downloads-watcher-defines-its-own-deadline
    title: the generated Downloads scanner must define the names _notify uses
    incident: "v1.0.71 box 2026-09-05: ostler-scan-exports line 18 OSTLER_OSASCRIPT_TIMEOUT_S unbound, rc=1, importer never called"
    proof:
      kind: grep_in_installer
      # THE NEEDLE OMITTED THE QUOTES, SO IT MATCHED NOTHING AND THE ROW COULD
      # NEVER PASS. The shipped assignment wraps its default-expansion in
      # DOUBLE QUOTES; the pattern looked for the bare, unquoted form. The
      # exact literal is deliberately NOT reproduced in this comment: a
      # landing check for the quoted form counted this very line and read 1
      # where it expected 0. Describe a flagged literal, never repeat it.
      # Measured on
      # cf5e3193 with the fix present: old needle 0 hits, quoted needle 2.
      #
      # AND THE COUNT IS THE PROOF, NOT THE PRESENCE. install.sh defines this
      # name twice once the fix is in: once in its own scope, and once inside
      # the SCANEOF heredoc that becomes ostler-scan-exports. Only the second
      # is the subject of this row, and the two lines are textually identical,
      # so no single-line pattern can tell them apart. Measured:
      #
      #     2fb58d1e (fix ABSENT)  1 hit   <- install.sh scope only
      #     cf5e3193 (fix PRESENT) 2 hits  <- plus the generated scanner
      #
      # So must_match alone would PASS on the tree that still ships the defect.
      # min_hits: 2 is what makes this row discriminate. It requires the
      # grep_in_installer floor added in the same PR as this row.
      pattern: 'OSTLER_OSASCRIPT_TIMEOUT_S="\$\{OSTLER_OSASCRIPT_TIMEOUT_S:-20\}"'
      must_match: true
      min_hits: 2

  - id: killed-converge-still-gets-catchup
    title: the catch-up guard must consider the KILLED marker, not only .done
    incident: "v1.0.71 box: .done AND .killed both present; agent skipped; 84 people split across two stores; 3 QA probes failed"
    proof:
      kind: grep_in_installer
      pattern: "_DEDUPE_DONE_MARKER\" \\|\\| -f \"\\$_DEDUPE_KILLED_MARKER"
      must_match: true

  # THIS PAIR IS ONE PROOF, AND THE SECOND HALF IS NOT OPTIONAL.
  #
  # The absence row below was GREEN ON MAIN FOR THE WRONG REASON. Measured:
  # `ASSUME_YES` appears ZERO times in install.sh on origin/main (control:
  # `OSTLER_` appears 1655 times, so the file is readable). #1567 has not
  # landed, so the row could not tell "the bad form is absent because the fix
  # is right" from "the feature does not exist at all".
  #
  # That is precisely the defect #1153 describes -- a needle satisfied by
  # something other than the thing it exists to prove -- sitting inside the
  # manifest that bans it. Found by a review of my own rows, not by the gate.
  #
  # So the absence proof is paired with a presence proof naming the construct
  # the fix actually introduces. Until #1567 lands the presence row is RED,
  # which is correct: the property is unproven, and the manifest should say so
  # rather than report a pass it did not earn.
  # A CALL-SITE PROOF, AND THE REASON IT IS NOT AN ABSENCE PROOF.
  #
  # This replaced a row grepping `[[ -n "$ASSUME_YES" ]]` with must_match:false,
  # which was wrong TWICE. It was green on main only because ASSUME_YES did not
  # exist there at all (0 occurrences against 1655 for OSTLER_), and it would
  # have gone RED ON THE CORRECT FIX: #1567 still contains that exact string,
  # in a safe role, warning that a value was set which does not mean consent.
  # Measured hits=0 on main, hits=1 on the PR. A gate that fires on the fix is
  # worse than no gate: the debugging it causes looks like the fix broke
  # something.
  #
  # Anchored to the CALL, not the definition. `_assume_yes_granted` alone is
  # satisfied by a function that exists and is never reached -- the exact
  # mutant TNM's #1579 shows the converge row passing.
  - id: uninstall-consent-is-an-allowlist-not-a-non-empty-test
    title: the uninstaller's confirm bypass must be decided by a value allowlist, at its call site
    incident: "#1560 + review 2026-09-05: -n tests non-empty, so =0, =no and =false all proceeded to destroy. The first replacement row banned a SUBSTRING the correct fix still contains in a safe role."
    proof:
      kind: grep_in_installer
      pattern: "(?m)^if _assume_yes_granted; then"
      must_match: true

  # ==========================================================================
  # CARRIED FROM v1.0.90, RE-VERIFIED AT THIS CUT'S OWN HEAD (see the
  # description block's allow_private_hosts diff for the method): v1.0.89
  # aborted on a freshly wiped Mac with ERR-04-HOMEBREW-INSTALL because
  # Homebrew retired the master branch; v1.0.90 fixed it and this cut does
  # not touch install.sh's logic at all, only the daemon/hub-app pin values.
  # ==========================================================================
  - id: brew-manual-tarball-targets-main
    title: the manual, no-sudo Homebrew tarball install must fetch tarball/main
    incident: "v1.0.89, freshly wiped Mac, no Homebrew present: install.sh fetched https://github.com/Homebrew/brew/tarball/master, curl and tar succeeded, and the very next command /opt/homebrew/bin/brew --version exited 1 with 'Error: Homebrew's master branch is no longer supported.' install.sh aborted at ERR-04-HOMEBREW-INSTALL. Fixed by CM051 #1920, ac0b5d518b557494e9450256bbfeb76780a2e563."
    source_pr: andygmassey/CM051-Home-Hub-Installer#1920
    source_sha: ac0b5d518b557494e9450256bbfeb76780a2e563
    proof:
      kind: grep_in_installer
      pattern: "https://github\\.com/Homebrew/brew/tarball/main"
      must_match: true

  - id: brew-manual-tarball-master-absent
    title: no code path in install.sh fetches the retired Homebrew tarball/master branch
    incident: "Same incident as brew-manual-tarball-targets-main. An absence proof so a future edit cannot silently reintroduce the retired branch name."
    source_pr: andygmassey/CM051-Home-Hub-Installer#1920
    source_sha: ac0b5d518b557494e9450256bbfeb76780a2e563
    proof:
      kind: grep_in_installer
      pattern: "https://github\\.com/Homebrew/brew/tarball/master"
      must_match: false

  # ==========================================================================
  # THE FLOOR. Five surfaces Andy found broken BY HAND in the week of
  # 2026-09-08, every one of them missed by every gate this project had.
  #
  # THE RULE: the subject of each assertion is a PERSON or the thing they see.
  # If the subject is a file, it does not belong in this block. Every other
  # gate we own asks whether an artefact exists; none asked whether a customer
  # got what they wanted, which is how /doctor served 500 for three builds
  # while /api/v1/sources answered 200 and everything stayed green.
  # ==========================================================================
  - id: probe-doctor-page-renders-for-a-customer
    title: "box-walk probe must PASS: doctor_page_renders_for_a_customer"
    why: |
      GET /doctor must return 200 AND carry a rendered table. Not the endpoint
      behind the page: the page. Self-test proven on three arms (500-with-body
      FAILs, 200-without-a-table FAILs, 200-with-a-table PASSes).
    proof:
      kind: box_walk_probe
      probe: doctor_page_renders_for_a_customer
  - id: probe-ostler-unlock-reachable-by-name
    title: "box-walk probe must PASS: ostler_unlock_reachable_by_name"
    why: |
      A customer typing `ostler-unlock` must reach the redeemer and have a
      wrong key refused. It shipped inside the DMG at a venv path nobody types
      and Andy got "command not found". MUST BE BLOCKING in
      walk_promote_scope.tsv.
    proof:
      kind: box_walk_probe
      probe: ostler_unlock_reachable_by_name


open_issues:

  - issue: 945
    repo: HR015
    title: "Front page reads 0 interests: the editor SPARQL query is refused by Oxigraph"
    gate: 'GATED by entry probe-front-page-reports-interests. ROOT CAUSE FOUND 2026-09-16 and it is not a compiler bug. Measured on the live box: Oxigraph 127.0.0.1:7878 answers 401 with no credential and 111289 triples with one. interest_profile._sparql_select sent only Accept and Content-Type, so every read returned zero rows and the compiler wrote raw_rows 0 AND EXITED 0. A refused query and an empty graph are the same branch in every caller above it, which is why three builds shipped with an empty front page and nothing went red. The blanket store-auth shim could never reach this call site: it is a .pth inside each SERVICE VENV and THE EDITOR HAS NO VENV. Fix on branch fix/editor-sparql-presents-store-credential, reading the same env var and same 0600 file the shim uses, and RAISING on 401 rather than returning an empty list.'

  - issue: 946
    repo: HR015
    title: "The sources table renders but the counts are empty"
    gate: 'FIXED IN PR #2010, AND THE ROW''S OWN TITLE WAS WRONG: THE COUNTS WERE NOT EMPTY, THEY WERE FABRICATED. Measured by driving the real install.sh recorders into real sentinel files and rendering the real vendored Doctor panel, 4 of 13 source rows were wrong and 3 of those were a FABRICATED ZERO: places, dedupe and privacy_backfill each carried payload ran=1,rc=0 and rendered "read in 0 items" -- three sources that had just SUCCEEDED, reported to the customer as having found nothing. browsing carried sent=1500,skipped=20 and rendered 20 instead of 1,500. people carried sent=unknown,collection_points=7154 and rendered 7,154. THE CAUSE: _hydrate_payload_count took the value after the LAST "=". For ran=1,rc=0 that is the RETURN CODE. The Doctor already declares rc is not a count at diagnostic_rules.py:1782, and _hydrate_qdrant_points explicitly forbids equating collection_points with a run''s output. The writer did both anyway. CONSUMER-SIDE: every assertion''s subject is a rendered HTML table cell. A customer who had just ingested their browsing history saw 20; they now see 1,500. Three who had ingested successfully saw 0; they now see a count. MODES CHECKED: no-consumer (the value is assigned at web_ui.py:1493 and interpolated at :2056, with render_dashboard as the control returning its own sites); unreachable (the guard EXECUTES the shipped renderer, it does not read it); a test nothing runs (the repo''s own new-tests-wired gate PASSED, and test-wiring passed after --regenerate); zero denominator (the guard exits 2 and that branch is exercised -- it refuses to grade under 13 rows and 8 assertions); graded non-blocking (no continue-on-error); not in the DMG (install.sh is the bundled payload and the vendored doctor is deployed to the customer''s ~/.ostler/doctor); dead (disproved by mutation). MUTATION, FOUR: original helper restored -> 5 FAIL; helper blanks all counts -> 3 FAIL; only "skipped" dropped -> 1 FAIL; restored -> 8 PASS. The blank-everything mutant is NOT hypothetical, it was the first draft of the fix, caught only because the rendered table was measured rather than the diff trusted. All 18 hydrate/source-status tests green before and after, under /bin/bash 3.2.57, the shell the installer ships under. STILL PENDING WHEN HANDED OVER: the macOS sentinel-honesty job that executes the new guard was QUEUED, not green. Reported as pending, not claimed. FIXED, AND THE RESIDUAL IS INVISIBILITY RATHER THAN BLANKNESS. For the 13 canonical sources the count is now explicit: vendor/doctor/agent/web_ui.py:1335 renders an em-dash when the count is None, with five distinct labels (read in / nothing to read / not run yet / record unreadable / failed). Merged as #1971. Reachable: render_source_status is called at :1493 and embedded at :2056, and the test is WIRED via vendor-integrity.yml. NO MUTATION OR CONTROL ON THE COUNT: the test asserts only tuple membership, so it cannot tell a correct count from a wrong one. AND THE LINKEDIN HALF IS BUILT WITH NO CONSUMER: install.sh detects three LinkedIn shapes at :21577 but NO LinkedIn recorder exists, so those rows are INVISIBLE rather than blank -- and the canonical-match test passes precisely because BOTH SIDES omit it, which is the closed loop this board keeps finding. The store-credential theory does not apply: counts come from .done sentinel files. GATE: VERIFIED ON main BY CONTENT AND BY REACHABILITY, WITH ONE RESIDUAL THAT IS REAL AND STAYS OPEN. CM051 #2010 MERGED 2026-09-16T11:20:21Z. Checked against the BLOB on origin/main rather than the pull request state, because a merged PR is a claim about a branch and the question is what main holds. THE FABRICATED ZERO IS GONE AT ITS CAUSE: _hydrate_payload_count, the helper that took the value after the LAST equals sign and so returned a RETURN CODE as a count, no longer exists on main, 0 occurrences. THAT ZERO IS A REAL ABSENCE AND NOT A BROKEN READER, proved with controls of the same shape on the same file through the same read