nches are not updated speculatively, because each update is another full run. The structural point survives in weaker form and is still worth someone''s decision: about 140 checks per PR on shared runners leaves very little headroom, so the aggregate''s timeout is the first thing to break under any load at all. It is not wrong for the gate to refuse; it is wrong that the only way out is to reduce concurrency by hand. REMEDY IS A JUDGEMENT CALL, NOT MINE ALONE: raise the aggregate timeout, or serialise the lane, or reduce the check count per PR. Recorded so the next person does not read six identical reds as six defects. The seventh, #1989 on cut-checklist-complete, is a genuine dependency: issue 1976 is registered only on #1975''s manifest, so every branch cut from main fails that gate until #1975 lands. #1975 IS THE KEYSTONE.'

