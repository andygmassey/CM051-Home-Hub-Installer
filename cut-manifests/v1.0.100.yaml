    gate: 'NOT BLOCKING for the v1.0.100 ARTEFACT, and BLOCKING for the launch. The two are different questions and this row keeps them apart. FOUND BY LOOKING AT THE CONSUMER SIDE AFTER A GREEN CUT, which is the only reason it was found at all: the cut was success, every gate passed, the DMG is signed and notarised, and a customer still could not get it. MEASURED, not inferred: releases/latest resolves to v1.0.41, and the customer URL serves 57877510 bytes, which is v1.0.41''s DMG BYTE FOR BYTE, against v1.0.100''s 72098359. Every release since v1.0.41 carries prerelease=true (v1.0.100, v1.0.98, v1.0.95, v1.0.90, v1.0.89, v1.0.88 all measured), and GitHub resolves latest to the newest NON-prerelease. The website redirect was never wrong: _redirects maps /install.dmg to /releases/latest/download/OstlerInstaller.dmg and it is resolving correctly to a release nobody promoted. WHY THE ARTEFACT IS UNAFFECTED, checked rather than assumed: install.sh contains exactly TWO references to releases/latest, at :1220 (help text) and :4027 (DEFAULT_INSTALLER_TARBALL_URL), and BOTH belong to the curl-pipe-bash route rather than the DMG route. Everything the DMG actually fetches is pinned by EXPLICIT TAG, hub-v${OSTLER_ASSISTANT_VERSION}, with a digest verified fail-closed. So a customer holding the v1.0.100 DMG installs v1.0.100''s world; the defect bites only the person trying to OBTAIN the installer. install.sh''s own comment at :4027 already records that latest is v1.0.41 and that the tarball it names has not been published since v0.3.0. THE MISSING HALF IS THE PROMOTE, NOT THE PUBLISH. Prereleasing an unwalked build is arguably correct: the launch directive earns a customer-facing artefact with a clean walk, not a green cut. Nothing promotes a release AFTER its walk passes, so the pipeline has a correct first step and no second step. scripts/publish_release.sh already documents the exact failure in its header ("Publishing v1.0.37 as a PRERELEASE left the 404 in place (measured); promoting it to latest fixed it with no config change. Hence --latest below is load-bearing, not decoration"), so the knowledge exists and the promotion does not happen. NOT FIXED BY FLIPPING v1.0.100 TO LATEST, deliberately: it has not been walked, and making an unwalked build the customer download in order to close a reporting gap is the same class of mistake as the gap. The fix is a promote step GATED ON THE WALK RECORD, with the customer URL''s byte count as its proof, which is one curl.'

