first 100 queued runs by branch: 63 of them belong to the two branches I raised in the last hour, 32 and 31, against 37 for another set. The row author previously wrote that they had assumed thirteen PRs were starving each other, measured it, and found the load was their own. I did not avoid that by knowing about it. The honest statement is that the lane is saturated and a measurable majority of the current queue is mine. WHAT THAT MEANS FOR READING REDS ON THIS BOARD, and it is the practical value of this row: an aggregate that refuses because two checks never STARTED is not a defect in the branch it refuses. The gate is right to refuse, and its own words are the doctrine this repo runs on, that nothing was safely established so it is not a pass and a vacuous green is the exact thing the check exists to prevent. Six identical reds across six PRs were this, once, and reading them as six defects would have cost six investigations. THE STRUCTURAL POINT SURVIVES AND IS STILL UNDECIDED. About 80 checks per pull request on shared runners leaves no headroom. The only lever anyone has used so far is reducing concurrency BY HAND, which works and does not scale past the person remembering to do it. THE THREE REMEDIES, STATED AS A CHOICE RATHER THAN A RECOMMENDATION, because this one genuinely is not an agent decision: raise the aggregate timeout, which makes the gate tolerate a longer queue and also makes a genuinely stuck run take longer to surface; serialise the lane formally, which is what is already happening informally and would make it enforced rather than remembered; or reduce the check count per pull request, which is the only option that attacks the cause and the most expensive to get wrong, because every check removed is a check that was presumably added for a reason. STRICT-WITH-ONE-REQUIRED-CONTEXT IS A DELIBERATE SAFETY PROPERTY and the queue is the price of it. Nobody should trade it away to make a number go down without saying out loud what is being traded. TH