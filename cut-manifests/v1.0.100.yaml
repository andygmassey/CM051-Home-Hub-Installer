s the last thing a customer sees, it is the pairing step that connects the phone they bought the product for, and the copy actively misdirected them toward waiting. FIXED IN CM051 #2040, which is OPEN, not merged, and by item 9 the word is RAISED. Measured 2026-09-16: TOTAL=79, SUCCESS=78, SKIPPED=1, FAILURE=0, ZERO outstanding, so it is settled and fully green rather than predicted to be. Each typed case now maps to copy that matches what happened, and transport KEEPS the starting-up wording because nothing answering is the one case where waiting really is the advice. A DESIGN DECISION INSIDE IT IS WORTH RECORDING: nonSuccessStatus carries the code AND the body, and only the CODE is surfaced. The code is a bounded integer that tells a reader whether retrying can help; the body is daemon-controlled text of unknown length and content, and rendering it into a customer-facing label would make that label a disclosure channel for whatever the gateway returned. A test pins it by seeding a secret body and asserting it never reaches the string. AND ITS TEST CARRIES A CONTROL THAT THE OBVIOUS VERSION WOULD LACK: the copy catalogue returns the KEY when a key is missing, so if the fetch_failed string ever vanished, every assertion that the refusal message DIFFERS from it would pass for entirely the wrong reason. One case therefore asserts fetch_failed is real copy FIRST. ONE THING FLAGGED IN AN EARLIER DRAFT OF THIS ROW AND NOW SETTLED AS A NON-ISSUE: that draft noted an EN DASH in the fetch_failed string as a possible house-rule breach. It is not one. gui/OstlerInstallerTests/StringsCatalogueEmDashTest.swift states the locked rule in its own header and bans U plus 2014 and the whitespace-bounded double hyphen, while line 37 records in as many words that U plus 2013 is ALLOWED and line 12 calls it the CANONICAL REPLACEMENT. Two of us agreed the dash was a defect before either checked the scope, and a sweep of 16 correct strings was nearly started on it. A peer agreeing is not 