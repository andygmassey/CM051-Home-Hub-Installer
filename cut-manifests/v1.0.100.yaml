    gate: 'FIXED AND RAISED AS CM051 #2092, FOUND BEFORE THE TAG RATHER THAN BY IT. tests/test_installer_version_consistency.sh derived the build number with `^1\.0\.([0-9]{1,2})$` -- one or two digits, true for every version this product has ever cut and false at v1.0.100. MEASURED on the shipped function, with the two-digit neighbours as the POSITIVE CONTROL OF THE SAME SHAPE: 1.0.98 -> rc=0 build=9800, 1.0.99 -> rc=0 build=9900, 1.0.100 -> rc=2, 1.0.101 -> rc=2. rc=2 is CANNOT-RUN, the caller exits 2, and gui/Makefile check-version is a prerequisite of `package`, so the cut would have died BEFORE the build, exactly the way v1.0.96 was spent on paperwork. CONSUMER-SIDE, both arms measured on the bumped tree: with main''s derivation the gate returns rc=2 and prints "Extend derive_build_number() in this file"; with the fix it returns rc=0 and PASSES, "v1.0.100 build 10000". The customer-visible consequence is CFBundleVersion, the field Sparkle compares to decide whether an update is offered: 10000 against v1.0.99''s 9900. THE ASYMMETRY IS LOAD-BEARING: the patch widens to three digits, the sub-patch stays at two, because patch*100+subpatch would otherwise let 1.0.99.100 and 1.0.100 both derive 10000, two versions sharing one build number. SWEPT: two-digit version regexes appear in exactly ONE file on origin/main, this one; every other version comparison in scripts/, gui/Makefile and .github/workflows/ uses `sort -V`, which orders 1.0.100 after 1.0.99 (plain `sort` ranks it BELOW 1.0.98, and nothing uses plain sort). HOW BOTH LANDMINES WERE FOUND, because the method is the transferable part: by asking what is FIRST-OF-ITS-KIND about the next artefact before spending a version number on it. A value no code has ever seen is where the cut breaks, and that question found two in one night.'

  - issue: 2095
    repo: CM051
    title: 'The walk record does not name the model that produced its verdicts, so a grounded FAIL is attributed to nothing'
    gate: 'NOT BLOCKING (instrument gap, not a product defect). The literal phrase matters: tests/test_the_cut_checklist_is_complete.py:534 decides with `"BLOCKING" in head and "NOT BLOCKING" not in head`, so a head reading "NOT LAUNCH BLOCKING" parses as BLOCKING. This row said exactly that until it was checked. NO CUSTOMER IS AFFECTED; WE are, because it makes a class of result unreadable. No customer is affected by it; WE are, because it makes a class of result unreadable. Filed 2026-09-17 while trying to answer a direct question about whether the floor model tool-calls on the opening turn, and being unable to from any committed record. MEASURED, with a positive control so the zeros are real absences and not a broken predicate: `grep -lE "qwen|gemma" walks/*.tsv` returns 0 of 20 records; `grep -clE "tool_call|no_tool_call" walks/*.tsv` returns 0 of 20; CONTROL `grep -c assistant_answers_grounded walks/v1.0.95.tsv` returns 2, so the predicate reads these files correctly. THE PROBE ALREADY COMPUTES WHAT IS MISSING: assistant_answers_grounded.sh emits `FRAME tool_call <name>` per turn and classifies each turn grounded / no_tool_call / fact_missing / tool_found_nothing:<tool>. The .tsv drops all of it, and carries no model tag, so every grounded FAIL in this repo history is attributed to nothing and two walks on two boxes can disagree for a reason the record cannot express. A SECOND FINDING ON THE SAME INSTRUMENT, and it is the sharper one: box_fp is NOT a box identifier. post_walk_qa.sh:452 computes it as sha256 of $BOX truncated to 16, and $BOX is an ssh target, "routinely user@address" by the comment three lines above. So the SAME machine yields different fingerprints for different operators and different DHCP leases. PROVEN BY COMPUTATION rather than recollection, 7 of 11 fingerprints solved, with a control (a deliberately wrong candidate matches nothing): two of the solved values are the same address under two different user names, and one of those is the most common value in the whole record set. So "11 distinct box_fp across 20 records" does NOT establish 11 machines, and must not be used to contradict anyone about which box a walk ran on. WHAT IS BEING DONE: CM051 #2096 adds assistant_grounds_the_opening_turn, which reads the model from the LIVE config and the RAM from the box and records both, so the next grounding result is attributable even before this row is closed. THE REST OF THE FIX is four fields on the record: model_tag, ram_gb, the per-turn classification, and a machine id that survives a user change and a lease. The privacy constraint that made the host a hash does not reach any of them: a model tag and a RAM figure identify nobody, and gemma4:e2b is a public model name.'

