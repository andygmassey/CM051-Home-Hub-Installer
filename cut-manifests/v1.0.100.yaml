  - issue: 2066
    repo: CM051
    title: 'The capability matrix is not consulted by the path that makes the DMG'
    gate: 'FILED BY ME THIS SESSION, AND THE GATE CAUGHT ME NOT REGISTERING IT, which is the register working. MEASURED IN THIS REPO, with positive controls of the same shape in the same file: capability_matrix reads 0 occurrences in .github/workflows/cut.yml and 0 across .github/workflows entirely, against MUST_CONTAIN at 2 and verify_must_contain at 1 in that same cut.yml, so the reader works and the zero is a real absence. cut.yml states it itself at line 734: a tag push firing THIS workflow never consults OS003. WHY IT MATTERS. A tag push is the ONLY way a publishable DMG comes into existence, and gates/capability_matrix.sh in OS003 is the gate that answers whether each capability we have ever shipped is STILL IN the artefact. It exists because v1.0.14.1 shipped a daemon whose lineage had dropped 149 commits, four apparently separate customer bugs were one cause, and every gate passed. So on the shipping path nothing checks that a fix reached the DMG. That is half-wired failure mode six, present in the repo but not in the DMG, with the check that would catch it living on a path the artefact does not take. A SECOND FACT, SEPARATE AND NOW FIXED: the matrix could not run at all. Five manifest rows added on 2026-09-09 spelled the repo column CM051 where repo_dir accepts only cm051, and require_known_repos runs BEFORE the dispatch, so it died rc 2 over the whole manifest. Before: rc 2 CANNOT RUN, 0 rows examined. After lowercasing five fields, in OS003 PR #302: 177 rows examined. That failure was LOUD where it was invoked, at bin/cut.sh line 550, where rc 2 reaches cannot and exits 2. Calling it dark would have been wrong and is corrected here. WHAT THIS IS NOT. It is not a claim that anything is missing from a v1.0.99 DMG. No such DMG exists. It is a claim that if something were missing, this gate would not be the thing that told us. NOT FIXED FOR THIS CUT, AND THAT IS A DECISION WITH A REASON, not a deferral. CM051 is PUBLIC and OS003 is not, so wiring the matrix into cut.yml means handing a public repo workflow a way to read a private one, which is a credential decision. Doing that next to a cut is how the shipping path acquires a new failure mode on launch day. The alternatives to weigh are gating the RELEASE from the OS003 side against the published artefact rather than gating the BUILD, or vendoring the manifest into CM051 and accepting it then has two homes. WHAT IS TRUE FOR THIS CUT INSTEAD: the v1.0.99 BOM went from 11 rows with 11 unguarded to 27 rows with 0 unguarded, revert-proved 28 of 28 present at main and 28 of 28 FAIL at tag v1.0.98 with 0 CANNOT-RUN, so the patterns discriminate. The proof exists and is correct; what is missing is its invocation on the tag path. NOT PROVEN, and cannot be: no DMG exists.'
  - issue: 2074
    repo: CM051
    title: 'A mutation suite needs both a synthetic and a historical arm, and CANNOT-RUN when it has neither'
    gate: 'NOT BLOCKING (test estate, not the artefact): filed so it is a row rather than a paragraph in a closed PR. THE INCIDENT IT COMES FROM IS CLOSED: context-digest-auth was success at 2026-09-16T15:38:49Z and failure at 15:53:34Z, four seconds after #2013 merged, because MUTANT A materialised its pre-fix module from origin/main and the day the fix landed the mutant BECAME the fix. Eight open PRs broke out of the merge queue on it. Fixed on main by PR #2067, which derives the mutant from the module under test and so has no reference left to rot. WHAT IS STILL OPEN IS A DIFFERENT AND SHARPER QUESTION, and no one of the three PRs raised for that outage resolves it. A synthetic edit proves the suite catches AN edit to that function. A historical pre-fix file proves it catches THE defect as it actually was. Those are different claims and only the second is about the incident. The pinned-file arm is the stronger claim on the more fragile mechanism: it rots SILENTLY once the module drifts far enough that the old file no longer exercises the same path. The synthetic arm is the weaker claim on the durable mechanism: it refuses loudly when its anchor is refactored away. Carrying one and not the other means either a claim we cannot make or a mechanism that rots. THE REMEDY, stated so it can be checked rather than remembered: carry BOTH arms, and report CANNOT-RUN when neither mutant can be built, never a pass. That third state is also the answer to what happens when the historical file eventually stops applying, because the suite says so instead of quietly narrowing to the synthetic arm. The existing cmp did-it-apply check generalises to both arms: byte-identical to the shipped module means the mutation is a no-op, and a mutant that did not apply looks exactly like one that was not caught. SCOPE IS A PATTERN, NOT A FILE. Any self-test whose mutant source is a REF rather than a TRANSFORMATION carries the same defect latent. The sweep is for git show against origin/main inside tests, and it needs a positive control of the same shape so an empty result is a finding and not a broken search. WHICH HALF-WIRED FAILURE MODE THIS ROW IS ABOUT: a probe never graded, and present but dead. The gate was wired, ran on every PR, and was structurally unable to exercise its own subject. NOT PROVEN AND CANNOT BE FOR THIS CUT: this is a property of the test estate, not of the artefact, and no walk exercises it.'
  - issue: 2075
    repo: CM051
    title: 'Three agents built the same fix because nothing in the lane makes you check first'
    gate: 'NOT BLOCKING (how work is claimed, not the artefact): and not a people problem. On 2026-09-16 three independent PRs were opened for one defect within 34 minutes: #2059, #2060 and #2067. Every one of the three was working correctly. None checked the open-PR list before building, because nothing makes you. The rule exists, claim before you BUILD and never before you MEASURE, and it lives in an agent memory rather than anywhere a lane can enforce it. THE TWO HALVES SEPARATE, AND ONE OF THEM WAS VALUABLE. Duplicate MEASURING is a control: three independent diagnoses agreeing is real evidence, and the routes genuinely differed. One came from a PR own CI reds, one from bisecting main workflow history to the four-second gap after #2013 merged, one from a third branch inheriting the red. Duplicate BUILDING is pure waste, and it is what cost: three branches, three full check suites against a runner queue already 300 deep, and a three-way merit comparison at the end to decide which survived. MEASURED SO THE SCALE IS NOT ANECDOTAL. At the moment of the decision #2059 and #2067 sat at IDENTICAL progress, 29 SUCCESS and 0 FAILURE and 12 queued with digest-auth SUCCESS on the runner for each, so furthest-along could not act as a tiebreaker and the choice had to be made on the fix itself. Two branches were closed and deleted with their measurements preserved in their closing comments rather than lost with the branch. WHAT A FIX HAS TO BE: something in the lane, not a process document. A one-call way to ask whether anyone is already on this, cheap enough that a busy agent actually makes it, or a claim visible where the work STARTS rather than in a memory file. The asymmetry is the argument: checking costs one API call, not checking cost three builds. That ratio is what makes it worth a mechanism rather than a reminder. WHICH HALF-WIRED FAILURE MODE: none of the seven. This is not a half-wired gate, it is an absent one, and saying so rather than forcing it into the taxonomy is the honest answer. NOT PROVEN AND CANNOT BE: it is a property of how work is claimed, not of the artefact.'
  - issue: 2082
    repo: CM051
    title: 'Reminders are embedded into a collection the shipped reader never searches'
    gate: 'NOT BLOCKING (a feature half, not a regression): filed tonight while resolving #1958, and recorded rather than left silent. MEASURED AT THE READER THE CUSTOMER RUNS. The installer pins OSTLER_ASSISTANT_VERSION 0.4.80, and at tag hub-v0.4.80 the assistant declares KNOWLEDGE_COLLECTIONS as exactly evernote_knowledge and apple_notes_knowledge. reminders_knowledge occurs in 0 files at that tag, against a CONTROL of 1 file for apple_notes_knowledge, so the zero is a real absence and not a dead search. WHAT A PERSON EXPERIENCES: their reminders are read, scored and embedded at install time, and then a question their reminders would answer returns nothing. Qdrant 404s an unknown collection name and the reader maps 404 to an empty result, so I have no idea and nobody ever looked render identically. That is the defect class manifest-gate exists to name: a collection nothing has decided about is a collection that goes dark silently. WHAT WAS DONE INSTEAD OF HIDING IT. install.sh now records reminders_knowledge:excluded, which is TRUE, with the measurement written beside it. Recording searched would have been the convenient fix and would have asserted something false about the shipped binary. THE GATE IS NOT FOOLED BY EITHER, and I checked that rather than assuming it: with excluded it exits 0 at 3 pass and 0 fail, with searched it exits 1 at 2 pass and 1 fail. It reds on the lie because it reads the reader at the pinned version, so this register cannot be made green by asserting things at it. A METHOD ERROR OF MINE, RECORDED BECAUSE IT WOULD HAVE BEEN RIGHT BY ACCIDENT: the first measurement grepped the ostler-assistant WORKING TREE, which was sitting on a feature branch at ffd56d52 rather than at the pinned tag. Same answer, wrong tree. The figure above is from the tag. WHAT WOULD CLOSE IT: the reader has to learn the collection name, which is an ostler-assistant change, a new daemon build and a pin move in cut.env. None of that belongs beside a cut, which is why it was not done tonight. Worth deciding at the same time whether embedding into a collection nothing reads is right at all: it costs a customer install time and disk now and buys them nothing until the reader changes. That is a product call rather than a mechanical one, so it is named here and not settled here. WHICH HALF-WIRED FAILURE MODE: built with no consumer, checked from the CONSUMER end by reading what the shipped binary searches, not by grepping for the writer. NOT PROVEN and cannot be: no v1.0.99 DMG exists and no walk has run.'
