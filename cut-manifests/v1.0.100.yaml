hat 11,192 pages compiled with the lint pass never run while the log said they were checked and clean, so the proof is that same log telling the truth on a real box. NOTE THE ADJACENCY: row 2112''s fix, merged tonight, is what stops that compile silently never starting, so both want the same walk.  Two lines three seconds apart in wiki-recompile.log: "[WARNING] Lint pass failed: name ''config'' is not defined" then "Compilation complete: 19 ok, 16 skipped, 0 errors". 11,192 pages compiled with the lint pass never run, and the log says they were checked and clean. This is the single Python traceback walk_drive.py counted while every step reported status=ok -- that counter is the only instrument that saw it, and it could not say which step. The compiler ships in the ostler-wiki-site image, so the fix is a CM044 change plus an image rebuild and digest re-pin, not a patch here.'

