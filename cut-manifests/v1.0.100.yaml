  - issue: 1922
    repo: CM051
    title: "swift-tests: LicenseVerifierTests.testTamperedSignatureFailsVerification fails, unrelated to v1."
    gate: 'FIXED AND GUARDED, MERGED as #2005, and it was BLOCKING A REAL PR WHEN IT WAS FIXED. This row and 1760 are one defect: testTamperedSignatureFailsVerification edited the SERIALISED JSON at a fixed character offset. The signature is a fresh Ed25519 signature every run and JSONSerialization ESCAPES / as \/, so when the base64 carries a / at index 1 the edit lands on that / and leaves \A -- an invalid JSON escape. The licence then fails to PARSE, and verify() answers malformed("licence is not a JSON object") instead of invalidSignature. QUANTIFIED over 4000 real Curve25519 signatures: the old edit produced invalid JSON 55 times, 1.38%, about 1 in 72 -- which is exactly the "14 of the last 15 runs are green" this was reported as. The fix tampers the DECODED object and lets the encoder write the document: 0 invalid and 0 unchanged signatures over the same 4000. LIVE CONFIRMATION, unprovoked: PR #2006 branched before the fix and its swift-tests run failed on THIS EXACT TEST, while #2005 which contains the fix passed -- same day, same runner image. The flake arrived on its own and blocked an unrelated PR. TWO ASSERTIONS ADDED so the new form cannot pass for the wrong reason: the tampered signature must NOT equal the original, and the tampered document must still PARSE, so a malformed-JSON verdict can never again be mistaken for a signature verdict. WHY IT MATTERED FOR THE CUT: swift-tests is path-filtered to gui/**, a cut PR is a version bump that touches gui/, and preflight refuses when the tagged commit''s own checks are red. A 1.4% flake sat directly in front of the tag. TRIAGE 2026-09-16: HARNESS AND GATE INTEGRITY. This is the bucket that let the other two buckets through: a probe measuring the wrong predicate, a test nothing invokes, a gate that cannot fail, a register that is not the register. Opened 2026-09-12 and carried forward unadjudicated through v1.0.98.'

  - issue: 1815
    repo: CM051
    title: "7 of the 74 pipefail short-circuit landmines are in scripts the cut itself runs"
    gate: 'FIXED ACROSS TWO REPOS, AND THE ROW''S COUNT WAS WRONG. CM051 #2009 plus OS003 #301. MEASURED ON main RATHER THAN TAKEN FROM THE ROW: cut.yml names 36 script paths and the baseline held 73 rows, so the intersection is SIX, not seven. stage_and_verify_dmg.sh is still named by cut.yml (control: 1 reference, so the predicate is not silently empty) but had already left the baseline. The row was stale by exactly that one. 5 fixed and delisted, 1 fixed upstream and deferred behind an enforced route out, 1 already gone. Nine instances rewritten to the grep -c form, NOT a herestring, because the class gate proves a herestring is a bashism that dies on box_run()''s ssh branch. Baseline 73 -> 68, LOWERED BY FIXING. NO pipefail was ADDED anywhere: all six already set -uo pipefail and NONE sets -e, read line by line, so no previously-green script can newly abort. CONSUMER-SIDE, AND THE READER IS ORM TRIGGERING A CUT: rollforward_gate.sh --only <a real gate id> printed "PARSE ERROR: matches no gate" and exited 2 on an id the gate''s OWN OUTPUT lists. That is the v1.0.75 failure again: a cut that refuses, naming a false cause, and no DMG. MUTATION, SEVEN ARMS, and arms 1 and 2 close the loop: re-listing a fixed file reds the guard, reinstating the construct reds the sibling ratchet, so the only way to green one is to red the other. Plus cut.yml missing -> rc 2; cut.yml naming nothing -> rc 2; deferral dropped, stale, or naming no PR -> rc 1. THE VENDOR PIN CAUGHT THE AGENT MID-FIX, which is the gate working: rollforward_gate.sh is VENDORED from OS003 and editing it in place reds test_rollforward_registry_pin.sh, the gate that stopped CM051 running a copy 239 diff lines behind. Reverted, sent upstream as OS003 #301 (13/13 green), and deferred here behind a check that fails on a deferral with no PR and on a deferral that outlives its reason. AND THE AGENT''S OWN GUARD HAD THE null-STRING DEFECT, found by its own mutation: a deferral naming NO PR passed, because deferral_pr() printed "  (deferred )" and the emptiness test read the decoration as an answer. Fixed and re-mutated. REPORTED RATHER THAN SCOPED OUT SILENTLY: the TRANSITIVE intersection is 14, not 6. The extra 8 (30 instances) are this row''s step 2, and 5 of them are the ratchet''s own deliberate control fixtures that must NEVER be fixed. NOT GATED: three PRs raised, none merged, and nothing here is PROVEN until a walk exercises it. RE-MEASURED 2026-09-16, AND ONE OF THEM BIT TODAY. MY METHOD, stated so the number can be checked: parse .github/workflows/cut.yml, take every step''s run: block across all three jobs, and match it against the 74 files in tests/pipefail_shortcircuit_baseline.txt (74 FILES carrying 217 instances). DIRECTLY INVOKED BY THE CUT WORKFLOW: 6 files, 9 instances. bin/rollforward_gate.sh (1, preflight), scripts/dry_run_cut_checks.sh (1, dry-run), scripts/provenance_gate.sh (3, preflight), scripts/stage_and_verify_dmg.sh (1, CUT JOB), tests/test_cut_dispatch_is_dry.sh (1, preflight), tests/test_no_local_cuts.sh (2, preflight). THE ROW SAYS 7 AND I MEASURE 6. I am not claiming the row is wrong: my matcher is a string match over cut.yml''s run: blocks, so a file invoked by a shape it does not recognise would be missed, and the original count may have included install.sh. The discrepancy is UNRESOLVED and recorded rather than rounded away. One hop deeper adds 3 more files and 23 more instances, but 21 of those are install.sh reached from provenance_gate.sh and stage_and_verify_dmg.sh, and BOTH OF THOSE READ AND HASH install.sh rather than executing it, so counting them as "scripts the cut runs" would be wrong in the alarming direction. THE ONE IN THE CUT JOB ITSELF IS FIXED, and it is the one that actually misfired. scripts/stage_and_verify_dmg.sh runs in the `cut` job -- the job that stages and seals the DMG -- and its needle test was `! printf ... | grep -qF ...` under its own set -uo pipefail. On 2026-09-16 it reported NOT OK on PR #1987''s discriminating control with "want rc=0 got 0", the two numbers EQUAL and the needle present verbatim in its own dumped output. Re-running the SAME failed job with no code change passed. A deterministic predicate cannot return two answers for one input. PR #2003 replaces it with a case on the captured string -- the remedy that file had already applied at its spctl check seven lines of its own comment earlier -- and DELISTS it from the baseline, which the ratchet demanded ("lists rows the scan does NOT find. That is slack the next regression hides in"). Baselined files 74 -> 73 when that merges, and the cut-invoked count 6 -> 5. WHICH HALF-WIRED FAILURE MODE: "a probe never graded", in its worst form -- a gate in the ship path returning a REVERSED verdict intermittently. Checked by reproducing the exact failure line with a seeded absent needle, and by the same commit producing both verdicts across two runs. NOT GATED: five baselined files the cut invokes still carry the construct, and none has been shown harmless. This row stays open until they are fixed or each is shown not to short-circuit. GATE: PARTLY LANDED, MAIN FIX STILL RAISED, AND THE ROW STAYS OPEN ON ITS OWN STATED CONDITION. MEASURED on 2026-09-16 rather than read from the row. CM051 #2009, which carries the substance, is OPEN with no mergedAt, so by item 9 the word for it is raised and it is not even MERGED. CM051 #2003 IS merged, at 04:36:53Z, and its effect is visible in the register rather than only in its title: stage_and_verify_dmg.sh now returns 0 occurrences in tests/pipefail_shortcircuit_baseline.txt, so it was genuinely delisted and not merely fixed in place. THE ONE THAT MATTERED MOST IS THE ONE THAT LANDED, and it is worth separating from the rest. stage_and_verify_dmg.sh runs in the CUT JOB itself, the job that stages and seals the DMG, and its needle test could INVERT: it reported NOT OK with the two numbers EQUAL and the needle present verbatim in its own dumped output, then passed on a re-run of the same job with no code change. A deterministic predicate returning two answers for one input is not a flake to be retried, it is a gate in the ship path giving a reversed verdict intermittently. That is fixed and delisted. BASELINE SIZE, MEASURED AND NOT RECONCILED: the baseline on main now holds 69 non-comment rows. The row predicts 73 going to 68 when #2009 lands, and #2009 has not landed. I measure 69, which is neither number. I have not run down which of the four the difference represents and I am NOT asserting an explanation, because a ratchet whose row count cannot be reproduced is worth one line of recorded doubt rather than a silent correction. Anyone acting on the ceiling should recount rather than quote either figure. THE ROW ALREADY CORRECTED ITS OWN HEADLINE AND THAT CORRECTION SHOULD SURVIVE: it says seven landmines in scripts the cut runs; the measured intersection of cut.yml script paths with the baseline is SIX. The row does not round that away, it records the discrepancy and names the reason it might be real, that the matcher is a string match over run blocks and could miss a file invoked by a shape it does not recognise. Keeping an unresolved difference visible is the correct handling. AND THE TRANSITIVE NUMBER IS RECORDED IN THE SAFE DIRECTION, which is the subtle part: one hop deeper adds 3 files and 23 instances, but 21 of those 23 are install.sh reached from two scripts that READ AND HASH it rather than EXECUTE it. Counting those as scripts the cut runs would have inflated the finding in the alarming direction, and the row refuses to. FIVE OF THE EXTRA EIGHT ARE DELIBERATE CONTROL FIXTURES THAT MUST NEVER BE FIXED, which is the trap waiting for the next person who sees a count and tries to drive it to zero: removing a construct from a ratchet control blinds the ratchet. THE VENDOR PIN CAUGHT THE AGENT MID-FIX AND THAT IS THE GATE WORKING, not an obstacle: rollforward_gate.sh is VENDORED from OS003, editing it in place reddened the pin test, and the change was correctly sent upstream as OS003 #301 and deferred here behind a check that fails on a deferral naming no PR and on a deferral that outlives its reason. AND THE AGENT OWN GUARD HAD THE null-STRING DEFECT, found by its own mutation: a deferral naming NO pull request PASSED, because the helper printed a decorated empty string and the emptiness test read the decoration as an answer. That is the same defect class as everything else on this board, inside the guard written to prevent it. RETIREMENT CONDITION, WHICH IS THE ROW OWN AND IS NOT WEAKENED HERE: this retires when the five baselined files the cut invokes are either fixed or each shown not to short-circuit, AND the deferral for the vendored file has been discharged by the upstream change arriving through the pin rather than by the deferral expiring. It does NOT retire when #2009 merges, because #2009 addresses the directly-invoked set and the row explicitly names step two beyond it. TRIAGE 2026-09-16: HARNESS AND GATE INTEGRITY. This is the bucket that let the other two buckets through: a probe measuring the wrong predicate, a test nothing invokes, a gate that cannot fail, a register that is not the register. Opened 2026-09-07 and carried forward unadjudicated through v1.0.98.AGENT SELF-CORRECTION, RECORDED BECAUSE IT NARROWS A CLAIM: the report said the new guard "already ran green in CI with all controls firing". True, but on the FIRST push, before the deferral mechanism existed. The run on the current head is the ONLY CI exercise of the DEFERRED path and was still QUEUED. The local mutation evidence for that path stands; CI confirmation of it does not yet exist and is not claimed. CM051 #2009 tally at that point: 61 pass, 16 pending, 0 fail. '

