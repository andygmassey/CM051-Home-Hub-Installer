  - issue: 2112
    repo: CM051
    title: "The wiki summary backfill dies on launch and leaves a pid file naming a dead process"
    gate: 'MERGED 2026-09-18 as PR #2145, squash ab48d585, mergedAt 2026-09-17T22:54:46Z. NOT PROVEN. VERIFIED ON origin/main rather than inferred from the PR state: ostler_slot_acquire wiki-summaries appears once, unbounded_reason once, the test file is in the tree, and a control name that must be absent returns 0. THE ROOT CAUSE WAS NOT THE HOLDER. This row named the email-bundle tick holding the slot 25+ minutes, which is true and is not the defect. The backfill HAND-ROLLED ITS OWN LOCK on the shared slot directory: a bare mkdir spin loop writing one file, pid. Two consequences and the second is the cause. ONE, nobody could say who held it: the library records holder, acquired_at and max_hold on every acquire and prints them, so a directory carrying only a pid is exactly why the box could report holder=? and why this took three reproductions. TWO, IT NEVER ENROLLED AS A WAITER, and a holder starts its bounded-hold countdown ONLY for an enrolled waiter. email-bundle was never told anybody wanted the slot. It kept it, correctly, and the backfill waited for ever. The waiter was the one not following the protocol and the holder was blamed. THE FIX IS wiki-recompile-tick.sh''s OWN SHAPE, because that second launch site for the same payload already did this correctly and install.sh was the odd one out. until ostler_slot_acquire, blocking with no give-up, with the hand-rolled loop kept only as a pre-lib fail-safe that now SAYS it is degraded. CI CAUGHT AN EARLIER DRAFT that capped the attempts at twelve and gave up: tests/test_ingest_offpeak_throttle.sh checks BOTH launch sites and says why in its own section header, a yield would skip summaries. Its two grep assertions pass UNMODIFIED; the test was not edited. PROOF: 17 assertions driving the SHIPPED launcher body and the SHIPPED library with docker stubbed, CANNOT-RUN and exit 2 if either cannot be extracted. THE MUTANT REPRODUCES BOTH MEASURED SYMPTOMS, which is the strongest evidence available without a box: the pre-fix loop enrols no waiter AND is silent while blocked, which is the 0-byte log. Arm 2a asserts the launcher is still ALIVE while the slot is held, because a launcher that exited is one that gave up and from outside that is indistinguishable from waiting. STILL OWED FOR PROVEN: a walk where the backfill contends with a live tick and the log NAMES the holder, which is the thing the box could never say. The 15 minutes this cost every walk is the measurable before-and-after.  Measured on the clean v1.0.100 install: .wiki-recompile-summaries.pid contains 78008, ps -p 78008 is DEAD, and the log it should write is 0 bytes. Reproduced THREE times (pids 78008, 90210 and a third on the QA re-run). ROOT CAUSE: the email-bundle tick (ingest/email-bundle/tick.sh) acquires the shared Ollama lock at install and still holds it 25+ minutes later; the backfill cannot acquire it and exits without writing a line. The lock directory records only a pid -- no holder name, no acquisition time -- which is why the diagnostic could only print holder=?. Costs 15 minutes of every walk: the waiter is bounded and correct, and burned its full 900s budget twice.'

