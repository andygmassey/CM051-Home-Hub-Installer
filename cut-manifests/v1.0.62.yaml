# cut-manifests/v1.0.62.yaml
#
# ===========================================================================
# TWENTY-ONE ROWS. SIXTEEN CARRIED AND RE-MEASURED, FIVE NEW.
# ===========================================================================
# v1.0.61 was BUILT, PUBLISHED and WALKED on a clean account, and the walk
# FAILED: verdict FAILED, qa_exit 1, 11 pass / 7 fail / 6 cannot-run of 24
# measured. walks/v1.0.61.tsv is the record and cuts/DEFECTS_ROLLFORWARD.md
# carries its seven findings as v1061-D001 through D007. v1.0.62 re-cuts the
# same window plus the three of those findings that were fixed in code.
#
# This header was written fresh. Inheriting v1.0.61's would assert a history
# that did not happen here.
#
# ---------------------------------------------------------------------------
# THE SIXTEEN CARRIED ROWS ARE BYTE-IDENTICAL, AND THAT IS DELIBERATE.
# ---------------------------------------------------------------------------
# Not one carried row was reworded. A reader can therefore diff this file
# against cut-manifests/v1.0.61.yaml and see that the only changes are this
# header and five appended entries. No row was quietly retuned to keep it
# green. The re-measurement is recorded ONCE, here, in full, rather than as
# sixteen separate prose edits nobody can audit in aggregate.
#
# ---------------------------------------------------------------------------
# ALL SIXTEEN RE-MEASURED AT THIS CUT'S PIN, WITH THE GATE'S OWN FUNCTION.
# ---------------------------------------------------------------------------
# Carrying a row is a positive claim about THIS tree. Every row was re-run at
# CM051 c12c5e88 -- the commit this cut pins -- by importing
# scripts/verify_cut_manifest.py and calling its own _pattern_hits_bytes,
# rather than by hand-rolling a substitute grep that could disagree with the
# gate. All 16 hold: 15 present, and v1058-i correctly ABSENT.
#
#   v1057-a  ViewCopy.json                    1     v1058-i  no Apple Events      0  (must_match:false)
#   v1057-b  bursar reads compiler output     1     v1059-j  explicit caller      1
#   v1057-c  store auth bundled interpreter   1     v1059-k  compiler writes      1
#   v1059-d  daemon pin == wrapper pin        1     v1060-l  api/v1/sources       1
#   v1057-e  real name beats a handle         2     v1060-m  removal reported     1
#   v1057-f  settling panel styled            1     v1060-n  extension_token      2
#   v1057-g  duplicate review on the Hub Mac  1     v1061-o  failed-step warning  1
#   v1058-h  .pth final tree                  2     v1061-p  reuse keeps briefs   2
#
#                                enumerated 16 == declared 16   PASS 16  FAIL 0
#
# The same sweep was run a second time at 181a0668, the branch point this
# manifest is authored on, and returned the identical 16 of 16. The two agree
# because 181a0668 adds only cut artefacts, and stating that is cheaper than
# leaving a reader to wonder which tree the numbers came from.
#
# WARNING: A UNIFORM PASS IS EXACTLY THE RESULT A DEAD PREDICATE PRODUCES, so
# the apparatus was proved able to fail before the sweep was believed:
#
#   CONTROL A  real file, present pattern, must_match:false  hits 73    -> FAIL   OK
#   CONTROL B  absent path, real pattern                     rc 128     -> FAIL   OK
#   CONTROL C  real file, saturating pattern, must_match     hits 1447  -> PASS   OK
#
# ---------------------------------------------------------------------------
# THE FIVE NEW ROWS ARE TWO-SIDED, MEASURED PRE AND POST.
# ---------------------------------------------------------------------------
# Each was scored against the v1.0.61 pin (477608ab) as well as this one, so
# each is evidence that THIS cut delivers something the previous one did not.
# Four of the five are the fixed half of the v1.0.61 walk findings; the fifth
# is the defect that killed the walk itself.
#
#   Q  ERR-14-STORE-NOT-READY-FOR-IMPORT           pre 0  post 1   D003 / #1385
#   R  ERR-14-IMPORT-STORED-NOTHING                pre 0  post 1   D003 / #1385
#   S  _QDRANT_READY_CAP                           pre 0  post 7   #628 / #1386
#   T  _initial_hydrate_qdrant_is_positively_empty pre 0  post 2   D004 / #1386
#   U  backslash followed by space or tab          pre 1  post 0   D006 / #1386
#
# ---------------------------------------------------------------------------
# ROW U USES A DIFFERENT PATTERN FROM THE BOM ROW FOR THE SAME DEFECT, AND
# THE REASON IS THE REGEX ENGINE, NOT A DISAGREEMENT ABOUT THE DEFECT.
# ---------------------------------------------------------------------------
# The walk-killer is a SPACE after a line-continuation backslash at
# install.sh:26690, MID-LINE, not at end of line. OS003's MUST_CONTAIN row
# spells it for `grep -E` as a POSIX class and scores pre 1 / post 0 there.
# This gate is Python `re.findall` over the WHOLE FILE, and that changes the
# answer twice over. Both wrong spellings were measured, not reasoned about:
#
#   the BOM's grep spelling, read by Python  -> 2 hits POST.  Python has no
#     POSIX classes, so it parses as a nested set and matches something else
#     entirely. A must_match:false row on it would FAIL this cut for a defect
#     that is fixed. Python even warns: "Possible nested set at position 3".
#   the obvious Python spelling using \s     -> 661 hits POST. \s matches a
#     NEWLINE, and re.findall is not line-oriented, so it matches EVERY line
#     continuation in the file. A row on it could never go green.
#
# The spelling this row ships is backslash followed by the class [space tab],
# which scores pre 1 / post 0 -- the same discrimination the BOM row has, in
# the engine that will actually read it. Two gates, one defect, two spellings,
# both measured in their own engine. That is the rule the v1.0.61 header
# already recorded for BSD grep's dollar-anchor, applied to the other side.
#
# THESE ROWS PIN NO source_sha, MEASURED AND STATED BECAUSE IT DECIDES WHAT
# THEY MEAN. Zero of the 21 entries carry source_sha, so the reader falls back
# to HEAD and each row is evaluated against the tree being cut at the moment
# the gate runs, not against a frozen historical commit. That is why
# re-measuring at c12c5e88 is the right check and why a carried row is a live
# claim about this cut rather than a restatement of an old one.
#
# ALL 21 ROWS CARRY path_hint, so every one takes verify_cut_manifest.py's
# PATH-RESTRICTED arm (`git show <sha>:<path>`), never the whole-tree arm. The
# two differ in a way that matters: the whole-tree arm DISCARDS hits in cuts/,
# cut-manifests/, walks/ and cut-deferrals.yaml, because a row must not be
# satisfied by the prose describing it -- that is how v1.0.46 shipped bricked
# with a green gate. A whole-tree `git grep` run as a shortcut applies none of
# that and answers a different question.
#
# THE DAEMON PIN IS HELD AT bc63c445, unchanged from v1.0.61, so row D is
# carried verbatim and no rebuild or re-pin is implied by this cut.
# cuts/v1.0.62/cut.env records the argument for holding it.
#
# WHAT THIS MANIFEST DOES NOT CLAIM:
#   - Rows Q, R, S, T and U prove the code is IN THE PINNED SOURCE. Not one of
#     them proves it behaves on a box. An import that refuses an unready store,
#     a readiness wait that is long enough on real hardware, and an installer
#     that runs to completion are BEHAVIOUR and belong to the walk. The
#     v1.0.61 walk is the reason all five exist, and only the v1.0.62 walk can
#     close them.
#   - Four of the seven v1.0.61 findings get NO row, and that is a measured
#     decision rather than an oversight. D001 (#622), D002 (#623), D005 (#627)
#     and D007 are NOT FIXED in this window. cuts/DEFECTS_ROLLFORWARD.md
#     records them as deferred with their ticket numbers, which is the only
#     honest disposition for a finding on a FAILED walk that nobody has
#     repaired. A row asserting otherwise would be worse than no row.
#   - D007 in particular is a standing embarrassment this cut does not fix:
#     assistant_answers_grounded, freshness_panel_has_dates and
#     usage_journal_producers have now failed on FOUR CONSECUTIVE walk records
#     (v1.0.50, v1.0.51, v1.0.52, v1.0.61) and none has been investigated.
version: v1.0.62
entries:
  - id: v1057-a-the-installer-speaks-before-macos-does
    title: the installer pre-announces the admin-password dialog, in its own voice, before macOS words it alarmingly
    incident: >-
      THE INSTALLER LET macOS SPEAK FIRST AND macOS SAYS SOMETHING ALARMING.
      The administrator-password dialog is worded by macOS as a request to
      control Finder, and it mentions documents and data. A customer
      reasonably reads that as the installer asking to read their files, and
      nothing prepared them for it. Observed on a live launch walk.
      FIX (#1297): pre-announce the wording in the installer's own voice
      before the dialog appears, and say plainly that the sentence belongs to
      macOS and is how macOS asks any application for an administrator
      password. Reassurance placed BEFORE the alarm rather than after it,
      which is the only ordering that helps.
      SHIPS AS A BUNDLED GUI RESOURCE. ViewCopy.json is compiled into
      OstlerInstaller.app by gui/project.yml `resources:`, which excludes only
      Fonts/**. gui/Makefile never names the file, so a Makefile-based ship
      predicate scores it 0 and is WRONG about it.
      CARRIED FROM v1.0.59 AND RE-MEASURED AT THE v1.0.60 PIN: 1 hit.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: gui/OstlerInstaller/Resources/ViewCopy.json
      pattern: 'macOS words the next dialog oddly'
      must_match: true

  - id: v1057-b-the-bursar-can-finally-see-what-the-compiler-wrote
    title: the wiki compiler's usage records reach the host journal instead of dying with the container
    incident: >-
      THE BURSAR COULD NOT SEE WHAT THE COMPILER PRODUCED. The wiki compiler
      writes usage records into its container's /workspace/state, and no bind
      mount connected that path to the host journal the cost panel reads. Every
      record the compiler has ever written was discarded when the container
      exited. The panel then showed a smaller number, which reads to a customer
      as a quiet month rather than as a severed pipe -- a silent wrong answer,
      not an error.
      FIX (#1301): mount the host workspace state directory at
      /workspace/state and set OSTLER_WORKSPACE explicitly, so the writer and
      the mount cannot drift apart later.
      ⚠️ THIS ROW IS THE MOUNT, AND ROW K IS ITS OTHER HALF. Mounting the
      journal was necessary and was not sufficient: the compiler was still
      writing on the far side of it. Both rows are required and neither is
      evidence for the other.
      CARRIED FROM v1.0.59 AND RE-MEASURED AT THE v1.0.60 PIN: 1 hit.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'state:/workspace/state'
      must_match: true

  - id: v1057-c-store-auth-reaches-the-bundled-interpreter
    title: the store-credential wiring covers the bundled interpreter, not only the venvs
    incident: >-
      100% COVERAGE OF THE WRONG POPULATION. Every call site was correct and
      every one passed a venv root, because the guard only ever accepted an
      executable at a venv's own bin/python3. THE BUNDLED INTERPRETER IS NOT A
      VENV and ships no python3 alias, so the three services without their own
      venv -- cm059-editor, ical-server, ostler_hygiene -- reached Oxigraph and
      Qdrant with no credential, 401'd, and EXITED 0. The customer symptom was
      Andy's A1: the Front Page never populated, on any install, for ever,
      because its producer fail-closed to the settling stub every hour.
      FIX (#1302): resolve the interpreter from a named executable, a venv
      root, or a relocated tree's bin/python3.11, then ask THAT interpreter for
      its own site-packages; and add the fifteenth call site for the bundled
      tree. THE DEFECT WAS THE DEFINITION OF THE POPULATION, not a missing
      call, which is why counting call sites could never have found it.
      ⚠️ THE ROW KEYS ON THE CALL SITE, NOT THE PROSE. The most distinctive new
      text in this commit is its own header comment; keying there would guard
      the documentation of the fix rather than the fix, and any tidy-up could
      delete it without touching behaviour.
      CARRIED FROM v1.0.59 AND RE-MEASURED AT THE v1.0.60 PIN: 1 hit.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'wire_store_auth_pth .+PYTHON3_BIN'
      must_match: true

  - id: v1059-d-the-daemon-pin-and-the-wrapper-pin-name-one-commit
    title: all pins name hub-v0.4.70, and the Ostler.app was rebuilt from the same commit rather than carried forward
    incident: >-
      THE DAEMON PIN MOVED 0.4.69 -> 0.4.70 (bc63c445) TO CARRY oa #854, AND
      THE WRAPPER MOVED WITH IT. Carrying the 0.4.69 Ostler.app forward would
      have been the #225/#226 divergent-lineage defect, where a stale wrapper
      ships a stale frontend past an otherwise green cut, so the wrapper was
      REBUILT from bc63c445. Proven on the artefact rather than on a build log:
      WRAPPER_FRONTEND_COMMIT compiled INTO the Mach-O reads bc63c445, matching
      the daemon's commit -- which is the probe build-hub.sh's own header tells
      you to run instead of trusting its success line.
      🔴 TWO RELEASE REPOS, ONE VERSION NUMBER, AND IT COST TWO FALSE VERDICTS
      IN ONE NIGHT. The hub-v tag build runs in the PRIVATE ostler-assistant;
      everything a customer touches -- install.sh's OSTLER_ASSISTANT_REPO and
      gui/Makefile's DAEMON_REPO -- reads the PUBLIC ostler-releases, which is
      mirrored BY HAND. The same tag name therefore names DIFFERENT BYTES in
      the two repos, measured at both versions: 0.4.69 is 6d20239e private and
      e6803968 public, 0.4.70 is 349e69fc private and a4aebc73 public. One
      reviewer read the private repo and filed a cut blocker saying the pin
      matched nothing; the pin is correct for the repo the cut actually
      downloads from. Tracked as #602.
      THE PATTERN IS THE DAEMON DIGEST ITSELF, the one string that cannot be
      true of the previous build. gui/Makefile is the same byte length on both
      trees -- a digest swap preserves length -- so size proves nothing here and
      the pattern is the whole evidence.
      🔴 THE DAEMON PIN IS UNCHANGED IN v1.0.60, HELD AT bc63c445 DELIBERATELY.
      This cut moves only CM051 (00440f72 -> bfc418e2). No rebuild, no
      re-notarise and no re-pin of the daemon is implied, and this row is
      carried verbatim because its subject did not move. The one-commit hold
      and its expiry condition are recorded in scripts/daemon_hold_ack.tsv.
      CARRIED FROM v1.0.59 AND RE-MEASURED AT THE v1.0.60 PIN: 1 hit.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: gui/Makefile
      pattern: 'a4aebc73593a29c7'
      must_match: true

  - id: v1057-e-a-real-name-beats-a-social-handle
    title: a person is shown under their real name, not a run-together social handle
    incident: >-
      A PERSON WAS DISPLAYED UNDER A SOCIAL HANDLE INSTEAD OF THEIR NAME.
      Observed on a live walk. A bare username PASSES
      is_acceptable_display_name -- it is not junk -- so the FIRST acceptable
      candidate won by ingest order, and whichever source happened to arrive
      first decided what a person is called.
      FIX (CM041 #134, grafted verbatim): demote a handle-shaped token below a
      real name using a STABLE sort, so order still decides among same-shape
      values and two real names are never reordered.
      THE GRAFT IS VERBATIM AND THAT WAS MEASURED BOTH WAYS: the vendored file
      was byte-identical to source@f3a74a97^ BEFORE and is byte-identical to
      source@f3a74a97 AFTER, so unlike the three earlier grafts on that row this
      one does NOT widen the unrecorded divergence the vendor manifest documents.
      DEMONSTRATED TWO-SIDED ON THE VENDORED COPY, not on source, because the
      trees diverge and the customer runs the vendored one: handle-then-name
      returned the handle pre-graft and the real name post-graft. FOUR CONTROLS
      unchanged across the graft, one per over-reach mode.
      CARRIED FROM v1.0.59 AND RE-MEASURED AT THE v1.0.60 PIN: 2 hits.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: vendor/cm041/identity_resolver/canonical_name.py
      pattern: '_looks_like_social_handle'
      must_match: true

  - id: v1057-f-the-settling-panel-is-styled-at-last
    title: the settling panel renders as styled rows instead of unstyled markup
    incident: >-
      THE PANEL REACHED THE CUSTOMER AS UNSTYLED MARKUP, which is not a layout
      that needed tuning. The renderer emitted four classes with ZERO matching
      rules anywhere in the stylesheet, and applied a class written for a <ul>
      to a <table>. Andy's A3.
      FIX (CM044 #266): the li-row renderer, shipping in wiki-compiler 0.1.29.
      🔴 DELIVERED BY IMAGE DIGEST, AND THAT IS THE POINT OF THIS ROW. The fix
      was merged BEFORE v1.0.54 and reached NEITHER of the two previous cuts,
      because the renderer ships as a pinned image and a merged renderer change
      cannot reach a customer without a rebuild and a re-pin. Three deferrals in
      the rollforward register were all waiting on this one prerequisite.
      The pattern is the DIGEST rather than a CM044 source sha: a source sha
      would be true about the repo and unfalsifiable against the DMG.
      CARRIED FROM v1.0.59 AND RE-MEASURED AT THE v1.0.60 PIN: 1 hit.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'eef628599ccca1087e785a47b0b428005f8cd6c71b525f08b7c668fc41ac0d40'
      must_match: true

  - id: v1057-g-duplicate-review-works-on-the-hub-mac
    title: the wiki site CSP admits the on-box Doctor, so duplicate review actually runs
    incident: >-
      "Duplicate review is available on the Hub Mac only." RENDERED ON THE HUB
      MAC, and the feature behind it was dead. The site's CSP did not admit the
      on-box Doctor, so dup-review and corrections could not work at all: the
      sentence was not merely wrong, it was describing a severed connection.
      Andy reported this before it was ever filed, which is why it carries a new
      id rather than a recurrence.
      FIX (CM044 #262): admit the Doctor in the site CSP, shipping in wiki-site
      0.1.29.
      🔴 THIS IS THE ROW THAT DECIDED THE v1.0.58 CUT. Clearing the wiki
      freshness RED by hold_ack was available and would have been cheaper. It
      would also have shipped v1.0 with dup-review and corrections still dead on
      the Hub, purely to avoid moving a digest. The image was rebuilt instead.
      Same digest-not-source-sha reasoning as row F.
      CARRIED FROM v1.0.59 AND RE-MEASURED AT THE v1.0.60 PIN: 1 hit.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'fb5536bded57dae3466cb5ea7a3f4c36b2330892731afe60add521d78c0e8720'
      must_match: true

  - id: v1058-h-the-store-auth-pth-points-at-the-final-tree
    title: the store-auth .pth resolves OSTLER_FINAL_DIR by default, so the auth wiring survives the install
    incident: >-
      A1. THE .pth FROZE THE STAGING PATH AND THE AUTH WIRING NEVER RAN ON ANY
      INSTALL. Read verbatim off the v1.0.57 walk box, not inferred from
      source. _ostler_wire_store_auth_pth defaulted its root to OSTLER_DIR,
      which points at the temporary staging tree until the promote -- and four
      of its sixteen call sites run ABOVE that boundary. The staging directory
      does not survive, so the import failed at EVERY interpreter startup, for
      ever. Python answers that with "Remainder of file ignored", which ALSO
      discards the OSTLER_SECRETS_DIR default on the same line, so cm059-editor
      reached the stores with no credential, 401'd hourly, and the Front Page
      never populated.
      🔴 EVERY OBVIOUS CHECK PASSES ON THIS DEFECT. The .pth was present. The
      module was present and correctly installed at <final>/lib. Only the PATH
      INSIDE was wrong -- which is why five cuts of source-presence gates never
      saw it, and why the fix ships with a BEHAVIOURAL test that runs the real
      function with OSTLER_DIR pointed at a staging tree and reads back what
      the .pth actually contains.
      ⚠️ THIS ROW IS TRUE AND IT WAS NOT SUFFICIENT. It guards the FUNCTION
      DEFAULT. Row J guards the caller that overrode that default and kept A1
      live through the whole of v1.0.58. Read the two together or neither means
      what it appears to.
      ⚠️ THE PATTERN CARRIES NO DOLLAR SIGN AND NO BRACES ON PURPOSE.
      CARRIED FROM v1.0.59 AND RE-MEASURED AT THE v1.0.60 PIN: 2 hits.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'local _root=.+OSTLER_FINAL_DIR'
      must_match: true

  - id: v1058-i-no-apple-events-to-finder
    title: the installer sends no Apple Event to Finder, so macOS stops asking to control it
    incident: >-
      macOS ASKED THE CUSTOMER TO LET OSTLER CONTROL FINDER AND REACH DOCUMENTS
      AND DATA, during an install that wants neither. Observed by Andy on the
      live v1.0.57 walk. The cause was one Apple Event: an osascript telling
      Finder to close windows.
      FIX (#1315): DELETE IT. This is a removal and not a rewording on purpose
      -- macOS permits exactly ONE NSAppleEventsUsageDescription per app and
      stamps it on EVERY Apple Events prompt regardless of target, so no copy
      could make that dialog true while the event still fired. v1.0.57's
      pre-announcement (row A) treated the symptom and stays in the tree; this
      treats the cause.
      ⚠️ `open -R` MUST SURVIVE AND IS NOT COVERED BY THIS ROW. It is
      LaunchServices, not an Apple Event, and raises no TCC prompt. The wired
      test asserts BOTH directions, because a fix that killed both would read
      identically to a clean pass on a Finder-only check.
      ⚠️ THIS IS THE ONLY must_match:false ROW, AND IT IS THE ONE AN APPARATUS
      FAILURE CAN FAKE. An absence check PASSES when the probe cannot read the
      file at all. Re-measuring it at the v1.0.60 pin required proving the read
      worked first: install.sh at the pin is 1,443,812 bytes with 1,325 hits
      for a control string that must be present, and 0 for a control token that
      must not. Only then is this row's 0 a real absence.
      CARRIED FROM v1.0.59 AND RE-MEASURED AT THE v1.0.60 PIN: 0 hits, correct.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'Finder" to close windows'
      must_match: false

  - id: v1059-j-the-explicit-caller-stops-overriding-the-fix
    title: the bundled-interpreter call site passes the FINAL root, so A1 is closed at the caller as well as at the default
    incident: >-
      🔴 A1 WAS STILL LIVE THROUGH THE WHOLE OF v1.0.58, AND THE MANIFEST SAID
      IT WAS FIXED. Row H is true: #1316 hardened the function's default to
      OSTLER_FINAL_DIR. THIS call site passed the staging root EXPLICITLY as
      the second argument, and A DEFAULT CANNOT APPLY TO A CALLER THAT SUPPLIES
      THE ARGUMENT -- so the hardening was real and this caller was simply never
      in its population. 12 of the 16 call sites pass no root and were genuinely
      fixed; this was the one that was not.
      The guard and the argument disagreed IN ONE STATEMENT: the guard tested
      PYTHON3_BIN against OSTLER_FINAL_DIR while the argument passed
      OSTLER_DIR, on the same line, above the promote boundary where OSTLER_DIR
      is still the temporary staging tree.
      FIX (#1321): pass the final dir. One identifier.
      🔴 THE BLAST RADIUS IS EVERY SERVICE WITHOUT ITS OWN VENV -- cm059-editor,
      ical-server, ostler_hygiene -- which is exactly the population row C
      widened the wiring to cover. So C added the call, H fixed the default, and
      J is what makes the call actually write a surviving path. Three commits,
      one defect, and the first two both reported success.
      FOUND ON A COVERAGE SWEEP, NOT BY A GATE, and that is the durable
      finding: no gate we own compares a caller's argument against the guard on
      its own line.
      CARRIED FROM v1.0.59 AND RE-MEASURED AT THE v1.0.60 PIN: 1 hit.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'wire_store_auth_pth .+PYTHON3_BIN.+OSTLER_FINAL_DIR'
      must_match: true

  - id: v1059-k-the-compiler-writes-where-the-bursar-reads
    title: the wiki compiler's journal mount points at the daemon's workspace, so writer and reader name one path
    incident: >-
      🔴 THE BURSAR SAW A QUIET MONTH INSTEAD OF A SEVERED PIPE, SECOND HALF.
      #1301 (row B) mounted the host journal into the compose stack and that
      was necessary. It was not sufficient: the mount source was
      HOME/.ostler/workspace, and the daemon actually runs with
      ZEROCLAW_WORKSPACE pointed at OSTLER_DIR/assistant-config, so its
      CostTracker reads OSTLER_DIR/assistant-config/workspace/state. The
      compiler was therefore still writing on the FAR SIDE of the mount, its
      records were still discarded at container exit, and the panel still
      rendered a smaller number that reads as low spend rather than as a broken
      pipe.
      FIX (#1330): point the mount source at the daemon's workspace so the
      writer and the reader name one path.
      ⚠️ TWO ROWS, ONE SUBJECT, AND THAT IS DELIBERATE. Row B proves the mount
      exists; this row proves it is aimed at the right directory. Either alone
      reads as "the journal works" and neither alone makes it true. This is the
      same shape as rows H and J, in a different subsystem, in the same cut --
      which is the argument for why a manifest row must name the mechanism and
      not the intention.
      ⚠️ THE PATTERN KEYS ON THE COMPOSE LINE, NOT ON A COMMENT. Three comment
      blocks now mention assistant-config/workspace and any of them could be
      tidied away without touching behaviour. It also carries no dollar sign and
      no braces, and reaches the closing brace with `.` rather than naming it.
      CARRIED FROM v1.0.59 AND RE-MEASURED AT THE v1.0.60 PIN: 1 hit.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'assistant-config/workspace./state:/workspace/state'
      must_match: true

  - id: v1060-l-the-doctor-can-be-asked-what-each-source-did
    title: the Doctor serves a typed per-source status record, so "which sources ran" stops being a guess
    incident: >-
      THERE WAS NO PLACE TO ASK WHAT EACH SOURCE ACTUALLY DID, so every answer
      about ingest came from counting probes or reading markers sideways. That
      is the shape behind a long run of disagreeing surfaces: a freshness panel
      with no per-source date, components reading stale while others update,
      and people counts that differ across three screens. The instrument was
      missing, not merely wrong.
      FIX (#1346, G1a/G1b/G1c/G3): a typed hydrate sentinel plus a
      /api/v1/sources reader on the Doctor, so one record answers both "did it
      run?" and "is it still updating?" rather than leaving each surface to
      infer its own answer.
      ⚠️ THIS ROW PROVES THE ROUTE, NOT THE DATA. Serving an endpoint is not
      populating it, and a per-source status that is present but empty would
      satisfy this pattern. Whether real sources report real statuses on a real
      box is behaviour and belongs to the walk, which is where it is carried.
      Presence is the only thing a source-grep can honestly assert.
      ⚠️ A LATENT PATH-RESOLUTION TRAP IS KNOWN AND FILED, NOT SHIPPED-BROKEN.
      The reader honours OSTLER_HOME then OSTLER_DIR while the writer uses
      OSTLER_DIR alone, and OSTLER_HOME already means HOME rather than
      HOME/.ostler elsewhere in install.sh. Refuted for the shipping config --
      the Doctor LaunchAgent sets neither variable and its own comment records
      that LaunchAgents inherit no environment, so both reads are None and the
      reader falls back to the writer's path. It is an instance of the
      two-meanings class already tracked as #325 and its fix is a fast-follow,
      deliberately not folded into a cut window.
      NEW IN v1.0.60. TWO-SIDED: 0 hits at the v1.0.59 pin, 1 here.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: vendor/doctor/agent/web_ui.py
      pattern: 'api/v1/sources'
      must_match: true

  - id: v1060-m-a-removal-is-reported-as-a-removal
    title: a Transcripts folder the customer deleted is reported as removed, not as a Mac that never had one
    incident: >-
      NEVER-HAD-IT AND HAD-IT-AND-LOST-IT PRINTED IDENTICALLY, AND ONE OF THEM
      WAS FALSE. The message is written for a fresh Mac where no recording has
      ever been made. In the other case it states a cause that is not the
      cause: the user tree WAS created and announced, and the Transcripts
      directory has been removed since. "there are no recordings to read" is
      then untrue, and a feed the customer previously had goes quiet underneath
      a reassuring sentence. Absence of data and absence of the place data
      lives are not the same absence.
      FIX (#1347, B2): the user-tree sentinel is the discriminator and it
      already existed for exactly this purpose, so the branch reports a removal
      AS a removal.
      ⚠️ THE FIX STILL CREATES NOTHING, AND THAT IS DELIBERATE. The sentinel's
      original intent is that a customer who has knowingly removed or renamed a
      subdir is not surprised by its silent re-creation. That intent is
      preserved: what changed is only what is SAID, not what is made.
      `warn` rather than `info`, because after a removal this is a capability
      that was available and now is not.
      ⚠️ THE ROW KEYS ON THE MESSAGE IDENTIFIER, NOT ON THE COMMENT BLOCK. The
      commit is mostly its own reasoning, and keying there would guard the
      documentation of the fix rather than the branch that emits it -- the same
      reasoning already recorded on rows C and K.
      NEW IN v1.0.60. TWO-SIDED: 0 hits at the v1.0.59 pin, 1 here.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'MSG_WARN_FEED_SPOKEN_TRANSCRIPTS_REMOVED'
      must_match: true

  - id: v1060-n-the-extension-carries-its-own-credential
    title: the browser extension has a credential of its own, wired through the Doctor proxy
    incident: >-
      THE EXTENSION HAD NO CREDENTIAL OF ITS OWN, so its ingest calls sat
      behind the same auth wall that has produced a run of "works after
      pairing, dead before it" defects. A capture surface that cannot
      authenticate is a capture surface that silently drops what it captures.
      FIX (#1343, B3 a+b): a dedicated extension token module plus the proxy
      arm that honours it.
      ⚠️ THE ROW KEYS ON THE PROXY WIRE, NOT ON THE NEW MODULE. A pattern
      against extension_token.py would score 21 and prove only that a file was
      added -- the #532 two-artefacts-one-consumer shape, where the content
      half lands and the wiring half does not. Keying on the CONSUMER means the
      row goes red if the module ships unwired, which is the failure this
      estate keeps meeting.
      NEW IN v1.0.60. TWO-SIDED: 0 hits at the v1.0.59 pin, 2 here.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: vendor/doctor/agent/proxy.py
      pattern: 'extension_token'
      must_match: true

  - id: v1061-o-a-clean-finish-cannot-be-claimed-over-a-failed-step
    title: the closing verdict consults the failed-step list, so an install cannot report success over a step that failed
    incident: >-
      THE INSTALLER TOLD THE CUSTOMER IT HAD FINISHED CLEANLY WHILE ITS OWN
      RECORD HELD FAILED STEPS. Caught on the v1.0.60 ARTEFACT during the walk,
      not reasoned about from source: the post-install QA read
      `DONE status=ok failed_steps=2 errors=0` -- a clean verdict printed over
      two recorded failures. Filed as v1060-D001. The customer is told the
      thing worked; the log says otherwise; and the person who most needs to
      know is the one being reassured.
      FIX (#1369): the closing verdict is DERIVED from the accumulated
      __OSTLER_FAILED_STEPS list rather than asserted independently of it, and
      a non-empty list produces a warning that names the failure instead of a
      success line.
      ⚠️ PATTERN CHOSEN AGAINST A MEASURED ALTERNATIVE. `failed_steps` is the
      obvious string and it scores 1 on the PRE-FIX tree, so a row keyed there
      would report green with no fix present. The message identifier the new
      branch emits scores 0 before and 1 after, which is the only shape that
      can go red if the fix is reverted.
      NEW IN v1.0.61. TWO-SIDED: 0 hits pre-fix, 1 here.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'MSG_WARN_INSTALL_FINISHED_WITH_FAILED_STEPS'
      must_match: true

  - id: v1061-p-a-reuse-run-keeps-the-customers-daily-briefs
    title: re-running the installer with reuse-settings restores the customer's configured daily-brief channels instead of dropping them
    incident: >-
      A CUSTOMER-VISIBLE SILENT LOSS ON A PATH PEOPLE ACTUALLY TAKE. Choosing
      "reuse my settings" on a re-run rewrote the assistant config without
      carrying the existing daily-brief channel configuration forward, so the
      briefs the customer had already set up stopped arriving. Nothing failed,
      nothing was logged, and the install reported success -- the defect is
      invisible until a brief does not turn up. Filed as #619.
      FIX (#1377): the reuse path reads the channels out of the existing
      config and restores them, so a re-run preserves what the customer
      configured rather than silently replacing it.
      MUTATION-PROVED AGAINST THE REAL PRE-FIX TREE, not a synthetic one: with
      the fix reverted the test fails with "wrote 0 [[cron.jobs]], expected 2
      -- the customer lost their briefs". The test is INVOKED, not merely
      present (2 call sites, control 2).
      NEW IN v1.0.61. TWO-SIDED: 0 hits pre-fix, 2 here.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: '_ostler_restore_channels_from_existing_config'
      must_match: true
  - id: v1062-q-the-import-refuses-a-store-that-is-not-ready
    title: the import step refuses an unready store instead of embedding 3810 people into a void
    incident: >-
      A STEP REPORTED status=ok WHILE DISCARDING EVERY RECORD IT WAS GIVEN.
      On the clean-account v1.0.61 walk the Qdrant collections did not exist
      at the moment import_data ran. Collections do not self-create on a cold
      install, so every one of 3810 people was embedded, posted to a missing
      collection, 404'd and dropped. Nothing failed. The step printed
      STEP_END status=ok and the install carried on. The customer's entire
      people graph was lost in silence, and the only reason we know the
      number is that the log recorded what was attempted. Filed as v1061-D003.
      FIX (#1385): the import now checks the store BEFORE it runs and refuses
      with ERR-14-STORE-NOT-READY-FOR-IMPORT rather than running into a void.
      The refusal is wired AHEAD of the import step and its script call, so
      the check and the thing it guards are connected rather than adjacent,
      and the test asserts that ordering by line number.
      NEW IN v1.0.62. TWO-SIDED: 0 hits at 477608ab, 1 here.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'ERR-14-STORE-NOT-READY-FOR-IMPORT'
      must_match: true
  - id: v1062-r-an-import-that-stored-nothing-is-a-failure
    title: an import that attempted thousands of records and stored none of them now fails the install
    incident: >-
      THE REFUSAL GATE ALONE WOULD NOT HAVE CAUGHT THE WALK'S DEFECT. A store
      can answer a readiness probe and still accept nothing, so a gate that
      only asks "is the store up" leaves the silent-loss path open. The
      second half of the v1061-D003 fix is a YIELD FLOOR read AFTER the
      import: attempted a positive number, stored zero, fail with
      ERR-14-IMPORT-STORED-NOTHING.
      THE FLOOR IS THREE-STATE, WHICH IS THE PART THAT IS EASY TO GET WRONG.
      Its first cut read the attempted count with `2>/dev/null || printf 0`,
      which reports an UNREADABLE log as "attempted 0" -- and attempted-zero
      is precisely the value that makes the floor decline to fire. A guard
      that disarms itself when it cannot see is the same false zero that cost
      a redundant re-ingest in v1061-D004. The shipped read sits behind an -r
      readability guard, returns the string CANNOT-RUN when it cannot read,
      and CANNOT-RUN does not fail the install. The import log is retained
      past the failure that cites it, so the failure keeps its evidence.
      NEW IN v1.0.62. TWO-SIDED: 0 hits at 477608ab, 1 here.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: 'ERR-14-IMPORT-STORED-NOTHING'
      must_match: true
  - id: v1062-s-the-store-readiness-wait-has-a-name-and-a-ceiling
    title: the store-readiness wait is a named, tunable cap of 300s rather than an anonymous 30
    incident: >-
      THE READINESS MISS THAT CAUSED THE SILENT LOSS WAS A TIMEOUT NOBODY
      COULD SEE OR CHANGE. The wait for Qdrant to answer was a bare 30 in the
      middle of a function: not named, not documented, not overridable, and
      on real hardware under a cold install it is too short. Thirty seconds
      of patience is what stood between the customer and a complete people
      graph, and no operator could have raised it without editing install.sh.
      FIX (#1386, filed as #628): the wait is named _QDRANT_READY_CAP, raised
      to 300, overridable via OSTLER_QDRANT_READY_WAIT_S with the override
      validated rather than trusted, and the floor is declared and
      mutation-proved so a future edit cannot quietly lower it again.
      THE ROW KEYS ON THE NAME, NOT THE NUMBER. A row on "300" would pass on
      any file that happens to contain that digit string; the identifier is
      the mechanism and cannot be satisfied by coincidence.
      NEW IN v1.0.62. TWO-SIDED: 0 hits at 477608ab, 7 here. The env override
      was measured separately at 0 pre and 4 here.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: '_QDRANT_READY_CAP'
      must_match: true
  - id: v1062-t-a-locked-store-no-longer-reads-as-an-empty-one
    title: a store that refused to answer is reported as CANNOT-RUN, never as a store containing nothing
    incident: >-
      A LOCKED STORE AND AN EMPTY STORE PRINTED THE SAME THING, AND THE WALK
      PAID FOR IT. The collection count was read with `curl -sf ... || true`,
      and `curl -sf` against a 401 exits 22 with no output, so an
      AUTHENTICATED store that declined to answer was indistinguishable from
      a store with nothing in it. The install concluded the store was empty
      and bought a full redundant re-ingest on that basis. Filed as
      v1061-D004.
      FIX (#1386): the read prints the string CANNOT-RUN on every path where
      it did not get an answer -- transport failure, a 200 with an empty
      body, an unparseable shape -- and never prints 0 for a read it did not
      get. The decision to re-ingest is then taken by
      _initial_hydrate_qdrant_is_positively_empty, a predicate that answers
      yes only on a POSITIVE reading of zero. Could-not-read is not empty.
      NEW IN v1.0.62. TWO-SIDED: 0 hits at 477608ab, 2 here.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: '_initial_hydrate_qdrant_is_positively_empty'
      must_match: true
  - id: v1062-u-no-backslash-whitespace-survives-in-the-shipped-installer
    title: the character sequence that killed the v1.0.61 walk cannot be present in install.sh
    incident: >-
      THIS IS THE DEFECT THAT ENDED THE WALK. A SPACE after a
      line-continuation backslash at install.sh:26690 meant the backslash
      continued nothing: the line ended there, and the argument that should
      have followed became a separate command. `bash -n` on the real pre-fix
      file EXITS 0, so syntax checking could never have caught it, and it
      reached a customer-representative clean account and stopped the
      install. Filed as v1061-D006, fixed in #1386.
      THIS ROW IS THE ONLY GUARD THAT READS THE SHIPPED FILE ITSELF. A
      dedicated gate exists (scripts/verify_no_broken_line_continuation.py,
      with a self-test carrying its own control) and OS003's BOM carries the
      same invariant for grep -E. This row is the third instrument, and it is
      here because the defect is invisible to every syntactic check we own.
      THE PATTERN IS SPELLED FOR PYTHON, DELIBERATELY DIFFERENT FROM THE BOM
      ROW. See the header: the BOM's POSIX-class spelling scores 2 here under
      Python re, and the obvious \s spelling scores 661 because \s matches a
      newline and re.findall is not line-oriented. Both wrong spellings were
      measured before this one was chosen.
      NEW IN v1.0.62. TWO-SIDED, IN THE ABSENCE DIRECTION: 1 hit at 477608ab,
      0 here. A row that must be absent is only meaningful if it was once
      present, and this one was.
    proof:
      kind: grep_in_source_at_sha
      repo: cm051
      path_hint: install.sh
      pattern: '\\[ \t]'
      must_match: false
