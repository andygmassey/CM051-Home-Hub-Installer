    title: every probe-shaped script must be collected by run_box_walk.sh or exempted with a written reason
    incident: "acceptance_gate_v1013.sh sits one directory above the collector's glob. cut-manifests/README.md records the same shape as this project's worst measurement failure: people_seed_and_retrieval sat outside it and FOURTEEN CUTS reported a gate that measured nothing."
