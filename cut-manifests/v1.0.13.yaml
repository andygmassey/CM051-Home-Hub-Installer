# cut-manifests/v1.0.13.yaml
# ============================================================================
# Point-in-time contract of what the v1.0.13 DMG cut MUST contain.
#
# Every entry is a fix that has slipped, or would silently slip, without an
# artefact-level proof. The verifier walks this file + permanent.yaml before
# codesign. Any FAIL fails the cut BEFORE signing (fail-closed).
#
# Once v1.0.13 ships, entries that are truly permanent (never-regress) should
# be promoted into permanent.yaml so v1.0.14 and beyond keep proving them.
#
# Format: see cut-manifests/README.md.
# ============================================================================

version: v1.0.13
description: |
  v1.0.13 cut contract. Consumes permanent.yaml + these entries. Fails cut on
  any RED before codesign. This cut ships with:
    - #170 pair-iOS gateway_port vendor sync (CM051 #479)
    - #172 Doctor iMessage FDA-pending diagnostic rule (HR015 #273)
    - #175 appcast trial-cohort fix (CM050 #42, Worker-side, not in DMG)
    - #177 /tmp/ostler-prelaunch path fix in emitted plists (CM051 #480 + CI gate)
    - #178 wiki SETTING-UP card auth wall unblocked (HR015 #273)
    - #171 installer version consistency gate + bump to 1.0.13 (CM051 #481)
    - CM051 #478 fresh-install regression stack (spoken-consent + FDA copy + Facebook parser)

entries:

  # --------------------------------------------------------------------------
  # #171 installer version stamp — DMG-boundary assertion
  # --------------------------------------------------------------------------
  # The source-consistency gate (tests/test_installer_version_consistency.sh)
  # proves the three tracked source files (project.yml + Info.plist +
  # project.pbxproj) agree with each other, so a HALF-bump fails closed.
  # But it cannot catch a "nobody bumped anything" cut where all three are
  # CONSISTENTLY stale versus the release version — which is literally the
  # #171 shape (v1.0.11 + v1.0.12 DMGs shipped with all three at 1.0.10
  # because the source was internally consistent while the tag advanced).
  #
  # This manifest entry closes that gap at the built-artefact boundary:
  # the built OstlerInstaller.app inside the DMG payload MUST stamp exactly
  # this cut's marketing version. If the source drifts from the cut tag
  # (all three stale), this entry fails BEFORE codesign, aborting the cut.
  #
  # This is the ORM/manifest-owned half of #171; the source-consistency gate
  # (CM051 #481) is the local-Makefile half. Together they catch both
  # half-bump AND no-bump failure modes.
  #
  # See VERSIONING.md (added in CM051 #481) for the full context + why
  # both halves are load-bearing for the "100% clean cut" mandate Andy set
  # 2026-07-30 after the v1.0.12 DMG shipped with a stale 1.0.10 stamp.
  - id: v1013-installer-app-version-stamp
    title: built OstlerInstaller.app CFBundleShortVersionString must equal 1.0.13
    source_pr: andygmassey/CM051-Home-Hub-Installer#481
    proof:
      kind: plist_key_equals
      target: installer-app
      path: "Contents/Info.plist"
      key: "CFBundleShortVersionString"
      value: "1.0.13"

  # --------------------------------------------------------------------------
  # HR015 #191 canary — pinned_artefact_freshness against the daemon tarball
  # --------------------------------------------------------------------------
  # This entry is the FIRST use of the pinned_artefact_freshness primitive
  # (added in the same PR that added the primitive itself). It proves the
  # v1.0.13 daemon pin (`hub-v0.4.41`, per HR015 baee2d7 in gui/Makefile)
  # actually contains the two subscription/pairing PRs merged into
  # ostler-ai/ostler-assistant's main hours before this cut assembly:
  #
  #   * oa #242 (2026-07-30T03:01Z) has_ever_paid sticky bit gates the
  #     14-day post-lapse soft-landing. Locked launch-blocker.
  #   * oa #257 (2026-07-30T14:33Z) companion TLS listener for iOS pairing.
  #     v1.0.13 launch-blocker.
  #
  # The class of bug this catches: on 2026-07-30 VG surfaced that the
  # subscription-grace-period hardening (oa #242) had merged to
  # ostler-assistant/main BUT was NOT contained in the cut-bound daemon
  # binary — because the cut's pin predated the merge. `feedback_pinned_artefact_must_have_freshness_gate`
  # captures the incident + rule. This entry is the enforcement.
  #
  # NOTE: If this entry RED-fails the v1.0.13 cut, that is by design. The gate
  # is telling ORM one of two things has slipped:
  #   (a) the pinned daemon tarball needs to be re-tagged / re-released off
  #       a commit that includes both merges; OR
  #   (b) the daemon pin in gui/Makefile is stale and needs bumping to a
  #       tag that DOES include the merges.
  # Do NOT bypass this gate. Fixing it forward is the whole point.
  - id: v1013-hub-daemon-contains-critical-fixes
    title: daemon pin must contain oa#242 has_ever_paid + oa#257 companion-TLS
    source_pr: andygmassey/HR015-Gaming-PC#191
    proof:
      kind: pinned_artefact_freshness
      repo: ostler-ai/ostler-assistant
      pin: hub-v0.4.41
      must_contain_prs: [242, 257]
      min_build_time_after_pr: 257
