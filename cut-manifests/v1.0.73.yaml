      path: "tests/test_every_probe_on_disk_is_collected.py"
      pattern: "probe-shaped script"
      must_match: true

  # ==========================================================================
  # DEFECT-ABSENCE PROOFS for defects MEASURED on the v1.0.71 walk box today.
  # Each pattern is the broken form. must_match:false means the cut fails while
  # the defect is still in the tree.
  # ==========================================================================

  - id: downloads-watcher-defines-its-own-deadline
    title: the generated Downloads scanner must define the names _notify uses
    incident: "v1.0.71 box 2026-09-05: ostler-scan-exports line 18 OSTLER_OSASCRIPT_TIMEOUT_S unbound, rc=1, importer never called"
    proof:
      kind: grep_in_installer
      # THE NEEDLE OMITTED THE QUOTES, SO IT MATCHED NOTHING AND THE ROW COULD
      # NEVER PASS. The shipped assignment wraps its default-expansion in
      # DOUBLE QUOTES; the pattern looked for the bare, unquoted form. The
      # exact literal is deliberately NOT reproduced in this comment: a
      # landing check for the quoted form counted this very line and read 1
      # where it expected 0. Describe a flagged literal, never repeat it.
      # Measured on
      # cf5e3193 with the fix present: old needle 0 hits, quoted needle 2.
      #
      # AND THE COUNT IS THE PROOF, NOT THE PRESENCE. install.sh defines this
      # name twice once the fix is in: once in its own scope, and once inside
      # the SCANEOF heredoc that becomes ostler-scan-exports. Only the second
      # is the subject of this row, and the two lines are textually identical,
      # so no single-line pattern can tell them apart. Measured:
      #
      #     2fb58d1e (fix ABSENT)  1 hit   <- install.sh scope only
      #     cf5e3193 (fix PRESENT) 2 hits  <- plus the generated scanner
      #
      # So must_match alone would PASS on the tree that still ships the defect.
      # min_hits: 2 is what makes this row discriminate. It requires the
      # grep_in_installer floor added in the same PR as this row.
      pattern: 'OSTLER_OSASCRIPT_TIMEOUT_S="\$\{OSTLER_OSASCRIPT_TIMEOUT_S:-20\}"'
      must_match: true
      min_hits: 2

  - id: killed-converge-still-gets-catchup
    title: the catch-up guard must consider the KILLED marker, not only .done
    incident: "v1.0.71 box: .done AND .killed both present; agent skipped; 84 people split across two stores; 3 QA probes failed"
    proof:
      kind: grep_in_installer
      pattern: "_DEDUPE_DONE_MARKER\" \\|\\| -f \"\\$_DEDUPE_KILLED_MARKER"
      must_match: true

  # THIS PAIR IS ONE PROOF, AND THE SECOND HALF IS NOT OPTIONAL.
  #
  # The absence row below was GREEN ON MAIN FOR THE WRONG REASON. Measured:
  # `ASSUME_YES` appears ZERO times in install.sh on origin/main (control:
  # `OSTLER_` appears 1655 times, so the file is readable). #1567 has not
  # landed, so the row could not tell "the bad form is absent because the fix
  # is right" from "the feature does not exist at all".
  #
  # That is precisely the defect #1153 describes -- a needle satisfied by
  # something other than the thing it exists to prove -- sitting inside the
  # manifest that bans it. Found by a review of my own rows, not by the gate.
  #
  # So the absence proof is paired with a presence proof naming the construct
  # the fix actually introduces. Until #1567 lands the presence row is RED,
  # which is correct: the property is unproven, and the manifest should say so
  # rather than report a pass it did not earn.
  # A CALL-SITE PROOF, AND THE REASON IT IS NOT AN ABSENCE PROOF.
  #
  # This replaced a row grepping `[[ -n "$ASSUME_YES" ]]` with must_match:false,
  # which was wrong TWICE. It was green on main only because ASSUME_YES did not
  # exist there at all (0 occurrences against 1655 for OSTLER_), and it would
  # have gone RED ON THE CORRECT FIX: #1567 still contains that exact string,
  # in a safe role, warning that a value was set which does not mean consent.
  # Measured hits=0 on main, hits=1 on the PR. A gate that fires on the fix is
  # worse than no gate: the debugging it causes looks like the fix broke
  # something.
  #
  # Anchored to the CALL, not the definition. `_assume_yes_granted` alone is
  # satisfied by a function that exists and is never reached -- the exact
  # mutant TNM's #1579 shows the converge row passing.
  - id: uninstall-consent-is-an-allowlist-not-a-non-empty-test
    title: the uninstaller's confirm bypass must be decided by a value allowlist, at its call site
    incident: "#1560 + review 2026-09-05: -n tests non-empty, so =0, =no and =false all proceeded to destroy. The first replacement row banned a SUBSTRING the correct fix still contains in a safe role."
    proof:
      kind: grep_in_installer
      pattern: "(?m)^if _assume_yes_granted; then"
      must_match: true

open_issues:
  - issue: 1618
    title: "no_store_port_is_tcp_reachable measures reachability, which is the wrong predicate for a credentialed surface"
    gate: >-
      FIX (apparatus, counted per Andy): entry: the-probe-asks-whether-a-port-SERVES --
      the probe classifies every MUST_BE_CLOSED port with `nc -z`, which is TCP
      reachability. That was the right question when the stores had no auth. It
      is the wrong one now. MEASURED by me on the walk box, unauthenticated:
      6333 401, 7878 401, 6379 -NOAUTH, 8044 200 serving the whole wiki, 3000
      200, 8144 listening but not answering HTTP. Of the six the probe names,
      three refuse, two serve, and all six are reachable. So the probe is
      alarming about the safe ports and CANNOT SEE the two that are open: 8044
      and 6333 produce the same output line. Proof: an unauthenticated request
      per port with the RESPONSE recorded, PASS on 401/403/NOAUTH/refused, FAIL
      on 2xx naming the ports that served, a positive control on a port that
      must answer for the prober (8000) so a clean sweep cannot come from a
      broken client, and "reachable but not speaking HTTP" reported as its own
      state rather than folded into a pass.
  - issue: 1619
    title: "v1018-D011 is live at v1.0.71, and no red rollforward row has a manifest row"
    gate: >-
      FIX (BLOCKING): entry: a-display-name-is-a-name -- MEASURED on the walk
      box by the first real run of the rollforward gate: 1595 People pages
      examined, 6 carrying a display_name derived from a KINSHIP term (5) or an
      EMAIL (1). Customer-facing: the wiki is the surface a customer reads and
      a person page titled with a relationship word is wrong in the way most
      obvious to the person it is about. Paths deliberately withheld here and
      by the gate, because a person page's filename is a person's name. Proof
      must be the same 1595-page sweep returning zero of both, PLUS a positive
      control: a seeded person whose only available label IS a kinship term
      must still produce something, and that something must not be the kinship
      term. Silently dropping the person would satisfy a naive check while
      making the wiki worse.
      STRUCTURAL HALF, and it is the reason this row exists: the checklist gate
      enforces open ISSUES, and the rollforward registry is a SEPARATE defect
      list, so a rollforward row can be RED against a shipped box while the
      checklist reads all-registered. MEASURED: neither of the two red
      rollforward rows had a manifest row. Either the checklist gate also reads
      the rollforward MUST-FIX rows, or every red rollforward row gets an issue
      and enters by the existing door.
  - issue: 1601
    title: "a probe that exceeds the manifest timeout is reported as FAIL, hiding a real diagnosis behind an instrument error"
    gate: >-
      FIX (apparatus, counted per Andy): entry: a-timeout-is-cannot-run --
      verify_cut_manifest.py runs every box_walk_probe under one global
      BOX_WALK_PROBE_TIMEOUT_SECONDS and reports an over-run as FAIL, counted
      in the summary beside genuine failures. MEASURED 2026-09-06:
      assistant_answers_grounded was 1 of 12 FAILs in the first live-box run;
      re-run with no cap it completes and returns a precise verdict, 2 of 3
      questions answered without reaching the customer's data. The cap replaced
      a diagnosis with an instrument error. Proof: a probe that exceeds its cap
      must be adjudicated CANNOT-RUN and counted separately, and the cap must
      be per-probe so a conversation-driving probe can declare what it needs.
      A timeout counted as a failure is how a real finding comes to look like a
      broken instrument, and Andy's requirement is that every probe passes on
      every walk.
  - issue: 1595
    title: "the store-port probe's header is stale in the reassuring direction"
    gate: >-
      FIX:(gated): entry: store-port-probe-header-is-current -- three of seven
      rows in the probe's own header say default-OFF where the shipped default
      is ON. Stale in the REASSURING direction is the dangerous direction: a
      reader checking the probe to see whether auth is enforced is told it is
      not. Andy's instruction was to count the instruments in the manifest, and
      this is an instrument lying about its own subject. Proof: the header
      table generated from or checked against the shipped defaults rather than
      hand-maintained.
  - issue: 1596
    title: "one null date in the preferences artefact fails the whole payload, so the assistant cannot read preferences"
    gate: >-
      FIX:(gated): entry: a-null-date-does-not-void-the-payload -- writer emits
      null (interest_profile.py:597), artefact keeps it, server returns it 200,
      and the Rust reader rejects the WHOLE payload on it. A single unparseable
      field voiding an entire customer-visible surface is the fail-open/
      fail-shut asymmetry we keep finding. Proof: a fixture carrying one null
      date that must still yield the other records, with a control proving the
      reader can reject genuinely malformed input.
  - issue: 1597
    title: "assistant_answers_grounded cannot tell a failed turn from a recovered one"
    gate: >-
      FIX:(gated): entry: a-recovered-turn-is-not-a-failed-turn -- adjudicate_turn
      greps the WHOLE transcript for a tool ERR, so any single error anywhere in
      a turn scores tool_error even when a later call succeeded. A probe that
      cannot distinguish recovery from failure produces reds nobody can act on,
      which is how a suite stops being read. Sibling of #1585, merged. Proof:
      transcript fixtures for failed, recovered and clean turns, each
      adjudicated correctly, with the recovered one as the discriminator.
  - issue: 1598
    title: "pwg_knowledge_search reads a Qdrant collection that Apple Notes hydration does not write"
    gate: >-
      FIX:(gated): entry: the-search-reader-and-the-hydrator-agree -- the tool
      hard-codes `evernote_knowledge`; install.sh:27922 hydrates Apple Notes
      into `apple_notes_knowledge`. Qdrant 404s an unknown collection and the
      tool maps 404 to Ok(empty), so the customer gets silence rather than an
      error. This is the writer/reader contract class in its purest form and it
      is CUSTOMER-FACING: notes are ingested and never searchable. Proof: a
      cross-component test asserting the collection the reader queries is one
      the installer writes, with the mismatch as the negative control.
  - issue: 1587
    title: "the Doctor source table covers hydrate sources only, so the whole FDA family is invisible"
    gate: >-
      FIX:(gated): entry: source-table-covers-every-family -- the table serves
      hydrate sources only, so the FDA family cannot appear in it: Reminders
      ingested 21KB and the table cannot say so. MEASURED on #1587 with
      `ls ~/.ostler/imports/fda/` and a sentinel grep whose positive control
      was `places`. This is a PREREQUISITE for #1589, not a follow-up: an
      end-of-install panel built on the current table would show 13 of 15 and
      look complete, which is the exact failure the panel exists to prevent.
  - issue: 775
    title: "the hydrate-sentinel control (7) has a false pass on a nested block, and types its own denominator"
    gate: "FIX (apparatus, counted per Andy): both halves latent today, but a control with a false pass and a hand-typed denominator are instrument defects and instruments must work. Needs a proof authored"
  - issue: 1113
    title: "assistant_answers_grounded: tools= is empty because [mcp] servers = [], and every ungrounded turn logs outcome='ok'"
    gate: "VERIFY -- was FIX:(apparatus, verify then close): stated root cause refuted -- pwg_* are native Rust tools, not MCP servers. The tools= emptiness is real and unexplained; gated by entry: probe-assistant-answers-grounded"
