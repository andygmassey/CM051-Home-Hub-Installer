# cut-manifests/v1.0.73.yaml
# ============================================================================
# THE ONE CHECKLIST FOR THE NEXT CUT.
#
# Andy, 2026-09-05: "You keep JUST ONE checklist -- the manifest -- and cross
# things off until they're all done before you make the next cut. Otherwise we
# will NEVER get through this." And: "they all must pass each and every time."
#
# So this file is the whole gate for v1.0.73. It inherits permanent.yaml; the
# verifier walks both and a FAIL in either fails the cut.
#
# TWO SECTIONS, AND THE DIFFERENCE BETWEEN THEM IS THE HONEST PART:
#
#   entries:        MACHINE-GATED. Every row here is proved by a real primitive
#                   against a real box or a real tree. These cannot be ticked
#                   by hand and cannot be forgotten.
#
#   open_issues:    THE FULL REGISTER of every open issue at the time of
#                   writing. The verifier does NOT read this key -- it walks
#                   `entries` only. Rows here carry `gated_by:` naming the
#                   entry that proves them, or `gate: NONE YET`, which means
#                   the fix shape is not decided and NOBODY HAS WRITTEN THE
#                   PROOF. A `NONE YET` row is work, not coverage. Do not read
#                   this section as protection.
#
# Writing a plausible-looking proof for an issue I have not measured would make
# this file lie in exactly the way SKIP-is-not-a-pass lied for fourteen cuts.
# So the ungated rows say so in as many words.
# ============================================================================

version: v1.0.73
description: |
  The single pre-cut checklist.

  WHERE EACH KIND OF ROW IS ACTUALLY ENFORCED. The first version of this
  description said "nothing ships until every entry in `entries` is satisfied".
  That was FALSE, and it was false in the same way the defects this file exists
  to catch are false:

    grep / file rows   ENFORCED AT THE CUT. gui/Makefile runs
                       verify_cut_manifest.sh during `make ship` and a FAIL
                       stops the build.

    box_walk_probe     NOT ENFORCED AT THE CUT. MEASURED: neither
    rows               `--require-runtime-proofs` nor `OSTLER_BOX_HOST` appears
                       anywhere in gui/Makefile or .github/ (control: 43 files
                       repo-wide mention OSTLER_BOX_HOST). The primitive returns
                       SKIP without a box, and SKIP is not a FAIL, so all 26 of
                       these rows pass at `make ship` BY NOT LOOKING.
                       They are enforced AT THE PROMOTE, by
                       scripts/post_walk_qa.sh -- the only caller that passes
                       the flag, and the thing that refuses to write a clean
                       walk record when any probe fails.

  The split is defensible: a runtime bar belongs where a box exists, not at
  assembly. The header claiming the stronger thing was not. Andy's bar, "they
  all must pass each and every time", is met AT THE PROMOTE, and a DMG that has
  not passed post_walk_qa must not reach a customer.

