    gate: "NOT BLOCKING (reporting accuracy, not a shipped defect): verify_usage_journal_producers.py computes missing = [p for p in required if p.hits == 0] and returns EX_FAIL unconditionally once anything parsed. Its only opportunity test is GLOBAL (parsed == 0 -> CANNOT-RUN), so one producer having written is treated as proof that EVERY producer had an opportunity. cm051_ostler_fda_ingest wrote 439 records, which makes parsed > 0, so oa_daemon_chat scores FAIL whether it answered and failed to record OR nobody sent the box a channel message -- and it is matched on purpose=answering, which only a message produces. Five other causes were closed from source before concluding this: the recorder IS present at the pinned daemon bc63c445 (identical to main on all three components), cost tracking is enabled by default (default_cost_enabled -> true) and CM051 never sets [cost] (0 hits tree-wide against a 10-toml control, config.toml being generated at install.sh:13143), the record is written at loop_.rs:1247 BEFORE tool-call parsing so it is not tool-gated, and the journal path matches (tracker.rs:295 vs the probe, resolver pinned 5 ways by a gate that is 15/15 on main). CORRECTED AFTER FILING, and the correction makes the box in question WORSE not better: the opportunity signal already exists and runs in the SAME walk. assistant_answers_grounded and usage_journal_producers are both registered in cut-manifests/permanent.yaml, and the former asks the daemon real questions and counts them. On the box behind this red it reported 2 of 3 turns making no tool call, so the daemon WAS asked three questions: oa_daemon_chat had 3 opportunities and recorded nothing. The no-opportunity explanation is refuted THERE, which leaves the silence unexplained against the five causes closed above, and the only remaining candidate is the init-failure warn 'Failed to initialize global cost tracker' -- a grep of the daemon log, still CANNOT-RUN from here because the box is not mine to touch. CLOSING CONDITION: a producer that never had an opportunity reports CANNOT-RUN per producer and never PASS, with a control proving a genuinely stopped producer is still FAIL so the verdict narrows rather than silencing. The fix does NOT need a new instrument -- it consumes what assistant_answers_grounded already measures for purpose-matched producers."
