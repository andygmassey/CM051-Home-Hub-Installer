{
 "auth_schemes": {
  "admin_token": {
   "header": "Authorization: Bearer <machine admin token>",
   "note": "loopback admin surface"
  },
  "device_bearer": {
   "header": "Authorization: Bearer <paired device token>",
   "note": "token minted by pairing; validated by the gateway PairingGuard (Doctor asks the gateway oracle)"
  },
  "extension_token": {
   "header": "Authorization: Bearer <OSTLER_EXTENSION_TOKEN>",
   "note": "browser-extension key; Doctor accepts it for POST /api/safari/ingest from loopback only"
  },
  "handler_defined": {
   "header": null,
   "note": "enforced inside the handler; not statically classified by the generator"
  },
  "none": {
   "header": null,
   "note": "no credential required"
  },
  "qdrant_api_key": {
   "header": "api-key: <QDRANT_API_KEY>",
   "note": "Qdrant native key, behind the :6333 store proxy"
  },
  "service_token": {
   "header": "Authorization: Bearer <PWG_SERVICE_TOKEN> or X-Ostler-Service: <token>",
   "note": "per-install secret in ~/.ostler/secrets/service_token; ical-server fails closed without it"
  },
  "store_bearer": {
   "header": "Authorization: Bearer <OXIGRAPH_TOKEN>",
   "note": "checked by the :7878 store proxy"
  }
 },
