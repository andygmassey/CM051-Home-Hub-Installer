# Controlled-vocabulary REGISTER for derived dimensions (display + governance).
# This is DATA, not code: adding a dimension never touches the engine. Unknown
# dimensions are still accepted and logged into a counted "unknown" bucket by the
# Aggregator; this file only governs labels, category and the gates.
#
# dimension: { label, category, min_evidence, max_items? }
#   min_evidence  an item needs this many distinct literal preferences
#   tier          broad = a TYPE (genre, cuisine, topic, city); specific = a single
#                 thing (artist, series, restaurant, site). Front Page and the
#                 brief lead with broad; specific follows once broad is settled.
#   half_life_days  recency half-life of this dimension's evidence. Omit for the 540d
#                 preference default (services/common/recency.py, the hygiene table).
#   evergreen     true = never decays (dietary / medical). Dimensions under
#                 food.ingredient, food.diet, health.dietary/medical/allergy are
#                 evergreen by prefix even without the flag.
#   max_items     keep only the strongest N nodes of the dimension. Set on the
#                 high-cardinality ones (every artist, every site) so they cannot
#                 crowd the rest out of a top-N read.

# --- Films -------------------------------------------------------------------
- dimension: media.film.genre
  label: "Film genre"
  category: films
  tier: broad
  min_evidence: 3

- dimension: media.film.director
  label: "Film director"
  category: films
  tier: specific
  sensitive_match: exact      # a NAME: withheld only when it IS a sensitive term
  min_evidence: 2        # fewer films per director is expected

- dimension: media.film.actor
  label: "Film actor"
  category: films
  tier: specific
  sensitive_match: exact      # a NAME: withheld only when it IS a sensitive term
  min_evidence: 3
  max_items: 40

- dimension: media.film.writer
  label: "Film writer"
  category: films
  tier: specific
  sensitive_match: exact      # a NAME: withheld only when it IS a sensitive term
  min_evidence: 2
  max_items: 30

- dimension: media.film.composer
  label: "Film composer"
  category: films
  tier: specific
  sensitive_match: exact      # a NAME: withheld only when it IS a sensitive term
  min_evidence: 2
  max_items: 30

