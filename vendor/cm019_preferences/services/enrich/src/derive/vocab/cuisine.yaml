# SHARED vocabulary for food.cuisine. One canonical label per cuisine, with the
# keywords that mean it. Every food reader (restaurant names, the places
# enrichment's cuisine tags, delivery orders, stated likes) maps into THESE
# labels, so evidence from different sources lands in the same group. Add a
# cuisine or a keyword here, never a second list elsewhere.
#
# A keyword matches as a whole word, case-insensitive. A label that matches no
# keyword is not a cuisine (a venue type such as "restaurant", a price facet)
# and is dropped by readers that set vocab_strict.
italian:     [italian, pizza, pizzeria, pasta, trattoria, ristorante, osteria, gelato, italian, pepperoni, risotto, tiramisu, carbonara, margherita, lasagne, lasagna, gnocchi, bruschetta, focaccia, spaghetti, ravioli, italy]
japanese:     [japanese, izakaya, yakitori, tempura, udon, teppanyaki, tonkatsu, okonomiyaki, gyoza, donburi, katsu, robata, soba, japan]
sushi:        {parent: japanese, words: [sushi, sashimi, omakase, nigiri]}
ramen:        {parent: japanese, words: [ramen, tonkotsu]}
chinese:      [chinese, hotpot, "hot pot", noodle, noodles, dumpling, dumplings, "peking duck", "chow mein", "lo mein", china]
# REGIONAL cuisines. `parent:` rolls the evidence up for "likes Chinese food", but a regional
# value is its own node and is NEVER merged into its parent: "love Sichuan, not a fan of
# Cantonese" is two opposite preferences. Spellings live on the regional row.
sichuan:      {parent: chinese, words: [sichuan, sichuanese, szechuan, szechwan, szechuanese, "si chuan", mapo, "dan dan", "kung pao", "twice cooked pork", "hot and sour", mala]}
