# Reader registry (DATA). Each row registers a Reader the engine runs. Adding a
# dimension = adding a row here and one in dimensions.yaml, with no engine,
# scoring, write or SHACL change.
#
# kind: oxigraph_overlay  -> tag in the RDF enrichment overlay, strength joined
#                            from Qdrant by point id. Only as wide as the
#                            enrichment backlog has reached.
#       qdrant_field      -> value from a Qdrant payload field, or the subject.
#                            Reads the importers' own output, so it covers every
#                            literal preference whether or not it was enriched.
#
# qdrant_field options (all optional):
#   field / fallback_field   dotted payload path ("extra.artist", "subject")
#   split + part             "Show - Episode", split " - ", part first -> "Show"
#   strip_regex              text removed from the value first
#   transform                domain | lower
#   allowlist                keep only these values (and their subdomains)
#   evidence_confidence      0..1, how sure the field is to name the thing
#                            (0.7 an explicit field, 0.4 an inferred one)
# oxigraph_overlay options: tag_entity_type, value_exclude_regex.
#
# Qdrant categories are what the importers write (measured on a real store):
# movie, tv_show, movie_tv, music, book(s), podcast, bookmark, interest, ...

# === Films =================================================================
# Films only. TV has its own dimensions below, so one show is not counted as
# both a film and a series.

- dimension: media.film.genre
  domain: media.film
  category: films
  kind: oxigraph_overlay
  select_categories: [movie, movie_tv]
  tag_predicate: hasGenre

- dimension: media.film.director
  domain: media.film
  category: films
  kind: oxigraph_overlay
  select_categories: [movie, movie_tv]
  tag_predicate: hasEntity
  tag_entity_type: director

- dimension: media.film.actor
  domain: media.film
  category: films
  kind: oxigraph_overlay
  select_categories: [movie, movie_tv]
  tag_predicate: hasEntity
  tag_entity_type: actor

- dimension: media.film.writer
  domain: media.film
  category: films
  kind: oxigraph_overlay
  select_categories: [movie, movie_tv]
  tag_predicate: hasEntity
  tag_entity_type: writer

- dimension: media.film.composer
  domain: media.film
  category: films
  kind: oxigraph_overlay
  select_categories: [movie, movie_tv]
  tag_predicate: hasEntity
  tag_entity_type: composer

# === TV ====================================================================
# A series is the part of a viewing subject before ' - ' ("Show - Episode").

- dimension: media.tv.series
  domain: media.tv
  category: tv
  kind: qdrant_field
  select_categories: [tv_show, tv]
  field: subject
  split: " - "
  part: first
  evidence_confidence: 0.6

- dimension: media.tv.genre
  domain: media.tv
  category: tv
  kind: oxigraph_overlay
  select_categories: [tv_show, tv]
  tag_predicate: hasGenre

- dimension: media.tv.actor
  domain: media.tv
  category: tv
  kind: oxigraph_overlay
  select_categories: [tv_show, tv]
  tag_predicate: hasEntity
  tag_entity_type: actor

# === Music =================================================================
# Artist: the payload names it for streaming and click-through imports; the
# overlay (MusicBrainz) adds the rest. Library imports that carry only a song and
# album name have no artist until enrichment reaches them.

- dimension: media.music.artist
  domain: media.music
  category: music
  kind: qdrant_field
  select_categories: [music]
  field: extra.artist
  evidence_confidence: 0.7

- dimension: media.music.artist
  domain: media.music
  category: music
  kind: oxigraph_overlay
  select_categories: [music]
  tag_predicate: hasEntity
  tag_entity_type: artist

- dimension: media.music.genre
  domain: media.music
  category: music
  kind: oxigraph_overlay
  select_categories: [music]
  tag_predicate: hasGenre

# === Books =================================================================

- dimension: media.book.author
  domain: media.book
  category: books
  kind: oxigraph_overlay
  select_categories: [book, books]
  tag_predicate: hasEntity
  tag_entity_type: author

- dimension: media.book.genre
  domain: media.book
  category: books
  kind: oxigraph_overlay
  select_categories: [book, books]
  tag_predicate: hasGenre

- dimension: media.book.topic
  domain: media.book
  category: books
  kind: oxigraph_overlay
  select_categories: [book, books]
  tag_predicate: hasTopic

# === Podcasts ==============================================================
# Show: the payload's podcast name, else the subject minus the importer's
# '(podcast listening pattern)' / '(bookmarked episode)' suffix.

- dimension: media.podcast.show
  domain: media.podcast
  category: podcasts
  kind: qdrant_field
  select_categories: [podcast, podcasts]
  field: extra.podcast_name
  fallback_field: subject
  strip_regex: '\s*\((podcast listening pattern|bookmarked episode)\)\s*$'
  evidence_confidence: 0.6

- dimension: media.podcast.topic
  domain: media.podcast
  category: podcasts
  kind: oxigraph_overlay
  select_categories: [podcast, podcasts]
  tag_predicate: hasTopic

# === Topics, sites, news ===================================================
# Topics: the enrichment topic tags (Wikidata, the domain-to-topic map, page
# metadata) on everything that is not media. Sites: the host of a bookmark.
# News: the same host, restricted to a list of news publishers.

- dimension: interests.topic
  domain: interests
  category: interests
  kind: oxigraph_overlay
  select_categories: [bookmark, interest, page, saved, shared_link, search, instagram_creator, social_media, social, video, lifestyle, hobby, art, education, community, technology, photography, hardware, marketing, home, kids, toys, networking, organization, professional]
  tag_predicate: hasTopic

- dimension: web.site
  domain: web
  category: web
  kind: qdrant_field
  select_categories: [bookmark]
  field: extra.domain
  transform: domain
  evidence_confidence: 0.4

- dimension: news.source
  domain: news
  category: news
  kind: qdrant_field
  select_categories: [bookmark]
  field: extra.domain
  transform: domain
  evidence_confidence: 0.5
  allowlist: [bbc.com, bbc.co.uk, theguardian.com, nytimes.com, washingtonpost.com, wsj.com, ft.com, economist.com, bloomberg.com, reuters.com, apnews.com, cnn.com, foxnews.com, nbcnews.com, cbsnews.com, abcnews.go.com, npr.org, politico.com, axios.com, theatlantic.com, newyorker.com, vox.com, time.com, forbes.com, independent.co.uk, telegraph.co.uk, thetimes.co.uk, dailymail.co.uk, sky.com, aljazeera.com, france24.com, dw.com, lemonde.fr, spiegel.de, scmp.com, straitstimes.com, channelnewsasia.com, japantimes.co.jp, abc.net.au, smh.com.au, theage.com.au, nzherald.co.nz, theglobeandmail.com, cbc.ca, news.ycombinator.com, techcrunch.com, theverge.com, wired.com, arstechnica.com, engadget.com]

# === Food, places, brands ==================================================
# Cuisine: a venue's topic tags carry its cuisine, its type and a 'Price: $$'
# facet; the price facet is not a cuisine and is excluded.

- dimension: food.cuisine
  domain: food
  category: food
  kind: oxigraph_overlay
  select_categories: [restaurant, food, place, venue]
  tag_predicate: hasTopic
  value_exclude_regex: '^price\b'

- dimension: place.city
  domain: place
  category: places
  kind: qdrant_field
  select_categories: [transportation, food, travel, place]
  field: extra.city
  evidence_confidence: 0.6

- dimension: place.city
  domain: place
  category: places
  kind: oxigraph_overlay
  select_categories: [place, venue, restaurant]
  tag_predicate: hasEntity
  tag_entity_type: city

- dimension: commerce.brand
  domain: commerce
  category: brands
  kind: qdrant_field
  select_categories: [product, fashion, electronics, vehicle, hobby, media, home, shopping, sports, sport, toys, beauty, kids, hardware, automotive, books, book, lifestyle, wellness, fitness, nutrition, food]
  field: extra.brand
  evidence_confidence: 0.6

- dimension: commerce.brand
  domain: commerce
  category: brands
  kind: oxigraph_overlay
  select_categories: [product, fashion, electronics, vehicle, hobby, media, home, shopping, sports, sport, toys, beauty, kids, hardware, automotive, books, book, lifestyle, wellness, fitness, nutrition, food]
  tag_predicate: hasEntity
  tag_entity_type: brand
