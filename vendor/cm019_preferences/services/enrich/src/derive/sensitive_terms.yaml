  minors:          # events and places that are ABOUT a child, not an adult's own interest
    ["kids party", "kid party", "childrens party", "children party", "child party",
     playdate, "play date", "school run", "school pickup", "school pick up", "school drop off",
     "parents evening", "parent teacher", pta, "school play", "school trip", "sports day",
     nursery, kindergarten, preschool, "pre school", daycare, "day care", creche, crèche,
     babysitter, babysitting, "baby group", "toddler group", "soft play",
     kindergeburtstag, kita, "goûter d anniversaire", guardería, asilo nido,
