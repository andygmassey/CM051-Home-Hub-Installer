     psychiatric, counselling, counseling, adhd, autism, autistic, bipolar, ptsd,
     "eating disorder", anorexia, bulimia, hiv, aids clinic, pregnancy, pregnant, prenatal,
     antenatal, fertility, disability, disabled, "chronic illness", medication, prescription,
     pharmacy, chemist, clinic, hospital, hospice, dialysis, physiotherapy, rehab,
     rehabilitation, "weight watchers", "slimming world",
     sober, sobriety, "alcoholics anonymous", "aa meeting", "narcotics anonymous",
