# SENSITIVE TERMS: GDPR Art. 9 special categories plus diet, minors and the
# alcohol-recovery family.
#
# DATA, read by sensitive.py. A word here must never become a SURFACED
# preference or a surfaced "because" line: it is not derived into any dimension
# and it is filtered again at every read-out (the derived-graph reader, the
# /preferences/derived endpoint, and the QueryClient behind the MCP tools,
# REST API and gateway). The evidence point itself stays in the store
# (category unchanged, compartment unchanged); only surfacing is withheld.
#
# Matching (sensitive.py):
# - text is NFKC-normalised and case-folded; hyphens, dots, slashes,
#   underscores and apostrophes read as spaces;
# - a Latin-script term matches as whole word(s), and also with a plural
#   suffix (-s / -es), so "Muslims", "Vegans" and "diabetics" match;
# - a CJK or kana term matches as a substring (those scripts do not separate
#   words), so it must be at least 2 characters; a single character hides
#   inside ordinary words (癌 aside, がん sits in がんばって, 암 in 암스테르담);
# - a hangul term of 2 characters must START a word (not follow another
#   hangul syllable), so 기도 matches 기도를 but not 경기도; a longer hangul
#   term matches as a substring;
# - an `exceptions` phrase is blanked out BEFORE matching, so a soft-drink brand,
#   a football club and a historical slump are not read as diet, ethnicity or health.
#
# Add a term here, never a second list elsewhere.
# tests/derive/test_sensitive_never_surfaced.py fails if a surfaced vocabulary,
# allowlist or reader category contains one.
#
# OWNER-STATED UNLOCK is NOT implemented. Until it is: store, never surface.

terms:
  religion:        # religion and belief
    [religion, religious, spiritual, spirituality, faith, christian, christianity, gospel,
     worship, church, catholic, protestant, evangelical, islam, islamic, muslim, quran, koran,
     halal, jewish, judaism, kosher, hindu, hinduism, buddhist, buddhism, sikh, sikhism, bible,
     "bible study", prayer, ramadan, iftar, atheist, atheism, mosque, synagogue, gurdwara,
     communion, sabbath, shabbat, diwali, passover,
     # de / fr / es / it / nl / pt
     kirche, moschee, synagoge, koscher, glaube, gebet, religion, islamisch, jüdisch,
     église, mosquée, synagogue, casher, cacher, prière, musulman, juif, chrétien,
     iglesia, mezquita, sinagoga, oración, musulmán, judío, cristiano,
     chiesa, moschea, preghiera, musulmano, ebreo, cristiano,
     kerk, moskee, gebed, moslim, joods, christelijk,
     igreja, mesquita, oração, muçulmano, judeu, cristão,
     # ja / zh / ko
     ハラール, ハラル, 教会, モスク, 宗教, 礼拝, 祈り, イスラム, キリスト教, 仏教,
     清真, 教堂, 清真寺, 宗教, 祈祷, 伊斯兰, 基督教, 佛教, 犹太,
     할랄, 교회, 모스크, 종교, 기도, 이슬람, 기독교, 불교]
  health:          # health, medical and diet (diet is treated as medical or religious)
    [health condition, diabetic, diabetes, coeliac, celiac, "gluten free", "lactose intolerant",
     "lactose free", allergy, allergies, allergic, cancer, oncology, oncologist, chemotherapy,
     chemo, radiotherapy, tumour, tumor, ivf, "in vitro fertilisation", "in vitro fertilization",
