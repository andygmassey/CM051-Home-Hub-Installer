# Blanked out of the text BEFORE matching. Each one is a common name that merely
# CONTAINS a term, under contains matching. Whole phrase, same normalisation.
exceptions:
  ["diet coke", "diet pepsi", "diet lemonade", "diet soda", "as roma", "roma tomato",
   "roma tomatoes", "great depression", "tropical depression", "retail therapy"]

# Values whose ABSENCE or DISLIKE reveals health or religion ("I don't drink
# beer, I'm sober"; "I avoid pork"; "I don't eat meat"). Liking them is not
# sensitive, so they are NOT in `terms`: they are excluded from stated negative
# values and from every say-vs-do contradiction.
abstention_terms:
  [alcohol, alcoholic, beer, beers, lager, ale, cider, wine, wines, prosecco, champagne,
   spirits, whisky, whiskey, vodka, gin, rum, tequila, cocktail, cocktails, sake, soju,
   "craft beer", booze, drinking, pub, pubs, bar, bars,
   pork, bacon, ham, beef, meat, shellfish]

# BROAD CONCEPTS that name a sensitive area without using a word above: the
# labels a Wikidata hierarchy rolls a topic UP into ("disease", "belief system",
# "alcoholic beverage", "childhood"). Read ONLY for the thematic rollup
# (dimension theme.*): a theme label matching one of these, a term above, or an
# abstention term is never derived and never surfaced. Not added to `terms`,
# because a film or podcast title may legitimately hold "medicine" or "drug".
theme_terms:
  [health, healthcare, "health care", medicine, medical, disease, diseases, disorder,
   illness, syndrome, symptom, pathology, infection, pharmacology, pharmaceutical, drug,
   drugs, narcotic, narcotics, psychoactive, addiction, "substance abuse", "mental disorder",
   psychotherapy, nutrition, dieting, "alcoholic beverage", "alcoholic drink", "distilled beverage",
   brewing, winemaking, belief, beliefs, "belief system", theology, deity, deities, god, gods,
   worldview, sect, cult, clergy, sexuality, sexual, sex, "sexual orientation", gender,
   ideology, "political ideology", "political movement", nationalism, "ethnic group",
   race, "human race", child, children, childhood, infant, infancy, baby, babies, toddler,
   parenting, "child care", childcare, adolescence, adolescent, teenager, minor, minors,
   youth, pregnancy, reproduction, "human reproduction", suicide]

# Party or advocacy news hosts: reading one reveals political opinion. A news
# allowlist (news.source) must not contain these. Not exhaustive; the stems above
# also run over every allowlist entry.
advocacy_domains:
  [breitbart.com, huffpost.com, jacobin.com, dailywire.com, motherjones.com, nationalreview.com,
   thenation.com, newsmax.com, oann.com, thefederalist.com, dailykos.com, infowars.com,
   labour.org.uk, conservatives.com, democrats.org, gop.com, libdems.org.uk, greenparty.org.uk]

# Literal-preference categories whose SUBJECT is a NAME (an artist, a film, a
# song, a book, a show, a game). Read-out uses EXACT matching for these, the
# same rule the write side applies to media name dimensions: a band, a film
# credited to an actor, and a song whose names hold a sensitive word are tastes,
# not Art. 9 data. Every other or missing category uses contains matching.
name_categories:
  [music, song, songs, track, tracks, album, albums, artist, artists, movie, movies, film, films,
   movie_tv, tv, tv_show, tv_shows, show, series, book, books, audiobook, audiobooks, podcast,
   podcasts, video, videos, youtube, game, games, app, apps, spotify, apple_music, netflix]

# Reader categories that must never feed a derived dimension (stored only), and
# that the read-out gate withholds. 'kids'/'toys' are an adult's interests and
# stay; data ABOUT a minor is dropped by extra.about_minor.
never_read_categories: [dietary, minor, minors, children, child, health_record, medical]
