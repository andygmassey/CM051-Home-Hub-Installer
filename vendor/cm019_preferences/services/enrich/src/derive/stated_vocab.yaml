# Controlled vocabulary for STATED preferences (what the owner says in
# conversations). DATA, not code: adding a term never touches the mapper.
#
#   <dimension>:
#     <Canonical value>: [synonym, synonym, ...]
#
# The canonical value is what the derived node is called, so "Sichuanese",
# "Szechuan" and "Sichuan food" all become one value "Sichuan" and merge with
# behavioural evidence for the same value (reservations, receipts). Matching is
# case-insensitive on whole words; a plural "s"/"es" is accepted automatically.
# A trailing "food", "cuisine", "cooking" or "dishes" is stripped before lookup,
# so write the bare name. Longest phrase wins, so "iced coffee" is not "coffee".
#
# Every dimension named here MUST exist in dimensions.yaml (a test enforces it).
# Anything the vocabulary does not know goes to the local-model fallback, which
# may only answer with one of these dimensions.

