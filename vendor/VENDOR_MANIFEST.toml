rries front_door() plus the RedirectResponse import the graft had to add, and it reconstructs from source@b0b38310 + doctor.patch. Nothing was owed but the acknowledgement. (2) a1245dc6 (WhatsApp pair code reader + support-bundle leak guard) is SPLIT, deliberately. The GUARD is grafted: _SECRET_LABEL_RE plus its application in _redact_report, so a credential label:value pair is stripped from the Copy-redacted path. The READER (agent/whatsapp_pair.py) is NOT grafted, for a mechanical reason rather than a preference: it is a NEW FILE, and a new file has no durable home in this tooling. sync_vendor.sh regenerates this patch through gen_patch on every sync and gen_patch captures only files present in BOTH trees, so a hand-authored new-file hunk is stripped at the next sync (this is why the old daemon_cron.py hunks are gone and why VENDOR_ONLY.tsv exists). whatsapp_pair.py cannot take a VENDOR_ONLY.tsv row either, because that registry is for files with NO upstream counterpart and this one exists upstream, just not at the held pin -- a row would be a false declaration that masks real drift. It also has no caller in the vendored tree: a1245dc6 states the route and panel land separately. It arrives natively when the pin next moves. THE PIN IS NOT MOVED, per the standing reason below: bumping it would also assert 6639c791, whose content is not in this tree. A DEFECT WAS FOUND AND FIXED IN THE GRAFT, and it is a divergence from upstream that upstream should take back: the regex lists `bearer` as a label but requires a `:` or `=` immediately AFTER the label, and the canonical form is `Authorization: Bearer <token>` where the separator sits BEFORE the scheme word. So `bearer` advertised coverage the pattern could not deliver and a bearer token reached the report in the clear. Measured by feeding the VENDORED _redact_report one header per label and requiring the value to vanish: 15 of 16 dropped, bearer did not. Fixed here by matching on `authorization` and consuming an optiona