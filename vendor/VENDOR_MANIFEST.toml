ness_oxigraph(parsed), and only the else branch reaches qdrant_queue.append at :213. (2) Qdrant therefore holds person and unclassified only. (3) The re-pinned reader admits exactly person plus unclassified, i.e. everything present. (4) The held writer stamps 'person' on everything, i.e. also everything present. Same visible set either way. AND THE BUG ANDY ACTUALLY HIT TRAVELS ON A DIFFERENT SURFACE: the AliExpress record offered as a human to merge is the dedupe queue, fixed by identity_resolver/batch_resolver.py's SPARQL FILTER NOT EXISTS on pwg:contactType, which reads Oxigraph and never reads the Qdrant payload, and identity_resolver IS re-pinned to 402cf9aa in this same change, so the fix Andy needs does ship. WHY NOT SPLICE THE WRITER IN ANYWAY: regenerate_forbidden stands (see regenerate_forbidden_reason), and INDEPENDENTLY the tree does not reconstruct TODAY. Measured by RUNNING the reconstruction rather than by reading the patch: source@f83d5aee plus cm041_contact_syncer.patch differs from the vendored copy in 4 files and 40 lines (requirements.txt 26, syncer.py 10, facebook_events.py 2, linkedin_connections.py 2), none of them #120. Capturing that delta is what a regeneration does, and its minus side is source@f83d5aee, which is where the two unscrubbed names live. So a splice could never have met its own byte-identical precondition, and this hold is the correct outcome rather than a fallback. || v1.0.19 (2026-08-11 ORM/TNM) adds THREE more, and the cm041 pin deliberately stays at f83d5aee while identity_resolver and assistant_api move to CM041 main. (a) 9fe8063b fix(identity): one canonical displayName (#109). Its contact_syncer half is NOT grafted and does not need to be: it does not touch syncer.py at all. It adds five modules -- given_name_variants, identifier_quality, name_election, relationship_labels, role_addresses -- and at CM041 main NOTHING IMPORTS THEM outside their own cluster and tests. Measured, with a positive control: identifier_quality and name_election have zero importers repo-wide; given_name_variants and role_addresses are imported only by identifier_quality; relationship_labels only by identifier_quality and name_election; syncer.py imports none of the five, while the control (vcard_parser) does resolve in syncer.py. Vendoring contact_syncer at main would therefore add roughly 1,100 lines that change no customer behaviour. The half of #109 that DOES reach a customer is identity_resolver/normalise.py and assistant_api/ical-server.py, and both of those trees are re-pinned to CM041 main dcfb7a3e in this same change -- so no bugfix ships un-grafted, which is what shipping_bugfixes_grafted asserts. (b) c51e75a8 and (c) cffd8416 are test-only for this tree; tests/ is excluded from the vendored file-set. AND THE REASON THE PIN MUST NOT MOVE: re-pinning contact_syncer would take 58f53a15's Python settling producer for the `contacts` channel. lib/settling_progress.sh states the contract in its own words: ONE producer per file; two writers on one shard overwrite each other and the panel jumps backwards when the second opens at zero. And 58f53a1 opens at zero (done=0 up front in sync_from_vcf). install.sh at this tree produces that channel from TWO mutually-exclusive arms of one if/else (settling_report_measured contacts on the count>0 arm, settling_report contacts 0 0 true on the else), so exactly ONE fires per run: one logical producer, correctly implemented. RE-MEASURED 2026-08-12 and the substance HOLDS, but the line numbers this reason used to cite (16455/16457) have drifted and now point at an unrelated contacts PROMPT -- a reader who chased them would conclude the reason was bogus. Cite the INVARIANT, not the line: `grep -nE 'settling_report(_measured)? contacts' install.sh` must return call sites that are arms of a single conditional. NOTE the probe shape too: a grep for 'settling_report contacts' MISSES settling_report_measured and under-counts, which is how this audit first talked itself into believing the reason had gone stale. The merge conflict between the AddressBook-fallback graft and 58f53a1 is not a line-number accident: the two changes are semantically incompatible, and resolving the text would resolve away the reason this hold exists. || v1.0.16 (2026-08-07 ORM): the sole contact_syncer-path delta is 58f53a15 feat(settling): wire contact_syncer + meeting_syncer to report_settling_progress() (#108). DELIBERATELY NOT GRAFTED, for the same reason as cm021's caa165f7: it would give the `contacts` channel a SECOND producer. lib/settling_progress.sh names contacts as an out-of-process channel owned by the shell emitter, and install.sh -- verified in the tree being cut -- carries TWO `settling_report contacts` call sites. Two producers on one (channel, shard) pair double-count and trip the uniqueness rule. The channel is NOT dark; this is a duplicate implementation, not a missing fix. Converging CM041/CM021 onto the Python writer (or onto distinct shard names) is post-launch work, and must land on BOTH sides at once -- grafting either half alone is what breaks it."
