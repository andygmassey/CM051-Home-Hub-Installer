# ---- Conversation-feed bundles -------------------------------------------
# email_source / imessage_source / whatsapp_source / spoken_source.
#
# RE-ADDRESSED 2026-08-15. These four sat as verify=skip behind one shared
# sentence: "Upstream HR015 source dir not on disk (removed/relocated since
# af4ae65). WARN until recovered." Nobody had tested it. It is wrong, and it
# was wrong in the direction that costs the most: it described a LOST source,
# which reads as unrecoverable, when in fact all four sources are on this disk
# and were simply being asked for by the wrong name.
#
# WHAT WAS ACTUALLY MEASURED, per tree, rather than inherited:
#
#  1. THE NAMES NEVER EXISTED. source_repo said "$HR015/email-source" and its
#     three siblings, with HYPHENS. HR015 has never carried a path under any of
#     those four names, at any commit, on any ref. The real directories are
#     UNDERSCORED (email_source, whatsapp_source, spoken_source), so
#     resolve_source_repo pointed at a directory that could not exist and
#     vlib_materialise returned 2 forever. Nothing was removed; the address was
#     never right.
#
#  2. THREE OF THEM LIVE ON UNMERGED HR015 BRANCHES, WHICH IS WHY THEY ARE NOT
#     ON MAIN. Measured with git log --all plus the GitHub branch list:
#       email_source     origin/feat/4-artefact-email-source     @ 5d31073
#       whatsapp_source  origin/feat/4-artefact-whatsapp-source  @ af4ae65
#       spoken_source    origin/feat/4-artefact-spoken-source    @ d06d80e
#     "Absent from main" was read as "deleted from main". It is neither: the
#     three feature branches never landed. af4ae65 is the tip of the WhatsApp
#     branch, and the old manifest had copied that one sha onto all four trees,
#     so three of the four pins named a commit that does not contain the tree
#     it claims to pin. A pin that resolves but does not carry the tree is worse
#     than no pin, because it looks checked.
#
#  3. imessage_source IS NOT AN HR015 TREE AT ALL. It has no path in any HR015
#     clone, on any ref, and there is no feat/4-artefact-imessage-source branch
#     on GitHub. Its real home is andygmassey/conversation-memory (CM040) at
#     services/imessage_source, commit 62a776a on
#     origin/feat/4-artefact-imessage-first. tests/test_conversations_ingest_
#     wiring.sh had the attribution right in a comment ("<- HR015 (CM040)") the
#     whole time; the manifest had taken the HR015 half and dropped the CM040
#     half, which is the half that is true.
#
# THE FILE-SET AGREES, which is the check that makes this more than a plausible
# story: for every one of the four, source@pin and the vendored tree have ZERO
# vendor-only and ZERO source-only files once the manifest excludes are applied.
# A wrong guess at an upstream does not produce an exact file-set match.
#
# The remaining delta is CM051-side deploy grafts, the same class already
# recorded for email_ingest and imessage_bridge: the OSTLER_ASSISTANT_BINARY
# ingest-reroute in each plist (so the tick inherits Full Disk Access from the
# signed daemon), the v1.0.3 interactive-chat yield plus adaptive resource
# governor in each tick script, and the v1018-D020 bounded pwg-convo dispatch in
# each pipeline.py. Those are now RECORDED in a divergence patch per tree
# instead of being invisible, so verify=full reconstructs each tree from
# source@pin + patch and any FUTURE drift is caught.
#
# verify_exempt STAYS TRUE ON ALL FOUR, and it is not the same statement as
# verify=full. The two gates ask different questions. This manifest's content
# gate asks "does the vendored tree reconstruct from the pin", which is now
# answerable. verify_cut_freshness.sh asks "is the pin behind the live GitHub
# HEAD for this path", which is NOT answerable for a pin that lives on an
# unmerged branch (or, for imessage_source, in a different repo from the one
# $HR015 names). Exempt-from-live-HEAD and content-verified are compatible, and
# saying both is more honest than either alone.

[[tree]]
name             = "email_source"
vendor_path      = "vendor/email_source"
source_repo      = "$HR015"
source_path      = "email_source"
pinned_sha       = "5d31073d9e28e9024cbb25b308809ef428a39944"
  divergence_patch = "vendor/divergences/email_source.patch"
exclude          = ["tests/", "__pycache__/"]
verify           = "full"
verify_exempt    = true
exempt_reason    = "The pin lives on origin/feat/4-artefact-email-source, an HR015 branch that has never merged, so there is no live main HEAD for the email_source path to compare it against (the path does not exist on main at all). This exempts the tree from the LIVE-HEAD gate only. Its CONTENT is verified: verify=full reconstructs the vendored tree from source@5d31073 + vendor/divergences/email_source.patch. Exemption lifts if and when the branch lands on HR015 main."
note             = "4-artefact email conversation feed (Apple Mail bodies -> CM048 bundle). Source: HR015 origin/feat/4-artefact-email-source @ 5d31073, subpath email_source. Was verify=skip behind a false 'source dir not on disk' claim; see the block comment above for what was actually measured. Divergence patch records the CM051 deploy grafts (OSTLER_ASSISTANT_BINARY reroute in the plist, interactive-chat yield + resource governor in bin/email-bundle-tick.sh, bounded dispatch in pipeline.py, reader.py deploy delta). tests/ is outside the vendored file-set by the exclude glob."

