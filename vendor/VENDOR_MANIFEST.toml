note             = "2026-08-27b (LATEST, Archie, direction check): BOTH SIDES ARE DIRTY, ON DIFFERENT ARTEFACTS, AND THAT IS WHY NO SINGLE MOVE CLEANS THIS ROW. Do not assume the vendored tree is the dirtier side, and do not assume it is the cleaner one either. The answer differs by artefact and the direction was measured, not inferred. (1) ON THE TWO TOKENS IN syncer.py THE VENDOR IS CLEANER: vendored carries the approved cast, while source@f83d5aee and source@origin/main carry the real pair and are byte-identical to each other. So a regeneration exports PRIVATE source values into this PUBLIC repo, exactly as regenerate_forbidden_reason says. That premise is re-confirmed, not overturned. (2) ON THE DIVERGENCE PATCH ITSELF THE VENDOR IS DIRTIER, and this is the half a reader is likely to miss. The patch PLUS side IS the vendored side, and it still carries two items the vendored FILES no longer do, because CM051 #725 scrubbed the files in place and never regenerated the patch. vendor/divergences/cm041_contact_syncer.patch line 73 holds a two-token name whose length and digest DIFFER from the token now in vendor/cm041/contact_syncer/linkedin_connections.py (patch 10 chars, file 8 chars, digests distinct), i.e. the patch preserves the PRE-SCRUB value. Lines 529-530 hold an identical 11-digit phone-shaped run written in two formats, the same digest on both lines. (3) ALL SEVEN PATTERNS ARE BLIND TO BOTH. Scanned the 648-line patch with the real library: 0 hits across 7 patterns, against a spiked corpus of that same patch plus four planted canaries which scored 4, so the harness was proven live ON THIS EXACT CORPUS rather than assumed. The 11-digit run evades the numeric shapes because it is neither a +44 UK mobile nor a +1 US number, so the blindness is NOT only bare-names-in-prose: it is ALSO any phone outside the two national shapes the library encodes. Widen the stated gap accordingly. (4) WHAT THIS MEANS: regeneration exports SOURCE PII, and inaction preserves VENDOR PII. Cleaning the patch plus side is a SEPARATE, PIN-NEUTRAL change, safe in principle for the same reason #725 gave, since these values are absent from source so scrubbing REMOVES rather than relocates them, and it would REDUCE divergence because the patch currently disagrees with the vendored file at line 73. Deliberately NOT bundled into the freshness PR: it is a PII edit to a public artefact and deserves its own review. Filed here with paths and lines so it is actionable by someone who is not me. || 2026-08-27 (Archie, v1.0.48 freshness pass): THE UNRECORDED DIVERGENCE HAS GROWN AND THE FIGURE RECORDED BELOW IS NOW STALE. Re-ran the reconstruction (git archive source@f83d5aee contact_syncer/, excludes applied, then patch -p1 with cm041_contact_syncer.patch) and diffed it against the vendored tree. THE PATCH NO LONGER APPLIES CLEANLY: 1 of 17 hunks fails on syncer.py. DENOMINATOR: 26 files compared, 17 differ, 9 byte-identical, 282 differing lines -- up from the 4 files / 40 lines measured 2026-08-15. Of those 282, 120 carry a namespace token, i.e. they are the b6ae1f91 (#124) graft that landed in the VENDORED tree and can NEVER be written back into the patch while regenerate_forbidden stands. The other 172 sit in ELEVEN files the patch does not record at all, largest being carddav.py at 80 lines with zero namespace tokens (plausibly the AddressBook-fallback graft) and requirements.txt at 26. The patch records only SIX files: facebook_friends.py, instagram_social.py, linkedin_connections.py, linkedin_messages.py, syncer.py, vcard_parser.py. WHAT THIS MEANS FOR THE NEXT READER: regenerate_forbidden = true makes this divergence patch a MONOTONICALLY DECAYING RECORD. Every graft into the vendored tree widens the gap and none of it can be captured, so the patch describes less of the tree every month. Do NOT read it as an inventory of how the vendored tree differs; it is a partial and ageing subset. And do NOT clear a graft on the strength of a grep against it: eleven files are absent from it entirely, so a grep returning nothing means NOT RECORDED, never NOT DIVERGED. Measured with a predicate control (a file diffed against itself must score 0) after an earlier pass scored every file as differing by exactly one line -- that uniform 1 was the empty trailing element of a split, not a difference, and the uniformity is what gave it away. || 2026-08-15 (Archie): STILL DO NOT REGENERATE -- the reason has CHANGED and the new one is stronger, so read this before reaching for sync_vendor.sh or vlib_vendor_diff. #725 scrubbed vendored syncer.py in place and did NOT regenerate this patch. That was the safe half of a two-part problem and it left the patch STALE, so measured on 75d228e the patch still carries, on its PLUS side, a real-shaped mobile written in two formats (lines 529-530) and a person name (line 73) -- values whose source files are already clean. A stale patch is a second, durable public copy that no file-scanning gate ever opens. THE TRAP: regenerating to clear those does NOT come out clean, because #725 also scrubbed the VENDORED syncer.py at ITS lines 894-895 (vendored coordinates, NOT upstream ones -- see the locator paragraph below), and those two names ARE PRESENT UPSTREAM at f83d5aee (verified by reading source@pinned_sha, not inferred) and STILL ARE at CM041 origin/main 507deebc, re-measured 2026-08-27. A divergence patch is diff(source@pinned_sha, vendored_copy), so its MINUS lines ARE THE SOURCE: regenerating emits those two upstream lines as minus lines and EXPORTS them from PRIVATE CM041 into this PUBLIC repo. Measured on a real regeneration: the patch goes to 430 plus / 53 minus lines with name 0 on the plus side and 2 ON THE MINUS SIDE. Per #725 own commit message one of that pair is an advisor given name, i.e. a real person. So regeneration trades a real phone number for two real names and is NOT a net win; it is a different leak. NEITHER HALF IS FIXABLE IN THIS REPO. The pin is held at f83d5aee by hold_ack_shas (reasons below), so retire-by-re-pin -- the play that worked for ostler_fda #719 and cm041/assistant_api #715 -- is impossible BY CONSTRUCTION, and sync_vendor.sh is impossible because it re-syncs FROM source and the vendored side is where scrubs live. THE ONLY EXIT is upstream: scrub the two name-shaped tokens in CM041 contact_syncer/syncer.py and advance this pin past it, which means adjudicating the settling-producer hold recorded below. CITE THE INVARIANT, NOT THE LINE. 894-895 are the VENDORED copy line numbers and they DO NOT LOCATE THE UPSTREAM LINES: at source@f83d5aee the pair sits at 662-663, at CM041 origin/main 507deebc (2026-08-27) at 760-761, and lines 894-895 of the SOURCE file are unrelated SPARQL identifier-triple construction. A reader who took this instruction literally would open CM041 syncer.py at 894, find SPARQL, and conclude the reason was bogus -- the same drift that already happened to the 16455/16457 cite recorded further down. The stable locator is grep -n first-name collisions over contact_syncer/syncer.py, which returns the single comment carrying both tokens on every revision measured. Until then this tree stays RED, and RED is the correct state -- it is already RED on main for exactly this reason. WHAT THIS CHANGE DOES SHIP: the one site that is CM051-authored and therefore safe, a person name in a linkedin_connections.py comment (absent from source@f83d5aee, so scrubbing it removes the value rather than moving it to the other side), replaced with an approved-cast name. Adjudicated with controls both ways: vendor_person_name_sweep.py proved reach on all four shapes plus its negative control; the HR015 #373 permit-list was loaded as classifier (2346 tokens / 169 phrases) behind a two-way control, after an earlier parse of the same file silently loaded 4 tokens and THAT verdict was discarded rather than reported; and a particle limb (van/von/de/del/della/bin) was proven on six families, since the plain two-token regex matches none of them. || HISTORICAL -- 2026-08-15 (earlier): REGENERATION REFUSED, deliberately, and this tree stays RED. Two independent reasons, both measured. (1) PII SUSPECTED. The delta a regeneration would bless carries an unadjudicated person-shaped token, of exactly the shape tests/vendor_person_name_sweep.py was written to hunt: that sweep's own synthetic canary is a structural clone of the line in question, which is how it is known the shape defeated earlier instruments. vendor/PERSON_NAMES_REVIEWED.tsv does not exist yet, so NOTHING has cleared it, and blessing it would convert an open question into a permanently recorded divergence that no future gate ever asks about again. Adjudicate via the sweep and the reviewed-names registry FIRST. Do NOT re-sync to clear it either: a re-sync deletes the vendored side, which is where scrubs live. THIS IS THE WHOLE REASON. It is the only one that still stands, and the correction is recorded rather than quietly dropped: a second reason was written here first, and the gate has since outgrown it. At be7802f the gate reported this tree red on BOTH limbs, DIFFERS *and* 'source has advanced past pinned_sha' for four commits, and it emitted OK only when both were clean -- so a regeneration would have written, failed its own post-write proof and reverted, whatever the PII answer was. verify_vendor_fresh.sh now honours hold_ack_shas, so RE-MEASURED at origin/main 780d34a the advance limb is discharged and this tree is red on the CONTENT limb alone. Recording it because the reasoning is still useful and because a note that silently drops a reason teaches the next reader to distrust the ones that remain: the refusal never rested on that limb, and does not now. || Legit divergence: identity_resolver.normalise import (incl. normalise_phone) + BW-1 phone-normalisation graft + en-dash house style. 2026-07-15: re-synced to CM041 main 11ad1246 (v1.0.9 fixes: calendar owner attribution #96, backfill-at-startup wiring #100, PII sweeps #85/#86/#102). 3-way graft (base = old pin ba59711) preserved the twin-local register_person call sites; linkedin_messages keeps ONE snapshot registration (register_person) where upstream added a parallel _register_in_snapshot call for the same insert."

[[tree]]
name             = "cm041/identity_resolver"
vendor_path      = "vendor/cm041/identity_resolver"
source_repo      = "$CM041"
source_path      = "identity_resolver"
  # RE-PIN 2026-08-15 (ORM, v1.0.27): dcfb7a3e -> 9fe8063b. CONTENT-NEUTRAL, and
  # that is the whole basis on which it is safe to do inside a launch cut.
  #
  # THE OLD PIN WAS A MERGE COMMIT ("Merge pull request #116"), and it does not
  # itself touch identity_resolver/. GitHub's path-filtered commit listing uses
  # simplified history, so a merge that changed nothing on the path NEVER appears
  # in it. verify_cut_freshness.sh's path_delta_shas() walks that listing looking
  # for the pin, does not find it, and falls through to DIVERGED -- reported as
  # "the pin is either off the branch history or >100 path-commits behind". It was
  # neither. The pin was on main and an ancestor of HEAD, and the compare API says
  # plainly: status=ahead, ahead_by=4, behind_by=0.
  #
  # So the RED was the instrument failing to enumerate, not a finding about the
  # tree, and no hold_ack could ever have cleared it: the gate cannot match acks
  # against a delta it was unable to list.
  #
  # WHY 9fe8063b IS THE RIGHT PIN AND WHY IT MOVES NOTHING. It is the most recent
  # commit at or before the old pin that actually TOUCHES identity_resolver/, so
  # it is visible to the path-filtered listing (checked against the live API: it
  # is in the 26 returned). And it names the SAME CONTENT:
  #     git rev-parse 9fe8063b:identity_resolver -> 8faec0830e13a10e66cd9812f639a255c3cbd471
  #     git rev-parse dcfb7a3e:identity_resolver -> 8faec0830e13a10e66cd9812f639a255c3cbd471
  # Byte-identical trees, so verify=full reconstruction from source@pin plus
  # cm041_identity_resolver.patch is completely unaffected. Both parents of the
  # merge carry that same tree too, which is what makes the merge content-neutral
  # on this path in the first place.
  #
  # This is a pin that names an enumerable commit instead of an invisible one. It
  # is not a re-vendor and it takes no new upstream code.
  pinned_sha = "b6ae1f91771f951a4a2cf3b96ce71e4bdd14cc1a"
  divergence_patch = "vendor/divergences/cm041_identity_resolver.patch"
  hold_ack_shas            = "100a3afb5063aee6af92ad6cb16eaad9a3fb0b81 af74324776cf958edaa38a1f8c8b7ca2acf33822 41cb21b64ae8c72ae7e62e3867fefa3432f77b23 4abd573e8ed96d7be608acced7c16c3ed730bf81 ba7bdf3f4a10535af7422d86e90b90897dc8b73d f3a74a9754920a9ba5c59a4ecd26296089509094"
  hold_ack_reason          = "2026-08-27 (Archie, v1.0.48): FOUR path deltas. THREE GRAFTED, ONE HELD, and the pin stays at b6ae1f91. shipping_bugfixes_grafted = true is asserted on the graft, not on a judgement that the fixes did not matter. || THE DENOMINATOR, AND FOR ONCE THE GATE'S NUMBER IS RIGHT. check-freshness reported STALE:+4 and the path-scoped count IS 4: git rev-list --count b6ae1f91..origin/main -- identity_resolver returns 4, against a repo-wide control over the same range of 9. This row declares a REAL source_path, so the gate named a non-empty path in its own output ('path identity_resolver') and did not fall back to the repo-wide enumeration that over-reports every source_path = '.' row. Do not generalise the magnitude defect recorded on the contact_syncer row to this one. || AND A HOLD_ACK CAN ACTUALLY WORK HERE, which is NOT true of every row and is the first thing to check: git show --name-only b6ae1f91 | grep -c '^identity_resolver/' returns 14. The pin TOUCHES its own path, so it is visible to the path-filtered listing path_delta_shas() walks, so the gate can enumerate the delta and match acks against it. Contrast the 2026-08-15 case recorded in the comment above, where the pin was a merge commit touching nothing on the path, the enumerator fell through to DIVERGED, and NO ack could have cleared it. || GRAFTED (1) 100a3afb, #129, _merge_qdrant failed OPEN. It returned None and bailed silently on a missing qdrant_client or a failed retrieve, while the caller set action.executed = True unconditionally after the Oxigraph half had already merged. Every bail left the person deleted from the graph, still present in the vector store, and the action recorded as done, so the two stores diverged by one person per merge permanently. This reaches the customer: install.sh invokes identity_resolver.batch_resolver at two sites (:22141 and :23803), and people/search reads Qdrant, so an orphan point can return a person who no longer exists as a node. || GRAFTED (2) af743247, #131, RULE 2 node-to-node veto. NOT already present despite this tree carrying a RULE 2 graft: the vendored one is _canonical_key_conflict(matched_uri, identity), which compares an INCOMING RECORD against ONE node from inside _identifier_match_trustworthy, and so only decides which nodes may ENTER found_uris. Upstream's is _canonical_keys_conflict(uri_a, uri_b), which compares TWO EXISTING NODES inside the RULE 1 collapse loop. Different surfaces, and the collapse loop was UNGUARDED. When the incoming record carries no canonical key of its own the record-vs-node guard has nothing to compare, returns None for both nodes, and the loop then folds two provably different Contacts cards together. DEMONSTRATED RED against the pre-graft vendored copy and GREEN after, with TWO CONTROLS that pass on BOTH sides (absence-still-merges, same-key-still-merges), so they are controls and not fix-confirmers. Both guards now coexist; the vendored one is untouched byte-for-byte. || GRAFTED (3) 41cb21b6, #132, a merge must leave the SURVIVOR typed as a live Person. Neither merge path ever asserted rdf:type on the keep while the batch path deletes the discard's, so a merge into an untyped node produced a person-shaped node invisible to every ?p a pwg:Person count. Grafted into BOTH paths. Proved by reading the SPARQL each path actually ISSUES: resolver.merge_persons 12 updates / no type assertion BEFORE and 13 / asserted AFTER, _merge_oxigraph 17 / none BEFORE and 18 / asserted AFTER, matching the upstream commit's own numbers. Shipped with a detector self-test and a DISCARD control (typing the discard must NOT satisfy the check), both passing on both sides. || A DELIBERATE DEPARTURE FROM VERBATIM, and it is a real defect in upstream #129 rather than a preference. Upstream annotates _merge_qdrant '-> bool' and adds three returns (False, False, True) but the SUCCESSFUL merge path falls off the end and returns None. None is falsy, so the caller's 'if not _qdrant_ok' fires on every merge that WORKED, incrementing _qdrant_unreconciled and logging UNRECONCILED MERGE for a healthy merge. That is the exact false alarm #129's own docstring says it must not raise, and it inverts the signal the commit exists to create. Verified two ways: by AST on source@origin/main (only Return nodes are False/False/True; the last body statement is an Expr), and at RUNTIME against a stub qdrant client driving the success path, where upstream returns None and the vendored copy returns True. The vendored graft adds the missing terminal 'return True' and says so at the site. A verbatim graft would have shipped the false alarm. || HELD 4abd573e, #133, feat(reconcile): dry-run repair for the two residuals. NOT a shipping bugfix and not withheld from a customer. It adds ONE new module, identity_resolver/reconcile_people_stores.py, and its own test; it modifies no file this tree ships. It is an OPERATOR CLI run by hand via python3 -m, dry-run by default, whose residual-B arm DELETES Qdrant points irreversibly, and its own author states it was built and deliberately not fired. Nothing invokes it: a search across CM051 for reconcile_people_stores returns zero, against a positive control showing how this repo does invoke identity_resolver modules (install.sh :22141 and :23803 call identity_resolver.batch_resolver), so the zero is a real absence and not a broken predicate. Upstream the same holds: its only references are its own docstring usage lines and its own test. THE ABSENCE DISCRIMINATES: reconcile_people_stores.py IS present upstream at origin/main and absent from the vendor tree, while resolver.py, batch_resolver.py and tidy.py in the SAME directory are present on BOTH sides, so this is a file that postdates the pin rather than a probe that cannot see the directory. The three grafts above stop NEW residuals being created, which is the half that reaches a customer; repairing residuals already written to Andy's real contact data is an operator decision, not a cut decision. || A SEPARATE FINDING THAT OUTRANKS ALL OF THE ABOVE AND IS NOT FIXED HERE: THIS TREE DOES NOT RECONSTRUCT, and it did not before this change either. verify = 'full' claims source@pinned_sha plus cm041_identity_resolver.patch rebuilds the vendored tree. Measured by RUNNING the reconstruction rather than by reading the patch, at BOTH states, because this change moves the number and quoting only one of them would mislead. BEFORE this change: the patch applies cleanly to source@b6ae1f91, __init__.py and batch_resolver.py came back byte-identical, and resolver.py was left 94 diff lines short. Those 94 lines are the vendored RULE 2 record-vs-node guard, which the patch never recorded: the reconstruction contains 'RULE 2' zero times and the vendored file seven. AFTER this change the residuals are __init__.py 0, batch_resolver.py 85, resolver.py 184. So this graft WIDENS an already-broken invariant, from 94 unrecorded lines to 269, and takes batch_resolver.py from reconstructing to not reconstructing. That is stated plainly rather than buried: the tree was already not reconstructing, this change makes it less so, and the honest reading is that the patch owes an update the moment it can safely be regenerated. So that guard is an UNRECORDED DIVERGENCE, exactly as CM041 #131's own commit message warned, and scripts/sync_vendor.sh would silently delete it from the shipping installer. This graft did NOT destroy it, and that was checked rather than assumed: _identifier_match_trustworthy and _canonical_key_conflict are byte-identical to the pre-graft copy. THE PATCH IS NOT REGENERATED HERE, on purpose. scripts/regenerate_divergence_patch.sh refuses when the source has advanced past the pin, which it has by these four commits, and the only way to discharge that is to point CM041 at a checkout sitting AT the pin, which is the precise manoeuvre that tool's own header names as the dangerous one for THIS tree, whose most recent graft was the removal of real family names from a PUBLIC repo. A name-shape scan of the 148 minus lines a regeneration would write found 5 two-token shapes, of which 2 are technical phrases and 3 are already present in public CM051 on origin/main (3, 4 and 5 files, positive control 'IdentityResolver' at 27 files), so by THAT predicate it looks safe. It is one predicate, it is blind to particle names, and it is not the purpose-built sweep, so it is not a clearance. CI cannot see any of this: vendor-integrity.yml runs verify_vendor_fresh.sh with VENDOR_FRESH_STRICT=0 and the sibling source repos absent, so cross-repo trees degrade rather than fail. FIX IT OUTSIDE A CUT, with the sweep and the reviewed-names registry, and do not reach for sync_vendor.sh on this tree. || 2026-09-02 (Archie, v1.0.56): TWO MORE PATH DELTAS, taking this row from four to SIX. ONE GRAFTED VERBATIM, ONE TEST-ONLY, and the pin still stays at b6ae1f91. || GRAFTED (4) f3a74a97, CM041 #134, fix(identity): canonical display name prefers a real name over a social handle. THIS IS ANDY'S .231 WALK DEFECT: a person was shown under a run-together social handle instead of their real name, because a bare username PASSES is_acceptable_display_name (it is not junk), so the FIRST acceptable candidate won by ingest order. The fix demotes a handle-shaped token below a real name with a STABLE sort, so order still decides among same-shape values and two real names are never reordered. THE GRAFT IS VERBATIM AND THAT WAS MEASURED RATHER THAN ASSUMED: the vendored file was byte-identical to source@f3a74a97^ BEFORE the graft and is byte-identical to source@f3a74a97 AFTER it (digests compared both ways), so unlike the three grafts above this change does NOT widen the unrecorded divergence recorded further down. DEMONSTRATED TWO-SIDED ON THE VENDORED COPY, not on source, because the vendored copy is what a customer runs: pre-graft, candidates handle-then-name returned the handle; post-graft they return the real name. FOUR CONTROLS, all unchanged across the graft and each chosen for a way this fix could over-reach: an all-caps brand stays itself, two real names keep their order, a capitalised mononym is untouched, and a handles-only list still returns the first. The vendored identity_resolver suite is 46 passed on BOTH sides. || ACKED, NOT GRAFTED, ba7bdf3f, CM041 #135, test(resolver): the A6 discriminator. TEST-ONLY: one file, identity_resolver/tests/test_batch_resolver.py, 84 insertions and nothing else, and tests/ is in this row's exclude list, so it adds ZERO bytes to the vendored file-set. The ack is structurally honest rather than a judgement call, the same disposition as the test-only commits recorded on the contact_syncer row. || AND WHAT #135 SETTLED, which is worth more than its ack: it is the deciding test v1052-D006 recorded as NOT RUN. RUN HERE AGAINST THE SHIPPING RESOLVER rather than against source, because the two trees diverge and the customer runs the vendored one -- batch_resolver.py digests differ between them, and the EXECUTED module path was asserted to be the vendored file rather than inferred from the working directory. Result: two records sharing one email with different given names land in review, never auto; the positive control (identical name, shared email) still auto-merges, so the decline is not vacuous. GREEN, so by #135's own written decision rule the roughly 30 historical over-merges are ARCHAEOLOGY, not a live resolver defect. That retires the is-it-a-live-code-defect half of A6. Repairing damage already written to real contact data remains an OPERATOR decision and is not a cut decision. || SCOPE: covers exactly these SIX shas. Any later commit touching identity_resolver/ is not covered and this row must go red again; the gate subtracts listed shas only."
  shipping_bugfixes_grafted = true
exclude          = ["tests/", "__pycache__/", "*.egg-info/"]
verify           = "full"
note             = "2026-07-15: re-synced to CM041 main 11ad1246 (v1.0.9: multiuser compartment groundwork #99 incl. new compartment.py, PII sweeps #85/#102, tidy.py). KEEP-BOTH graft in resolver.py + batch_resolver.py: the twin's #660 safety net (stats/degraded, _resolve_tiers error boundary), _identifier_match_trustworthy guard, always-on lazy _fuzzy_candidates index (two-flat-queries loader) + register_person, and the converge() fixpoint pass ALL coexist with upstream's compartment binding, merge_on_resolve RULE-1 collapse, reconcile_qdrant sweep and bulk() API. Upstream's opt-in _fuzzy_snapshot store was unified onto the twin's single _fuzzy_candidates store: begin_bulk/end_bulk pre-load/drop it and _register_in_snapshot delegates to register_person, so both APIs feed one index. Captured in the patch."

[[tree]]
name             = "cm041/meeting_syncer"
vendor_path      = "vendor/cm041/meeting_syncer"
source_repo      = "$CM041"
source_path      = "meeting_syncer"
pinned_sha       = "b6ae1f91771f951a4a2cf3b96ce71e4bdd14cc1a"
  divergence_patch = ""
