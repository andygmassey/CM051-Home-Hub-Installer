note             = "2026-09-02 v1.0.60: THE RENAME IS RESOLVED AND THE ACK IS RETIRED. The old row held verify=skip + verify_exempt + unverifiable_ack for a STRUCTURAL REMAP the schema could not express: upstream's package is ostler_knowledge/, the vendored tree carried the same code as src/, and source_path could name one or the other but never both. That was accurate and it was DECLARED -- nothing was hidden. What it was NOT was time-bounded: the owner field read 'ORM', a ROLE, the note said 'FILED for the CM024 owner / next cut', and every cut from 2026-07-19 to 2026-09-02 read that and moved on. Six weeks, during which install.sh ADVERTISED an Apple Notes step that could never land a note, because the adapter lives upstream and the vendored copy predates the rename. Andy, 2026-09-02: 'I don't know where you're getting that Apple Notes shouldn't be included - it SHOULD.' The 'deliberately ABSENT' comment in install.sh was an AGENT's product-scope call written into the shipping tree in the voice of policy; it was never his decision. THE FIX IS A RE-VENDOR, NOT A REMAP FIELD. The tree is now taken from the repo ROOT (source_path '.') at 1fabd75 -- origin/main, which carries apple_notes.py AND PR #17's evernote_guid stable-id contract fix. NOT 7ace7672, which the old note named: that commit PREDATES #17 and would have shipped the adapter with the broken ID contract. Method was a THREE-WAY MERGE (base=upstream@43d6c5da, ours=the vendored file with the rename normalised away, theirs=upstream@1fabd75), so the merge keeps our grafts, takes upstream's drift, and REPORTS conflicts instead of silently picking a side. FIVE GRAFTS CARRIED, each measured file-by-file against upstream@pin rather than assumed, because a blind re-pin deletes what it was never told about -- ostler_fda lost 230 lines exactly that way and the sync exited 0: (1) the L3 privacy gate, _note_passes_privacy_gate + --max-compartment-level, which keeps private notes OUT of the searchable Qdrant collection; (2) and (3) the Ollama yield in ingestion/classifier.py and knowledge/email_summarizer.py -- resolved num_ctx via OSTLER_ENRICH_NUM_CTX plus wait_until_user_idle, NOT the hardcoded 32768 that would ask a 16 GB Mac for 4x its tier budget; (4) ollama_user_active.py, vendor-only, which both of those import; (5) the Notion/Obsidian STRIP in ingestion/adapters/__init__.py, PRESERVED not reversed -- their imports are absent from the merged header so registering them would ImportError on the customer's box. Landing them is task #232 with its own installer wiring and is NOT smuggled in here. TWO GRAFTS RETIRED BY THE RE-PIN, verified rather than assumed: the legacy-hostname scrub in config/settings.yaml and README.md is now UPSTREAM (7ace767), measured by diffing vendor against target and finding the settings delta empty; and every 'src.' string was an artefact of the rename itself, so vendoring natively removes them rather than carrying them. GOOD NEWS FOUND WHILE READING THE CONFLICTS: upstream has ALREADY absorbed the privacy gate, so two of three conflicts were parameter ORDER and a blank line. THE PARSE CHECK EARNED ITS PLACE IMMEDIATELY, and this is the transferable lesson: both sides added max_compartment_level at DIFFERENT positions, so the hunks never overlapped, merge-file reported NO conflict, and the result was a SyntaxError ('keyword argument repeated') that all eight content invariants happily reported 'ok' on. A three-way merge is TEXTUAL; only the parser is SEMANTIC. Grepping for a symbol proves the symbol is present, never that the file still loads. 27 files parse, 0 failures. verify flips skip -> full and the ack fields are DELETED rather than re-worded, because the blocker they described no longer exists. || 2026-07-19 (v1.0.9 recut): hand-grafted the customer-facing part of GitHub #14 (legacy-hostname scrub) into vendor/cm024_knowledge/config/settings.yaml + README.md -- ollama_host from a legacy personal-infra hostname -> localhost:11434 (env-overridable). This removed a shipped personal-infra hostname leak (CLAUDE.md forbids legacy infra in customer surface). pinned_sha HELD at 43d6c5da: the FULL re-pin to #14 head 7ace7672 is DEFERRED -- 7ace7672 also carries a substantial package re-vendor across the rename (NEW ingestion adapters apple_notes.py/notion.py/obsidian.py + coordinated drift in cli.py source= threading, classifier/enex_parser/importance_scorer/incremental/markdown_writer/adapters base+__init__) that needs a careful cross-rename graft + runtime verification, not a blind cut-window graft. FILED for the CM024 owner / next cut."

# ---- Conversation-feed bundles -------------------------------------------
# email_source / imessage_source / whatsapp_source / spoken_source.
#
# RE-ADDRESSED 2026-08-15. These four sat as verify=skip behind one shared
# sentence: "Upstream HR015 source dir not on disk (removed/relocated since
# af4ae65). WARN until recovered." Nobody had tested it. It is wrong, and it
# was wrong in the direction that costs the most: it described a LOST source,
# which reads as unrecoverable, when in fact all four sources are on this disk
# and were simply being asked for by the wrong name.
#
# WHAT WAS ACTUALLY MEASURED, per tree, rather than inherited:
#
#  1. THE NAMES NEVER EXISTED. source_repo said "$HR015/email-source" and its
#     three siblings, with HYPHENS. HR015 has never carried a path under any of
#     those four names, at any commit, on any ref. The real directories are
#     UNDERSCORED (email_source, whatsapp_source, spoken_source), so
#     resolve_source_repo pointed at a directory that could not exist and
#     vlib_materialise returned 2 forever. Nothing was removed; the address was
#     never right.
#
#  2. THREE OF THEM LIVE ON UNMERGED HR015 BRANCHES, WHICH IS WHY THEY ARE NOT
#     ON MAIN. Measured with git log --all plus the GitHub branch list:
#       email_source     origin/feat/4-artefact-email-source     @ 5d31073
#       whatsapp_source  origin/feat/4-artefact-whatsapp-source  @ af4ae65
#       spoken_source    origin/feat/4-artefact-spoken-source    @ d06d80e
#     "Absent from main" was read as "deleted from main". It is neither: the
#     three feature branches never landed. af4ae65 is the tip of the WhatsApp
#     branch, and the old manifest had copied that one sha onto all four trees,
#     so three of the four pins named a commit that does not contain the tree
#     it claims to pin. A pin that resolves but does not carry the tree is worse
#     than no pin, because it looks checked.
#
#  3. imessage_source IS NOT AN HR015 TREE AT ALL. It has no path in any HR015
#     clone, on any ref, and there is no feat/4-artefact-imessage-source branch
#     on GitHub. Its real home is andygmassey/conversation-memory (CM040) at
#     services/imessage_source, commit 62a776a on
#     origin/feat/4-artefact-imessage-first. tests/test_conversations_ingest_
#     wiring.sh had the attribution right in a comment ("<- HR015 (CM040)") the
#     whole time; the manifest had taken the HR015 half and dropped the CM040
#     half, which is the half that is true.
#
# THE FILE-SET AGREES, which is the check that makes this more than a plausible
# story: for every one of the four, source@pin and the vendored tree have ZERO
# vendor-only and ZERO source-only files once the manifest excludes are applied.
# A wrong guess at an upstream does not produce an exact file-set match.
#
# The remaining delta is CM051-side deploy grafts, the same class already
# recorded for email_ingest and imessage_bridge: the OSTLER_ASSISTANT_BINARY
# ingest-reroute in each plist (so the tick inherits Full Disk Access from the
# signed daemon), the v1.0.3 interactive-chat yield plus adaptive resource
# governor in each tick script, and the v1018-D020 bounded pwg-convo dispatch in
# each pipeline.py. Those are now RECORDED in a divergence patch per tree
# instead of being invisible, so verify=full reconstructs each tree from
# source@pin + patch and any FUTURE drift is caught.
#
# verify_exempt STAYS TRUE ON ALL FOUR, and it is not the same statement as
# verify=full. The two gates ask different questions. This manifest's content
# gate asks "does the vendored tree reconstruct from the pin", which is now
# answerable. verify_cut_freshness.sh asks "is the pin behind the live GitHub
# HEAD for this path", which is NOT answerable for a pin that lives on an
# unmerged branch (or, for imessage_source, in a different repo from the one
# $HR015 names). Exempt-from-live-HEAD and content-verified are compatible, and
# saying both is more honest than either alone.

