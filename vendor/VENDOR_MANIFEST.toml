  regenerate_forbidden_reason = "Regeneration EXPORTS PERSONAL DATA from private CM041 into this public repo, and no scanner in this repo can detect it. Measured 2026-08-15 through the tool's own materialiser, with the source checkout detached at this exact pin: the delta is 430 plus / 53 minus lines, and the MINUS side -- which is the SOURCE side -- carries two person-name-shaped tokens. Per CM041 #725's own commit message one of that pair is an advisor's given name, i.e. a real person. The tool's PII scan returns a clean ZERO on that same 483-line corpus with its positive control firing, because .githooks/pii_patterns.sh HAS NO COVERAGE FOR A BARE NAME IN PROSE: the instrument and the defect are on different surfaces, so the scan is not wrong, it is blind. BE PRECISE ABOUT THE GAP. An earlier wording here said the library carries five NUMERIC shapes and no person-name shape. THAT WAS AN OVER-CLAIM, corrected 2026-08-27 by mutation test (board #528). The library declares 7 built-ins and holds 7 (declared=7, in_source=7, loaded=7, floor OK): five numeric shapes, ONE email-address pattern and ONE /Users/ home-path pattern, so TWO of the seven DO carry person-identifying tokens. The true gap is narrower and still damning: a person is caught ONLY when their name is embedded in a STRUCTURED token, a home path or an email address. Loose in a comment, a string literal or a return value, it is invisible. AND THE SUBJECT IS EXACTLY THAT SHAPE, measured 2026-08-27 by running the real library against the real lines rather than by re-reading the patterns: the two tokens sit as BARE QUOTED NAMES IN PROSE inside a Python hash comment, a worked example of a first-name collision in fuzzy matching. They are NOT inside a /Users/ path and NOT an email local-part, which is the case that would have changed the picture. Scanned with four controls, denominator 7 patterns: SSN REPORTED, a synthetic name inside /Users/ REPORTED, a synthetic name as an email local-part REPORTED, PII-free prose SILENT, and THE SUBJECT SILENT. So the existing patterns provably cannot see it and the ban is confirmed rather than merely asserted. DO NOT propose a capitalisation regex as the fix: the scanner matches case-insensitively (grep -oiE), so a two-capitalised-words shape fires on all-lowercase prose and would be a false-positive engine, not a guard. DO NOT rely on the advance guard to hold this line either. It refuses only while the operator's CM041 resolves AHEAD of the pin; a fresh clone checked out at the pin, or a clone predating the four hold_ack_shas, discharges it and the run then returns 0 and offers to write. Two 'canonical' exports were already measured wrong for that limb on 2026-08-15, one of them four commits behind origin/main, which for this tree is exactly the discharging state. THE ONLY EXIT is upstream: scrub the two lines in CM041 syncer.py and advance this pin past it, which means adjudicating the settling-producer hold recorded in hold_ack_reason. Until then this tree stays RED, and RED is correct. Retire this ban only together with that re-pin. RE-MEASURED 2026-08-27 against CM041 origin/main 507deebc and THE BAN STILL STANDS: the two tokens are byte-identical to source@f83d5aee, positive control firing. NOTE THE NEAR MISS, because it is the trap the next reader will hit: CM041 #84 (e79a17e121c2) rewrote 42 print( calls in this very file and did not touch the pair. UPSTREAM TRAFFIC THROUGH syncer.py IS NOT EVIDENCE THE SCRUB HAPPENED -- compare the tokens, never the file mtime, the commit subject, or the fact that someone has clearly been editing it."
  hold_ack_shas            = "58f53a153c7ac7b93731a8a3522415cef2891fd3 9fe8063b144058a671d04d0645499bbc008040fd c51e75a8eb84ab2069ea79b37cb657f29e61a014 cffd84166fdb7f14ad1f9e017bff5225b5eb8ea2 402cf9aa91f315acf7cebd9ae190326dc4d11184 b6ae1f91771f951a4a2cf3b96ce71e4bdd14cc1a e79a17e121c2a772628ced2b02f037b361d50a6c"
  hold_ack_reason          = "ADDS e79a17e121c2, CM041 #84, chore(contact_syncer): route syncer.py diagnostics through the module logger. HELD, NOT GRAFTED, and shipping_bugfixes_grafted STAYS TRUE because there is no bugfix in it to graft. Measured 2026-08-27 by CLASSIFYING EVERY CHANGED LINE rather than by trusting the commit message: the diff is 51 minus / 89 plus over contact_syncer/syncer.py alone, and the minus side is 42 print( calls plus 5 string continuations plus 2 import/logging lines plus 2 comments, i.e. ZERO data-path lines. The plus side is 42 logger.info/warning/error/debug calls, their lazy-logging argument continuations, and one logging.basicConfig in main(). CONTROL ON THE ARITHMETIC: the bare-print( count in syncer.py goes 43 at the pin to 1 at HEAD, and the single survivor is print(json.dumps(result ...)), the machine-readable CLI contract that install.sh hydrate_graph consumes through jq. So the one print that MUST NOT move did not move, and the 42 that moved change no customer-visible behaviour. Nothing here reaches a customer that the vendored tree lacks. || AND THE MEASUREMENT THAT MATTERS MORE, because this commit LOOKS like the exit and is not: e79a17e1 is the FIRST upstream commit since this pin to touch syncer.py, the exact file whose two person-name-shaped tokens are the whole reason regenerate_forbidden exists, AND IT WALKED STRAIGHT PAST THEM. Re-measured at CM041 origin/main 507deebc on 2026-08-27: the two tokens are BYTE-IDENTICAL to source@f83d5aee (compared by digest, values never printed), with a positive control proving the probe can see a difference at all, since the vendored copy scrubbed by CM051 #725 extracts a different pair. No hunk in e79a17e1 overlaps that region: its nearest hunk headers are -362 and -778 while the comment sits at 736. So the exit condition in regenerate_forbidden_reason is STILL UNMET, this pin still must not advance, and THE CONTENT LIMB OF verify_vendor_fresh.sh IS STILL CORRECTLY RED. This ack clears the LIVE-HEAD FRESHNESS row only. It is the maintenance cost of the PII determination, not a softening of it: every future upstream commit must be acked here for exactly as long as the pin is frozen. || ADDS b6ae1f91, CM041 #124, fix(namespace): move every pwg-branded identifier onto a domain we own. THE ACK IS HONEST HERE RATHER THAN CONVENIENT, and shipping_bugfixes_grafted STAYS TRUE, because the vendored tree ALREADY HAS the whole of what #124 does. Measured 2026-08-21 with a positive control both ways. (1) #124 IS 100% NAMESPACE AND NOTHING ELSE: over contact_syncer/ it changes 218 lines excluding file headers, and 218 of 218 carry a namespace token once the predicate includes urn:ostler -- an earlier count said 176 lines had no namespace token and THAT verdict was discarded, because the predicate had omitted the new URN stem and was measuring its own blind spot. (2) THE VENDORED COPY IS ALREADY MIGRATED: legacy stem 0, new stem 78, against a positive control of 208 for `def `. (3) AND IT MATCHES SOURCE EXACTLY ON THE VENDORED FILE-SET: source@b6ae1f9 contact_syncer/ excluding tests/ has 78 new-stem occurrences and the vendored copy has 78 -- the same number on the nose, and the same reconciliation holds for ostler_hygiene 27/27, identity_resolver 10/10 and meeting_syncer 23/23, so the gap between the raw source count (109) and the vendored count is EXACTLY the excluded tests/ and not a missing graft. (4) CONTROL THAT THE PROBE CAN SEE A DIFFERENCE AT ALL: the same probe at #124^ reports legacy 109 / new 0, so it is not blind to the pre-migration state. So re-pinning would take zero new bytes and the ack asserts something true. A RE-VENDOR REMAINS IMPOSSIBLE BY CONSTRUCTION ANYWAY: regenerate_forbidden = true stands for the PII reason above, unchanged by any of this. AND THE DENOMINATOR: check-freshness reports +27 for this row; the real path-scoped delta is 6, of which five were already acked and b6ae1f91 is the sixth. The gate enumerates REPO-WIDE for every