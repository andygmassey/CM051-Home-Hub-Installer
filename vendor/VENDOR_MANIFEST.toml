# VENDOR_MANIFEST.toml -- the source of truth for vendor freshness.
# ================================================================
#
# The Ostler DMG ships VENDORED copies of upstream source trees. A bug fixed
# in a source repo does NOT reach the customer until it is grafted into the
# matching vendor/ tree. This manifest pins, per vendored tree, exactly which
# source commit the vendor was last grafted from, plus a checked-in patch
# capturing the legitimate vendor-side divergence (en-dash house style, extra
# imports, vendor-only files). scripts/verify_vendor_fresh.sh enforces it;
# scripts/sync_vendor.sh updates it.
#
# Schema (flat, no nested tables -- a tiny dependency-free reader parses it):
#   [[tree]]
#   name            = "cm041/contact_syncer"   # logical id + path under vendor/divergences
#   vendor_path     = "vendor/cm041/contact_syncer"
#   source_repo     = "$CM041"  or an absolute path  (env placeholders expand)
#   source_path     = "contact_syncer"          # subpath within the source repo ("." = root)
#   pinned_sha      = "<full sha>"  |  "WORKING_TREE" (non-git source, e.g. CM019)
#   divergence_patch= "vendor/divergences/<id>.patch"   # "" if byte-identical
#   exclude         = ["tests/", "__pycache__/"]        # source paths NOT vendored
#   verify          = "full" | "skip"           # verify_vendor_fresh.sh content check
#   note            = "free text"
#
# CONTENT-GATE ACKNOWLEDGEMENT FIELDS (scripts/verify_vendor_fresh.sh).
# A tree the CONTENT gate cannot check -- source repo not on this disk, sha not
# present, or verify = "skip" -- is UNVERIFIABLE, and unverifiable is RED. That
# is deliberate and is not being softened. But "nobody has looked" and "somebody
# looked, measured the blocker, wrote it down and owns it" are different states,
# and before these fields existed the gate had one word for both, so the only
# way past either was VENDOR_FRESH_STRICT=0, which drops strictness for EVERY
# tree at once:
#   unverifiable_ack        = true              # this tree is KNOWN-unverifiable
#   unverifiable_ack_reason = "the MEASURED blocker" #  REQUIRED. Say what was
#                                               #  measured and how to retire it,
#                                               #  not what it is. Ack without a
#                                               #  reason = RED, naming the tree.
#   unverifiable_ack_owner  = "who retires it"  #  REQUIRED, same rule.
# An ack applies ONLY where the gate was already going to say "unverifiable". A
# tree that DRIFTED, or whose source ADVANCED past the pin, still FAILS with an
# ack in place -- an ack can never silence a verdict that was actually reached.
# The acknowledged count is printed in the denominator line AND in the verdict,
# which never reads as a plain GREEN while any ack is live. An ack is a debt
# with a name on it. Retire them; do not inherit them.
#
# WHICH VERDICTS FROM verify_vendor_fresh.sh ARE PORTABLE, AND WHICH ARE NOT.
# The gate has two limbs and they do NOT travel the same way. Read this before
# quoting a count from one operator's run as a fact about the repo.
#
#   CONTENT limb  -- reconstructs source@pinned_sha + divergence_patch and
#                    diffs it against the vendored tree. pinned_sha is a FIXED
#                    COMMIT, so any checkout holding that commit produces
#                    identical content and an identical verdict. PORTABLE:
#                    a DIFFERS here means the same thing on every machine.
#
#   ADVANCE limb  -- asks whether the source has commits past pinned_sha, by
#                    reading HEAD of whatever checkout source_repo resolves to.
#                    NOT PORTABLE. It measures the operator's working copy, so
#                    a stale clone, a detached HEAD, or a feature branch each
#                    give a different answer for the same repo. Measured
#                    2026-08-15: two published "canonical" exports were wrong
#                    for this limb -- one 4 commits behind origin/main, one on
#                    a feature branch -- so a tree was judged against a source
#                    older than its own pin.
#
# AND THE DENOMINATOR ITSELF VARIES. source_repo values here are env
# placeholders ($CM041 and friends). Nothing in this repo assigns them, so the
# set of trees that can be verified at all is a function of undeclared operator
# environment: two operators get two counts and CI gets zero. A run reporting
# "N fresh" is only a statement about the trees THAT operator could resolve.
# Always quote the unverifiable count alongside it.
#
# REGENERATION BAN FIELDS (scripts/regenerate_divergence_patch.sh).
#   regenerate_forbidden        = true          # this tree may NEVER have its
#                                               #   divergence patch regenerated
#   regenerate_forbidden_reason = "why"         # REQUIRED. A ban with no reason
#                                               #   still refuses, and says the
#                                               #   declaration is malformed.
# Checked BEFORE the source repo, the pin or any env placeholder is consulted,
# so the ban cannot be cleared by re-pointing a placeholder or moving a
# checkout. That ordering is the whole point: the guards that DO depend on the
# environment are exactly the ones that fail open when the environment shifts.
# Measured 2026-08-15 on cm041/contact_syncer -- with the source checkout ahead
# of the pin the advance guard refuses, but with a checkout sitting EXACTLY at
# the pin that guard is discharged and the tool returns 0 and offers to write a
# patch whose minus side carries person-name-shaped tokens. The PII scan does
# not catch it because its patterns are numeric-only and a name is not a number.
# Use this field whenever a tree must not be regenerated for a reason the
# scanners cannot themselves detect.
#
# LIVE-HEAD FRESHNESS GATE FIELDS (scripts/verify_cut_freshness.sh).
# The freshness gate compares every FETCHABLE pin to its live GitHub HEAD. It does
# NOT key off `verify` (that field drives the content-diff gate). Two -- and only
# two -- ways a tree may be anything other than fresh, both auditable, never a
# silent WARN:
#   verify_exempt   = true                      # opt a GENUINELY unverifiable
#   exempt_reason   = "why it cannot be checked" #   source out (no git / no live
#                                                #   GitHub HEAD). REASON REQUIRED --
#                                                #   exempt without a reason = RED.
#   hold_ack_shas   = "<sha> <sha> ..."         # DELIBERATE HOLD ledger: a pin may
#   hold_ack_reason = "why the pin is held"     #   sit behind HEAD only if EVERY
#   shipping_bugfixes_grafted = true            #   commit in the live path-scoped
#                                                #   delta (pin..HEAD) is listed here
#                                                #   AND the bugfixes among them are
#                                                #   grafted (asserted true). Any
#                                                #   delta commit NOT listed = RED,
#                                                #   naming it. This is what catches
#                                                #   a source-fixed-but-un-grafted
#                                                #   bug (e.g. HR015 7f7710f).
#
# Source repo paths are overridable for operators/CI:
#   - per tree:  VENDOR_SRC_CM041_CONTACT_SYNCER=/path
#   - per base:  export CM041=/path  (the $CM041 placeholder below expands)
#
# THE PLACEHOLDERS ARE ASSIGNED NOWHERE IN THIS REPO and there is no remote-URL
# fallback, so an unset one expands to empty, the tree is UNVERIFIABLE, and the
# gate goes RED. That is fail-closed and correct, but it means the operator env
# is load-bearing. The full set, with the checkout each one wanted when this was
# last measured (2026-08-15):
#   CM019  ~/Developer/CM019-Personal-World-Graph   (andygmassey/personal-world-graph)
#   CM021  ~/Developer/cm021-canon
#   CM024  ~/Developer/cm024-canon                  (andygmassey/evernote-knowledge)
#   CM040  ~/Developer/conversation-memory          (andygmassey/conversation-memory)
#   CM041  ~/Developer/cm041-canon
#   CM048  ~/Developer/cm048-canon
#   CM052  NOT ON THIS DISK outside iCloud; see that tree's unverifiable_ack
#   CM059  ~/Developer/cm059-canon
#   HR015  ~/Developer/HR015-Gaming-PC
# CM040 is new as of 2026-08-15: imessage_source was addressed to HR015, which
# has never carried it. See the conversation-feed block comment further down.
#
# Pinned SHAs captured 2026-06-16 from the local source checkouts:
#   CM041  5b93782   CM048  659d6639   CM021  0d73344f
#   CM024  43d6c5da   HR015  1bb0a0db   CM019  (not a git repo)
# v1.0.0 cut re-pin (2026-06-16): CM041 8b3135cc -> 5b93782 (post-merge head of
#   #46 people_list/reconverge + #47 displayName + #48 junk-data + #49 observed_at);
#   ostler_fda 1bb0a0db -> a15d82f (post-merge head of #191 FDA createdAt). The other
#   HR015 trees stay at 1bb0a0db (their source paths are unchanged across that range).

# ---- CM041 (PWG People Graph) sub-trees ----------------------------------

