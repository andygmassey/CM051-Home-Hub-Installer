nonymises ONE line at assistant_api/ical-server.py:2165 -- an RDF example subject inside a 33-line explanatory comment that used a real family member's given name. The vendored copy was ALREADY scrubbed (CM051 ab2b6d4, #671), so that one line was the whole residual divergence for this tree, and it was a divergence that could not be WRITTEN DOWN: a divergence patch's MINUS lines are the SOURCE side, so recording it would have put the real given name into this PUBLIC repo. Landing the scrub upstream converges both sides and RETIRES the entry instead of recording it. Same play as vendor/ostler_fda (HR015 #369 then CM051 #708). The re-pin asserts EXACTLY ONE commit, verified by two-dot tree diff `git diff --stat caa53bf6 5828aadb -- assistant_api/` = 1 file changed, 1 insertion, 1 deletion; zero customer-affecting behaviour, proven by ast.dump() equality across the edit (28448 nodes / 616931 chars both sides) with two positive controls showing the comparison is not vacuous, plus the full CM041 CI suite at 1079 passed before and after. Content proof of the convergence, not ancestry: sha256(upstream@5828aadb + this patch) == sha256(vendor/cm041/assistant_api/ical-server.py) == 28338de79c5e76b372fb2f9e262e7cf8ec7ae5a1957ee0096cb82814227d0be2. NOTE the existing patch still applies unchanged (line 2165 falls between hunks) and was NOT regenerated. Vendor-only subscription_gate.py is untouched and remains the tree's only residual divergence, still unrecorded, now PII-free and therefore recordable on its own merits."

