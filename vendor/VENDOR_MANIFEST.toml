ON_NAMES_REVIEWED.tsv does not exist yet, so NOTHING has cleared it, and blessing it would convert an open question into a permanently recorded divergence that no future gate ever asks about again. Adjudicate via the sweep and the reviewed-names registry FIRST. Do NOT re-sync to clear it either: a re-sync deletes the vendored side, which is where scrubs live. THIS IS THE WHOLE REASON. It is the only one that still stands, and the correction is recorded rather than quietly dropped: a second reason was written here first, and the gate has since outgrown it. At be7802f the gate reported this tree red on BOTH limbs, DIFFERS *and* 'source has advanced past pinned_sha' for four commits, and it emitted OK only when both were clean -- so a regeneration would have written, failed its own post-write proof and reverted, whatever the PII answer was. verify_vendor_fresh.sh now honours hold_ack_shas, so RE-MEASURED at origin/main 780d34a the advance limb is discharged and this tree is red on the CONTENT limb alone. Recording it because the reasoning is still useful and because a note that silently drops a reason teaches the next reader to distrust the ones that remain: the refusal never rested on that limb, and does not now. || Legit divergence: identity_resolver.normalise import (incl. normalise_phone) + BW-1 phone-normalisation graft + en-dash house style. 2026-07-15: re-synced to CM041 main 11ad1246 (v1.0.9 fixes: calendar owner attribution #96, backfill-at-startup wiring #100, PII sweeps #85/#86/#102). 3-way graft (base = old pin ba59711) preserved the twin-local register_person call sites; linkedin_messages keeps ONE snapshot registration (register_person) where upstream added a parallel _register_in_snapshot call for the same insert."

