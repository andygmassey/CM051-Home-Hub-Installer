  regenerate_forbidden_reason = "Regeneration EXPORTS PERSONAL DATA from private CM041 into this public repo, and no scanner in this repo can detect it. Measured 2026-08-15 through the tool's own materialiser, with the source checkout detached at this exact pin: the delta is 430 plus / 53 minus lines, and the MINUS side -- which is the SOURCE side -- carries two person-name-shaped tokens. Per CM041 #725's own commit message one of that pair is an advisor's given name, i.e. a real person. The tool's PII scan returns a clean ZERO on that same 483-line corpus with its positive control firing, because .githooks/pii_patterns.sh carries five NUMERIC shapes and no person-name shape: the instrument and the defect are on different surfaces, so the scan is not wrong, it is blind. DO NOT rely on the advance guard to hold this line either. It refuses only while the operator's CM041 resolves AHEAD of the pin; a fresh clone checked out at the pin, or a clone predating the four hold_ack_shas, discharges it and the run then returns 0 and offers to write. Two 'canonical' exports were already measured wrong for that limb on 2026-08-15, one of them four commits behind origin/main, which for this tree is exactly the discharging state. THE ONLY EXIT is upstream: scrub the two lines in CM041 syncer.py and advance this pin past it, which means adjudicating the settling-producer hold recorded in hold_ack_reason. Until then this tree stays RED, and RED is correct. Retire this ban only together with that re-pin. RE-MEASURED 2026-08-27 against CM041 origin/main 507deebc and THE BAN STILL STANDS: the two tokens are byte-identical to source@f83d5aee, positive control firing. NOTE THE NEAR MISS, because it is the trap the next reader will hit: CM041 #84 (e79a17e121c2) rewrote 42 print( calls in this very file and did not touch the pair. UPSTREAM TRAFFIC THROUGH syncer.py IS NOT EVIDENCE THE SCRUB HAPPENED -- compare the tokens, never the file mtime, the commit subject, or the fact that someone has clearly been editing it."
  hold_ack_shas            = "58f53a153c7ac7b93731a8a3522415cef2891fd3 9fe8063b144058a671d04d0645499bbc008040fd c51e75a8eb84ab2069ea79b37cb657f29e61a014 cffd84166fdb7f14ad1f9e017bff5225b5eb8ea2 402cf9aa91f315acf7cebd9ae190326dc4d11184 b6ae1f91771f951a4a2cf3b96ce71e4bdd14cc1a e79a17e121c2a772628ced2b02f037b361d50a6c"
  hold_ack_reason          = "ADDS e79a17e121c2, CM041 #84, chore(contact_syncer): route syncer.py diagnostics through the module logger. HELD, NOT GRAFTED, and shipping_bugfixes_grafted STAYS TRUE because there is no bugfix in it to graft. Measured 2026-08-27 by CLASSIFYING EVERY CHANGED LINE rather than by trusting the commit message: the diff is 51 minus / 89 plus over contact_syncer/syncer.py alone, and the minus side is 42 print( calls plus 5 string continuations plus 2 import/logging lines plus 2 comments, i.e. ZERO data-path lines. The plus side is 42 logger.info/warning/error/debug calls, their lazy-logging argument continuations, and one logging.basicConfig in main(). CONTROL ON THE ARITHMETIC: the bare-print( count in syncer.py goes 43 at the pin to 1 at HEAD, and the single survivor is print(json.dumps(result ...)), the machine-readable CLI contract that install.sh hydrate_graph consumes through jq. So the one print that MUST NOT move did not move, and the 42 that moved change no customer-visible behaviour. Nothing here reaches a customer that the vendored tree lacks. || AND THE MEASUREMENT THAT MATTERS MORE, because this commit LOOKS like the exit and is not: e79a17e1 is the FIRST upstream commit since this pin to touch syncer.py, the exact file whose two person-name-shaped tokens are the whole reason regenerate_forbidden exists, AND IT WALKED STRAIGHT PAST THEM. Re-measured at CM041 origin/main 507deebc on 2026-08-27: the two tokens are BYTE-IDENTICAL to source@f83d5aee (compared by digest, values never printed), with a positive control proving the probe can see a difference at all, since the vendored copy scrubbed by CM051 #725 extracts a different pair. No hunk in e79a17e1 overlaps that region: its nearest hunk headers are -362 and -778 while the comment sits at 736. So the exit condition in regenerate_forbidden_reason is STILL UNMET, this pin still must not advance, and THE CONTENT LIMB OF verify_vendor_fresh.sh IS STILL CORRECTLY RED. This ack clear