  # for the pin, does not find it, and falls through to DIVERGED -- reported as
  # "the pin is either off the branch history or >100 path-commits behind". It was
  # neither. The pin was on main and an ancestor of HEAD, and the compare API says
  # plainly: status=ahead, ahead_by=4, behind_by=0.
  #
  # So the RED was the instrument failing to enumerate, not a finding about the
  # tree, and no hold_ack could ever have cleared it: the gate cannot match acks
  # against a delta it was unable to list.
  #
  # WHY 9fe8063b IS THE RIGHT PIN AND WHY IT MOVES NOTHING. It is the most recent
  # commit at or before the old pin that actually TOUCHES identity_resolver/, so
  # it is visible to the path-filtered listing (checked against the live API: it
