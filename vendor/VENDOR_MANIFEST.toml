unverifiable_ack_reason = "THE ONLY ONE OF THE EIGHT WITH NO USABLE CHECKOUT ON THIS MACHINE, and the reason is storage, not provenance. There is no CM052 clone anywhere under ~/Developer, so $CM052 expands to empty and the gate reports 'source repo not found ()'. The one checkout that exists is ~/Documents/Projects/CM052 - PWG AI Conversation Ingest (origin andygmassey/CM052) and it DOES carry the pin -- 'git cat-file -e 9cfb615d^{commit}' returns 0 instantly -- but 'git archive' at that pin TIMED OUT at 120s having written only 55 entries. That is the iCloud-eviction shape, not corruption: the pack files are dataless placeholders and every object read faults in over the network. Do NOT delete or repack that checkout on the strength of a slow read. Two further facts worth carrying: the pin is AHEAD of that checkout's HEAD (1ff568b), so it would need a fetch as well as a fault-in; and CM052 is a live private GitHub repo, so this tree is genuinely verifiable, just not from where it currently sits. Retire this ack with: git clone git@github.com:andygmassey/CM052.git ~/Developer/CM052, export CM052, re-run. The tree is already verify=full and should go straight to OK."
note             = "AI-Conversations install leg (task #553 / #613). Vendors exactly the set pinned in CM052 docs/VENDOR_CM051.md (branch cutb/aiconv-vendor-prep): pyproject.toml + src/__init__.py + src/cm052/*.py + src/cm052/adapters/*.py. Console entrypoint pwg-ai-convo = src.cm052.cli:main; MUST be pip-installed NON-editable (editable installs do not expose the src package on every setuptools version). Runtime deps httpx + PyYAML only. install.sh gates the whole leg behind OSTLER_AI_CONVERSATIONS_ENABLED. 2026-07-20 re-pin 1ff568b -> 9cfb615 (current CM052 main HEAD): the earlier pin's recut-caveat said 'the PII source guard should land upstream before the next re-pin' -- it now HAS, as the ONLY delta commit 9cfb615 (test(cm052): add operator-PII regression guard for shipping source, #10). That commit touches tests/ ONLY (tests/test_no_real_names_in_source.py), which is outside the vendored file-set (exclude=tests/), so the 17 vendored product files (pyproject.toml + src/) are BYTE-IDENTICAL at 1ff568b and 9cfb615 -- verified by git blob-hash, no divergence patch. Re-pinned so the pin == live CM052 main HEAD and the freshness gate verifies GREEN (verify=full) rather than lagging by a test-only commit. CM051's operator-pii-scan is clean on this vendor tree. NOTE: CM052 is a live private GitHub repo (andygmassey/CM052) -- NOT unverifiable; no exemption is warranted. PRIVACY-ADJACENT vendor (AI chat transcripts): needs Archie review before merge -- do NOT self-merge."
