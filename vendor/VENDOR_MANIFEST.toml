verify           = "full"
note             = "2026-07-15: re-synced to CM041 main 11ad1246 (v1.0.9: calendar owner+type attribution #96, fail-closed L3 brief reader #97 -- brief.py now imports repo-root pwg_privacy; see the cm041/pwg_privacy tree + install.sh PIPELINE_DIR staging). brief.py adopted from upstream WHOLESALE: the old patch's brief.py 'divergence' was pure staleness (the twin predated upstream's wiki_url/maps_url/todos/render_whatsapp_message enrichment), not deliberate local edits -- zero divergence now. New upstream files SCHEMA.md + decision_extractor.py adopted."

[[tree]]
name             = "cm041/assistant_api"
vendor_path      = "vendor/cm041/assistant_api"
source_repo      = "$CM041"
source_path      = "assistant_api"
  pinned_sha = "9be482d36813f3f17fdcf749ec9c2fdd7f191736"
  divergence_patch = "vendor/divergences/cm041_assistant_api.patch"
  # HOLD RETIRED 2026-08-27 by the re-pin above, not abandoned: the sole ack
  # b6ae1f91 is an ancestor of the new pin 9be482d3, so the pin now CONTAINS
  # what the ack acknowledged. It was never an inert ack -- b6ae1f91 touches
  # 11 of its 81 changed files under assistant_api/. Full adjudication, and
  # why the retired reason was wrong about regeneration, is in note below.
  hold_ack_shas            = ""
  hold_ack_reason          = ""
  shipping_bugfixes_grafted = true
exclude          = ["tests/", "__pycache__/", "*.egg-info/", "test_vendor_import.sh"]
verify           = "full"
note             = "2026-08-27 ADDENDUM (rule #530, a record inherits the refresh policy of the thing it records): the amended rule holds that a divergence patch which FAILS TO APPLY AT THE PIN is CANNOT-VERIFY rather than clean, and demands a DIRECT vendored-vs-upstream diff at the pin. This row qualified, because the patch did not apply at 402cf9aa. Run, and reported rather than summarised. AT THE PIN, excludes applied to both sides: 2 files DIFFER (API.md 48 plus / 134 minus, ical-server.py 445 plus / 56 minus) totalling 683 changed lines; TOOLS.md IDENTICAL; 1 vendor-only file (subscription_gate.py, 261 lines); 0 source-only. THE PATCH RECORDS THE SAME 2 FILES and 611 lines. So the file SETS agree exactly and the LINE counts disagree by 72. THAT DISAGREEMENT IS A BASE MISMATCH, NOT HIDDEN VENDOR-SIDE EDITS, and the discriminator is structural rather than an assurance: a divergence patch IS diff(source@X, vendored), so if genuine unrecorded vendor edits existed, NO X could reconstruct the vendored tree byte-exactly. One does. Applying this patch UNCHANGED to source@b6ae1f91 reproduces the PRE-GRAFT vendored copy BYTE-EXACTLY across all three shared files (API.md 0, ical-server.py 0, TOOLS.md 0 differing). 402cf9aa and 5828aadb refuse the patch outright, and 9be482d3 leaves exactly ONE file differing, ical-server.py, which is precisely the safari-ingest commit this change grafts. So the patch is HEALTHY and its true base is b6ae1f91; the pin was simply never advanced to match it, which is the whole defect. Contrast cm041/contact_syncer, where eleven files are recorded nowhere and no revision reconstructs: that row is the shape rule #530 was written for, and this one is not. THE ONE GENUINELY UNRECORDED ITEM IS subscription_gate.py, 261 vendor-only lines carried by no patch; untouched here, filed rather than fixed. DIRECTION, checked because CM051 can be AHEAD of upstream and a graft would then move the tree BACKWARDS while looking like freshening: this graft is 296 ADDED lines plus exactly ONE replaced line, the startup banner, which goes from 21 to 22 endpoints with NOTHING lost and POST /api/safari/ingest gained (control: the same predicate does report a loss when /health is removed from the new side). The sensitive-domain blocklist was then checked THREE WAYS DIRECTLY rather than by grepping a patch for an absence: upstream ostler_fda@f5875d40, the vendored CM051 copy, and the grafted list are all 43 entries with EMPTY set difference in every direction, so CM051 is not ahead on this surface, nothing was stripped that this re-adds, and a canary control proves the comparison can report a difference. || 2026-08-27 (Archie, v1.0.48 cut freshness): RE-PINNED 402cf9aa -> 9be482d3 AND GRAFTED CM041 #106, feat(ical): POST /api/safari/ingest live-capture handler. Both halves were needed; neither alone was enough. WHY THIS IS A GRAFT AND NOT A HOLD. This repo already ships the CLIENT side of that endpoint and nothing served it. install.sh renders DOCTOR_PROXY_PATHS with /api/safari/ingest as its FIRST comma field (install.sh:17627), vendor/doctor/agent/proxy.py:79 carries it as the sole DEFAULT_PROXY_PATHS entry, and the customer install points DOCTOR_GATEWAY_URL at the ical-server on 127.0.0.1:8090. So on a customer Mac the browser extension POSTs through the Doctor's paired-bearer wall to a route the vendored ical-server did not implement. Measured on the pre-graft file: api_safari_ingest 0 occurrences, /api/safari/ingest 0 occurrences, out of a 7653-line file. vendor/ostler_fda/pwg_ingest.py:1338 says the same thing from the other side, that no gateway implements /api/safari/ingest, which is why the INSTALL-TIME importer writes to Qdrant directly. The install-time path was covered; the LIVE path was a 404 end to end. Holding it would have shipped that 404 again. WHAT THE GRAFT DID AND DID NOT DO. Five hunks applied IN PLACE with git apply, never a copy of the upstream file over the vendored one. The vendored file carries six CM0