verify           = "full"
note             = "2026-08-15: THE DIVERGENCE IS NOW RECORDED, and the sentence further down claiming 'byte-identical ... no divergence patch' is stale as of the 619ef404 pin. divergence_patch was \"\", so the gate reconstructed this tree with no patch at all and reported it DIFFERS on emit_frontpage.py. The vendored copy is CORRECT and is the ONLY copy of this fix that exists anywhere: it moves _read_feed() from BELOW the `if __name__ == \"__main__\":` guard to above emit(). MEASURED at CM059 origin/main, not inferred: _read_feed is CALLED at emit_frontpage.py:255 and DEFINED at :309, with the guard at :305. Imported as a module the whole file executes and the name binds, so every upstream test passes; run as a SCRIPT, which is how the LaunchAgent runs it, Python reaches the guard and calls main() before executing that def, giving NameError on every Front Page tick. The degraded-feed guard preserves the last good feed, so it presents as 'the Front Page never updates' rather than as a crash. Recorded via scripts/regenerate_divergence_patch.sh (dry run read, then --write, whose own post-write gate re-run reported OK). ZERO bytes under vendor/cm059_editor/ changed. The class is now gated: scripts/verify_no_defs_after_main_guard.py is wired into tests/TEST_WIRING.tsv, scripts/run_all_cut_gates.sh and .github/workflows/vendor-integrity.yml, so a re-sync that reverted this would be caught rather than merely regretted. Retire this divergence by landing the move upstream in CM059 and re-pinning. || CM059 The Editor Front Page producer (compiler/ package only; the bin/, launchd/ and INSTALL_SNIPPET.sh siblings under vendor/cm059_editor/ are CM051-authored wrapper files and are intentionally outside vendor_path). 2026-07-20 re-pin 9f23f83 -> 36b5f696 (current CM059 main HEAD): adopts the wanted masonry Front Page render -- cfd30167 (feat: masonry Front Page render, LOCKED CM061 design; rewrites render_frontpage.py from the flat single-column list to per-section masonry) + 36b5f696 (test: masonry render fixture + 16-test render suite, schema v0.2). Both on CM059 main, no operator PII, wanted for v1.0.10. Byte-identical to CM059 main 36b5f696 -- no divergence patch. Producer is stdlib-only, read-only SPARQL against Oxigraph; emits ~/.ostler/editor/front_page.{json,html}. Set VENDOR_SRC_CM059_EDITOR or export CM059=/path to the CM059 checkout for the freshness gate to verify=full; absent source WARNs, never fails."

