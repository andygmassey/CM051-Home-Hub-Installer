hold_ack_reason  = "v1.0.48 (2026-08-28 TNM). ONE feature, HELD, and the sha list is deliberately TWO entries for a reason worth reading before editing it. 🔴 THE HEADLINE AND THE ACTIONABLE LIST DISAGREE ON THIS ROW, so state which one you are quoting: check-freshness prints STALE:+3, but its own un-acknowledged enumeration -- the set it will actually subtract -- names exactly ONE sha, b1bd901dcc1c, because this row declares source_path = 'compiler' and that limb is path-filtered while the headline is not. I was briefed that this row was 2 commits; it is neither 2 nor 3 on the surface that matters. Re-measured rather than accepted. 🔴 AND THE ONE SHA THE GATE NAMES IS A MERGE COMMIT WITH AN EMPTY DIFF: git show --name-status b1bd901d prints nothing, so a reader who classified only the named sha would conclude the delta touches no files and wave it through on an emptiness that is an artefact of merge-commit display, not a fact about the change. The content lives in its parent 168e017d, 'feat(editor): unify Front Page header with the locked Sunrise glyph', which the gate never named. BOTH are listed above: the merge because that is what the gate enumerates today, the parent because that is what actually changes, and because if the enumeration later follows first-parent differently this row must not silently re-red. WHAT IS HELD, MEASURED NOT ASSUMED: 168e017d touches two files, compiler/render_frontpage.py and tests/test_render_frontpage_masonry.py. The test file is outside source_path AND excluded by this row's tests/ glob. The other one IS vendored -- vendor/cm059_editor/compiler/render_frontpage.py exists among this tree's 21 files -- so this delta CANNOT be waved through on a not-vendored argument and I am not making one. Three-way hash read: the vendored copy equals the PIN (619ef404) and differs from 168e017d, so the change is genuinely absent from the shipped tree and a re-pin WOULD alter it. Corroborating control compiler/frontpage.py also reads at-pin, and the subject's own three-way spread -- vendored=pin, new distinct from both -- is what makes the read discriminating rather than a constant. WHY HELD: it is a cosmetic front-page header unification against a locked design glyph. Under the ship-window bar it is not a launch blocker on any limb -- it does not stop a customer installing, pairing, or trusting us -- and it carries no bugfix, so shipping_bugfixes_grafted = true is honest under the 'no bugfix is held' reading rather than under a graft claim. WHAT THE CUSTOMER LOSES: a header that looks like the older Front Page render. Nothing fails. THE COST OF THE ALTERNATIVE: this row is verify = 'full', so a re-pin means regenerating vendor/divergences/cm059_editor.patch, and that patch is the ONLY copy anywhere of the _read_feed()-above-the-main-guard fix recorded in the note below -- the fix without which the Front Page NameErrors on every LaunchAgent tick. Re-pinning to collect a glyph, hours into a held cut, on the one tree whose divergence patch is load-bearing for a real crash fix, is the wrong trade. CARRY FORWARD: land 168e017d in the first cm059 re-pin after v1.0.48 ships and DELETE this row rather than renewing it. SCOPE: covers these two shas only; any later commit under compiler/ reds this row again."
note             = "2026-08-15: THE DIVERGENCE IS NOW RECORDED, and the sentence further down claiming 'byte-identical ... no divergence patch' is stale as of the 619ef404 pin. divergence_patch was \"\", so the gate reconstructed this tree with no patch at all and reported it DIFFERS on emit_frontpage.py. The vendored copy is CORRECT and is the ONLY copy of this fix that exists anywhere: it moves _read_feed() from BELOW the `if __name__ == \"__main__\":` guard to above emit(). MEASURED at CM059 origin/main, not inferred: _read_feed is CALLED at emit_frontpage.py:255 and DEFINED at :309, with the guard at :305. Imported as a module the whole file executes and the name binds, so every upstream test passes; run as a SCRIPT, which is how the LaunchAgent runs it, Python reaches the guard and calls main() before executing that def, giving NameError on every Front Page tick. The degraded-feed guard preserves the last good feed, so it presents as 'the Front Page never updates' rather than as a crash. Recorded via scripts/regenerate_divergence_patch.sh (dry run read, then --write, whose own post-write gate re-run reported OK). ZERO bytes under vendor/cm059_editor/ changed. The class is now gated: scripts/verify_no_defs_after_main_guard.py is wired into tests/TEST_WIRING.tsv, scripts/run_all_cut_gates.sh and .github/workflows/vendor-integrity.yml, so a re-sync that reverted this would be caught rather than merely regretted. Retire this divergence by landing the move upstream in CM059 and re-pinning. || CM059 The Editor Front Page producer (compiler/ package only; the bin/, launchd/ and INSTALL_SNIPPET.sh siblings under vendor/cm059_editor/ are CM051-authored wrapper files and are intentionally outside vendor_path). 2026-07-20 re-pin 9f23f83 -> 36b5f696 (current CM059 main HEAD): adopts the wanted masonry Front Page render -- cfd30167 (feat: masonry Front Page render, LOCKED CM061 design; rewrites render_frontpage.py from the flat single-column list to per-section masonry) + 36b5f696 (test: masonry render fixture + 16-test render suite, schema v0.2). Both on CM059 main, no operator PII, wanted for v1.0.10. Byte-identical to CM059 main 36b5f696 -- no divergence patch. Producer is stdlib-only, read-only SPARQL against Oxigraph; emits ~/.ostler/editor/front_page.{json,html}. Set VENDOR_SRC_CM059_EDITOR or export CM059=/path to the CM059 checkout for the freshness gate to verify=full; absent source WARNs, never fails."

