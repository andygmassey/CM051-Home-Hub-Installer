unverifiable_ack_reason = "CORRECTED 2026-08-27, AND THE ORIGINAL IS KEPT BELOW VERBATIM SO THE CORRECTION IS AUDITABLE RATHER THAN A SILENT SWAP. Two things in the original have moved. (1) It says the pin \"IS origin/main HEAD\". That was true when written and stopped being true: on 2026-08-27 the freshness gate reported 282ebfeb -> f2a305f1 STALE:+53, so both cannot hold. The row is now re-pinned to f2a305f1, which IS live main HEAD as of that measurement -- the clause is not wrong in kind, it is a measurement that aged, and the next one will age too. (2) Its reconciliation numbers were UNDERSTATED and are replaced, not carried forward. RE-MEASURED at the new pin: source holds 459 files against 84 vendored, of which 81 are shared and 3 are vendor-only, and the shared-file diff is 42 of 81 files, 2290 insertions and 630 deletions, plus 3 new-file hunks -- requirements.txt, test_vendor_preferences.sh AND services/enrich/src/eligibility.py, which the original missed entirely while naming only two, and which services/enrich/src/enricher.py imports unconditionally at line 13. At the OLD pin the same measurement gives 49 of 81 differing, 2599 insertions and 655 deletions. METHOD, so the next reader reproduces this instead of trusting it: materialise each vendored path from the source ref, cmp byte-for-byte for the identical count, git diff --no-index --shortstat for the line count, and delete any __pycache__ first -- running the tests against the vendored tree leaves three of them and they inflate the changed-file count, which is exactly how two honest measurements of this row disagree. Retire this ack by scheduling the 42-file reconciliation and recording it as a real divergence_patch, then flipping verify=full. ORIGINAL WORDING FOLLOWS, UNEDITED: NOT a reachability problem, and the note below should not be read as one: pin 282ebfeb resolves in ~/Developer/CM019-Personal-World-Graph and IS origin/main HEAD (it is the merge commit of PWG #288; b11e9ed7, which the note names, is the fix merged INSIDE it). The blocker is the deliberate-subset reconciliation that the note has been deferring since 2026-07-25, now re-measured rather than quoted: materialising the pin gives 454 source files against 83 vendored (the vendored tree is a shipping subset of services/ingest + services/enrich + ontology), and the shared-file diff is 1,686 lines across 15 files including 2 new-file hunks -- requirements.txt, both config.py, ingest filters/pipeline/vectorizer, the qdrant loader, six parsers, and test_vendor_preferences.sh. That reconciliation needs the CM019 owner and is out of cut-window scope; doing it under time pressure is exactly how CM051 #431's regression once shipped labelled 'byte-identical to upstream' when it was not. Retire this ack by scheduling the 15-file reconciliation, then flipping verify=full."
note             = "2026-08-27 v1.0.48 freshness: RE-PIN 282ebfeb -> f2a305f1 (live personal-world-graph main HEAD) after grafting the two shipping fixes this tree actually owed. THE +53 THE GATE PRINTED IS REPO-WIDE BY CONSTRUCTION and is not a measure of what ships: source_path is \".\", so the gate's own detail line reads (pin..HEAD, path ) with an EMPTY path and it enumerates every commit in the repository. Scoped to the 84 files this tree vendors the delta is 7 commits (3 merges + 4 fixes); scoped to the three vendored directories it is 17, the extra 10 being Dependabot bumps to services/*/requirements*.txt, which are NOT vendored -- the vendored requirements.txt is a vendor-only root file. Upstream added exactly 2 files under those directories in the whole delta and both are under services/ingest/tests/, deliberately outside the shipping subset, so the re-pin omits nothing. ADJUDICATION, four fixes: (1) ffa809d and (2) 259aafe, PWG #315/#743 namespace migration -- ALREADY PRESENT vendor-side, applied here ahead of upstream and converging on the same target namespace, so nothing was owed but the check: grep -rF over the vendored tree for the old host returns ZERO, with a must-be-present control (the new host in 10 files) proving both the predicate and that the tree is readable, and preference-shapes.ttl, rml/mapper.py, rml/templates.py, pipeline.py, hierarchy.py and the three .rml.ttl mappings are now byte-identical to source at the new pin. (3) 41e38bc, the non-preference SHAPE gate in PreferenceFilter -- GRAFTED. (4) da1b3db, the CSV email-export guard -- GRAFTED. The remaining 46 delta commits touch no vendored path. BOTH GRAFTS ARE IN-PLACE LINE EDITS, NEVER cp, because this tree carries load-bearing CM051-side divergence that no patch file records (see the FINDING below), and preservation was MEASURED not assumed: after both grafts the only lines source has that the vendored copies lack are the known CM051 divergences -- in filters.py two trailing-comma variants plus the hardened dict(payload.get(extra) or {}) from 710e7cf, itself an ancestor of the OLD pin and so not a missed graft; in csv_parser.py the word-boundary keyword matcher, the DEBUG-not-WARNING fallback log, and the category_inferred provenance -- plus the upstream comment block quoting live-box measurements, which is DELIBERATELY paraphrased rather than copied because CM051 is a public repository and those are founder-instance numbers. BEHAVIOUR proven on the VENDORED modules with discriminating controls, not by grepping for the symbols: the shape gate rejects 6 of 6 synthetic junk shapes and keeps 7 of 7 genuine tastes, and with reject_non_preference_shapes=False all 6 pass again, so the gate is doing the work rather than the fixture; the CSV guard refuses a mail-column file and a 20%-reply file 0 of 30 rows each, drops 1 of 3 in a small mixed file, and passes a clean 30-row CSV 30 of 30 as the control. RATCHETS: tests/test_pref_noise_source_cap.py, tests/test_provenance_survives_the_filter_under_execution.py and tests/test_inferred_category_never_egresses.py were GREEN before and GREEN after; scripts/verify_no_foreign_ontology_namespace.sh still reports occurrences=0; no baseline .tsv names either edited file -- the single cm019 row in tests/pipefail_shortcircuit_baseline.txt is test_vendor_preferences.sh, and that baseline is 65 .sh + 1 .yml with zero .py, so neither file could be in it. shipping_bugfixes_grafted is deliberately LEFT UNSET: its contract is an assertion about commits HELD in hold_ack_shas, and nothing is held here -- the bugfixes were grafted AND the pin advanced, so a true there would describe a hold that does not exist. FINDING, AND IT OUTRANKS THE GRAFT -- READ THE FIELD AS A CLAIM, NOT AS AN ABSENCE. This row's divergence_patch is the empty string, and the manifest header at the top of this file DEFINES that value: 'divergence_patch = \"vendor/divergences/<id>.patch\"  # \"\" if byte-identical'. So the empty string is a POSITIVE ASSERTION that the vendored tree is byte-identical to source at the pin. THAT ASSERTION IS FALSE, and it was false before this change: measured at the OLD pin, 49 of 81 shared files differ (2599 insertions, 655 deletions); measured at the NEW pin, 42 of 81 differ (2290 insertions, 630 deletions); and there are three vendor-only files on top. The divergence is real, deliberate and customer-facing -- the egress provenance in csv_parser.py, the noise cap in filters.py, and services/enrich/src/eligibility.py, which services/enrich/src/enricher.py imports unconditionally at line 13. WHAT IS NOT THE FINDING, so nobody re-files it: verify=skip plus unverifiable_ack=true is DECLARED, reasoned and owned, and only 3 of 24 rows are verify=skip with all three carrying an ack -- the design is intact. The finding is narrower and worse than 'nothing checks this': the row makes a byte-identity claim that is untrue, and because verify=skip no gate will ever contradict it. Two reading traps sit on top of it. First, grepping a divergence patch that does not exist FAILS, and a failed grep reads identically to 'no divergence recorded' -- confirm from this row, never from a missing file. Second, and the more damaging one: a vendored file that differs from upstream is not automatically STALE. On this row the vendor was AHEAD on the namespace migration and is AHEAD on the egress provenance, so check the DIRECTION before grafting; grafting upstream over a vendor-side improvement is this failure in its most damaging form. FIX SHIPPED IN THIS PR FOR THE load-bearing half: services/enrich/src/eligibility.py now has a vendor/VENDOR_ONLY.tsv row, so scripts/sync_vendor.sh restores it after the tree swap and tests/test_vendor_only_survives_sync.sh fails the build if it vanishes. Before that row it was protected by nothing at all -- no patch, no registry entry -- and a sync would have deleted a module that a shipping module imports at import time. AND DO NOT LET A GREEN CI RUN STAND IN FOR ANY OF THIS: measured in this repo, .github/workflows/vendor-integrity.yml line 155 sets VENDOR_FRESH_STRICT to \"0\" and it is the only place the variable is set at all, so verify_vendor_fresh.sh prints DEGRADED rather than RED for an unverified tree and the job goes green having checked nothing about this row's content. NOT FIXED, and it needs the CM019 owner: the byte-identity claim itself. Retire it by recording the 42-file divergence as a real divergence_patch and flipping verify=full. || 2026-07-25 v1.0.10 recut re-pin to b11e9ed7 (PWG #287 Facebook parser fix merged into personal-world-graph main). SURGICAL two-file overwrite from PWG@b11e9ed7: services/ingest/src/parsers/meta.py only (test_meta_parser.py NOT vendored -- deliberate subset). Overwrite REVERTS the CM051 #431 divergence (which routed comments/posts_and_comments to _parse_posts and silently dropped the group-name signal + entirely dropped comments_and_reactions/comments.json + groups/your_comments_in_groups.json) and lands the source-of-truth handler + disambiguator + dedupe. Verified: byte-identical to PWG@b11e9ed7; grep guards PASS (_parse_comments, _extract_comment_subject, SUPPORTED_PATTERNS 'comments' entry all present). Full-sync path DELIBERATELY NOT TAKEN because the 81 non-PII shared-file drifts are out of cut-window scope; a scripts/sync_vendor.sh cm019_preferences full run would tangle with unrelated drift. verify=skip STAYS for this cut; v1.0.11 register: adopt verify=full once the 81-drift reconciliation is scheduled with the CM019 owner (this is what let CM051 #431's regression ship as 'byte-identical to upstream' when it wasn't -- gate class per feedback_gate_can_encode_a_reversed_conclusion). --- Historical 2026-07-20: CM019 is NOW a git repo (andygmassey/personal-world-graph); the old non-git '02 - Code/' layout is gone -- services/ + ontology/ sit at the repo ROOT, so source_repo is $CM019 and source_path '.'. Pinned to live main HEAD 44f1c82, so the freshness gate verifies it against GitHub (verify_exempt removed -- it is no longer genuinely-unverifiable). LIVE operator-PII leak scrubbed: grafted the customer-shipping PII fixes from 44f1c82 (which includes #256 93ceeeb) into the five shipping files that carried operator identifiers -- services/enrich/src/enricher.py (stopword tuple), services/ingest/src/cli.py (usage docstrings -u andy -> -u jane), services/ingest/src/parsers/netflix.py + disney.py (hard-coded ALLOWED_PROFILES=['Andy','The Masseys'] -> env-driven _profiles_from_env(); disney room-name 'massey''s home' -> generic), services/enrich/src/cli.py (default='andy' user-id -> OSTLER_USER_ID env / 'default_user'). grep -riw andy|massey over the vendored tree is now CLEAN. verify=skip: the vendored tree is a DELIBERATE shipping SUBSET (services/ingest + services/enrich + ontology only; docker/, scripts/, cli/, docker-compose*, visualization/, *.md docs are NOT vendored), and a full content reconciliation of the subset against 44f1c82 (81 non-PII shared-file drifts) is out of cut-window scope -- deferred to the CM019 owner / next cut like the CM024 subset. Vendor-only files (requirements.txt, test_vendor_preferences.sh) preserved."

